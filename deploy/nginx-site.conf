# INFRA-01 · nginx vhost pro turistickechaty.cz na Forge (VPS pticore)
# Použití: Forge → Site → Edit Nginx Configuration. Forge si generuje
# vlastní kostru (SSL bloky, FORGE CONFIG značky) — z téhle šablony se
# přebírá OBSAH server bloku: proxy na Next.js daemon + cache statiky.
# Vzor dle oficiálního postupu (site typ „Static HTML / Next.js",
# proxy_pass na lokální port daemonu; každý site na serveru má SVŮJ port —
# na pticore už žije hub.prague-tourism.com, proto NEpoužíváme 3000).
#
# PORT: 3017 (staging dev.turistickechaty.cz) / 3016 (produkce) —
# musí sedět s PORT v .env.local daného situ.

# ── uvnitř server { } bloku, MÍSTO php sekcí ──────────────────────────────

    # Next.js immutable statika — dlouhá cache, bez logů
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # média nahraná do Payloadu (fotky bud) — středně dlouhá cache
    location /media/ {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # zdravotní endpoint pro monitoring (bez logů)
    location = /api/health {
        proxy_pass http://127.0.0.1:3017;
        access_log off;
    }

    # vše ostatní → Next.js daemon
    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # upload fotek přes Payload admin (hero snímky bud) — velkorysý limit
    client_max_body_size 32m;

# ── odstranit z Forge kostry (PHP pozůstatky) ─────────────────────────────
#   try_files $uri $uri/ /index.php?$query_string;
#   location ~ \.php$ { … }
#   error_page 404 /index.php;
