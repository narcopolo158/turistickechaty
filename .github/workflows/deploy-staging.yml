# INFRA-01 · Deploy stagingu (dev.turistickechaty.cz) na VPS pticore
#
# Proč build tady a ne na serveru: pticore má 4 GB RAM (Active24 panel,
# 27. 7. 2026) a build si říká o ~8 GB heap — plán v1.8 pro tenhle případ
# rozhodl „build v GitHub Actions, na server jen artefakt". A protože
# build prerenderuje stránky z databáze (ověřeno 27. 7.: bez DB spadne na
# ECONNREFUSED), jede tu Postgres service + seed z data/chaty/** — git je
# zdroj pravdy, artefakt tedy nese obsah stejný jako serverová DB po
# seedu. Vzor service+seed převzat z ověřeného workflow
# vizualni-kontrola-mapy.yml.
#
# SERVEROVÁ ČÁST (zjištěno z prvního Forge deploy logu 27. 7. 2026):
# nový Forge u nativního typu Next.js nasazuje přes releases/<id> +
# symlink `current` (linkuje env soubor i storage, staré release maže)
# a proces řídí SÁM přes PM2 — app `site-3312291` (jméno = Site ID),
# cluster, user forge. Žádný ruční daemon/supervisor se nezakládá.
# Server tedy jen: v aktuální release git reset na origin/main, npm ci,
# seed, rozbalit .next z artefaktu, `pm2 restart site-3312291`, health.
# POZOR: tlačítko Deploy ve Forge vytvoří NOVOU release bez .next → po
# každém ručním Forge deployi je potřeba spustit tenhle workflow.
#
# SPOUŠTĚNÍ: na push do main (zapnuto 27. 7. 2026 po zeleném běhu #5
# a ověření stagingu zvenku) + ručně přes workflow_dispatch. Čistě
# dokumentační pushe (docs/**, data/kandidati/** — nejsou na webu)
# deploy nespouštějí.
#
# POTŘEBNÉ SECRETS (Settings → Secrets and variables → Actions):
#   PTICORE_SSH_KEY  — privátní OpenSSH klíč; veřejnou půlku přidat na
#                      serveru uživateli forge (Forge UI → server → SSH Keys)
#   PTICORE_HOST     — pticore.a24vps.com
#   PTICORE_PATH     — /home/forge/dev.turistickechaty.cz
# (Dřívější PTICORE_DAEMON odpadl — proces spravuje PM2 pod jménem
#  site-3312291, které je dané Site ID a je zapsané níž v kroku restartu.)
#
# Runtime env čte server z env souboru situ (Forge → Settings →
# Environment; Forge ho linkuje do každé release) — do artefaktu se
# žádná tajemství nebalí.

name: 'INFRA-01: deploy staging (pticore)'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'data/kandidati/**'
      - 'design/**'

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-a-nasazeni:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: heslo
          POSTGRES_DB: turistickechaty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://user:heslo@localhost:5432/turistickechaty
      PAYLOAD_SECRET: ci-deploy-staging-build
      NEXT_PUBLIC_SERVER_URL: https://dev.turistickechaty.cz
      # Klíč Mapy.com pro dlaždice v prohlížeči — NEXT_PUBLIC_* se peče do
      # buildu, proto musí být tady (ne až na serveru). MUSÍ jít o klíč
      # s doménovým omezením (dev.turistickechaty.cz + turistickechaty.cz),
      # NIKDY serverový MAPY_API_KEY z DATA-06 (bez omezení). Bez secretu
      # je hodnota prázdná a mapa se poctivě vůbec nevykreslí (MapaChat).
      NEXT_PUBLIC_MAPY_API_KEY: ${{ secrets.MAPY_WEB_KLIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zavislosti
        run: npm ci --no-audit --no-fund

      - name: Seed obsahu z gitu (data/chaty/**)
        run: npx payload run scripts/seed-chaty.ts

      - name: Build (Next + Payload admin, prerender nad seedem)
        run: npm run build

      - name: Artefakt (.next + public)
        run: tar -czf /tmp/chaty-build.tar.gz .next public

      - name: SSH klic
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PTICORE_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.PTICORE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Nahrat artefakt
        run: |
          scp -i ~/.ssh/id_deploy /tmp/chaty-build.tar.gz \
            "forge@${{ secrets.PTICORE_HOST }}:/tmp/chaty-build.tar.gz"

      - name: Nasadit na serveru (aktualni Forge release)
        run: |
          ssh -i ~/.ssh/id_deploy "forge@${{ secrets.PTICORE_HOST }}" bash -s <<NASAZENI
          set -euo pipefail
          CIL="${{ secrets.PTICORE_PATH }}/current"
          if [ ! -e "\$CIL" ]; then
            CIL=\$(ls -d "${{ secrets.PTICORE_PATH }}"/releases/* | sort | tail -n 1)
          fi
          CIL=\$(readlink -f "\$CIL")
          echo "Nasazuji do release: \$CIL"
          cd "\$CIL"
          git fetch origin main
          git reset --hard origin/main
          npm ci --no-audit --no-fund
          # Env: payload run si Forge env soubor sam nenacte (doloz. 27.7.
          # — SASL "password must be a string") -> nacist explicitne.
          echo "Env soubory v release:"
          ls -la .env* 2>/dev/null || echo "(zadne .env* soubory)"
          ENVSOUBOR=""
          for f in .env .env.local .env.production .env*; do
            [ "\$f" = ".env.example" ] && continue
            if [ -f "\$f" ]; then ENVSOUBOR="\$f"; break; fi
          done
          if [ -n "\$ENVSOUBOR" ]; then
            echo "Nacitam prostredi z \$ENVSOUBOR"
            set -a
            . "./\$ENVSOUBOR" >/dev/null 2>&1 || { echo "!! env soubor se nepodarilo nacist (zvlastni znaky? zabal hodnoty ve Forge editoru do uvozovek)" >&2; exit 1; }
            set +a
          fi
          if [ -z "\${DATABASE_URL:-}" ]; then
            echo "!! DATABASE_URL nedorazila (env soubor chybi, nebo ji neobsahuje) — viz vypis vyse" >&2
            exit 1
          fi
          # Bezpecna diagnostika struktury URL — vypisuje jen delky, nikdy hodnoty.
          echo "radku DATABASE_URL v env souboru: \$(grep -c '^DATABASE_URL=' "\$ENVSOUBOR" || true)"
          node -e "
            const u = new URL(process.env.DATABASE_URL)
            console.log('DATABASE_URL struktura: uzivatel=' + (u.username || 'CHYBI')
              + ' | heslo=' + (u.password ? 'ano, ' + u.password.length + ' znaku' : 'CHYBI!')
              + ' | host=' + u.host + ' | databaze=' + u.pathname)
          " || echo "!! DATABASE_URL nejde rozebrat jako URL (zvlastni znak v hesle? zakoduj ho, nebo zvol heslo jen z pismen a cisel)" >&2
          PAYLOAD_DB_PUSH=1 npx payload run scripts/seed-chaty.ts
          rm -rf .next
          tar -xzf /tmp/chaty-build.tar.gz
          rm -f /tmp/chaty-build.tar.gz
          NASAZENI

      - name: Restart aplikace (PM2) + health
        run: |
          ssh -i ~/.ssh/id_deploy "forge@${{ secrets.PTICORE_HOST }}" bash -s <<NASAZENI
          set -euo pipefail
          pm2 restart site-3312291
          for i in \$(seq 1 45); do
            if curl -fsS "http://127.0.0.1:3017/api/health" >/dev/null 2>&1; then
              echo "OK: /api/health odpovida"
              exit 0
            fi
            sleep 2
          done
          echo "!! aplikace po restartu neodpovida na /api/health" >&2
          pm2 logs site-3312291 --lines 60 --nostream || true
          exit 1
          NASAZENI
