# F1 · Vizuální kontrola ŽIVÉHO STAGINGU (dev.turistickechaty.cz).
#
# Uzavírá „zbývá: vizuální kontrola nad reálnými daty na stagingu",
# které se táhne fázemi F1b/F1c/F1e/F1f — sandbox denních sessions na
# staging nedosáhne, Actions ano (precedent F0-07). Nefotí se CI build,
# ale SKUTEČNÝ nasazený web: to, co vidí návštěvník.
#
# Snímky → docs/kontroly/f1-staging/ (commit [skip ci]; docs/** deploy
# nespouští). Porovnání s design/handoff-f1/screenshots/ dělá hlavní
# session / Michal.
#
# Spouštění: ručně, nebo pushem tohoto workflow / skriptu (první běh
# se tak spustí rovnou commitem, bez klikání).
name: 'F1: vizualni kontrola stagingu'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vizualni-kontrola-staging-f1.yml'
      - 'scripts/ci/screenshot-staging-f1.mjs'

permissions:
  contents: write

concurrency:
  group: vizualni-kontrola-staging-f1
  cancel-in-progress: true

jobs:
  snimky:
    name: Snimky stagingu (den/noc/mobil)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Chromium pro Playwright
        run: npx playwright install --with-deps chromium

      # Beh #1 a #2 padly presne tady (curl z runneru na staging neprosel,
      # ackoli web bezi) -> krok uz NEBLOKUJE, misto toho zapise plnou
      # diagnostiku do souboru, ktery se commitne VZDY - hlavni session si
      # ji precte z repa bez rucniho kopirovani logu.
      - name: Diagnostika dostupnosti stagingu (zapis do repa)
        run: |
          mkdir -p docs/kontroly/f1-staging
          {
            echo "== diagnostika $(date -u +%Y-%m-%dT%H:%M:%SZ) (run ${{ github.run_number }}) =="
            echo '-- DNS z runneru:'
            getent hosts dev.turistickechaty.cz || echo 'getent selhal'
            echo '-- https health:'
            curl -sS -o /dev/null -m 20 \
              -w 'http_code=%{http_code} ip=%{remote_ip} cas=%{time_total}s\n' \
              https://dev.turistickechaty.cz/api/health || echo "curl https exit=$?"
            echo '-- http health (redirect?):'
            curl -sS -o /dev/null -m 20 \
              -w 'http_code=%{http_code} ip=%{remote_ip} redirect=%{redirect_url}\n' \
              http://dev.turistickechaty.cz/api/health || echo "curl http exit=$?"
            echo '-- https verbose (posledni 30 radku):'
            curl -v -o /dev/null -m 20 https://dev.turistickechaty.cz/api/health 2>&1 | tail -30
          } | tee docs/kontroly/f1-staging/_diagnostika.txt || true

      - name: Snimky sablon F1 (den / noc / mobil)
        continue-on-error: true
        env:
          # DOCASNE po http: beh 3 dolozil (viz _diagnostika.txt), ze 443
          # vraci TLS "unrecognized name" - certifikat pro dev.* na serveru
          # chybi/neni aktivni. Az Michal vyda Let's Encrypt ve Forge
          # (Domains -> dev.turistickechaty.cz -> SSL), TENTO RADEK SMAZAT
          # a fotit zase pres https (diagnostika hlida 443 dal).
          STAGING_URL: http://dev.turistickechaty.cz
        run: node scripts/ci/screenshot-staging-f1.mjs

      - name: Artifact se snimky
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-staging-snimky
          path: docs/kontroly/f1-staging/
          if-no-files-found: warn

      - name: Commit snimku a diagnostiky do docs/kontroly/f1-staging/
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/kontroly/f1-staging
          git add docs/kontroly/f1-staging
          if git diff --cached --quiet; then
            echo 'Zadna zmena - nic ke commitu.'
            exit 0
          fi
          git commit -m 'docs: snimky/diagnostika F1 stagingu (z Actions) [skip ci]'
          git pull --rebase origin main
          git push origin main
