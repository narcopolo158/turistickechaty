# DATA-06 (increment 2): export výchozích bodů ZVOLENÉ OBLASTI z OSM —
# sandbox denních sessions na Overpass nedosáhne (proxy), GitHub Actions ano.
# Spouští se ručně jedním klikem (Actions → „DATA-06: výchozí body oblasti" →
# Run workflow → vyber oblast).
#
# Oblast se přidala 30. 7. 2026 (Michal: „u data-06 nejde vybrat oblast").
# Okno dotazu, ZEMĚ dotazu i cílový adresář `data/oblasti/<oblast>/` se berou
# z konfigurace v scripts/oblasti.ts — Ještědský hřbet je celý v Česku, takže
# se u něj polský dotaz vůbec nepošle.
#
# Běh: (1) stáhne surový JSON export (obce place=town/village, lanovky
# aerialway=station, železnice railway=station/halt; commituje se jako doklad —
# timestamp stavu OSM dat + copyright Overpass), (2) skript rozpozná typ,
# souřadnice a výšku a zapíše katalog `data/oblasti/krkonose/vychozi-body-
# kandidati.json` (vstup pro routing přístupových tras — DATA-06 increment 3).
# Body bez názvu/GPS/typu jdou do reportu, ne do katalogu (nedomýšlet).
# Idempotentní — přepíše export i katalog aktuálním stavem OSM.
name: 'DATA-06: výchozí body oblasti'

on:
  workflow_dispatch:
    inputs:
      oblast:
        description: 'Oblast (slug dle scripts/oblasti.ts): krkonose | jizerske-hory | jestedsky-hrbet | sumava'
        required: false
        default: 'krkonose'
      api:
        description: 'Overpass endpoint — nech prázdné (skript zkouší overpass-api.de a při selhání zrcadlo kumi.systems); vyplň jen pro vynucení konkrétní instance'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: data06-vychozi-body
  cancel-in-progress: false

jobs:
  export:
    name: Overpass → výchozí body (data/oblasti/<oblast>)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export výchozích bodů z Overpass API
        shell: bash
        env:
          API_INPUT: ${{ inputs.api }}
          OBLAST: ${{ inputs.oblast || 'krkonose' }}
        run: |
          ARG=()
          if [ -n "$API_INPUT" ]; then ARG=(--api "$API_INPUT"); fi
          npx tsx scripts/data06-vychozi-body.ts --oblast "$OBLAST" "${ARG[@]}" | tee report.txt
          echo '## DATA-06 — výchozí body: výstup běhu' >> "$GITHUB_STEP_SUMMARY"
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Commit exportu a katalogu výchozích bodů do main
        shell: bash
        env:
          OBLAST: ${{ inputs.oblast || 'krkonose' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/oblasti
          if git diff --cached --quiet; then
            echo 'Beze změny exportu i katalogu — nic ke commitu.'
            exit 0
          fi
          git commit -m "data: OSM export výchozích bodů (${OBLAST}) — obce/lanovky/železnice (z Actions)" \
            -m 'Zdroj: OpenStreetMap (ODbL), place=town/village + aerialway=station + railway station/halt. Vstup pro routing přístupových tras (DATA-06 increment 3).'
          git pull --rebase origin main
          git push origin main
