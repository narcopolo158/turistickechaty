# DATA-28: 3D model zvolené oblasti — ostrý výškopis + trasy + vrcholy.
# Sandbox denních sessions na api.mapy.com ani Overpass nedosáhne (proxy),
# GitHub Actions ano. Spouští se ručně (Actions → „DATA-28: 3D terén (dle
# oblasti)" → Run workflow → vyber oblast).
#
# Běh: mřížka 240×144 z Mapy.com Elevation API (klíč hlavičkou X-Mapy-Api-Key
# ze secrets MAPY_API_KEY — nikdy do URL ani logu), značené trasy a vrcholy
# z Overpass (ODbL), chaty a přechody z repa. Složí finální
# docs/experimenty/3d-teren-krkonose.html (three.js přibalen z node_modules)
# a commitne výsledek. Idempotentní; výškopis = výškový model, verified:false.
name: 'DATA-28: 3D terén (dle oblasti)'

on:
  workflow_dispatch:
    inputs:
      oblast:
        description: 'Oblast (slug dle scripts/oblasti.ts): krkonose | jizerske-hory | jestedsky-hrbet | sumava | beskydy | jeseniky | javorniky-vsetinske-vrchy | mala-fatra | oravska-magura | zapadne-tatry'
        required: false
        default: 'krkonose'
  # Auto-běh při změně generátoru nebo šablony: nová vrstva/vzhled se do
  # modelu dostane bez ručního kliknutí. Commit z Actions se skriptu ani
  # šablony nedotýká, takže se běh nezacyklí.
  push:
    branches: [main]
    paths:
      - 'scripts/data28-3d-teren.ts'
      - 'docs/experimenty/3d-teren-sablona.html'

permissions:
  contents: write

concurrency:
  group: data28-3d-teren
  cancel-in-progress: false

jobs:
  teren:
    name: Mapy.com Elevation + Overpass → 3D model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Výškopis, trasy, vrcholy → data + HTML
        shell: bash
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
          OBLAST: ${{ inputs.oblast || 'krkonose' }}
        run: |
          if [ -z "$MAPY_API_KEY" ]; then
            echo '::error::Chybí secret MAPY_API_KEY (Settings → Secrets → Actions).'
            exit 1
          fi
          npx tsx scripts/data28-3d-teren.ts --oblast "$OBLAST" | tee report.txt
          echo '## DATA-28 — 3D terén: výstup běhu' >> "$GITHUB_STEP_SUMMARY"
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Commit 3D modelu do main
        shell: bash
        env:
          OBLAST: ${{ inputs.oblast || 'krkonose' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experimenty/3d-teren-data*.json docs/experimenty/3d-teren-*.html public/3d/*.html
          if git diff --cached --quiet; then
            echo 'Beze změny — nic ke commitu.'
            exit 0
          fi
          git commit -m "data: 3D teren (${OBLAST}) -- ostry vyskopis, trasy a vrcholy (z Actions)" \
            -m 'Vyskopis: Mapy.com Elevation API (vyskovy model, verified:false). Trasy a vrcholy: OpenStreetMap (ODbL). Sklada scripts/data28-3d-teren.ts.'
          git pull --rebase origin main
          git push origin main
