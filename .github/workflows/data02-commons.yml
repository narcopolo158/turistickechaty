# DATA-02: fotky chat z Wikimedia Commons — sandbox denních sessions na
# Commons API nedosáhne (proxy), GitHub Actions ano. Spouští se ručně jedním
# klikem (Actions → „DATA-02: fotky chat z Wikimedia Commons" → Run workflow).
#
# Běh: (1) pro každou chatu (data/chaty/** i kandidáti DATA-01) položí
# geosearch + kategorii + fulltext názvu na Commons API — chaty BEZ GPS
# v YAML dostanou jen kategorii + fulltext (geosearch nemá okolo čeho
# hledat; dřív se tiše přeskakovaly) — a surové odpovědi
# commitne jako doklad (data/kandidati/fotky/_commons-export.json), (2) v
# témže běhu je licenční
# síto (jen CC0 / CC BY / CC BY-SA / public domain) převede na kandidátní
# METADATA v data/kandidati/fotky/<oblast>/<slug>.yaml. Soubory fotek se
# NESTAHUJÍ — výběr, kontrolu licence a nahrání do kolekce Fotky dělá
# redakce. Kandidátní YAML jsou strojově generované, opakovaný běh je
# přepíše aktuálním stavem Commons.
name: 'DATA-02: fotky chat z Wikimedia Commons'

on:
  workflow_dispatch:
    inputs:
      radius:
        description: 'Poloměr geosearch okolo GPS chaty (m)'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: data02-commons
  cancel-in-progress: false

jobs:
  export:
    name: Commons → kandidátní fotky (data/kandidati/fotky)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Běh trvá přes deset minut a mezitím se do main může dostat cizí commit
      # (30. 7. 2026 jsme takhle z repa uklidili osiřelé kandidátní fotky).
      # Generovat ze zastaralého stavu by znamenalo zapsat soubory k objektům,
      # které už v korpusu nejsou, a při závěrečném rebase konflikt
      # „modify/delete". Proto se před generováním main dotáhne.
      - name: Aktualizovat main před generováním
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - name: Dotazy na Commons API + licenční síto
        # Explicitní shell: bash zapíná pipefail — pád skriptu se nesmí
        # ztratit v pipe přes tee (lekce z prvního běhu DATA-01).
        shell: bash
        env:
          RADIUS_INPUT: ${{ inputs.radius }}
        run: |
          npx tsx scripts/data02-commons-fotky.ts --radius "${RADIUS_INPUT:-300}" | tee report.txt
          echo '## DATA-02 — výstup běhu' >> "$GITHUB_STEP_SUMMARY"
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Commit exportu a kandidátních fotek do main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kandidati/fotky
          if git diff --cached --quiet; then
            echo 'Žádná změna kandidátních fotek — nic ke commitu.'
            exit 0
          fi
          pocet=$(git diff --cached --name-only -- 'data/kandidati/fotky/**/*.yaml' | wc -l)
          # Neúplný běh (část chat se nestáhla) commituje, co našel — ale musí
          # to být vidět v historii. Skript to říká řádkem „NEUPLNY_BEH: N chat".
          CHYBI=$(sed -n 's/^NEUPLNY_BEH: //p' report.txt | head -1)
          if [ -n "$CHYBI" ]; then
            TITULEK="data: Wikimedia Commons — kandidátní fotky chat (${pocet} YAML) — NEÚPLNÝ, nestáhlo se ${CHYBI} (z Actions)"
            DOVETEK="POZOR: u ${CHYBI} se dotaz na Commons nepovedl (limit sdílené IP runnerů), jejich fotky v tomhle běhu NEJSOU. Spusť workflow znovu — je idempotentní."
          else
            TITULEK="data: Wikimedia Commons — kandidátní fotky chat (${pocet} YAML, z Actions)"
            DOVETEK='Jen metadata (autor, licence, URL) po licenčním sítu CC0/CC BY/CC BY-SA/PD. Soubory se nestahují — výběr a nahrání do kolekce Fotky dělá redakce.'
          fi
          git commit -m "$TITULEK" -m "$DOVETEK"
          # Push se zkusí dvakrát: mezi generováním a pushem může přibýt cizí
          # commit a rebase pak potřebuje druhý pokus.
          for pokus in 1 2; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push se nepovedl (pokus ${pokus}) — zkouším znovu za 10 s"
            sleep 10
          done
          echo '::error::Nepodařilo se pushnout ani na druhý pokus — data jsou v běhu, spusť workflow znovu.'
          exit 1
