# DATA-01: export chat z OpenStreetMap pro zvolenou oblast — sandbox denních
# sessions na Overpass API nedosáhne (proxy), GitHub Actions ano. Spouští se
# ručně jedním klikem (Actions → „DATA-01: OSM export chat (dle oblasti)" →
# Run workflow → vyber oblast).
#
# Běh: (1) stáhne surový JSON export (commituje se jako doklad — nese
# timestamp stavu OSM dat i copyright hlavičku Overpass), (2) v témže běhu
# ho transformační skript převede na YAML KANDIDÁTŮ v data/kandidati/<oblast>/
# — kandidáti NEJSOU na webu (seed čte jen data/chaty/**); do data/chaty/ se
# povyšují ručně až po křížovém ověření (DATA-03). Ruční profily (Luční
# bouda) se nikdy nepřepisují — skript je jen porovná v reportu (summary).
# Opakované spuštění je idempotentní — přidá jen nově vzniklé objekty.
name: 'DATA-01: OSM export chat (dle oblasti)'

on:
  workflow_dispatch:
    inputs:
      oblast:
        description: 'Oblast (slug dle scripts/oblasti.ts): krkonose | jizerske-hory | jestedsky-hrbet'
        required: false
        default: 'krkonose'
      api:
        description: 'Overpass endpoint — nech prázdné (skript zkouší overpass-api.de a při selhání zrcadlo kumi.systems); vyplň jen pro vynucení konkrétní instance'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: data01-overpass
  cancel-in-progress: false

jobs:
  export:
    name: Overpass → kandidáti (data/kandidati)
    runs-on: ubuntu-latest
    # Skript zkouší tři veřejné instance ve třech kolech s pauzami (HTTP 504
    # z Overpassu je „mám nával", ne „špatný dotaz"), takže běh smí trvat
    # desítky minut. Strop je pojistka proti zaseknutému běhu, ne cíl.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export z Overpass API + transformace na kandidáty
        # Explicitní shell: bash zapíná pipefail — pád skriptu se nesmí
        # ztratit v pipe přes tee (příčina maskované chyby prvního běhu).
        shell: bash
        env:
          API_INPUT: ${{ inputs.api }}
          OBLAST: ${{ inputs.oblast || 'krkonose' }}
        run: |
          ARG=()
          if [ -n "$API_INPUT" ]; then ARG=(--api "$API_INPUT"); fi
          npx tsx scripts/data01-overpass-krkonose.ts --oblast "$OBLAST" "${ARG[@]}" | tee report.txt
          echo '## DATA-01 — výstup běhu' >> "$GITHUB_STEP_SUMMARY"
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Commit exportu a kandidátů do main
        shell: bash
        env:
          OBLAST: ${{ inputs.oblast || 'krkonose' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kandidati
          if git diff --cached --quiet; then
            echo 'Žádní noví kandidáti ani změna exportu — nic ke commitu.'
            exit 0
          fi
          pocet=$(git diff --cached --name-only --diff-filter=A -- 'data/kandidati/**/*.yaml' | wc -l)
          # Neúplný běh (jedna země se nestáhla) commituje, co našel — ale MUSÍ
          # to být vidět v historii, jinak by commit tvrdil úplný export.
          # Skript to říká řádkem „NEUPLNY_BEH: PL" (viz verdiktBehu).
          CHYBI=$(sed -n 's/^NEUPLNY_BEH: //p' report.txt | head -1)
          if [ -n "$CHYBI" ]; then
            TITULEK="data: OSM Overpass export chat a rozhleden (${OBLAST}) — NEÚPLNÝ, chybí ${CHYBI} (+${pocet} nových, z Actions)"
            DOVETEK="POZOR: dotaz na ${CHYBI} se v tomhle běhu nepovedl (Overpass), kandidáti z té země tu NEJSOU. Spusť workflow znovu — je idempotentní, nic se nepřepisuje."
          else
            TITULEK="data: OSM Overpass export chat a rozhleden s občerstvením (${OBLAST}) — kandidáti (+${pocet} nových, z Actions)"
            DOVETEK='Zdroj: OpenStreetMap (ODbL), tourism=alpine_hut/wilderness_hut/hut + tower:type=observation s doloženým občerstvením do 100 m, vše verified: false. Kandidáti nejsou na webu — do data/chaty/ povyšovat po křížovém ověření (DATA-03).'
          fi
          git commit -m "$TITULEK" -m "$DOVETEK"
          git pull --rebase origin main
          git push origin main
