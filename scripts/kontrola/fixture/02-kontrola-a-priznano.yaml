slug: 02-kontrola-a-priznano
nazev: Fixtura pro kontrolu A s priznanym rozporem
typ: obsluhovana
perex: >-
  Bouda stojí kousek nad obcí Špindlerův Mlýn a je v provozu po celý rok.
text:
  - >-
    Ubytování nabízí 42 lůžek a leží ve výšce 1 320 m n. m. Prameny si
    v těchto číslech odporují a my je zatím doložit neumíme.
