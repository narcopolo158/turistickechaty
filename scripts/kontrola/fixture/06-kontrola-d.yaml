slug: 06-kontrola-d
nazev: Fixtura pro kontrolu D
typ: obsluhovana
obec: Harrachov
stav: v-provozu
kapacita: 20
vyska: 900
perex: "  Nejstarší bouda v okolí stojí právě tady."
text:
  - "Věta jedna je neutrální. Nejvýše položená bouda hřebene je tahle.  "
  - >-
    Bouda je nejrozlehlejší stavbou celého hřebene, což je tvrzení dost
    silné na to, aby si zasloužilo pramen, a schválně je dlouhé přes sto
    deset znaků. Uvádí to provozovatel na svém webu.
  - >-
    Nejspíš tu stávala starší bouda. Pokoje v nejvyšším patře mají výhled na
    obě strany hřebene.
