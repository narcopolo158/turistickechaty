slug: 22-obec-dvouslovna
nazev: Fixtura s dvouslovnou obci
typ: obsluhovana
obec: Česká Kubice
perex: >-
  Existuje jen proto, aby kontrola A měla v množině obcí i dvouslovné
  jméno, jehož první slovo je běžné přídavné jméno. Próza nic netvrdí.
text:
  - >-
    Druhý odstavec také nic netvrdí a nikoho nejmenuje.
