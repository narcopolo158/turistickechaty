slug: 23-kontrola-a-obec-podretezec
nazev: Fixtura proti podretezcove shode obce
typ: obsluhovana
perex: >-
  Nemá vyplněnou obec a jmenuje spolky, jejichž jména nesou základ
  hledaného jména uvnitř slova. Kontrola A ji NESMÍ obvinit z jmenování
  dvouslovné obce ze souboru 22 — přesně tak 7. 8. 2026 obvinila Raisovu
  chatu na Zvičině, jakmile do korpusu přibyla Kurzova věž.
text:
  - >-
    Chatu podle pamětní desky založila Národní jednota severočeská
    a později ji převzal Klub českých turistů.
