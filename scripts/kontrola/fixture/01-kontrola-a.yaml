slug: 01-kontrola-a
nazev: Fixtura pro kontrolu A
typ: obsluhovana
perex: >-
  Bouda stojí kousek nad obcí Špindlerův Mlýn a je v provozu po celý rok.
text:
  - >-
    Ubytování nabízí 42 lůžek ve dvou podlažích a kuchyně vaří i pro
    kolemjdoucí.
  - >-
    Chata leží ve výšce 1 320 m n. m., tedy nad horní hranicí lesa.
