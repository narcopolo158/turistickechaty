# Známí jmenovci — kolize názvů, které redakce VIDĚLA a rozhodla o nich.
#
# Pravidlo pro rozlišení jmenovců je v `docs/DATA-17-jmenovci.md`: rozlišovačem
# je `obec`, a nic jiného (R2), a když `obec` chybí, NEVYMÝŠLÍ se — doplní se
# z pramene a do té doby zůstává rozlišení interní (R6). Tenhle registr je
# právě ten „do té doby": kontrola `scripts/kontrola/kolize-jmen.ts` zapsanou
# kolizi hlásí v oddíle Z, ale neshazuje na ní běh. Verdikt tak dál platí pro
# kolize NOVÉ — a to je celý smysl kontroly (ohlásit okamžik, kdy jmenovec
# do korpusu přibude), ne trvale červená kontrola, kterou nikdo nečte.
#
# Klíčem je MNOŽINA objektů (`oblast/slug`), ne jádro názvu: přibude-li
# k dvojici třetí jmenovec, kontrola se ozve znovu, protože množina je jiná.
# Zápis sem není vyřešení kolize — je to doklad, že se o ní ví a na co se čeká.

jmenovci:
  - jadro: hubertka
    objekty:
      - jizerske-hory/hubertka
      - krkonose/chata-hubertka
    duvod: >-
      Dva různé objekty asi 40 km od sebe: „Hubertka" v Jizerských horách
      (OSM way/51573239) a „Chata Hubertka" v Krkonoších (OSM node/12590285723).
      Oba jsou zatím jen kandidáti, na webu nestojí ani jeden, takže čtenáře
      dnes zaměnit nemůžou. Rozlišovačem má být `obec` (DATA-17 R2), ta ale
      u ani jednoho není doložená — dle R6 se nevymýšlí a doplní se z pramene
      (DATA-03 křížové ověření, u krkonošské i DATA-04 telefonát; její web
      z OSM byl 20. 7. 2026 nedostupný). Rozlišení tedy zůstává interní
      a slug s příponou obce se přidělí až s doloženou obcí (R5).
    rozhodl: Claude (návrh z 28. 7. 2026) — čeká na potvrzení Michalem
    checked: 2026-07-28
  - jadro: slovanka
    objekty:
      - jizerske-hory/rozhledna-slovanka
      - krkonose/bouda-slovanka
    duvod: >-
      Dva různé objekty asi 40 km od sebe: „rozhledna Slovanka"
      v Jizerských horách (OSM way/470025078, 50,7733 / 15,1963) a „Bouda
      Slovanka" v Krkonoších (OSM way/31360811, 50,6705 / 15,7284). Kolize
      byla v korpusu od 28. 7. 2026, kdy přibyly rozhledny, ale kontrola ji
      NEVIDĚLA: „rozhledna" nebyla mezi typovými slovy, takže jádra
      „rozhledna slovanka" a „slovanka" spadla do dvou hromádek (opraveno
      29. 7. 2026 — tenhle záznam je jediný nález té opravy). Od
      2. 8. 2026 jsou publikované OBA (rozhledna povýšena při triáži
      Jizerek) — na webu je rozlišuje název (Bouda × Rozhledna) a oblast
      v drobečkové navigaci. Rozlišovač `obec` (DATA-17 R2) má doložený
      jen jeden z nich — bouda `Černý Důl`; u rozhledny se ani při
      křížovém ověření 2. 8. NEVYMYSLELA (vlastník věže je město Lučany,
      chata u ní je ale v katalozích pod Hraběticemi/Janovem — katastr
      věže žádný pramen neříká, R6), rozlišení nese název a oblast (R5).
    rozhodl: Claude (návrh z 29. 7. 2026) — čeká na potvrzení Michalem
    checked: 2026-07-29
  - jadro: zaly
    objekty:
      - krkonose/rozhledna-zaly
      - krkonose/zaly
    duvod: >-
      NENÍ jmenovec, ale týž objekt ve dvou entitách OpenStreetMap: publikovaný
      profil „Žalý" (data/chaty/krkonose/zaly.yaml) popisuje celek na vrcholu
      Přední Žalý — kamennou rozhlednu z roku 1892 i dřevěnou restauraci u její
      paty (OSM way/151987319, budova restaurace) —, kdežto kandidát „Rozhledna
      Žalý" je OSM entita samotné věže (way/415701652), kterou přinesl první
      rozhlednový běh DATA-01 nad Krkonošemi 29. 7. 2026. Že jde o jeden
      provoz, dokládá shodný telefon +420 732 801 804 (u restaurace v OSM,
      u rozhledny na Kudy z nudy) a e-maily na téže doméně. Kandidát se proto
      nepovyšuje jako druhý profil; kdyby Michal chtěl uplatnit i tady
      rozhodnutí o Sněžce („profil každého objektu zvlášť"), rozdělení je
      připravené a názvy se pak musí rozlišit (věž × bouda), ne nechat oba
      „Žalý".
    rozhodl: Claude (návrh z 29. 7. 2026) — čeká na potvrzení Michalem
    checked: 2026-07-29
