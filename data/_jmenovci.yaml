      tedy NA ROZDÍL OD PRAŠIVÉ to jeden areál není. Věž má z OSM typ
      `rozhledna`, dům je samostatný objekt o kilometr dál. Vede se to zvlášť;
      u věže bude klíč zařazení stát na tom, jestli je u ní občerstvení
      (rozhodnutí Michala 28. 7. 2026), což zatím nedokládá nic.
    rozhodl: Claude (návrh z 8. 8. 2026) — čeká na potvrzení při triáži Beskyd
