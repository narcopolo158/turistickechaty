      DVA RŮZNÉ OBJEKTY, naměřeno 40 081 m: „Chata Lucka" v Oščadnici (obec
      doložená) a „Chata Lúčka" v Malé Fatře. POZOR NA PRAVOPIS — Lucka je
      ženské jméno, Lúčka je zdrobnělina lučiny, takže to nejsou dva zápisy
      téhož slova, ale dvě různá slova. Kontrola kolizí je spárovala proto,
      že normalizace odstraňuje diakritiku; kdyby se jméno používalo jako
      rozlišovač, byla by to past.
