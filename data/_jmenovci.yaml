    duvod: >-
      Tři různé objekty ve třech pohořích: publikovaná Barborka v Peci pod
      Sněžkou (Krkonoše), šumavská Chata Barborka u Hartmanic a nová
      beskydská chata Barborka. Rozlišovač `obec` má doložený krkonošská
      a šumavská, beskydská ne (R6). POZOR NA ČTVRTOU: externí katalog vede
      Chatu Barborka i v Hrubém Jeseníku (1320 m, pradědská oblast) — až
      Michal klikne na DATA-01 pro Jeseníky, kolize se rozroste a kontrola
      se ozve znovu, protože klíčem je MNOŽINA objektů. Je to tedy záznam,
      který se bude muset přepsat, a je to správně.
    rozhodl: Claude (návrh z 8. 8. 2026) — čeká na doložení obcí při triáži
    checked: 2026-08-08
