  - jadro: hajenka
    objekty:
      - beskydy/hajenka
      - beskydy/horsky-hotel-hajenka
      - jizerske-hory/hajenka
      - sumava/hajenka
      - sumava/penzion-hajenka
    duvod: >-
      PĚT OBJEKTŮ ve čtyřech oblastech a žádná duplicita: „hájenka" je
      obecné české slovo pro lesníkovo stavení, takže shoda jména nic
      neznamená. Naměřeno mezi beskydskou dvojicí 47 051 m; jizerská
      a šumavské leží stovky kilometrů od nich. Rozlišovačem bude `obec`
      (DATA-17 R2) — doloženou ji mají jen tři z pěti (Makov, Kašperské
      Hory, Borová Lada), u dvou se dle R6 nevymýšlí. Poznámka pro triáž:
      jméno „Hájenka" je zároveň jmenné slovo, které náš triážní skript
      bere jako nadějný signál — u lesníkových stavení bez občerstvení to
      bude často falešný pozitiv.
    rozhodl: Claude (návrh z 8. 8. 2026) — čeká na doložení obcí při triáži
    checked: 2026-08-08
  - jadro: barborka
