  # dvanáct. Všechny jsou mezi KANDIDÁTY, na webu nestojí ani jeden objekt,
  # takže čtenáře dnes zaměnit nemůžou. U každé kolize je NAMĚŘENÁ vzdálenost
  # z GPS obou objektů — to je metoda, kterou u nás rozhoduje spor o totožnost
  # (vzor Haničky na Špičáku ze 7. 8. a duplicit Chaty Mamut z 20. 7.).
  # Výsledek měření: PRAVÁ DUPLICITA OSM NENÍ ANI JEDNA. Jedna kolize je ale
  # nález — Prašivá, viz níž.
  - jadro: prasiva
    objekty:
      - beskydy/chata-prasiva
      - beskydy/prasiva
    duvod: >-
      NEJDŮLEŽITĚJŠÍ Z DÁVKY — nejspíš JEDEN AREÁL, ne dva objekty.
      Naměřeno z GPS obou kandidátů: 5 metrů. „Prašivá" má z OSM typ
      `rozhledna`, „Chata Prašivá" typ nemá — je to tedy věž a dům u její
      paty, přesně vzor Žalý / Královka / Svatobor / Kleť. Chata Prašivá je
      navíc v externím katalogu (706 m, stravování ano), takže objekt do
      průvodce téměř jistě patří. Rozhodnutí, jestli jeden profil nebo dva,
      padne při triáži Beskyd proti druhému prameni — musí se doložit, KDO
      rozhlednu provozuje (u Kleti to pramen výslovně říkal, u Geisskopfu
      naopak mlčel a věž se proto nepovýšila).
    rozhodl: Claude (návrh z 8. 8. 2026) — čeká na potvrzení při triáži Beskyd
    checked: 2026-08-08
