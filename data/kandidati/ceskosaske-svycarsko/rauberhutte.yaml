  Otvírací doba dle OSM (surový formát, neověřeno): Sa,Su 11:00-18:00

  PŘESAH OKNA (čtecí průchod 10. 8. 2026): obec Rosenthal-Bielatal leží
  v Saském Švýcarsku (Labské pískovce), ne v Krušných horách — okno oblasti
  ho přineslo přesahem. Objekt vypadá jako skutečná bauda; NEVYŘAZOVAT
  (vzor DATA-29 — přesahové oblasti), rozhodnout příslušnost až se Saským
  Švýcarskem jako oblastí, do té doby kandidáta drží krušnohorské okno.

  PŘESUNUTO z data/kandidati/krusne-hory/ (10. 8. 2026, rozhodnutí Michala
  „ceskosaske svycarsko zaloz"): objekt leží v Labských pískovcích
  a do oblasti krusne-hory ho přineslo jen přesahové okno. Do _vyrazeno
  se nezapisuje (vzor přesunu beskydy → javorniky z 8. 8.) — starou
  oblast podrží pojistka DATA-36.
