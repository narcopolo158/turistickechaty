  Provozovatel dle OSM: Chodník korunami stromov s.r.o.

  REŠERŠE 9. 8. 2026 (blok „pokracuj dal") — PŘIPRAVENO K POVÝŠENÍ, ale
  S OTÁZKOU ROZSAHU stejnou jako Głodówka: objekt leží na hřebeni SPIŠSKÉ
  MAGURY (pravda.sk: „drevostavby na hrebeni Spišskej Magury"; bachledka.sk:
  „on the border of the Pieniny and Tatra National Parks"), tedy mimo Tatry.
  Fakta: stezka v korunách stromů s 32m spirálovou věží, otevřeno 29. 9.
  2017, sedmý projekt Erlebnis Akademie AG, projekt „nemecký architekt Josef
  Stöger", délka 1234 m (z toho chodník 603 m), vstup 1149 m n. m., terasa
  1175 m n. m., celodřevěná konstrukce (duglaska + modřín, 1000 m³ dřeva).
  Provozovatel CHODNÍK KORUNAMI STROMOV s.r.o. (IČO 50 862 839). Celoročně
  (bachledka.sk: „open all year round", jarní a podzimní údržba). Vstup
  dospělý 29 € online. Restaurace na vrcholu Malá Poľana: 180 míst + terasa
  350 (accessible-eu-centre.ec.europa.eu). Přístup: gondola Bachledka, pěšky
  po ŽLUTÉ značce od parkovišť (turisticky.sk) — na rozdíl od Głodówky sem
  značka VEDE. Tobogán 67 m. Až Michal rozhodne otázku rozsahu (deník 9. 8.,
  otázka 6), povýšit; prameny: chodnikkorunamistromov.sk, bachledka.sk,
  daibau.sk, pravda.sk, ta3.com, turisticky.sk.
