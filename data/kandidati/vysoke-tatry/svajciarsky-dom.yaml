interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-08) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  REŠERŠE 9. 8. 2026 (blok „pokracuj dal") — PŘIPRAVENO K POVÝŠENÍ, čeká jen
  na kapacitu bloku: Švajčiarsky dom je jedna z nejstarších budov Vysokých
  Tater (tatry.sk: „one of the oldest buildings in the High Tatras and its
  history dates back to 1856"; evidence NKP dle krizom-krazom.online: „Vila
  z roku 1865", upravovaná 1987 — rozpor datace přiznat). Od roku 2021
  národní kulturní památka. Dnes: MUZEUM NOSIČSTVÍ, veřejná kavárna (Sherpa
  caffe, recenze salkakavy.sk popisuje běžnou obsluhu), dětský koutek a dva
  apartmány; ubytování 10 lůžek + 2 přistýlky ve 2-, 3- a 5lůžkových
  pokojích (tatry.sk). Adresa Starý Smokovec 1. Klíč zařazení: kavárna pro
  veřejnost doložená, poloha v osadě na nástupním uzlu — srovnatelné
  s Rainerovou chatou (kiosek, expozice o nosičích!); tematicky se obě
  expozice doplňují. Prameny: tatry.sk/en/svajciarsky-dom-swiss-house/,
  krizom-krazom.online/vila-v-starom-smokovci-svajciarsky-dom/,
  spis.korzar.sme.sk (NKP), salkakavy.sk. Stavitel NENALEZEN.
