# Odložení kandidáti — aktivní „zatím ne", ne zapomenutí.

# Kandidát bez rozhodnutí leží ve frontě a `npm run kontrola` ho počítá jako
# nezpracovaného. Když ale víme, PROČ se rozhodnout nedá (chybí ověření
# v terénu, čeká se na odpověď chataře), patří to sem — jinak fronta hlásí
# práci, která se dělat nemá, a přestane se jí věřit.

# Odložení není vyřazení: objekt se do fronty vrátí, jakmile se ze seznamu
# odstraní. Vyřazené vede `_vyrazeno.yaml` a DATA-01 je znovu nezakládá.

odlozeno:
  - slug: wieza-widokowa-mirsk
    oblast: jizerske-hory
    duvod: >-
      Ověřená a zdokumentovaná (věž 37,5 m, adaptovaná wieża ciśnień
      z let 1887–1890, vyhlídková od 2013) — ale stojí uvnitř města
      Mirsk v podhůří, u školního areálu, a občerstvení dokládá jen OSM
      bistro 57 m. Všech deset dosud přijatých rozhleden stojí na
      vrcholech či hřebenech na trase; jestli „role na trase" pokrývá
      i městskou věž pod horami, je rozhodnutí o rozsahu průvodce →
      Michal. Do rozhodnutí se nepovyšuje ani nevyřazuje.
    rozhodl: interaktivní session s pověřením „pracuj dál samostatně" (3. 8. 2026)
    checked: 2026-08-03
  - slug: kadernberg-aussichtsturm
    oblast: sumava
    duvod: >-
      Klíč zařazení SPLŇUJE (dřevěná vyhlídková věž 30 m na Kadernbergu,
      700 m, u Schönbergu; občerstvení přímo u paty), ale prameny si
      odporují o AKTUÁLNÍM STAVU a ani jeden svou zprávu nedatuje.
      Regionální průvodce vede věž jako zavřenou z požárních důvodů,
      hospodu jako přejmenovanou (Turmstüberl → Kadernberger Hütt'n)
      a lanový park vedle ní jako bývalý; web provozovatele gastronomie
      ji naopak popisuje jako fungující a park jako činný. Stav objektu
      je pro plánování túry zásadní údaj — nepovyšovat, dokud ho
      nedoloží pramen s datem, nebo telefonát.
    rozhodl: samostatná práce 7. 8. 2026 (pověření „pokračuj dvě hodiny samostatně")
    checked: 2026-08-07
  - slug: stadtturm
    oblast: sumava
    duvod: >-
      Městská věž na náměstí ve Furth im Wald, tedy v pohraničním městě
      pod Českým lesem; občerstvení kolem dokládají městské kavárny
      a restaurace. Je to TÁŽ otázka rozsahu jako u věže v Mirsku výš:
      jestli „role na trase" pokrývá i městskou věž pod horami. Dokud
      Michal nerozhodne, drží se obojí stejně. (Druhý Stadtturm
      z exportu, ve Straubingu, je jiný případ — leží v dunajské nížině
      desítky kilometrů od hor a je VYŘAZEN.)
    rozhodl: samostatná práce 7. 8. 2026 (pověření „pokračuj dvě hodiny samostatně")
    checked: 2026-08-07
  - slug: chata-hanicka
    oblast: sumava
    duvod: >-
      Do fronty se dostala jako „chata s jídelnou na vrcholu Špičáku"
      podle Regiontouristu — přeměření proti souřadnicím to vyvrátilo:
      stojí 1,2 km od vrcholu dole v areálu Ski & Bike Špičák (adresa
      Špičák na Šumavě 182). Vlastní web areálu ji vede jako ubytování
      (Hanička a Blaženka dohromady 68 lůžek, v Haničce 6 dvoulůžkových
      a 2 třílůžkové pokoje, teplá a studená voda, společná umývárna)
      a restauraci uvádí jako samostatnou službu areálu, ne jako součást
      chaty. Klíč zařazení stojí na občerstvení PRO VEŘEJNOST — jídelna
      pro ubytované hosty ho nenaplňuje a doklad, že se tam najedí
      i kolemjdoucí, žádný pramen nedává. Odloženo, ne vyřazeno: jeden
      dotaz na areál (+420 724 094 487) to rozhodne. Souvisí s otázkou,
      jestli katalogová „Chata na Špičáku" (865 m, ubytování
      i stravování) není právě tenhle areál — neztotožňovat bez pramene.
    rozhodl: samostatná práce 7. 8. 2026 (pověření „pokračuj dvě hodiny samostatně")
    checked: 2026-08-07

  - slug: geisskopfturm
    oblast: sumava
    duvod: >-
      Vyhlídková věž na Geißkopfu (1097 m). Do fronty se dostala s dokladem
      občerstvení „Geisskopfhütte 79 m" — jenže tím dokladem je SAMOSTATNÝ
      dům, a ten byl 7. 8. 2026 povýšen na vlastní profil
      (data/chaty/sumava/geisskopfhutte.yaml). Povýšil se tedy nositel
      služby, ne věž. Sloučit obojí do jednoho profilu jako na Kleti nejde:
      tam pramen výslovně říká, že rozhlednu provozuje táž chata, kdežto
      u Geißkopfu neříká o provozovateli věže žádný pramen nic. Odloženo,
      ne vyřazeno: až se doloží, kdo věž provozuje, buď se sloučí do profilu
      hostince, nebo se povýší zvlášť.
    rozhodl: >-
      Claude (8. 8. 2026, denní bezobslužná session — dopsáno rozhodnutí
      ze 7. 8., které bylo jen v deníku)
    checked: 2026-08-08
  - slug: berggasthof-fritz
    oblast: sumava
    duvod: >-
      Dům v Asbachu u Drachselsried (Asbach 10) se PŘEJMENOVAL a s ním se
      změnil i druh provozu: doména berggasthof-fritz.de dnes přesměrovává
      na hotelderbaeume.de a objekt vystupuje jako „Hotel Fritz — Das
      Hotel der Bäume" (táž adresa i telefon +49 9923 2212). Gastronomický
      katalog speisekarte.de přitom vede starou restauraci „Berggasthof
      Das Fritz" jako „Dieses Restaurant ist dauerhaft geschlossen",
      kdežto regionální portály a rezervační weby nabízejí hotel jako
      fungující. Ani jeden pramen svou zprávu nedatuje a ŽÁDNÝ nedokládá,
      jestli je dnes hospoda přístupná kolemjdoucím, nebo jen hostům
      hotelu — a na tom klíč zařazení stojí. Vlastní web je ze sandboxu za
      schvalovacím gatem. Vzor Kadernbergu: stav objektu je pro plánování
      túry zásadní údaj, nepovyšovat bez pramene s datem nebo telefonátu.
    rozhodl: >-
      Claude (8. 8. 2026, denní bezobslužná session s pověřením „pracuj
      systematicky a autonomně")
    checked: 2026-08-08
  - slug: berggasthof-markbuchen
    oblast: sumava
    duvod: >-
      Objekt v Markbuchen u Sankt Englmar (u paty Predigtstuhlu, 1024 m,
      přímo u vleků Markbuchenlifte) má doložené občerstvení a je dle
      katalogu otevřený — odložen se ale nepovyšuje kvůli NEJISTÉ
      IDENTITĚ. V osadě jsou dva podniky téhož jména: „Berggasthof
      Markbuchen" na adrese Markbuchen 4 (dle baierweg.de provozovatelka
      Sabine Reinhardt) a „Bergsaal Markbuchen", který se dle vlastního
      webu bergsaal-markbuchen.de nachází na Markbuchen 1 (Helga Zollner)
      a je to VÝHRADNĚ pronajímatelný sál pro soukromé akce, ne hospoda
      pro veřejnost. Turistické portály regionu to mají zamotané: svou
      stránku „Bergsaal Markbuchen" vážou na adresu Markbuchen 4 a na
      „Familie Zollner", tedy přesně naopak než vlastní web sálu.
      K tomu tři různá telefonní čísla u Berggasthofu (09965 263 ×
      09965 80078 × 09965 7529831) a tři různé otvírací doby. Povýšit
      profil, u kterého si nejsme jistí, KTERÝ dům popisuje, nelze —
      jeden telefonát to rozhodne (DATA-04).
    rozhodl: >-
      Claude (8. 8. 2026, denní bezobslužná session s pověřením „pracuj
      systematicky a autonomně")
    checked: 2026-08-08
  - slug: berggasthof-hochstein
    oblast: sumava
    duvod: >-
      Dům na Hochfallweg 7 v Drachselsried (místní část Oberried) je
      v katalozích veden jako „Gasthof, Restaurant & Hotel", ale
      občerstvení PRO VEŘEJNOST nedokládá žádný pramen výslovně a nedá se
      dovodit ani z rozvrhu: katalog otvíracích dob u objektu uvádí „Für
      diesen Eintrag sind noch keine Öffnungszeiten hinterlegt." Vlastní
      web berggasthof-hochstein.de je ze sandboxu za schvalovacím gatem.
      K tomu hrubý rozpor v kapacitě: ostbayern-tourismus.de vede šest
      pokojů a jeden apartmán, hotelstay.de dvacet osm pokojů — to není
      rozdíl v čísle, ale v tom, o jak velký dům jde. Výšku domu nevede
      nikdo (hora Hochstein má 1134 m, což je výška vrcholu, ne stavby).
      Odloženo, ne vyřazeno: objekt patřit může, ale profil by dnes stál
      na dohadu. Jeden telefonát na +49 9945 463 to rozhodne (DATA-04).
    rozhodl: >-
      Claude (8. 8. 2026, denní bezobslužná session s pověřením „pracuj
      systematicky a autonomně")
    checked: 2026-08-08
  - slug: burglengenfelder-hutte-scb-hutte
    oblast: sumava
    duvod: >-
      Chata lyžařského klubu Ski-Club Burglengenfeld e. V., kterou klub
      podle vlastní kroniky užívá od roku 1970 („Einzug in die
      Burglengenfelder Hütte (Grafhütte) bei Bayerisch Eisenstein am
      Arber"). Podezření z deníku 7. 8. 2026, že jde o chatu k pronájmu
      členům, se ale NEPODAŘILO ANI POTVRDIT, ANI VYVRÁTIT: web klubu
      chatu zmiňuje jen okrajově a o provozu nemluví, kronika klubu se
      ze sandboxu nenačetla (chyba serveru). Žádný pramen neříká ani
      „Selbstversorger", ani „bewirtschaftet". Odloženo, ne vyřazeno —
      vyřadit objekt bez pramene by bylo domýšlení stejně jako ho
      povýšit. Vedlejší zjištění: objekt stojí v lokalitě Grafhütte
      u Bayerisch Eisenstein pod Velkým Javorem, ne v okolí Prölleru,
      jak jsem při zadávání rešerše předpokládal.
    rozhodl: >-
      Claude (8. 8. 2026, samostatný blok s pověřením „pracuj systematicky
      a autonomně")
    checked: 2026-08-08
  - slug: forsthaus-odwies
    oblast: sumava
    duvod: >-
      OSM ho vede jako útulnu (`wilderness_hut`), ale pramen říká něco
      jiného: portál obce Achslach (načteno 8. 8. 2026) popisuje objekt
      jako lesní chatu pro asi 40 osob, která „wird auch an Privatpersonen
      vermietet" a u které „Derzeit ist nach wie vor leider keine
      Vermietung möglich, da weiterhin ein neuer Pächter gesucht wird."
      Dnes tedy neposkytuje ŽÁDNOU službu — ani hospodu pro veřejnost,
      ani volné přístřeší; správu má bavorská státní lesní správa.
      PROČ SE PŘESTO NEVYŘAZUJE: má DOLOŽENOU TURISTICKOU MINULOST, a to
      je druhá polovina klíče (rozšíření Michala 26. 7. 2026). Portál
      okresu Regen (načteno 8. 8. 2026) uvádí, že bývalé státní myslivecké
      stavení „später auch eine kleine Gastwirtschaft für Wanderer und
      Waldarbeiter unterhielt" a že „Nach dem zweiten Weltkrieg wurde die
      Ödwies verlassen." Hospoda pro turisty a lesní dělníky v polovině
      devatenáctého století je přesně ta role na trase, na kterou se
      rozšířený klíč ptá. Objekt stojí na horské louce mezi Kälberbuckel
      a Hirschensteinem okolo 1030–1065 m (dva prameny se mírně liší).
      OTÁZKA PRO MICHALA: bere rozšířený klíč i objekt, který dnes
      neslouží nikomu, ale jehož turistická minulost je doložená? Podle
      odpovědi se buď povýší s poctivým označením stavu, nebo půjde do
      atlasu zaniklých (P4 / položka „Atlas zaniklých chat").
    rozhodl: >-
      Claude (8. 8. 2026, samostatný blok s pověřením „pracuj systematicky
      a autonomně")
    checked: 2026-08-08
  - slug: hollbachschwellhutte
    oblast: sumava
    duvod: >-
      NOVÝ TYP PŘÍPADU, na který průvodce ještě nemá pravidlo — proto
      odloženo, ne rozhodnuto. Je to malá Selbstversorgerhütte spolku
      Bayerischer Wald-Verein, sekce Zwiesel, na východním svahu Velkého
      Falkensteinu okolo 1000 m; kapacita deset osob (osm v podkroví, dva
      v přízemí) a budova je PAMÁTKOVĚ CHRÁNĚNÁ z konce 19. století —
      doloženo tiskovou zprávou správy Národního parku Bavorský les
      (č. 38/2024 z 13. 6. 2024): „Das denkmalgeschützte Gebäude aus dem
      späten 19. Jahrhundert wird seit Jahrzehnten von der Zwieseler
      Sektion des Bayerischen Wald-Vereins als einfache
      Selbstversorgerhütte genutzt."
      ROZDÍL PROTI VYŘAZENÝM SELBSTVERSORGERŮM: tahle chata není pro
      uzavřenou skupinu ani jen pro členy spolku. Web sekce (načteno
      8. 8. 2026) říká: „Wer die kleine Selbstversorgerhütte gegen
      Entrichtung eines geringen Obulus für Übernachtungszwecke nutzen
      möchte, sollte sich stets rechtzeitig beim Hüttenwart anmelden."
      Tedy KDOKOLI, kdo se předem ohlásí a zaplatí drobný poplatek —
      to je blíž útulně než pronájmu. Zároveň to není volně přístupné
      přístřeší, jak naše definice útulny žádá: bez ohlášení se tam
      nejde, doslovné „unverschlossen" ani „jederzeit zugänglich" žádný
      pramen neuvádí.
      OTÁZKA PRO MICHALA: patří do průvodce spolková chata otevřená
      komukoli PO OHLÁŠENÍ, bez hospody? Je to třída objektů, ne jeden
      případ — v Bavorském lese i v Alpách jich bude víc, takže odpověď
      založí pravidlo. Vedlejší doložený fakt do budoucího profilu:
      provoz byl v roce 2024 dočasně pozastaven kvůli požární bezpečnosti
      a po zásahu správy národního parku obnoven.
    rozhodl: >-
      Claude (8. 8. 2026, samostatný blok s pověřením „pracuj systematicky
      a autonomně")
    checked: 2026-08-08
  - slug: betlejemka
    oblast: vysoke-tatry
    duvod: >-
      KLÍČ ZAŘAZENÍ NESPLŇUJE JEDNOZNAČNĚ, A JE TO POPRVÉ, CO HO OBJEKT
      NESPLŇUJE KVŮLI CHYBĚJÍCÍMU OBČERSTVENÍ, NE KVŮLI POLOZE. Betlejemka
      je Centralny Ośrodek Szkolenia Polskiego Związku Alpinizmu na Hali
      Gąsienicowej v polských Tatrách, kousek od schroniska Murowaniec
      (naměřeno 213 m z GPS obou objektů). Rešerše 9. 8. 2026 našla
      výslovnou větu, která rozhoduje proti zařazení — portalgorski.pl:
      „Pełni ona wyłącznie funkcję szkoły i bazy noclegowej dla taterników.
      Nie prowadzi żadnych usług handlowych, czy gastronomicznych." Žádný
      bufet, žádná restaurace, jen kuchyňský kout pro ubytované
      (betlejemka.pl: „aneks kuchenny wyposażony w garnki i patelnie").
      PROTI VYŘAZENÍ MLUVÍ DVĚ VĚCI. Za prvé je to plnohodnotná horská
      ubytovna na trase — 22 míst na patrových postelích ve společném sále
      a 8 v instruktorském pokoji, celoroční provoz (portalgorski.pl:
      „całorocznej bazie noclegowej dla taterników"). Za druhé NENÍ určená
      jen členům: ceník na betlejemka.pl vede kategorii „goście
      niezrzeszeni" za 82 zł, členové PZA platí 54,94 zł. Přednostní
      rezervaci mají instruktoři a členové klubů, ale volná místa se v
      systému nabízejí komukoli.
      OTÁZKA PRO MICHALA, KTERÁ ZAKLÁDÁ PRAVIDLO, NE JEDEN PŘÍPAD: patří do
      průvodce horská ubytovna bez jakéhokoli občerstvení, otevřená
      veřejnosti za peníze? Je to jiný typ než odložená
      Selbstversorgerhütte z Bavorského lesa (tam jde o ohlášení předem
      a spolkový charakter) — tady je provoz normální, chybí jen kuchyně
      pro veřejnost. Rainerova chata prošla s `kuchyne: ne`, ale měla
      doložený kiosek; Betlejemka nemá ani ten.
      DOLOŽENÁ FAKTA DO BUDOUCÍHO PROFILU, ať se rešerše nemusí opakovat:
      výška 1510 m (pza.org.pl, PTTK Małopolska) × 1514 m
      (portaltatrzanski.pl). Chatu postavila goralská rodina Bustryckých —
      „Postawił je Jędrzej Bustrycki Kasprzak", PTTK klade vznik „około
      1914 r.", polska-org.pl a Głos Wielkopolski na začátek dvacátých let.
      Roku 1936 ji rozšířili Andrzej Kasprzak Bustrycki a Agnieszka
      Bukowska na padesát lůžek; za války zavřená; 1950 převzalo PTTK,
      1959 předalo synům Bukowských. Jméno Betlejemka zavedla roku 1964
      studentská skupina „Międzynarodowe Biuro do Spraw Powiększania
      Wyobraźni" Stanisława Moskala; na začátku sedmdesátých let TPN
      zvažoval demolici, které zabránil Klub Wysokogórski zřízením Szkoły
      Taternictwa. Od roku 1974 je to COS PZA. Budovu má PZA v pronájmu od
      TPN (wspinka.org). Kontakty: betlejemka.pl, rezerwacje@pza.org.pl,
      575 060 608.
    rozhodl: >-
      Claude (9. 8. 2026, samostatný blok s pověřením „pokracuj samostatne
      dal" — rozhodnuto výslovnou větou pramene o absenci gastronomie, ne
      odhadem)
    checked: 2026-08-09
  - slug: golf-tower
    oblast: vysoke-tatry
    duvod: >-
      NEDÁ SE ROZHODNOUT, PROTOŽE SE NEDÁ ZJISTIT, CO TO JE. Uzel OSM nese
      jediný tag (name=Golf Tower) a leží v prostoru golfového rezortu
      Black Stork ve Veľké Lomnici (49.1448 / 20.3851). Cílená rešerše
      9. 8. 2026 (slovensky, česky, anglicky; kombinace s Black Stork,
      Hotel International, Tatragolf, mapové agregátory) nenašla JEDINÝ
      webový pramen, který by objekt popisoval — neví se, jestli je to
      rozhledna, stavba golfového areálu, nebo hotelová věž. Web rezortu
      (golftatry.sk) ani hotelu (international.sk) žádnou věž nezmiňují.
      Nenalezení není vyvrácení: objekt může existovat, jen není webově
      doložen. Rozhodne terén nebo dotaz u provozovatele areálu.
    rozhodl: >-
      Claude (9. 8. 2026, druhý průchod VT-03 — odloženo po vyčerpané
      webové rešerši, ne odhadem)
    checked: 2026-08-09
