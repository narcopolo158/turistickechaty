interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-09) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=hotel (alpine_hut = obsluhovaná, wilderness_hut
  = útulna).

  REŠERŠE ČERTOVICA HOTOVÁ (9. 8. 2026, agent) — V SEDLE JSOU ČTYŘI
  SAMOSTATNÉ UBYTOVACÍ PROVOZY (klíčový pramen sedlocertovica.sk/ubytovanie,
  ©2025, vede je vedle sebe s vlastními kontakty):

  1. CHATA POD ČERTOVICOU (= tenhle kandidát, HUT-0150): Vyšná Boca 259,
  1232 m (travelguide, vypadni; katalogových 1238 je spíš výška sedla),
  u jezírka Kyselka; 40 lůžek/15 pokojů (travelguide) × 33+9 přistýlek
  (sedlocertovica) × 38 × 34 — rozpory; restaurace s barem a krbem,
  specialita grilovaní pstruzi z vlastního jezírka (horehronie.sk);
  wellness (vířivka, finská a aroma sauna), celoročně; provozovatel LBS
  INVEST s.r.o. (1-2-3-ubytovanie); tel. +421 911 306 951, e-mail
  horskachatapodcertovicou@gmail.com, web chatapodcertovicou.sk (starší
  .eu nese titulek „Hotel pod Čertovicou" — týž objekt); oba weby při
  rešerši v redirect smyčce. V provozu (Booking 8,5 / Google 4,5).

  2. PENZIÓN STIV ČERTOVICA (= kandidát stiv-certovica, HUT-0151):
  Vyšná Boca 266, web certovica.sk, STIV Čertovica s.r.o., rodinný
  podnik s vlastním lyžařským areálem (vlek Tatrapoma 450 m); 60 osob,
  od 40 €/os. s polopenzí (2021: od 20 €); restaurace STIV (OSM node
  457955018 je RESTAURACE, penzion je 15 m SV) otevřená po–ne 10:00–17:30
  i veřejnosti; wellness renovováno 2025; v provozu (vleky 1/2026);
  tel. +421 908 551 479, certovica@certovica.sk.

  3. CHATA POD SEDLOM ČERTOVICA (chatacertovica.sk, Vyšná Boca 262,
  GPS 48.9057429/19.7384452) — TŘETÍ SAMOSTATNÝ PROVOZ, v repu NEMÁ
  KANDIDÁTA (nepřišel exportem). 1234 m (web) × 1210 (hiking 2013) ×
  1238 (starý wix web „…/1982"); 34 lůžek + 2 přistýlky (web) × 36
  (sedlocertovica); jídelna 20 míst, snídaně v ceně; ski-in/ski-out,
  200 m od Cesty hrdinov SNP; celoročně, v provozu (Booking 9,3 /
  Google 4,9); tel. +421 903 466 402, chatar@chatacertovica.sk; hiking
  2013: pro hřebenovkáře nocleh ve vlastním spacáku za zvýhodněnou cenu.
  KATALOGOVÝ OBJEKT HUT-0158 „Chata na Čertovici" (1230 m) je téměř
  jistě TENHLE objekt (žádný živý provoz jménem „Chata na Čertovici"
  neexistuje) — ledaže by mířil na historickou CHATU ČERTOVICA (stavba
  1935–36, „první soukromé ubytovací zařízení v Nízkých Tatrách",
  40 lůžek, GPS 48.905959/19.735496) — dnes ZAVŘENÁ RUINA
  (abandonedhotels.eu; vlastní soukromá osoba, pronajímá Čertovica
  s.r.o. dle registrů 2023). Poblíž i ruina „Športhotel Čertovica"
  (po 1989 mafiánské skupiny Černáka, zilinak.sk 1/2025) a archivní
  „Horský hotel TOTEM" (Čertovica 75, Malužiná) — vazby těch tří ruin
  na sebe NENALEZENY, GPS v okruhu ~70 m západně pod sedlem.

  4. DOMČEK HORSKEJ SLUŽBY NA ČERTOVICI (domceknacertovici.sk, Vyšná
  Boca 263) — ČTVRTÝ PROVOZ, v repu NEMÁ KANDIDÁTA. HS na Čertovici od
  1968; bývalá záchranná stanice, přestavba od 2017, pro veřejnost od
  17. 6. 2018 (hiking 5104, teraz.sk); 20 lůžek ve 4 pokojích; ceny
  2025/26 18,40–24,80 €/os. při 3+ nocích, jinak od 20 €; snídaně
  švédské stoly, teplá večeře, vlastní čepované řemeslné pivo; sezónně
  (5–10 + 12–3); OZ Horské spoločenstvo (= Andrejcová; web uvádí
  „Horské spoločenstvo, s.r.o., IČO 50693000" — rozpor formy, ověřit);
  tel. +421 944 929 173, info@domceknacertovici.sk; kemp zdarma,
  pračka, defibrilátor, nabíjení e-bike.

  DALŠÍ: Motorest Čertovica (Jarabá 77, jen strava, spravuje SKI
  Čertovica), Bistro STIV, Apartmány SKI Čertovica. Sedlo 1232 × 1238 m
  (rozpor napříč prameny); bus Liptovský Mikuláš – Brezno staví v sedle;
  Čertovica → Ďumbier 11,6 km / 4:15 / +1078 m. PLÁN: povýšit tenhle
  kandidát + stiv-certovica, založit profily Chaty pod Sedlom Čertovica
  a Domčeku HS z rešerše (kandidáty nemají — vzor katalogových mezer
  Beskyd), HUT-0158 přiřadit Chatě pod Sedlom Čertovica s poznámkou.
  Všechny URL v deníku čtrnáctého bloku nejsou — prameny: sedlocertovica.sk,
  certovica.sk, chatacertovica.sk, domceknacertovici.sk, travelguide.sk,
  hiking 2694/5104/6712/8456, abandonedhotels.eu, zilinak.sk,
  1-2-3-ubytovanie.sk, vypadni.sk, horehronie.sk, poi.oma.sk.
