  REŠERŠE 10. 8. 2026 (fronta „NT Liptov + Opalisko" z 9. 8.) —
  NEPOVÝŠENO, čeká na doklad veřejného občerstvení: hotel s 53 pokoji
  a 191 lůžky u Vrbického plesa v jádru střediska Jasná (domalenka.sk);
  „horský cenovo dostupný hotel s dlhoročnou tradíciou" (relaxos.sk
  se nenačetl celý — anti-bot). Strava popsána jen jako snídaně
  formou bufetu a večeře pro hosty (polopenze); restaurace pro
  neubytované kolemjdoucí NEDOLOŽENA. Třída jizerské Barbory —
  rozhodne Michalův vzor, nebo doklad veřejné restaurace z vlastního
  webu (hotel-liptov.com se nenačetl — neschválené načtení).
  Turistická minulost („dlhoročná tradícia" u Vrbického plesa)
  naznačena, nedoložena konkrétně.

  Typ odvozen z OSM tagu tourism=hotel (alpine_hut = obsluhovaná, wilderness_hut
  = útulna).
