  („kandidaty budoucich oblasti nech a rovnou je zaloz"). Beskydský export
  DATA-01 běžel ještě podle širokého okna, které sahalo na jih k 49.25 a na
  západ k 18.00, a stáhl proto i objekty ze sousedních pohoří. Zúžením okna
  po rozdělení Beskyd a Javorníků objekt z beskydského okna vypadl; oblast
  `zapadne-tatry` byla týž den založena právě pro tyhle kandidáty. Do
  `_vyrazeno.yaml` se ZÁMĚRNĚ nezapisuje: ten seznam se od 8. 8. 2026
  porovnává podle posledního úseku cesty, takže záznam „beskydy/<slug>" by
  objekt umlčel i tady. Nové beskydské okno ho už nezachytí.
  ROZDĚLENÍ MEZI TŘI NOVÉ OBLASTI je provizorní a podle zeměpisné délky
  (hranice 19.14 a 19.48), ne podle pramene o příslušnosti objektu —
  potvrdí ho až triáž.
