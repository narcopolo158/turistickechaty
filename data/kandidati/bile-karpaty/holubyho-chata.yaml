interniPoznamky: >-
  RUČNÍ KANDIDÁT (10. 8. 2026, plošný průzkum mimo hlavní pohoří) —
  vrcholová chata na Veľké Javorine, hraniční hoře CZ/SK; budova
  stojí na SLOVENSKÉ straně (zeme: sk dle běžného uvádění —
  OVĚŘIT!), jméno po J. Ľ. Holubym. Devadesátiny 2014 → 1924,
  prvorepubliková (NEOVĚŘENO). První obyvatel složky bile-karpaty —
  oblast je přeshraniční jako Krušné či Lužické hory. K dotažení:
  strana hranice, provozovatel, restaurace, kapacita, GPS, historie.
