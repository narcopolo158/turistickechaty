  SLABÁ SHODA KATALOGU ROZHODNUTA (10. 8. 2026): katalogová „Chata
  Barborka Klínovec" (1000 m, Loučná pod Klínovcem) NENÍ tenhle objekt
  — Chata Barbora stojí v Českém Jiřetíně, vzdušnou čarou ~45 km
  východně od Klínovce. Katalogová Barborka kandidáta nemá; rešerše ji
  našla v Háji u Loučné (ceskehory.cz, prezentace v archivu):
  „penzion bez obsluhy", 9 pokojů / 24 lůžek, „Restaurace cca 15 m od
  chaty - jen přes silnici" — tedy stravování v CIZÍM objektu přes
  silnici, vlastní občerstvení nedoloženo. Stejná třída jako jizerská
  Barbora (stravování nedoloženo/vázané) — rozhodnutí o povýšení či
  vyřazení čeká na Michalův vzor; do té doby NEZAKLÁDAT.

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).
