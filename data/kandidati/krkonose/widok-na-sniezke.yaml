interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 7. 10. 2026 (šestá fronta koše C3, sedmá dávka) — NÁVRH VYŘADIT,
  a padá na OBOU půlkách klíče.

  Občerstvení pro veřejnost: NENÍ. Vlastní web nabízí samostatné „drewniane
  domki… w pełni wyposażone wraz z zapleczem kuchennym" a hosty výslovně
  posílá jinam: „Możecie Państwo skorzystać i sami przyrządzić posiłek albo
  skorzystać z olbrzymiej ilości restauracji które znajdują się w pobliżu."
  Pronajímají se celé rekreační jednotky (v plánu čtyři domky, zatím tři).
  Source: https://widoknasniezke.pl/ (čteno 7. 10. 2026, verified: false).

  Role na trase: NESPLNĚNA — 811 m k ose modré (Sudecka Droga św. Jakuba),
  0 značených tras do 250 m, rozcestník 12 190 m, tedy nejdál ze všech
  kandidátů dnešní dávky (měření 6. 9. 2026).

  Totožnost: vlastní web uvádí adresu „Łomnica, ul. Karkonoska 112" bez
  souřadnice; OSM bod 50,8623575 / 15,7942615 adresu nenese. Totožnost stojí
  na vlastní doméně z OSM, ne na souřadnici — zapsáno jako slabší.

  POZNÁMKA K OBLASTI (doklad k otázce z 23. 9. 2026 „kandidát daleko od své
  oblasti"): adresa míří do Łomnice v podhůří (gmina Mysłakowice), vlastní web
  si sám počítá „cca 10 km do Karpacze, cca 20 km do Szklarské Poręby".
  Je to třetí takový případ po `pod-zielonym-dachem` (Rudawy Janowickie)
  a `wiilla-jagoda-jagniatkow` z dnešní dávky. NETVRDÍM, kam objekt patří —
  jen zapisuji, že zařazení do `oblast: krkonose` stojí jen na OSM.

  POZNÁMKA K PROVENIENCI: vlastní doména se dnes NAČETLA bez
  `PROVENANCE_REQUIRED` — na rozdíl od `widokowo-karpacz.pl`
  a `sokolponikla.cz` z téže dávky. Vlastní web tedy není nedostupný
  systematicky.
