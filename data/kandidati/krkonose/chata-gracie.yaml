interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 14. 9. 2026 (koš C3, DATA-03) — NEPOVYŠOVAT: prameny
  dokládají pravý opak občerstvení pro veřejnost.
  ceskehory.cz (…/ubytovani/chata-gracie-janske-lazne.html, otevřeno
  14. 9. 2026): prezentace je v archivu — doslova „Objekt v archivu -
  prezentace není aktivní." Titulek objektu zní „Chata Grácie - bývalá
  podniková chalupa", kapacita „29 lůžek", adresa „Luční 139, Janské
  Lázně". O hospodě ani větu; kuchyně je popsána jako vybavení pro hosty:
  „Kuchyně zařízená jak spotřebiči - mikrovlnka, konvice, trouba, myčka -
  tak nádobím". Rozhodující věta: „Pronajímáme pouze celý objekt".
  janskelazne.cz (…/cz/chata-gracie-janske-lazne-77.html, otevřeno
  14. 9. 2026): „horská rekreační chalupa", „Počet pokojů - 7, Počet lůžek
  - 28", stravování jen „vybavená kuchyně s posezením" pro hosty; veřejná
  restaurace zmíněna není.
  Objekt pronajímaný vcelku jedné skupině se samoobslužnou kuchyní NENÍ
  občerstvení pro veřejnost — druhá půlka klíče tedy není doložena a není
  ani v dohledu. Návrh: VYŘADIT (čeká na tvé potvrzení).
  NESHODA ADRESY, nedomýšlet: ceskehory.cz „Luční 139" × janskelazne.cz
  „Cernohorská 265, 542 25 Janske Lazne". Na verdiktu to nic nemění.
  KONTAKTY Z PORTÁLU NEPŘEBÍRAT: „+420 733 645 729", „+420 603 416 095"
  uvádí janskelazne.cz shodně i u Chaty Viktorka — kontakty rezervačního
  portálu, ne objektu.
  K MĚŘENÍ z 6. 9. 2026: silná kombinace (do 50 m od značky, dvě a víc
  značek, rozcestník do 150 m) je tu dána polohou v zástavbě Janských
  Lázní, kde značka vede i obcí. Roli na trase měření nedokládá.
