interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=hotel (alpine_hut = obsluhovaná, wilderness_hut
  = útulna).

  ČTENÍ PRAMENŮ 14. 9. 2026 (koš C3, DATA-03) — NEPOVYŠOVAT: restaurace je
  doložena, ale jen prameny, které samy hlásí konec provozu.
  Firmy.cz vede objekt DVAKRÁT a OBA záznamy jsou NEAKTIVNÍ (otevřeno
  14. 9. 2026): „Hříběcí bouda - restaurace"
  (firmy.cz/detail/13140094-…) — kategorie „České a staročeské restaurace",
  adresa „Strážné 63, 543 52", web „www.hribeci-bouda.cz", GPS
  50,6778852778 / 15,6269380556, a doslova „Tato firma nebo pobočka již
  není aktivní."; „Hříběcí bouda" (firmy.cz/detail/13368077-…) — kategorie
  „Hotely" a „Ubytovací služby", táž adresa, web „hribeciboudy.cz", táž
  věta „Tato firma nebo pobočka již není aktivní."
  IDENTITA POTVRZENA MĚŘENÍM: GPS z Firmy.cz leží 13,6 m od našeho bodu
  (pod prahem TYZ_DUM_M 30 m) — je to týž dům, ne jmenovec.
  Doména `hribeciboudy.cz` se 14. 9. 2026 nedá otevřít: vrací 302 sama na
  sebe (https → http → https), tedy smyčku. Prezentace tak nežije ani na
  vlastním webu.
  Jediná věta o hospodě je z blogu krkonosskeboudy.cz
  (…/2015/07/hribeci-bouda.html, otevřeno 14. 9. 2026): „Součástí boudy je
  restaurace, kde vaří tradičn českou kuchyni" (překlep je v pramenu).
  Týž článek uvádí „800 metrů. nad mořem", „Hříběcí bouda disponuje
  kapacitou 60 lůžek", e-mail „hribecibouda@seznam.cz", telefon
  „+420 606 901 777", web „www.hribecibouda.cz". Článek je z roku 2015
  a o veřejném přístupu do restaurace NEMLUVÍ — proti dvěma neaktivním
  záznamům z Firmy.cz je to pramen starý a slabší.
  Stav provozu je tedy sporný až záporný. Nevyřazuji: jméno, poloha na
  hřebenové cestě i doložená restaurace z objektu dělají kandidáta, který
  si zaslouží dočtení — ale povýšit ho dnes nejde.
  PŘÍŠTĚ ZAČÍT TADY: penziony.cz/strazne/hribeci-bouda/,
  ceskehory.cz/ubytovani/hribeci-bouda-strazne.html a
  pivnidenicek.cz/…/11004-hribeci-bouda (zda vedou provoz jako živý),
  a doména `hribeci-bouda.cz` z neaktivního záznamu — dnes nečteno.

  DOČTENO 15. 9. 2026 — DÁL NEPOVYŠOVAT, verdikt se nezměnil: ani jeden
  z dočtených pramenů nedokládá živou hospodu pro veřejnost, a katalogy
  si navzájem odporují v každém údaji, který se dá porovnat.
  penziony.cz/strazne/hribeci-bouda/ (otevřeno 15. 9. 2026): jediný dnes
  čtený pramen, který se tváří živě — označuje zápis jako „Ověřený zápis",
  uvádí telefon „+420-499 434 187", adresu „Strážné 63, Strážné" a GPS
  50,67782 / 15,62688 (5,7 m od našeho bodu — týž dům). O RESTAURACI TAM
  ALE NENÍ ANI VĚTA; objekt popisuje jako „Penzion Hříběcí bouda".
  ceskehory.cz/ubytovani/hribeci-bouda-strazne.html (otevřeno 15. 9. 2026):
  „Objekt v archivu - prezentace není aktivní." a výslovně „Uvedené údaje
  nemusí být již aktuální". Zmiňuje „stylovou restauraci" bez jediného
  slova o veřejném přístupu. Typ „Penzion", kapacita „45 lůžek",
  nadmořská výška „840 m".
  pivnidenicek.cz/…/11004-hribeci-bouda (otevřeno 15. 9. 2026): „Neznámá
  otevírací doba", poslední komentáře starší devíti let, adresa „Strážné
  62" — o číslo jinak než všude jinde.
  hribeci.hotel.cz/accommodation/ vrací 15. 9. 2026 **HTTP 410 Gone** —
  prezentace byla zrušena, ne jen opuštěna. hportal.cz/cs/strazne/
  hribeci-bouda/ vrací 404. Doména `hribeciboudy.cz` drží smyčku 302
  (https → http → https) i dnes; `hribeci-bouda.cz` se přes vyhledávání
  doložit nepodařilo.
  cztip.cz/cs/8473-hribeci-bouda (otevřeno 15. 9. 2026, bez data vydání):
  opisuje tytéž údaje jako blog z r. 2015 („800 m n. m.", „Hříběcí bouda
  disponuje kapacitou 60 lůžek"), restauraci popisuje jako „česká tradiční
  kuchyně s využitím lokálních zdrojů" a uvádí PEVNÉ ČASY JÍDEL — snídaně
  8:00–9:30, obědy 12:00–14:00, večeře 18:00–19:30. To je rozpis penzionu
  pro ubytované, ne otvíračka hospody; jako doklad veřejného přístupu to
  nestačí. Kontakty „+420 606 040 775", „+420 608 638 576".
  TŘI RŮZNÉ SADY TELEFONŮ napříč prameny (499 434 187 × 606 901 777
  × 606 040 775 / 608 638 576) a ROZPOR V KAPACITĚ I VÝŠCE (45 lůžek /
  840 m × 60 lůžek / 800 m) — obraz zastaralých katalogů, které jeden od
  druhého opisují. Nic z toho se do profilu přebírat nesmí.
  ZŮSTÁVÁ NA TELEFONÁT: identita domu je jistá, poloha na hřebenové cestě
  taky (červená č. 0406 „Luční bouda - Vrchlabí" na 24 m), ale stav
  provozu se z pramenů vyčíst nedá. Otázka pro Michala je v deníku
  15. 9. 2026.
