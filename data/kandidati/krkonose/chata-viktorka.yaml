interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 14. 9. 2026 (koš C3, DATA-03) — OBĚ PŮLKY KLÍČE DOLOŽENY,
  povýšení navrženo, ale visí na tvé otevřené otázce z 5. 9. (bere se
  restaurační záznam jako doklad občerstvení pro veřejnost?).
  POZOR: web z OSM `chataviktorka.cz` už není doména objektu. Firmy.cz,
  záznam „Chata Viktorka" (en.firmy.cz/company/13700878-…, otevřeno
  14. 9. 2026) vede jako web `naseviktorka.cz` a záznam je AKTIVNÍ
  (hláška „no longer active" tam není). Kategorie doslova „Restaurant and
  hospitality services" a „Mountain accommodation", adresa „Černohorská 119,
  542 25 Janské Lázně", otevírací doba „11:00–20:00" (pondělí „Based on
  phone agreement", mimo sezónu restaurace „dle dohody"), telefon
  „+420 604 568 222".
  Druhý, na Firmy.cz nezávislý pramen: Tripadvisor, „Chata Viktorka, Černá
  Hora" (tripadvisor.com/Restaurant_Review-g276240-d32813685-…, otevřeno
  14. 9. 2026) vede objekt v kategorii restaurací, popis doslova
  „Traditional family lodge with bistro", kuchyně „European, Czech, Central
  European, Beer restaurants", otevřeno „11:00 AM - 8:00 PM" denně, dále
  „Table Service", „Takeout", „Outdoor Seating", „Dog Friendly",
  „Wheelchair Accessible". Otevírací doba obou pramenů se shoduje
  (11:00–20:00) a „Takeout"/„Table Service" jsou znaky otevřeného provozu,
  ne stravování v ceně pobytu.
  NESHODA ČÍSLA POPISNÉHO, nedomýšlet: Firmy.cz „Černohorská 119",
  Tripadvisor „Černohorská 26". Před povýšením dohledat, které platí.
  Ubytovací část (janskelazne.cz/cz/chata-viktorka-janske-lazne-44.html,
  otevřeno 14. 9. 2026): „6 pokojů", „22 lůžek" (v textu i „maximální
  kapacita 24 lůžek"), a o hospodě „v přízemí chaty se nachází stylová
  restaurace s TV, kde se podává strava" — tahle věta o veřejném přístupu
  NEMLUVÍ, doklad nesou až Firmy.cz a Tripadvisor.
  KONTAKTY Z PORTÁLU NEPŘEBÍRAT: telefony „+420 733 645 729" a
  „+420 603 416 095" a e-mail „chata-viktorka@janskelazne.cz" uvádí
  janskelazne.cz shodně i u Chaty Grácie — jsou to kontakty rezervačního
  portálu, ne objektu.
  Role na trase je změřena 6. 9. 2026 (zelená č. 4228 na 8 m, dvě značky,
  rozcestník 87 m).
  SOUSEDSTVÍ: `chata-jestrab` leží 60,2 m odtud — nad prahem TYZ_DUM_M
  (30 m), tedy dva domy, ne duplicita. Patří to k tvé otevřené otázce
  ze 4. 9. o 47 metrech.
