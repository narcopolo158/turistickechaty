interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Provozovatel dle OSM: Domandi

  ČTENO 13. 10. 2026 (šestá fronta koše C3, desátá dávka — dočtení fronty) —
  NÁVRH VYŘADIT, padá na půlce občerstvení; role na trase je naopak SPLNĚNA.

  Občerstvení pro veřejnost: NENÍ. Oficiální web provozovatele popisuje
  areál jako tři pronajímané domky s vlastním vařením: „Każdy domek
  wyposażony jest we własną saunę na podczerwień, balię, Wi-Fi i nowoczesną
  kuchnię.", ve výčtu vybavení „nowoczesna kuchnia" a „darmowa woda i kawa",
  v meta popisu „w pełni wyposażoną kuchnią". Restauraci ani bar web
  nezmiňuje; odkaz „KULINARIA" se nenačetl, ale v žádném z pramenů
  nevystupuje jako vlastní provoz. Druhý pramen (katalog) potvrzuje jen
  kuchyňské vybavení domku: varná konvice, lednice, nádobí, „Outdoor dining
  area", čaj a káva.
  Source: https://pl.domandi-living.com/ (čteno 13. 10. 2026,
  verified: false).
  Source: https://domandi-mountain-holiday-lodges.hotels-lower-silesia.com/en/
  (čteno 13. 10. 2026, verified: false).

  Role na trase: SPLNĚNA — 113 m k ose modré Podgórzyn Górny – Przełęcz
  Karkonoska, 1 značená trasa do 250 m, rozcestník 5 698 m (měření
  6. 9. 2026). Na verdiktu to nic nemění, protože klíč chce obě půlky.

  Totožnost: DOLOŽENA ADRESOU, ne souřadnicí — ani jeden pramen GPS
  neuvádí. Shodu nese adresa „4A Droga Do Wodospadu, Przesieka", kterou nese
  i OSM (Droga do Wodospadu 4a), a jméno „Domandi – mountain holiday lodges"
  proti OSM `operator=Domandi`. Pro verdikt o občerstvení to stačí; pro
  povýšení by bylo potřeba souřadnice.

  SHLUK: tenhle jeden pramen čte i `lodge-1`, `lodge-2` a `lodge-3` — viz
  jejich soubory. Web provozovatele mluví o **třech** domcích a Airbnb nese
  jména „Domandi lodge 1" a „Domandi lodge 2"; OSM body Lodge 1/2/3 leží
  17,0–20,0 m od tohoto uzlu. Měření z 6. 9. 2026 u tohoto shluku
  předpovědělo, že „stačí jedno čtení pramene na celý shluk" — dnes to
  poprvé platí doloženě.

  Údaje z pramenů (verified: false): Droga do Wodospadu 4A, 58-563
  Przesieka, gmina Podgórzyn; tři domky, jeden z nich pro 3 osoby
  (1 ložnice, 2 lůžka, 1 koupelna); každý domek má infrasaunu, kádě (balia)
  a Wi-Fi; telefon 733 777 398, e-mail info@domandi-living.com, web
  domandi-living.com. Nadmořskou výšku ani kapacitu celého areálu prameny
  neuvádějí.
