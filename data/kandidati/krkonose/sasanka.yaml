interniPoznamky: >-
  RUČNÍ KANDIDÁT — VRÁCEN Z VYŘAZENÝCH 27. 7. 2026: vyřazení z 21. 7.
  („tereza, sasanka, zvonicka klidne taky") revidováno v DATA-25 bodu (a)
  po Michalově odpovědi na otázku č. 6 („pokud mají restauraci pro
  veřejnost, zvážil bych je") a dokladu Firmy.cz o celodenní restauraci.
  GPS z OSM way/203630802 — převzata z původního kandidáta před vyřazením
  (git historie, commit 7990a87^; při obnově 27. 7. zachycen a opraven
  vlastní omyl: první zápis GPS byl z hlavy — doklad, proč se souřadnice
  VŽDY berou z pramene, nikdy z paměti).

  POZOR: poloha objektu je u lanovky na Hnědý vrch = v/u střediska Pec.
  Před povýšením posoudit i klíčem střediska (Michal, otázka č. 11:
  penziony ve středisku nedávat, výjimka vyhlášená zařízení / samoty /
  zajímavá místa) — tady ale veřejná restaurace klíč občerstvení plní,
  takže o zařazení rozhodne Michal nad tímhle kandidátem.

  K dotažení: vlastní web (Firmy.cz web neuvádí), historie objektu,
  výška, potvrzení restaurace telefonátem (DATA-04: +420 732 138 657
  dle Firmy.cz — jen interně).
