  TRIÁŽ 30. 8. 2026 (koš B, páté čtení) — BEZE STOPY NA WEBU.
  Hledáno: „Horská" jako název restaurace ve spojení s Beneckem a Mrklovem
  (bod leží na 50,6637/15,6151, tedy v okolí Benecka). Výsledky vracejí
  „Horskou chalupu U lyžaře" a obecné články o benecké gastronomii — podnik
  jménem „Horská" mezi nimi není.
  PAST VE JMÉNĚ: „horská" je přídavné jméno, kterým je v Krkonoších pojmenovaná
  každá druhá chalupa a restaurace; jako dotaz je prakticky nepoužitelné.
  Stejně jako u `turisticka-chata` bude příště levnější vyjít z OSM elementu
  (node/2511212760) než z názvu.
  NEVYŘAZUJI: absence dokladu není doklad absence.
