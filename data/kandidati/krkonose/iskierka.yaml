interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Provozovatel dle OSM: Dominika Sadowska

  ČTENO 2026-10-05 (šestá fronta koše C3, pátá dávka podle identifikátoru) —
  NÁVRH VYŘADIT: rekreační domek k samoobslužnému pronájmu, žádné
  občerstvení pro veřejnost.

  KLÍČ ZAŘAZENÍ, PRVNÍ PŮLKA NESPLNĚNA: e-turysta.pl „Obiekt nie
  zadeklarował możliwości zakupu wyżywienia na miejscu", hosté mají k
  dispozici kuchyň k samostatnému vaření; noclegi.pl popisuje kuchyň
  „wyposażona w płytę gazową, lodówkę, czajnik bezprzewodowy" a jídelní
  kout, restauraci ani stravovací službu nezmiňuje ani jeden pramen.
  Odpovídá to OSM tagu `tourism=chalet`.

  ROLE NA TRASE: 100 m k červené Główny Szlak Sudecki (č. GSS), 1 značka do
  250 m, rozcestník 4 413 m (měření 2026-09-06) — role na trase by tedy
  byla, padá to na první půlce klíče.

  TOTOŽNOST NENÍ DOLOŽENA SOUŘADNICÍ — žádný z nalezených pramenů GPS
  neuvádí. Stojí na shodě jména, obce (Lubawka) a ulice; OSM provozovatel
  „Dominika Sadowska" souhlasí s uživatelským jménem inzerenta
  „dominika241188" na e-nocleg.pl. Je to SLABŠÍ doklad než souřadnice a
  zapisuje se jako slabší.

  ROZPOR V ADRESE, obě hodnoty zapsány: „ul. Brzozowa 20" (e-nocleg.pl) ×
  „ul. Brzozowa 33" (e-turysta.pl, noclegi.pl, fajnewczasy.pl,
  czasnawypoczynek.pl — čtyři prameny).

  ROZPOR V KAPACITĚ, obě hodnoty zapsány: „Domek 4-osobowy" (e-turysta.pl) ×
  „maksymalnie 8 gości", 3 ložnice (noclegi.pl).

  HISTORIE / TURISTICKÁ MINULOST (DATA-25): nedoložena, nedomýšlí se.

  Prameny: https://e-turysta.pl/iskierka-lubawka-133175.html ·
