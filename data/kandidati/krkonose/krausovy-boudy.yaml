interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 12. 10. 2026 (šestá fronta koše C3, devátá dávka) — DRŽET, TŘETÍ
  STAV: gastro je doloženo, veřejný přístup nedoložen. Role na trase
  SPLNĚNA. Verdikt čeká na klíč ke třetímu stavu (otázka ze 4. 10. 2026).

  Gastro: DOLOŽENO, ale výslovně jako vybavení pro hosty. První pramen píše
  „Hosté mají k dispozici" a v témže výčtu „dále dvě jídelny, bar, kuchyňka,
  terasa s krásným výhledem na hory". Druhý pramen k tomu přidává „The
  family pension boasts excellent home cooking.", snídaně ANO, polopenzi
  ANO („Half Boarding Service"), plnou penzi NE, a pro větší skupiny
  „a barbecue house for 12-15 people, which can be rented and grilled on an
  open fire". Ani jeden pramen neříká, jestli do jídelen nebo k baru smí
  neubytovaný — a je to u obou jediná mezera.
  Source: https://www.kudyznudy.cz/aktivity/krausovy-boudy-rodinny-penzion-ve-spindlerove-mlyn
  (čteno 12. 10. 2026, verified: false).
  Source: https://www.spindleruv-mlyn.com/en/accommodation/guesthouses/krausovy-boudy-spindleruv-mlyn-labska-krkonose-86/
  (čteno 12. 10. 2026, verified: false).

  Role na trase: SPLNĚNA — 141 m k ose žluté č. 140007 [Ž] Labská přehrada
  hráz. – Pod Černou skálou, 1 značená trasa do 250 m, rozcestník 381 m
  (měření 6. 9. 2026).

  Údaje z pramenů (verified: false): Labská 13, 543 51 Špindlerův Mlýn;
  830 m n. m.; asi 2 km od centra, nad přehradou na Labi; pokoje dvou-,
  tří- a čtyřlůžkové se sprchou, umyvadlem, WC a TV-SAT, počet lůžek
  neuveden; přímo u sjezdovky Labská (ski-in/ski-out), vlek 50 m, lanovka
  Labská 100 m, běžkařské trasy ~300 m; telefony +420 499 433 110
  a +420 733 567 826, e-mail recepce@krausovyboudy.cz, web
  krausovyboudy.cz. Oba prameny shodně popisují penzion jako výchozí bod
  pěších a běžkařských tras po hřebenech (k prameni Labe, na Sněžku) —
  k roli na trase je to podpora v próze, měření ji uzavřelo samo.

  Totožnost: NEDOLOŽENA souřadnicí — ani jeden pramen GPS neuvádí, oba jen
  odkazují na mapu nad adresou. Shodu nese adresa Labská 13, kterou nese
  i OSM, a jméno, které je v Krkonoších unikátní (osada „Labská (Krausovy
  Boudy)" je pojmenovaná po objektu, ne naopak). Pro verdikt o občerstvení
  to stačí; pro povýšení bude potřeba souřadnice.

  Pozn.: jméno nese slovo „boudy" — podle poučky ze 7. 10. to samo o sobě
  není doklad turistické chaty a tady to potvrzuje: jde o rodinný penzion
  u sjezdovky, jehož gastro je (zatím) jen pro hosty.
