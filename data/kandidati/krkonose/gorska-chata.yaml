interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 11. 10. 2026 (šestá fronta koše C3, osmá dávka) — NÁVRH VYŘADIT,
  padá na půlce občerstvení; role na trase je naopak SPLNĚNA.

  Občerstvení pro veřejnost: NENÍ DOLOŽENO — stravování je vázané na hosty.
  Pramen vede objekt jako „dom wypoczynkowy" v kategorii „Ośrodki
  wypoczynkowe" a píše doslova „Dbamy o wyżywienie naszych gości, oferując
  śniadania i obiadokolacje na bazie domowych przepisów" a „W naszej kuchni
  dominują zdrowe i urozmaicone posiłki". Tedy snídaně a obědvečeře pro
  vlastní hosty; restauraci, jídelnu ani hospodu pro kolemjdoucího pramen
  neuvádí — kavárny a puby zmiňuje jen jako okolní zařízení v dosahu pěšky.
  Pokoje pro 2–5 osob s koupelnou, kuchyňka na pokoji není („Na korytarzu
  dostępna jest lodówka dla naszych gości"), vlastní vlek 15 m od domu.
  Source: https://infoturystyka.pl/obiekt/osrodek-gorska-chata.html
  (čteno 11. 10. 2026, verified: false).

  Role na trase: SPLNĚNA — 204 m k ose černé Szlak dokoła Szklarskiej Poręby,
  1 značená trasa do 250 m, rozcestník 3 091 m (měření 6. 9. 2026). Na
  verdiktu to nic nemění, protože klíč chce obě půlky.

  Totožnost: doložena souřadnicí — pramen ≈ 50,8228 / 15,5174 je od OSM bodu
  50,8225907 / 15,5173423 **23,6 m**; adresa ul. Wysoka 1, 58-580 Szklarska
  Poręba sedí. Telefon dle pramene (75) 717 40 40 — v OSM kontakt není.

  Pozn.: plné jméno zápisu je „Ośrodek Górska Chata", OSM nese jen „Górska
  Chata". Slovo „ośrodek" (středisko) v tazích chybí — šestý případ k poučce
  ze 7. 10., že jméno v OSM může kategorii zakrývat.
