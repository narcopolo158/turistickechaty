interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 2026-10-06 (šestá fronta koše C3, šestá dávka podle identifikátoru) —
  NÁVRH VYŘADIT.

  TOTOŽNOST: doložena adresou „Ul. 1 Maja 60 H, Szklarska Poreba" shodnou
  s OSM `addr:street`/`addr:housenumber`; souřadnici neuvádí ani jeden
  načtený pramen, totožnost je proto zapsána jako slabší doklad.

  KLÍČ ZAŘAZENÍ, PRVNÍ PŮLKA NESPLNĚNA — samoobslužný rekreační domek:
  „shared kitchen, as well as a dining area" a „electric kettle,
  a refrigerator, and kitchenware to prepare your own meal"; restaurace
  v objektu žádná, pramen naopak odkazuje mimo objekt — „Pizza King, serving
  a wide range of meals, is a mere 1.2 km away". Pronajímá se celý domek
  („3-bedroom Domek Letniskowy Lesna Chata", 3 ložnice / 2 koupelny).
  Vlastní prezentace objektu se jmenuje „Domek letniskowy Szklarska Poręba
  „Leśna Chata"".

  KLÍČ ZAŘAZENÍ, DRUHÁ PŮLKA (role na trase) SPLNĚNA: 106 m k černé
  „Szlak dokoła Szklarskiej Poręby", 1 značka do 250 m, nejbližší rozcestník
  3 554 m (měření 2026-09-06, scripts/triaz-role-na-trase.ts). Padá tedy na
  gastru, ne na roli na trase.

  VLASTNÍ WEB NENAČTEN: `https://www.chatalesna.pl/` skončil
  na PROVENANCE_REQUIRED (otázka pro Michala z 2026-09-24, položena podesáté).
  Oficiální turistický portál města (turystyczna.szklarskaporeba.pl,
  arch.szklarskaporeba.pl) i booking.com spadly na robots.txt
  (ConnectTimeout / Failed to fetch) — čteno proto ze zrcadla nabídky.

  HISTORIE / TURISTICKÁ MINULOST (DATA-25): nedoložena, nedomýšlí se.

  Prameny: https://domek-letniskowy-lesna-chata.szklarskaporebahotels.com/en/
