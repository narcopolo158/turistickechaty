  Poznámka z katalogu: Luční enkláva nad Pecí.

  ROZHODNUTÍ 25. 7. 2026 — TENHLE KANDIDÁT NENÍ OBJEKT, ale osada. Všechny
  otevřené zdroje popisují Hrnčířské boudy jako boudní enklávu, tedy skupinu
  samostatných stavení, ne jednu chatu: jmenovitě se v ní uvádějí Chata Mír,
  Náchodská bouda, Hájenka a Cihlářka. Profil „Hrnčířské boudy" jako jedné
  chaty by byl fikce a do datasetu nepatří.

  Údaje převzaté z katalogu jsou tím pádem taky nedůvěryhodné: výška 1150 m
  nemá u osady rozprostřené po svahu smysl (každá bouda má svou) a vazbu na
  Malou Úpu se nepodařilo doložit ničím. Nepřenášet je nikam dál.

  NÁVRH MICHALOVI (rozhodnout, nedělám sám): buď (a) kandidáta rozpustit a
  založit místo něj samostatné kandidáty na ty boudy z enklávy, které projdou
  klíčem zařazení (nejnadějnější je Chata Mír), nebo (b) nechat Hrnčířské boudy
  stranou úplně a vést je nanejvýš jako místopisný pojem v textech okolních
  chat. Do té doby soubor NEPOVYŠOVAT a nemazat — nese doloženou rešerši.

  POSOUZENO ZNOVU 26. 7. 2026 POD ROZŠÍŘENÝM KLÍČEM (DATA-25) — VERDIKT
  TRVÁ, NEPOVYŠOVAT. Rozšíření klíče (služba turistům v minulosti stačí)
  na tomhle kandidátovi nic nemění, protože překážkou není služba, ale
  OBJEKTOVOST: Hrnčířské boudy jsou enkláva několika stavení, ne jedna
  chata. Otázka pro Michala (střádá se na konec Krkonoš): rozpustit
  a založit kandidáty jednotlivých bud (Chata Mír, Náchodská bouda — tu
  už jako kandidáta vedeme, Hájenka, Cihlářka), nebo vést enklávu jen
  jako místopisný pojem?

  TRIÁŽ KOŠ E, 31. 8. 2026 — NEMĚŘITELNÉ A VERDIKT DÁL TRVÁ. Kandidát nemá
  GPS, takže dohledávka podle okolí (kterou dnes uzavřel Štumpovku
  a Poštovnu) tu nejde použít; hledání podle jména nevrací v exportech nic,
  což u enklávy nic neznamená — jednotlivá stavení mají vlastní jména.
  Věcně se nemění nic: překážkou není služba turistům, ale OBJEKTOVOST
  (enkláva několika stavení, ne jedna chata), a to je otázka na Michala
  z 25. 7. 2026, ne úkol k dohledání. NEPOVYŠOVAT, NEMAZAT.
