interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-06-12) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=alpine_hut (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  DATA-03 křížové ověření (checked 2026-07-20, verified false; metoda:
  WebSearch — signál z titulků a domén výsledků, obsah stránek NEotevřen,
  není-li u zdroje řečeno jinak): POTVRZENO jako horská bouda: vlastní weby
  medvedi-bouda.cz a medvedibouda.cz („Medvědí bouda — Špindlerův Mlýn“,
  podstránka O nás), heslo na cs.wikipedia.org, ceskehory.cz kategorie „Boudy
  na hřebenech“, kudyznudy.cz. NÁVRH REDAKCI: povýšit (dva weby — ověřit,
  který je aktuální).

  ROZHODNUTÍ 25. 7. 2026 — NEPOVYŠOVAT, objekt NEPROŠEL klíčem zařazení.
  Vlastní web byl tentokrát otevřen a uvádí doslovně: „Naše restaurace je
  v současné době otevřena pouze pro ubytované hosty." a „Ostatním turistům
  bohužel z kapacitních důvodů restaurační služby nenabízíme." Michalovo
  pravidlo (veřejné občerstvení → zařadit; ubytování bez veřejného občerstvení
  → nezařazovat) tím vychází záporně. Návrh „povýšit“ z 20. 7. 2026 se tímto
  RUŠÍ — vznikl jen z titulků, bez otevření webu.

  POZOR na formulaci „v současné době" — jde nejspíš o dočasné opatření, ne
  o trvalé nastavení objektu. Nevyřazovat natrvalo; přeověřit při další revizi
  (nebo telefonátem, DATA-04). Jakmile se restaurace otevře veřejnosti, splní
  bouda klíč zařazení okamžitě a povýšení je připraveno.

  Rozpor v kapacitě k dořešení až při případném povýšení: 110 / 120 / 145 lůžek
  dle různých zdrojů. Nepřenášet žádné z čísel.

  Turistická známka č.1274 (Medvědí bouda) se NENASAZUJE, dokud objekt zůstává
  kandidátem — filtr jeStazitelna (DATA-13) pracuje jen s publikovanými chatami.

  PŘEOVĚŘENO 26. 7. 2026 (Tier 2 master fronty) — STAV TRVÁ, NEPOVYŠOVAT.
  Hlavní stránka medvedi-bouda.cz dnes doslova: „Pro naše ubytované hosty
  nabízíme útulnou horskou restauraci s domácí kuchyní." — restaurace je
  dál jen pro ubytované. Formulace je jiná než citát z 25. 7. („...pouze
  pro ubytované hosty." + kapacitní zdůvodnění) — může jít o jinou
  podstránku nebo o přepis webu; obsahově se ale nic nezměnilo a NErozhoduji,
  která možnost to je. NOVĚ VYTĚŽENO pro budoucí profil: historická věta
  webu doslova „Medvědí bouda se řadí mezi krkonošské horské boudy se
  zajímavou historií. Vznikla na počátku 19. století jako zařízení tzv.
  budního hospodářství, avšak již spojeného s ubytováním pro návštěvníky
  hor." — při případném povýšení připsat webu boudy, nedatovat přesněji,
  než pramen říká („počátek 19. století" není letopočet).
