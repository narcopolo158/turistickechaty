interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Provozovatel dle OSM: Pavel Lepič

  ČTENO 28. 9. 2026 (koš C3, pátá fronta — pořadí podle identifikátoru) —
  NÁVRH: VYŘADIT. Nevyřazuji sám, rozhodne redakce. Nepadá ani jedna půlka
  klíče zařazení.

  Co objekt je: pronájem celého domu, „Pronájmem domu se zabýváme již od roku
  2002", provozovatel Pavel Lepič, Benecko / Štěpanická Lhota — vlastní web
  https://www.bergpoolhaus.eu/cz, čteno 28. 9. 2026. O restauraci ani
  občerstvení web nepíše nic; dům se pronajímá jako celek.

  ROLE NA TRASE (`scripts/triaz-role-na-trase.ts`, 28. 9. 2026): nejbližší
  značka 276 m (červená č. 0431 [Č] Bucharova cesta), **0 značených tras do
  prahu 250 m**, nejbližší rozcestník 630 m. Je to první kandidát páté fronty,
  u kterého měření mluví proti roli na trase, ne jen mlčí.

  VEDLEJŠÍ NÁLEZ — JEDEN DŮM, DVĚ OBCHODNÍ JMÉNA. OSM jméno je „Bergpoolhaus"
  a e-mail `info@luxushaus.cz`; v ubytovacím katalogu týž dům vystupuje jako
  „penzion Luxushaus" (https://www.e-chalupy.cz/ubytovani-stepanicka-lhota-
  penzion-luxushaus-o1237, nalezeno vyhledáváním 28. 9. 2026). Shodu nesou
  e-mailová doména a popis (chalupa s vnitřním bazénem, Štěpanická Lhota);
  souřadnicově ověřená není, proto ji zapisuji jako pravděpodobnou, ne jako
  doloženou.
