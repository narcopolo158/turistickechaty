interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 11. 10. 2026 (šestá fronta koše C3, osmá dávka) — NÁVRH VYŘADIT,
  a padá na ROLI NA TRASE, nikoli na občerstvení. V koši C3 je to první
  kandidát, u kterého je **vlastní restaurace doložená pramenem** a vyřazení
  přesto stojí na druhé půlce klíče.

  Role na trase: NESPLNĚNA — 355 m k ose červené č. 0407 Svoboda nad Úpou –
  Chata Na Rozcestí, 0 značených tras do 250 m, rozcestník 565 m (měření
  6. 9. 2026).

  Občerstvení: TŘETÍ STAV (gastro doloženo, veřejný přístup nedoložen) — tedy
  případ, na který se od 4. 10. 2026 ptám Michala. Regionální katalog uvádí
  doslova „Zinneckerova bouda má vlastní restauraci, kde probíhají snídaně,
  nabízí však i možnost celodenního stravován[í]", kapacita 30 lůžek v 10
  pokojích, nadmořská výška 1 100 m, objekt přímo u sjezdovky Černé hory asi
  1,2 km od horní stanice lanovky. Jestli je restaurace otevřená i
  neubytovanému kolemjdoucímu, pramen neříká — a NEDOMÝŠLÍ SE.
  Source: https://www.hkregion.cz/dr-cs/103157-zinneckerovy-boudy.html
  (čteno 11. 10. 2026, verified: false).

  Druhý pramen třetí stav nezavřel, ale zúžil: firemní zápis vede objekt
  v kategorii „horské ubytování a horské chaty a chalupy", NE mezi
  restauracemi, a popisuje ho jako „rodinný penzion" s větou „V penzionu je
  restaurace s bezdrátovým připojením k internetu." Otevírací doba uvedena
  není. **Zápis je navíc označen „Tato firma nebo pobočka již není aktivní."**
  — to je údaj o firemním zápisu, ne doklad, že objekt neprovozuje; stav
  provozu z toho NEVYVOZUJEME.
  Source: https://www.firmy.cz/detail/13070841-zinneckerovy-boudy-janske-lazne.html
  (čteno 11. 10. 2026, verified: false).

  Totožnost: doložena souřadnicí dvakrát a těsně — katalog 50°38'39,14" N /
  15°45'44,61" E je od OSM bodu 50,6441592 / 15,7622834 **9,2 m**, firemní
  zápis 50,644203 / 15,762330 **5,9 m**. Adresa Horská 129, Janské Lázně,
  542 25 sedí v obou pramenech.

  Vlastní doména `zinneckerovy-boudy.cz` (z OSM) se nečetla — skončila na
  `PROVENANCE_REQUIRED` (otázka pro Michala z 24. 9. 2026). Právě ona by
  třetí stav pravděpodobně zavřela: na webu bývá otevírací doba restaurace.
