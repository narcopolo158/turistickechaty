interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 12. 10. 2026 (šestá fronta koše C3, devátá dávka) — BEZ VERDIKTU,
  DRŽET: jediný dohledaný pramen neuzavírá totožnost a o občerstvení mluví
  čtyřmi slovy. Je k tomu ale telefon, takže kandidát patří k telefonicky
  rozhodnutelným (DATA-04).

  Jediný pramen je firemní rejstřík: „Chata Jasanka", Špindlerův Mlýn,
  Labská 5, 543 51; obor „Horské chaty a chalupy" v rámci ubytovacích
  služeb, popis celkem „Chaty k pronájmu", telefon +420 603 531 754, web
  žádný, o stravování ani otevírací době ani slovo.
  Source: https://www.firmy.cz/detail/13730991-chata-jasanka-spindleruv-mlyn-labska.html
  (čteno 12. 10. 2026, verified: false).

  Proč se verdikt NEVYVOZUJE: (a) totožnost není doložena — bod rejstříku
  50,718340 / 15,573384 je od OSM bodu 50,7188023 / 15,5746403 **102,3 m**
  a číslo v ulici si prameny odporují (OSM „Labská 7" × rejstřík „Labská 5"),
  takže zápis může patřit sousednímu objektu téže ulice; (b) i kdyby patřil
  témuž domu, „Chaty k pronájmu" je zařazení, ne údaj o občerstvení.
  Vyřazení naslepo by stálo na čtyřech slovech u nejistě přiřazeného zápisu.

  Role na trase: SPLNĚNA — 245 m k ose žluté č. 140007 [Ž] Labská přehrada
  hráz. – Pod Černou skálou, 1 značená trasa do 250 m, rozcestník 478 m
  (měření 6. 9. 2026). Kandidát je tedy 5 m pod prahem 250 m.

  Ověřeno, že NEJDE o „Chatu U jasanu": pramen ceskehory.cz vede objekt
  toho jména na Labské 37 s bodem 50,705362 / 15,579221, tedy **1 528,9 m**
  od našeho bodu, a výslovně píše „Pronajímáme POUZE celý objekt, nevaříme
  a neobsluhujeme." Jiný dům, jiný verdikt — nepřebírá se.

  Pozn. ke jménu: „Chata Jasanka" nese i objekt v Rybníku ve východních
  Čechách (katalogy turistika.cz a e-chalupy.cz, ID 2841) — mimo Krkonoše,
  ale ve vyhledávání to zakrývá našeho kandidáta.
