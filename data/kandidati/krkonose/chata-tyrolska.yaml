interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Provozovatel dle OSM: FAST-FOOD Anna Adamczuk

  TRIÁŽ 29. 8. 2026 (koš B, čtvrté čtení) — občerstvení doloženo,
  ale je to stánek u nástupu na lanovku, ne chata na trase.
  Oficiální turistický portál města
  (https://turystyczna.szklarskaporeba.pl/en/2948-szklarskaporeba-chata-tyrolska)
  ji vede na adrese „ul. Turystyczna 25A, 58-580 Szklarska Poręba" jako
  „mała gastronomia" a polohu popisuje doslova: „Small gastronomy near to
  the lower station of the lift to Szrenica". Nabídku ani otvírací dobu
  pramen neuvádí. OSM tag „FAST-FOOD Anna Adamczuk" s tím sedí.
  Klíč: OBČERSTVENÍ PRO VEŘEJNOST doloženo, ROLE NA TRASE sporná — dolní
  stanice lanovky na Szrenicu JE nástupní bod na hřeben, ale objekt sám
  stojí v zástavbě střediska a žádný pramen ho neváže na značenou cestu.
  Je to týž typ hraničního případu jako mísečkový shluk, jen na polské
  straně: nástup do hor × služba střediska.
  → NEPOVYŠOVAT bez rozhodnutí o klíči střediska; sklon spíš NE, protože
  jde o stánek, ne o boudu.
