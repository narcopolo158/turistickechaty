interniPoznamky: >-
  RUČNÍ KANDIDÁT — založen 26. 7. 2026 při triáži DATA-22 (položka 2540
  oficiálního seznamu známkových míst vydavatele; objekt v korpusu dosud
  nebyl). Klíč zařazení splněn: veřejnou restauraci dokládá web obce
  doslovnou větou „pro veřejnost slouží restaurace".

  ZNÁMKA č. 2540 „Modrokamenná Bouda, Krkonoše": v oficiálním seznamu
  vydavatele (DATA-22). Na rozdíl od Rezku a Dvoraček tu název známky
  jmenuje přímo boudu, vazba tedy vypadá přímá — ale kde se známka
  prodává, doloženo nemáme; před tvrzením v próze ověřit u vydavatele
  (podmínka DATA-22: seznam je seznam prodejen, ne objektů).

  ROZPORY vedené v overeni blocích: výška 787 m (web obce) × 790 m
  (krajský katalog) — nerozhodnuto. POZOR na kvalitu pramenů: web obce má
  rozbité kódování (citace rekonstruovány), vlastní web boudy se ze
  sandboxu vůbec nenačte (smyčka přesměrování) a krajský katalog je
  nejspíš týž rejstřík, který kraj množí do víc katalogů — skutečně
  nezávislé prameny jsou tu zatím dva.

  K dotažení před povýšením: vlastní web boudy (restaurace — otvírací
  doba a potvrzení veřejné přístupnosti z první ruky, historie „150 let",
  provozovatel, kontakty), GPS proti OSM/mapě, rok vzniku a historie
  (žádný načtený pramen nenese), fotky (Commons — DATA-02 běh po
  povýšení). Při povýšení napsat článek rovnou (konvence DATA-14)
  a přiznat rozpor výšek.
  ČÍSLO ZNÁMKY VYŘEŠENO (Michal, 27. 7. 2026, odpověď na otázku č. 15): platí 2540
  (oficiální seznam vydavatele); dřívější zápis kotouče jako 2640 byl omyl.
