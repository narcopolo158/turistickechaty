# Modrokamenná bouda — RUČNÍ KANDIDÁT (založen z triáže DATA-22, NE z OSM
# exportu DATA-01). Položka 2540 oficiálního seznamu známkových míst
# vydavatele; v korpusu dosud nebyla vůbec. Klíčem zařazení prochází:
# veřejnou restauraci dokládá web obce Janské Lázně doslovnou větou.
# Založila session 26. 7. 2026. Vše verified: false — na web povyšovat
# až po dotažení. Nic nedomýšlet!

nazev: Modrokamenná bouda
slug: modrokamenna-bouda
zeme: cz
oblast: krkonose
typ: obsluhovana
obec: Janské Lázně # obě adresy (web obce i krajský katalog) — poštovní pramen, sémantika pole se řeší v DATA-20
# ROZPOR VÝŠKY, zatím nerozhodnutý: web obce píše „ve výšce 787 m.n.m.",
# krajský katalog vede „Nadmořská výška: 790 m". Obojí je o boudě, takže
# na rozdíl od Poštovny to rozpor JE — pole nese katalogovou hodnotu,
# při povýšení přiznat v próze.
vyska: 790
kapacita: 50 # krajský katalog: „Celková kapacita lůžek: 50" (verified:false)
pokoje: 15 # krajský katalog: „Celkový počet pokojů: 15" (verified:false)

# GPS záměrně NEvyplněna do polí: krajský katalog ji uvádí (viz
# overeniLokace), ale bez vlastního ověření ji nepřebíráme — doplnit při
# povýšení proti OSM/mapě, ať nesedíme na jediném katalogu.

