  ČTENÍ PRAMENŮ 3. 9. 2026 (koš C1, DATA-03) — NEPOVYŠOVAT bez dalšího
  pramene; občerstvení doloženo jen pro ubytované.
  infoturystyka.pl/obiekt/amelkowa-chata_10393.html (otevřeno 3. 9. 2026):
  adresa „Przełęcz Okraj 3, 58-530 Kowary", telefon „+48 697 696 555"
  (shoda s OSM), pokoje „wygodnymi pokojami 2-, 3- i 4-osobowymi",
  stravování „tradycyjną polską kuchnię serwowaną w restauracji"
  v režimu BB/HB, ceník na rok 2026 (záznam je tedy živý). Restaurace je
  v pramenu popsána jako součást pobytu, ne jako otevřený provoz;
  o veřejném přístupu žádná věta. („parking wyłącznie dla gości" je
  o parkování, ne o hospodě — nedomýšlet z toho uzavřený provoz.)
  Neprozkoumáno: `chatynaokraju.com.pl`, na který infoturystyka odkazuje
  jako na stránky objektu — příště začít tam.
  Poznámka k měření z 2. 9. 2026: devět značených tras do 250 m je dáno
  polohou u Przełęcze Okraj (hraniční uzel), tedy hustotou tras v uzlu.
  Roli na trase to podpírá, ale druhou půlku klíče nenahrazuje.
