interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 3. 9. 2026 (koš C1, DATA-03) — NEPOVYŠOVAT bez dalšího
  pramene; občerstvení doloženo jen pro ubytované.
  infoturystyka.pl/obiekt/amelkowa-chata_10393.html (otevřeno 3. 9. 2026):
  adresa „Przełęcz Okraj 3, 58-530 Kowary", telefon „+48 697 696 555"
  (shoda s OSM), pokoje „wygodnymi pokojami 2-, 3- i 4-osobowymi",
  stravování „tradycyjną polską kuchnię serwowaną w restauracji"
  v režimu BB/HB, ceník na rok 2026 (záznam je tedy živý). Restaurace je
  v pramenu popsána jako součást pobytu, ne jako otevřený provoz;
  o veřejném přístupu žádná věta. („parking wyłącznie dla gości" je
  o parkování, ne o hospodě — nedomýšlet z toho uzavřený provoz.)
  Neprozkoumáno: `chatynaokraju.com.pl`, na který infoturystyka odkazuje
  jako na stránky objektu — příště začít tam.
  Poznámka k měření z 2. 9. 2026: devět značených tras do 250 m je dáno
  polohou u Przełęcze Okraj (hraniční uzel), tedy hustotou tras v uzlu.
  Roli na trase to podpírá, ale druhou půlku klíče nenahrazuje.

  ČTENÍ VLASTNÍHO WEBU 4. 9. 2026 (chatynaokraju.com.pl) — VÝSLEDEK STEJNÝ,
  KLÍČ DÁL NEDRŽÍ. Stránka objektu
  (https://chatynaokraju.com.pl/amelkowa-chata/, otevřeno 4. 9. 2026) mluví
  o kuchyni jako o součásti pobytu: „wyśmienita, tradycyjna polska kuchnia
  w naszej restauracji", pokoje „2, 3 i 4 osobowe z łazienkami", cena
  „od 100 zł za osobę/doba", poloha „Przełęcz Okraj", 12 km od Kowar.
  Žádná věta o hospodě pro kolemjdoucí. Telefon ani e-mail stránka neuvádí.
  Prošel jsem i všechny tři stránky s recenzemi (opinie-gosci-1/-2/-3):
  jídlo se v nich chválí opakovaně, ale VŽDY v souvislosti s pobytem
  (snídaně, obiadki, „wygodne łóżka"). Ani jedna recenze nepopisuje zastávku
  jen na jídlo bez noclehu.
  METODICKÁ VÝSTRAHA K TOMUHLE ZÁZNAMU: první shrnutí stránky mi podstrčilo
  citaci recenze „Byliśmy dziś na zupce i naleśnikach po zejściu ze szlaku",
  která by přesně tou chybějící půlkou klíče byla — a cílené dohledání
  ve všech třech stránkách recenzí ukázalo, že taková věta na webu NENÍ.
  Byla vymyšlená. Doslovné citace proto vždy dohledat druhým, adresným
  dotazem na tutéž stránku; shrnutí není pramen.
