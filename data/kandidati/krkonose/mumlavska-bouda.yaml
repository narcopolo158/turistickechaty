interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Otvírací doba dle OSM (surový formát, neověřeno): Mo-Su 10:00-17:00

  TRIÁŽ 29. 8. 2026 (koš B, čtvrté čtení) — NEJSILNĚJŠÍ KANDIDÁT DNE, obě
  půlky klíče doložené a k tomu doložená historie.
  ROLE NA TRASE: krkonosskeboudy.cz
  (https://www.krkonosskeboudy.cz/2015/02/mumlavska-bouda.html) ji klade
  k Mumlavskému vodopádu, „nejvodnatějšímu v celých Krkonoších
  spadajícímu z výšky osmi metrů" — tedy k nejnavštěvovanějšímu cíli nad
  Harrachovem. (Souřadnice kandidáta i vodopádu to podporují, doloženou
  vzdálenost ale nemáme, proto se sem nepíše.)
  OBČERSTVENÍ: týž pramen popisuje současný provoz jako restauraci
  s omezeným jídelním lístkem (kachna, řízek, palačinky, bramboračka)
  a uvádí zavírání kolem 17:00 — což se NEZÁVISLE shoduje s OSM tagem
  Mo-Su 10:00-17:00.
  HISTORIE (jediný pramen, neověřeno): založil hrabě Harrach roku 1879
  jako občerstvení pro exkurzi českého lesnického spolku; Jaroslav Durych
  ji roku 1899 popisuje jako letní místo setkávání pražské společnosti;
  roku 1909 vyhořela za majitele Franze J. Erlebacha a byla obnovena;
  v 90. letech zavřená a zanedbaná.
  POZOR — POLE `nocleh` NEVYPLŇOVAT: pramen píše, že dnes ubytování
  patrně není, ale netvrdí to doložitelně. Stejný postup jako
  u Wysokiego Kamienia 28. 8.

  VZOR „samostatný záznam restaurace na Firmy.cz" SE TU POPRVÉ ROZPADL,
  a je dobré vědět jak: záznam „Restaurace Mumlavská Bouda"
  (https://en.firmy.cz/company/12954988-restaurace-mumlavska-bouda-harrachov.html)
  je NEAKTIVNÍ („This business or branch is no longer active"), zatímco na
  téže adrese Harrachov 270 běží aktivní záznam „Mumlavská Bouda"
  (https://en.firmy.cz/company/13124215-mumlavska-bouda-harrachov.html).
  Existence samostatného záznamu tedy nestačí — musí se číst i jeho stav.
  → NÁVRH POVÝŠIT (k ruční kontrole; historii přebírat s výhradou jediného
  pramene).
