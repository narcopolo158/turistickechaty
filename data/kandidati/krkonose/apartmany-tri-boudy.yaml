interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=hotel (alpine_hut = obsluhovaná, wilderness_hut
  = útulna).

  Provozovatel dle OSM: Mountain life hospitality, s.r.o.

  ČTENÍ 23. 9. 2026 (třetí fronta koše C3 — kandidáti označení lexikonem
  jména, přísná varianta) — BEZ VERDIKTU, pramen se nenašel. Třetí případ
  „není co číst" (po `chata-u-kohouta` 21. 9. a `chalupa-u-rihu` dnes),
  ale z jiné příčiny: pramen nejspíš existuje, jen se k němu nedostaneme.

  Co se zkoušelo: vlastní web z OSM triboudy.cz (WebFetch:
  PROVENANCE_REQUIRED — přímé načtení domény by chtělo Michalovo svolení,
  neobcházeno; vzor lovrana.eu z 21. 9.). Tři dotazy do vyhledávače
  (jméno + Benecko, jméno + provozovatel „Mountain life hospitality,
  s.r.o." z OSM, samotná doména) nevrátily jediný katalogový zápis tohohle
  objektu — jen jmenovce typu „Apartmány Benecko".

  Jméno i OSM tag `tourism=hotel` ukazují na ubytovací provoz, ale doklad
  chybí oběma směry.
