interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 19. 9. 2026 (druhá fronta koše C3, 10. místo) — NÁVRH DRŽET (NEVYŘAZOVAT),
  obě půlky klíče mají pramen, chybí jen doklad dnešního provozu. Adresa
  ul. Św. Anny 3, 58-564 Sosnówka; objekt stojí u kaple sv. Anny na
  Grabowci.

  Prameny (nalezeno přes WebSearch, čteno 19. 9. 2026): (1) KarkonoszeGO
  https://karkonoszego.pl/artykul/kaplica-sw-anny-w-sosnowce/1015416
  (21. 6. 2020) doslova: „W bezpośrednim sąsiedztwie znajduje się Dom pod
  Jaworami. Gospoda i przytulny pensjonat z 12 miejscami noclegowymi, oraz
  Domek Myśliwski." (2) Trasa dla Bobasa
  https://www.trasadlabobasa.pl/tab/miejsce/kaplica_sw._anny_i_dobre_zrodlo_na_grabowcu_w_sosnowce/378
  — „leśniczówka z noclegami i bufetem: Domek Myśliwski - Dom Pod Jaworami";
  ke kapli podle téhož pramene vede pět značených cest (modrá z Borkowa
  a z Miłkowa, žlutá ze Sosnówky a z Karpacza Górného, červená — Główny
  Szlak Sudecki — z centra Karpacza). (3) e-turysta.com
  https://e-turysta.com/dom-pod-jaworami-niedaleko-karpacza-sosnowka-144209.html
  — dům k pronájmu na dny a „Next to the cottage is a historic inn where, in
  addition to catering services, we offer rooms with bathrooms for PLN 125
  per person per night." (4) Nocowanie.pl
  https://www.nocowanie.pl/noclegi/karpacz/domki/127371/ — „Obiekt oferuje
  wyżywienie dla gości", nabídka na portálu je teď nedostupná.

  Co chybí: doklad, že gospoda/bufet je DNES otevřený pro kolemjdoucí.
  Prameny s gospodou jsou z roku 2020 nebo bez data; web z OSM
  dompodjaworami.pl se zacyklí v přesměrování (https→http), infoturystyka.pl
  vrací 403. Kandidát k telefonátu (+48 608 521 761 dle OSM, neověřeno).
  Typ z OSM (tourism=chalet) popisuje jen pronajímaný dům, ne gospodu.
  Pozn.: e-turysta uvádí „historic inn"; stáří ani historii budovy prameny
  nedokládají, proto se nezapisuje.
