interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Otvírací doba dle OSM (surový formát, neověřeno): 10:00-20:00

  TRIÁŽ 29. 8. 2026 (koš B, čtvrté čtení) — HLEDÁNO, NIC NENALEZENO.
  Dotaz na „Zielona Chatka" v Karkonoszích vrátil jen výsledky k jiné
  a mnohem známější Chatě Karkonoské v Karpaczi; k tomuhle objektu
  nevede ani jeden.
  Souřadnice 50,7921 / 15,9346 leží ve VÝCHODNÍM okraji okna, tj.
  v okolí Kowar — daleko od Karpacze i Szklarské Poręby, kde se polská
  gastronomie dokládá snadno. To samo o sobě nic neříká, ale vysvětluje,
  proč portály typu visitkarkonosze nebo turystyczna.szklarskaporeba
  o něm mlčí.
  Jediné, co máme, je název s předponou „Bar" a OSM otvírací doba
  10:00–20:00. To je signál občerstvení, ne doklad — a role na trase
  nedoložená vůbec.
  → NEROZHODNUTO, doklad chybí. Nevyřazovat.
