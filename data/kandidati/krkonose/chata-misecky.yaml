interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Otvírací doba dle OSM (surový formát, neověřeno): Mo-Su 11:00-22:00

  TRIÁŽ KOŠ B — křížové ověření (checked 2026-08-27, WebSearch + otevřené
  stránky, vše verified: false):

  Občerstvení pro veřejnost DOLOŽENO. Firmy.cz vede AKTIVNÍ samostatný záznam
  „Restaurace - Chata Mísečky" v oboru Restaurační a pohostinské služby,
  adresa „Vítkovice 143, 512 38", popis „Nabídka občerstvení. Možnost posezení
  na zahrádce.", otvírací doba 11:00–22:00 denně, hodnocení ze srpna 2026
  (shoduje se s OSM tagem Mo-Su 11:00-22:00). Přístup neubytovaných dokládá
  nepřímo, ale konkrétně ceskehory.cz: „V přízemí jsou 4 samostatná WC s
  umyvadélky (pro ubytované a hosty restaurace)" — pramen tedy s hosty
  restaurace zvlášť počítá.

  Poloha a identita: „Chata Mísečky (bývalá Selekta) se nachází v malebném
  krkonošském středisku Horní Mísečky, ve výšce 1000 m n.m." (ceskehory.cz).
  Dřívější název Selekta je nový údaj, jinde ho zatím nemáme.

  Role na trase NEDOLOŽENA přímo. Prameny mluví o středisku a sjezdovkách: „V
  těsné blízkosti sjezdový i běžecký ski areál Horní Míšečky a Medvědín." Že
  přes Horní Mísečky vede nástup na Zlaté návrší, žádný z přečtených pramenů u
  této chaty nepíše — a nedomýšlíme to.

  SPORNÉ S KLÍČEM, a je to táž třída jako Sasanka: klíč občerstvení splněný,
  visí to na KLÍČI STŘEDISKA. Rozdíl proti Vítkovicím a Rokytnici (Sasanka,
  Chata Eliška, Hubertka) je, že Horní Mísečky nejsou obec, ale horská osada v
  1000 m na hřebenovém nástupu. Rozhodnutí je Michalovo — a rozhodne rovnou i
  sousední Chatu Stopa (viz níž) a Jilemnickou boudu.
