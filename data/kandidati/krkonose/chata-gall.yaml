interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 11. 10. 2026 (šestá fronta koše C3, osmá dávka) — NÁVRH VYŘADIT na
  ROLI NA TRASE; půlka občerstvení zůstala NEPŘEČTENÁ, protože se nenačetl
  žádný pramen.

  Role na trase: NESPLNĚNA — 296 m k ose žluté [Ž] Nad Dolním Dvorem –
  Klínovka, 0 značených tras do 250 m, rozcestník 874 m (měření 6. 9. 2026).
  Verdikt stojí jen na tomhle; o občerstvení netvrdíme nic.

  Občerstvení: NEDOLOŽENO ANI VYLOUČENO. Jediný dohledaný pramen je záznam
  „Rekreační středisko — chata GALL" v encyklopedii rezervačního systému
  (objekt id=7219) — a ten je **týž záznam servírovaný třemi doménami**
  (`21.oblast.cz`, `pernikova-chaloupka.cz`, `cyklotrasy.cz`), přičemž všechny
  tři odmítly čtení s `ROBOTS_DISALLOWED`. Zrcadla nepomohou, když je pod nimi
  jeden stroj. Robots odmítly i `ubytovani.top99.cz` a `dolnidvur.cz`.
  Ve firemním rejstříku (firmy.cz) objekt pod tímto jménem v Dolním Dvoře
  **není** — rejstřík zná v obci Chatu u Jirky (a zvlášť její restauraci),
  Chatu Kubík, Baronku, Maty, Mediku a Chalupu Dolní Dvůr, ne Gall.

  Totožnost: NEDOLOŽENA — žádný čitelný pramen, souřadnici tedy není proti
  čemu měřit. Telefon +420 499 432 166 z OSM objekt neidentifikuje (vyhledávač
  ho vede jen na `dolnidvur.cz`, který robots odmítl).
