interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 2026-10-05 (šestá fronta koše C3, pátá dávka podle identifikátoru) —
  NÁVRH VYŘADIT: pronájem celého objektu, vlastní kuchyň, žádné občerstvení
  pro veřejnost.

  TOTOŽNOST DOLOŽENA SOUŘADNICÍ: e-chalupy.cz uvádí 50,740000278 /
  15,489385556 — od bodu kandidáta (50,7399772 / 15,4893555) asi 3 m. Druhý
  nejtěsnější doklad totožnosti dosud (po 2 m u `chata-kubik`).

  KLÍČ ZAŘAZENÍ, PRVNÍ PŮLKA NESPLNĚNA, A PRAMEN JI ROVNOU VYLUČUJE:
  „Vlastní nová kuchyň, případně několik restaurací v docházkové
  vzdálenosti" (e-chalupy.cz jmenuje Kokrháč 150 m, Kamínek 800 m, Dvoračky
  2 500 m — všechno cizí objekty, nepřipisují se). Objekt se pronajímá celý:
  „Objekt se pronajímá celý - po dobu pobytu ho budete mít jen pro sebe."
  turistika.cz uvádí cenu „celoročně 55.000kč" za týden pronájmu. Veřejné
  občerstvení v objektu tedy není.

  ROLE NA TRASE: 93 m k žluté č. 7308 [Ž] Rokytnice – Rezek, 1 značka do 250
  m, rozcestník 641 m (měření 2026-09-06). Na vyřazení nepadá tady.

  ADRESA: Rokytno 54, Rokytnice nad Jizerou. KAPACITA: až 20 osob v 7
  ložnicích (e-chalupy.cz i turistika.cz se shodují). Výška 750 m z OSM se
  pramenem nepotvrzovala ani nevyvracela.

  HISTORIE / TURISTICKÁ MINULOST (DATA-25): nedoložena. e-chalupy.cz píše
  jen „Objekt je u nás už 10 let", což je délka inzerce, ne rok vzniku domu
  — nedomýšlí se z toho nic.

  Prameny: https://www.e-chalupy.cz/rokytnice-nad-jizerou-chata-
  votocka-o8503 · https://www.turistika.cz/chaty-chalupy/detail/chata-
