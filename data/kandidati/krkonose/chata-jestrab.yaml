interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 14. 9. 2026 (koš C3, DATA-03) — NEPOVYŠOVAT: objekt nemá
  dohledatelnou vlastní prezentaci a pramen o občerstvení není žádný.
  Web z OSM `plus.google.com/108159705772761019533/about` je MRTVÝ odkaz —
  Google+ skončil v roce 2019, takže kontakt v OSM je starší než sedm let
  a o dnešním stavu nevypovídá.
  Vyhledávání 14. 9. 2026 na „Chata Jestřáb" + Krkonoše / Janské Lázně
  nevrátilo k tomuhle bodu ani jeden pramen. Co vrátilo, jsou dvě JINÉ
  věci a ani jednu z nich sem NEPŘEPISOVAT:
  (1) JMENOVEC: „Chata Jestřáb" v Hlinsku na Vysočině (chatajestrab.cz,
  firmy.cz/company/13184829-…) — jiný kraj, ~130 km daleko.
  (2) JINÝ OBJEKT V JANSKÝCH LÁZNÍCH: „Apartmánový dům Jestřáb"
  (apartman-janskelazne.cz/apartmanovy-dum/, otevřeno 14. 9. 2026), podle
  vlastního webu „postaven v roce 2017 v moderním stylu", „90 metrů od
  lyžařského vleku – kabinky na Černou Horu", s výtahem, vyhřívanou
  lyžárnou a krytou garáží; o restauraci, hospodě ani občerstvení pro
  veřejnost tam není věta. Že jde o TENTÝŽ dům jako OSM uzel 2398705798
  (tourism=guest_house), ale DOLOŽENO NENÍ — shoduje se jméno a obec,
  nic víc. Nesměšovat, dokud to nepotvrdí pramen se souřadnicí nebo adresou.
  SOUSEDSTVÍ: `chata-viktorka` leží 60,2 m odtud (nad prahem TYZ_DUM_M
  30 m — dva domy, ne duplicita). U Viktorky je hospoda doložena, tady ne;
  doklad od sousedního domu se sem NEPŘENÁŠÍ.
  K MĚŘENÍ z 6. 9. 2026: silná kombinace je dána polohou v zástavbě
  Janských Lázní, kde značka vede i obcí — roli na trase nedokládá.
