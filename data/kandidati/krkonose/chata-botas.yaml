interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 2. 10. 2026 (šestá fronta koše C3, třetí dávka podle identifikátoru).
  NÁVRH: VYŘADIT — padá na OBOU půlkách klíče, nejjednoznačněji z dnešní dávky.

  Role na trase: 0 značených tras do 250 m, nejbližší značka 875 m (žlutá
  č. 7201 Vrchlabí – U Hromovky), rozcestník 1 173 m.
  Občerstvení pro veřejnost: pramen říká OPAK. Jde o pronájem CELÉ chaty,
  „1 až 17 osob", „5 ložnic", vlastní kuchyně; cena „léto 25.000kč, zima
  30.000kč / chata za týden". Bar ve společenské místnosti („velkoryse řešená
  společenská místnost s vlastním barem a krbem") je vybavení pronajatého domu,
  ne veřejný provoz — kolemjdoucí nemá kde a u koho si objednat.
  Pramen: https://www.turistika.cz/chaty-chalupy/detail/chata-botas-stazne-15627
