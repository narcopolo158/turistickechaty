interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 16. 9. 2026 (koš C3, druhá fronta, DATA-03) — NEPOVYŠOVAT:
  prameny občerstvení pro veřejnost nedokládají.
  IDENTITA POTVRZENA MĚŘENÍM: Firmy.cz uvádí GPS 50.662925 N, 15.820703 E —
  4 m od našeho bodu, hluboko pod prahem TYZ_DUM_M (30 m).
  ubytovanikrkonose-marsov.cz (/cs, otevřeno 16. 9. 2026): adresa
  „Lysečinská 10, 542 26 Horní Maršov", mezonetový apartmán pro 6 osob.
  Stravování popsáno jen vybavením pro hosty — doslova „Plně vybavená
  kuchyně: lednice s mrazákem, sporák, mikrovlnka, kávovar, toustovač".
  O restauraci ani o veřejném občerstvení ani věta.
  firmy.cz (…/detail/13936506-apartman-u-potoka-horni-marsov.html, otevřeno
  16. 9. 2026): záznam je AKTIVNÍ, ale kategorie zní „Ubytování
  v apartmánech" a „Horské ubytování" — ne restaurace. Doba „nonstop" je
  u ubytování dostupnost recepce, ne otvíračka hospody. Kontakty
  „+420 733 610 253", „rezervace@ubytovanikrkonose-marsov.cz" se shodují
  s OSM i s vlastním webem.
  POZOR NA VZOR: tohle je protějšek Chaty Viktorka (14. 9.) — aktivní
  záznam na Firmy.cz sám o sobě hospodu nedokládá, rozhoduje KATEGORIE
  zápisu. Patří to k tvé otevřené otázce z 5. 9.
  K MĚŘENÍ z 6. 9. 2026 (značka 8 m, tři trasy do 250 m, rozcestník 315 m):
  poloha v zástavbě Horního Maršova; roli na trase měření nedokládá.
  Návrh: VYŘADIT (čeká na tvé potvrzení).
  SOUSED, NE DUPLICITA: 44 m k chalupa-marsovka — Lysečinská 10 ×
  Lysečinská 9, dva provozovatelé, dva různé telefony. K Chatě Kovárna 103 m.
