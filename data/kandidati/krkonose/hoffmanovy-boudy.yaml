interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  TRIÁŽ 29. 8. 2026 (koš B, čtvrté čtení) — obě půlky klíče doložené
  jedním pramenem, a ten pramen je uživatelský (turistika.cz), takže
  doklad je slabší než u Dvořákovy či Mumlavské boudy.
  https://www.turistika.cz/mista/hoffmannovy-boudy/detail uvádí:
  „Na rozcestí najdeme Restauraci s pensionem, přes léto se u něj pase
  koza" a „Je zde rozcestník běžeckých i pěších tras a cyklotras",
  nadmořská výška „794 metrů nad mořem", GPS (50.632, 15.757) — sedí na
  souřadnice kandidáta.
  ROLE NA TRASE je tím doložená dobře (rozcestí značených cest je
  učebnicový případ klíče), OBČERSTVENÍ hůř — „restaurace s pensionem"
  neříká, zda obslouží i kolemjdoucího bez ubytování.
  DRUHÝ PRAMEN, KTERÝ SE NEPODAŘILO OTEVŘÍT: oficiální krkonose.eu vede
  výletní trasu „Z Janských Lázní přes Rudolfovo údolí na Hoffmanovy
  boudy" — už samotný název trasy roli na trase potvrzuje, ale text jsme
  nepřečetli (robots.txt fetch timeout, viz seznam nedosažitelných domén).
  Doporučení: přečíst při příštím běhu, ideálně z jiné sítě.
  POZOR na dvojznačnost jména: turistika.cz vede zvlášť „Hofmannovu
  boudu" asi 0,4 km odsud. Při povyšování ověřit, který objekt je který.
  → K RUČNÍ KONTROLE, sklon povýšit.
