interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=hostel (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 7. 10. 2026 (šestá fronta koše C3, sedmá dávka) — NÁVRH VYŘADIT.
  Rozhodla půlka klíče „občerstvení pro veřejnost": objekt je ŠKOLNÍ
  MLÁDEŽNICKÁ UBYTOVNA („Szkolne Schronisko Młodzieżowe Liczyrzepa", celoroční
  školské zařízení) s 50 lůžky v pokojích 2–3 a 4–6 osob s palandami.
  Restaurace pro veřejnost doložena není — pramen uvádí jen „wyposażona
  kuchnia, w której można przygotować własne posiłki" a možnost objednat si
  jídlo v sousedním penzionu. Je to týž typ jako školní a podnikové středisko
  (čteno 4. 10.) a šestý objekt kategorie „Szkolne Schronisko Młodzieżowe"
  v koši — po Plum, Złotym Widoku, staniszowském schronisku, Wojtkovi
  a (hraničním) Skalniku.
  Source: https://www.naszesudety.pl/schronisko-liczyrzepa.html (čteno
  7. 10. 2026, verified: false).

  POZOR — jméno kategorii SKRÝVÁ: OSM nese jen „Schronisko Liczyrzepa",
  slovo „Szkolne" v tagech není vůbec. Bez dohledávky by objekt vypadal jako
  schronisko v turistickém smyslu. Zapsáno jako doklad k poučce „jméno není
  doklad" (2. 10. 2026) — tady jméno nejen neidentifikuje, ale přímo svádí.

  Druhá půlka klíče (role na trase) je SPLNĚNA a jako jediná v dnešní dávce:
  28 m k ose zelené Szklarska Poręba – Wałbrzych, 1 značená trasa do 250 m,
  rozcestník 2 747 m (měření 6. 9. 2026). Na verdiktu to nic nemění — klíč
  žádá obě půlky.

  Totožnost doložena SOUŘADNICÍ na ~5,5 m: pramen uvádí 50,7763920 N /
  15,7812372 E proti OSM 50,776433 / 15,7811921. Adresa Skalna 45 souhlasí
  s OSM.

  ROZPOR V ADRESE, obě hodnoty zapsány, neřeší se: naszesudety.pl i OSM vedou
  „ul. Skalna 45, 58-540 Karpacz", kdežto czasnawypoczynek.pl a szkolnictwo.pl
  vedou u téhož jména „ul. Gimnazjalna 9". Nevíme, zda jde o přesun zařízení,
  druhou budovu téhož zřizovatele, nebo chybu katalogů — netvrdí se nic.

  Telefon: OSM +48 785 159 061 souhlasí s mobilem u pramene; pramen navíc nese
  pevnou linku 75 761 92 90 a e-mail szkolne@schronisko-liczyrzepa.pl
  (nezapsáno do kontaktů, kandidát se nepovyšuje).
