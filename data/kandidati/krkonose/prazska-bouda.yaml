  ROZHODNUTÍ 25. 7. 2026 — ZŮSTÁVÁ KANDIDÁTEM. Veřejné občerstvení NEDOLOŽENO:
  žádný z otevřených zdrojů neuvádí větu o obsluze kolemjdoucích. Katalogové
  „Stravování: ano" samo o sobě klíč zařazení nesplňuje — katalog nerozlišuje
  mezi stravováním pro ubytované a občerstvením pro veřejnost, a přesně na
  tomhle rozdílu stojí celý Michalův klíč. Nepovyšovat, dokud nebude věta.

  ROZPOR V OBCI — vyřešit před povýšením: katalog uvádí obec „Pec pod Sněžkou",
  ale adresa objektu zní Černý Důl 215. Obojí sedí na Černou horu (leží na
  pomezí katastrů), přesto jedno z toho je špatně. Nedomýšlet; rozhodnout
  z adresy nebo katastru, ne odhadem.

  K objektu se nepodařilo dohledat prakticky žádnou doloženou historii — před
  povýšením bude potřeba samostatná rešerše, jinak by profil vyšel poloprázdný
  (a to je proti pravidlu „žádný profil nejde ven poloprázdný").
