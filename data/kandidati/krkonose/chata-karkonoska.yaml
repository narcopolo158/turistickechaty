interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  TRIÁŽ 29. 8. 2026 (koš B, čtvrté čtení) — NENÍ to horská chata, ale
  hotelová restaurace ve středisku. Oficiální turistický portál regionu
  (https://visitkarkonosze.com/13-karkonosze-restauracja-regionalna-chata-karkonoska)
  ji vede na adrese „Wolna 4, 58-540 Karpacz" jako „restauracja całoroczna"
  se zázemím tříhvězdičkového hotelu („Zaplecze trzygwiazdkowego Hotelu
  gwarantuje zakwaterowanie w doskonałych warunkach"), s kapacitou
  „do 200 osób" a s pořádáním „wesel, imprez firmowych oraz szkoleń".
  Web z OSM tagu (chata.hotel-karkonosze.com.pl) je podstránkou hotelu
  Karkonosze v Karpaczi — sedí to.

  Klíč: OBČERSTVENÍ PRO VEŘEJNOST doloženo (celoroční restaurace),
  ROLE NA TRASE NEDOLOŽENA — adresa je v zástavbě Karpacze a žádný pramen
  ji neváže na značenou cestu. Spadá tedy pod nerozhodnutý „klíč
  střediska" (otázka pro Michala z 27.–28. 8.), stejně jako
  pension-jilemnicka-bouda a restaurace-havlova-bouda.
  → NEPOVYŠOVAT, držet do rozhodnutí o klíči střediska.
