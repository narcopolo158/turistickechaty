interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=hotel (alpine_hut = obsluhovaná, wilderness_hut
  = útulna).

  ČTENÍ 17. 9. 2026 (druhá fronta koše C3, 5. místo) — NÁVRH VYŘADIT, čeká na
  potvrzení Michalem. Adresa ul. Karkonoska 30, 58-536 Przesieka (PL).
  Občerstvení pro veřejnost nedokládá žádný pramen.

  Prameny (obojí nalezeno přes WebSearch, čteno 17. 9. 2026): (1) e-wczasy.pl
  https://www.e-wczasy.pl/noclegi/przesieka/domy-goscinne/sliwkowa-chata-sliwkowa-chata,9424
  — GPS 50.806362, 15.66511 = 3 m od našeho bodu → identita ověřena měřením;
  doslova „Istnieje możliwość wynajęcia całego domku np. dla dwóch rodzin
  z dziećmi czy grupy zorganizowanej, osobno parteru lub poddasza albo
  pojedynczo pokoi" a „Istnieje również możliwość wykupienia pobytu wraz
  z wyżywieniem". (2) meteor-turystyka.pl
  https://meteor-turystyka.pl/sliwkowachata-przesieka,przesieka.html — domek
  pro 8 osob, „Na domek składa się: 4 pokoje, 2 łazienki, salon LCD, internet,
  z aneksem" (kuchyňský kout), restaurace ani kavárna zmíněné nejsou.

  Rozlišení, které je tu podstatné: „pobyt wraz z wyżywieniem" je strava
  dokoupená k ubytování, ne veřejná hospoda — kolemjdoucí turista si tam
  nesedne. Je to polská obdoba vzoru „pevné časy jídel" z 15. 9. a vzoru
  polopenze u Baraby/Popelky (17. 9.).

  POZOR: OSM tag zněl tourism=hotel, oba prameny popisují dům k pronájmu
  (celý, po patrech nebo po pokojích). Typ z OSM tedy neplatí.
