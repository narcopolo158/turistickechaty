interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  TRIÁŽ 30. 8. 2026 (koš B, páté čtení) — KATALOGY SI PROTIŘEČÍ V KATEGORII,
  role na trase je doložená jen pro cyklo a běžky.
  OBČERSTVENÍ — dva prameny, dva různé obrázky:
  (a) Firmy.cz (https://en.firmy.cz/company/2691617-trejbalova-bouda-krkonose-rudnik.html)
  vede firmu POUZE v kategoriích „Mountain cabins and chalets" a „Economy
  accommodation", tedy BEZ gastro kategorie; otevírací doba Po–Čt 17–21, Pá
  17–23, So 16–23, Ne 16–21 (samé večerní hodiny, ne provoz pro denní turisty).
  (b) Oficiální turistický portál vychodni-cechy.info vede objekt v rubrice
  „hostinec (s kuchyní), letní terasa / zahrádka"
  (https://www.vychodni-cechy.info/rudnik/1_49871_trejbalova-bouda/) — POZOR,
  doložený je zatím jen titulek ze seznamu výsledků, samotná stránka vrátila 403.
  Vlastní web má stránku „Hospůdka" (https://www.trejbalovabouda.cz/hospudka.html),
  ta se ze sandboxu NENAČETLA (robots.txt ConnectTimeout) — to je nejlevnější
  místo, kde otázku uzavřít.
  ROLE NA TRASE: ceskehory.cz
  (https://www.ceskehory.cz/ubytovani/trejbalova-bouda-bolkov.html) uvádí
  „U běžkařských tratí (50 m)" a „U cyklostezky (10 m)" a polohu „v docházkové
  vzdálenosti (3 km) od Stezky v korunách stromů a lanovou dráhou na Černou
  horu"; objekt je „zasazený do úpatí Bolkovského údolí". ZNAČENÁ PĚŠÍ TRASA
  u objektu doložená NENÍ.
  -> K RUČNÍ KONTROLE, zatím nepovyšovat. Rozhodne odpověď na jedinou otázku:
  obslouží hospůdka kolemjdoucího, nebo je to večerní provoz pro ubytované?
