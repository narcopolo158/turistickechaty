interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Otvírací doba dle OSM (surový formát, neověřeno): 09:30-22:00

  TRIÁŽ KOŠ B — křížové ověření (checked 2026-08-28, WebSearch + otevřené
  stránky, vše verified: false):

  Občerstvení pro veřejnost DOLOŽENO. Turistický web obce Malá Úpa
  (malaupa.cz/restaurace-sokoli-boudy/) vede objekt PŘÍMO V SEKCI RESTAURACÍ
  obce a uvádí otvírací dobu „Po – Ne : od 11:00 hod do 23:00 hod a více",
  adresu „Dolní Malá Úpa 114, 542 27 Malá Úpa", severní a jižní terasu a
  dětský koutek. Nezávisle: Firmy.cz vede DVA oddělené záznamy — „Restaurace
  Sokolí boudy (Malá Úpa, Dolní Malá Úpa)" a „Sokolí Boudy (Malá Úpa, Dolní
  Malá Úpa)"; samostatný záznam na restauraci je týž signál jako u Chaty
  Hradečanky a Chaty Mísečky. Obecní web restauraci vede mezi restauracemi
  obce, ne mezi službami ubytovaným.

  Role na trase NEDOLOŽENA. Žádný z přečtených pramenů neuvádí značenou
  trasu ani nástup; poloha je Dolní Malá Úpa (50,7233 / 15,8134). Obec sama
  je hřebenová a leží na cestách k Sněžce, ale to je odvození, ne doklad —
  nedomýšlíme.

  ROZPOR V TELEFONU, k zapsání: OSM nese +420 775 252 267, vlastní web a
  obecní stránka uvádějí +420 731 186 000 a +420 499 320 266. Při případném
  povýšení vzít čísla z vlastního webu a OSM číslo nezapisovat.

  Vlastní web sokoliboudy.cz se bezobslužně nepřečetl (robots.txt fetch
  timeout) — doklady jsou tedy z obecního webu a Firmy.cz, ne od
  provozovatele.

  NÁVRH REDAKCI: K RUČNÍ KONTROLE. Občerstvení pro veřejnost je doložené
  dobře, chybí druhá půlka klíče (role na trase). Stačí ověřit, jestli kolem
  vede značka.
