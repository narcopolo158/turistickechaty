interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 13. 10. 2026 (šestá fronta koše C3, desátá dávka) — NÁVRH VYŘADIT,
  padá na půlce občerstvení; role na trase je naopak SPLNĚNA. Kandidát NEBYL
  ve frontě ke čtení (nemá vlastní identifikátor) — rozhodl ho pramen
  nalezený k `mounttain-holiday-lodges`, který popisuje týž areál.

  Občerstvení pro veřejnost: NENÍ. Oficiální web provozovatele Domandi
  popisuje areál jako tři pronajímané domky s vlastním vařením: „Każdy domek
  wyposażony jest we własną saunę na podczerwień, balię, Wi-Fi i nowoczesną
  kuchnię.", ve výčtu vybavení „nowoczesna kuchnia" a „darmowa woda i kawa".
  Restauraci ani bar web nezmiňuje.
  Source: https://pl.domandi-living.com/ (čteno 13. 10. 2026,
  verified: false).
  Source: https://domandi-mountain-holiday-lodges.hotels-lower-silesia.com/en/
  (čteno 13. 10. 2026, verified: false).

  Role na trase: SPLNĚNA — 104 m k ose modré Podgórzyn Górny – Przełęcz
  Karkonoska, 1 značená trasa do 250 m, rozcestník 5 714 m (měření
  6. 9. 2026).

  Totožnost: doložena příslušností ke shluku, ne vlastní souřadnicí z pramene
  — bod leží **17,0 m** od uzlu `mounttain-holiday-lodges`
  (Droga do Wodospadu 4A, Przesieka, `operator=Domandi`), a prameny mluví
  o témže areálu. Airbnb nese „Domandi lodge 2 – private SPA, mountains & nature", takže jméno OSM má v pramenech protějšek.

  Pozn.: měření z 6. 9. 2026 u tohoto shluku předpovědělo, že „stačí jedno
  čtení pramene na celý shluk" — dnes to poprvé platí doloženě.
