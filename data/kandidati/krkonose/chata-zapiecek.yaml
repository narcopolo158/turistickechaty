interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=hotel (alpine_hut = obsluhovaná, wilderness_hut
  = útulna).

  ČTENO 12. 10. 2026 (šestá fronta koše C3, devátá dávka) — NÁVRH VYŘADIT,
  padá na půlce občerstvení; role na trase je naopak SPLNĚNA, a nejsilněji
  z celé dávky po Kateřině.

  Občerstvení pro veřejnost: NENÍ DOLOŽENO. Pramen popisuje objekt jako
  horskou chatu s pokoji a vlastním kuchyňským koutem pro hosty
  („funkcjonalny aneks kuchenny", „przytulne pokoje"); restauraci, jídelnu
  ani jídelní nabídku neuvádí vůbec. Nabídka objektu je jinde: půjčovna
  sněžnic, horský průvodce a instruktor nordic walkingu, vlastní sáňkařský
  kopec, salon s krbem, 625 m n. m., pozemek u hranice otuliny KPN
  a Natury 2000.
  Source: https://www.orlyturystyki.pl/profile-740752-chata-zapiecek
  (čteno 12. 10. 2026, verified: false).
  Druhý pramen k adrese a totožnosti:
  https://www.cylex-polska.pl/firmy/chata-zapiecek-13637401.html
  (čteno 12. 10. 2026, verified: false) — „ul. Karkonoska 48, 58-563
  Przesieka", obor „Sport a turistika → Hotely", telefon 668 283 243, web
  chatazapiecek.pl; o stravování ani slovo.

  Role na trase: SPLNĚNA — 35 m k ose modré Podgórzyn Górny – Przełęcz
  Karkonoska, 1 značená trasa do 250 m, rozcestník 4 809 m (měření
  6. 9. 2026). Na verdiktu to nic nemění, protože klíč chce obě půlky.

  Totožnost: doložena souřadnicí — bod 50,80503 / 15,66058 z druhého pramene
  je od OSM bodu 50,804982 / 15,660652 **7,4 m**; adresa ul. Karkonoska 48
  sedí s OSM.

  NEDOČTENO, a tentokrát u domény z KATALOGU, ne z OSM: vlastní web
  `chatazapiecek.pl` (adresu nese druhý pramen) spadl na
  `PROVENANCE_REQUIRED`. Právě on by rozhodl, jestli „aneks kuchenny" je
  celé stravování objektu, nebo jestli chata nabízí i jídlo. Otázka z 24. 9.
  tím dostává nový tvar: dosud šlo o domény z OSM, tady o doménu, kterou
  přinesl katalog — výsledek je stejný.
