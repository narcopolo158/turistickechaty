interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=wine_cellar (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Otvírací doba dle OSM (surový formát, neověřeno): Mo-Su 11:00-22:00

  TRIÁŽ KOŠ B — křížové ověření (checked 2026-08-27, WebSearch + otevřené
  stránky, vše verified: false):

  Občerstvení pro veřejnost DOLOŽENO. Firmy.cz vede samostatný záznam „Chata
  Hradečanka - restaurace" (Malá Úpa, Horní Malá Úpa); kudyznudy.cz: „V Chatě
  Hradečanka naleznete i restauraci, jejíž kuchař je Ital, který připravuje
  prý tu nejitalštější pizzu v celých Krkonoších."; web obce malaupa.cz ji
  vede v přehledu restaurací obce a popisuje ji jako „Italská restaurace s
  michelinským kuchařem přímo z Parmy, suroviny dovážíme přímo z Itálie" a
  „Vinný sklípek – archív nejen světových, ale i českých a slovenských vín."
  Otvírací doba z OSM (Mo-Su 11:00-22:00) zůstává neověřená, vlastní web ji v
  hledání nevydal. Adresa dle obce „Horní Malá Úpa 41", telefon obce (+420 720
  213 513) se LIŠÍ od telefonu v OSM (+420 737 282 668) — rozpor nesrovnáváme,
  jen zaznamenáváme.

  Role na trase NEDOLOŽENA. Jediné, co prameny o poloze říkají, míří na
  sjezdovku: kudyznudy.cz „hned u stejnojmenného svahu v Malé Úpě" a „vhodným
  výchozím bodem jak na zimní radovánky, tak na letní turistiku" — to je popis
  výchozího bodu ve středisku, ne role na trase. Značená cesta kolem objektu
  nedoložena, nadmořská výška v žádném prameni.

  SPORNÉ S KLÍČEM — týž vzor jako Johannova bouda (26. 8.): občerstvení pro
  veřejnost doložené, role na trase ne. Rozdíl oproti Johannově boudě je
  poloha: Horní Malá Úpa je horská obec v 1000+ m, ne okraj Vrchlabí.
  Rozhodnutí je redakční.
