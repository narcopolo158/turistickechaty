interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-06-12) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=alpine_hut (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  DATA-03 křížové ověření (checked 2026-07-20, verified false; ruční běh —
  WebFetch průchozí jen na část domén, zbytek padá na PROVENANCE/timeout;
  křížový checklist: přehled ubytování
  treking.cz/prehledy/krkonose-ubytovani.htm, načteno 20. 7. 2026 — výtah
  nemusí být úplný, končí „a další“): Web z OSM (chatahubertka.cz) nedostupný
  (robots ConnectTimeout). Výtah treking.cz uvádí „Bouda Hubertus“ — podobnost
  jména NEztotožňuji (nedomýšlet; Hubertka vs. Hubertus mohou být různé
  objekty). K RUČNÍ KONTROLE.

  KOŠ A — ODPRACOVÁNO 25. 8. 2026 (denní bezobslužná session, metoda: WebSearch
  + otevřené stránky; verified false): objekt je ve VÍTKOVICÍCH (nikoli
  v Rokytnici), adresa „Vítkovice 201, 512 38", vystupuje jako „Resort
  Hubertka". Vlastní web má samostatnou stránku „Hospůdka"
  (www.chatahubertka.com/restaurace/, otevřeno 25. 8. 2026) s otvírací dobou
  „1.7. - 31.8. otevřeno 11:00 - dle QR denně" — rozvrh je signál veřejného
  provozu, VĚTU o přístupu neubytovaných ale stránka nenese, takže klíč
  doložený NENÍ. Táž stránka zároveň hlásí ZMĚNU REŽIMU, doslova:
  „Restaurace již nebude v běžném provozu" a „Nadále bude k dispozici pro
  svatby, oslavy, firemní a soukromé akce"; místo ní „Od podzimu pro vás
  otevřeme samoobslužný obchůdek 24 hodin denně, 7 dní v týdnu". Katalog
  regiontourist.cz (otevřeno 25. 8. 2026): „Součástí chaty je restaurace
  s barem a letní terasou", kapacita 29 hostů v 7 pokojích. Výšku ani historii
  nenese žádný z pramenů.

  ZÁVĚR: ODLOŽENO, otázka pro Michala — (1) je letní hospůdka otevřená
  i neubytovaným? (2) plní SAMOOBSLUŽNÝ OBCHŮDEK 24/7 klíč „občerstvení pro
  veřejnost", nebo je to obchod, ne občerstvení? Odpověď na (2) založí pravidlo
  pro celou třídu objektů. Pozor i na klíč střediska: Vítkovice jsou středisko
  a soused Chata Eliška je z téhož důvodu POTVRZENO MIMO (Michal 27. 7. 2026).
