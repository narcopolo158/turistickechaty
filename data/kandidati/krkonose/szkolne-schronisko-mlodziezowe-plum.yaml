interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Otvírací doba dle OSM (surový formát, neověřeno): Mo-Su 17:00-10:00

  ČTENO 26. 9. 2026 (koš C3, dočtení čtvrté fronty) — NÁVRH: VYŘADIT.
  Nevyřazuji sám, rozhodne redakce. Objekt vaří, ale ne pro kolemjdoucí.

  Vlastní web (https://schronisko-plum.pl/oferta.php, čteno 26. 9. 2026) rozdělí
  adresáty sám a doslova: „Dla grup zorganizowanych śniadania, obiady,
  obiadokolacje i kolacje oferujemy na miejscu (pełne wyżywienie)." a
  „Turyści indywidualni mogą skorzystać z kuchni samoobsługowej schroniska."
  Tedy plná strava **jen pro organizované skupiny**, jednotlivec dostane
  samoobslužnou kuchyň. Vedle toho „kuchnia żywienia zbiorowego dla grup
  zorganizowanych" a jadalnia. Hospoda pro veřejnost doložená není — a tohle je
  silnější doklad než obvyklé „prameny o stravování mlčí": pramen výslovně říká,
  co jednotlivec dostane.

  Co objekt je: „50 miejsc noclegowych w pokojach 2-, 4-, 6-, 8-, 10-osobowych
  dla grup zorganizowanych, rodzin z dziećmi, turystów indywidualnych", bazén,
  street workout, internet, knihovnička. Adresa **ul. Turystyczna 2A, 58-573
  Piechowice**.

  Identita silná: telefon +48 696 046 824 i e-mail magdalada@poczta.onet.pl
  z OSM tagů se shodují s vlastním webem znak za znakem.

  POZOR — TÝŽ SPRÁVCE JAKO DALŠÍ TŘI OBJEKTY, viz nález u
  `szkolne-schronisko-mlodziezowe-zloty-widok` (jeden telefon a jeden e-mail
  na čtyři domy). Sdílený kontakt proto u téhle skupiny identitu NEURČUJE,
  rozhoduje adresa.

  ROLE NA TRASE (`scripts/triaz-role-na-trase.ts`, 26. 9. 2026): 105 m k modré
  (Piechowice – Pod Wielkim Szyszakiem), 1 značka do 250 m, nejbližší rozcestník
  7 179 m (u polských objektů nerozhoduje, viz nález 26. 9. 2026). Druhá půlka
  klíče se tím nezavírá ani neotvírá — verdikt stojí na chybějícím občerstvení.
