interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 7. 10. 2026 (šestá fronta koše C3, sedmá dávka) — NÁVRH VYŘADIT,
  a padá na OBOU půlkách klíče.

  Občerstvení pro veřejnost: NENÍ. Pramen popisuje „dwupoziomowe domki
  z kuchniami i łazienkami", tedy celé domky s vlastní kuchyní; ze stravování
  uvádí jen „Możliwość zamówienia zestawów do przygotowania śniadania"
  (balíčky na přípravu snídaně) a konstatuje, že plná restaurace k dispozici
  není. Kapacita 42 míst v šesti jednotkách (3× 6 osob, 3× 8 osob), cena za
  domek a noc, ne za lůžko.
  Source: https://meteor-turystyka.pl/widokowo-karpacz,karpacz.html (čteno
  7. 10. 2026, verified: false).

  Role na trase: NESPLNĚNA — 644 m k ose černé Karpacz Muzeum Zabawek – Sowia
  Przełęcz, 0 značených tras do 250 m, rozcestník 3 323 m (měření 6. 9. 2026).

  Totožnost: pramen uvádí ulici Curie-Skłodowskiej v Karpaczi bez čísla
  a bez souřadnice; OSM bod 50,7797275 / 15,7719861 adresu nenese. Totožnost
  stojí na jménu, obci a vlastní doméně, ne na souřadnici — zapsáno jako
  slabší.

  Vlastní doména `www.widokowo-karpacz.pl` skončila na `PROVENANCE_REQUIRED`
  (otázka pro Michala z 24. 9. 2026 položena pojedenácté); verdikt se proto
  opírá o katalog, ne o vlastní web.
