interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 15. 9. 2026 (koš C3, DATA-03) — NEPOVYŠOVAT: objekt je
  živý a dohledatelný, ale občerstvení pro veřejnost nemá.
  IDENTITA POTVRZENA MĚŘENÍM: Firmy.cz vede „Horská chata Medika (Horní
  Maršov, Horní Albeřice)" (firmy.cz/detail/13473917-…, otevřeno
  15. 9. 2026) s GPS 50,693592 / 15,847295 — to je 11,9 m od našeho bodu,
  tedy pod prahem TYZ_DUM_M (30 m): týž dům. Záznam je AKTIVNÍ (větu
  o neaktivní firmě neobsahuje), kategorie ale zní „Rekreační chaty
  a chalupy" a „Rekreační ubytování", adresa „Horní Maršov, Horní Albeřice
  12, 542 26", telefon „+420 777 290 433", web „www.chata-medika.cz".
  Otevírací doba uvedena není, jen „Nástup na ubytování je mezi 16 – 20
  hodinou (nebo dle telefonické domluvy)" — to je režim ubytování, ne
  hospody.
  VLASTNÍ WEB rozhoduje: chata-medika.cz (otevřeno 15. 9. 2026) o restauraci
  ani hospodě nemluví vůbec a stravování popisuje jako samoobslužné —
  „plně k dispozici nově zařízená a prostorná kuchyň pro vlastní
  stravování". Ubytovat se lze „v jednotlivých pokojích po 2 až 4 lůžkách",
  pro větší skupiny se nabízí „pronájem celé chaty"; kapacita „6 pokojů
  a 1 apartmán s celkovou kapacitou 24 lůžek a 5 možných přistýlek",
  provozovatelka Petra Pálková (IČ 03559521), e-mail chata-medika@email.cz.
  Role na trase je změřena (6. 9. 2026: červená č. 0403 „Cesta bratří
  Čapků" na 11 m), druhá půlka klíče ale doložena není a podle vlastní
  prezentace ani být nemůže. Návrh: VYŘADIT (čeká na tvé potvrzení).
  POZOR NA JMENOVCE, na verdikt to vliv nemá: `chata-medika` je jiný dům
  15,6 km odtud (rozhodnuto 10. 9. 2026).
  WEB Z OSM NEPLATÍ: tag vede `http://www.alberice.slinet.cz`, skutečná
  prezentace objektu je `www.chata-medika.cz`. Do profilu se přebírat nemá.
