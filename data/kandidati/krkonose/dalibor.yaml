interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 11. 10. 2026 (šestá fronta koše C3, osmá dávka) — NÁVRH VYŘADIT,
  padá na půlce občerstvení; role na trase je naopak SPLNĚNA.

  Občerstvení pro veřejnost: NENÍ. Pramen uvádí u objektu výslovně
  „Bez stravování" a jednotky mají vlastní kuchyňský kout: „KUCHYŇSKÝ
  A JÍDELNÍ KOUT: lednička s mražákem, sklokeramická deska, horkovzdušná
  trouba, mikrovlnná trouba". Pronajímají se celé apartmány (2+KK 48 m²,
  3+KK 80 m²), dohromady 16 lůžek, 850 m n. m.; o okolí pramen píše jen
  „Spousta restaurací…", tedy restaurace jinde, ne v objektu.
  Source: https://www.ceskehory.cz/ubytovani/apartmany-dalibor-spindleruv-mlyn.html
  (čteno 11. 10. 2026, verified: false).

  Role na trase: SPLNĚNA — 194 m k ose zelené [Z] Špindlerův mlýn – okruh,
  4 značené trasy do 250 m, rozcestník 306 m (měření 6. 9. 2026). Na verdiktu
  to nic nemění, protože klíč chce obě půlky.

  Totožnost: doložena souřadnicí — pramen 50,728512 / 15,610813 je od OSM bodu
  50,7285503 / 15,6109845 **12,8 m**.

  Rozpor v adrese, obě hodnoty zapsané, nerozhoduje se: OSM nese u objektu
  číslo 17 bez ulice (v triážní frontě proto „Špindlerův Mlýn 17"), pramen
  uvádí **Okružní 17, Špindlerův Mlýn, 543 51**. Provozovatelka dle pramene
  Ing. Lenka Nevřivová, telefony +420 776 791 195 a 608 020 108, web
  `apartmany-spindl.cz` — v OSM kontakt není žádný.

  Pozn.: jméno „Dalibor" v OSM neprozradí, že jde o apartmány — je to další
  případ k poučce ze 7. 10., že jméno v OSM může kategorii zakrývat. Tady to
  ale zakrývá směrem k vyřazení, ne k povýšení.
