interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 15. 9. 2026 (koš C3, DATA-03) — NEPOVYŠOVAT: hospoda
  existuje, ale v JINÉ BUDOVĚ téhož provozovatele (druhý případ po
  `hotel-spindlerova-bouda-depandance` ze 14. 9. 2026).
  IDENTITA POTVRZENA MĚŘENÍM: Firmy.cz vede „Grand Apartments (Špindlerův
  Mlýn)" (firmy.cz/detail/2657798-…, otevřeno 15. 9. 2026) s GPS
  50,725159 / 15,608218 — 6,0 m od našeho bodu, tedy týž dům. Adresa
  „Špindlerův Mlýn 224, 543 51", kategorie „Rekreační ubytování"
  a „Horské ubytování", web „www.felicity.cz", telefon (fax)
  „+420 499 429 307". Restaurace v záznamu zmíněna NENÍ a záznam sám
  hlásí „Firma neměla delší dobu aktualizaci."
  ROZHODUJÍCÍ ROZPOR ČÍSEL POPISNÝCH: felicity.cz/en/grand-apartments-en/
  (otevřeno 15. 9. 2026) uvádí restauraci **V Uličce** jako veřejnosti
  přístupnou, ale výslovně „located on the ground floor of Hotel Grand".
  A Hotel Grand má na témže webu (felicity.cz/en/hotel-grand-en/) adresu
  **Okružní 155** — kdežto náš kandidát je **čp. 224**. Jsou to tedy dvě
  různé budovy jednoho provozovatele (Felicity Hotels s.r.o., telefon
  +420 770 106 077, reservations@felicity.cz).
  PLATÍ PRAVIDLO ZE 14. 9. 2026: doklad klíče se z mateřského objektu na
  vedlejší budovu nepřenáší. Kdyby se kandidát povýšil, průvodce by
  o apartmánovém domě tvrdil hospodu, kterou má o dům dál.
  Vlastní stravování objektu je popsáno jako bufetová snídaně „denně od
  8:00 do 10:00" a balíček „Half Board" — režim pro ubytované, ne hospoda
  pro kolemjdoucí. Návrh: VYŘADIT (čeká na tvé potvrzení).
  K MĚŘENÍ z 6. 9. 2026 (zelená „[Z] Špindlerův mlýn - okruh" na 8 m, sedm
  značek, rozcestník 37 m): silná kombinace je tu dána polohou v centru
  Špindlerova Mlýna, kde značky vedou zástavbou. Roli na trase měření
  nedokládá.
