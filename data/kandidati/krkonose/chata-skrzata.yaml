  TRIÁŽ 29. 8. 2026 (koš B, čtvrté čtení) — HLEDÁNO, NIC POUŽITELNÉHO.
  Dotaz na „Chata Skrzata" ve Szklarské Porębě vrátil obecné výletní
  články o městě a jeden ubytovací záznam „chata skrzata" — ten je ale
  z MIKOŁAJEK (Mazury), tedy 600 km odsud a s naším bodem nemá nic
  společného. Pozor na tuhle past při dalším hledání: jméno není
  jedinečné.
  Ani jedna půlka klíče doložená není.
  → NEROZHODNUTO, doklad chybí. Nevyřazovat.
