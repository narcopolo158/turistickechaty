interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Provozovatel dle OSM: T.J. Sokol Poniklá

  ČTENO 7. 10. 2026 (šestá fronta koše C3, sedmá dávka) — NÁVRH VYŘADIT,
  a padá na OBOU půlkách klíče.

  Občerstvení pro veřejnost: nedoloženo. Jediný pramen, který se shoduje
  v jménu i obci — oficiální stránky obce Poniklá — popisuje Chatu Babeta
  (Poniklá 204) jako celou chatu k pronájmu: „6 standardních lůžek
  (3 dvoulůžkové pokoje), dva pokoje mají možnost přistýlky", společenská
  místnost, „vybavený kuchyňský kout", terasa s grilem. O restauraci,
  hospodě ani občerstvení pro veřejnost neříká nic; rezervace odkazuje na
  sokolponikla.cz. Provozovatel dle obce: Ing. Radka Paulů, tel. 605 759 389
  (OSM vede jako provozovatele T.J. Sokol Poniklá — rozpor zapsán, neřeší se).
  Source: https://www.ponikla.cz/volny-cas/turista/ubytovani-1/chata-babeta-ponikla-645cs.html
  (čteno 7. 10. 2026, verified: false).

  Role na trase: NESPLNĚNA, a nejvýrazněji z dnešní dávky — 1 070 m k ose
  žluté [Ž] Poniklá – Roztoky u Semil, 0 značených tras do 250 m, rozcestník
  1 219 m (měření 6. 9. 2026).

  Totožnost: SLABÁ. Souřadnici neuvádí žádný pramen; adresa „Poniklá 204"
  z obecního webu se nedá přiřadit k OSM bodu 50,6597314 / 15,4598734, protože
  OSM číslo popisné nenese. Totožnost tedy stojí jen na jménu, obci
  a provozovateli. Nepovyšovat bez souřadnice.

  JMENOVEC, a je jich víc než dva: pod jménem „Chata Babeta" vedou katalogy
  nejméně čtyři různé objekty — Poniklá (tento kandidát), Teplice nad Metují
  na Broumovsku (chata.cz), České Petrovice (chata-babeta.hotel.cz)
  a Jevišovice u Znojma (travelking.cz, GPS 48,988104 / 15,997119, kapacita
  12 osob, „Bez stravy… Restaurace poblíž objektu"). Jevišovický záznam jsem
  napoprvé otevřel jako pramen k tomuhle kandidátovi a NENÍ to on.
  Druhý doklad poučky „jméno není doklad" v jedné dávce (viz
  `szkolne-schronisko-mlodziezowe-wojtek`).

  Vlastní doména provozovatele `sokolponikla.cz` skončila na
  `PROVENANCE_REQUIRED` — kdyby se načetla, mohla by zavřít jak souřadnici,
  tak otázku hospody.
