interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 15. 9. 2026 (koš C3, DATA-03) — NEPOVYŠOVAT: prameny
  dokládají pravý opak občerstvení pro veřejnost.
  KDO TO VLASTNĚ JE: pod jménem z OSM („Mlynářka, ubytování v krkonoších")
  se skrývá **Chalupa Mlynářka, Černý Důl 100**. Doloženo měřením —
  e-chalupy.cz (…/krkonose/chalupa-mlynarka-cerny-dul-pronajem-7387.php,
  otevřeno 15. 9. 2026) uvádí GPS 50,63549 / 15,7115, což je 3,9 m od
  našeho bodu, tedy hluboko pod prahem TYZ_DUM_M (30 m).
  ROZHODUJÍCÍ VĚTY: „Objekt se pronajímá celý - po dobu pobytu ho budete
  mít jen pro sebe, bez sdílení s dalšími hosty" a o stravování
  „Stravování vlastní nebo si můžete zařídit v přilehlé restauraci."
  Restaurace je tedy PŘILEHLÁ, ne součást objektu — doklad klíče si bere
  od cizího podniku. Kapacita „6 lůžek + 2 přistýlky", dvě ložnice.
  Objekt pronajímaný vcelku jedné skupině se samoobslužnou kuchyní druhou
  půlku klíče nemá a mít nebude (týž případ jako `chata-gracie`
  14. 9. 2026). Návrh: VYŘADIT (čeká na tvé potvrzení).
  NOVÝ JMENOVEC, nezaměňovat: **Penzion Mlynářka, Dolní Dvůr 3** je jiný
  objekt — penzionmlynarka.cz (otevřeno 15. 9. 2026) uvádí GPS
  50°39'3.52"N / 15°39'26.07"E, telefon „+420 605 518 190" a e-mail
  „sourekubytovani@gmail.com", kapacita „80 lůžek", ceny „s polopenzí od
  350,- Kč, s plnou penzí od 400,-". Od našeho bodu je to **4 192,6 m** —
  učebnicový jmenovec, ne duplicita. Vyhledávání na jméno „Mlynářka
  Krkonoše" vrací přednostně jeho, ne našeho kandidáta.
  WEB A TELEFON Z OSM NEOVĚŘENY: `https://mlynarka-krkonose.cz/` se
  15. 9. 2026 nepodařilo otevřít (pramen se nedal doložit přes vyhledávání)
  a číslo +420 722 249 278 nepotvrzuje žádný z dnes čtených pramenů —
  do profilu je přebírat nelze.
  K MĚŘENÍ z 6. 9. 2026 (žlutá č. 7211 „[Ž] Černý Důl - Nad Portášovými
  boudami" na 47 m, šest značek, rozcestník 138 m): silná kombinace je tu
  dána polohou v zástavbě Černého Dolu, kde značka vede i obcí. Roli na
  trase měření nedokládá.
