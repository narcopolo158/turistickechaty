interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  TRIÁŽ KOŠ B — křížové ověření (checked 2026-08-27, WebSearch + otevřené
  stránky, vše verified: false):

  Občerstvení pro veřejnost DOLOŽENO, a to výslovně pro NEUBYTOVANÉ. Vlastní
  web (boudamalaupa.cz, stránka Restaurace) rozlišuje dvojí režim: pro
  neubytované „summer 11:00-17:00, winter: 12:00-15:00", pro ubytované
  „breakfast: 8:00-10:00, summer: 11:00-22:00, winter: 12:00-22:00"; kapacita
  60 míst v hlavní budově. Je to jeden z mála kandidátů koše B, u kterého
  pramen přístup kolemjdoucího neodvozuje, ale píše ho přímo.

  Role na trase DOLOŽENA — pramenem je ovšem provozovatel. Vlastní web: „přímo
  na trase k Sněžce", adresa „Horní Malá Úpa 136, 542 27 Malá Úpa", „v
  nadmořské výšce 1040 m n.m.", „nejvyšší česká vesnice", „běžecké a
  cyklistické trasy začínají přímo v Malé Úpě". Zda a jakou barvou je trasa
  značená, pramen neuvádí. Číslo trasy ani značku jsme nedohledali —
  nedomýšlíme je.

  Proti klíči stojí jedna věc, a je poctivé ji napsat: objekt se dnes
  prezentuje jako „Wellness Resort Bouda Malá Úpa" (tak ho vede i Firmy.cz a
  hotely.cz) a vlastní web uvádí sjezdovku „50 m" od ubytování. Je to tedy
  hotelový provoz ve středisku — jenže ve středisku, které leží v 1040 m na
  hřebenové cestě ke Sněžce, ne v podhorské obci. Klíč (role na trase +
  občerstvení pro veřejnost, ne typ stavby) tím splněn je.

  Turistická minulost NEDOLOŽENA — název „Bouda" na ni ukazuje, ale žádný náš
  pramen historii objektu neuvádí.

  NÁVRH REDAKCI: POVÝŠIT do data/chaty/krkonose/ — obě půlky klíče doložené,
  přístup neubytovaných doslova citovaný. Otázka pro Michala je, jestli mu
  „wellness resort" nevadí; klíč sám o typu stavby nerozhoduje.
