  další případ do otázky „klíč střediska".
  OBČERSTVENÍ: samostatný záznam v restauračním katalogu Tripadvisor
  (https://www.tripadvisor.com/Restaurant_Review-g274808-d14796217-Reviews-Chata_Sudecka_u_Prezesa-Szklarska_Poreba_Lower_Silesia_Province_Southern_Poland.html)
  — kategorie „Bar, restaurace", kuchyně „Polish, Bar, European, Pub, Soups,
  Czech", otevřeno denně 14:00–20:00, adresa „ul. Górna 10, Szklarska Poręba
  Średnia, 58-580". Záznam je „unclaimed", tedy nezaložený provozovatelem —
  což u dokladu o veřejném provozu nevadí, ale ostrou otvíračku z něj brát nelze.
  Otvírací doba z OSM (Mo-Su 09:00-22:00) se s tou z Tripadvisoru NESHODUJE
  (14:00–20:00) — rozpor se nesrovnává, jen se přiznává.
  ROLE NA TRASE: nedoložená — adresa je ulice v zástavbě Szklarské Poręby
  Średnie. Objekt je zároveň ubytování („pokoje gościnne", vlastní doména
  chatasudecka.pl, jejíž rozcestník se sice načetl, ale k provozu ani poloze
  nic konkrétního neuvádí).
  -> K RUČNÍ KONTROLE, nepovyšovat bez rozhodnutí o klíči střediska.
