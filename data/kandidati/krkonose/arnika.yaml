interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  POZOR NA JMENOVCE (měření 14. 10. 2026): hledání podle jména „Arnika"
  v Karpaczi vrací Willa Arnika, Kamienna 5A, Karpacz (50.771687,
  15.729289) — penzion s restaurací a 28 pokoji. Od tohoto kandidáta je
  to zhruba 4 km, NENÍ to týž dům. Doklad o gastru u Willy Arniky se
  proto k tomuto kandidátovi NESMÍ připsat. Totožnost se dokládá
  souřadnicí, ne jménem (poučka ze 4. 10. 2026).

  SHLUK (měření 14. 10. 2026): tento kandidát je součástí pětice
  arnika / dziewiecsil / goryczka / lilia / rozeniec v rozpětí 54 m,
  OSM way 1033422413–1033422417 (pět po sobě jdoucích identifikátorů =
  jeden dávkový zápis). Tagy u všech pěti jen building=yes + name +
  tourism=chalet, žádný web, telefon, e-mail, adresa ani operator.
  Je to doklad JEDNOHO MÍSTA, ne duplicity — a ke čtení to nevede,
  protože identifikátor nemá ani jeden člen shluku. Tři hledání
  (14. 10. 2026) k té pětici nevrátila žádný pramen.
