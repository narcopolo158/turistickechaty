interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Provozovatel dle OSM: PTSM

  ČTENO 7. 10. 2026 (šestá fronta koše C3, sedmá dávka) — NÁVRH VYŘADIT,
  a padá na OBOU půlkách klíče.

  Občerstvení pro veřejnost: nedoloženo. Pramen popisuje „dobrze wyposażoną
  kuchnią samoobsługową", v níž si turisté vaří sami, a jídlo (snídaně, obědy,
  večeře) jen NA OBJEDNÁVKU PRO SKUPINY; veřejná restaurace se nezmiňuje.
  Určení objektu pramen vypisuje jako „zielone szkoły, rajdy, wycieczki
  zorganizowane, pielgrzymki, kolonie, obozy, rodziny z dziećmi" — tedy
  skupinový provoz, ne kolemjdoucí. Kapacita 85 lůžek v pokojích 2–14 osob.
  Source: https://www.naszesudety.pl/schronisko-wojtek.html (čteno 7. 10. 2026,
  verified: false).

  Role na trase: NESPLNĚNA — 700 m k ose modré Szklarska Poręba – Pasterka,
  0 značených tras do 250 m, rozcestník 5 750 m (měření 6. 9. 2026).

  Totožnost: adresa Piastowska 1, 58-580 Szklarska Poręba souhlasí s OSM,
  telefon +48 696 046 824 a e-mail magdalada@poczta.onet.pl souhlasí s OSM;
  pramen navíc nese pevnou linku +48 75 610 54 36. Souřadnici neuvádí žádný
  pramen, totožnost tedy stojí na adrese a kontaktu, ne na souřadnici.

  JMENOVEC, pozor při dalším čtení: pod jménem „Szkolne Schronisko Młodzieżowe
  Wojtek" vede katalog frommers.com jiný objekt — ul. Skowronków 18A, Jelenia
  Góra, 2 km od nádraží, cena 35 PLN. To NENÍ tento kandidát (jiná obec, jiná
  adresa). Druhý doklad poučky „jméno není doklad" v jedné dávce (viz
  `sokolska-chata-babeta`).
  Source jmenovce: https://www.frommers.com/destinations/jelenia-gora/hotels/szkolne-schronisko-modzieowe-wojtek
  (čteno 7. 10. 2026).

  Pátý objekt kategorie „Szkolne Schronisko Młodzieżowe" v koši C3, který padá
  na téže půlce klíče (po Plum, Złotym Widoku a staniszowském schronisku,
  spolu s dnešní Liczyrzepou); `…-skalnik` je dál hraniční a čeká na Michalovu
  výjimku.
