interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 16. 9. 2026 (koš C3, druhá fronta, DATA-03) — NEPOVYŠOVAT:
  prameny dokládají pravý opak občerstvení pro veřejnost.
  JMÉNO NESEDÍ, nedomýšlet: OSM vede „Chata Kovárna", oba nalezené prameny
  „Chalupa Kovárna". Adresu uvádí jen hkregion.cz.
  hkregion.cz (…/dr-cs/9470-chalupa-kovarna.html, otevřeno 16. 9. 2026):
  „Chalupa Kovárna", adresa „Kovářská 86, Horní Maršov, 542 26", doslova
  „Nová horská chalupa Kovárna poskytuje ubytování na okraji obce Horní
  Maršov". Stravování popsáno jen vybavením pro hosty (kuchyňský kout se
  sporákem a chladničkou); o restauraci ani o veřejném občerstvení ani věta.
  janskelazne.cz (…/cz/chalupa-kovarna-horni-marsov-252.html, otevřeno
  16. 9. 2026): stravování doslova „Možnost vlastního vaření"; veřejná
  restaurace zmíněna není.
  KONTAKTY Z PORTÁLU NEPŘEBÍRAT: janskelazne.cz uvádí „+420 733 645 729"
  a „+420 603 416 095" — týž pár telefonů jako u Chaty Grácie a Chaty
  Viktorka (nález 14. 9. 2026), plus e-mail ve tvaru
  „chalupakovarna@janskelazne.cz" a web „chalupakovarna.janskelazne.cz".
  Jsou to kontakty rezervačního portálu, ne objektu; třetí doložený výskyt
  toho vzoru.
  WEB Z OSM SE NEPOTVRDIL: tag website vede na
  „e-chalupy.cz/krkonose/chata-horni-marsov-kovarna-1586.php", kdežto
  vyhledávání vrací na témže portálu jiný záznam
  („e-chalupy.cz/chalupa-horni-marsov-o8397"). URL z OSM se nepodařilo
  dohledat, a proto ani otevřít — netvrdíme, že je mrtvá, jen ji nemáme
  doloženou.
  K MĚŘENÍ z 6. 9. 2026 (značka 8 m, tři trasy do 250 m, rozcestník 277 m):
  poloha je na okraji zástavby Horního Maršova, kudy značky vedou; roli na
  trase měření nedokládá. Návrh: VYŘADIT (čeká na tvé potvrzení).
  SHLUK HORNÍ MARŠOV: 74 m k chalupa-marsovka, 103 m k apartman-u-potoka —
  tři kandidáti téhle fronty stojí do 103 m od sebe, ale mají tři různé
  provozovatele a tři různé domy (viz oba sousedy).
