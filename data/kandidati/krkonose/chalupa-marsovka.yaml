interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ PRAMENŮ 16. 9. 2026 (koš C3, druhá fronta, DATA-03) — NEPOVYŠOVAT:
  prameny dokládají pravý opak občerstvení pro veřejnost.
  IDENTITA POTVRZENA MĚŘENÍM: vlastní web uvádí GPS „50°39'45.137″N,
  15°49'14.556″E" — 4 m od našeho bodu, hluboko pod prahem TYZ_DUM_M (30 m).
  marsovka.cz (…/kontakty-a-mapa, otevřeno 16. 9. 2026): „Chalupa Maršovka,
  Lysečinská 9, 542 02 Horní Maršov", telefon „+420 728 028 444", e-mail
  „info@marsovka.cz". O restauraci ani o veřejném občerstvení ani věta.
  turistika.cz (…/chaty-chalupy/detail/chalupa-marsovka-horni-marsov-6567,
  otevřeno 16. 9. 2026): „Kapacita: 4 až 15 osob", „Pokoje: 6 ložnic"
  a rozhodující cena „léto 25.900kč, zima 26.600kč / chalupa za týden" —
  cena za CELÝ objekt na týden, tedy pronájem vcelku jedné skupině. Veřejná
  restaurace zmíněna není. Týž případ jako Chata Grácie (14. 9.) a Mlynářka
  (15. 9.), jen doložený cenou místo věty o pronájmu.
  NESHODA E-MAILU, nedomýšlet: OSM vede „rezervace@marsovka.cz", vlastní web
  „info@marsovka.cz". Na verdiktu to nic nemění; do profilu ani jedno
  nepřebírat bez ověření.
  NESHODA PSČ, nedomýšlet: vlastní web „542 02", hkregion.cz u sousední
  Kovárny „542 26". Nerozsuzujeme.
  K MĚŘENÍ z 6. 9. 2026 (značka 10 m, tři trasy do 250 m, rozcestník 275 m):
  poloha v zástavbě Horního Maršova; roli na trase měření nedokládá.
  Návrh: VYŘADIT (čeká na tvé potvrzení).
  SOUSED, NE DUPLICITA: 44 m k apartman-u-potoka — Lysečinská 9 × Lysečinská
  10, dva provozovatelé (marsovka.cz × ubytovanikrkonose-marsov.cz), dva
  různé telefony. Práh 30 m je tu minul správně. K Chatě Kovárna 74 m.
