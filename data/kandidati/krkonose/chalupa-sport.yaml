interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 24. 9. 2026 (třetí fronta koše C3, dočtení) — BEZ VERDIKTU, identita
  se nepodařila doložit. Nic se nevyřazuje ani nepovyšuje.

  Co se hledalo (WebSearch, 24. 9. 2026, dva dotazy): objekt jménem
  „Chalupa Sport" v okolí Rokytnice nad Jizerou. Jediný nalezený objekt
  podobného jména jsou **Apartmány SPORT**
  (https://www.apartmany-sport.cz/cs/ — 9 apartmánů, součástí budovy
  půjčovna lyží, skiservis a prodejna), které samy o sobě říkají, že stojí
  „přímo v centru Rokytnice nad Jizerou". Náš OSM objekt (way/149315094)
  ovšem leží měřením **2 459 m od střediska Rokytnice nad Jizerou** a
  4 722 m od nejbližšího publikovaného profilu (Chata Studenov), tedy ne
  v centru. Adresu ani GPS ten pramen neuvádí, takže shodu ani rozpor
  doložit nelze — a jméno „Sport" je příliš obecné, aby identitu uneslo
  samo.

  Ke stravování tedy nevíme nic ani o jednom z obou objektů: pramen
  u Apartmánů SPORT jmenuje jen restaurace a pizzerii „v dosahu několika
  metrů", tedy cizí podniky.

  Druhý dotaz (Dolní Rokytnice / Františkov) vrátil jen nesouvisející
  chalupy k pronájmu. V OSM kandidát nenese web ani telefon, není tedy
  odkud pokračovat. Rozdíl mezi „doloženo, že hospoda není" a „nevíme nic"
  držím podle nálezu z 21. 9. 2026.
