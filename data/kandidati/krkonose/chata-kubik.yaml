interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 4. 10. 2026 (šestá fronta koše C3, čtvrtá dávka podle identifikátoru).
  NÁVRH: VYŘADIT — pramen veřejné občerstvení rovnou VYLUČUJE, nejen nedokládá
  („Bez stravy", hosté si vaří sami), a role na trase je z dávky nejslabší:
  339 m k modré č. 1808 Špindlerův Mlýn – Dolní Dvůr, 0 značených tras
  do 250 m, rozcestník 1 485 m. Padá na obou půlkách klíče.

  TOTOŽNOST OVĚŘENA SOUŘADNICÍ: hauzi.cz uvádí GPS 50.656423 / 15.633551 — od
  bodu kandidáta (50.656404 / 15.6335689) jsou to asi 2 metry. Týž dům, a je to
  dnešní nejtěsnější doklad totožnosti.

  CO PRAMEN ŘÍKÁ: samoobslužný pronájem celé chaty — „Bez stravy", k tomu plně
  vybavená kuchyně (mikrovlnka, elektrický sporák, pečicí trouba, chladnička)
  a jídelní koutek. Kapacita max. 23 osob v 7 ložnicích (z toho 5 na rozkládacích
  lůžkách), 1 koupelna a 2 WC, parkování pro 10 vozů. Poloha „na okraji obce,
  u lesa"; z turistického zázemí pramen jmenuje až vleky Ski Family Dolní Dvůr
  (2 km) a Bozkovské dolomitové jeskyně (39,4 km) — nic v objektu.

  ADRESA DOPLNĚNA PRAMENEM (OSM ji nenese): „Dolní Dvůr 52, 543 42". Do polí
  kandidáta se nezapisuje, kandidát se nedoplňuje — jde o návrh na vyřazení.

  SOUSEDSTVÍ: `chata-jitka` (Dolní Dvůr 53) stojí asi 160 m odtud a je v téže
  dávce. Dvě různá čísla popisná, dva různé objekty — není to duplicita.

  VADA V OSM `website`, šestý druh: http://www.chatakubik.cz/ se ze sandboxu
  nenačetl kvůli SMYČCE PŘESMĚROVÁNÍ — https verze vrací 302 na http verzi téže
  adresy. Totéž se 2. 10. 2026 stalo u jedné z domén `chata-beata`. Není to
  důvod k verdiktu, verdikt stojí na hauzi.cz.
  Pramen: https://www.hauzi.cz/chata-kubik
