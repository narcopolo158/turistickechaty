interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 4. 10. 2026 (šestá fronta koše C3, čtvrtá dávka podle identifikátoru).
  DRŽENÝ BEZ VERDIKTU — „třetí stav": horská restaurace v objektu DOLOŽENA
  (a popsaná jazykem, který na veřejný provoz zní), veřejný přístup k ní ale
  doložený NENÍ a silnější z obou pramenů je ARCHIVNÍ. Role na trase je přitom
  z dávky slabá: 367 m k červené č. 0431 Bucharova cesta, 0 značených tras
  do 250 m, rozcestník 398 m.

  TOTOŽNOST OVĚŘENA SOUŘADNICÍ: ceskehory.cz uvádí GPS 50.667449 / 15.561473 —
  od bodu kandidáta (50.6674935 / 15.5614556) je to asi 5 m. Týž dům.
  (Jmenovec, pozor: „Horská chata Karolinka" je i v Bzovém u Velkých Karlovic,
  Beskydy — to NENÍ tento objekt.)

  CO PRAMENY O GASTRU ŘÍKAJÍ, doslova: ceskehory.cz „Malebná chata Karolínka
  Vám nabízí příjemné posezení v krásné dřevěné horské restauraci s domácí
  kuchyní" — formulace „nabízí příjemné posezení" je zvací a zní na veřejný
  provoz, ale komu je restaurace otevřená, neříká. kampocesku.cz (článek
  z 1. 3. 2010) z druhé strany: „Je zde bar i perfektní kuchyně" a nabídka
  snídaní, polopenzí a plných penzí — to je strava PRO UBYTOVANÉ. Dohromady
  tedy: provoz existuje, adresát provozu nedoložen.

  ARCHIVNÍ PRAMEN POTŘETÍ ZA TÝDEN (po `grohmanova-bouda` 30. 9. a
  `chata-beata` 2. 10.): záznam ceskehory.cz nese výhradu „Objekt v archivu —
  prezentace není aktivní. Uvedené údaje nemusí být již aktuální." Na rozdíl od
  `chata-beata` ale kandidát NEPADÁ na první půlce klíče měřené nad OSM daty —
  OSM u něj nese telefon, e-mail i web, tedy živé kontakty. Archiv je tu důvod
  k nedůvěře v DATUM, ne doklad o zániku provozu. Aktivní prezentaci jsem
  nedohledal: penziony.cz spadlo na smyčce přesměrování, vlastní web
  https://www.chatakarolinka.cz/ se ze sandboxu nenačetl.

  OSTATNÍ ÚDAJE: kapacita 50 lůžek (oba prameny se shodnou), nadmořská výška
  950 m (ceskehory.cz), pokoje 2–5 lůžkové a 4 apartmány, venkovní bazén,
  hřiště. Adresa „Chata Karolínka č. p. 41, 512 37 Benecko", kontaktní osoba
  Jiří Kamenický (kudyznudy.cz).

  SUPERLATIV K `zajimavosti`, POKUD SE POVÝŠÍ: kampocesku.cz o objektu píše, že
  je to „nejvýše položená chata" v Benecku. Je to tvrzení článku z roku 2010,
  ne měření — zapsat jen se zdrojem a jako claim, ne jako fakt (CLAUDE.md).

  ROZPOR V TELEFONU, oba zapsány: OSM +420 724 921152, kampocesku.cz
  +420 723 165 025. E-mail chatakarolinka@volny.cz je na obou shodný.
