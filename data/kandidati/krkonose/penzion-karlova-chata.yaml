interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 23. 9. 2026 (třetí fronta koše C3 — kandidáti označení lexikonem
  jména, přísná varianta) — NÁVRH VYŘADIT. Prameny popisují penzion se
  stravováním pro ubytované; občerstvení pro veřejnost nedokládá žádný.

  Identita měřením: GPS z ČeskéHory.cz (50,677974 N / 15,833834 E) padne
  8,5 m od OSM uzlu.

  Pramen (nalezen přes WebSearch, čten 23. 9. 2026): ČeskéHory.cz
  https://www.ceskehory.cz/ubytovani/karlova-chata-dolni-lyseciny.html —
  druh ubytování „penzion", 28 lůžek v pokojích po 2–5, Dolní Lysečiny
  (Horní Maršov), 700 m n. m., 2 km od Pece pod Sněžkou; jídelna,
  společenská místnost s krbem, tenisový kurt. Stravování: polopenze,
  plná penze na objednávku „pro skupiny na kurzech či školách v přírodě",
  grilování. O přístupu neubytovaných ke stravování ani slovo. Zápis je
  archivní („Objekt v archivu - prezentace není aktivní. Uvedené údaje
  nemusí být již aktuální."), stáří údajů tedy neznáme.

  Vlastní web karlovachata.cz z OSM se ve vyhledávání neukázal; přímé
  načtení domény by chtělo Michalovo svolení (konvence z 2. 8. 2026) —
  neobcházeno.
