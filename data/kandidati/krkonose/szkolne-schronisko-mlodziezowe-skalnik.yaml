interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=hostel (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 19. 9. 2026 (druhá fronta koše C3, 8. místo) — NÁVRH VYŘADIT, ale
  HRANIČNÍ, čeká na rozhodnutí Michala. Role na trase doložena: článek
  pawlowski.cc nese v titulku „Główny Szlak Sudecki; Schronisko PTTK
  Odrodzenie - Schronisko PTSM Skalnik w Bukowcu" a autor tu jako pěší
  turista na GSS přespal. Občerstvení pro veřejnost doložené NENÍ.
  Adresa ul. Szkolna 2, 58-533 Bukowiec (PTSM).

  Prameny (nalezeno přes WebSearch, čteno 19. 9. 2026): (1) PTSM
  https://ptsm.org.pl/schroniska/szkolne-schronisko-mlodziezowe-skalnik-w-bukowcu/
  — jen adresa a telefony, o stravování nic. (2) Nocowanie.pl
  https://www.nocowanie.pl/noclegi/myslakowice/internaty_schroniska/33872/ —
  uvádí „kuchnię serwującą całodniowe wyżywienie" a „kuchnię przystosowaną
  do samoobsługi"; pro koho se vaří, neříká. (3) pawlowski.cc
  https://www.pawlowski.cc/5300/glowny-szlak-sudecki-schronisko-pttk-odrodzenie-schronisko-ptsm-skalnik-w-bukowcu/
  (2017) — přespání za 22 zł, rezervace telefonem ráno, a o jídle doslova
  „wiem, że w schronisku PTSM, go nie dostanę" (autor se proto najedl
  v hospodě cestou). Pramen je z roku 2017, dnešní stav nedokládá.
  (4) visitkarkonosze.com — o stravě nic. Web z OSM schronisko-skalnik.pl
  je dnes jen rám s odkazem na wixsite.com, obsah se nepodařilo otevřít.

  Proč hraniční: jde o levné ubytování pro pěší na Głównym Szlaku Sudeckim,
  tedy roli na trase má silnější než jen blízkost značky. Klíč ale žádá
  i občerstvení pro veřejnost, a to jediný konkrétní pramen (2017) popírá.
  Nedomýšlíme, zda dnes jídlo kolemjdoucím dají.
