interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 17. 9. 2026 (druhá fronta koše C3, 3. místo) — NÁVRH VYŘADIT, čeká na
  potvrzení Michalem. Klíč zařazení žádá roli na trase A občerstvení pro
  veřejnost; druhá půlka není doložená žádným pramenem. Adresa Velká Úpa 144,
  Pec pod Sněžkou 542 21.

  Prameny (obojí nalezeno přes WebSearch, čteno 17. 9. 2026): (1) Firmy.cz
  https://www.firmy.cz/detail/310387-chata-tobisek-pec-pod-snezkou-velka-upa.html
  — zápis je NEAKTIVNÍ („Tato firma nebo pobočka již není aktivní"), kategorie
  „Horské ubytování, Horské chaty a chalupy" (tedy ubytovací, ne restaurační),
  popis doslova: „K dispozici je kuchyň, jídelna, společenská místnost
  a lyžárna." GPS zápisu 50.6893597, 15.7649881 = 14 m od našeho bodu →
  identita ověřena měřením. (2) czeskiegory.pl
  https://www.czeskiegory.pl/zakwaterowanie/chata-tobisek-wielka-upa.html —
  21 lůžek, „chata wynajmowana jest całkowicie jednej grupie dla 16-21 osób",
  společná kuchyně a jídelna; restaurace ani stravování pro veřejnost
  zmíněné nejsou. GPS 50.689259, 15.764988 (shodné s Firmy.cz).

  Vzor je týž jako u Chalupy Maršovka (16. 9.) a Chaty Kovárna (16. 9.):
  objekt se pronajímá vcelku jedné skupině a kuchyň slouží hostům. Kategorie
  zápisu opět rozhoduje víc než jeho existence (vzor ze 16. 9.), tady navíc
  u zápisu NEAKTIVNÍHO.

  POZOR na jméno: czeskiegory.pl vede na téže adrese a týchž souřadnicích
  název „Chalupa v Údolí"; Firmy.cz i URL portálu drží „Chata Tobísek".
  Nedomýšlíme, který název je aktuální — identitu drží adresa a GPS, ne jméno.
  Je to šestý z dvanácti čtených kandidátů, u něhož jméno nebo web z OSM
  neodpovídá pramenům.
