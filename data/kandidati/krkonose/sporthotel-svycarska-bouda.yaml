interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=hotel (alpine_hut = obsluhovaná, wilderness_hut
  = útulna).

  ČTENO 13. 10. 2026 (šestá fronta koše C3, desátá dávka — dočtení fronty) —
  DRŽET, TŘETÍ STAV: gastro je doloženo, veřejný přístup nedoložen. Role na
  trase SPLNĚNA, a je to nejsilnější měření v celém zbytku fronty. Verdikt
  čeká na klíč ke třetímu stavu (otázka ze 4. 10. 2026); je to osmý držený
  kandidát a první, u kterého je gastro doloženo restaurací, ne jen jídelnou
  pro hosty.

  Gastro: DOLOŽENO. První pramen píše „vlastní stylová restaurace s kapacitou
  90 míst", k tomu „v létě terasa s obsluhou" a „při dobrém počasí je možné
  grilování"; v přehledu stravování má snídaně, polopenzi i plnou penzi
  odškrtnuté křížkem, slovy to ale nikde neříká. Druhý pramen (nabídka
  pobytu) to doplňuje: „Bufetové snídaně si vychutnáte v hotelové
  restauraci.", „Na místě je možné dokoupit si polopenzi." a „Možnost
  dokoupení večeře" (390 Kč dospělý, 240 Kč dítě 3–10 let). Ani jeden pramen
  neříká, jestli smí do restaurace neubytovaný — a je to u obou jediná
  mezera, přesně jako u `krausovy-boudy` (12. 10.).
  Source: https://www.spindleruv-mlyn.com/en/accommodation/hotely/sporthotel-svycarska-bouda-spindleruv-mlyn-labska-krkonose-18/
  (čteno 13. 10. 2026, verified: false).
  Source: https://www.slevomat.cz/akce/2404264-svycarska-bouda-snidane-hriste-a-slevy-na-zazitky
  (čteno 13. 10. 2026, verified: false).
  Source: https://www.slevomat.cz/podnik/211900-hotel-svycarska-bouda
  (čteno 13. 10. 2026, verified: false).

  Role na trase: SPLNĚNA — 10 m k ose žluté č. 140007 [Ž] Labská přehrada
  hráz. – Pod Černou skálou, 1 značená trasa do 250 m, rozcestník 199 m
  (měření 6. 9. 2026). Deset metrů je nejmenší odstup od značky v celé šesté
  frontě.

  Totožnost: DOLOŽENA souřadnicí — pramen uvádí 50,7167358 / 15,5720482
  proti OSM 50,7166807 / 15,5720585, tedy **6,2 m**; adresa Labská 1,
  543 51 Špindlerův Mlýn sedí s OSM. Třetí nejpřesnější doklad v koši po
  `chata-advokatka` (2,1 m) a `zinneckerovy-boudy` (5,9 m).

  Údaje z pramenů (verified: false): Labská 1, 543 51 Špindlerův Mlýn;
  3× třílůžkový a 11× dvoulůžkový pokoj, 3× pětilůžkový, 2× čtyřlůžkový
  a 1× šestilůžkový apartmán (celkové lůžko pramen nesčítá); restaurace
  90 míst; wellness (bazén, sauna, vířivka, venkovní bazén — dle recenze
  „ve vedlejší chatičce"), kolárna, lyžárna, dětské hřiště a koutek;
  platební karty objekt dle pramene nepřijímá. Telefony +420 722 933 863
  a +420 606 283 300 (třetí pramen uvádí i +420 722 955 844), e-mail
  hotel@svycarskabouda.cz, web svycarskabouda.cz. Nadmořskou výšku neuvádí
  ani jeden pramen.

  K DATA-04: telefonát rozhodne verdikt jednou větou — otázka zní, jestli
  do restaurace (90 míst) smí i neubytovaný a jaká je její doba.

  Pozn.: vlastní doména svycarskabouda.cz se znovu nenačetla
  (`PROVENANCE_REQUIRED`) — čtrnáctý případ, viz otázka z 24. 9. 2026.
