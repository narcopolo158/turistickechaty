interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 7. 10. 2026 (šestá fronta koše C3, sedmá dávka) — NÁVRH VYŘADIT,
  a padá na OBOU půlkách klíče.

  Občerstvení pro veřejnost: NENÍ, a pramen to říká o pronájmu natvrdo —
  „Nie wynajmujemy pojedynczych pokoi": pronajímá se jen celá vila pro 1–6
  osob ve čtyřech ložnicích, s vybavenou kuchyní, jídelnou a saunou v suterénu.
  Restaurace ani veřejné stravování se nezmiňuje. Druhý pramen popisuje objekt
  jako „dom letniskowy" pro 6 osob, cena 910 PLN za celý dům.
  Sources: https://sauna.fit/obiekt/willa-jagoda-jagniatkow
  a https://meteor-turystyka.pl/willajagoda-jeleniagora,jelenia-gora.html
  (oba čteny 7. 10. 2026, verified: false).

  Role na trase: NESPLNĚNA — 282 m k ose modré Podgórzyn Dolny – Czarna
  Przełęcz, 0 značených tras do 250 m, rozcestník 4 204 m (měření 6. 9. 2026).
  Je to nejtěsnější propadnutí dnešní dávky: 32 m nad prahem.

  TOTOŽNOST DOLOŽENA SOUŘADNICÍ NA ~3,3 m — pramen uvádí 50,814526 N /
  15,603005 E proti OSM 50,8145004 / 15,6029814. Spolu s `chata-votocka` (3 m)
  je to druhý nejtěsnější doklad totožnosti v celém koši C3, hned po
  `chata-kubik` (2 m). Adresa Narciarska 7, 58-570 Jelenia Góra souhlasí s OSM.

  K DATA-25 (turistická minulost) — NEDOLOŽENO, jen interiér: pramen zmiňuje
  „wnętrza w retro stylu z lat 40." To je popis zařízení, NE doklad o roli
  objektu v turistickém provozu ani o roku vzniku. Žádný pramen rok vzniku
  neuvádí a nedomýšlí se.

  POZNÁMKA K OBLASTI: adresa i bod leží v Jagniątkowě (část Jelení Hory)
  „na granicy Karkonoskiego Parku Narodowego" — tady zařazení do Krkonoš
  sedí, na rozdíl od `widok-na-sniezke` z téže dávky.
