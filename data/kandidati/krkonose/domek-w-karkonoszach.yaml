interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 24. 9. 2026 (třetí fronta koše C3, dočtení) — NÁVRH VYŘADIT.
  Pramen popisuje rekreační domek s kuchyňským koutem a jídlem po dohodě
  jen pro ubytované; veřejný provoz výslovně popírá.

  Pramen (nalezen přes WebSearch, čten 24. 9. 2026):
  https://otonoclegi.pl/podgorzyn/gajowe_zacisze_u_gryfiego.html —
  „Gajowe Zacisze u Gryfiego", ul. Żołnierska 81c, 58-562 Podgórzyn
  (Zachełmie); „luksusowy domek letniskowy" pro 6 osob, posezení s wiatou
  biesiadnou do 12 osob, „aneks kuchenny" pro vlastní vaření; jídla
  (kociołek węgierski, pieczonki, dziczyzna) jen na objednávku
  u majitele, dostupné pouze ubytovaným — veřejný provoz pramen neuvádí.

  Identita měřením: GPS pramene (50,820550 / 15,682370) padne **66,9 m**
  od OSM uzlu — nad prahem 30 m, ale identitu nese navíc e-mail z OSM
  tagů `zaciszegajowe@gmail.com`, který je přesmyčkou jména objektu
  („Zacisze Gajowe"), a obec: 1 711 m od střediska Przesieka, uvnitř
  Zachełmí. Za doloženou ji proto považuji, jen ne měřením samotným.

  Tím se vysvětluje i marná dohledávka z 23. 9.: OSM jméno („Domek
  w Karkonoszach") je popisný titulek inzerátu, kdežto objekt se jmenuje
  Gajowe Zacisze u Gryfiego. Hledat podle OSM jména proto nikam nevedlo —
  klíč byl v e-mailu.
