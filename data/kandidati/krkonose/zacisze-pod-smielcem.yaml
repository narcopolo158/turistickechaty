interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Provozovatel dle OSM: Sudetia

  ČTENO 11. 10. 2026 (šestá fronta koše C3, osmá dávka) — NÁVRH VYŘADIT,
  padá na půlce občerstvení; role na trase je naopak SPLNĚNA.

  Občerstvení pro veřejnost: NENÍ. Katalog vede objekt jako „domki
  letniskowe" / holiday home a pronajímá celé jednotky (2× 75 m² pro 4 osoby,
  u objektu uvedeno „total 12 people"): „Guests will find a stovetop,
  a refrigerator, a dishwasher and kitchenware in the well-equipped kitchen",
  jednotka je „Independent accommodation" se samostatným vchodem. Restauraci,
  hospodu ani snídaně pro kolemjdoucí pramen nezmiňuje, ze zařízení uvádí jen
  gril („barbecue facilities").
  Source: https://www.gites.fr/gites_zacisze-pod-smielcem_jelenia-gora-jagniatkow_h2694062_en.htm
  (čteno 11. 10. 2026, verified: false).

  Role na trase: SPLNĚNA — 149 m k ose černé Schronisko Pod Łabskim Szczytem –
  Pod Petrovou Boudou, 3 značené trasy do 250 m, rozcestník 4 477 m (měření
  6. 9. 2026). Na verdiktu to nic nemění, protože klíč chce obě půlky.

  Totožnost: jméno, obec i ulice s číslem sedí (ul. Wczasowa 5a, Jelenia
  Góra-Jagniątków), souřadnice pramene 50,815565 / 15,612833 je ale od OSM
  bodu 50,8163583 / 15,612754 vzdálená **88 m** — na katalogový bod to je
  běžná nepřesnost, na doklad totožnosti souřadnicí to nestačí. Totožnost
  proto stojí na jménu, adrese a vlastní doméně, ne na souřadnici — zapsáno
  jako slabší.

  Vlastní doména `domkiwgorach.eu` (z OSM) se nečetla: skončila na
  `PROVENANCE_REQUIRED` (otázka pro Michala z 24. 9. 2026). Verdikt se opírá
  o katalog, ne o vlastní web.
