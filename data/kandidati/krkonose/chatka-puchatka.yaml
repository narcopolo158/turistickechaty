  DATA-03 křížové ověření (checked 2026-07-20, verified false; metoda: jen
  WebSearch — bezobslužná session, WebFetch nedostupný (PROVENANCE_REQUIRED i
  na dřív průchozích doménách), signál pochází z titulků a domén výsledků
  vyhledávání, obsah stránek NEotevřen — detaily doplní otevření webů):
  NEJEDNOZNAČNÉ — jméno „Chatka Puchatka“ nese v Karkonoších víc objektů:
  chatkapuchatka.com.pl („noclegi Karkonosze … Oferta“ — dle titulků ubytovací
  objekt), „Willa Chatka Puchatka“ v Michałowicích/Piechowicích
  (chatkapuchatka.wkarkonoszach.pl, e-turysta.com), karkonosze.pl vede „Chatka
  Puchatka — Szklarska Poręba“ (třetí lokalita) — a GPS kandidáta (50,746,
  15,781; typ útulna dle OSM) je přitom u Karpacze, kam neukazuje ani jeden z
  nalezených webů. Možný zdroj: přehled „Chatki turystyczne w Karkonoszach i
  Górach Izerskich“ (jbc.jelenia-gora.pl, PDF). K RUČNÍ KONTROLE: identita
  objektu na GPS z OSM nedoložena — nepovyšovat, dokud se nevyjasní.

