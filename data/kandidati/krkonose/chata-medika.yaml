interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 4. 10. 2026 (šestá fronta koše C3, čtvrtá dávka podle identifikátoru).
  DRŽENÝ BEZ VERDIKTU — „třetí stav": jídelna a bar v objektu DOLOŽENY, veřejný
  přístup k nim NE. Role na trase je přitom z celé dávky NEJLEPŠÍ: 67 m k modré
  č. 1808 Špindlerův Mlýn – Dolní Dvůr, 1 značená trasa do 250 m, rozcestník
  1 283 m. Zadržuju ho právě proto, že u něj jediná telefonní otázka (DATA-04)
  rozhoduje mezi vyřazením a povýšením.

  CO OBJEKT JE: PODNIKOVÉ REKREAČNÍ STŘEDISKO. Firmy.cz vede záznam na adrese
  „Dolní Dvůr 128, 543 42", kapacita „24 míst", kontakt romana.kloudova@
  homolka.cz a IČO 00064203 — tedy Nemocnice Na Homolce; ZlatéStránky.cz nesou
  objekt pod názvem „CHATA MEDIKA — REKREAČNÍ STŘEDISKO NEMOCNICE NA HOMOLCE,
  Dolní Dvůr, okres Trutnov" (samotný profil se nenačetl, robots.txt).
  hkregion.cz dodává jediné, co o provozu říká: „Celoročně provozovaná chata
  v krásném prostředí Dolního Dvora na okraji Krkonošského národního parku".
  Zázemí dle firmy.cz: „možnost stravování", „jídelnu, bar", sauna, venkovní
  gril s posezením, bazén, hřiště, pískoviště, wifi. Že jídelna nebo bar
  obsluhují i NEUBYTOVANÉ, neříká žádný pramen — a u zaměstnaneckého střediska
  to nelze předpokládat.

  VÝHRADA K DATU: firmy.cz u záznamu uvádí, že „firma neměla delší dobu
  aktualizaci". Údaje tedy platí k neznámému dni; jako doklad o typu objektu
  (podnikové středisko) to stačí, jako doklad o dnešním provozu ne.

  JMENOVEC V TÉŽE OBLASTI — a dosavadní poznámka repa se potvrdila: druhý
  kandidát `chata-medika-2411927307` je 15 601 m odtud na opačné straně hor a
  je to JINÝ dům. Doklad je adresa: živá prezentace chata-medika.cz uvádí
  „Horní Albeřice 12", provozovatelku Petru Pálkovou (IČ 03559521), 24 lůžek
  + 5 přistýlek a tel. +420 777 290 433 — to je ten druhý kandidát (OSM web
  alberice.slinet.cz), ne tenhle. Zápis z 10. 9. 2026 to přiřadil správně.
  POZOR na past: kapacita 24 vychází u OBOU objektů, takže podle čísla kapacity
  se ti dva rozlišit NEDAJÍ. Rozlišuje adresa a IČ.

  VADA V OSM `website` — pozor, NENÍ to vada tohoto kandidáta: OSM u něj nese
  http://www.chatamedika.cz/ (bez spojovníku), kdežto živý web chata-medika.cz
  (se spojovníkem) patří albeřickému jmenovci. Jestli chatamedika.cz patří
  tomuto objektu, NEROZHODNUTO — ze sandboxu se nenačetl.
  Prameny: https://www.firmy.cz/detail/2600703-chata-medika-dolni-dvur.html ;
  https://www.hkregion.cz/dr-cs/103018-chata-medika.html ;
  https://www.chata-medika.cz/ubytovani/ (k rozlišení jmenovce)
