interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 2. 10. 2026 (šestá fronta koše C3, třetí dávka podle identifikátoru).
  NÁVRH: DRŽET BEZ VERDIKTU — jediný z dnešní dávky, u kterého se veřejný gastro
  provoz nedá ani doložit, ani vyloučit. Na vyřazení je to málo, na povýšení
  chybí doklad.

  Role na trase: 1 značená trasa do 250 m, nejbližší značka 216 m (modrá
  č. 1817 Janské Lázně – Pod Starou horou), rozcestník 555 m. To je podprůměr,
  ale ne vyloučení.
  Občerstvení: agregátor rezervací vede u objektu „1 restaurant on site"
  (položka „Restaurace #1") a stravu „Meal plans can be arranged on request"
  (snídaně Continental / Full English / bezlepková / bufet); kuchyňka pro hosty
  k dispozici NENÍ. Že by restaurace obsluhovala i neubytované, pramen neříká —
  a recenze hosta zmiňující obědy odpoledne je recenze, ne provozní informace,
  takže se z ní nic nevyvozuje.
  Pokus o druhý pramen: obec Horní Maršov vede na webu seznam restaurací, ale
  anglická verze stránky vypsala jedinou položku (Lysečinská bouda) a česká
  verze se ze sandboxu nenačetla (PROVENANCE_REQUIRED). Seznam tedy NENÍ úplný
  a jeho mlčení o Chatě Honzík NIC nedokazuje — výslovně to říkám, aby se
  z toho příště nedělal doklad.
  Umístění: pramen uvádí obec Horní Maršov (OSM `obec` nenese) — pozor, modrá
  značka i rozcestník míří na Janské Lázně, obě obce spolu sousedí.
  OTÁZKA K TELEFONÁTU (hodí se k DATA-04): je restaurace Chaty Honzík otevřená
  i neubytovaným, a v jaké době?
  Pramen: https://hotels.edreams.co.uk/hotel/cz/guest-house-honzik.en-gb.html
  Vlastní web www.chatahonzik.cz se ze sandboxu nenačetl.
