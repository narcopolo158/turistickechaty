interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 17. 9. 2026 (druhá fronta koše C3, 7. místo) — NÁVRH VYŘADIT, čeká na
  potvrzení Michalem. Čteno společně s `chata-baraba` (37 m odsud): druhá ze
  dvou chalup jednoho provozovatele, adresa Strážné 147, 543 52, Jaroslav
  Kobr, IČO 12228478. Prameny, doklady i odůvodnění jsou zapsané u
  `chata-baraba` — zkráceně: zimniubytovani.webnode.cz doslova „ubytování ve
  dvou chalupách v obci Strážné" a stravování „možnost samostatného vaření
  nebo polopenze", mrk.cz „Nabízíme polopenzi s chutným jídlem z naší
  kuchyně."; veřejnou restauraci nedokládá žádný ze čtyř pramenů.

  Identita: jediná GPS v pramenech (Živéfirmy, 50.666336, 15.613078) padne na
  Barabu (7 m), od našeho bodu je 38 m — adresu tedy nese Baraba a Popelka je
  druhý dům téhož majitele. Tenhle bod drží jméno a pramen o dvou chalupách,
  ne vlastní souřadnice z pramene.

  POZOR na jmenovce: v Krkonoších je ještě jedna **Chata Popelka**, v Horní
  Malé Úpě (chatapopelka.cz, e-chalupy.cz/…-o6132) — jiný objekt, jiný
  provozovatel, ~15 km odsud. Při dohledávání podle jména se prameny obou
  míchají; náš kandidát je ten ve Strážném.
