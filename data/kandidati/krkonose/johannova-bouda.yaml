  TRIÁŽ KOŠ B — křížové ověření (checked 2026-08-26, WebSearch + otevřené
  stránky, vše verified: false):

  Občerstvení pro veřejnost DOLOŽENO. Vlastní web (sekce Restaurace,
  johannovabouda.cz/restaurace/) uvádí „Samoobslužný bufetový restaurant" a
  „Krkonošská hospůdka pro odpočinek i zábavu", kapacitu 80 osob a vlastní
  otvírací dobu „v zimním období 9:30 - 22 00 - i déle dle domluvy", „v
  mimosezóním období dle domluvy". Firmy.cz vede pobočku v kategoriích „Horské
  penziony" a „Restaurace" se „samoobslužný bufet". Omezení jen na ubytované
  žádný pramen neuvádí.

  Poloha SVĚDČÍ PRO STŘEDISKO, ne pro hřeben. Adresa „Na Stráni 100, Hořejší
  Vrchlabí", udávaná výška 550 m (ceskehory.cz, hkregion.cz — ubytovací
  katalogy, ne mapový pramen). hkregion.cz: „Rodinný penzion se stylovou
  restaurací na okraji města Vrchlabí"; vlastní web: „Najdete nás na okraji
  Vrchlabí… hned z boudy můžete nastupovat na 4 sedačkovou lanovku"; skibubakov.cz
  vede objekt mezi službami areálu („Přímo na sjezdovce"). Žádný pramen neuvádí
  značenou turistickou trasu kolem objektu.

  Turistická minulost SLABÁ. Vlastní web i ceskehory.cz: „Johann Wiesner
  postavil roku 1926 dům pro svou rodinu." — tedy rodinný dům, ne veřejná
  bouda. Dnešní stavba je novostavba: realitní inzerát (realitycechy.cz) uvádí
  „Objekt, postavený na základech původní Johannovy boudy v r. 2010". Zda objekt
  někdy sloužil jako veřejná turistická bouda, doloženo NENÍ; jediné zmínky o
  „dlouhé historii" pocházejí z marketingu provozovatele a z prodejního inzerátu.

  NÁVRH REDAKCI: SPORNÉ S KLÍČEM — občerstvení klíč splňuje, ale objekt stojí ve
  sjezdařském areálu na okraji města, ne na trase. Je to týž vzor jako Sasanka a
  Chata Eliška: rozhoduje Michalovo pravidlo pro objekty ve střediscích, ne další
  dohledávka. Do rozhodnutí nepovyšovat ani nevyřazovat.
