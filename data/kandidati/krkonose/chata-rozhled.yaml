interniPoznamky: >-
  RUČNÍ KANDIDÁT — zpětné dohledání přes turistickou známku č.14. Horská chata
  Rozhled ve Strážném, vlastní web chatarozhled.cz (doména z titulků WebSearch,
  obsah neotevřen). NEZAMĚŇOVAT s „Jiráskovou turistickou chatou s rozhlednou"
  na Kladském pomezí (Náchodsko) — jiný objekt téhož obecného jména, vyloučen.

  Klíč zařazení (Michalovo pravidlo): „s veřejným občerstvením → zařadit".
  Chata Rozhled je horská chata s ubytováním; **veřejné občerstvení z titulků
  NEpotvrzeno** — před povýšením doložit z webu (jinak zůstává kandidátem).

  K dotažení před povýšením (DATA-03): potvrdit veřejné občerstvení/restauraci,
  kontakty, kapacitu, přesnou GPS + výšku z OSM/mapy (v OSM exportu DATA-01
  nebyla — prověřit tagování). Zdroj obrázku známky připraven:
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c14-chata-rozhled.png
  (po povýšení → public/znamky/chata-rozhled.png + manifest + katalog).

  ROZHODNUTÍ 25. 7. 2026 — ZŮSTÁVÁ KANDIDÁTEM (nepovýšeno). Vlastní web byl
  tentokrát skutečně otevřen a klíč zařazení se jím doložit NEPODAŘILO: „Bufet
  s nápoji a sladkostmi v provozu po celý den." je jediná zmínka o občerstvení
  a neříká, komu je bufet určen. Gate, který si tenhle soubor sám uložil výše
  („veřejné občerstvení NEpotvrzeno — před povýšením doložit z webu"), tedy
  platí dál. Nedomýšlet: „bufet v horské chatě" ≠ „bufet pro veřejnost".

  Rozpor v kapacitě zůstává neuzavřen: 26 lůžek (ceskehory.cz) vs. 55 lůžek
  (cztip.cz), přičemž rozpis pokojů na cztip.cz (7×2 + 2×3 + 1×4) dává 24.
  Vlastní web kapacitu neuvádí vůbec. Do profilu nepřenášet ani jedno číslo.

  DOPORUČENÍ MICHALOVI: ideální kandidát na jeden telefonát — stačí otázka
  „můžu si u vás dát něco k pití, když u vás nejsem ubytovaný?" a chata je buď
  hned povýšena (a rovnou s verified:true u občerstvení dle DATA-04), nebo
  definitivně vyřazena. Známka č.14 se nasazuje AŽ s povýšením (DATA-13).

  PŘEOVĚŘENO 26. 7. 2026 (Tier 2 master fronty) — STAV TRVÁ, NEPOVYŠOVAT.
  Vlastní web znovu otevřen: bufetová věta beze změny („Bufet s nápoji
  a sladkostmi v provozu po celý den."), o určení bufetu web dál mlčí; nově
  vytaženy věty „Na chatě naleznete původní dřevěnou jídelnu s kachlovými
  kamny.", „Jednoduché domácí prostředí i typicky česká jídla, s posezením
  u kachlových kamen", „Polopenze, či plná penze je domácího typu." — vše
  penzového typu, nic pro kolemjdoucí. Druhý pramen ceskehory.cz (otevřen
  26. 7. 2026): „bufet s nápoji a malým občerstvením", „jídelna (služby
  jsou s plnou nebo polopenzí)", „kapacita: 26 lůžek", „Pokoje jsou
  většinou dvoulůžkové", „nadmořská výška: 1207 m", „Objekt se nachází
  v chráněné zoně klidu Krnapu - Přední Rennerovky", „V létě možnost
  dojetí autem k chatě, v zimě je ve Strážném hlídané parkoviště a hosté
  jsou přepravováni rolbou - 3km" — ani tady věta o veřejnosti není.
  Kapacita 26 od ceskehory.cz posiluje starší číslo 26 proti 55 z cztip.cz,
  ale rozpor se tím nerozhoduje (mohou si opisovat). Telefonát zůstává
  nejrychlejší cestou.
