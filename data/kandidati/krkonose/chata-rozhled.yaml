interniPoznamky: >-
  RUČNÍ KANDIDÁT — zpětné dohledání přes turistickou známku č.14. Horská chata
  Rozhled ve Strážném, vlastní web chatarozhled.cz (doména z titulků WebSearch,
  obsah neotevřen). NEZAMĚŇOVAT s „Jiráskovou turistickou chatou s rozhlednou"
  na Kladském pomezí (Náchodsko) — jiný objekt téhož obecného jména, vyloučen.

  Klíč zařazení (Michalovo pravidlo): „s veřejným občerstvením → zařadit".
  Chata Rozhled je horská chata s ubytováním; **veřejné občerstvení z titulků
  NEpotvrzeno** — před povýšením doložit z webu (jinak zůstává kandidátem).

  K dotažení před povýšením (DATA-03): potvrdit veřejné občerstvení/restauraci,
  kontakty, kapacitu, přesnou GPS + výšku z OSM/mapy (v OSM exportu DATA-01
  nebyla — prověřit tagování). Zdroj obrázku známky připraven:
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c14-chata-rozhled.png
  (po povýšení → public/znamky/chata-rozhled.png + manifest + katalog).
