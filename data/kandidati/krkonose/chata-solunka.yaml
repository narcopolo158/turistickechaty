interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 12. 10. 2026 (šestá fronta koše C3, devátá dávka) — NÁVRH VYŘADIT,
  padá na OBOU půlkách klíče.

  Občerstvení pro veřejnost: NENÍ. Pramen vede objekt jako chalupu
  k pronájmu celou („Objekt se pronajímá celý", „po dobu pobytu ho budete
  mít jen pro sebe, bez sdílení s dalšími hosty") a stravování odkazuje na
  vlastní vaření: „Stravování je možné si připravovat ve vybavené kuchyni".
  Kolemjdoucího pramen posílá jinam — „využít restauraci v chalupě Rovinka
  (900m) nebo u Piráta (1800m)". Kapacita 30 lůžek v 10 ložnicích, cena
  9 500 Kč/noc za celý objekt.
  Source: https://www.e-chalupy.cz/ubytovani-labska-chalupa-solunka-pronajmuti-o5278
  (čteno 12. 10. 2026, verified: false).

  Role na trase: NESPLNĚNA — 520 m k ose žluté č. 7307 [Ž] Rokytnice n. Jiz
  – Sedlo Mokrá Prelecz, **0 značených tras do 250 m**, rozcestník 733 m
  (měření 6. 9. 2026). Jediný kandidát devítičlenné fronty nad prahem.

  Totožnost: doložena souřadnicí — pramen 50,6805225 / 15,577852778 je od
  OSM bodu 50,6805813 / 15,5779275 **8,4 m**.

  NÁLEZ K DATA-25 (turistická minulost), na verdikt vliv nemá: pramen
  dokládá, že kuchyně objektu dřív sloužila stravování — „Kuchyň je plně
  vybavená, původně se tady vařily plné penze hostům", a zmiňuje dva velké
  průmyslové sporáky. Je to první kandidát koše C3, u kterého pramen
  výslovně říká, že občerstvení tu BYLO a NENÍ. Plná penze hostům ale není
  hospoda pro kolemjdoucího ani role na trase (0 značek do 250 m), takže
  i pro rozšířený klíč je to podklad ke čtení, ne k povýšení.

  Pozn.: pramen uvádí u objektu vlastní sjezdovku 350 m, bazén, vířivku
  a infrasaunu a polohu „na samotě" mezi Herlíkovicemi a Špindlerovým
  Mlýnem — měření 6. 9. tomu odpovídá.
