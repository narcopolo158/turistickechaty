interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 2. 10. 2026 (šestá fronta koše C3, třetí dávka podle identifikátoru).
  NÁVRH: VYŘADIT — padá na první půlce klíče (role na trase), druhá je
  nedoložená.

  Role na trase: 0 značených tras do 250 m, nejbližší značka 306 m (czarny
  Szlak dokoła Szklarskiej Poręby), rozcestník 3 138 m. Objekt stojí v zástavbě
  Szklarské Poręby (ul. Odrodzenia 25), ne na trase.
  Občerstvení: pensjonat pro běžkaře, „16 miejsc noclegowych w pokojach dwu
  i trzyosobowych", strava se dá dokoupit (kuchyně na bázi italské kuchyně,
  k dispozici i vybavená kuchyňka pro hosty). Že by se najedl kolemjdoucí bez
  ubytování, neříká žádný pramen.
