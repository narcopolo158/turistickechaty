interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Provozovatel dle OSM: Holiday Park&Resort sp. z o.o. sp. k.

  ČTENO 30. 9. 2026 (koš C3, šestá fronta — pořadí podle identifikátoru) —
  NÁVRH: VYŘADIT. Nevyřazuji sám, rozhodne redakce. Padá na OBOU půlkách
  klíče zařazení a je to nejjasnější případ dnešní dávky.

  CO TO JE. Vlastní web (https://holidaypark.pl/uzdrowisko-cieplice-zdroj) se
  ze sandboxu načíst nepodařilo, přečten katalog triverna.pl
  (https://triverna.pl/hotel/holiday-park-resort-uzdrowisko-cieplice-zdroj-jelenia-gora,
  čteno 30. 9. 2026): resort **přes 200 dřevěných domků**, doslova „To
  pierwszy kompleks w górach znanej rodzinnej sieci Holiday Park & Resort,
  otwarty we wrześniu 2022 roku" — tedy provoz otevřený v ZÁŘÍ 2022. Jeden
  domek pojme až 9 hostů. Adresa shodná s OSM: ul. Dolnośląska 6, 58-560
  Jelenia Góra, v severní části Cieplic Śląskich-Zdroju.

  VEŘEJNÉ OBČERSTVENÍ NEDOLOŽENO: pramen jmenuje „punkty gastronomiczne
  w postaci restauracji śniadaniowej, baru, bistra oraz słodkiego kącika",
  ale o přístupnosti pro kolemjdoucí nemluví; snídaňová restaurace je ze své
  povahy provoz pro hosty. Mezera v pramenech, ne výslovné vyloučení.

  ROLE NA TRASE (`scripts/triaz-role-na-trase.ts`, 30. 9. 2026): nejbližší
  značka **837 m** (zelená Cieplicki szlak spacerowy Zielony), **0 značených
  tras do 250 m**, nejbližší rozcestník **11 423 m**. Role na trase doložená
  NENÍ.

  KANDIDÁT DALEKO OD SVÉ OBLASTI — pátý doklad k otevřené otázce z 23. 9.
  Cieplice jsou lázeňská část Jelenie Góry v kotlině, ne krkonošský svah; i
  nejbližší značka je městská „szlak spacerowy".
