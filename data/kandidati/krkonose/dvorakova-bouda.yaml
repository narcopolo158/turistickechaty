interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  TRIÁŽ 29. 8. 2026 (koš B, čtvrté čtení) — DRUHÝ NEJSILNĚJŠÍ DNES a vůbec
  poprvé v celé triáži máme přístup veřejnosti doložený DOSLOVA, ne
  odvozením. Kudy z nudy
  (https://www.kudyznudy.cz/aktivity/dvorakova-bouda-v-krkonosich) píše:
  „V restauraci, přístupné všem příchozím hostům, na vás čeká spousta
  dobrot nejen z masa" — to je přesně ta věta, kterou jsme u boudy-pod-snezkou
  a dalších marně hledali. Otevřeno dle téhož pramene denně 11:00–23:00.
  ROLE NA TRASE: týž pramen ji klade do nadmořské výšky „1 235 m n. m."
  nad Špindlerovým Mlýnem, do lokality „Sedmidolí" a „pod Petrovou boudou".
  Hřebenová poloha je tím doložená; konkrétní turistická značka doložená
  NENÍ (proto se do profilu nesmí napsat).
  Provoz celoroční („po celý rok"), ubytování ve dvou- až pětilůžkových
  pokojích, u chaty vleky (300 m a Davidovky 1 200 m), běžky, sáňkařská
  dráha.
  POZOR na rok vzniku: doména dvorakovabouda.cz se v titulku prezentuje
  jako „Ubytování v Krkonoších s tradicí od 1876", ale samotnou stránku
  provozovatele jsme neotevřeli a Kudy z nudy rok neuvádí — letopočet
  proto zatím NENÍ doložený a do profilu nepatří, dokud se nepřečte
  vlastní web.
  → NÁVRH POVÝŠIT.
