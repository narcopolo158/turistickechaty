interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 12. 10. 2026 (šestá fronta koše C3, devátá dávka) — BEZ VERDIKTU,
  NEBYLO CO ČÍST. K objektu „Chata Kateřina" na adrese Bedřichov 35,
  Špindlerův Mlýn, se nepodařilo dohledat ani jeden pramen.

  Co se hledalo a co z toho bylo: (a) katalogy ceskehory.cz (seznam horských
  chat Špindlerova Mlýna vede šest objektů, Kateřina mezi nimi není),
  e-chalupy.cz, turistika.cz — nic pod tímto jménem v Bedřichově; (b)
  firemní rejstřík — v jeho výpisu horských chat a chalup Špindlerova Mlýna
  (12 záznamů) Kateřina není; (c) nejblizší katalogový záznam v Bedřichově
  je bezejmenná „Chata k pronájmu" e-chalupy.cz ID 12885 s bodem
  50,725998889 / 15,5993625, což je od OSM bodu 50,7249729 / 15,6039003
  **339,2 m** a jméno nenese žádné — na doklad to nestačí ani omylem.
  Záznam je navíc odstraněný („Objekt byl z prezentace na e-chalupy.cz
  odstraněn.").

  Roli na trase má přitom SPLNĚNU, a nejsilněji z celé dávky — 110 m k ose
  červené č. 0402 Labská bouda – Horní Mísečky vlek, **6 značených tras
  do 250 m**, rozcestník 246 m (měření 6. 9. 2026). Je to druhý kandidát
  „nebylo co číst" s doloženou rolí na trase (prvním byla `chata`, Labská
  22, 11. 10. 2026) a zároveň ten se nejsilnějším měřením v celé kategorii.
  Vyřadit ho naslepo by zahodilo možné povýšení.

  Pozn. ke jménu: „Chata Kateřina" v Krkonoších existuje — v Horní Malé Úpě
  (katalog e-chalupy.cz, ID 1238), tedy přes 25 km odtud a jiný objekt.
  Pátý název koše s víc nositeli, a první, u kterého jmenovec leží v témže
  pohoří, ale jinde než kandidát.
