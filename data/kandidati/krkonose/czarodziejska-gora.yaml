interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Provozovatel dle OSM: Fundacja Czarodziejska Góra

  ČTENO 30. 9. 2026 (koš C3, šestá fronta — pořadí podle identifikátoru) —
  NÁVRH: VYŘADIT. Nevyřazuji sám, rozhodne redakce. Nejdál od každé značky ze
  všech dosud čtených kandidátů koše C3.

  VEŘEJNÉ OBČERSTVENÍ NEDOLOŽENO. Vlastní web se v české verzi ze sandboxu
  nenačetl (PROVENANCE_REQUIRED), anglická verze prošla
  (https://czarodziejskagora.eu/en/, čteno 30. 9. 2026): jde o zařízení
  fundace zaměřené na hory a koně („about mountains and horses") s ubytováním
  popsaným jako „mountain hostel Magic Mountain (so called »barn«)" a s
  pobytovými programy. O restauraci ani občerstvení pro kolemjdoucí web
  nemluví vůbec — je to tedy MEZERA v pramenech, ne výslovné vyloučení.
  Kapacitu web v lůžkách neuvádí, výšku ani rok vzniku také ne (jen „over 10
  years ago"). Cena za hodinu s koněm 50 zł / 10 EUR.

  ROLE NA TRASE (`scripts/triaz-role-na-trase.ts`, 30. 9. 2026): nejbližší
  značka **1 125 m** (modrá Szklarska Poręba – Pasterka), **0 značených tras
  do 250 m**, nejbližší rozcestník **14 907 m**. Tady měření rozhoduje v tom
  směru, v němž rozhodovat umí: role na trase doložená NENÍ.

  KANDIDÁT DALEKO OD SVÉ OBLASTI — čtvrtý doklad k otevřené otázce z 23. 9.
  Vlastní web polohu popisuje jako „at the foot of the Karkonosze Mountains,
  in the neighbourhood of Rudawski Landscape Park", tedy Rudawy Janowickie,
  ne Krkonoše. Sedí to k číslům výš: 14,9 km k nejbližšímu rozcestníku
  krkonošského exportu.

  ROZPOR V ADRESE, oba zápisy vedeny: OSM má `Mniszków 17`, vlastní web
  „Mniszków 31, 58-520 Janowice Wielkie". Souřadnice se neměří, číslo
  popisné nedomýšlím.
