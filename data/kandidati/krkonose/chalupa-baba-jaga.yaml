interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=apartment (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 24. 9. 2026 (třetí fronta koše C3, dočtení) — NÁVRH VYŘADIT.
  Chalupa k pronájmu; jediné jmenované občerstvení pro veřejnost patří
  CIZÍMU podniku 50 m odtud, ne tomuto objektu.

  Pramen (nalezen přes WebSearch, čten 24. 9. 2026): vlastní web
  https://www.baba-jaga.cz/ubytovani.html — Prkenný Důl u Žacléře; dva
  třílůžkové a čtyři čtyřlůžkové pokoje s možností přistýlky plus jeden
  apartmán, kapacita do 22 osob (+ apartmán pro 4). Ke stravování pramen
  odkazuje na „restauraci Zelený Mlýn, která je 50 m od mé chaloupky";
  snídaně a jídlo „na vyžádání a dle kapacity". Vlastní kuchyň ani
  hospodu objekt nedokládá.

  Poloha podle pramene (Prkenný Důl, Žacléř) souhlasí s měřením: 3 693 m
  od publikované Rýchorské boudy, 5 688 m od střediska Horní Maršov. GPS
  pramen neuvádí, identitu tedy drží jméno a obec.

  Vedlejší nález k zapsání: restaurace **Zelený Mlýn** v Prkenném Dole je
  podle téhož pramene otevřená i veřejnosti. Jako podnik v údolní obci
  klíč zařazení nesplňuje (není role na turistické trase), ale je to už
  třetí případ, kdy u kandidáta z koše C3 je doložené občerstvení, které
  patří jiné budově — viz `chalupa-u-medveda` (23. 9.) a nález
  o „cizí budově" z 15. 9.
