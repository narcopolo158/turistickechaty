interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Otvírací doba dle OSM (surový formát, neověřeno): Mo-Su 09:00-21:00

  TRIÁŽ KOŠ B — křížové ověření (checked 2026-08-28, WebSearch + otevřené
  stránky, vše verified: false):

  Občerstvení pro veřejnost DOLOŽENO. Firmy.cz vede AKTIVNÍ samostatný
  záznam „Restaurace Jilemnická Bouda", obor „České a staročeské
  restaurace", adresa „Vítkovice 140, 512 38", telefon +420 739 222 911,
  hodnocení 3,6 z 52 hodnocení, a popis: restaurace se 70 místy, „polední
  menu, jídla domácí české kuchyně, alkoholické i nealkoholické nápoje", v
  letní sezóně venkovní posezení. Nezávisle ji jako restauraci vede
  pivnidenicek.cz a apetee.com. Samostatný záznam na restauraci = týž signál
  jako u Sokolích boud a Chaty Hradečanky. Sedí to i s OSM tagem
  opening_hours=Mo-Su 09:00-21:00.

  Role na trase NEDOLOŽENA — vlastní web se sám tituluje „Jilemnická Bouda -
  Horní Mísečky Krkonoše", adresa je Vítkovice 140, tedy STŘEDISKO HORNÍ
  MÍSEČKY. Žádný přečtený pramen neuvádí značenou trasu.

  Tenhle kandidát tedy visí na téže otevřené otázce jako chata-misecky a
  chata-stopa: JE HORNÍ MÍSEČKY „STŘEDISKO" VE STEJNÉM SMYSLU JAKO VÍTKOVICE
  A ROKYTNICE? Rozdíl je, že Horní Mísečky nejsou obec, ale horská osada v
  1000 m na hřebenovém nástupu. Jedna Michalova odpověď rozhodne celý shluk.
  (Pozor: čtvrtý člen shluku, restaurace-havlova-bouda, do něj podle
  dnešního čtení NEPATŘÍ — leží v Peci pod Sněžkou, viz oprava u toho
  kandidáta.)

  Vedlejší nález, který stojí za zápis: jméno souboru i OSM nese „Pension
  Jilemnická bouda", ale vlastní web i Firmy.cz vedou provoz jako
  „Jilemnická Bouda" s restaurací jako hlavní službou. Označení „Pension" v
  jménu bylo důvod, proč kandidát skončil i v koši „MIMO KLÍČ dle jména —
  ubytování bez veřejné služby". Doklad ukazuje opak: veřejná služba tam je.
  JMENNÝ KOŠ SE U TOHOTO KANDIDÁTA MÝLIL — je to doklad, že koš podle jména
  je jen předtřídění, ne rozhodnutí.

  NÁVRH REDAKCI: SPORNÉ (klíč střediska Horní Mísečky) — a zároveň vyřadit z
  jmenného koše MIMO KLÍČ.
