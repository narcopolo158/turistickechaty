interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  TRIÁŽ KOŠ B — křížové ověření (checked 2026-08-28, WebSearch + otevřené
  stránky, vše verified: false):

  Role na trase DOLOŽENA, a je to jedna z nejlepších poloh v koši. Vlastní
  web (boudapodsnezkou.cz) píše, že bouda stojí „na samotě na konci Obřího
  dolu" v Peci pod Sněžkou, ve 2. zóně KRNAP, jmenuje „modrou turistickou
  značku Obřím dolem" a uvádí „Od nás to máte na vrchol nejblíž" (Sněžka).
  Regionální destinační web krajinapodsnezkou.cz to potvrzuje jinými slovy:
  „davy se mačkají ve střediscích, ale vy máte hory sami pro sebe", „tiché
  přírody Obřího dolu", adresa „Pec pod Sněžkou 199". Souřadnice 50,7208 /
  15,7260 poloze v Obřím dole odpovídají.

  Občerstvení pro veřejnost NEDOLOŽENO — a je to týž vzor jako u Boudy Míla
  a Dimrovky, jen s obrácenými půlkami. OSM nese amenity=restaurant, jenže
  vlastní web mluví o stravování v souvislosti s ubytovanými hosty (snídaně
  „samozřejmě v ceně") a přístup kolemjdoucích neuvádí nikde. Formulováno
  opatrně: NETVRDÍME, že je restaurace veřejnosti zavřená — jen že to žádný
  přečtený pramen neříká. (Mapy.com vedou dva oddělené záznamy, „Bouda Pod
  Sněžkou (Ubytování)" a „Restaurace Bouda pod Sněžkou" — to je signál k
  dalšímu čtení, ne doklad; Mapy.com jako pramen faktů nepoužíváme.)

  ROZPOR V TELEFONU: OSM nese +420 491 617 077 (předvolba 491 = Náchodsko),
  vlastní web uvádí +420 734 151 546 a e-mail info@boudapodsnezkou.cz,
  krajinapodsnezkou.cz jen +420 734 151 546. Při povýšení vzít mobil z
  vlastního webu.

  NÁVRH REDAKCI: K RUČNÍ KONTROLE — a je to nejnadějnější případ z těch
  nerozhodnutých. Role na trase je doložená lépe než u kohokoli jiného dnes
  (samota na konci Obřího dolu na modré k Sněžce); chybí jediná věta o tom,
  že se u ní najedí i kolemjdoucí. Jeden telefonát to zavře.
