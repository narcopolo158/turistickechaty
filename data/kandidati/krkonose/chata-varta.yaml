interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 2026-10-05 (šestá fronta koše C3, pátá dávka podle identifikátoru) —
  NÁVRH VYŘADIT: občerstvení jen pro ubytované.

  TOTOŽNOST DOLOŽENA SOUŘADNICÍ: ceskehory.cz uvádí 50,653052 N / 15,818186
  E — od bodu kandidáta (50,6529873 / 15,8181818) asi 7 m.

  KLÍČ ZAŘAZENÍ, PRVNÍ PŮLKA NESPLNĚNA: pramen mluví o stravě pro ubytované,
  ne o veřejném občerstvení — „Snídaně a večeře jsou podávány v jídelně,
  která se nachází v přízemí…". Žádný pramen nezmiňuje restauraci otevřenou
  neubytovaným. Objekt je popsán jako penzion: „Penzion se nachází na okraji
  městečka mimo hlavní komunikaci." Je to týž důvod vyřazení jako u většiny
  koše C3, ne třetí stav — jídelna s polopenzí je doložená strava hostů.

  ROLE NA TRASE: 134 m k zelené [Z] U Thamových bud – Nad Pražačkou – H.
  Maršov, 1 značka do 250 m, rozcestník 822 m (měření 2026-09-06). Na
  vyřazení ale nepadá tady, nýbrž na první půlce klíče.

  ADRESA: Horní Maršov 180, okr. Trutnov. KAPACITA: 16 lůžek.

  ROZPOR VE WEBU: OSM nese `http://www.chatavarta.cz`, ceskehory.cz uvádí
  `www.sweb.cz/chatavarta` a `www.ceskehory.cz/chatavarta`. Platnost domény
  z OSM se tu netvrdí.

  TELEFON (pramen): +420 721 786 819, +420 775 418 355.

  HISTORIE / TURISTICKÁ MINULOST (DATA-25): pramen žádnou nezmiňuje,
  nedomýšlí se.

  Pramen: https://www.ceskehory.cz/ubytovani/chata-varta-horni-marsov.html
