interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 23. 9. 2026 (třetí fronta koše C3 — kandidáti označení lexikonem
  jména, přísná varianta) — NÁVRH VYŘADIT. Objekt je ubytování v
  apartmánech; jediné občerstvení, které pramen jmenuje, je v okolí, ne
  vlastní provoz.

  Identita měřením: GPS z ČeskéHory.cz (50,647522 N / 15,656072 E) padne
  4,5 m od OSM uzlu.

  Pramen (nalezen přes WebSearch, čten 23. 9. 2026): ČeskéHory.cz
  https://www.ceskehory.cz/ubytovani/chalupa-u-medveda-dolni-dvur.html —
  „3 nové plně vybavené apartmány", 18 lůžek, „na velice klidném, slunném
  místě nad vesnicí Dolní Dvůr", ~600 m n. m.; v okolí „2x restaurace,
  samoobsluha s bufetem" (tedy cizí podniky). Zápis je archivní („Objekt
  v archivu - prezentace není aktivní").

  Vlastní web chalupaumedveda.cz z OSM se ve vyhledávání neukázal; přímé
  načtení domény by chtělo Michalovo svolení — neobcházeno. POZOR na
  jmenovce: „Chalupa u Medvěda" téhož jména stojí i v Karlově pod
  Pradědem v Jeseníkách (chalupa-umedveda.cz) — s tímhle objektem nemá
  nic společného.
