interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-06-12) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=alpine_hut (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  Otvírací doba dle OSM (surový formát, neověřeno): Dec 25-Jan 31 Mo-Su
  10:00-16:00; Feb-Mar Mo-Su 10:00-16:30; Apr,Oct-Nov Sa-Su 10:00-16:00;
  May-Jun,Sep Tu-Su 10:00-17:00; Jul-Aug Mo-Su 10:00-17:30; Dec 01-24 Sa-Su
  10:00-16:00

  DATA-03 křížové ověření (checked 2026-07-20, verified false; ruční běh —
  WebFetch průchozí jen na část domén, zbytek padá na PROVENANCE/timeout;
  křížový checklist: přehled ubytování
  treking.cz/prehledy/krkonose-ubytovani.htm, načteno 20. 7. 2026 — výtah
  nemusí být úplný, končí „a další“): Web z OSM (zaly.cz) nedostupný (robots
  ConnectTimeout). V načteném výtahu treking.cz nefiguruje. Žalý je známý
  především rozhlednou — zda objekt u rozhledny patří do průvodce chat,
  rozhodne redakce po otevření webu. K RUČNÍ KONTROLE.

  DATA-23, průchod kandidátů rozšířeným klíčem (29. 7. 2026): důvod, kvůli
  kterému tenhle kandidát 20. 7. zůstal ležet („je to rozhledna, ne bouda"),
  rozšířeným klíčem PADL — Michal 26. 7. 2026 rozhodl, že rozhoduje
  občerstvení, ne typ stavby. A občerstvení je doložené přímo v OSM tagu:
  `amenity=restaurant` s celoroční otvírací dobou, telefonem a e-mailem
  restaurace (viz výše; export _overpass-export-cz.json, stav dat
  2026-06-12). Klíčem tedy prochází. Je to jediný z 93 krkonošských
  kandidátů, u kterého rozšíření klíče něco změnilo.

  Co se tím NEROZHODLO: jaký objekt to vlastně je. OSM popisuje BUDOVU —
  `building:levels=3`, `start_date=2013-01-09`, `ref:ruian:building=34001786`,
  `source=cuzk:ruian` — kdežto kamenná rozhledna na Žalém je stavba
  podstatně starší, tedy objekt jiný; společný je tag
  `contact:facebook=rozhledna.zaly`, což může (ale nemusí) znamenat jednoho
  provozovatele obou. Podle rozhodnutí Michala o Sněžce (26. 7. 2026:
  „udělal bych profil každého objektu zvlášť") by to byly dva profily. Nic
  se ale nedomýšlí: rok vzniku rozhledny, její výška ani vztah obou staveb
  nemají pramen, web zaly.cz je ze sandboxu nedostupný (ConnectTimeout,
  potvrzeno 20. 7. 2026) a `typ` proto zůstává `obsluhovana` z OSM tagu,
  nikoli `rozhledna`.

  OTÁZKA PRO MICHALA (deník 29. 7. 2026): povýšit Žalý jako restauraci
  u rozhledny, nebo počkat na doložení a vést rozhlednu zvlášť? Povyšování
  Krkonoš je od 21. 7. uzavřené na 76 profilech s tím, že hraniční objekty
  se nepřidávají bez výslovného pokynu — tenhle je první, kterému otevřel
  cestu nový klíč, takže rozhodnutí patří Michalovi.
