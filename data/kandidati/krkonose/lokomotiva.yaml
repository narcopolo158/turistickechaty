interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-06-12) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=alpine_hut (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  DATA-03 křížové ověření (checked 2026-07-20, verified false; metoda:
  WebSearch — signál z titulků a domén výsledků, obsah stránek NEotevřen,
  není-li u zdroje řečeno jinak): Slabý signál: mapy.com vede „Chata
  Lokomotiva“ jako „rekreační zařízení“, firmy.cz Pec pod Sněžkou, Archa
  Krkonoš eviduje „Pec čp. 17 Lokomotiva“; charakter (odborová/rekreační
  chata? veřejný provoz?) nedoložen. K RUČNÍ KONTROLE.

  KOŠ A — ODPRACOVÁNO 25. 8. 2026 (denní bezobslužná session, metoda:
  WebSearch + otevřená stránka; verified false): firemní zápis Firmy.cz
  (detail 13125039, otevřeno 25. 8. 2026) vede provozovnu v kategorii „Horské
  chaty a chalupy" s popisem doslova „Provoz horské chaty s nabídkou
  ubytování." — tedy JEN UBYTOVÁNÍ, o občerstvení ani otvírací době ani slovo;
  adresa Pec pod Sněžkou 17, web zápis neuvádí. Týž zápis navíc hlásí: „Tato
  firma nebo pobočka již není aktivní." Nepřítomnost zmínky o občerstvení NENÍ
  doklad, že chata občerstvení nemá — proto se nevyřazuje.

  DVA SIGNÁLY TURISTICKÉ MINULOSTI / ROLE NA TRASE, oba zatím nedočtené:
  Archa Krkonoš eviduje objekt „Pec čp. 17 Lokomotiva"
  (archakrkonos.cz/objekty/56-pec-cp-17-lokomotiva/ — ze sandboxu nedostupné,
  robots.txt zakazuje), a bergfex vede turistickou trasu s názvem „Pec pod
  Sněžkou - Lokomotiva - Konopindova chata - Jindřichův dům", kde je chata
  jmenovaným bodem cesty. Klíč zařazení se od 26. 7. 2026 ptá i na
  turistickou minulost, takže tohle je přesně ten případ.

  ZÁVĚR: ODLOŽENO — rozhodne až čtení Archy Krkonoš (dům čp. 17, jeho historie
  a původní účel). Ze sandboxu na ni nedosáhnu; je to položka pro Michala nebo
  pro běh z jiné sítě.
