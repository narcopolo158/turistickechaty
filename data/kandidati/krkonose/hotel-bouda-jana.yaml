  TRIÁŽ 30. 8. 2026 (koš B, páté čtení) — OBČERSTVENÍ SPÍŠ ANO, ROLE NA TRASE
  NEDOLOŽENÁ; spadá do otevřené otázky „klíč střediska".
  OBČERSTVENÍ: ceskehory.cz
  (https://www.ceskehory.cz/ubytovani/hotel-bouda-jana-velka-upa.html) popisuje
  „restaurace s celodenním provozem", kapacita 50 míst, letní zahrádka 40 míst.
  Celodenní provoz je silný signál, ale věta sama NEŘÍKÁ, že obslouží
  kolemjdoucího — týž rozdíl, kvůli kterému klíč nespadl u Boudy pod Sněžkou.
  Vedle toho existuje samostatný záznam v restauračním katalogu Restu.cz
  (https://www.restu.cz/restaurace-boudy-jana/, titulek „Restaurant Bouda Jana,
  Pec pod Sněžkou"); stránka se ze sandboxu NENAČETLA (robots.txt nedostupný),
  takže z ní je doložený jen ten titulek ze seznamu výsledků.
  ROLE NA TRASE: nedoložená. Týž pramen klade objekt „ve známém lyžařském
  středisku Pec pod Sněžkou-Velká Úpa", 920 m n. m., Sněžka 6 km; mluví
  o „ideálních podmínkách pro turistiku", ale žádnou konkrétní značenou trasu
  u objektu neuvádí.
  -> K RUČNÍ KONTROLE. Je to týž případ jako Janská bouda z 29. 8.: samostatný
  podnik u nástupu do hor uvnitř střediska. Čeká na Michalovo rozhodnutí
  o klíči střediska.
