interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 2. 10. 2026 (šestá fronta koše C3, třetí dávka podle identifikátoru).
  NÁVRH: VYŘADIT — občerstvení pro veřejnost nedoloženo. Role na trase JE
  doložená (62 m k zelené Szklarska Poręba – Wałbrzych, 2 značené trasy do
  250 m), ale druhá půlka klíče ne.

  Co prameny říkají: jde o „Ośrodek Wczasowo-Kolonijny HOTTUR" — rekreační
  a kolonijní středisko, ne obsluhovaná chata. Hlavní budova má podle
  borowice.com.pl „stołówka (160 miejsc)" a „kawiarnia", vedle hlavní budovy
  stojí domy Opolanin, Na Stoku, Karkonosze, budovy kolonií a 10 dřevěných
  chatek po 8 lůžkách; e-turysta.com uvádí „180 bed places, 40 rooms" a
  „In the main building there is a cafe, fireplace, dining room (160 seats)".
  ANI JEDEN pramen neříká, že by jídelna nebo kavárna obsluhovaly kolemjdoucí
  — e-turysta výslovně vede stravu jako položku objednávanou v rezervaci.
  Jídelna o 160 místech u kolonijního střediska je provozní zázemí turnusů,
  nikoli veřejný gastro provoz; dokud to nějaký pramen nevyvrátí, nedomýšlíme.

  Rozpor v adrese, obě hodnoty zapsány: borowice.com.pl „Borowice 22",
  e-turysta.com „Sosnowka, Borowice 18". OSM adresu nenese vůbec. Souřadnicově
  se rozdíl neměří, číslo popisné se nedomýšlí.
  Prameny: https://www.borowice.com.pl/osrodek-wczasowo-kolonijny-hottur ;
  https://e-turysta.com/osrodek-wczasowo-kolonijny-hottur-sosnowka-110366.html
  Vlastní web https://www.hottur.pl/ se ze sandboxu nenačetl (PROVENANCE_REQUIRED)
  ani po vyhledání domény — verdikt tedy stojí na katalozích, ne na vlastním webu.
