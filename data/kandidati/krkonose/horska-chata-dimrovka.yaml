interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  TRIÁŽ KOŠ B — křížové ověření (checked 2026-08-27, WebSearch + otevřené
  stránky, vše verified: false):

  Restaurace v objektu DOLOŽENA, přístup veřejnosti NIKDE. Vlastní web
  (dimrovka.cz): „v 1. podlaží se nachází restaurace", „Wifi připojení k
  internetu je v restauraci bez poplatku." Firmy.cz vede AKTIVNÍ záznam
  (hodnocení z 5. 2. 2026), ale v oboru „Penziony a Horské chaty a chalupy",
  popis „Penzion nabízí ubytování s kapacitou až 40 míst. K dispozici je 7
  pokojů s vlastním sociálním zařízením a 2 třílůžkové pokoje se společnou
  koupelnou." a k restauraci jen „V penzionu se nachází také restaurace a
  dětský koutek." Žádný pramen neuvádí otvírací dobu restaurace ani větu o
  hostech zvenčí — což NENÍ doklad, že přístupná není.

  Role na trase NEDOLOŽENA. Vlastní web mluví výhradně o zimním středisku: „se
  nachází v Peci pod Sněžkou v Krkonoších", „přímo u sjezdové tratě Klondike",
  „Na lyžích se dostanete přímo na 8 sjezdových tratí a zpět. V těsné
  blízkosti jsou k dispozici běžkařské stezky. Pro milovníky jízdy na kole
  jsou cca 50 m od Dimrovky cyklostezky pro náročné i méně náročné cyklisty."
  Nadmořská výška „1000 m n.m." (vlastní web).

  NEZAŘAZOVAT — nedoložené obě půlky klíče: veřejné občerstvení jen jako
  místnost v penzionu, role na trase jen sjezdovky a cyklostezky. Je to týž
  vzor jako Bouda Míla (26. 8.), jen s aktivním provozem. Formulace je
  záměrná: prameny mlčí, netvrdíme, že restaurace veřejnosti zavřená je. Kdyby
  se objevila otvírací doba pro veřejnost, případ se otevírá znovu.
