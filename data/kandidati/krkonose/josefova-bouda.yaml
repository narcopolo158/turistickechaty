interniPoznamky: >-
  RUČNÍ KANDIDÁT (27. 7. 2026) — Michal v odpovědích na otázky uzavření
  Krkonoš (č. 7) rozhodl kandidáta založit. Vzešlo z profilu Erlebachovy
  boudy (resort Svatý František má čtyři budovy dle Kudy z nudy, jmenovitě
  známe Erlebachovu a Josefovu; precedent Dvoračky × Štumpovka žádá
  samostatné zápisy).

  K dotažení před povýšením: GPS (OSM nebo web resortu), výška, kapacita,
  služby (restaurace resortu vs. vlastní), historie (po kom Josefova?),
  vztah k Erlebachově (společný provozovatel — resort).

  NÁLEZ 31. 8. 2026 (triáž koš E) — HLAVIČKA TOHOTO SOUBORU BYLA VĚCNĚ ŠPATNĚ.
  Stálo tu „v OSM exportu DATA-01 objekt není"; měřeno nad exporty, které v repu
  leží (bez jediného dotazu do sítě), tam JE: way/74863464, jméno doslova
  „Josefova bouda", tagy `amenity=restaurant`, `tourism=hotel`,
  `phone=+420 499 523329`, `website=http://www.josefovabouda.cz/indexGE.html`,
  těžiště 50.757053 / 15.6358175. Totožnost dokládají tři nezávislé znaky:
  jméno, vlastní doména josefovabouda.cz a vzdálenost **246 m od publikovaného
  profilu Erlebachovy boudy** (50.7589321 / 15.633979) — přesně ta poloha, kterou
  popisuje pramen v overeniLokace („součást resortu u Erlebachovy boudy").
  GPS proto doplněna z OSM, `verified: false`.

  Proč ji koš E nenašel: koš E dohledával OSM element podle **první OSM URL
  v hlavičce kandidáta**, jenže tenhle kandidát je RUČNÍ a žádnou OSM URL nikdy
  neměl — koš tedy nezměřil nepřítomnost objektu v OSM, ale nepřítomnost odkazu
  v našem souboru. Hledání podle JMÉNA to zavřelo na první pokus.

  Co tím padá a co ne: **GPS a doklad veřejného občerstvení jsou tím pokryté**
  (`amenity=restaurant` je OSM tvrzení, ne náš závěr). Dál chybí: výška, kapacita,
  zda má bouda vlastní restauraci, nebo jen sdílí resortní (OSM tag to
  nerozlišuje), historie a po kom je jméno. Vlastní web resortu
  (erlebachovabouda.cz/en, načteno 31. 8. 2026) o Josefově boudě říká jedinou
  větu — „Josef's Chalet is a cosy romantic Alpine-style chalet" — a výšku
  1 150 m uvádí **pro resort jako celek**, ne pro tuhle budovu; nepřebírat.
  Server Krkonose.eu se ze sandboxu dál nenačte (robots.txt ConnectTimeout,
  známo od 29. 8.).
