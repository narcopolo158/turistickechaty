  TRIÁŽ KOŠ B — křížové ověření (checked 2026-08-26, WebSearch + otevřené
  stránky, vše verified: false):

  Občerstvení pro veřejnost DOLOŽENO a výslovně mířené na kolemjdoucí. Vlastní
  web karczmahutnika.pl/o-nas/: „gdy podczas wędrówki po Karkonoszach zawitasz do
  Szklarskiej Poręby, zapraszamy!" a „pozwolą Państwu wypocząć i nabrać sił na
  dalsze górskie wędrówki". Ubytování podnik nenabízí, takže vazba na ubytované
  nepřipadá v úvahu. Turistický portál szklarska-poreba.atrakcje.pl uvádí
  otevřeno denně 12:00–21:00 (vlastní web odkazuje na Facebook).

  Role na trase DOLOŽENA, byť v katastru města. Vlastní web i regionální portál
  turystyczna.szklarskaporeba.pl shodně: „przy głównym szlaku na wodospad
  »Szklarki«, tuż przy Leśnej Hucie usytuowana jest Karczma Hutnika". Nezávislý
  popis zeleného šlaku (e-gory.com) potvrzuje, že značená cesta k Wodospadu
  Szklarki „doprowadza do ulicy Kołłątaja", tedy do ulice, kde karczma stojí.
  Barvu ani číslo trasy bezprostředně u objektu žádný pramen neuvádí. Adresa
  „ul. Kołłątaja 1, 58-580 Szklarska Poręba", dzielnica Szklarska Poręba Górna.

  Turistická minulost NEDOLOŽENA, spíš vyvrácena: vlastní web uvádí otevření
  „25 sierpnia 2012 roku" se záměrem „stworzyć lokal jakiego w Szklarskiej
  jeszcze nie było" — nový podnik, ne bývalé schronisko. Vazba na hutnictví skla
  je tematická (sousední Leśna Huta), ne turistická.

  NÁVRH REDAKCI: K RUČNÍ KONTROLE — občerstvení pro veřejnost i role na trase
  jsou doložené, chybí turistická minulost a objekt má městskou adresu. Jde o
  tentýž typ hraniční otázky jako u objektů ve střediscích: karczma z roku 2012 u
  značené cesty k vodopádu, ne bouda. Nepovyšovat bez Michalova pravidla.
