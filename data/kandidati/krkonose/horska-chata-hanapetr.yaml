interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENÍ 19. 9. 2026 (druhá fronta koše C3, 9. místo) — NÁVRH VYŘADIT, čeká na
  potvrzení Michalem. Občerstvení pro veřejnost nedokládá žádný pramen.
  Adresa Dolní Dvůr 282 (Hanapetrova Paseka), 543 42; IČO 25074946 (Firmy.cz).

  Prameny (nalezeno přes WebSearch, čteno 19. 9. 2026): (1) Firmy.cz
  https://www.firmy.cz/detail/2659811-horska-chata-hanapetr-dolni-dvur.html —
  kategorie „Horské ubytování, Horské chaty a chalupy" (ubytovací), popis
  „Nabídka celoročního ubytování o kapacitě 42 lůžek vhodného pro sportovní
  a firemní akce"; „stravování" je v seznamu vybavení, bez otvíračky a bez
  zmínky o veřejnosti. GPS zápisu 50.673866, 15.657407 = 4 m od našeho bodu
  → identita ověřena měřením. (2) Turistika.cz
  https://www.turistika.cz/chaty-chalupy/detail/chata-hanapetr-dolni-dvur-10223
  — „12 ložnic, celkem pro 10 až 53 osob", cena „celoročně 84.000kč / chata za
  týden" → pronájem celé chaty skupině. (3) ČeskéHory.cz
  https://www.ceskehory.cz/ubytovani/penzion-hanapetr-dolni-dvur.html —
  „stravování formou plné i poloviční penze", zápis je v archivu („Objekt
  v archivu - prezentace není aktivní").

  Vzor „strava k ubytování" (penze) a pronájem vcelku, jako Tobísek a Kovárna.
  Web z OSM (hanapetr.cernypetr.com) neodpovídá — prameny vedou na
  www.hanapetr.cz (ten se nepodařilo otevřít, robots.txt timeout).
