  Typ odvozen z OSM tagu tourism=alpine_hut (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  DATA-03 křížové ověření (checked 2026-07-20, verified false; metoda:
  WebSearch — signál z titulků a domén výsledků, obsah stránek NEotevřen,
  není-li u zdroje řečeno jinak): Penzionový signál: GPS kandidáta (50,740,
  15,556) = Horní Mísečky a výsledky vedou „Penzion U Kotle — Horní Mísečky“
  (vlastní web hornimisecky.eu, ceskehory.cz, e-chalupy.cz). OSM jméno „U
  Kotle“ bez slova penzion — týž objekt téměř jistě. VERDIKT NA REDAKCI
  (penzion).

  ROZHODNUTÍ REDAKCE (Michal, chat 20. 7. 2026): NEZAŘAZOVAT — „penziony bych
  nezařazoval, horské hotely ano“; tento objekt nese penzionový/pronájmový
  charakter. Kandidát zůstává v repu jako doklad, nepovyšovat.

  AKTUALIZACE ROZHODNUTÍ (Michal, chat 20. 7. 2026 — nový klíč pro sporné
  objekty: „pokud mají občerstvení nebo restauraci pro veřejnost, pak je
  můžeme zařadit“): web hornimisecky.eu (načteno 20. 7. 2026): bar „otevřen i
  pro veřejnost, pouze v době podávání večeří pro ubytované hosty se věnujeme
  přednostně jim“; jídlo (polopenze) jen pro ubytované; rodinný penzion, 1050
