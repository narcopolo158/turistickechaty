  povyšování a Michal potvrdí nad hotovým profilem (rozsah služeb poctivě: bar
  pro veřejnost, kuchyně jen pro ubytované).

  TRIÁŽ TIER 4 (26. 7. 2026, DATA-27): FRONTA POVÝŠENÍ (silná) — bar „otevřen i pro veřejnost" potvrzen doslovně. Plné citace s URL:
