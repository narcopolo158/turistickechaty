interniPoznamky: >-
  RUČNÍ KANDIDÁT — poslední nezpracovaný tip z ChatGPT katalogu. Založen
  25. 7. 2026 poté, co položka „prověřit Schronisko Nad Łomniczką" visela
  v backlogu od 21. 7. 2026.

  ✅ KLÍČ ZAŘAZENÍ vychází kladně, a to silněji než u české čtveřice, která
  v téže dávce neprošla: podle oficiální stránky PTTK objekt NEMÁ nocleh
  a nabízí stravování — je to tedy občerstvovací zastávka na trase, ne penzion
  s jídlem pro vlastní hosty. Přesně stejný profil jako Vrbatova bouda, kterou
  jsme dnes publikovali. Chybí ale doslovná věta „obsloužíme i neubytované";
  proto zatím kandidát, ne profil.

  ⚠ BLOKUJÍCÍ ROZPOR — PROVOZ. Oficiální PTTK objekt vede jako fungující,
  trasygorskie.pl i goryiludzie.pl ho k témuž datu popisují jako uzavřený kvůli
  rekonstrukci. Nevíme, který údaj je aktuálnější — stránka PTTK datum
  aktualizace neuvádí. Dokud to nevíme, objekt NEPOVYŠOVAT: publikovat profil
  chaty, která je možná zavřená, je přesně ta chyba, které se konvencí B
  vyhýbáme. Pole `stav` proto ZÁMĚRNĚ nevyplněno — ani `v-provozu`, ani
  `mimo-provoz`.

  ⚠ NEDOSTUPNÉ PRAMENY (neobcházet jinými nástroji): vlastní stránka
  pttk.jgora.pl i oficiální přehled schronisek Karkonoskiego Parku Narodowego
  (kpn.gov.pl/schroniska, přesměrování z kpnmab.pl) se z našeho prostředí
  načíst nepodařilo. Obě by rozpor o provozu nejspíš rozhodly — otevřít ručně,
  nebo počkat, až budou dostupné.

  ROZPOR VE VÝŠCE: 1002 m (PTTK, goryiludzie.pl, ChatGPT katalog) vs. 1003 m
  (trasygorskie.pl). Do pole vzata hodnota 1002 m jako nejčastější a zároveň
  oficiální; při povýšení rozpor přiznat i ve veřejném textu.

  K DOTAŽENÍ PŘED POVÝŠENÍM: (1) rozhodnout provoz — ideálně dotazem na PTTK
  Jelenia Góra, které objekt spravuje (stejný správce jako Kochanówka, kterou
  jsme dnes publikovali — dá se spojit do jednoho dotazu, DATA-04);
  (2) doslovný doklad, že občerstvení je pro veřejnost; (3) GPS potvrdit z OSM
  nebo mapy, ne přebírat z goryiludzie.pl; (4) prověřit, jestli objekt nese
  turistickou známku (v naší sadě od Michala není).

  POZNÁMKA K ZDROJI TIPU: ChatGPT katalog uváděl „1002 m, schronisko górskie,
  PL" — výška i typ se oficiálnímu PTTK potvrdily. Katalog ale mlčí o tom, že
  objekt nemá nocleh a že je sporné, jestli vůbec funguje; to jsou obě věci,
  které rozhodují o zařazení. Další doklad, že katalog je vodicí seznam, ne
  pramen.
