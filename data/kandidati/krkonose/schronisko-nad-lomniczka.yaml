overeniObcerstveni:
  source: >-
    Oficiální stránka PTTK uvádí, že objekt „nie posiada miejsc noclegowych"
    a „oferuje wyżywienie", a popisuje ho jako „niewielki, drewniany budynek"
    na hlavní sudetské magistrále, který slouží jako „dogodny punkt odpoczynku
    dla turystów" scházejících ze Sněžky. Kombinace „bez noclehu + stravování
    + odpočinkový bod pro turisty na trase" mluví pro veřejné občerstvení, ale
    věta, že obslouží i kolemjdoucího bez rezervace, tam DOSLOVA není. Oficiální
    zdroj provozovatele, verified:false
  verified: false
  checked: '2026-07-25'
overeniProvoz:
  source: >-
    ⚠ PRAMENY SI PŘÍMO ODPORUJÍ. Oficiální stránka PTTK vede objekt jako
    fungující a píše, že „oferuje wyżywienie". Proti tomu trasygorskie.pl nese
    varování „Uwaga: Schronisko PTTK nad Łomniczką jest w remoncie"
    a goryiludzie.pl objekt označuje jako „nieczynny (remontowany)" a dodává,
    že „nie prowadzi jednak noclegów", takže podle nich právně nesplňuje
    definici horského schroniska. Otvírací dobu ani sezónu neuvádí žádný
    z pramenů. Do vyřešení tohoto rozporu se objekt NEPOVYŠUJE. verified:false
  verified: false
  checked: '2026-07-25'
overeniHistorie:
  source: >-
    trasygorskie.pl: postaveno roku 1901, „niemal natychmiast po jego budowie
    (1901 r.) zniszczyła go lawina gruzowa"; po válce provoz na hlavní trase na
    Sněžku, návštěvnost klesla po stavbě lanovky na Kopu pod Sněžkou; objekt
    léta fungoval bez elektřiny a tekoucí vody; v 90. letech spory nájemce
    s PTTK a hygienické závady, od té doby průběžná rekonstrukce. Německé jméno
    „Melzergrundbaude" dle goryiludzie.pl. Sekundární zdroje, verified:false
  verified: false
