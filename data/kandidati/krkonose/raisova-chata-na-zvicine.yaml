  ROZHODNUTÍ 25. 7. 2026 — OBJEKT NELEŽÍ V KRKONOŠÍCH, pole oblast je CHYBNĚ.
  Zvičina (671 m) patří geomorfologicky do Podkrkonoší: celek Krkonošské
  podhůří, podcelek Zvičinsko-kocléřovský hřbet. Sám KČT ji popisuje jako
  „nejvýraznější hora ve východní části Podkrkonoší". Hodnota oblast: krkonose
  je tedy věcně špatně a nesmí se s ní objekt povýšit — v pilotu Krkonoš by
  seděl na mapě mimo pohoří a rovnou by shodil tvrzení o ověřených datech.

  Pole oblast jsem ZÁMĚRNĚ NEPŘEPSAL: oblast je v Payloadu relationship na
  kolekci oblasti, a oblast „Podkrkonoší" v ní zatím neexistuje. Vymyslet si
  slug by znamenalo rozbít vazbu. Rozhodnutí patří Michalovi: buď (a) založit
  oblast Podkrkonoší a přesunout kandidáta do ní, nebo (b) odložit objekt na
  dobu, kdy se pilot rozšíří za Krkonoše.

  Klíč zařazení naopak SPLNĚN — občerstvení je veřejné, doloženo. Ubytování
  objekt aktuálně nenabízí. Vlastnicky: chatu drží KČT společně s obcí
  Třebihošť (od roku 2024 podíl 49 %). POZOR na časovanou informaci: nájemní
  smlouva stávajícího nájemce běží jen do 31. 7. 2026, tedy pár dní od téhle
  rešerše — provozní údaje (otvírací doba, kontakty, jméno provozovatele) budou
  po tomhle datu nejspíš neplatné. Před případným povýšením znovu ověřit; nic
  z provozu zatím nepřenášet do profilu.
