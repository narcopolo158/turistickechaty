interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 13. 10. 2026 (šestá fronta koše C3, desátá dávka — dočtení fronty) —
  NÁVRH VYŘADIT, padá na půlce občerstvení; role na trase je naopak SPLNĚNA.

  Občerstvení pro veřejnost: NENÍ. Pramen vede objekt v rubrice „Ubytovny"
  a o jídle má jedinou větu — v přízemí je „kuchyňka se základním
  vybavením". Restauraci, jídelnu, hospodu, snídaně ani polopenzi pramen
  neuvádí vůbec; ani neříká, že se vaří. Jméno „Turistická chata" tedy
  kategorii zakrývá podruhé v téhle frontě (po `krausovy-boudy`
  z 12. 10.): je to ubytovna s 32 lůžky a vlastním vařením hostů.
  Source: https://www.hkregion.cz/dr-cs/103061-chata-lajdacek.html
  (čteno 13. 10. 2026, verified: false).

  Role na trase: SPLNĚNA — 165 m k ose žluté č. 140007 [Ž] Labská přehrada
  hráz. – Pod Černou skálou, 1 značená trasa do 250 m, rozcestník 383 m
  (měření 6. 9. 2026). Na verdiktu to nic nemění, protože klíč chce obě
  půlky.

  Totožnost: DOLOŽENA souřadnicí, a je to druhý nejpřesnější doklad v celém
  koši — pramen uvádí 50°43'5,760"N / 15°34'23,15"E, tedy 50,7182667 /
  15,5730972, proti OSM 50,7182462 / 15,5730697: **3,0 m**. Přesnější je jen
  `chata-advokatka` (2,1 m, 12. 10.). Adresa Labská 4, 543 51 Špindlerův
  Mlýn sedí s OSM.

  Údaje z pramenů (verified: false): Labská 4, 543 51 Špindlerův Mlýn;
  32 lůžek v 5 pokojích (2× třílůžkový, 1× čtyřlůžkový, 2× vícelůžkový);
  nadmořská výška — pramen si v tom sám odporuje, v kontaktním bloku uvádí
  865 m, v popisu 870 m (proto se nikam nezapisuje); asi 2 km od centra
  Špindlerova Mlýna, s výhledem na Labskou přehradu; telefon
  +420 732 152 453, e-mail vladka.razova@seznam.cz. Provozovatele pramen
  nejmenuje.
