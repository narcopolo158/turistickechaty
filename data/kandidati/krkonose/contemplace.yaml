interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 30. 9. 2026 (koš C3, šestá fronta — pořadí podle identifikátoru) —
  NÁVRH: VYŘADIT. Nevyřazuji sám, rozhodne redakce. Padá na PRVNÍ půlce klíče
  zařazení, a to výslovným tvrzením pramene, ne mezerou v pramenech.

  VEŘEJNÉ OBČERSTVENÍ — pramen říká OPAK. Vlastní web
  (https://www.contemplace.pl) se ze sandboxu nenačetl (PROVENANCE_REQUIRED
  ani po vyhledání domény), přečten proto inzerát na Slowhop
  (https://slowhop.com/en/places/2590-contemplace-karkonosze.html, čteno
  30. 9. 2026): jde o samostatně stojící dům k pronájmu bez stravování,
  doslova „You are on your own in the kitchen. We decided that we will not
  impose flavors on you, so the kitchen is at your complete disposal." Hosty
  posílá za jídlem do restaurací v Karpaczi a Jelenie Góře. Kapacita 2 osoby,
  po rozložení pohovky 4. Výška dle inzerátu 700–800 m (pásmo, ne číslo).
  Adresa shodná s OSM: Św. Jana z Dukli 18, Borowice.

  ROLE NA TRASE (`scripts/triaz-role-na-trase.ts`, 30. 9. 2026): nejbližší
  značka 309 m (zelená Szklarska Poręba – Wałbrzych), **0 značených tras do
  250 m**, nejbližší rozcestník 3 581 m. Ani druhá půlka klíče tedy doložená
  není — ale rozhoduje už první.
