interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=guest_house (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 12. 10. 2026 (šestá fronta koše C3, devátá dávka) — NÁVRH VYŘADIT,
  padá na půlce občerstvení; role na trase je naopak SPLNĚNA.

  Občerstvení pro veřejnost: NENÍ. Pramen vede objekt jako chatu k pronájmu
  se samostatným vařením: „Vybavení kuchyně: nádobí, mikrovlnná trouba,
  pečící trouba, sklokeramická varná deska", v souhrnu „plně vybavená kuchyň
  s myčkou nádobí". Restauraci, jídelnu ani hospodu pramen neuvádí, ani
  polopenzi; kapacita 12 lůžek ve 4 pokojích (2× dvoulůžkový, 2×
  čtyřlůžkový), společenská místnost pro 15 osob, 730 m n. m., provozovatel
  dle pramene Mgr. Martin Poledna.
  Source: https://www.ceskehory.cz/ubytovani/advokatka-janske-lazne.html
  (čteno 12. 10. 2026, verified: false).

  Role na trase: SPLNĚNA — 59 m k ose zelené č. 4228 Svoboda nad Úpou –
  Hoffmannova bouda, 3 značené trasy do 250 m, rozcestník 200 m (měření
  6. 9. 2026). Na verdiktu to nic nemění, protože klíč chce obě půlky.

  Totožnost: doložena souřadnicí, a je to nejpřesnější doklad celého koše —
  pramen 50,630789 / 15,768021 je od OSM bodu 50,6307786 / 15,7680455
  **2,1 m**; adresa Luční 188, Janské Lázně sedí s OSM.

  Pozn.: pramen píše „Útulná chata 100 m od kabinové lanovky na Černou horu
  ale v klidném místě." Blízkost lanovky roli na trase nezakládá ani neruší —
  měření 6. 9. ji uzavřelo značkami.
