interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=chalet (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  ČTENO 4. 10. 2026 (šestá fronta koše C3, čtvrtá dávka podle identifikátoru).
  DRŽENÝ BEZ VERDIKTU — a je to NEJSILNĚJŠÍ kandidát dávky. Veřejné občerstvení
  v objektu doloženě NENÍ (samoobsluha + restaurace v SOUSEDNÍ budově), jenže
  role na trase a poloha jsou takové, že na vyřazení podle půlky klíče nestačí:
  objekt stojí NA VRCHOLU ČERNÉ HORY, asi 1 300 m n. m., 200 m od horní stanice
  kabinové lanovky, a v zimě je dostupný JEN lanovkou. Strojové signály:
  182 m k žluté č. 7211 Černý Důl – Nad Portášovými boudami, 1 značená trasa
  do 250 m, rozcestník 256 m — druhý nejblíž ležící rozcestník z dávky.

  PATŘÍ K DATA-25 (klíč rozšířený o turistickou minulost): jméno nese „Bouda",
  objekt stojí na hřebenovém vrcholu a je to typ domu, u kterého se minulost
  ptát MUSÍ. Minulost jsem ale NEDOLOŽIL — vyhledávač k historii, roku vzniku
  ani k původnímu provozovateli nevrátil nic (hledáno „Kábrtova bouda historie
  Černá hora bouda Krkonoše"; vrácené odkazy byly o Sokolské boudě a o Černé
  boudě, ne o tomto objektu). Nedomýšlím to; bez pramene je to jen domněnka.

  CO PRAMENY O GASTRU ŘÍKAJÍ, doslova: kudyznudy.cz „V těsném sousedství chaty
  restaurace s celoročním provozem." — tedy VEDLE chaty, ne v ní. Oficiální
  stránka obce (janskelazne.cz, anglická verze) totéž z druhé strany: „common
  furnished kitchen for every one, possibility to order a lunch in the
  contiguous restaurant" — společná kuchyně pro samoobslužné vaření a obědy si
  lze objednat v přilehlé restauraci. Objekt tedy veřejné občerstvení nemá a
  provoz v sousední budově je JINÝ objekt; nesměšovat.

  OSTATNÍ ÚDAJE: kapacita 20 lůžek v sedmi pokojích (kudyznudy), „a classical
  chalet with capacity 20 beds" (janskelazne.cz), pokoje dvou- až čtyřlůžkové
  se sprchou a WC. Cena 660 Kč/osoba/noc bez stravy (sezóna IX/2025–III/2026).
  „Dostupnost chaty v zimě jen kabinovou lanovkou, v létě parkování u chaty."

  ROZPOR V ADRESE, obě hodnoty zapsány (patří k DATA-20): kudyznudy.cz uvádí
  „Horská 192, 542 25 Janské Lázně", fronta ke čtení vede u kandidáta
  „Horská 190, Janské Lázně" z OSM. Ani jeden pramen nerozhoduje; nižší číslo
  se tu jako konvence NEPOUŽÍVÁ, protože nejde o rozpor měřené hodnoty, ale
  o rozpor identifikátoru budovy (viz KONTROLA-11).

  ROZPOR V KONTAKTU, oba zapsány: kudyznudy.cz tel. +420 603 507 054 a
  e-mail rydlo.m@tiscali.cz, janskelazne.cz tel. +420 733 645 729 a e-mail
  kabrtova-bouda@janskelazne.cz. Druhý je obecní rezervační kanál, první
  nejspíš provozovatel — NEROZHODNUTO, nedomýšlí se.
