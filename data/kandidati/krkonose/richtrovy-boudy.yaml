overeniHistorie:
  source: >-
    ÚZSVM (uzsvm.gov.cz, PRIMÁRNÍ pramen, 27. 11. 2020) doslova: „Richtrova
    bouda byla postavena před rokem 1911 a v letech 2000 až 2008 probíhaly
    její stavební úpravy." a „Červená bouda byla postavena v roce 1934 na
    místě původního domu a stavebně byla upravena v letech 1999 až 2000."
    Kudy z nudy doslova: „První zmínka o Richtrových boudách pochází
    z 80. let 18. století", „V roce 1938 objekt vyhořel", „V roce 1946
    získala boudu Obchodní akademie Dr. Beneše z Prahy a v roce 1950 se
    stala majetkem tehdejšího ministerstva školství, věd a umění". POZOR:
    „před rokem 1911" (ÚZSVM) a „první zmínka z 80. let 18. století" (Kudy
    z nudy) nejsou v rozporu — první mluví o dnešní budově, druhé o boudách
    na tom místě; do rokVzniku při povýšení NEbrat ani jedno bez rozmyslu
    (poučení Kolínská: zmínka o místě ≠ stavba budovy).
  verified: false
  checked: '2026-07-26'
interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-06-12) — na web povýšit do
  data/chaty/ až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=alpine_hut (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  DATA-03 křížové ověření (checked 2026-07-20, verified false; ruční běh —
  WebFetch průchozí jen na část domén, zbytek padá na PROVENANCE/timeout;
  křížový checklist: přehled ubytování
  treking.cz/prehledy/krkonose-ubytovani.htm, načteno 20. 7. 2026 — výtah
  nemusí být úplný, končí „a další"): Web z OSM (richtrovyboudy.cz) má
  rozbité HTTPS (self-signed certifikát — obdoba nálezu u Výrovky ze
  session 22), obsah se nenačetl. Přehled treking.cz uvádí „Richtrovy
  boudy" mezi hřebenovými boudami — křížový signál existence trvá.

  REŠERŠE 26. 7. 2026 (pokus o povýšení Tier 1 z master fronty DATA-03) —
  VÝSLEDEK: NEPOVYŠOVAT, viz hlavička souboru. Klíčová zjištění:
  (a) vlastnická linka doložená primárním pramenem ÚZSVM: Obchodní
  akademie Dr. Beneše (1946) → ministerstvo školství (1950) → NIDV/NPI ČR
  → 27. 11. 2020 Policejní prezidium ČR (školicí středisko bezpečnostních
  sborů); (b) firemní zápis na Firmy.cz je označen jako NEAKTIVNÍ;
  (c) všechny stránky popisující veřejnou restauraci jsou nedatované
  a nejspíš předpřevodové; (d) areál = dvě budovy (Richtrova + Červená
  bouda, depandance 300 m); (e) čtyři různé kapacity (50/18 × 77+29 ×
  „přes 100" × 106/34); (f) rozpor výšky 1136 (OSM) × 1206 m (tři weby).

  PROTIZNAK: známka č. 1602 „Richtrovy boudy" je v oficiálním seznamu
  vydavatele z ČERVENCE 2026 (turisticke-znamky-cr-vyber.csv, DATA-22) —
  známková místa se známkou v prodeji bývají veřejně přístupná; kde se
  známka prodává, nevíme (detail vydavatele se ze sandboxu nenačte).

  OTÁZKA PRO DATA-04 / MICHALA: zavolat (číslo z OSM +420 499 896249,
  může být mrtvé) nebo otevřít web v prohlížeči: slouží restaurace
  a ubytování veřejnosti i po převodu na Policejní prezidium? Odpověď ANO
  → povýšit (materiál v tomhle souboru už na profil stačí); odpověď NE →
  vyřadit s důvodem, případně vést jako mimo-provoz, pokud Michal rozhodne,
  že známková bouda patří do průvodce i bez veřejného občerstvení.
