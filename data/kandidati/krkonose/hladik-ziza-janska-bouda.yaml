interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  TRIÁŽ 29. 8. 2026 (koš B, čtvrté čtení) — OBČERSTVENÍ DOLOŽENO VÝBORNĚ,
  role na trase nedoložena.
  Firmy.cz vede AKTIVNÍ samostatný záznam
  (https://en.firmy.cz/company/13477483-janska-bouda-hladik-ziza-janske-lazne.html),
  a to rovnou ve dvou kategoriích — rychlé občerstvení i restaurace.
  Adresa „Janská 198, 542 25 Janské Lázně", otevřeno Čt–So 10:00–21:00,
  Ne 11:00–21:00, Po–St zavřeno, s poznámkou provozovatele „Otevíracka
  pevná a mimo - klouzavá dle počasí". Popis mluví o „občerstvení bez davu
  turistů" s výhledy do Podkrkonoší, v sortimentu víno, prosecco,
  koktejly, pivo, svařák, grog, sendviče, toasty a bezlepkové varianty.
  NEZÁVISLÉ POTVRZENÍ TOTOŽNOSTI: e-mail v záznamu (richv@seznam.cz) se
  shoduje s e-mailem, který u tohohle bodu nese OSM tag. Je to tedy týž
  objekt, ne shoda jmen.
  TELEFON: Firmy.cz +420 607 000 003; OSM u tohohle kandidáta telefon
  nenese, takže rozpor jako u sokoli-boudy nebo boudy-pod-snezkou tu
  nevzniká.
  ROLE NA TRASE NEDOLOŽENA: adresa je v Janských Lázních, tedy ve
  středisku. Vrcholovka.cz ji vede jako chatu v 760 m n. m., ale stránku
  se nepodařilo otevřít (robots.txt fetch timeout) — výška je zatím jen
  z titulku výsledku vyhledávání, NENÍ doložená a do profilu nepatří.
  Otevírací doba Čt–Ne je přitom sama o sobě signál cíle na výlet, ne
  restaurace u silnice; doklad to ale nenahrazuje.
  → K RUČNÍ KONTROLE. Pokud padne rozhodnutí o klíči střediska pro Janské
  Lázně, řeší i tenhle bod.
