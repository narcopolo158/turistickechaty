interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-22) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  TRIÁŽ 30. 8. 2026 (koš B, páté čtení) — BEZE STOPY NA WEBU.
  Hledáno: „Szklana chata" ve spojení se Szklarskou Porębou a s restaurací,
  i společně s `wiejska-chata`. Ani jeden použitelný výsledek — vyhledávače
  vracejí obecné turistické rozcestníky Szklarské Poręby a nesouvisející
  michelinské hotely. NEVYŘAZUJI: absence dokladu není doklad absence.
  PAST VE JMÉNĚ: „szklana" (skleněná) je ve Szklarské Porębě, městě sklářů,
  slovo, které se váže k desítkám hutí, muzeí a obchodů; jméno samo je proto
  pro dohledávání skoro bezcenné.
  VZTAH K `prezesowa-chata`: body leží od sebe zhruba 30–40 m
  (50,8266/15,5229 vs. 50,8261/15,5225). Může jít o týž objekt zapsaný dvakrát.
  Než se do dohledávání investuje víc, má smysl rozhodnout tenhle pár —
  kdyby šlo o jeden objekt, práce odpadne.
  -> ZŮSTÁVÁ OTEVŘENÝ, k dalšímu čtení (nejlevnější příští krok: rozhodnout
  pár s `prezesowa-chata`).
