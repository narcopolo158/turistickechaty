interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-08-08) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=alpine_hut (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  PŘESUNUT Z data/kandidati/beskydy/ dne 8. 8. 2026. Objekt leží v Javorníkách,
  a ty jsou od téhož dne samostatnou oblastí (rozhodnutí Michala: „javorniky
  a vsetinske vrchy bych udelal jako jednu samostatnou oblast"). Export DATA-01
  pro Beskydy ho stáhl ještě před zúžením beskydského okna, proto se sem
  přesouvá ručně, ne novým během. Do `_vyrazeno.yaml` se ZÁMĚRNĚ nezapisuje:
  ten seznam se od 8. 8. 2026 porovnává podle posledního úseku cesty, takže
  záznam „beskydy/<slug>" by objekt umlčel i v téhle oblasti. Nové beskydské
  okno ho už nezachytí, takže se tam sám nevrátí.
