  přesouvá ručně, ne novým během. Do `_vyrazeno.yaml` se ZÁMĚRNĚ nezapisuje:
  ten seznam se od 8. 8. 2026 porovnává podle posledního úseku cesty, takže
  záznam „beskydy/<slug>" by objekt umlčel i v téhle oblasti. Nové beskydské
  okno ho už nezachytí, takže se tam sám nevrátí.
