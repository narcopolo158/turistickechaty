interniPoznamky: >-
  KANDIDÁT z OSM (DATA-01, stav dat 2026-07-28) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=alpine_hut (alpine_hut = obsluhovaná,
  wilderness_hut = útulna).

  KŘÍŽOVÉ OVĚŘENÍ 2. 8. 2026 (DATA-03, interaktivní session): Českéhory.cz (listing „Horská chata Barbora — Lučany nad Nisou") — 42 lůžek v 2–6lůžkových pokojích, 742 m n. m. (shoda s kandidátem na metr), jižní svah Krásné(ho) u rozhledny Bramberk, GPS 50.753237/15.201392 sedí s OSM; bar a kuchyně zmíněny, ale listing je „Objekt v archivu — prezentace není aktivní". Vlastní web barbora.org (z OSM). POZOR jmenovci: Chata Barborka (Horní Maxov) i Chata Barbora (Český Jiřetín, Krušné hory) jsou JINÉ objekty. VERDIKT: existence a poloha křížově doložené, ale pramen je archivní a obsluha kolemjdoucích nedoložená — před povýšením zkusit načíst barbora.org (dnes mimo provenienci fetche).

  KŘÍŽOVÉ OVĚŘENÍ DOKONČENO 3. 8. 2026 (denní bezobslužná session) — vlastní web se konečně načetl. barbora.org: „Horská chata Barbora (742 m.n.m.) stojí na jižním svahu vrchu Krásný v turisty vyhledávané oblasti CHKO Jizerské hory, nedaleko rozhledny Bramberk, 1 km nad městečkem Lučany nad Nisou." Výška 742 m tím sedí na metr se třemi prameny (OSM, ceskehory.cz, vlastní web). Kapacitu, otvírací dobu ani historii vlastní web NEUVÁDÍ. Doplňkové listingy (jablonec.com, liberecky-kraj.cz — týž text): adresa Lučany nad Nisou 269, 40 lůžek (v zimě 46, v létě 50 osob — rozpor pramenů, dle konvence by se zapisovalo nižší číslo), telefon +420 725 964 649 / +420 723 524 043, e-mail chatabarbora@gmail.com, „Ubytování na horské chatě poskytujeme celoročně".

  KLÍČ ZAŘAZENÍ — OTÁZKA PRO MICHALA, proto NEPOVYŠOVÁNO. Stravování je ve všech pramenech vázané na ubytované (polopenze, plná penze, nebo vlastní vaření v kuchyňce); veřejné občerstvení pro kolemjdoucí NENÍ doloženo nikde, „bar a kuchyně" z archivního listingu ceskehory.cz nic o veřejnosti neříká. Turistická minulost (klíč DATA-25) také nedoložena — žádný pramen historii objektu nezmiňuje. V externím katalogu turistických chat ČR/SK 2026 objekt není. Proti vyřazení ale stojí trojí: OSM tag tourism=alpine_hut, jméno „Horská chata" ve všech pramenech, a poloha — samota na svahu Krásného u rozhledny Bramberk, ne penzion ve středisku (výjimka z pravidla o penzionech z 27. 7. 2026 by tedy mohla platit). Rozhodnutí je Michalovo; jde o vzor pro celou zbylou frontu 40+ jizerských kandidátů téhož druhu (ubytovací horské chaty bez doložené veřejné hospody).
