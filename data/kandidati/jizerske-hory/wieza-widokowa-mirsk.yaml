  vodárna v provozu do konce 70. let 20. století, adresa ul. Wodna 4,
  jihozápadní část MĚSTA; Góry Izerskie (goryizerskie.pl): věž stojí „niemal
  na terenie zespołu szkolnego". Gastro: JEN OSM (bistro 57 m,
  node/9181248789) — žádný textový pramen. VERDIKT: ověřeno, ale NEPOVYŠUJI
  ANI NEVYŘAZUJI → _odlozeno. Důvod: všech 10 dosud přijatých rozhleden stojí
  na vrcholech/hřebenech na trase; tahle je adaptovaná vodárenská věž UVNITŘ
  města v podhůří — „role na trase" je otázka výkladu rozsahu, rozhodnutí
  Michalovo.
