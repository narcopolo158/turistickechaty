interniPoznamky: 'KANDIDÁT z OSM (DATA-01, stav dat 2026-07-30) — na web povýšit do data/chaty/
  až po křížovém ověření (DATA-03).

  Typ odvozen z OSM tagu tourism=undefined (alpine_hut = obsluhovaná, wilderness_hut = útulna).

  Otvírací doba dle OSM (surový formát, neověřeno): Mo-Su 10:00-20:00; Fr,Sa 10:00-22:00


  ROZHODNUTO 30. 7. 2026 (Michal: „bramberk nechám na tobě"): 28 m odtud stojí rozhledna Bramberk
  (https://www.openstreetmap.org/way/173701702), kterou první rozhlednový běh založil jako samostatného
  kandidáta. Podle pravidla z 28. 7. 2026 („rozhledny bereme jen s občerstvením; když je tím občerstvením
  chata, která už kandidátem je, rozhledna se zvlášť nezakládá") zůstává jeden objekt — TATO chata
  — a rozhledna je jeho součástí, ne druhý profil. Vedeno stejně jako Žalý, kde publikovaný profil
  popisuje rozhlednu i restauraci u její paty. Kdyby se někdy uplatnilo rozhodnutí o Sněžce („profil
  každého objektu zvlášť"), rozdělení je připravené: OSM entita věže je zapsaná výš.'
