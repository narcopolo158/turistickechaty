  - osm: https://www.openstreetmap.org/way/266125932
    slug: sumava/zakladna-bileho-orla
    duvod: >-
      Skautská základna, která se pro veřejnost neotevírá. Doloženo
      vlastním webem majitele (bilyorel.skauting.cz, načteno 8. 8. 2026):
      „Základna otevírá pro výpravy a akce s minimálním počtem 20 plně
      platících účastníků (20 osob starších 6 let)." Vlastníkem je od
      1. 1. 2018 Junák – český skaut, Plzeňský kraj, z. s. Objekt stojí
      v osadě Šukačka v CHKO Šumava, 1,5 km od silnice mezi Čachrovem
      a Javornou, okolo 900 m n. m.; 31 lůžek v jedenácti pokojích, plně
      vybavená kuchyň, jídelna. Je to tedy dům pro uzavřené skupiny
      s vlastním hospodařením — klíč zařazení („občerstvení pro
      veřejnost") nenaplňuje a žádný pramen neuvádí ani volný přístup,
      ani občerstvení pro kolemjdoucí. OSM ho vede jako obsluhovanou
      chatu; tag je zavádějící.
      Kdyby se objevil doklad turistické minulosti stavby (klíč DATA-25),
      posoudí se znovu — dnes žádný pramen o jeho starší roli na trase
      nemluví.
    rozhodl: >-
      Claude (8. 8. 2026, samostatný blok — klíč CLAUDE.md; podezření
      z deníku 7. 8. 2026 potvrzeno vlastním webem majitele)
    checked: 2026-08-08
