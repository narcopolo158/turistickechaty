      spolkové výlety, oslavy narozenin a rozlučky se svobodou.
      Provozovatelem je Bärwurz Resl Berghütten OHG, Hinterviechtach 3,
      Kollnburg (obchodní rejstřík, HRA 3405, Amtsgericht Deggendorf) —
      táž firma vede tři chaty v okolí. OSM ho vede jako obsluhovanou
      chatu; tag je tu zavádějící stejně jako u Waldvereinshütte.
      Co stojí proti: řád chaty zmiňuje vedle vlastního vaření i placenou
      stravu od hospodářů. Nic z toho ale není otvírací doba pro
      kolemjdoucího a žádný pramen nedokládá vstup bez rezervace.
      Pozor na záměnu: publikovaný profil Berggasthof Hochpröller je JINÝ
      objekt jiného provozovatele 1130 m odsud (Klaus Altmann,
      Hinterviechtach 11).
