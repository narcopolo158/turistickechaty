    „Ještědský hřeben objímá Liberec z jihozápadu a na jeho špici
    v nadmořské výšce 1012 m n. m. pevně sedí a rozmarům počasí vzdoruje
    horský hotel a televizní vysílač Ještěd." První věta je popis role
    Horního Hanychova, který plyne z našeho vlastního katalogu přístupových
    tras (DATA-06), ne z pramene.
  verified: false
