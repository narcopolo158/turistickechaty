# Liberec – Horní Hanychov — středisko / východiště na Ještěd.
# Založeno 4. 8. 2026 (zadání Michala „kompletně dotáhni Ještědský hřbet").
# Důvod zařazení: nástup 4 z 5 přístupových tras oblasti dle DATA-06 —
# Bouda Tetřeví sedlo, Horská chata Ještědka, Chata Pláně pod Ještědem
# a Hotel Ještěd.
#
# PROČ „Liberec – Horní Hanychov", A NE PROSTĚ „Liberec": středisko není celé
# krajské město, nýbrž jeho horní okraj, odkud se na hřbet nastupuje —
# konečná tramvaje, dolní stanice lanovky a záchytná parkoviště. Referenční
# bod je proto zastávka u lanovky z katalogu výchozích bodů, ne střed města;
# u ostatních středisek korpusu je to uzel OSM place, tady vědomě jinak
# (a je to napsané v overeniLokace, ať to DATA-35 ani čtenář neplete).
