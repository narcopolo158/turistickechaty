# Světlá pod Ještědem — středisko / východiště na Ještědský hřbet.
# Založeno 4. 8. 2026 (zadání Michala „kompletně dotáhni Ještědský hřbet").
# Důvod zařazení: nástupní bod 2 přístupových tras dle DATA-06 (Horská chata
# Ještědka a Chata Pláně pod Ještědem) — jižní strana hřbetu.
nazev: Světlá pod Ještědem
slug: svetla-pod-jestedem
zeme: cz
oblast: jestedsky-hrbet

# Perex jen z doložené formulace pramene.
perex: >-
  Vesnice na jižní straně Ještědského hřbetu v okrese Liberec, složená z osmi
  částí. Její katastr stoupá od 400 metrů až k vrcholu Ještědu.
overeniPerex:
  source: >-
    Oficiální web obce Světlá pod Ještědem, stránka Obec
    (svetlapodjestedem.cz/obec/, načteno 4. 8. 2026): „Světlá pod Ještědem je
    vesnicí na severu Čech, v okresu Liberec, v Libereckém kraji."; nadmořská
    výška „400–1012 m n.m."; osm částí (Světlá pod Ještědem, Rozstání, Hodky,
    Dolení Paseky, Hoření Paseky, Vesec, Jiříčkov, Křižany). Poloha „na jižní
    straně hřbetu" plyne z našich vlastních dat (obec leží jižně od hřebene,
    přístupové trasy DATA-06 vedou odsud nahoru), ne z pramene.
  verified: false
  checked: '2026-08-04'

