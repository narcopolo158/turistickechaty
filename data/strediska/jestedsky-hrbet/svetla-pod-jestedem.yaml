interniPoznamky: >-
  Doplnit z doložených zdrojů: dopravu (vlastní web obce k ní nic
  strukturního nenese, jen odkaz na jízdní řády IDOS) a fotku střediska
  (DATA-33 pro tuhle oblast ještě neběžel).

  Pozor na rozpětí 400–1012 m: horní mez je vrchol Ještědu, takže katastr
  obce podle vlastního webu sahá až na temeno hřbetu. Souvisí to s otázkou
  DATA-20 o významu pole `obec` — Hotel Ještěd vedeme s obcí Liberec
  (Památkový katalog), ale hranice tady zjevně nejsou samozřejmé. Neřeším,
  jen zaznamenávám.
