# Perex jen z doložené formulace pramene.
perex: >-
  Obec asi dva kilometry jižně od Liberce, na silnici z Liberce přes Proseč pod
  Ještědem do Českého Dubu.
overeniPerex:
  source: >-
    Turistický portál Libereckého kraje
    liberecky-kraj.cz/dr-cs/5062-simonovice.html (načteno 4. 8. 2026): „Obec
    Šimonovice leží asi 2 km jižně od Liberce na silnici vedoucí z Liberce přes
    Proseč pod Ještědem do Českého Dubu." Nadmořskou výšku stránka neuvádí;
    druhou větu pramene („svou polohou přímo vybízí k návštěvě Liberce…")
    nepřebírám, je to doporučení, ne fakt.
