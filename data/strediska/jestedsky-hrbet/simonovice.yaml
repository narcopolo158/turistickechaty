    „Obec Šimonovice leží asi 2 km jižně od Liberce na silnici vedoucí
    z Liberce přes Proseč pod Ještědem do Českého Dubu." Nadmořskou výšku
    stránka neuvádí; druhou větu pramene („svou polohou přímo vybízí
    k návštěvě Liberce…") nepřebírám, je to doporučení, ne fakt.
