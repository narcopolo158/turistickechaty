interniPoznamky: >-
  Doplnit z doložených zdrojů: dopravu a fotku střediska (DATA-33 pro tuhle
  oblast ještě neběžel).

  Rašovka je odsud dostupná i z Bohdánkova (zastávka v katalogu DATA-06,
  50,6822 / 15,0427) — samostatné středisko z něj nezakládám, je to osada,
  ne nástupní obec s vlastní infrastrukturou. Kdyby přibyly další chaty na
  jihovýchodním konci hřbetu, zvážit znovu.
