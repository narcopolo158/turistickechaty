# Rokytnice nad Jizerou — středisko / východiště do hor.
# Založeno 28. 7. 2026 na zadání Michala („nepřidáme další střediska?").
# Důvod zařazení: nástupní bod 2 přístupových tras dle přepočtu DATA-06 (28. 7. 2026).
# Poctivost: GPS z katalogu výchozích bodů (OSM), ostatní pole se doplní
# z doložených zdrojů — do té doby chybí a stat-tile se nevykreslí.
nazev: Rokytnice nad Jizerou
slug: rokytnice-nad-jizerou
zeme: cz
oblast: krkonose

# Perex jen z doložené formulace oficiálního portálu svazku.
perex: >-
  Horské město v Libereckém kraji, sevřené mezi Stráží, Čertovou horou
  a Lysou horou.
overeniPerex:
  source: >-
    Oficiální turistický portál Svazku měst a obcí Krkonoše
    region-krkonose.cz/obce/rokytnice-nad-jizerou/ (načteno 4. 8. 2026):
    „Horské město Rokytnice nad Jizerou najdete v Libereckém kraji mezi
    Stráží, Čertovou horou a Lysou horou." Výšku obce pramen neuvádí —
    perex proto zůstává jednovětý.
  verified: false
  checked: '2026-08-04'

