lanovka: >-
  Lanová dráha Rokytnice – Horní Domky na Lysou horu (v katalogu lanových drah Krkonoš uvedena s rozpětím 657–1 315 m n. m.); letní provoz u téhle lanovky nedoložen — ověřit u provozovatele.
