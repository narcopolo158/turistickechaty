# Horní Maršov — středisko / východiště do hor.
# Založeno 28. 7. 2026 na zadání Michala („nepřidáme další střediska?").
# Důvod zařazení: nástupní bod 2 přístupových tras dle přepočtu DATA-06 (28. 7. 2026).
# Poctivost: GPS z katalogu výchozích bodů (OSM), ostatní pole se doplní
# z doložených zdrojů — do té doby chybí a stat-tile se nevykreslí.
nazev: Horní Maršov
slug: horni-marsov
zeme: cz
oblast: krkonose

# Perex jen z doložené formulace oficiálního portálu svazku.
perex: >-
  Malá rekreační obec na hranici Krkonošského národního parku, rozložená v údolí
  řeky Úpy. Do hor odtud vedou dvě značené přístupové trasy z našeho katalogu.
overeniPerex:
  source: >-
    Oficiální turistický portál Svazku měst a obcí Krkonoše
    region-krkonose.cz/horni-marsov/ (načteno 3. 8. 2026): „malá rekreační obec
    na hranici Krkonošského národního parku", „rozkládá se v údolí řeky Úpy".
    Druhá věta = fakt našeho katalogu (2 přístupové trasy DATA-06, počítáno při
    buildu).
  verified: false
  checked: '2026-08-03'

lat: 50.6586744
lng: 15.8199838
vyskaObce: 569
overeniLokace:
  source: >-
    OpenStreetMap (bod obce z katalogu výchozích bodů DATA-06) — data ©
    přispěvatelé OpenStreetMap, ODbL 1.0 (openstreetmap.org/copyright). Výška
    obce: nadmořská výška referenčního bodu střediska (uzel OSM place, týž bod
    jako GPS výš, 50.658674, 15.819984) z výškového modelu Mapy.com Elevation
    API (načteno 2026-08-04): 569 m — model s různou přesností, nemusí odpovídat
    realitě, proto verified:false. Referenční bod místo rozpětí dle zadání
    Michala 4. 8. 2026 („vycházel z nadmořské výšky turistického uzlu / rozcestí
    / náměstí"). Ověření proti ČÚZK zůstává otevřené.
  verified: false
  checked: '2026-08-04'

vychoziBody:
  - nazev: Horní Maršov

# Ruční próza má přednost před řádky z katalogu DATA-06 (jak-se-sem-dostat.ts).
# Vlak se záměrně nevyplňuje: zdroj o železnici mlčí — řádek složený
# z mapových dat (nejbližší stanice z katalogu) je poctivější.
doprava:
  bus: >-
    Do obce jezdí autobus z Prahy-Černého Mostu, z Trutnova a Pece pod Sněžkou.
  auto: >-
    Autem od Trutnova po silnici č. 296 přes Mladé Buky a Svobodu nad Úpou; po
    téže silnici se dá dojet i od Pece pod Sněžkou. Parkuje se na parkovišti u
    Bertholdova náměstí.
overeniDoprava:
  source: >-
    Oficiální turistický portál Svazku měst a obcí Krkonoše
    region-krkonose.cz/horni-marsov/ (načteno 3. 8. 2026): „Do obce jezdí
    autobus z Prahy-Černého Mostu, z Trutnova a Pece pod Sněžkou.", „Autem od
    Trutnova po silnici č. 296 přes Mladé Buky a Svobodu nad Úpou. Po stejné
    silnici dojedete do Horního Maršova i od Pece pod Sněžkou.", parkování „Na
    parkovišti u Bertholdova náměstí." O železnici zdroj mlčí — řádek Vlakem
    zůstává z katalogu DATA-06.
  verified: false
  checked: '2026-08-03'

interniPoznamky: >-
  Doplnit z doložených zdrojů: výška obce (ČÚZK), perex (oficiální web obce nebo
  střediska). Fotka střediska se dohledává pipeline DATA-33 (Wikimedia Commons,
  jen licenčně čisté snímky).

  Doprava: 2. 8. 2026 nedoložena (hornimarsov.cz jen úřední aktuality, svazek
  Východní Krkonoše nic strukturního — „zkusit příště jinde"). → DOLOŽENO 3. 8.
  2026 (hlavní session, 2h blok): „jinde" = oficiální portál svazku
  region-krkonose.cz, týž vydavatel, kterého už používáme u lanovek — bus + auto
  + parkoviště, viz overeniDoprava.
