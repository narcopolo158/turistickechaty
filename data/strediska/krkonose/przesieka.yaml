# Przesieka — středisko / východiště do hor.
# Založeno 28. 7. 2026 na zadání Michala („nepřidáme další střediska?").
# Důvod zařazení: nástupní bod 2 přístupových tras dle přepočtu DATA-06 (28. 7. 2026).
# Poctivost: GPS z katalogu výchozích bodů (OSM), ostatní pole se doplní
# z doložených zdrojů — do té doby chybí a stat-tile se nevykreslí.
nazev: Przesieka
slug: przesieka
zeme: pl
oblast: krkonose

# Perex jen z doložené formulace pramene.
perex: >-
  Vesnice rozložená v údolích potoků Czerwień, Myja a Podgórna, v nadmořské
  výšce v rozmezí od 480 do 650 metrů.
overeniPerex:
  source: >-
    Oficiální web gminy Podgórzyn, pod kterou Przesieka spadá,
    podgorzyn.pl/gmina-podgorzyn/nasze-miejscowosci.html (načteno 4. 8. 2026):
    vesnice „rozciąga się w dolinie Czerwienia, Myi i Podgórnej" a leží „na
    wysokości 480-650 m n.p.m." Přezdívku „królowa karkonoskich widoków"
    nepřebírám — je to reklamní obrat gminy, ne fakt. Překlad do češtiny je náš.
  verified: false
  checked: '2026-08-04'

lat: 50.8087495
lng: 15.6653035
vyskaObce: 557
overeniLokace:
  source: >-
    OpenStreetMap (bod obce z katalogu výchozích bodů DATA-06) — data ©
    přispěvatelé OpenStreetMap, ODbL 1.0 (openstreetmap.org/copyright). Výška
    obce: nadmořská výška referenčního bodu střediska (uzel OSM place, týž bod
    jako GPS výš, 50.808749, 15.665304) z výškového modelu Mapy.com Elevation
    API (načteno 2026-08-04): 557 m — model s různou přesností, nemusí odpovídat
    realitě, proto verified:false. Referenční bod místo rozpětí dle zadání
    Michala 4. 8. 2026 („vycházel z nadmořské výšky turistického uzlu / rozcestí
    / náměstí"). Ověření proti ČÚZK zůstává otevřené.
  verified: false
  checked: '2026-08-04'

vychoziBody:
  - nazev: Przesieka

interniPoznamky: >-
  Doplnit z doložených zdrojů: výška obce (ČÚZK), perex (oficiální web obce nebo
  střediska) a doprava (vlak/bus/auto). Fotka střediska se dohledává pipeline
  DATA-33 (Wikimedia Commons, jen licenčně čisté snímky).

  Doprava 2. 8. 2026 NEDOLOŽENA: oficiální web gminy Podgórzyn (podgorzyn.pl) k
  parkování v Przesiece nic strukturního nenese; mapové servery zmiňují
  bezplatné parkoviště, ale to není pramen, ze kterého bychom psali.

  Doprava — pokus 3. 8. 2026 (hlavní session): oficiální zdroj gminy Podgórzyn
  se z vyhledávání nepodařilo zachytit (výsledky jen blogové návody k vodopádu
  Podgórnej — nepřebíráme, nejsou oficiální pramen). PL střediska jsou dle
  handoffu „bez čísel", priorita nízká; zkusit příště podgorzyn.pl v ručním
  běhu.

  Perex doplněn 4. 8. 2026 z oficiálního webu gminy Podgórzyn, který u výšky
  uvádí jen ROZPĚTÍ 480–650 m. → `vyskaObce` VYPLNĚNO týž den během DATA-35:
  557 m, výška referenčního bodu. Tady rozpětí a bod sedí dobře (střed rozpětí
  565 m, rozdíl 8 m) — u malé vsi v jednom údolí je to očekávané. VEDLEJŠÍ NÁLEZ k prověření:
  gmina píše, že administrativně k Przesiece patří i „schronisko Odrodzenie na
  Przełęczy Karkonoskiej, usytuowane na 1236 m n.p.m." — porovnat s naším
  profilem Odrodzenie (obec i výška).

  Doprava 4. 8. 2026 (blok 5) NEDOLOŽENA — třetí pokus, poprvé ale se zdůvodněním z primárního pramene. Oficiální web gminy Podgórzyn o dojezdu říká jen obecné „Gmina Podgórzyn jest łatwo dostępna zarówno komunikacją publiczną, jak i samochodową." — to je marketingová věta, ne fakt o dopravě, a nepřebírá se. Stránka o vodopádu Podgórnej, kde by pravidla vjezdu dávala smysl, vrací 404; archivní komunikát gminy o změně organizace provozu na ul. Droga do Wodospadu je na doméně arch.podgorzyn.pl s vadným certifikátem (hostname mismatch), takže se nedá načíst. Doložený je zato turistický fakt: modrá značka z Podgórzyna na Przełęcz Karkonoską vede právě přes Przesieku (podgorzyn.pl/turysta/turystyka-piesza.html).
