interniPoznamky: >-
  Doplnit z doložených zdrojů: výška obce (ČÚZK), perex (oficiální web obce
  nebo střediska) a doprava (vlak/bus/auto). Fotka střediska se dohledává
  pipeline DATA-33 (Wikimedia Commons, jen licenčně čisté snímky).

  Doprava 2. 8. 2026 NEDOLOŽENA: oficiální web gminy Podgórzyn (podgorzyn.pl) k parkování v Przesiece nic strukturního nenese; mapové servery zmiňují bezplatné parkoviště, ale to není pramen, ze kterého bychom psali.

  Doprava — pokus 3. 8. 2026 (hlavní session): oficiální zdroj gminy
  Podgórzyn se z vyhledávání nepodařilo zachytit (výsledky jen blogové
  návody k vodopádu Podgórnej — nepřebíráme, nejsou oficiální pramen).
  PL střediska jsou dle handoffu „bez čísel", priorita nízká; zkusit
  příště podgorzyn.pl v ručním běhu.
