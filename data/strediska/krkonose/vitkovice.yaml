# Vítkovice — středisko / východiště do hor.
# Založeno 28. 7. 2026 na zadání Michala („nepřidáme další střediska?").
# Důvod zařazení: nástupní bod 9 přístupových tras dle přepočtu DATA-06 (28. 7. 2026).
# Poctivost: GPS z katalogu výchozích bodů (OSM), ostatní pole se doplní
# z doložených zdrojů — do té doby chybí a stat-tile se nevykreslí.
nazev: Vítkovice
slug: vitkovice
zeme: cz
oblast: krkonose

# Perex jen z doložené formulace pramene.
perex: >-
  Obec v údolí říčky Jizerky, v nadmořské výšce 683 metrů.
overeniPerex:
  source: >-
    Oficiální turistický portál Svazku měst a obcí Krkonoše
    region-krkonose.cz/obce/vitkovice-v-krkonosich/ (načteno 4. 8. 2026):
    „Leží v nadmořské výšce 683 metrů, podél údolí řeky Jizerky a je umístěna
    v atraktivním prostředí regionu Krkonoše." Úvodní větu pramene („Malebnou
    obec Vítkovice naleznete na Benecku") nepřebírám — Benecko je sousední
    obec, ne poloha Vítkovic, a věta je zjevně chybná.
  verified: false
  checked: '2026-08-04'


lat: 50.6790154
lng: 15.5312007
