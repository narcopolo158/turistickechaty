# Karpacz — středisko / východiště do hor (F1a; mini-stránka = F1e)
# Poctivost: jen doložené údaje. Výška obce (ČÚZK), perex a doprava se doplní
# z doložených zdrojů — do té doby pole chybí (stat-tile se nevykreslí).
# Počty chat a rozpětí přístupů se počítají při buildu z tras (DATA-06) přes
# vychoziBody — nikdy se sem nepíšou ručně.
nazev: Karpacz
slug: karpacz
zeme: pl
oblast: krkonose

# Perex jen z doložené formulace pramene.
perex: >-
  Město nad říčkou Łomnicou pod Sněžkou, v nadmořské výšce v rozmezí od 500 do
  1375 metrů.
overeniPerex:
  source: >-
    Turistický portál Dolnoslezského vojvodství umwd.dolnyslask.pl (sekce
    Karkonosze → Karpacz, načteno 4. 8. 2026), doslova: „Karpacz leży nad
    Łomnicą, u stóp Śnieżki, na wysokości 500-1375 m n.p.m." Oficiální web města
    karpacz.pl (načteno téhož dne) výšku neuvádí a jeho úvodní věta je hodnotící
    („jedno z najpiękniejszych karkonoskich miast"), proto se nepřebírá. Překlad
    do češtiny je náš; polské znění je uvedeno výše, ať je co porovnat.
  verified: false
  checked: '2026-08-04'

# GPS bodu obce z OSM (place) — katalog výchozích bodů DATA-06
lat: 50.7747485
lng: 15.7542035
vyskaObce: 619
overeniLokace:
  source: >-
    OpenStreetMap https://www.openstreetmap.org/node/385563068 (bod obce z
    katalogu výchozích bodů DATA-06, data © přispěvatelé OpenStreetMap, ODbL
    1.0). Výška obce: nadmořská
    výška referenčního bodu střediska (uzel OSM place, týž bod jako GPS výš,
    50.774749, 15.754203) z výškového modelu Mapy.com Elevation API (načteno
    2026-08-04): 619 m — model s různou přesností, nemusí odpovídat realitě,
    proto verified:false. Referenční bod místo rozpětí dle zadání Michala 4. 8.
    2026 („vycházel z nadmořské výšky turistického uzlu / rozcestí / náměstí").
    Ověření proti ČÚZK zůstává otevřené.
  verified: false
  checked: '2026-08-04'

# Vazba na katalog výchozích bodů (data/oblasti/krkonose/vychozi-body-kandidati.json)
vychoziBody:
  - nazev: Karpacz

lanovka: >-
  Sedačková lanovka na Kopu (provozovatel Karpacz Ski Arena, lanovka bývá
  uváděna jako „Zbyszek"). Letní provoz dle sekundárního zdroje ne–čt
  9:00–16:30, pá–so 9:00–17:30.
overeniLanovka:
  source: >-
    kpn.gov.pl/wyciagi (seznam KPN) + krainawycieczek.pl „kolej linowa na Kopę w
    Karpaczu" (obojí načteno 28. 7. 2026; druhý zdroj je sekundární)
  verified: false
  checked: '2026-07-28'

# Ruční próza má přednost před řádky z katalogu DATA-06 (Karpacz má i řádek
# Vlakem z katalogu — stanice 1,0 km). Ceny se nepíšou.
doprava:
  auto: >-
    Město provozuje čtrnáct placených nehlídaných parkovišť (platí se
    nepřetržitě, sedm dní v týdnu); jako záchytné u železniční stanice slouží
    parkoviště č. 14 v ulici Wielkopolské.
overeniDoprava:
  source: >-
    Oficiální web města Karpacz, stránka Parkingi miejskie (karpacz.pl, načteno
    2. 8. 2026): 14 městských placených nehlídaných parkovišť („Parkingi są
    płatne 7 dni w tygodniu przez 24 godziny“), od č. 1 ul. Parkowa u Muzea
    sportu a turistiky po č. 14 ul. Wielkopolska — záchytné parkoviště u
    nádraží; č. 8 ul. Polskich Olimpijczyków i pro busy a autobusy. Ceny se do
    profilu nepíšou.
  verified: false
  checked: '2026-08-02'

interniPoznamky: >-
  Doplnit z doložených zdrojů: výška obce (ČÚZK — zadání F1a), perex (oficiální
  web střediska/obce), doprava (vlak/bus/auto) a lanovka; u polských středisek
  zatím žádná čísla (rozhodnutí handoffu: „PL bez čísel" do doby doložení).

  Doprava (auto) doplněna 2. 8. 2026 z oficiálního webu města.

  Perex doplněn 4. 8. 2026 z turistického portálu Dolnoslezského vojvodství
  (oficiální web města výšku neuvádí), který u výšky uvádí jen ROZPĚTÍ
  500–1375 m. → `vyskaObce` VYPLNĚNO týž den během DATA-35: 619 m, výška
  referenčního bodu. Michal 4. 8. 2026 potvrdil, že PL střediska se do běhu
  zahrnují.
