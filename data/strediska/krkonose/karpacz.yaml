    („Parkingi są płatne 7 dni w tygodniu przez 24 godziny“), od č. 1
    ul. Parkowa u Muzea sportu a turistiky po č. 14 ul. Wielkopolska —
    záchytné parkoviště u nádraží; č. 8 ul. Polskich Olimpijczyków i pro
    busy a autobusy. Ceny se do profilu nepíšou.
