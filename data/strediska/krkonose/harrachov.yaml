# Harrachov — středisko / východiště do hor (F1a; mini-stránka = F1e)
# Poctivost: jen doložené údaje. Výška obce (ČÚZK), perex a doprava se doplní
# z doložených zdrojů — do té doby pole chybí (stat-tile se nevykreslí).
# Počty chat a rozpětí přístupů se počítají při buildu z tras (DATA-06) přes
# vychoziBody — nikdy se sem nepíšou ručně.
nazev: Harrachov
slug: harrachov
zeme: cz
oblast: krkonose

# Perex jen z doložené formulace oficiálního portálu svazku.
perex: >-
  Turistické město „zastrčené" u hranic v západních Krkonoších, vyhlášené
  svými skokanskými můstky.
overeniPerex:
  source: >-
    Oficiální turistický portál Svazku měst a obcí Krkonoše
    region-krkonose.cz/obce/harrachov/ (načteno 4. 8. 2026): „Harrachov se
    nachází „zastrčený" u hranic v západních Krkonoších. Je velmi bohatým
    turistickým městem a vyhlášený svými skokanskými můstky." Hodnotící
    „velmi bohaté" se do perexu nepřevzalo (kolekce Strediska: žádné
    hodnocení); výšku obce pramen neuvádí.
  verified: false
  checked: '2026-08-04'

