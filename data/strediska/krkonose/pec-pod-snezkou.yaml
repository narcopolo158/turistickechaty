# Pec pod Sněžkou — středisko / východiště do hor (F1a; mini-stránka = F1e)
# Poctivost: jen doložené údaje. Výška obce (ČÚZK), perex a doprava se doplní
# z doložených zdrojů — do té doby pole chybí (stat-tile se nevykreslí).
# Počty chat a rozpětí přístupů se počítají při buildu z tras (DATA-06) přes
# vychoziBody — nikdy se sem nepíšou ručně.
nazev: Pec pod Sněžkou
slug: pec-pod-snezkou
zeme: cz
oblast: krkonose

# Perex jen z doložené formulace oficiálního portálu svazku.
perex: >-
  Horské město na řece Úpě a Zeleném potoku, v nadmořské výšce 750 metrů.
  Stalo se významným střediskem pro turisty v zimním i letním období.
overeniPerex:
  source: >-
    Oficiální turistický portál Svazku měst a obcí Krkonoše
    region-krkonose.cz/obce/pec-pod-snezkou/ (načteno 4. 8. 2026): „Na řece
    Úpě a Zeleném potoku v Krkonoších najdete Pec pod Sněžkou, která se
    stala významným střediskem pro turisty v zimním i letním období.",
    „Pec pod Sněžkou najdete v nadmořské výšce 750 m".
  verified: false
  checked: '2026-08-04'

# GPS bodu obce z OSM (place) — katalog výchozích bodů DATA-06
lat: 50.6935744
lng: 15.7335607
# Výška obce z oficiálního portálu svazku (vzor Dolního Dvora 3. 8. 2026);
# ověření proti ČÚZK dle zadání F1a zůstává otevřené.
vyskaObce: 750
overeniLokace:
  source: >-
    GPS: OpenStreetMap https://www.openstreetmap.org/node/1587266118 (bod
    obce z katalogu výchozích bodů DATA-06, data © přispěvatelé
    OpenStreetMap, ODbL 1.0). Výška obce: oficiální turistický portál Svazku
    měst a obcí Krkonoše region-krkonose.cz/obce/pec-pod-snezkou/ (načteno
    4. 8. 2026): „Pec pod Sněžkou najdete v nadmořské výšce 750 m" — jedno
    číslo, ne rozpětí jako u sousedních obcí; ověření proti ČÚZK (zadání
    F1a) zůstává otevřené.
  verified: false
  checked: '2026-08-04'

# Vazba na katalog výchozích bodů (data/oblasti/krkonose/vychozi-body-kandidati.json)
vychoziBody:
  - nazev: Pec pod Sněžkou

lanovka: >-
  Kabinová lanovka na Sněžku (přes mezistanici Růžová hora) a sedačková lanovka na Hnědý vrch; u Hnědého vrchu uvádí provozovatel letní provoz „so–ne 09:00–16:00".
overeniLanovka:
  source: >-
    leto.skiresort.cz/lanovky/ + region-krkonose.cz/lanove-drahy/ (načteno 28. 7. 2026)
  verified: false
  checked: '2026-07-28'

# Ruční próza má přednost před řádky z katalogu DATA-06 (jak-se-sem-dostat.ts).
# Bus se tu záměrně nevyplňuje: oficiální web města o autobusech neříká nic
# konkrétního (jen odkaz na IDOS) — řádek složený z mapových dat je poctivější.
# Ceny parkování se nepíšou, mění se každou sezónu.
doprava:
  vlak: >-
    Železnice do Pece nevede. Vlakové spoje
    končí v Trutnově nebo ve Svobodě nad Úpou a dál se přestupuje na
    navazující autobusové spojení.
  auto: >-
    Město leží v Krkonošském národním parku a návštěvníky žádá, aby pokud
    možno parkovali v Dopravním terminálu P1 (parkovací dům u benzinové
    stanice, 450 míst). Do částí Pece a Velké Úpy je vjezd omezen dopravním
    značením — jednorázové povolení k vjezdu prodávají automaty.
overeniDoprava:
  source: >-
    Oficiální web města Pec pod Sněžkou (načteno 2. 8. 2026):
    pecpodsnezkou.cz/doprava/ — doslova „Vlakové spoje končí v Trutnově nebo
    ve Svobodě nad Úpou, poté je potřeba přestoupit na navazující autobusové
    spojení" a „Město se nachází v Krkonošském národním parku a proto prosíme
    návštěvníky, aby pokud možno parkovali v Dopravním terminálu P1"; vjezd
    do částí Pece a Velké Úpy „omezen dopravním značením", jednorázová
    povolení z automatů. pecpodsnezkou.cz/parkovani/ — P1 parkovací dům
    u benzinové stanice, 450 míst (z toho 150 k rezervaci); P3A uzavřeno do
    15. 12. 2027. K busu web nic konkrétního neuvádí (odkazuje na IDOS.cz),
    řádek Autobusem proto zůstává z katalogu DATA-06. Ceny se do profilu
    nepíšou — mění se každou sezónu.
  verified: false
  checked: '2026-08-02'

interniPoznamky: >-
  Doplnit z doložených zdrojů: výška obce (ČÚZK — zadání F1a) a perex
  (oficiální web střediska/obce); u polských středisek zatím žádná čísla
  (rozhodnutí handoffu: „PL bez čísel" do doby doložení). Doprava doplněna
  2. 8. 2026 z oficiálního webu města (vlak + auto; bus vědomě z katalogu).
