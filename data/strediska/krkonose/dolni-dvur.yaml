# Ruční próza má přednost před řádky z katalogu DATA-06 (jak-se-sem-dostat.ts).
# Vlak a bus se záměrně nevyplňují: zdroj o nich mlčí — řádky složené
# z mapových dat (nejbližší stanice/zastávky z katalogu) jsou poctivější.
doprava:
  auto: >-
    Od Vrchlabí po silnici č. 14, v obci Lánov odbočka na Dolní Dvůr.
    Parkuje se u ski areálu Luisino údolí zdarma, jinak s ohleduplností
    volně v obci.
overeniDoprava:
  source: >-
    Oficiální turistický portál Svazku měst a obcí Krkonoše
    region-krkonose.cz/obce/dolni-dvur/ (načteno 3. 8. 2026): „Od Vrchlabí
    o silnici č. 14, v obci Lánov odbočka na Dolní Dvůr." [sic — „o
    silnici" je překlep zdroje, míněno „po silnici"], parkování „Ski areál
    Luisino údolí zdarma, s ohleduplností volně v obci." O železnici ani
    autobusu zdroj nic neříká — řádky zůstávají z katalogu DATA-06.
  verified: false
  checked: '2026-08-03'

interniPoznamky: >-
  Doplnit z doložených zdrojů: perex (oficiální web obce
