# z doložených zdrojů — do té doby chybí a stat-tile se nevykreslí.
nazev: Dolní Dvůr
slug: dolni-dvur
zeme: cz
oblast: krkonose

# Perex jen z doložené formulace oficiálního portálu svazku (týž pramen,
# ze kterého je i výška obce níž — doplněno 4. 8. 2026).
