  auto: >-
    Obec provozuje dvě parkoviště — na náměstí a v lomu; obě jsou v zimní
    sezóně placená podle obecního nařízení o placeném stání.
overeniDoprava:
  source: >-
    Oficiální web obce Strážné (strazne.eu, sekce skiareál → parkoviště,
    načteno 2. 8. 2026): parkoviště „Náměstí“ a „Lom“, obě v zimě placená,
    nehlídaná, dle „Nařízení č. 2/2018 o placeném stání na místních
    komunikacích v obci Strážné“; na náměstí automat i obsluha, v lomu jen
    platba kartou. Ceny se do profilu nepíšou — mění se každou sezónu.
  verified: false
  checked: '2026-08-02'

