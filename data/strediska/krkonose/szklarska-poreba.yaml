# Szklarska Poręba — středisko / východiště do hor (F1a; mini-stránka = F1e)
# Poctivost: jen doložené údaje. Výška obce (ČÚZK), perex a doprava se doplní
# z doložených zdrojů — do té doby pole chybí (stat-tile se nevykreslí).
# Počty chat a rozpětí přístupů se počítají při buildu z tras (DATA-06) přes
# vychoziBody — nikdy se sem nepíšou ručně.
nazev: Szklarska Poręba
slug: szklarska-poreba
zeme: pl
oblast: krkonose

# Perex jen z doložené formulace pramene.
perex: >-
  Město rozložené mezi dvěma horskými pásmy a rozdělené údolím
  horské řeky, v nadmořské výšce v rozmezí od 440 do 1471 metrů.
overeniPerex:
  source: >-
    Oficiální turistický web města Szklarska Poręba
    turystyczna.szklarskaporeba.pl/artykul/10/polozenie (načteno 4. 8. 2026),
    doslova: „Szklarska Poręba jest położona malowniczo! Między dwoma pięknymi
    pasmami górskimi, przedzielona doliną górskiej rzeki"; tamtéž výška
    440–1471 m n.p.m. Hodnotící „malowniczo" a „pięknymi" se do perexu
    nepřenášejí. Překlad do češtiny je náš.
  verified: false
  checked: '2026-08-04'


# GPS bodu obce z OSM (place) — katalog výchozích bodů DATA-06
