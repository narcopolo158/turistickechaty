lanovka: >-
  Sedačková lanovka na Szrenicu ze Szklarské Poręby (ul. Turystyczna 25a), dva úseky, horní stanice 1 309,6 m n. m., vrchol 1 362 m; provozovatel Ski Arena Szrenica. Letní provoz zhruba 9:00–16:30, poslední jízda kolem 16:00.
overeniLanovka:
  source: >-
    kpn.gov.pl/wyciagi (seznam KPN) + krainawycieczek.pl „kolej linowa na Szrenicę" (obojí načteno 28. 7. 2026; druhý zdroj je sekundární)
  verified: false
  checked: '2026-07-28'

# Ruční próza má přednost před řádky z katalogu DATA-06. Ceny se nepíšou.
doprava:
  auto: >-
    Ve městě je vyznačeno přes deset parkovišť a parkovacích míst dvou
    druhů — placených i bezplatných; parkovací automaty většinou přijímají
    jen mince, kartou se platí na parkovišti v ulici Turystyczne.
overeniDoprava:
  source: >-
    Oficiální web města Szklarska Poręba, stránka Parkowanie
    (miasto.szklarskaporeba.pl, načteno 2. 8. 2026): „W Szklarskiej
    Porębie wyznaczonych jest kilkanaście parkingów i miejsc do parkowania
    dwóch rodzajów: płatne i bezpłatne.“; „Automaty parkingowe przyjmują
    tylko bilon“, kartou jen ul. Turystyczna; elektromobily a držitelé
    průkazů OZP neplatí. Ceny se do profilu nepíšou.
  verified: false
  checked: '2026-08-02'

interniPoznamky: >-
  Doplnit z doložených zdrojů: výška obce (ČÚZK — zadání F1a), perex
  (oficiální web střediska/obce), doprava (vlak/bus/auto) a lanovka;
  u polských středisek zatím žádná čísla (rozhodnutí handoffu: „PL bez
  čísel" do doby doložení).

  Doprava (auto) doplněna 2. 8. 2026 z oficiálního webu města.

  Perex doplněn 4. 8. 2026 z oficiálního turistického webu města. Rozpětí
  440–1471 m se do `vyskaObce` nezapisuje — jedno číslo dodá DATA-35
  z referenčního bodu (PL zahrnuty dle rozhodnutí Michala 4. 8. 2026).
