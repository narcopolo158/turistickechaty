# Bedřichov — středisko / východiště do Jizerských hor.
nazev: Bedřichov
slug: bedrichov
zeme: cz
oblast: jizerske-hory

# Perex jen z doložené formulace pramene.
perex: >-
  Jizerskohorská obec s bohatou sklářskou minulostí, mezi Libercem
  a Jabloncem nad Nisou, v nadmořské výšce 707 metrů.
overeniPerex:
  source: >-
    Oficiální web obce Bedřichov, Základní údaje
    (bedrichov-ou.cz/cs/obec/o-obci/zakladni-udaje.html, načteno 4. 8. 2026):
    „Obec Bedřichov je malebná jizerskohorská obec s bohatou sklářskou
    minulostí, leží v nadmořské výšce 707 m n. m." Polohu mezi Libercem
    a Jabloncem nad Nisou potvrzuje tentýž web i turistický portál
    Libereckého kraje liberecky-kraj.cz/dr-cs/2092-bedrichov.html („Nachází
    se mezi městy Jablonec nad Nisou a Liberec"), který uvádí i touž výšku
    707 m — dva nezávislé prameny se shodují.
  verified: false
  checked: '2026-08-04'

# Výška obce: 707 m shodně ve dvou nezávislých pramenech (oficiální web
# obce + portál kraje). Rozpětí 710–802 m, které web uvádí u skiareálu, je
# údaj o sjezdovkách, ne o obci — do pole nepatří.
vyskaObce: 707

vychoziBody:
