    (liberecky-kraj.cz/dr-cs/2092-bedrichov.html), obojí načteno 4. 8. 2026 —
    ověření proti ČÚZK (zadání F1a) zůstává otevřené.
    GPS doplněna 6. 8. 2026 z bodu obce v katalogu výchozích bodů DATA-06 (OpenStreetMap node/1587389891, place=village, source csu:uir-zsj; data © přispěvatelé OpenStreetMap, ODbL 1.0).
  verified: false
  checked: '2026-08-06'
# Ruční próza má přednost před řádky z katalogu DATA-06
# (jak-se-sem-dostat.ts) — ty se od 6. 8. 2026 počítají i tady, protože
# středisko má GPS. Ceny se nepíšou.
doprava:
  bus: >-
    Do obce jezdí autobusová linka 145 (Bedřichov – Janov nad Nisou).
  auto: >-
    Parkování mimo čtyři vyhrazená parkoviště je v obci zakázáno. P1
    Centrál v centru je vhodné pro nástup na Jizerskou magistrálu
    u stadionu, P2 Maliník při příjezdu od Liberce (směr přehrada Černá
    Nisa), P3 Nisa leží pod skiareálem Malinovka a P4 Hřiště směrem na
    Janov nad Nisou je otevřené 6–22 h. Patnáct procent z parkovného jde
    na úpravu Jizerské magistrály.
overeniDoprava:
  source: >-
    Oficiální web obce Bedřichov (bedrichov-ou.cz, stránka Parkování,
    načteno 2. 8. 2026): P1 Centrál „centrum obce, vhodné pro nástup na
    trasy Jizerské magistrály na stadionu“, P2 Maliník „při příjezdu od
    Liberce, vhodné pro nástup na trasy Jizerské magistrály směr přehrada
    Černá Nisa“, P3 Nisa pod Ski areálem Bedřichov–Malinovka, P4 Hřiště
    „otevřeno 6.00–22.00 h“; „Parkování mimo vyhrazená parkoviště je
    zakázáno“; „15% z vybrané částky za parkovné je použito na úpravu
    Jizerské magistrály“. Ceny se do profilu nepíšou.

    Autobus doplněn 4. 8. 2026 z oficiálního webu obce Lázně Libverda,
    článek „DO JIZEREK VEŘEJNOU DOPRAVOU"
    (laznelibverda.cz/cs/aktuality-clanky/do-jizerek-verejnou-dopravou.html):
    linka 145 „směrem na Bedřichov a Janov nad Nisou". Pramen jmenuje
    LINKU, ne jízdní řád ani zastávky — profil proto netvrdí, kdy a odkud
    spoje jedou. Je to web sousední obce, ne dopravce.
  verified: false
  checked: '2026-08-04'

interniPoznamky: 'Založeno 30. 7. 2026 na zadání Michala („vyhledej lanovky a střediska a dotáhni
  pohoří Jizerské hory na stejnou úroveň jako mají teď Krkonoše"). Důvod zařazení: katalog výchozích
  bodů vede Bedřichov jako nejbližší obec/uzel pro Hřebínek, Prezidentská chata, Šámalova chata.
  SOUŘADNICE CHYBĚLY DO 6. 8. 2026 (viz dodatek na konci): krkonošská střediska je mají z bodu obce v katalogu výchozích bodů
  DATA-06, a ten pro Jizerské hory ještě neběžel (Overpass ze sandboxu nedosáhneme). Nevymýšlejí
  se — doplní je běh DATA-06 --oblast jizerske-hory, a teprve pak se vykreslí mapa zasazení a
  dohledá fotka střediska (DATA-33). Doplnit z doložených zdrojů také výšku obce (ČÚZK), perex
  a dopravu. Doprava (auto) doplněna 2. 8. 2026 z oficiálního webu obce. GPS DOPLNĚNA 6. 8. 2026 (denní session): katalog výchozích bodů DATA-06 pro jizerske-hory už v repu je, souřadnice se proto vzaly z bodu obce v něm (OSM place, ODbL) — nevymýšlely se. Tím se středisku vykreslí mapa zasazení, spočítají se řádky „Jak se sem dostat“ z mapových dat a odemkne se DATA-33 (fotka střediska) i DATA-35 (výška obce z výškového modelu v referenčním bodě — jeden klik v Actions).'
