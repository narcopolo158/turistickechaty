doprava:
  bus: >-
    Do města jezdí autobusová linka 650, která pokračuje přes Bílý Potok na Smědavu.
overeniDoprava:
  source: >-
    Oficiální web obce Lázně Libverda, článek „DO JIZEREK VEŘEJNOU
