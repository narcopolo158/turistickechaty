    linka 650 „na Hejnice u Liberce, Bílý Potok a dále na Smědavu". Pramen
    jmenuje LINKY, ne jízdní řády ani zastávky — profil proto netvrdí, kdy
    a odkud spoje jedou. Je to web sousední obce, ne dopravce; do prvního
    ověření u dopravce zůstává verified:false.
