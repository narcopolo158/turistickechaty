interniPoznamky: 'Založeno 30. 7. 2026 na zadání Michala („vyhledej lanovky a střediska a dotáhni
  pohoří Jizerské hory na stejnou úroveň jako mají teď Krkonoše"). Důvod zařazení: katalog výchozích
  bodů vede Hejnice jako nejbližší obec/uzel pro Kiosek Knajpa. SOUŘADNICE CHYBĚLY DO 6. 8. 2026 (viz dodatek na konci): krkonošská
  střediska je mají z bodu obce v katalogu výchozích bodů DATA-06, a ten pro Jizerské hory ještě
  neběžel (Overpass ze sandboxu nedosáhneme). Nevymýšlejí se — doplní je běh DATA-06 --oblast
  jizerske-hory, a teprve pak se vykreslí mapa zasazení a dohledá fotka střediska (DATA-33). Doplnit
  z doložených zdrojů také výšku obce (ČÚZK), perex a dopravu. Doprava 2. 8. 2026 NEDOLOŽENA: web města (mestohejnice.cz) nese k parkování jen informace ke slavnostem, žádná celoroční strukturní fakta. Parkování 4. 8. 2026 NEDOLOŽENO znovu — a tentokrát ne proto, že by web mlčel: město stránku „Parkování" má (mestohejnice.cz, redakce/tisk.php), jenže se zacyklila v přesměrování https→http→https a nejde přečíst. Zkusit z jiné sítě nebo ručně; obsah tam podle názvu je. Perex a autobusová linka 650 doplněny 4. 8. 2026. Parkování 4. 8. 2026 (blok 5): pokus zopakován, výsledek stejný — stránka „Parkování" na mestohejnice.cz se dál cyklí v přesměrování https→http→https a nejde přečíst. Je to porucha webu, ne mlčení pramene; obsah tam podle názvu stránky je. Zkusit ručně z prohlížeče. GPS DOPLNĚNA 6. 8. 2026 (denní session): katalog výchozích bodů DATA-06 pro jizerske-hory už v repu je, souřadnice se proto vzaly z bodu obce v něm (OSM place, ODbL) — nevymýšlely se. Tím se středisku vykreslí mapa zasazení, spočítají se řádky „Jak se sem dostat“ z mapových dat a odemkne se DATA-33 (fotka střediska) i DATA-35 (výška obce z výškového modelu v referenčním bodě — jeden klik v Actions).'
