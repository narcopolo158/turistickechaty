# Ruční próza; katalogové řádky tu zatím nejsou (jizerská střediska
# čekají na katalog výchozích bodů DATA-06). Ceny se nepíšou.
doprava:
  auto: >-
    V obci je zakázáno parkovat mimo vyznačená parkoviště (na zelených
    plochách vůbec). Parkuje se v centru Kořenova — u nádraží zdarma —
    a dál v Polubném, Rejdicích i Příchovicích. Do osady Jizerka smí autem
    jen ubytovaní hosté; návštěvníci parkují na parkovišti Mořina,
    karavany a obytná auta tam nesmí vůbec.
overeniDoprava:
  source: >-
    Oficiální web obce Kořenov (korenov.cz, stránka Parkování, načteno
    2. 8. 2026): „V obci je zakázáno parkovat mimo vyznačená parkoviště.
    Parkování na zelených plochách je přísně zakázáno“; centrum ~50 míst
    + zdarma u nádraží; Polubný (U kostela, Slávie, zdarma U trafa ~60
    míst), Rejdice (Nad lanovkou ~70 míst), Příchovice (U kravína
    + u vleků); Jizerka: „Vjezd do osady je povolen pouze ubytovaným
    hostům“, parkoviště Mořina, „Zákaz parkování pro karavany a obytná
    auta!“. Ceny se do profilu nepíšou.
  verified: false
  checked: '2026-08-02'

interniPoznamky: 'Založeno 30. 7. 2026 na zadání Michala („vyhledej lanovky a střediska a dotáhni
  pohoří Jizerské hory na stejnou úroveň jako mají teď Krkonoše"). Důvod zařazení: katalog výchozích
  bodů vede Kořenov jako nejbližší obec/uzel pro Chata Jizerka, Pešákovna, Pyramida Jizerka. SOUŘADNICE
  ZÁMĚRNĚ CHYBÍ: krkonošská střediska je mají z bodu obce v katalogu výchozích bodů DATA-06, a
  ten pro Jizerské hory ještě neběžel (Overpass ze sandboxu nedosáhneme). Nevymýšlejí se — doplní
  je běh DATA-06 --oblast jizerske-hory, a teprve pak se vykreslí mapa zasazení a dohledá fotka
  střediska (DATA-33). Doplnit z doložených zdrojů také výšku obce (ČÚZK), perex a dopravu. Doprava (auto) doplněna 2. 8. 2026 z oficiálního webu obce.'
