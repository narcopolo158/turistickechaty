interniPoznamky: 'Založeno 30. 7. 2026 na zadání Michala („vyhledej lanovky a střediska a dotáhni
  pohoří Jizerské hory na stejnou úroveň jako mají teď Krkonoše"). Důvod zařazení: katalog výchozích
  bodů vede Kořenov jako nejbližší obec/uzel pro Chata Jizerka, Pešákovna, Pyramida Jizerka. SOUŘADNICE
  ZÁMĚRNĚ CHYBÍ: krkonošská střediska je mají z bodu obce v katalogu výchozích bodů DATA-06, a
  ten pro Jizerské hory ještě neběžel (Overpass ze sandboxu nedosáhneme). Nevymýšlejí se — doplní
  je běh DATA-06 --oblast jizerske-hory, a teprve pak se vykreslí mapa zasazení a dohledá fotka
  střediska (DATA-33). Doplnit z doložených zdrojů také výšku obce (ČÚZK), perex a dopravu.'
