# Lázně Libverda — středisko / východiště do Jizerských hor.
nazev: Lázně Libverda
slug: lazne-libverda
zeme: cz
oblast: jizerske-hory

# Perex jen z doložené formulace pramene.
perex: >-
  Obec v nadmořské výšce 420 metrů; první zmínka o ní pochází z roku 1381.
overeniPerex:
  source: >-
    Oficiální web obce Lázně Libverda (laznelibverda.cz, načteno
    4. 8. 2026), přehled základních údajů: rozloha 13,25 km², 549 obyvatel,
    nadmořská výška 420 m n. m., první zmínka 1381. Souvislou
    charakteristiku obce (poloha vůči hřebeni, lázeňský provoz) tenhle
    přehled nenese — perex proto říká jen to, co je v něm doložené;
    doplnit z prózy webu obce, až se najde.
  verified: false
  checked: '2026-08-04'

# Výška obce z oficiálního webu obce (jedno číslo, ne rozpětí) — DATA-35
# ji proto nepřepíše. Ověření proti ČÚZK zůstává otevřené.
vyskaObce: 420

vychoziBody:
