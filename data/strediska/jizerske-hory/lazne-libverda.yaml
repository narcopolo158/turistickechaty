lat: 50.8901392
lng: 15.1903612
overeniLokace:
  source: >-
    Výchozí body: katalog výchozích bodů (data/externi/vychozi-body-cr-sk-2026,
    ověřeno k 2026-07-21); zdrojová URL katalogu:
    https://www.jizerky.cz/doprava. Výška obce: 420 m dle přehledu základních údajů na
    oficiálním webu obce (laznelibverda.cz, načteno 4. 8. 2026) — ověření
    proti ČÚZK (zadání F1a) zůstává otevřené.
    GPS doplněna 6. 8. 2026 z bodu obce v katalogu výchozích bodů DATA-06 (OpenStreetMap node/1587363215, place=village, source csu:uir-zsj; data © přispěvatelé OpenStreetMap, ODbL 1.0).
  verified: false
  checked: '2026-08-06'
# Ruční próza má přednost před řádky z katalogu DATA-06
# (jak-se-sem-dostat.ts) — ty se od 6. 8. 2026 počítají i tady, protože
# středisko má GPS. Ceny se nepíšou.
doprava:
  bus: >-
    Z obce se do hor jede autobusem: linka 145 na Bedřichov a Janov nad Nisou, linka 650 na Hejnice, Bílý Potok a Smědavu.
overeniDoprava:
  source: >-
    Oficiální web obce Lázně Libverda, článek „DO JIZEREK VEŘEJNOU
    DOPRAVOU" (laznelibverda.cz/cs/aktuality-clanky/do-jizerek-verejnou-dopravou.html,
    načteno 4. 8. 2026): linka 145 „směrem na Bedřichov a Janov nad Nisou",
    linka 650 „na Hejnice u Liberce, Bílý Potok a dále na Smědavu". Pramen
    jmenuje LINKY, ne jízdní řády ani zastávky — profil proto netvrdí, kdy
    a odkud spoje jedou. Je to web sousední obce, ne dopravce; do prvního
    ověření u dopravce zůstává verified:false.
  verified: false
  checked: '2026-08-04'

interniPoznamky: 'Založeno 30. 7. 2026 na zadání Michala („vyhledej lanovky a střediska a dotáhni
  pohoří Jizerské hory na stejnou úroveň jako mají teď Krkonoše"). Důvod zařazení: katalog výchozích
  bodů vede Lázně Libverda jako nejbližší obec/uzel pro Hubertka. SOUŘADNICE CHYBĚLY DO 6. 8. 2026 (viz dodatek na konci): krkonošská
  střediska je mají z bodu obce v katalogu výchozích bodů DATA-06, a ten pro Jizerské hory ještě
  neběžel (Overpass ze sandboxu nedosáhneme). Nevymýšlejí se — doplní je běh DATA-06 --oblast
  jizerske-hory, a teprve pak se vykreslí mapa zasazení a dohledá fotka střediska (DATA-33). Doplnit
  z doložených zdrojů také výšku obce (ČÚZK), perex a dopravu. Doprava 2. 8. 2026 NEDOLOŽENA: na oficiálním webu obce (laznelibverda.cz) se nepodařilo najít stránku o parkování. Parkování 4. 8. 2026 (blok 5) NEDOLOŽENO. Oficiální web obce (laznelibverda.cz) stránku o parkování nemá — cílené hledání vrátilo jen komerční katalogy a navigační služby k parkovišti u Obřího sudu, což nejsou obecní prameny. Řádek Autobusem (linky 145 a 650) doložený je, a to právě z tohoto webu. GPS DOPLNĚNA 6. 8. 2026 (denní session): katalog výchozích bodů DATA-06 pro jizerske-hory už v repu je, souřadnice se proto vzaly z bodu obce v něm (OSM place, ODbL) — nevymýšlely se. Tím se středisku vykreslí mapa zasazení, spočítají se řádky „Jak se sem dostat“ z mapových dat a odemkne se DATA-33 (fotka střediska) i DATA-35 (výška obce z výškového modelu v referenčním bodě — jeden klik v Actions).'
