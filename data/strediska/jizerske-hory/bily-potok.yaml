# Bílý Potok — středisko / východiště do Jizerských hor.
nazev: Bílý Potok
slug: bily-potok
zeme: cz
oblast: jizerske-hory

# Perex jen z doložené formulace pramene.
perex: >-
  Obec ve Frýdlantském výběžku nedaleko Hejnic, první frýdlantská osada
  na horním toku Smědé.
overeniPerex:
  source: >-
    Turistický portál Libereckého kraje
    liberecky-kraj.cz/dr-cs/2232-bily-potok.html (načteno 4. 8. 2026): „Obec
    Bílý potok se nachází ve Frýdlantském výběžku, nedaleko města Hejnice.",
    „Obec je první frýdlantskou osadou na horním toku Smědé a jednou
    z nejvýše položených v této části Jizerských hor." Superlativ o výšce se
    do perexu nepřevzal — je to tvrzení pramene bez čísla. Nadmořskou výšku
    stránka neuvádí.
  verified: false
  checked: '2026-08-04'

vychoziBody:
- nazev: Bílý Potok pod Smrkem, železniční stanice
  typ: vlak
- nazev: Bílý Potok, Bártlova bouda – autobusová zastávka / parkoviště
  typ: autobusová zastávka + parkoviště
- nazev: Smědava, autobusová zastávka / parkoviště
  typ: horská autobusová zastávka + parkoviště
overeniLokace:
  source: 'Katalog výchozích bodů (data/externi/vychozi-body-cr-sk-2026, ověřeno k 2026-07-21);
    zdrojová URL katalogu: https://www.bartlovabouda.cz/, https://www.jizerky.cz/aktuality/jizerky-v-lete-sezonni-linky-vas-vyvezou-za-zazitky-i-s-kolem,
    https://www.jizerky.cz/doprava'
  verified: false
  checked: '2026-07-30'
# Ruční próza; katalogové řádky tu zatím nejsou (jizerská střediska
# čekají na katalog výchozích bodů DATA-06). Ceny se nepíšou.
doprava:
  vlak: >-
    V obci končí regionální trať 038 z Raspenavy a Hejnic; stanice se
    jmenuje Bílý Potok pod Smrkem.
  bus: >-
    Do obce jezdí autobusová linka 650 (Hejnice – Bílý Potok – Smědava).
  auto: >-
    Obcí prochází silnice č. 290 z Frýdlantu na Smědavu a dále na Desnou.
overeniDoprava:
  source: >-
    Oficiální web obce Lázně Libverda, článek „DO JIZEREK VEŘEJNOU
    DOPRAVOU" (laznelibverda.cz/cs/aktuality-clanky/do-jizerek-verejnou-dopravou.html,
    načteno 4. 8. 2026): linka 145 „směrem na Bedřichov a Janov nad Nisou",
    linka 650 „na Hejnice u Liberce, Bílý Potok a dále na Smědavu". Pramen
    jmenuje LINKY, ne jízdní řády ani zastávky — profil proto netvrdí, kdy
    a odkud spoje jedou. Je to web sousední obce, ne dopravce; do prvního
    ověření u dopravce zůstává verified:false.

    Vlak a silnice z oficiálního webu obce Bílý Potok (bily-potok.cz,
    načteno 4. 8. 2026): „V obci končí regionální železniční trať 038
    z Raspenavy a Hejnic a nachází se zde železniční stanice Bílý Potok
    pod Smrkem.", „Obcí prochází silnice 290 z Frýdlantu na Smědavu a dále
    do obce Desná." O PARKOVÁNÍ tentýž web mlčí: v menu položku „Parkování"
    má, ale bez obsahu — proto se o něm nepíše nic.
  verified: false
  checked: '2026-08-04'

interniPoznamky: 'Založeno 30. 7. 2026 na zadání Michala („vyhledej lanovky a střediska a dotáhni
  pohoří Jizerské hory na stejnou úroveň jako mají teď Krkonoše"). Důvod zařazení: katalog výchozích
  bodů vede Bílý Potok jako nejbližší obec/uzel pro Bártlova bouda, Horská chata Smědava. SOUŘADNICE
  ZÁMĚRNĚ CHYBÍ: krkonošská střediska je mají z bodu obce v katalogu výchozích bodů DATA-06, a
  ten pro Jizerské hory ještě neběžel (Overpass ze sandboxu nedosáhneme). Nevymýšlejí se — doplní
  je běh DATA-06 --oblast jizerske-hory, a teprve pak se vykreslí mapa zasazení a dohledá fotka
  střediska (DATA-33). Doplnit z doložených zdrojů také výšku obce (ČÚZK), perex a dopravu.'
