# Ruční próza; katalogové řádky tu zatím nejsou (jizerská střediska
# čekají na katalog výchozích bodů DATA-06). Ceny se nepíšou.
doprava:
  bus: >-
    Do obce jezdí autobusová linka 145 (Bedřichov – Janov nad Nisou).
overeniDoprava:
  source: >-
    Oficiální web obce Lázně Libverda, článek „DO JIZEREK VEŘEJNOU
    DOPRAVOU" (laznelibverda.cz/cs/aktuality-clanky/do-jizerek-verejnou-dopravou.html,
    načteno 4. 8. 2026): linka 145 „směrem na Bedřichov a Janov nad Nisou",
    linka 650 „na Hejnice u Liberce, Bílý Potok a dále na Smědavu". Pramen
    jmenuje LINKY, ne jízdní řády ani zastávky — profil proto netvrdí, kdy
    a odkud spoje jedou. Je to web sousední obce, ne dopravce; do prvního
    ověření u dopravce zůstává verified:false.
  verified: false
  checked: '2026-08-04'

interniPoznamky: 'Založeno 30. 7. 2026 na zadání Michala („vyhledej lanovky a střediska a dotáhni
  pohoří Jizerské hory na stejnou úroveň jako mají teď Krkonoše"). Důvod zařazení: katalog výchozích
  bodů vede Janov nad Nisou jako nejbližší obec/uzel pro Královka. SOUŘADNICE ZÁMĚRNĚ CHYBÍ: krkonošská
  střediska je mají z bodu obce v katalogu výchozích bodů DATA-06, a ten pro Jizerské hory ještě
  neběžel (Overpass ze sandboxu nedosáhneme). Nevymýšlejí se — doplní je běh DATA-06 --oblast
  jizerske-hory, a teprve pak se vykreslí mapa zasazení a dohledá fotka střediska (DATA-33). Doplnit
  z doložených zdrojů také výšku obce (ČÚZK), perex a dopravu. Doprava 2. 8. 2026 NEDOLOŽENA: na oficiálním webu obce (janov-n-n.cz) se nepodařilo najít nic strukturního o parkování. Parkování 4. 8. 2026 (blok 5) NEDOLOŽENO potřetí. Oficiální web obce (janov-n-n.cz) má sekci Turistika, ale o parkování v ní stojí jediná věta, a ta se týká běžeckého lyžování („parkoviště u kapličky" v Hraběticích jako nástup na Jizerskou magistrálu) — celoroční pravidla ani seznam ploch web nenese. Vyhledávání nabídlo janovskaops.net s parkovištěm Kaplička Hrabětice, to je ale provozovatelský web, ne obec; nepřebírám. Řádek Autobusem (linka 145) doložený je.'
