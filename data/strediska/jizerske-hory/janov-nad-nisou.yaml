# Janov nad Nisou — středisko / východiště do Jizerských hor.
nazev: Janov nad Nisou
slug: janov-nad-nisou
zeme: cz
oblast: jizerske-hory

# Perex jen z doložené formulace pramene.
perex: >-
  Obec při Bílé Nise, 4,5 kilometru severně od Jablonce nad Nisou,
  rozložená ve výškách od 520 do 859 metrů.
overeniPerex:
  source: >-
    Turistický portál Libereckého kraje
    liberecky-kraj.cz/dr-cs/2330-janov-nad-nisou.html (načteno 4. 8. 2026):
    „Janov nad Nisou leží 4,5 km severně od Jablonce nad Nisou. Rozkládá se
    při Bílé Nise, ve značném výškovém převýšení od 520 m do 859 m." Rozpětí
    se do `vyskaObce` nezapisuje — jedno číslo dodá DATA-35, až budou
    souřadnice z běhu DATA-06 pro Jizerské hory.
  verified: false
  checked: '2026-08-04'

