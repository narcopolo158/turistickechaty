    Holubyho chaty). Slávnosti bratstva Čechov a Slovákov „obvykle
    poslednú júlovo-augustovú nedeľu": planetslovakia.sk (tamtéž).
    Slovenská strana: Biele Karpaty. Popis je redakční shrnutí, ne
