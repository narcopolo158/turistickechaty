interniPoznamky: >-
  Založeno 10. 8. 2026 současně s povýšením prvního profilu
  (holubyho-chata). TYP pohori — na rozdíl od ostatních oblastí vlny
  DATA-41 (Chřiby, Hostýnské vrchy…) jsou Bílé Karpaty nesporné
  hraniční pohoří s hřebenem a nejvyšší horou; přeshraniční vcelku
  (vzor krusne-hory, luzicke-hory — rozhodnutí Michala 20. 7. 2026).
  Vyhledávací okno pro DATA-01 zatím NENÍ — kandidáti vznikají ruční
  rešerší; k prověření: Chata Lopeník (česká strana), objekty na
  Veľkém Lopeníku, Mikulčin vrch (chatová osada), slovenská strana
  hřebene. Nejvyšší hora leží na hranici — při psaní profilů hlídat,
  že vysílač i chata stojí na SLOVENSKÉ straně (obec Lubina).
