charakteristika: >-
  Travnaté hřebeny a květnaté louky na moravsko-slovenském pomezí —
  hraniční pásmo Karpat mezi Slováckem a Považím, kde se po hřebeni
  chodí z Česka na Slovensko a zpátky, aniž si toho člověk všimne.
  Nejvyšší je Veľká Javorina s vysílačem a Holubyho chatou kousek pod
  vrcholem; na její louce se každý rok potkávají Češi a Slováci na
  slavnostech bratrství.
