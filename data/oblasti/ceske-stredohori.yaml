interniPoznamky: 'Založeno publikačně 10. 8. 2026 s prvním profilem (Chata Lovoš) — do té
  doby existovala jen kandidátská složka z téhož dne. ÚROVEŇ turisticka-oblast (vzor
  cesky-raj). K PŘESUNU SEM: kandidáti chata-milesovka a milesovka (rozhledna) ze složky
  krusne-hory — přinesla je krušnohorská okna, příslušnost posoudila redakce už 9. 8.
