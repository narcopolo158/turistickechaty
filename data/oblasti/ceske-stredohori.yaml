charakteristika: 'Kraj sopečných kuželů nad Labem — Milešovka, Lovoš, Sedlo. Není to
  souvislé pohoří s hřebenovkou, ale krajina osamělých vrcholů, na které se chodí za
  kruhovými rozhledy; chaty tu stojí na kopcích, ne v sedlech.'
