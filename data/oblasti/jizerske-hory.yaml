# Oblast Jizerské hory — druhá oblast průvodce (rozhodnutí Michala 28. 7. 2026,
# po uzavření krkonošského pilotu). Vedena stejným principem jako Krkonoše:
# PŘESHRANIČNÍ POHOŘÍ VCELKU — česká strana i polské Góry Izerskie.
# Poctivost: superlativy jen s dokladem; odvozená čísla (počty chat, žebříčky)
# se sem NIKDY nepíšou — počítají se při buildu z profilů.
nazev: Jizerské hory
slug: jizerske-hory
typ: pohori
zeme: cz

charakteristika: >-
  Pohoří na severu Čech, které pokračuje za hranicí jako Góry Izerskie —
  průvodce ho proto vede vcelku, z obou stran. Proti sousedním Krkonoším
  jsou Jizerky nižší a plošší: místo ostrého hřebene rašeliniště, bučiny
  a osamělé kamenné vrcholy nad plání.
overeniCharakteristika:
  source: >-
    Poloha a přeshraniční rozsah: OpenStreetMap (ODbL) a titulky výsledků
    WebSearch 2026-07-28 (jizerskehory.cz, kgp.info.pl „Góry Izerskie");
    obsah stránek neotevřen — sandbox. Popis charakteru je redakční shrnutí
    fondu tohoto průvodce, ne převzaté tvrzení; ověřit v terénu (DATA-04).
  verified: false
  checked: '2026-07-28'

# Hero snímek z mediabanky CzechTourism (poslal Michal 30. 7. 2026 i s licenčním
# souborem). Kredit má PŘEDEPSANÉ znění — proto licence `mediabanka-czt`, u které
# web skládá popisku podle podmínek, ne po našem. Co je na snímku, se tvrdí jen
# v rozsahu, jak ho pojmenovala sama mediabanka („Paličník, Jizerské hory");
# `anotace` se nepřidává, protože polohu konkrétního objektu ve snímku
# neověřoval člověk.
heroFoto:
  soubor: /foto/pohori/jizerske-hory-hero-palicnik-marek-saroch.jpg
  nahled: /foto/pohori/jizerske-hory-hero-palicnik-marek-saroch-nahled.jpg
  alt: >-
    Zasněžený skalní vrchol Paličník v Jizerských horách nad zamrzlými
    smrky, v ranním světle
  popisMista: Paličník, Jizerské hory
  autor: Marek Šaroch
  licence: mediabanka-czt
  zdrojUrl: https://media.visitczechia.com
  prevzatoDne: '2026-07-30'

# POZOR na dvě různá tvrzení, obě doložená a obě pravdivá v jiném rozsahu:
# nejvyšší bod CELÉHO pohoří (vč. polské strany) je Wysoka Kopa 1126 m,
# nejvyšší bod ČESKÉ strany je Smrk 1124 m. Průvodce vede pohoří vcelku,
# proto se jako „nejvyšší hora" uvádí Wysoka Kopa a Smrk je v poznámce.
nejvyssiHora:
  nazev: Wysoka Kopa
  vyska: 1126
  source: >-
    korona-gor-polski.pl a kgp.info.pl („Góry Izerskie – Wysoka Kopa –
    1126 m n.p.m.") — titulky WebSearch 2026-07-28, obsah neotevřen;
    nejvyšší hora české strany je Smrk 1124 m (kudyznudy.cz „Vrchol Smrk –
    nejvyšší hora Jizerských hor", jizerky.eu „Smrk – 1124 m n.m.").
    Ověření očima/ČÚZK: DATA-04.

# Top cíle doplněny 30. 7. 2026 z DOLOŽENÉHO výškopisu a OSM (pipeline
# DATA-28 → data/vrcholy/jizerske-hory.json, stav dat 12. 6. 2026). Bere se
# jen to, co pramen opravdu nese: jméno a kóta. Věta u cíle je redakční popis
# polohy, ne převzaté tvrzení — proto u ní stojí, odkud je poloha.
# Vazba `nejblizChataSlug` zůstává PRÁZDNÁ, dokud oblast nemá zveřejněné
# profily: odkaz na kandidáta by vedl na stránku, která neexistuje.
topCile:
  - nazev: Smrk
    veta: >-
      Nejvyšší hora české strany Jizerských hor; na vrcholu stojí rozhledna
      a od ní vede hřebenová cesta k polské hranici.
    source: >-
      Kóta 1 124 m a poloha (50,8891 / 15,2731) z OpenStreetMap
      (natural=peak se jménem a výškou, ODbL), vytaženo pipeline DATA-28 do
      data/vrcholy/jizerske-hory.json — stav OSM dat 2026-06-12. Rozhledna
      na vrcholu je redakční poznámka k poloze, ne údaj z pramene; ověřit
      v terénu (DATA-04).
  - nazev: Jizera
    veta: >-
      Skalnatý dvojvrchol nad rašeliništi uprostřed hor, přístupný jen
      z české strany.
    source: >-
      Kóta 1 122 m a poloha (50,8340 / 15,2595) z OpenStreetMap přes
      DATA-28 (data/vrcholy/jizerske-hory.json, stav 2026-06-12).
  - nazev: Stóg Izerski
    veta: >-
      Polský vrchol nad Świeradowem-Zdrojem, kam vede jediná kabinová
      lanovka oblasti.
    source: >-
      Kóta 1 108 m a poloha (50,8910 / 15,3038) z OpenStreetMap přes
      DATA-28; lanovka z přehledu drah oblasti
      (data/lanovky/jizerske-hory.json, stav OSM dat 2026-06-12).
  - nazev: Smrek
    veta: >-
      Polský soused Smrku — dva vrcholy téhož jména po obou stranách
      hranice, jen o metr různě vysoké.
    source: >-
      Kóta 1 123 m a poloha (50,8897 / 15,2797) z OpenStreetMap přes
      DATA-28 (stav 2026-06-12); rozdíl proti českému Smrku (1 124 m) je
      rozdíl obou kót v témž pramenu, ne tvrzení o měření.

interniPoznamky: >-
  Založeno 28. 7. 2026 jako druhá oblast. Vyhledávací okno pro DATA-01/DATA-28
  je v scripts/oblasti.ts (jizerske-hory) a na východě se vědomě mírně překrývá
  s krkonošským — Jizerka a Harrachov leží na pomezí a duplicity vyřeší
  kandidátní triáž, ne ořez okna. V repu už leží tři kandidáti z krkonošských
  běhů (Chatka Górzystów, Stacja Turystyczna Orle, Pešákovna = osada Jizerka)
  a z DATA-22 čeká na posouzení informační středisko na Mariánskohorských
  boudách (otevřeno 12. 6. 2026, provozuje STŘEVLIK; drobné občerstvení —
  kvalifikovalo by rozšířeným klíčem DATA-23). Ještěd leží mimo pohoří
  (Ještědsko-kozákovský hřbet) — a 30. 7. 2026 padlo rozhodnutí Michala
  „bereme i ještědský hřbet", takže je od té doby vlastní oblastí
  (data/oblasti/jestedsky-hrbet.yaml), ne položkou Jizerek.
