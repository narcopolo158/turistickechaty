# Oblast Západné Tatry — desátá oblast průvodce a PRVNÍ VYSOKOHORSKÁ.
#
# POKYN MICHALA 8. 8. 2026: „kandidaty budoucich oblasti nech a rovnou je
# zaloz." Z beskydského exportu DATA-01 přišla třináctka kandidátů z okolí
# Zuberce, Oravského Bieleho Potoka a Oravic — tedy ze severního podhůří
# Roháčů.
#
# ČÍM JE TAHLE OBLAST JINÁ NEŽ VŠECHNY DOSAVADNÍ: hlavní hřeben Západních
# Tater má podle pramene 31 dvoutisícovek. Dosud průvodce popisoval
# středohory, kde je nejvyšší bod 1725 m (Babia Góra) a kde se dá skoro
# všude vyjít a sejít týž den. Tady se poprvé objeví data, která jsme
# nepotřebovali: sezónní uzávěry turistických cest, horská služba,
# vysokohorské útulny, přechody sedel. Datový model to unese, ale profily
# budou muset být opatrnější — u tatranské chaty je „otevřeno" jiná
# informace než u bavorského hostince.
#
# Poctivost: superlativy jen s dokladem; odvozená čísla se sem nepíšou.
nazev: Západné Tatry
slug: zapadne-tatry
typ: pohori
zeme: sk

sklonovani:
  druhy: Západních Tater
  sesty: Západních Tatrách

charakteristika: >-
  Západní křídlo Tater od Sivého vrchu po Červené vrchy, na severu s polskými
  Tatry Zachodnie a dolinami Chochołowskou a Kościeliskou. Hlavní hřeben nese
  podle pramenů jedenatřicet dvoutisícovek a nejvyšší je Bystrá s 2248 metry —
  proti Vysokým Tatrám je ale reliéf mírnější a hřebeny jsou travnaté hole,
  ne skalní jehly. Nejznámější kout jsou Roháče se svými plesy, kam se chodí
  ze Zverovky nad Zubercem. Chaty tu mají stejnou jizvu jako v Malé Fatře:
  Ťatliakovu chatu i Zverovku vypálili v prosinci 1944 němečtí vojáci.
overeniCharakteristika:
  source: >-
    Nejvyšší vrchol a hranice: anglická Wikipedie, Western Tatras (čteno
    8. 8. 2026) — „its highest peak is Bystrá at 2,248 meters" a „The
    mountains border the High Tatras in the east, Podtatranská kotlina in
    the south, Choč Mountains in the west and Rów Podtatrzański in the
    north." Podcelky Roháče (nejvyšší Baníkov 2178 m) a Sivý vrch (1805 m)
    vede táž stránka jako jednotky Západních Tater, ne samostatná pohoří.
    Jedenatřicet dvoutisícovek na hřebeni dlouhém 37 km: táž Wikipedie,
    ale rešerše to podala jako výtah, ne doslovný citát — proto je v próze
    „podle pramenů", ne jako holé číslo. Travnaté hole a mírnější reliéf:
    horydoly.cz (čteno 8. 8. 2026) — Liptovské hole jako travnatá oblast
    s nejvyšší Bystrou, Roháče jako „ostrý a výrazný skalnatý hřeben",
    Sivý vrch jako „západní vápencový masiv"; výtah, ne doslovný citát.
    Vypálení chat v prosinci 1944: viz interniPoznamky.
  verified: false
  checked: '2026-08-08'

nejvyssiHora:
  nazev: Bystrá
  vyska: 2248
  source: >-
    Anglická Wikipedie, stránka vrcholu (čteno 8. 8. 2026): „Elevation:
    2,248 m (7,375 ft)", souřadnice 49.18861 / 19.84278. Potvrzeno
    PeakVisorem téhož dne („Bystrá (2,248 m) – Tatra Mountains,
    Slovakia", 49.188372 / 19.842583) — dva prameny, shodná výška, rozdíl
    jen v zaokrouhlení souřadnic. POZOR NA ZÁMĚNU: „Bystrá" se jmenují
    i obce a chaty v Nízkých Tatrách a v Osturni; rešerše 8. 8. 2026
    ověřila, že „Chata Bystrá" v Západních Tatrách neexistuje — nalezené
    objekty toho jména leží jinde na Slovensku.
