charakteristika: 'Pískovcové stěny, stolové hory a barokní krajina broumovského výběžku —
  Broumovské stěny s poutní Hvězdou, Adršpašsko-teplické skály a Ostaš. Není to pohoří
  a průvodce to nepředstírá; turistická tradice je tu ale stará jako jinde na horách:
  chatu na Hvězdě postavil broumovský klášter už v roce 1856.'
overeniCharakteristika:
  source: 'Povaha oblasti: CHKO Broumovsko zahrnuje Broumovské stěny, Adršpašsko-teplické
    skály a Ostaš (broumovsko.cz, region-adrspach.cz — čteno 10. 8. 2026 při rešerši Chaty
    Hvězda). Stavba chaty 1856 klášterem: Kudy z nudy (opat J. N. Rotter). Geomorfologicky
    jde o Broumovskou vrchovinu, turisticky o skalní oblasti — proto turistická oblast,
    ne pohoří. Popis je redakční shrnutí.'
  verified: false
  checked: '2026-08-10'
topCile: []
interniPoznamky: 'Založeno 10. 8. 2026 na pokyn Michala (Hvězda jmenována výslovně). ÚROVEŇ
  turisticka-oblast — vzor cesky-raj: skalní oblasti bez horského hřebene, kam se chodí za
  vyhlídkami a kde chaty stojí. Vyhledávací okno pro DATA-01 zatím NENÍ — první profil
  (Chata Hvězda) vznikl ruční rešerší; okno se doplní, až bude důvod oblast prohledat celou
  (Adršpach, Ostaš, Slavný…). Nejvyšší hora se záměrně neuvádí (vzor cesky-raj); nejvyšší
  bod Broumovských stěn je Božanovský Špičák (773 m), do turistické oblasti ale patří víc
  jednotek.'
