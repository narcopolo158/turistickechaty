interniPoznamky: >-
  Založeno 8. 8. 2026 na pokyn Michala („vse dalsi co najdes"). Konfigurace
  okna je v scripts/oblasti.ts (slug slovensky-raj, zeme SK, katalogový název
  „Slovenský ráj"), kotvy okna a jejich prameny v komentáři tamtéž.

  DALŠÍ KROK JE MICHALŮV KLIK: Actions → „DATA-01: OSM export chat (dle
  oblasti)" → Run workflow → oblast `slovensky-raj`.

  POZOR NA KATALOGOVÝ NÁZEV: katalog vede pohoří jako „Slovenský ráj"
  s DLOUHÝM Á, my oblast jako „Slovenský raj" (slovensky, krátce). V poli
  `katalogPohori` musí zůstat katalogová podoba, jinak se vypne dohledávka
  podle jmen. Je to týž případ jako „Velká Fatra" × „Veľká Fatra".

  NEJNETYPIČTĚJŠÍ OBLAST KORPUSU a přináší nový typ údaje do profilů.
  Dosud korpus znal dva režimy, u kterých „otevřeno" neznamená „dostupné":
  sezónní uzávěru tatranských hřebenových cest a vůdcovskou povinnost.
  Slovenský raj přidává třetí, a jiný: JEDNOSMĚRNÝ PROVOZ ROKLIN a VSTUPNÉ
  za použití technických zařízení. Profil chaty v roklině tedy musí umět
  říct nejen kdy má otevřeno, ale i kterým směrem se k ní jde.
  VSTUPNÉ — ROZPOR, nesrovnaný: slovenskyraj.eu uvádí s platností od
  1. 4. 2024 čtyři eura za Suchou Belou a tři za ostatní rokliny (děti
  a senioři o euro méně, do šesti let zdarma), kdežto npslovenskyraj.sk
  „dospelí: 1,50 EUR" za jednodenní lístek. Buď jde o dva různé poplatky,
  nebo je jeden z údajů starý. DO PROFILŮ SE CENY STEJNĚ NEPÍŠOU (konvence
  z 25. 7. 2026), ale existence poplatku ano — a ta je doložená oběma.

  SEZÓNNÍ UZÁVĚRY SE NEPODAŘILO DOLOŽIT OBECNĚ. Doložené je jen to, že
  ledolezectví je povolené 1. 12. – 15. 3. a že Dobšinská ľadová jaskyňa je
  přístupná 15. 5. – 30. 9. Stránka o uzavírkách chodníků na oficiálním webu
  parku je datovaná 7. 5. 2020, tedy šest let stará, a vede uzavřený Veľký
  Sokol a Biely potok po povodni z listopadu 2019 — jako údaj o dnešku
  bezcenné. Před prvním profilem se musí dohledat aktuální stav; dva zdroje,
  které by ho měly mít (slovenskyraj.eu/rokliny, slovenskyraj.kcorp.sk), byly
  ze sandboxu nedostupné.

  CO UŽ VÍME BEZ OVERPASSU — externí katalog drží v okně 6 objektů. Dobře
  doložená je jediná chata, zato nejdůležitější:
  CHATA KLÁŠTORISKO (744 m) — na místě stála turistická útulna, kterou podle
  popisky dobové fotografie postavil KARPATHENVEREIN („Útulňa Karpathenvereinu
  po dobudovaní prístreška v roku 1924"), a základní kámen vlastní chaty
  položil KLUB ČESKOSLOVENSKÝCH TURISTŮ 16. května 1926; chatu se podařilo
  dokončit roku 1929 (maget.sk). ROZPORY: rok první útulny 1922 (maget.sk)
  × 1923 (slovenskyraj.sk); a krasy-slovenska.sk v článku z roku 2010
  připomínají „80 rokov od chvíle, keď na Kláštorisku slávnostne otvorili
  turistickú chatu KČST", což ukazuje na otevření okolo roku 1930, ne 1929.
  Dnes je tu chatová osada, restaurace a stanice horské služby; bufet měl
  v roce 2026 sezónu 18. 4. – 30. 9.
  DVA SPOLKY NA JEDNOM MÍSTĚ jsou pro průvodce cenné: Karpathenverein
  a KČST tu stavěli po sobě, podobně jako Beskidenverein a Pohorská jednota
  Radhošť v Beskydech. Až se bude psát profil, tohle je jeho jádro.

  U OSTATNÍCH OBJEKTŮ NENÍ DOLOŽENO NIC POUŽITELNÉHO. Chata Píla, objekty na
  Čingově, Podlesok, Dedinky a Mlynky mají v pramenech jen komerční
  ubytovací inzeráty — žádný rok, stavebníka ani výšku. „Horský hotel Čingov"
  pod tím jménem rešerše nenašla vůbec (existují Hotel Čingov, Wellnesshotel
  Čingov a Parkhotel Čingov, tedy tři různé objekty). Při triáži se s tím
  musí počítat: tady bude povyšování stát na primárních pramenech, ne na
  přehledech.

  MOJE CHYBA V ZADÁNÍ REŠERŠE, počtvrté za den: ptal jsem se na „Čertovu
  hlavu" jako na jeden z nejvyšších vrcholů. Prameny (slovenskyraj.sk, trasy
  CY01 a CY03) ji vedou jako SEDLO mezi Novoveskou Hutou a Mlynkami, ne jako
  vrchol. Zapisuje se to sem, protože je to přesně ten typ domněnky, který se
  bez rešeršisty propíše do dat.

  NÁRODNÍ PARK: vyhlášen nařízením vlády SSR č. 23/1988 z 18. 1. 1988,
  přehlášen nařízením vlády SR č. 69/2016. Rozlohu oficiální stránka neuvádí
  a nepíše se sem. Návštěvní řád: vyhláška Okresního úřadu Košice č. 2/2018
  z 10. října 2018.

  HERO FOTKA CHYBÍ — doplní ji redakční výběr (FOTO-01) nebo mediabanka.
