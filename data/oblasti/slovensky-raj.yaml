# Oblast Slovenský raj — šestnáctá oblast průvodce (pokyn Michala 8. 8. 2026:
# „klidne dopln krusne hory, orlicke a vse dalsi co najdes").
#
# ROZSAH. Okno dotazu (scripts/oblasti.ts) kryje krasovou plošinu od Mlynek
# a Dediniek na jihu po Hrabušice a Prielom Hornádu na severu, od Ondrejiska
# nad Telgártom na západě po Spišskou Novou Ves na východě.
# OKNO JE ŘEZANÉ PODLE POHOŘÍ, NE PODLE NÁRODNÍHO PARKU — hranice parku sahá
# na jihozápad až k Prednej holi (1545 m), kterou prameny řadí k Nízkym
# Tatrám, a ty mají vlastní oblast.
# MURÁNSKA PLANINA SEM NEPATŘÍ: obě jsou SOUŘADNÉ podcelky Spišsko-gemerského
# krasu, ne celek a jeho část. Katalog ji vede zvlášť správně.
#
# Poctivost: superlativy jen s dokladem; odvozená čísla (počty chat,
# žebříčky) se sem NIKDY nepíšou — počítají se při buildu z profilů.
nazev: Slovenský raj
slug: slovensky-raj
typ: pohori
zeme: sk

sklonovani:
  druhy: Slovenského ráje
  sesty: Slovenském ráji

charakteristika: >-
  Krasová plošina rozřezaná roklinami, kterými se stoupá po žebřících,
  stupačkách a řetězech. Není to pohoří k přechodu po hřebeni: chodí se tu
  soutěskami vzhůru proti proudu potoka, a jen tím směrem — sestup roklinou
  je z bezpečnostních důvodů zakázaný. Uprostřed parku leží Kláštorisko
  s ruinami kartuziánského kláštera a jediným turistickým střediskem uvnitř
  chráněného území; na jihu je Dobšinská ľadová jaskyňa, zapsaná roku 2000
  na seznam světového dědictví UNESCO.
overeniCharakteristika:
  source: >-
    Jednosměrný provoz a technické pomůcky: npslovenskyraj.sk, stránka
    aktivit (čteno 8. 8. 2026) — „Prechod roklinami Slovenského raja
    z dôvodu bezpečnosti je na rozdiel od ostatných trás povolený v smere
    zdola nahor - proti prúdu potoka."; tamtéž „rebríky - drevené, kovové,
    kovové stúpačky, stupy", „kovovými mostíkmi", „reťazami". Kláštorisko
    jako jediné středisko: slovenskyraj.sk (čteno 8. 8. 2026) — je to jediné
    turistické středisko na území národního parku; POZOR NA VÝKLAD, pramen
    říká „jediné stredisko", ne „jediný objekt", a tak je to i v textu.
    Kartuziáni: maget.sk (čteno 8. 8. 2026) — území darováno roku 1299
    a klášter postaven „začiatkom 14. storočia". UNESCO: ssj.sk (čteno
    8. 8. 2026) — na 24. zasedání Výboru pro světové dědictví v Cairns
    v listopadu 2000 byla lokalita „Jaskyne Slovenského a Aggtelekského
    krasu" (zapsaná 1995 v Berlíně) rozšířena o Dobšinskou ľadovou jaskyňu.
  verified: false
  checked: '2026-08-08'

nejvyssiHora:
  nazev: Ondrejisko
  vyska: 1268
  source: >-
    ROZPOR, KTERÝ SE NEPODAŘILO SROVNAT, a je pro tuhle oblast typický:
    prameny neuvádějí tři různá čísla pro jeden vrchol, ale TŘI RŮZNÉ
    VRCHOLY. (1) najmiesta.sk (čteno 8. 8. 2026) vede Ondrejisko/Borovniak
    jako „najvyšší vrch v pohorí Slovenský raj" a rozlišuje rozhledový
    Borovniak 1268 m od zalesněného Ondrejiska 1270 m; leží „východne od
    obce Telgárt". (2) turistika.vetroplachmagazin.sk uvádí „Ondrejisko/
    Borovniak 1272m", ale týž článek nese autorovu opravu, že oficiálně
    nejvyšší je Predná hoľa 1545 m. (3) cezkopec.webnode.sk vede jako
    nejvyšší bod Veľkú Knolu (1266 m). Zapsáno 1268 m dle konvence
    z 27. 7. 2026 (při rozporu nižší číslo z těch, které se týkají téhož
    vrcholu; Veľká Knola je jiný kopec, ne nižší měření Ondrejiska).
    PREDNÁ HOĽA (1545 m) DO TÉHLE OBLASTI NEPATŘÍ, ač je nejvyšším bodem
    národního parku — a je to past, na kterou se dá naletět, protože oficiální
    stránka parku ji jako nejvyšší bod uvádí. Rešerše 8. 8. 2026 našla článek
    s titulkem „Predná hoľa - najvýchodnejší vrch Nízkych Tatier" (obsah
    nedostupný, 403), což ukazuje směr, ale nedokazuje ho. Rozdíl mezi
    „nejvyšší bod PARKU" a „nejvyšší vrchol POHOŘÍ" je tu 277 metrů a jiné
    pohoří.
  verified: false
  checked: '2026-08-08'

