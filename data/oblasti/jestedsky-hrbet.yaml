# Ještěd je nejvyšší bod nejen vlastního Ještědského hřbetu, ale celého
# Ještědsko-kozákovského hřbetu — a jeho jediná tisícovka.
nejvyssiHora:
  nazev: Ještěd
  vyska: 1012
  source: >-
    cumbres.cz (Ještědsko-kozákovský hřbet, čteno 2026-07-30): „Ještěd
    (1012 m)" — „mohutný suk" a „jediná tisícovka" pohoří; totéž číslo nese
    titulek mapotic.com („Ještědsko-kozákovský hřbet, Ještěd (1012)")
    i vydavatelův výpis známkových míst z 30. 7. 2026 („No. 40 Ještěd
    1012m"). Ověření ČÚZK: DATA-04.

# Top cíle doplněny 4. 8. 2026, když už oblast má pět publikovaných profilů
# a tři střediska. Každý cíl nese zdroj a vazbu na profil, který o něm
# opravdu je — cíl bez profilu se sem nepíše.
topCile:
  - nazev: Ještěd
    veta: >-
      Vrchol hřbetu s Hubáčkovým horským hotelem a vysílačem — rotačním
      hyperboloidem, který je od roku 2006 národní kulturní památkou.
      Poslední úsek nahoru se jde pěšky.
    nejblizChataSlug: horsky-hotel-jested
    source: >-
      Turistický portál Libereckého kraje
      liberecky-kraj.cz/dr-cs/15227-jestedsky-hrbet.html (načteno
      4. 8. 2026): „na jeho špici v nadmořské výšce 1012 m n. m. pevně sedí
      a rozmarům počasí vzdoruje horský hotel a televizní vysílač Ještěd";
      památková ochrana a autorství stavby dle profilu Hotelu Ještěd.
      „Pěšky" dle téhož portálu, Doprava na Ještěd — kabinová lanovka je
      dlouhodobě mimo provoz a sedačková končí 1,8 km pod vrcholem.
  - nazev: Rozhledna Rašovka
    veta: >-
      Vyhlídková věž na jihovýchodním rameni hřbetu nad Šimonovicemi,
      dostupná po značené trase z údolí.
    nejblizChataSlug: rasovka
    source: >-
      Turistický portál Libereckého kraje
      liberecky-kraj.cz/dr-cs/5875-rozhledna-rasovka.html (načteno
      4. 8. 2026) — rozhledna vedená pod obcí Šimonovice; přístupová trasa
      ze Šimonovic je v našem katalogu DATA-06.
  - nazev: Tetřeví sedlo
    veta: >-
      Sedlo pod vrcholem na hlavní hřebenové trase, s boudou a záchytným
      parkovištěm Výpřež.
    nejblizChataSlug: bouda-tetrevi-sedlo
    source: >-
      Turistický portál Libereckého kraje, Doprava na Ještěd
      liberecky-kraj.cz/dr-cs/30531-doprava-na-jested.html (načteno
      4. 8. 2026): parkoviště „Výpřež" u „Tetřeví sedlo", nepřetržitě;
      poloha na hřebeni a existence boudy dle našeho profilu
      bouda-tetrevi-sedlo a přístupových tras DATA-06.

interniPoznamky: >-
  Založeno 30. 7. 2026 na pokyn Michala („bereme i ještědský hřbet"), a to
  po nálezu z vydavatelova výpisu známkových míst: tři z pěti tehdejších
  jizerských položek ležely na Ještědském hřbetu, tedy mimo okno Jizerských
  hor (všechny s lng < 15,0; okno začíná na 15,05). Konkrétně jsou to
  známková místa č. 39 Pláně pod Ještědem (prodejní místo „Turistická chata
  Pláně", chataplane.cz), č. 40 Ještěd 1012m („Horský hotel Ještěd",
  jested.cz) a č. 1296 Rozhledna Rašovka. Žádný z nich není zatím kandidát —
  export DATA-01 pro tuhle oblast ještě neběžel a souřadnice ani tagy z OSM
  proto nemáme. Vyhledávací okno je v scripts/oblasti.ts (jestedsky-hrbet)
  a vědomě zahrnuje okraj Liberce: hřbet se zvedá přímo nad městem a bez
  městského okraje by se okno minulo dolní stanici lanovky i parkoviště,
  odkud se na Ještěd chodí. Duplicity a městské hospody vyřeší kandidátní
  triáž, ne ořez okna.

  VEDLEJŠÍ NÁLEZ z běhu DATA-32 (4. 8. 2026): mezi lanovkami okna je
  sedačková dráha „Obří sud" (dolní stanice 50,7008 / 15,0765), tedy Obří sud
  u Javorníku na východní straně nad Libercem — ne stejnojmenný Obří sud
  v Lázních Libverda, který vedeme u Jizerských hor. Jsou to dva různé
  objekty téhož jména a dva různé lyžařské areály; až přijde kandidátní triáž
  oblasti, hlídat, aby se nesloučily (vzor DATA-17 o jmenovcích). Jestli
  javornický Obří sud patří do průvodce podle klíče zařazení, se tímhle
  neřeší — leží pod hřbetem, ne na něm.
