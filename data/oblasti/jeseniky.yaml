interniPoznamky: >-
  Založeno 8. 8. 2026 na pověření Michala („můžeš se pustit do beskyd
  a jeseníku") v rámci čtyřhodinového samostatného bloku. Konfigurace okna
  je v scripts/oblasti.ts (slug jeseniky, zeme CZ+PL, sedm katalogových
  názvů pohoří), kotvy okna a jejich prameny v komentáři tamtéž.

  DALŠÍ KROK JE MICHALŮV KLIK: Actions → „DATA-01: OSM export chat (dle
  oblasti)" → Run workflow → oblast `jeseniky`. Ze sandboxu na Overpass
  nedosáhneme (ověřeno znovu 8. 8. 2026 — HTTP 000 přes proxy).

  CO UŽ VÍME BEZ OVERPASSU — externí katalog drží v okně 22 objektů, všechny
  s doloženým stravováním. Hrubý Jeseník 10: Hotel Praděd 1491 m, Kurzovní
  chata 1335 m, Chata Jiřího na Šeráku 1325 m, Chata Barborka 1320 m,
  Švýcárna 1304 m, Ovčárna 1300 m, Horský hotel Figura 1300 m, Chata
  Sabinka 1300 m, Červenohorské sedlo 1013 m, Chata Ramzová 760 m.
  Zlatohorská vrchovina 2 (Chata Rejvíz, Horská chata Férovka), Hraběšická
  hornatina 1 (Motorest Skřítek), Rychlebské hory 3 (Paprsek 1022 m,
  Smrčník, Kaste), Králický Sněžník 4 (Slaměnka 1116 m, Návrší, Kladské
  sedlo, Horská chata Sněžník), Masyw Śnieżnika 2 (Schronisko Na Śnieżniku
  1218 m, Na Iglicznej), Góry Opawskie 1 (Pod Kopą Biskupią).
  POZORUHODNÉ: devět z deseti objektů Hrubého Jeseníku stojí nad 1000 m
  a šest z nich nad 1300 m — je to výškově nejvýš položená skupina celého
  katalogu mimo Tatry. Ta hustota chat v pradědské oblasti (Praděd,
  Kurzovní, Barborka, Švýcárna, Ovčárna, Figura, Sabinka do sebe vidí)
  bude chtít při triáži pozornost: hrozí, že některé jsou části jednoho
  areálu — vzor Kleti a Svatoboru, kde se dva objekty sloučily do jednoho
  profilu.

  ROZHODNUTÍ O ROZSAHU, KTERÉ ČEKÁ NA MICHALA: polské GÓRY BYSTRZYCKIE
  jsou VĚDOMĚ MIMO OKNO. Katalog v nich drží dvě schroniska — Schronisko
  Jagodna (kotva 50.252 / 16.565) a Schronisko Pod Muflonem. Leží západně
  od Śnieżniku ve Středních Sudetech a do jesenické oblasti je nepřiřazuje
  žádný pramen, který jsme našli. Zapisuje se to sem, ne jen do komentáře
  hlavičky, aby to nebyl tichý miss a aby to viděl i stroj (drží to test
  tests/int/oblasti-beskydy-jeseniky.int.spec.ts). Vzor rakouské strany
  Šumavy, která je taky mimo okno a s poznámkou. Nízký Jeseník na východě
  do oblasti nepatří vůbec — jiný celek a hory v našem smyslu to nejsou.

  CHYBA V MÉM VLASTNÍM ZADÁNÍ REŠERŠE, chycená rešeršistou — stojí za zápis.
  Zadal jsem, že „Králický Sněžník 1424 m a Śnieżnik 1425 m jsou DVA různé
  vrcholy" a nechal je rozlišit. Prameny (PeakVisor, sneznik.cz,
  ejeseniky.com) shodně říkají, že je to JEDEN vrchol na česko-polské
  hranici s českým a polským jménem, jehož výšku prameny uvádějí trojmo
  (1423 / 1424 / 1425 m). V katalogu jsou „Králický Sněžník" a „Masyw
  Śnieżnika" dvě jednotky, protože je to masiv ze dvou stran hranice, ne
  dva kopce. Je to týž druh omylu jako moje přepsaná délka u Menauerů
  o hodinu dřív: chyba v zadání se propíše do dat, když ji nikdo nechytí —
  a chytit ji dokáže právě požadavek na pramen u každého údaje.

  CHKO JESENÍKY vyhlášena 19. 6. 1969 (AOPK i časopis Ochrana přírody,
  čteno 8. 8. 2026); rozlohu dva prameny téhož správce uvádějí různě —
  744 km² (AOPK) a 740 km² (Ochrana přírody). Śnieżnicki Park Krajobrazowy
  na polské straně vyhlášen 1981 na 28 800 ha (dzpk.pl, čteno 8. 8. 2026).

  DÉLKA JESENICKÉ HŘEBENOVKY SE NEPODAŘILA DOLOŽIT: turistika.cz vede jeden
  úsek do sedla Skřítek jako 33,3 km, což není délka celé magistrály.
  Nezapisuje se.

  HERO FOTKA CHYBÍ — doplní ji redakční výběr (FOTO-01) nebo mediabanka.
