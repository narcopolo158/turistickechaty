typ: pohori
zeme: cz

sklonovani:
  druhy: Jeseníků
  sesty: Jeseníkách

charakteristika: >-
  Druhé nejvyšší pohoří České vysočiny a jediné vedle Krkonoš, kde se
  hřebeny zvedají nad hranici lesa. Nad zhruba třinácti sty metry přechází
  les pozvolna v horské bezlesí, které se drží na Pradědu, Keprníku
  a Šeráku — a právě do těch výšek si sem turistické spolky postavily řadu
  chat, které stojí dodnes. Turistika tu má nezvykle starou tradici:
  Moravskoslezský sudetský horský spolek vydal mapu Jeseníků už roku 1881
  a postavil desítky cest, chat a rozhleden.
overeniCharakteristika:
  source: >-
    Členění a výška: ejeseniky.com (Geomorfologie, čteno 8. 8. 2026) vede
    Hrubý Jeseník jako „druhé nejvyšší pohoří v České vysočině" a jako další
    celky oblasti Králický Sněžník („stejnojmenný nejvyšší vrchol dosahuje
    výšky 1 423 m.n.m.") a Rychlebské hory („třetím velkým, byť již
    podstatně nižším pohořím Jesenické oblasti"). Horní hranice lesa: AOPK,
    charakteristika CHKO Jeseníky (čteno 8. 8. 2026) — „Přechod k alpínskému
    bezlesí zpravidla probíhá pozvolna přes tzv. difúzní (parkovou) horní
    hranici lesa v polohách mezi 1 300–1 400 m n. m." a „Nejcennější místa
    v CHKO Jeseníky jsou chráněna v národních přírodních rezervacích Praděd,
    Rejvíz, Šerák-Keprník a Rašeliniště Skřítek". Spolek: Radio Prague
    International (čteno 8. 8. 2026) — „Turistickou mapu Johana Rippera
    vydal Moravskoslezský sudetský horský spolek" a spolek „se zasloužil
    i o vybudování desítek chodníků, chat a rozhleden". SROVNÁNÍ
    S KRKONOŠEMI („jediné vedle Krkonoš, kde…") je NAŠE, plyne z vlastního
    korpusu, ne z pramene. POJEM „ARKTOALPÍNSKÁ TUNDRA" ZDE VĚDOMĚ NENÍ:
    rešerše 8. 8. 2026 ho v žádném prameni o Jeseníkách nenašla, doložený je
    jen pro Krkonoše (krnap.cz, ziva.avcr.cz) — píšeme proto „horské
    bezlesí", jak to má AOPK.
  verified: false
  checked: '2026-08-08'

