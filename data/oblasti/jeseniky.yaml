# Oblast Jeseníky — šestá oblast průvodce (pověření Michala 8. 8. 2026:
# „můžeš se pustit do beskyd a jeseníku").
#
# ROZSAH. Okno dotazu (scripts/oblasti.ts) kryje jesenickou oblast vcelku:
# Hrubý Jeseník, Zlatohorskou vrchovinu, Hraběšickou hornatinu, Rychlebské
# hory a Králický Sněžník na české straně, na polské Góry Opawskie a Masyw
# Śnieżnika — tedy přeshraniční pokračování týchž jednotek (princip „pohoří
# vcelku", rozhodnutí Michala 20. 7. 2026).
# VĚDOMĚ MIMO OKNO jsou polské GÓRY BYSTRZYCKIE, kde katalog drží dvě
# schroniska (Jagodna, Pod Muflonem). Leží západně od Śnieżniku ve Středních
# Sudetech a do jesenické oblasti je nepřiřazuje žádný pramen, který jsme
# našli — je to rozhodnutí o rozsahu → Michal. Zapisuje se to výslovně, aby
# to nebyl tichý miss (vzor rakouské strany Šumavy).
# NÍZKÝ JESENÍK na východě do oblasti nepatří vůbec: je to jiný celek
# a hory v našem smyslu to nejsou.
#
# Poctivost: superlativy jen s dokladem; odvozená čísla (počty chat,
# žebříčky) se sem NIKDY nepíšou — počítají se při buildu z profilů.
nazev: Jeseníky
