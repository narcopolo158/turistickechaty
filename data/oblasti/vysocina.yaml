sklonovani:
  druhy: Vysočiny
  sesty: Vysočině

charakteristika: 'Zvlněná krajina Českomoravské vrchoviny — Čeřínek a Křemešník na
  Jihlavsku, Devět skal a rybniční hřebeny Žďárských vrchů. Není to pohoří a průvodce
  to nepředstírá; turistické chaty tu ale stojí na týchž místech jako v horách: na
  zalesněných vrcholech, kam se chodí za rozhledem a kde je kde se najíst.'
overeniCharakteristika:
  source: 'Rozsah oblasti: rozhodnutí Michala 10. 8. 2026 („vysocina jedna oblast") —
    Českomoravská vrchovina se turisticky bere vcelku, i když geomorfologicky jde
    o víc celků (Křemešnická vrchovina, Žďárské vrchy, Železné hory…). Vlastní
    kandidát v repu: Turistická chata Čeřínek (signály existence 10. 8.). Popis je
    redakční shrnutí, ne převzaté tvrzení.'
  verified: false
  checked: '2026-08-10'
topCile: []
interniPoznamky: 'Založeno 10. 8. 2026 — rozhodnutí Michala „vysocina jedna oblast"
  ukončilo otázku z DATA-41 (Čeřínek je v Křemešnické vrchovině, Devět skal ve
  Žďárských vrších; slévají se do jedné turistické oblasti). ÚROVEŇ turisticka-oblast,
  vzor cesky-raj. Vyhledávací okno pro DATA-01 zatím NENÍ — oblast je rozlehlá
  a řídce osazená, kandidáti vznikají ruční rešerší (Čeřínek; k prověření Křemešník,
  Devět skal). Nejvyšší hora se záměrně neuvádí — Javořice (837 m) by potřebovala
  vlastní doklad a pro turistickou oblast to není nosný údaj.'
