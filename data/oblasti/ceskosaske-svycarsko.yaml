charakteristika: 'Labské pískovce na obou stranách hranice — soutěsky Kamenice, Pravčická
  brána, stolové hory a skalní města Saského Švýcarska s Bielatalem. Není to pohoří
  a průvodce to nepředstírá; turistická infrastruktura je tu ale hustá jako v horách
  a chaty na Tokáni či baudy v Bielatalu k ní patří odjakživa.'
overeniCharakteristika:
  source: 'Povaha oblasti: národní parky České Švýcarsko a Sächsische Schweiz sdílejí
    jedno pískovcové území (Labské pískovce / Elbsandsteingebirge). Vlastní kandidáti
    v repu: chaty na Tokáni (přišly lužickým oknem), Daxensteinbaude a Räuberhütte
    v Bielatalu (přišly krušnohorským oknem) — přesahy zdokumentované 10. 8. 2026.
    Popis je redakční shrnutí, ne převzaté tvrzení.'
  verified: false
  checked: '2026-08-10'
topCile: []
interniPoznamky: 'Založeno 10. 8. 2026 na rozhodnutí Michala („ceskosaske svycarsko zaloz")
  — oblast vyřešila dva zdokumentované přesahy oken: chaty na Tokáni drželo lužické okno
  a baudy v Bielatalu krušnohorské (nález ze čtecího průchodu téhož dne). Kandidáti
  přesunuti SEM (vzor přesunu beskydy → javorniky z 8. 8.: soubory se stěhují, do
  _vyrazeno se nezapisují — umlčelo by je to i v nové oblasti; pojistka DATA-36 je při
  dalších bězích starých oken podrží tady). ÚROVEŇ turisticka-oblast — vzor broumovsko.
  Vyhledávací okno pro DATA-01 zatím NENÍ; doplní se, až bude důvod oblast prohledat
  celou (Mezní Louka, Sokolí hnízdo, saské Bergwirtschaften). Nejvyšší hora se záměrně
  neuvádí (vzor cesky-raj/broumovsko) — Děčínský Sněžník i Großer Winterberg by
  potřebovaly vlastní doklad a u turistické oblasti to není nosný údaj.'
