# Oblast Bieszczady — osmnáctá oblast průvodce (pokyn Michala 8. 8. 2026:
# „klidne dopln krusne hory, orlicke a vse dalsi co najdes").
#
# ROZSAH. Okno dotazu (scripts/oblasti.ts) kryje Bieszczady Zachodnie na
# polské straně a jejich slovenské pokračování, které Slováci vedou jako
# Bukovské vrchy. Je to nejvýchodnější oblast korpusu.
# VĚDOMĚ MIMO OKNO: Solina (přehrada v podhůří), Komańcza (prameny ji řadí
# do Beskidu Niského, ač tudy vede Główny Szlak Beskidzki — okno se řídí
# pohořím, ne trasou) a ukrajinská část za Užockým průsmykem.
#
# Poctivost: superlativy jen s dokladem; odvozená čísla (počty chat,
# žebříčky) se sem NIKDY nepíšou — počítají se při buildu z profilů.
nazev: Bieszczady
slug: bieszczady
typ: pohori
zeme: pl

# Jméno se drží v polské podobě. Čeština tu ustálený vlastní tvar nemá
# a „Bieščady" se nepíše — stejné pravidlo jako u Západných Tater.
sklonovani:
  druhy: Bieszczad
  sesty: Bieszczadech

charakteristika: >-
  Nejvýchodnější kout polských Karpat, kde nad hranicí lesa leží połoniny —
  široké bezlesé hřebeny, po kterých se jde hodiny bez stromu. Není to
  divočina odjakživa: pastva tu horní hranici lesa snížila a po vysídlení
  v letech 1944 až 1947 zůstaly z desítek vesnic jen hřbitovy, kříže
  a podezdívky. Tady taky končí Główny Szlak Beskidzki, dálková trasa přes
  celé polské Karpaty. A platí tu režim, jaký jinde v průvodci není:
  do hor se platí vstupné, chodí se jen mezi východem a západem slunce
  a nocovat se smí na třech vyhrazených místech.
overeniCharakteristika:
  source: >-
    Vymezení: polská Wikipedie, Bieszczady (čteno 8. 8. 2026) — „Pasma
    Bieszczadów znajdują się między Przełęczą Łupkowską (640 m n.p.m.)
    a Przełęczą Wyszkowską (933 m n.p.m.)". Połoniny: Bieszczadzki Park
    Narodowy, stránka o rostlinstvu połonin (čteno 8. 8. 2026) — jde
    o „malownicze subalpejskie piętro" nad hranicí lesa na svazích
    „przekraczających na ogół 1200 m n.p.m."; patro „ukształtowane zostało
    przez czynniki naturalne", ale pastva („wypas, koszarowanie bydła
    i owiec") „obniżyło granicę lasu oraz zmieniły skład i strukturę
    zbiorowisk roślinnych". POZOR NA VÝKLAD: pramen říká, že połoniny mají
    přírodní základ A pastva je rozšířila — ne že jsou bezlesé jen kvůli
    pastvě; text to tak i formuluje. Vysídlení: wbieszczady.pl (čteno
    8. 8. 2026) — 1944–46 první masová vysídlení, „28 kwietnia 1947 r.
    o godz. 4 nad ranem rozpoczęło się masowe wysiedlanie ludności
    ukraińskiej", akce z roku 1951 přesídlila 14 151 osob; ze zaniklých vsí
    zbyly „cmentarze, krzyże przydrożne, podmurówki zabudowań i ruiny".
    Główny Szlak Beskidzki: mapa-turystyczna.pl (čteno 8. 8. 2026) uvádí
    délku 503,6 km z Ustronia do Wołosatého; anglická Wikipedie
    u Wołosatého — obec „marks either the start (if one travels westward)
    or finish (if one travels eastward) of the Main Beskid Trail". Režim:
    twojebieszczady.net, regulamin (čteno 8. 8. 2026) — „Poruszanie się po
    szlakach na obszarze Parku dozwolone jest wyłącznie od wschodu do
    zachodu słońca." a nocování „wyłącznie w trzech wyznaczonych miejscach:
    polu namiotowym w Bereżkach, polu biwakowym w Tarnawie Niżnej oraz polu
    biwakowym na Górnej Wetlince".
  verified: false
  checked: '2026-08-08'

nejvyssiHora:
  nazev: Tarnica
  vyska: 1346
  source: >-
    Polská Wikipedie, Bieszczady (čteno 8. 8. 2026): „na terytorium Polski
    – Tarnica (1346 m n.p.m.)"; totéž číslo uvádějí anglická Wikipedie,
    PeakVisor i mapa-turystyczna.pl. ROZPOR, přiznaný: treking.cz uvádí
    „Tarnica 1 348 metrů" — zapsáno 1346 dle konvence z 27. 7. 2026 (nižší
    číslo při rozporu; tady navíc stojí čtyři prameny proti jednomu).
    Souřadnice 49.074554 / 22.726162 (PeakVisor), potvrzené
    mapa-turystyczna.pl na deset metrů; anglická Wikipedie ale uvádí
    49.06944 / 22.73806, tedy o zhruba kilometr jinde — ROZPOR V POLOZE,
    který se před prvním profilem musí ověřit v polském geoportálu.
    TARNICA JE NEJVYŠŠÍ JEN NA POLSKÉ STRANĚ. Nejvyšší vrchol celých
    Bieszczad je podle téhož pramene „Pikuj (1405 m n.p.m., na Ukrainie)",
    tedy mimo naše okno i mimo země, po kterých se ptáme. Do dat oblasti se
    proto zapisuje Tarnica a rozdíl je tady popsaný — bez něj by profil
    tvrdil superlativ, který neplatí.
  verified: false
  checked: '2026-08-08'

