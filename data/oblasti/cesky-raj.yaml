interniPoznamky: 'Založeno 30. 7. 2026 podle návrhu docs/OBLASTI-NAVRH.md, oddílu 5; rozhodnutí
  o oblastech přenechal Michal („ohledně oblastí dám na tebe"), rozsah „turistické chaty" potvrdil
  týž den. ÚROVEŇ JE `turisticka-oblast` schválně: Český ráj pohoří není a slepit Kozákov s Prachovem
  geomorfologicky nelze (dvě různé jednotky). Turisticky ale patří k sobě a takhle je čtenář hledá.
  Nejvyšší hora se ZÁMĚRNĚ neuvádí — u turistické oblasti to není údaj, který by o ní něco říkal,
  a Kozákov (744 m) je nejvyšší bod Kozákovského hřbetu, ne Českého ráje. Vyhledávací okno pro
  pipeline zatím NENÍ: obě chaty už kandidáty jsou (z krkonošských a jizerských běhů), takže DATA-01
  tu nic nepotřebuje; okno se doplní, až bude důvod oblast prohledávat celou.'
