nazev: Český ráj
slug: cesky-raj
typ: turisticka-oblast
zeme: cz
charakteristika: 'Pískovcová skalní města a vyhlídkové kopce mezi Turnovem a Jičínem. Není to
  pohoří a průvodce to nepředstírá — přesto tu turistické chaty stojí: v Prachovských skalách
  a na Kozákově, tedy na místech, kam se chodí za výhledem a kde je kde se najíst.'
overeniCharakteristika:
  source: 'Poloha a povaha oblasti: vlastní kandidáti v repu (Riegrova chata na Kozákově, Turistická
    chata Prachov — OSM, ODbL) a katalog výchozích bodů (data/externi/vychozi-body-cr-sk-2026).
    Geomorfologicky nejde o jednu jednotku: Kozákovský hřbet patří k Ještědsko-kozákovskému hřbetu,
    Prachovské skály k Jičínské pahorkatině — proto je to turistická oblast, ne pohoří. Popis
    je redakční shrnutí, ne převzaté tvrzení.'
  verified: false
  checked: '2026-07-30'
