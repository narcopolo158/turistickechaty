# Oblast Vysoké Tatry — jedenáctá oblast průvodce a zdaleka nejcennější
# chatařská síť, jakou dosud bral.
#
# POKYN MICHALA 8. 8. 2026: „kdyz uz jsme na slovensku, vezmi rovnou i vysoke
# a nizke tatry."
#
# ROZSAH: Východné Tatry vcelku, tedy Vysoké Tatry i Belianske Tatry, které
# od sebe dělí Kopské sedlo. TANAP je vede jako dva podcelky jednoho celku
# a externí katalog s tím zachází stejně — Chatu Plesnivec, která stojí
# v Belianskych Tatrách, řadí pod Vysoké Tatry. Polská strana (Tatry
# Wysokie) je součástí dle principu „pohoří vcelku" (rozhodnutí Michala
# 20. 7. 2026).
#
# Poctivost: superlativy jen s dokladem; odvozená čísla se sem nepíšou.
nazev: Vysoké Tatry
slug: vysoke-tatry
typ: pohori
zeme: sk

sklonovani:
  druhy: Vysokých Tater
  sesty: Vysokých Tatrách

charakteristika: >-
  Nejvyšší pohoří Karpat a podle pramenů jediné, které má vedle Jižních
  Karpat alpský charakter — devětadvacet vrcholů přes dva a půl tisíce metrů
  na hřebeni dlouhém pár desítek kilometrů. Pro průvodce je to zlom: dosud
  popisoval středohory, kde se dá vyjít a sejít týž den, tady jsou
  vysokohorské chaty, k nimž se stoupá hodiny, plesa v karech a od listopadu
  do konce května zavřené značené chodníky. A chataření tu má nejhlubší
  doloženou historii z celého korpusu — nejstarší chata na slovenské straně
  stojí od roku 1863 a většina ostatních vznikla za Uhorského karpatského
  spolku, Karpathenvereinu nebo Klubu československých turistov.
overeniCharakteristika:
  source: >-
    Členění: TANAP (tanap.sk / tanap.sopsr.sk, geomorfologické členění
    Tatier, čteno 8. 8. 2026) — „Geomorfologický celok Tatry sa člení na dva
    podcelky: Východné Tatry a Západné Tatry.", „Východné a Západné Tatry
    oddeľuje Ľaliové sedlo." a „Vysoké Tatry a Belianske Tatry. Oddeľuje ich
    Kopské sedlo." Alpský charakter a počet vrcholů: anglická Wikipedie,
    High Tatras (čteno 8. 8. 2026) — „The High Tatras, having 29 peaks over
    2,500 metres (8,200 ft) AMSL are, with the Southern Carpathians, the
    only mountain ranges with an alpine character and habitats in the entire
    1,200 kilometres (750 mi) length of the Carpathian Mountains system."
    Sezónní uzávěra chodníků: tatry.sk (čteno 8. 8. 2026) — „Seasonal
    closure of selected hiking trails in the High Tatras lasts from November
    1st to May 31st"; POZOR, termín se změnil — dřív končila 15. 6.,
    blog.gopass.travel to výslovně uvádí („the seasonal closure now ends on
    May 31, instead of the previous June 15"), takže starší prameny mají
    jiné datum a profily to musejí hlídat. SROVNÁNÍ SE STŘEDOHORAMI je NAŠE,
    plyne z vlastního korpusu. Historie chat: prameny u jednotlivých chat
    v interniPoznamky.
  verified: false
  checked: '2026-08-08'

nejvyssiHora:
  nazev: Gerlachovský štít
  vyska: 2654
  source: >-
    Anglická Wikipedie (čteno 8. 8. 2026): „Its elevation is usually listed
    at 2654.4 m above sea level." Souřadnice 49.164079 / 20.134042 dle
    PeakVisoru. ZAPSÁNO 2654 (celé metry, zaokrouhleno dolů z 2654,4 dle
    konvence z 27. 7. 2026 — při rozporu nižší číslo); běžně se uvádí
    2655 m a je to tedy rozpor, který profil přiznává. Je to zároveň
    nejvyšší hora celých Karpat. POZOR NA TŘI ZÁMĚNY: tatranský Kriváň
    (2494,7 m) není Veľký Kriváň v Malé Fatře (1708 m) ani Kriváň
    v Nízkých Tatrách (1233 m) — všechny tři jsou v korpusu; Rysy mají
    2501 m dle Wikipedie a 2503 m dle PeakVisoru; Havran (2152 m) je
    nejvyšší vrchol BELIANSKYCH Tater, ne Vysokých.
  verified: false
  checked: '2026-08-08'

