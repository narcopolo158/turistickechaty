charakteristika: 'Zalesněné karpatské kopce mezi Hostýnem a Kelčským Javorníkem,
  s poutním Hostýnem na západním okraji a sedlem Tesák jako turistickou křižovatkou
  uprostřed. Hřebenem vede Hostýnská magistrála; chatová tradice na Tesáku sahá do
  třicátých let dvacátého století.'
overeniCharakteristika:
  source: 'Povaha oblasti: Tesák jako „významné turistické a lyžařské středisko"
    mezi údolími Bystřičky a Juhyně (Turistika.cz — čteno 10. 8. 2026); Hostýnská
    magistrála: Kudy z nudy (rešerše Chaty Tesák). Chatová tradice od 30. let:
    Chata Tesák 1934 (Kudy z nudy), kamenná chata KČT od 1930 (Turistika.cz).
    Popis je redakční shrnutí, ne převzaté tvrzení.'
