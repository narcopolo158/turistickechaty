interniPoznamky: 'Založeno 10. 8. 2026 současně s povýšením prvního profilu
  (chata-tesak). ÚROVEŇ turisticka-oblast — vzor cesky-raj; geomorfologicky jde
  o část Hostýnsko-vsetínské hornatiny (Karpaty), pro průvodce ale samostatná
  turistická oblast mimo hlavní pohoří. POZOR: sousedí s beskydským vyhledávacím
  oknem — překryvy hlídá DATA-36/38. Vyhledávací okno pro DATA-01 zatím NENÍ.
  Kandidáti k prověření: Kamenná chata na Tesáku (KČT Bystřice pod Hostýnem,
  od 1930, levneubytovani vede 34 lůžek), objekty na Hostýně. Nejvyšší hora se
  záměrně neuvádí (Kelčský Javorník 865 m by potřeboval vlastní doklad).'
