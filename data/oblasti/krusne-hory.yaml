# Oblast Krušné hory — třináctá oblast průvodce (pokyn Michala 8. 8. 2026:
# „klidne dopln krusne hory, orlicke a vse dalsi co najdes").
#
# ROZSAH. Okno dotazu (scripts/oblasti.ts) kryje pohoří vcelku přes
# česko-saskou hranici: český celek Krušné hory (podcelky Klínovecká
# a Loučenská hornatina) a saské Erzgebirge se všemi třemi částmi
# (West-, Mittel-, Osterzgebirge). Princip „přeshraniční pohoří vcelku"
# (rozhodnutí Michala 20. 7. 2026) tu platí obzvlášť silně — katalog vede
# pět objektů pod „Krušné hory" a pět pod „Erzgebirge".
# VĚDOMĚ MIMO OKNO: Smrčiny s Ašskou vrchovinou (jiný celek téže oblasti),
# Sokolovská a Mostecká pánev a Doupovské hory (Podkrušnohorská oblast, jiná
# geomorfologická oblast) a Děčínská vrchovina za Nakléřovským průsmykem —
# tedy i Děčínský Sněžník. Na saské straně okno nejde až k Freibergu
# a Tharandtu, ač tam pohoří podle členění sahá: průvodce bere hřeben a jeho
# úpatí, ne celou jednotku i s podhůřím.
#
# Poctivost: superlativy jen s dokladem; odvozená čísla (počty chat,
# žebříčky) se sem NIKDY nepíšou — počítají se při buildu z profilů.
nazev: Krušné hory
slug: krusne-hory
typ: pohori
zeme: cz

# Skloňované tvary názvu do vět na webu. Pomnožné ženské jako Beskydy.
sklonovani:
  druhy: Krušných hor
  sesty: Krušných horách

charakteristika: >-
  Sto padesát kilometrů dlouhá kerná deska mezi Chebskem a Labem, nakloněná
  k severu do Saska a na jihu useknutá prudkým svahem nad Podkrušnohořím.
  Právě ta asymetrie dělá zdejší turistiku jinou než v Krkonoších nebo
  Beskydech: od Mostu nebo Litvínova se stoupá pět set metrů naráz, kdežto
  nahoře začíná náhorní plošina s rašeliništi, po které se dá jít i jet na
  běžkách celé dny. Osm set let hornictví tu nechalo tolik stop, že je
  Hornický region Erzgebirge/Krušnohoří od roku 2019 na seznamu UNESCO.
overeniCharakteristika:
  source: >-
    Délka a šířka: německá Wikipedie, Erzgebirge (čteno 8. 8. 2026) —
    „etwa 150 km lang und durchschnittlich 40 km breit"; ROZPOR
    s prirodnikrasycr.estranky.cz, které o českém pásmu píší „Tvoří souvislé
    horské pásmo o délce 130 km" — obě čísla se patrně týkají různého
    předmětu měření, ale žádný pramen to neříká, takže se v textu uvádí
    „sto padesát" s vědomím rozporu. Kerný charakter a asymetrie:
    prirodnikrasycr.estranky.cz (čteno 8. 8. 2026) — pohoří je „kerné"
    a tvoří „nakloněné desky, jejíž jižní okraj byl vyzdvihnut podél
    zemského zlomu. Proto směrem k severu klesají pozvolně, zatímco na jihu
    jsou omezené 500-700 m vysokým příkrým svahem." Rašeliniště: týž pramen
    jmenuje Božídarské a Novodomské rašeliniště. UNESCO: whc.unesco.org,
    položka 1478 (čteno 8. 8. 2026) — „Erzgebirge/Krušnohoří Mining Region",
    zápis 2019, 22 součástí, kritéria (ii)(iii)(iv), „800 years of almost
    continuous mining"; montanregion.cz — „Sedmnáct z těchto součástí je na
    saské straně a pět na české straně"; bozidar.cz uvádí datum zápisu
    6. července 2019 na 43. zasedání Výboru světového dědictví v Baku.
    SROVNÁNÍ S KRKONOŠEMI A BESKYDAMI je NAŠE, plyne z vlastního korpusu.
  verified: false
  checked: '2026-08-08'

nejvyssiHora:
  nazev: Klínovec
  vyska: 1243
  source: >-
    Anglická Wikipedie (čteno 8. 8. 2026) vede Klínovec jako „the highest
    peak of the Ore Mountains" a uvádí „1,244 metres (4,081 ft)"; německá
    Wikipedie u téhož vrcholu i v článku o pohoří uvádí „1243,7 m ü.d.M.".
    Zapsáno 1243 dle konvence z 27. 7. 2026 (při rozporu nižší číslo, rozpor
    přiznat). Souřadnice 50.39611 / 12.96778 (anglická Wikipedie).
    POZOR NA ROZLIŠENÍ DVOU VRCHOLŮ, které leží tři kilometry od sebe přes
    hranici: FICHTELBERG (50.42861 / 12.95472) je NEJVYŠŠÍ HORA SASKA —
    anglická Wikipedie doslova „At 1,214.6 m (3,985 ft) above sea level, the
    Fichtelberg is the highest mountain in Saxony" —, ale ne nejvyšší hora
    pohoří. Jeho výšku uvádějí prameny trojmo: 1214,88 m (německá Wikipedie
    o Fichtelbergu), 1214,79 m (německá Wikipedie o pohoří) a 1214,6 m
    (anglická Wikipedie). Do dat oblasti se zapisuje jen Klínovec; Fichtelberg
    dostane vlastní údaje, až se bude povyšovat Fichtelberghaus.
  verified: false
  checked: '2026-08-08'

