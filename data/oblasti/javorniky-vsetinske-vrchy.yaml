charakteristika: >-
  Dvě sousední pohoří valašského pomezí, která průvodce vede jako jednu
  oblast: hraniční hřeben Javorníků na česko-slovenské hranici a Vsetínské
  vrchy nad Vsetínem. Proti Moravskoslezským Beskydám na severu jsou nižší
  a otevřenější — hřebeny tu nejsou zalesněné, ale lučnaté, protože je
  odlesnili valašští pastevci, a po stráních jsou rozeseté paseky a samoty,
  které šplhají až do nejvyšších poloh. Chatařská historie tu má vlastní
  jméno: chatu na Vsackém Cábu nechal roku 1928 postavit vsetínský lékárník
  Karel Puszkailer, a Soláni se pro malíře, kteří tu žili, říká Vrch umělců.
overeniCharakteristika:
  source: >-
    Zařazení Javorníků: Kudy z nudy (čteno 8. 8. 2026) — „geomorfologické
    oblasti Slovensko-moravské Karpaty"; týž pramen vede hřeben jako „asi
    30 km dlouhý, málo členitý" s krajinou „roztroušenými samotami
    a osadami, které šplhají až do nejvyšších poloh". Odlišení od
    beskydské části: AOPK, stránka k 50 letům CHKO Beskydy (čteno
    8. 8. 2026) — „na jihu nižší a krajinářsky pestřejší část Vsetínských
    vrchů a Javorníků, etnograficky zvanou Valašsko". Lučnaté hřebeny:
    vyletnik.cz (čteno 8. 8. 2026) — „S postupující kolonizací horských
    pastevců – Valachů – došlo k mýcení lesů na hřebenech hor, čímž
    vznikaly často rozsáhlé bezlesé enklávy, na kterých se vytvořily louky
    sloužící k pastvě tzv. paseky." Vsacký Cáb: Valašský deník (čteno
    8. 8. 2026) — „Chatu Vsacký Cáb nechal postavit a jako útulnu ji
    otevřel 29. června 1928 Karel Puszkailer." Soláň: Český rozhlas (čteno
    8. 8. 2026) — „Vrch umělců se mu říká proto, že zde žili významní
    tvůrci - malíři Alois Schneiderka, Karel Hofman, Jan Kobzáň a František
    Podešva." SLOVO „NIŽŠÍ" je doložené citací AOPK; srovnání „otevřenější"
    je NAŠE shrnutí popisu lučnatých hřebenů, ne citát.
  verified: false
  checked: '2026-08-08'

nejvyssiHora:
  nazev: Velký Javorník
  vyska: 1071
  source: >-
    javorniky.cz (čteno 8. 8. 2026): „Velký Javorník s nadmořskou výškou
    1 071 m. n. m. je nejvyšším vrcholem Javorníků". ROZPOR O METR:
    PeakVisor uvádí 1072 m se souřadnicemi 49.318864 / 18.37337. Zapsáno
    1071 dle konvence z 27. 7. 2026 (při rozporu nižší číslo, rozpor
    přiznat). POZOR NA TŘI ZÁMĚNY, které tu hrozí: (1) vrchol Velkého
    Javorníku leží na SLOVENSKÉ straně hranice — nejvyšší horou moravské
    části Javorníků je dle Kudy z nudy Malý Javorník (1019 m); (2)
    v Moravskoslezských Beskydech u Frenštátu je JINÝ Velký Javorník
    (918 m, nejvyšší bod Veřovických vrchů dle beskydyportal.cz) — ten do
    téhle oblasti nepatří vůbec; (3) nejvyšší vrchol Vsetínských vrchů je
    Vysoká (1024 m dle turistika.cz i treking.cz), NE Ptáčnice, jak by se
    dalo čekat.
