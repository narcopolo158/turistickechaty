# Oblast Javorníky a Vsetínské vrchy — sedmá oblast průvodce.
#
# ROZHODNUTÍ MICHALA 8. 8. 2026, doslova: „javorniky a vsetinske vrchy bych
# udelal jako jednu samostatnou oblast (jestedsky hrbet jsme taky
# nepripojili k jizerkam)." Otázka na to padla v deníku téhož dne, když se
# zakládaly Beskydy: katalog drží v obou jednotkách sedm objektů
# s doloženým stravováním, ale geomorfologicky to nejsou Moravskoslezské
# Beskydy. Michalova analogie je přesná — Ještědský hřbet dostal 30. 7. 2026
# vlastní oblast ze stejného důvodu, ne aby se přilepil k Jizerkám.
#
# ČÍM SE ODLIŠUJÍ OD BESKYD: Javorníky patří do geomorfologické oblasti
# Slovensko-moravské Karpaty (Kudy z nudy), tedy do jiné nadřazené jednotky
# než Moravskoslezské Beskydy. A rozdíl je vidět i v krajině: AOPK sama
# v popisu CHKO Beskydy odlišuje „na jihu nižší a krajinářsky pestřejší část
# Vsetínských vrchů a Javorníků, etnograficky zvanou Valašsko" od severní
# beskydské části. Nižší, lučnatější, pasekářské — a s vlastní chatařskou
# historií.
#
# Poctivost: superlativy jen s dokladem; odvozená čísla (počty chat,
# žebříčky) se sem NIKDY nepíšou — počítají se při buildu z profilů.
nazev: Javorníky a Vsetínské vrchy
slug: javorniky-vsetinske-vrchy
