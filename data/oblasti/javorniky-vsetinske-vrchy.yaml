interniPoznamky: >-
  Založeno 8. 8. 2026 na rozhodnutí Michala („javorniky a vsetinske vrchy
  bych udelal jako jednu samostatnou oblast"). Konfigurace okna je
  v scripts/oblasti.ts (slug javorniky-vsetinske-vrchy, zeme CZ+SK,
  katalogové názvy Javorníky a Vsetínské vrchy), kotvy okna a jejich
  prameny v komentáři tamtéž.

  DALŠÍ KROK JE MICHALŮV KLIK: Actions → „DATA-01: OSM export chat (dle
  oblasti)" → Run workflow → oblast `javorniky-vsetinske-vrchy`. Ze
  sandboxu na Overpass nedosáhneme (HTTP 000 přes proxy, ověřeno
  8. 8. 2026). Seznam všech čekajících kliků drží
  docs/KLIKY-PRO-MICHALA.md.

  DVA KATALOGOVÉ NÁZVY SE PŘESUNULY Z BESKYD sem, protože oblast vznikla
  rozdělením. Beskydské okno se tím zúžilo na jihu z 49.25 na 49.30 a na
  západě z 18.00 na 18.05; PŘEKRYV OBOU OKEN v pásu 49.30–49.47 /
  18.05–18.50 ale zůstal úmyslně, protože právě tam se obě pohoří
  potkávají (dolina Rožnovské Bečvy, Soláň). Ostrý řez na hranici dvou
  pohoří tiše vyřízne objekty na sedle mezi nimi — vzor překryvu Krkonoš
  a Jizerek v okolí Jizerky a Harrachova. Duplicity řeší triáž, ne okno.

  CO UŽ VÍME BEZ OVERPASSU — externí katalog drží v obou jednotkách sedm
  objektů s doloženým stravováním: **Javorníky 4** — Horský hotel Kohútka
  (913 m dle mistopisy.cz, 960 m dle turistika.cz — rozpor, na sedle
  česko-slovenské hranice), Horský hotel Portáš (930 m dle katalogu,
  960 m dle treking.cz; postaven 1932 pod vrcholem Stolečný), Horská
  chata Kmínek (SK, 872 m) a Chata Čerenka (SK, 948 m). **Vsetínské
  vrchy 3** — Chata Vsacký Cáb (824 m dle katalogu; prameny dávají čtyři
  různá čísla, viz níž), Horský hotel Čarták na Soláni (860 m) a Chata
  Kusalíno (650 m, souřadnice 49.3332 / 18.0610 dle kct.cz).

  VSACKÝ CÁB — PAST NA VÝŠKU I NA SOUŘADNICE, vyřešit až při povyšování.
  Prameny dávají čtyři různé hodnoty pro tři různé body: rozcestí u chaty
  790 m (49.372 / 18.095), budova chaty 842 m (49.375 / 18.096), treking.cz
  820 m bez souřadnic a vrchol Cábu 841 m jako bod odlišný od chaty. Do
  profilu půjde výška BUDOVY s pramenem, který ji jako budovu označuje —
  ne nejnižší číslo mechanicky, protože tady rozdíl nevzniká rozporem
  pramenů, ale tím, že měří různá místa. Konvence „nižší číslo při rozporu"
  se na tenhle případ nevztahuje a je dobré to vědět dopředu.

  HISTORIE, KTERÁ TU JE A JE DOLOŽENÁ — nejcennější věc oblasti. Chatu
  Vsacký Cáb otevřel jako útulnu 29. června 1928 Karel Puszkailer,
  vsetínský lékárník; základní kámen byl položen roku 1927 (Valašský deník
  a zlin.cz, čteno 8. 8. 2026 — druhý pramen mluví o devíti měsících mezi
  kamenem a otevřením, první o roce; rozpor přiznat, ne srovnávat).
  Hotel Portáš byl postaven roku 1932 a jeho pozdější majitel Bittner v něm
  zřídil poštovnu. Spolek, který by tu stavěl chaty jako Pohorská jednota
  Radhošť v Beskydech, se rešerší 8. 8. 2026 NENAŠEL — nezapisuje se
  tvrzení, že žádný nebyl, jen že ho neznáme.

  OCHRANA: česká část obou pohoří patří do CHKO Beskydy (výnos
  ministerstva kultury z 5. 3. 1973, účinný 30. 3. 1973), slovenská část
  Javorníků do CHKO Kysuce (Kudy z nudy, čteno 8. 8. 2026). Hřebenová
  trasa Javorníků měří dle turistika.cz asi 27 km a vede přes Portáš, Malý
  Javorník (1019 m) a Stratenec (1055 m) na Velký Javorník.

  HERO FOTKA CHYBÍ — doplní ji redakční výběr (FOTO-01) nebo mediabanka.
