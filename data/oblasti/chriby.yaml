interniPoznamky: 'Založeno 10. 8. 2026 současně s povýšením prvního profilu
  (lesni-penzion-bunc). ÚROVEŇ turisticka-oblast — vzor cesky-raj. Vyhledávací okno
  pro DATA-01 zatím NENÍ — kandidáti vznikají ruční rešerší (k prověření: lovecká
  chata Hubertka dle Turistika.cz, okolí Buchlova a Brda). Nejvyšší hora se záměrně
  neuvádí (vzor cesky-raj); Brdo (587 m, kamenná rozhledna) by potřebovalo vlastní
  doklad.'
