sklonovani:
  druhy: Chřibů
  sesty: Chřibech

charakteristika: 'Zalesněná vrchovina mezi Hanou a Slováckem — bukové hřebeny, skalní
  útvary a hrad Buchlov, s rozhlednou na Brdu jako nejvyšším bodem. Není to pohoří
  a průvodce to nepředstírá; turistická tradice je tu ale stará přes sto let: útulnu
  na sedle Bunč postavili kluboví turisté už v roce 1924.'
overeniCharakteristika:
  source: 'Povaha oblasti: Chřiby leží na východní Moravě mezi Slováckem a Hanou
    (bunc.cz — čteno 10. 8. 2026); „zdravé bukové lesy" a sbíhající se katastry pěti
    obcí u Bunče vede Kudy z nudy. Útulna 1924 (KČT): Kudy z nudy — rešerše Bunče.
    Geomorfologicky jde o vrchovinu, ne horské pásmo — proto turistická oblast.
    Popis je redakční shrnutí, ne převzaté tvrzení.'
  verified: false
  checked: '2026-08-10'
