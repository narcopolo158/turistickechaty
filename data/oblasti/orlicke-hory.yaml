# Oblast Orlické hory — čtrnáctá oblast průvodce (pokyn Michala 8. 8. 2026:
# „klidne dopln krusne hory, orlicke a vse dalsi co najdes").
#
# ROZSAH — A ZAVÍRÁ SE JÍM OTÁZKA, KTERÁ BYLA OD RÁNA OTEVŘENÁ. Okno kryje
# Orlické hory na obou stranách hranice (Deštenská hornatina, Mladkovská
# vrchovina, Bukovohorská hornatina, polské Góry Orlickie) A NAVÍC GÓRY
# BYSTRZYCKIE, které až dosud ležely „vědomě mimo okno" u Jeseníků. Důvod
# není geomorfologický — je ochranářský a turistický, celý s prameny
# v interniPoznamky.
# VĚDOMĚ MIMO OKNO: Králický Sněžník / Masyw Śnieżnika (jiná podsoustava
# i jiný makroregion, patří oblasti Jeseníky), Góry Stołowe a Broumovská
# vrchovina na severu, Kudowa-Zdrój za sedlem Polskie Wrota.
#
# Poctivost: superlativy jen s dokladem; odvozená čísla (počty chat,
# žebříčky) se sem NIKDY nepíšou — počítají se při buildu z profilů.
nazev: Orlické hory
slug: orlicke-hory
typ: pohori
zeme: cz

# Skloňované tvary názvu do vět na webu. Pomnožné ženské, přídavné jméno se
# skloňuje s podstatným.
sklonovani:
  druhy: Orlických hor
  sesty: Orlických horách

charakteristika: >-
  Zalesněný val na česko-polské hranici, dlouhý zhruba pětapadesát kilometrů
  a nepříliš vysoký — a přesto tu jsou hory k chození celý den. Hřebenem
  vede Jiráskova cesta, vyznačená už roku 1921, a v zimě sem patří jedna
  z nejrozsáhlejších a přitom nejprázdnějších běžkařských sítí v Česku.
  Podél hranice stojí pás předválečného opevnění z let 1935 až 1938;
  tvrz Hanička je od roku 1995 přístupná jako muzeum.
overeniCharakteristika:
  source: >-
    Délka a ráz: treking.cz (čteno 8. 8. 2026) — „Nevysoké a zalesněné
    hřebeny Orlických hor se jako zalesněný val táhnou v délce téměř
    55 kilometrů." Jiráskova cesta: region-orlickehory.cz (čteno 8. 8. 2026)
    — „Jiráskova hřebenová cesta", délka 170 km z Broumova do Litomyšle,
    „Vyznačena byla v roce 1921"; Kudy z nudy potvrzuje rok 1921. POZOR:
    týž název nese i zimní hřebenový úsek „o délce téměř 30 km" (Kudy
    z nudy), takže délka 170 km se do textu nepíše bez rozlišení, co se
    měří. Běžkování: Kudy z nudy (čteno 8. 8. 2026) — „přibližně
    250 kilometrů strojově upravovaných tras", „Orlická magistrála měří přes
    80 km" a „Na málokterých horách však najdete tak málo běžkařů a současně
    tak rozsáhlou síť běžeckých tratí"; slovo „nejprázdnějších" je opřené
    o tenhle citát, ne o žebříček. Opevnění: region-orlickehory.cz —
    „systém předválečného hraničního opevnění, které bylo budováno v letech
    1935 – 1938", tvrz Hanička stavěna 1936–1938 a „byla zpřístupněna
    veřejnosti v roce 1995". TVRZENÍ O „DLOUHÉ TRADICI BĚŽKOVÁNÍ" SE
    VĚDOMĚ NEPÍŠE — rešerše 8. 8. 2026 ho doslovným pramenem nedoložila;
    doložené jsou jen dnešní parametry sítě a existence Muzea zimních sportů
    v Deštném (otevřeno 1990).
  verified: false
  checked: '2026-08-08'

nejvyssiHora:
  nazev: Velká Deštná
  vyska: 1115
  source: >-
    Shodně tři prameny (čteno 8. 8. 2026): treking.cz — „Nejvyšším vrcholem
    Orlických hor je Velká Deštná (1 115 m)"; kct-tabor.cz — „nadmořská výška
    vrcholu 1115 m"; polská ziemia-klodzka.pl — „Wielka Desztna (Velká
    Deštná, 1115 m n.p.m.)". ROZPOR, přiznaný: dva prameny mají v titulku
    1116 m (odkladskychhranic.wordpress.com, který ovšem v textu píše
    1115 m, a tisicovky.cz, jejichž stránka se nenačetla). Zapsáno 1115 dle
    konvence z 27. 7. 2026. Souřadnice okolo 50.304 / 16.400 (GeoNames);
    kct-tabor.cz uvádí 50°18′5,66″ / 16°23′51,55″, tedy o zhruba 350 metrů
    jinde — druhý rozpor, tentokrát v poloze.
    NEJVYŠŠÍ VRCHOL POLSKÉ ČÁSTI je hraniční Orlica, česky VRCHMEZÍ
    (1084 m, 50.353 / 16.361) — jeden vrchol se dvěma jmény, ne dva kopce.
    NEJVYŠŠÍ VRCHOL GÓR BYSTRZYCKICH je Jagodna a její výška je rozporná:
    977 m (portalgorski.pl, kgp.info.pl) × 985 m (zrcadlo polské Wikipedie).
    Ani jedna z nich nemění to, že nejvyšší horou celé oblasti je Velká
    Deštná.
  verified: false
  checked: '2026-08-08'

