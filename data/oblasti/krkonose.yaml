# Oblast Krkonoše — metadata pro stránku pohoří (F1a; bbox doplní budoucí práce s mapou)
# Poctivost: superlativy jen s dokladem; odvozená čísla (počty chat, žebříčky,
# „nejstarší") se sem NIKDY nepíšou — počítají se při buildu z profilů.
nazev: Krkonoše
slug: krkonose
typ: pohori
zeme: cz

charakteristika: >-
  Nejvyšší pohoří Česka, rozložené po obou stranách česko-polské hranice.
  Po hřebenech i v údolích stojí desítky horských bud a schronisek
  a průvodce je mapuje z obou stran — od velkých obsluhovaných bud
  po hraniční případy, které poctivě přiznává.
overeniCharakteristika:
  source: >-
    „Nejvyšší pohoří Česka": titulky výsledků WebSearch 2026-07-27
    (tisicovky.cz, dnesnivylet.cz „Krkonoše – nejvyšší pohoří České
    republiky"; obsah stránek neotevřen — sandbox). Zbytek popisuje fond
    tohoto průvodce (data/chaty/krkonose/**), nikoli převzatá tvrzení.
  verified: false
  checked: '2026-07-27'

nejvyssiHora:
  nazev: Sněžka
  vyska: 1603
  # Zdroj: titulky výsledků WebSearch 2026-07-27 — tisicovky.cz „Sněžka
  # (HLV 1; 1603 m)", kudyznudy.cz „Sněžka – nejvyšší hora Česka i Slezska";
  # úryvek dolnyslask.travel upřesňuje oficiální výšku 1603,30 m n. m.
  # (údaj 1602 m z publikací před 2014 patřil geodetickému bodu, ne vrcholu).
  # Obsah stránek neotevřen (sandbox) — ověření očima/ČÚZK: DATA-04.
  source: >-
    tisicovky.cz („Sněžka (HLV 1; 1603 m)") + kudyznudy.cz („nejvyšší hora
    Česka i Slezska") — titulky WebSearch 2026-07-27, obsah neotevřen

# ── Titulní fotka oblasti (FOTO-01) ───────────────────────────────────────
# Krajinný snímek do hlavičky stránky pohoří. Je to JINÝ druh fotky než
# fotka chaty: u profilu musí být doložené, která budova to je, tady stačí
# doložená lokalita (rozlišení z docs/FOTKY-ZDROJE-A-LICENCE.md, oddíl 1).
# Unsplash atribuci nevyžaduje — uvádíme ji přesto, protože web u každého
# údaje říká, odkud je, a u obrázků by to jinak neplatilo.
heroFoto:
  soubor: /foto/pohori/krkonose-hero-jan-kopriva.jpg
  nahled: /foto/pohori/krkonose-hero-jan-kopriva-nahled.jpg
  alt: >-
    Pohled z vrcholu Sněžky přes Bílou louku na Luční boudu, v pozadí modré
    vrstvy vzdálených hřebenů
  autor: Jan Kopřiva
  autorUrl: https://unsplash.com/@jxk
  licence: unsplash
  zdrojUrl: https://unsplash.com/photos/mbFs0yZYb74
  # Autor u snímku uvádí jen „View from the top of Czech Republic - Sněžka
  # 1603 m" (načteno 2026-07-29) — budovu na pláni NEJMENUJE. Že je to Luční
  # bouda, potvrdil 29. 7. 2026 Michal vlastní znalostí místa; teprve tím se
  # smí jmenovat (konvence B, viz overeniHeroFoto níže). Vzdálený vrchol
  # s vysílačem doložený není a jmenovaný nezůstává.
  popisMista: Luční bouda z vrcholu Sněžky
  prevzatoDne: '2026-07-29'
  # Rukopisná anotace se šipkou (návrh F1). `x`/`y` je POLOHA BOUDY ve
  # vykreslené fotce (v procentech plochy) — tam míří hrot šipky a popiska se
  # k němu skládá. Odečteno z renderu, ne odhadem.
  anotace:
    text: Luční bouda, 1 410 m
    x: 53.9
    y: 46.3
    sipka: true
overeniHeroFoto:
  source: >-
    Michal — vlastní znalost místa (29. 7. 2026, „je to Luční bouda —
    ověřeno"). Výška 1 410 m z profilu chaty (data/chaty/krkonose/
    lucni-bouda.yaml, zdroj lucnibouda.cz).
  verified: true
  checked: '2026-07-29'

# ── Fotky sekcí stránky (handoff F1) ──────────────────────────────────────
# Snímky přišly v návrhu od Michala (29. 7. 2026) a jsou z fotobank, které
# atribuci nevyžadují — uvádíme ji přesto, stejně jako u titulní fotky.
# Autoři a licence jsou z kreditů v handoffu; adresu konkrétní stránky snímku
# handoff neuvádí a ze sandboxu se nedohledá, proto `zdrojUrl` chybí a je to
# tady napsané, ne zamlčené.
#
# POPISKY: u obou snímků je `popis` VĚDOMĚ jen o tom, co je doložené.
# Návrh u nich tvrdí konkrétní místa („Sněžné jámy", „bývalá bouda nad
# Sněžnými jámami, dnes vysílač"); doklad k tomu nemáme, a dokud ho nedodá
# Michal (jako u Luční boudy v titulní fotce), zůstávají popisky obecné
# a `hotspoty` prázdné.
fotky:
  - role: pas-cile
    soubor: /foto/pohori/karkonosze-malgorzata-twardo.jpg
    nahled: /foto/pohori/karkonosze-malgorzata-twardo-nahled.jpg
    alt: >-
      Skalnaté srázy krkonošských karů se zbytky sněhu, v pozadí zvlněné
      hřebeny
    autor: Małgorzata Twardo
    licence: unsplash
    popis: Karkonosze — polská strana Krkonoš
    overeni:
      source: >-
        Autor a licence z kreditu v handoffu F1 (29. 7. 2026); „Karkonosze,
        polská strana" ověřeno na stránce snímku 29. 7. 2026 (zápis
        v deníku, dodatek 4). Konkrétní místo (Sněžné jámy) tvrdí návrh,
        doloženo není.
      verified: false
      checked: '2026-07-29'
  - role: pamet
    soubor: /foto/pohori/pamet-hor-mateusz-mierzejewski.jpg
    nahled: /foto/pohori/pamet-hor-mateusz-mierzejewski-nahled.jpg
    alt: >-
      Kamenitá stezka stoupá k horské stavbě s věží, červenou střechou
      a parabolami vysílače
    autor: Mateusz Mierzejewski
    licence: pexels
    overeni:
      source: >-
        Autor a licence z kreditu v handoffu F1 (29. 7. 2026). Co je na
        snímku za stavbu, doložené nemáme — návrh uvádí bývalou boudu nad
        Sněžnými jámami, ale pramen k tomu nedodává, takže popisku
        nepíšeme.
      verified: false
      checked: '2026-07-29'

topCile:
  - nazev: Sněžka
    veta: Nejvyšší hora Česka (1603 m) na hřebeni nad Obřím dolem a Równí pod Śnieżką.
    nejblizChataSlug: dom-slaski
    source: >-
      Výška viz nejvyssiHora; vazba na chatu z profilu Dom Śląski
