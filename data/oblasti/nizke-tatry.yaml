# Oblast Nízké Tatry — dvanáctá oblast průvodce (pokyn Michala 8. 8. 2026:
# „kdyz uz jsme na slovensku, vezmi rovnou i vysoke a nizke tatry").
#
# ROZSAH. Okno dotazu (scripts/oblasti.ts) kryje celý hřeben od Donovalů po
# Kráľovu hoľu, tedy oba podcelky — Ďumbierske i Kráľovohoľské Tatry, které
# dělí sedlo Čertovica. Kotvy okna a jejich prameny jsou v komentáři tamtéž.
# VĚDOMĚ MIMO OKNO jsou Banská Bystrica a Liptovský Mikuláš: kotlinová města
# dvacet kilometrů od úpatí, ne podhorské obce (totéž pravidlo jako Poprad
# u Vysokých Tater a Liptovský Mikuláš u Západných Tater).
# NÍZKÉ TATRY NEJSOU SOUČÁSTÍ TATER V UŽŠÍM SMYSLU — jsou samostatné pohoří
# a mají proto vlastní oblast, ne pododdíl vysokotatranské. Katalog je tak
# vede taky (pohoří „Nízké Tatry" zvlášť od „Vysoké Tatry").
#
# Poctivost: superlativy jen s dokladem; odvozená čísla (počty chat,
# žebříčky) se sem NIKDY nepíšou — počítají se při buildu z profilů.
nazev: Nízké Tatry
slug: nizke-tatry
typ: pohori
zeme: sk

# Skloňované tvary názvu do vět na webu. Pomnožné ženské jako Beskydy;
# pozor, že nominativ je česky „Nízké Tatry" (viz interní poznámky).
sklonovani:
  druhy: Nízkých Tater
  sesty: Nízkých Tatrách

charakteristika: >-
  Osmdesát kilometrů dlouhý hřeben přes střední Slovensko, který sedlo
  Čertovica dělí na západní Ďumbierske a východní Kráľovohoľské Tatry.
  Proti Vysokým Tatrám na severu jsou to hory jiného rázu — ne skalní
  stěny a plesa, ale dlouhé zaoblené hřbety nad hranicí lesa, po kterých
  se dá jít celé dny. Právě tudy vede hřebenem Cesta hrdinov SNP a Chopok
  je jejím nejvyšším bodem. Pro průvodce je oblast cenná ještě něčím
  jiným: vedle klasických chat tu stojí skupina turistických útulen, jaká
  se jinde v korpusu neopakuje.
overeniCharakteristika:
  source: >-
    Členění a délka hřebene: rešerše 8. 8. 2026 — hřeben dlouhý asi 80 km,
    dělený sedlem Čertovica na podcelky Ďumbierske Tatry a Kráľovohoľské
    Tatry. Cesta hrdinov SNP: dálková trasa 769 km, jejímž nejvyšším bodem
    je Chopok (2024 m). Národný park Nízke Tatry vyhlášen 1978 nariadením č.
    119/1978, rozloha upravena 1997 na 72 842 ha. ŽÁDNÝ SUPERLATIV SE ZDE
    VĚDOMĚ NETVRDÍ: nabízelo se napsat, že jde o nejrozsáhlejší pohoří
    Slovenska nebo o nejdelší hřeben, ale doslovný pramen pro to rešerše
    nedodala (doložený superlativ se týká NAPANTu jako národního parku, ne
    pohoří), takže se to nepíše. SROVNÁNÍ S VYSOKÝMI TATRAMI („ne skalní
    stěny a plesa, ale zaoblené hřbety") je NAŠE shrnutí, ne citát pramene.
    Skupina útulen je doložená katalogem (čtyři objekty typu „turistická
    útulna") a stav přístupu u každé z nich rešerší — podrobně v interních
    poznámkách.
  verified: false
  checked: '2026-08-08'

