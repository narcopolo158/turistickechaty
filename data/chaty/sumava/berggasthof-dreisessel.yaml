  ROZPOR DOMÉN K ROZŘEŠENÍ: katalog (HUT-0287) vede web dreisessel.com,
  kdežto OSM i turistický portál shodně berggasthof-dreisessel.com (a týž
  telefon +49 8556 350). Zapsána doména dvou shodných pramenů; jestli je
  dreisessel.com starší doména téhož domu, nebo web jiného objektu na
  Třístoličníku, NEVÍME a netvrdíme — kandidát na jeden dotaz DATA-04.

  NEDOLOŽENO (nezapsáno): historie domu (žádný načtený pramen); přesná
  výška z druhého pramene (portál ji neuvádí, katalog má 1312 m); poloha
  vůči vlastnímu trojmezí — portál mluví o „Dreiländereck" jako o oblasti,
  netvrdíme, že dům stojí na trojmezním bodě. Fotku dodá příští běh
  DATA-02.
