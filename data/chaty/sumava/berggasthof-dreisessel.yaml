# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská hospoda s ubytováním v 1312 metrech pod skalním hřebenem
  Třístoličníku, v koutě, kde se schází Bavorsko, Čechy a Rakousko —
  šestnáct lůžek, starobavorská kuchyně a dva dny v týdnu zavřeno.
text:
  - >-
    Berggasthof Dreisessel stojí ve vysokých polohách u trojmezí, pod
    skalním hřebenem Třístoličníku — hory, kterou z české strany zná každý,
    kdo šel na Plechý nebo k Plešnému jezeru. Za dobré viditelnosti prý
    z hřebene dohlédnete až k Alpám; to je tvrzení, které jsme neověřovali.
  - >-
    Dům nabízí šestnáct lůžek v pokojích pro jednoho až čtyři hosty.
    V kuchyni se drží starobavorských receptů a chatařské klasiky, teplá
    jídla se vydávají do čtyř odpoledne; na terase dostanete jídlo i pití,
    v pivní zahradě jen nápoje — vlastní svačinu si tam ale host přinést
    smí.
  - >-
    Otevřeno je od středy do neděle, v pondělí a v úterý má dům zavírací
    den. To je na tak navštěvovaném vrcholu podstatná informace: kdo přijde
    v pondělí, najde zavřeno a nejbližší občerstvení má daleko.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní web domu se nám zatím
    nepodařilo načíst, takže z něj necitujeme, a katalog navíc vede jinou
    doménu než mapa — která z nich je ta platná, jsme neověřili. Polohu
    nese OpenStreetMap. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
