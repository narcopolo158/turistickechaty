    Kontakty se nevedou — zavřený dům žádné veřejné nemá.
  verified: false
  checked: '2026-08-04'

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský dům v 1360 metrech pod vrcholem Velkého Roklanu, druhé nejvyšší
  hory Šumavy — v současnosti mimo provoz kvůli přestavbě; mapové
  podklady mluví o plánovaném otevření v roce 2026. Kdo jde na Roklan,
  s občerstvením tu zatím počítat nemůže.
text:
  - >-
    Waldschmidthaus stojí těsně pod holým vrcholem Velkého Roklanu
    (Großer Rachel), druhé nejvyšší hory celé Šumavy s Bavorským lesem —
    a pro výstupy od Spiegelau je to poslední budova pod vrcholem.
    Právě proto je jeho dnešní stav podstatná informace: dům je mimo
    provoz kvůli přestavbě.
  - >-
    Katalog, ze kterého vycházíme, vede dům jako uzavřený a bez noclehu;
    mapová poznámka mluví o plánovaném otevření po přestavbě v roce 2026
    a regionální tisk psal o novém návrhu domu. Kdy se skutečně otevře
    a co nabídne, žádný z našich pramenů neříká — před túrou na Roklan
    počítejte s tím, že občerstvení tu není.
  - >-
    Údaje na téhle stránce pocházejí z externího katalogu a z poznámek
    v OpenStreetMap; z regionálního tisku známe jen titulek, článek jsme
    nečetli. Polohu nese OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
zdroje:
  - popis: >-
      Externí katalog turistických chat ČR/SK 2026 — řádek HUT-0288
      (1360 m, Spiegelau, uzavřená / bez noclehu)
    url: https://nocleh.kct.cz/chaty
  - popis: >-
      OpenStreetMap — GPS, poznámka „geplante Eröffnung nach Umbau 2026"
      (ODbL)
    url: https://www.openstreetmap.org/way/128973305
  - popis: >-
      PNP (Passauer Neue Presse) — titulek „Neuer Entwurf für das
      Waldschmidthaus auf dem Großen Rachel"; obsah nečten
    url: https://www.pnp.de/lokales/landkreis-regen/neuer-entwurf-fuer-das-waldschmidthaus-auf-dem-grossen-rachel-15533362
interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/waldschmidthaus.yaml triáží Tier 1
  (4. 8. 2026). Klíč zařazení: dům s turistickou rolí pod vrcholem druhé
  nejvyšší hory pohoří — dle rozhodnutí Michala z 26. 7. 2026 se
  turistická minulost počítá, stav mimo provoz se přiznává (týž vzor
  jako Nad Łomniczką v Krkonoších, která se po letech rekonstrukce
  otevřela).

  K OVĚŘENÍ: skutečný stav přestavby a termín otevření (PNP článek
  načíst, až to půjde; případně bayerischer-wald-verein.de — dům
  historicky patří spolku, ale to NETVRDÍME, pramen chybí); historie
  domu (žádný načtený pramen). Až se otevře, přepnout stav a doplnit
  služby. Fotku dodá příští běh DATA-02.
