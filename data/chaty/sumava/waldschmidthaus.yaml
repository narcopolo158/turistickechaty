# Waldschmidthaus — povýšen z kandidáta DATA-01 triáží Tier 1 (4. 8. 2026).
# PRVNÍ ŠUMAVSKÝ PROFIL SE STAVEM MIMO PROVOZ: dům na Velkém Roklanu je
# zavřený kvůli přestavbě, plánované znovuotevření 2026 (OSM poznámka
# + titulek PNP). Povyšuje se dle rozhodnutí Michala z 26. 7. 2026
# o turistické minulosti — dům sloužil turistům a jeho stav je pro
# plánování túry na Roklan zásadní informace. Vše verified: false.

