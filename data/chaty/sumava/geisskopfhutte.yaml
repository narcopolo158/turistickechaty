# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec v 1097 metrech u horní stanice sedačkové lanovky na
  Geißkopfu, pár kroků od vyhlídkové věže. Občerstvení pro pěší
  i cyklisty; přespat se tu nedá.
text:
  - >-
    Geißkopf je domácí hora Bischofsmais mezi Bavorským lesem
    a Deggendorfem: v zimě lyžařský areál, v létě bikepark a výchozí
    bod pěších tras. Nahoře, ve výšce 1097 metrů, stojí Geißkopfhütte —
    obhospodařovaný horský hostinec u horní stanice šestimístné
    sedačkové lanovky. Dá se sem tedy dojít po svých, vyjet lanovkou
    a v zimě přijet na běžkách.
  - >-
    Hostinec nabízí občerstvení a pivo; nabídku ani otvírací hodiny
    žádný z pramenů neuvádí, a proto je tu neuvádíme ani my. Zato je
    doložené, co tu nenajdete: přespat se v hostinci nedá, portál
    regionu to říká výslovně. Kdo hledá nocleh, musí dolů do údolí.
  - >-
    Pár desítek metrů od domu stojí na vrcholu vyhlídková věž a za dobré
    viditelnosti je z ní vidět na hraniční hřebeny — Javor, Osser, Luzný,
    Roklan i Třístoličník. Trasy s délkami a převýšením najdete
    u přístupů níže.
  - >-
    Údaje na téhle stránce jsou z regionálního turistického portálu,
    z webu obce a z webu areálu; polohu a telefon nese OpenStreetMap.
    Vlastní stránky mimo profil na sociální síti dům nemá, takže
    otvírací dobu ani dějiny domu doložit neumíme. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
