interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/geisskopfhutte.yaml (7. 8. 2026).
  DO FRONTY SE OBJEKT DOSTAL PŘES JINÉHO KANDIDÁTA: `geisskopfturm`
  (rozhledna, 79 m odsud) měl jako doklad občerstvení právě tenhle
  hostinec. Křížové ověření ukázalo, že nositelem služby i jména je
  hostinec — povyšuje se tedy on, s typem `obsluhovana`. **Kandidát
  `geisskopfturm` se zatím NEPOVYŠUJE:** kdo věž provozuje a jestli
  patří k témuž provozu jako hostinec, žádný pramen neříká (na rozdíl
  od Kleti, kde to pramen výslovně vede). Věž je zmíněná v próze
  i v zajímavostech; kdyby se doložil společný provoz, sloučí se vzorem
  Kleti.

  OPRAVA VLASTNÍ CHYBY (8. 8. 2026): tahle poznámka dosud vedla kandidáta
  `berggasthof-geiss` jako „další kandidát NA TÉŽE HOŘE". Není to pravda
  — přeměřeno z GPS obou objektů je mezi nimi 5 955 m a jde o jiný kopec:
  Berggasthof Geiß stojí v Greisingu, místní části Deggendorfu, kdežto
  tenhle dům na Geißkopfu u Bischofsmais. Chyba vznikla z podobnosti jmen
  (Geiß × Geißkopf) a je to týž druh omylu jako u Haničky na Špičáku:
  tvrzení o poloze se dá přeměřit proti souřadnicím, které stejně máme.
  Kandidát `berggasthof-geiss` je 8. 8. 2026 VYŘAZEN — vlastní web
  provozovatele dokládá, že hostinský provoz ukončil.

  DALŠÍ PODNIKY V AREÁLU dle geisskopf.de: Forstgasthof (patří do fronty)
  a Eispavillon (zmrzlinárna, klíč zařazení nesplňuje).

  NOCLEH ZAPSÁN ZÁPORNĚ, což děláme jen výjimečně — portál regionu ho
  vylučuje výslovnou větou („Keine Übernachtungsmöglichkeit!"), ne
  mlčením. Vzor opačného postupu: Gibacht a Sonnenfels, kde se
  katalogové „ano" bez potvrzení nezapsalo vůbec.

  NEDOLOŽENO (nezapsáno): otvírací doba (nevede ji žádný pramen), rok
  vzniku a dějiny domu, jméno provozovatele mimo OSM (Roland
  Holdenrieder), sortiment kuchyně. Vlastní web dům nemá (jen profil na
  sociální síti) — kandidát na DATA-04, telefon +49 9920 336. Fotku
  dodá příští běh DATA-02.
