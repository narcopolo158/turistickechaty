# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Sedmatřicetimetrová věž na vrcholu Poledníku (1315 m) — za studené
  války přísně střežený armádní objekt namířený k hranici, od roku 1998
  rozhledna s expozicí o železné oponě. V sezóně u paty věže funguje
  kiosek; v zimě je zavřeno.
text:
  - >-
    Poledník je jedno z mála míst, kde se dá vystoupat nad šumavské
    hřebeny: věž měří 37 metrů a stojí na vrcholu vysokém 1315 metrů.
    Výhled si ale žádá sezónu — věž je kvůli extrémnímu počasí otevřená
    jen od května do října, v létě denně, na krajích sezóny o víkendech.
    Ve věži se platí vstupné.
  - >-
    Historie je tu hmatatelnější než u většiny rozhleden. Věž vyrostla
    v šedesátých letech dvacátého století jako armádní objekt v přísně
    střeženém pohraničním pásmu; popisy jejího přesného účelu se mezi
    prameny liší — mluví se o sledování provozu za hranicí,
    o odposlechu i o protivzdušné obraně. Po roce 1990 armáda odešla
    a z opuštěné věže se v roce 1998 stala rozhledna; od rekonstrukce
    v roce 2021 je v ní i malé infocentrum národního parku a expozice
    o železné oponě a o šumavském lese.
  - >-
    U paty věže stojí kiosek s občerstvením — klobásy, hermelín, nápoje;
    v provozu bývá v sezóně a jeho otvírací hodiny doložené nemáme.
    Nocleh tu žádný pramen nezmiňuje. Nejčastěji se sem chodí od Prášil
    nebo od Modravy; přesné trasy s délkami najdete u přístupů níže.
  - >-
    Údaje na téhle stránce pocházejí z turistických portálů
    a regionálního průvodce; polohu nese OpenStreetMap. Přesný rok
    stavby vojenské věže žádný z našich pramenů nevede a rok 1998 proto
    uvádíme jako otevření rozhledny, ne jako vznik stavby. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Kudy z nudy — výška vrcholu i věže, 227 schodů, sezóna a limity
      návštěvníků, historie armádního areálu, otevření 1998,
      rekonstrukce 2021 s infocentrem NP, provozovatel (načteno
      6. 8. 2026)
    url: https://www.kudyznudy.cz/aktivity/sumava-shora-z-rozhledny-polednik
  - popis: >-
      Šumava Net — 1315 m, věž 37 m, přestavba dokončena 1998, sezónní
      tabulka provozu, poloha 7 km jižně od Prášil, trasy z Prášil
      a Modravy (načteno 6. 8. 2026)
    url: https://www.sumavanet.cz/rozhledna-polednik.s-1362-REPRRE
  - popis: >-
      Regionální průvodce penzionu Helena — kiosek u paty věže, sezóna
      květen–říjen, krycí označení TOPAS (načteno 6. 8. 2026)
    url: https://www.pensionhelenahones.cz/vylety-na-sumave/rozhledna-polednik/
  - popis: OpenStreetMap (GPS věže, Kiosek Poledník 6 m od věže; ODbL)
    url: https://www.openstreetmap.org/way/244504465
interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/polednik.yaml triáží tagované fronty
  (6. 8. 2026). Klíč zařazení: rozhledna s doloženým občerstvením
  (rozhodnutí Michala 28. 7. 2026) — kiosek doložen dvěma nezávislými
  prameny (regionální průvodce + OSM). První šumavská rozhledna korpusu.

  ROZPOR SEZÓNY: Kudy z nudy a regionální průvodce vedou květen–říjen,
  Šumava Net tabulku květen–září. Zapsán souhlas dvou pramenů; ověřit
  u Správy NP (kandidát na DATA-04 — infocentrum NP Šumava Poledník).

  ROZPOR ÚČELU VOJENSKÉHO OBJEKTU: sledování/odposlech/rušička (Kudy
  z nudy) × základna protivzdušné obrany ČSSR (Šumava Net). Próza vede
  obě verze jako rozcházející se popisy, nerozhoduje.

  NEDOLOŽENO (nezapsáno): přesný rok stavby věže (60. léta bez roku —
  rokVzniku prázdný, vzorec kontinuity jako Proseč); vstupné číslem
  (mění se po sezónách; k 6. 8. 2026 vedla Kudy z nudy 60/30 Kč, věž
  s expozicemi 120/60 Kč — jen tady v poznámce); otvírací hodiny kiosku;
  kontakt (kandidátova URL npsumava.cz je homepage Správy NP, ne stránka
  věže — do kontaktů se nepsala). Vstupní čipový systém (turnikety,
  vratná záloha) vede jen Kudy z nudy. Fotku dodá příští běh DATA-02.
