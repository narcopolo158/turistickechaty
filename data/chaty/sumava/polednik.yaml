# ── Provoz ────────────────────────────────────────────────────────────────
# Sezónní věž na hřebeni NP — mimo sezónu je zavřeno kvůli extrémnímu
# počasí; kdo jde v listopadu, vyhlídku nedostane.
otviraciDoba: >-
  Sezónně od května do října: v červenci a srpnu denně, v květnu, červnu,
  září a říjnu jen o víkendech. V zimě zavřeno. Ve věži se platí vstupné.
overeniProvoz:
  source: >-
    Kudy z nudy (načteno 6. 8. 2026): přístupná „od května do října"
    kvůli „extrémním klimatickým podmínkám" — květen–červen
    a září–říjen jen víkendy, červenec–srpen denně; uvnitř nejvýš 50
    osob, na vyhlídce 10. Regionální průvodce (pensionhelenahones.cz,
    načteno 6. 8. 2026) sezónu květen–říjen potvrzuje. Šumava Net vede
    v tabulce provoz od května do září — jestli je říjnový provoz
    novinka, nebo se prameny jen liší, nevíme; zapsán souhlas dvou
    pramenů, rozpor poznamenán. Výše vstupného se nezapisuje (mění se
    po sezónách; oba prameny ji k datu načtení vedou). Provozovatel
    dle Kudy z nudy: Informační středisko NP Šumava Poledník.
  verified: false
  checked: '2026-08-06'

# ── Historie ──────────────────────────────────────────────────────────────
# rokVzniku SE NEVYPLŇUJE: věž vyrostla v 60. letech 20. století jako
# armádní objekt (přesný rok žádný pramen nevede) a rozhledna z ní je od
# roku 1998 — zapsat 1998 jako rok vzniku by zamlčelo starší stavbu (týž
# vzorec kontinuity jako u čtveřice Proseč/Prášily/Turnerova/Mooshütte).
milniky:
  - rok: 1998
    udalost: >-
      Dokončena přestavba opuštěné vojenské věže na vyhlídkovou věž
      s rozhlednou
  - rok: 2021
    udalost: >-
      Po rekonstrukci přibylo ve věži malé infocentrum Národního parku
      Šumava
overeniHistorie:
  source: >-
    Kudy z nudy (načteno 6. 8. 2026): areál vznikl v 60. letech
    20. století jako armádní základna, sloužil „ke sledování leteckého
    a pozemního provozu v sousedním Německu" a jako „odposlechová stanice
    a rušička signálu"; do roku 1989 ležel v přísně střežené pohraniční
    zóně, po roce 1990 armáda odešla, rozhledna otevřena 1998,
    rekonstrukce s infocentrem NP 2021. Šumava Net (načteno 6. 8. 2026)
    vede týž rok 1998, vojenský účel ale popisuje jako „základnu
    protivzdušné obrany ČSSR" — popisy účelu se mezi prameny liší,
    přesný rok stavby nevede žádný.
  verified: false
  checked: '2026-08-06'

