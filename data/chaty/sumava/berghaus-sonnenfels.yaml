# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec v 1150 metrech na lohberské straně Velkého Javoru —
  bavorská kuchyně, pivní zahrada se sluneční terasou a sezónní provoz
  v létě i během zimního lyžování. Jeden z nejstarších hostinců na
  javorském masivu; přesný letopočet ale naše prameny nedávají.
text:
  - >-
    Berghaus Sonnenfels stojí vysoko nad Lohbergem na cestě k Velkému
    Javoru (Großer Arber) — kdo stoupá na nejvyšší horu Šumavy
    a Bavorského lesa od jihozápadu, má tu poslední hostinec před
    vrcholovou partií. Podle našich podkladů jde o jeden z prvních
    hostinců na javorském masivu vůbec; formulace pramene ale nedovoluje
    říct, od kterého roku přesně.
  - >-
    Kuchyně vede poctivá bavorská jídla a v létě láká pivní zahrada se
    sluneční terasou. Otevřeno je sezónně: od července do začátku
    listopadu a přes zimu od 20. prosince do konce března, kdy jede
    lyžařský provoz, denně od desíti do půl šesté. Jestli se tu dá
    přespat, naše prameny spolehlivě neříkají — katalog ubytování uvádí,
    podrobnější podklad ho nezmiňuje; před cestou za noclehem proto
    zavolejte. Elektrokolo si u domu nabijete na veřejné stanici.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní web domu jsme zatím
    nenačetli, takže z něj necitujeme. Polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
