# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná věž z roku 1905 na vrcholu Čerchova (1042 m) v Českém lese.
  Půl století stála v zakázaném pohraničním pásmu a veřejnost se k ní
  dostala až po roce 1989; dnes ji spravují domažličtí turisté a u paty
  se dá dát bramborák nebo halušky.
text:
  - >-
    Na Čerchov se chodí pro výhled a rozhlednu tu postavili dvakrát.
    První, dřevěnou, zvládli v roce 1894 za třiatřicet dní; dnešní
    kamennou věž stavěli o deset let později a slavnostně ji otevřeli
    16. července 1905. Nahoru vede 129 schodů.
  - >-
    Dvacáté století bylo k vrcholu tvrdé. V roce 1938 ho zabralo
    německé vojsko, od roku 1950 tu seděla pohraniční stráž a Čerchov
    se pro turisty na desítky let zavřel — dnešní návštěvník míjí
    cestou k věži i mnohem vyšší betonovou vojenskou věž z té doby.
    Otevřelo se to až po roce 1989 a v roce 1999 dostal věž zpátky
    domažlický odbor Klubu českých turistů, který ji následující rok
    zrekonstruoval a 1. července 2000 znovu otevřel. Provoz vede
    dodnes.
  - >-
    Věž je otevřená v sezóně: v červenci a srpnu denně, v květnu,
    červnu, září a říjnu jen o víkendech, vždy od deseti do pěti;
    platí se vstupné. U paty stojí občerstvení s chodskou kuchyní —
    koláče, bramboráky, halušky, klobásy a čepované pivo. Přespat se
    tu nedá, žádný pramen nocleh nezmiňuje. Trasy s délkami
    a převýšením najdete u přístupů níže.
  - >-
    Údaje na téhle stránce jsou z vlastního webu věže, z turistických
    portálů a z rozhlednového katalogu; polohu nese OpenStreetMap.
    Výšku věže neuvádíme číslem — prameny se rozcházejí mezi
    devatenácti metry a čtyřiadvaceti, které vede mapový podklad.
    Nedaleko věže stojí ještě Chata Čerchov; jestli je to týž provoz,
    nebo soused, jsme z pramenů nezjistili, a proto ji vedeme zvlášť.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
