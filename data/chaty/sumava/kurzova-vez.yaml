interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/kurzova-vez.yaml triáží tagované
  fronty (7. 8. 2026). Klíč zařazení: rozhledna s doloženým občerstvením
  (rozhodnutí Michala 28. 7. 2026) — hospůdka doložena třemi prameny
  (vlastní web, Rozhlednový svět, OSM).

  ROZSAH ROZHODNUT: Michal 7. 8. 2026 — „Kleť i Čerchov určitě zařaď".
  Čerchov je Český les, ne Šumava v užším smyslu; do oblasti `sumava`
  patří stejným způsobem jako Šumavské podhůří (Svatobor, Javorník).
  Koráb a Libín Michal týmž dechem odložil („prověřím") — ty ve frontě
  dál čekají.

  CHATA ČERCHOV JE ZATÍM ZVLÁŠŤ: kandidát `chata-cerchov` (OSM
  restaurant, 64 m od věže) se nepovyšuje. Vlastní web věže hospůdku
  uvádí mezi svými službami, Rozhlednový svět mluví o samostatném
  občerstvení „nedaleko rozhledny" a Kudy z nudy o „Horské chatě
  Čerchov" v okolí — jestli jde o jeden provoz (vzor Žalý/Svatobor),
  nebo o dva sousedy, prameny nerozhodují. NEROZHODOVAT bez pramene;
  kandidát na DATA-04, jeden telefonát na +420 722 166 875 to zavře.

  ROZPOR VÝŠKY VĚŽE (proto nikde číslem): 19 m dle vlastního webu,
  19,2 m dle Rozhlednového světa, 24 m dle OSM. Próza mluví o rozporu
  nahlas. Model pro výšku věže pole nemá.

  ROZPOR VÝŠKY VRCHOLU: 1042 m (vlastní web + Kudy z nudy) × 1036 m
  (Rozhlednový svět) — zapsáno 1042 dle dvou shodných.

  OBEC NEJISTÁ: vlastní web vede poštovní adresu „344 01 Pec", katastr
  vrcholu ale spadá pod Českou Kubici. Zapsána Česká Kubice, rozpor
  poznamenán — souvisí s otevřenou otázkou DATA-20 (co pole `obec`
  vlastně znamená: katastr, poštovní adresa, nebo nejbližší sídlo).

  NEDOLOŽENO (nezapsáno): nocleh (žádný pramen), sortiment a otvírací
  doba hospůdky, vstupné číslem, rok postavení vojenské betonové věže,
  co přesně obnáší revitalizace od roku 2021. Známka č. 341 je zatím
  jen zajímavost — do sběratelské vrstvy ji zařadí DATA-22. Fotku dodá
  příští běh DATA-02.
