# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bývalá armádní odposlechová věž na Schwarzrieglu (1079 m), na hřbetu
  Hohen Bogen nad Rimbachem. Od roku 2014 na ni vede vnější schodiště
  a v padesáti metrech je vyhlídková plošina; v areálu jsou tři místa,
  kde se dá najíst.
text:
  - >-
    Hohen Bogen je osmikilometrový hřbet nad Rimbachem s pěti vrcholy;
    na tom hlavním, Schwarzrieglu ve výšce 1079 metrů, stojí
    pětasedmdesát metrů vysoká věž. Ta tu nestojí kvůli výhledu — je to bývalé
    vojenské zařízení namířené přes blízkou hranici, dnes památkově
    chráněné. V roce 2014 dostala vnější schodiště a od té doby se po
    něm dá vyjít na vyhlídkovou plošinu v padesáti metrech, kterou
    prameny popisují jako čtyřsetmetrovou plochu s výhledem do všech
    stran.
  - >-
    Kdy věže vyrostly a co přesně odposlouchávaly, žádný z našich
    pramenů neříká, a tak to neuvádíme ani my. Kdo zná Poledník na
    šumavském hřebeni, uvidí tu ale zrcadlový obraz z druhé strany
    hranice: armádní stavba, kterou po konci studené války otevřeli
    turistům.
  - >-
    Nahoru se dá dojít pěšky — od parkoviště u služební chaty je to asi
    pět kilometrů, od horní stanice sedačkové lanovky sotva kilometr.
    V areálu fungují tři místa k zastavení: horský hostinec s pivní
    zahradou, hostinec u horní stanice lanovky a chata u parkoviště;
    vedeme je zvlášť, protože s věží nemají společný provoz. Ve věži se
    nespí a vstup na plošinu je placený. Trasy s délkami a převýšením
    najdete u přístupů níže.
  - >-
    Údaje na téhle stránce jsou z regionálních turistických portálů;
    polohu nese OpenStreetMap. Otvírací dobu záměrně neuvádíme —
    prameny popisují dva neslučitelné režimy, celoroční provoz s pevnými
    hodinami proti sezóně od jara do podzimu s přístupem od východu do
    západu slunce. Také počet schodů se mezi nimi liší. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
