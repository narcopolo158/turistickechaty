interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/sektor-f-hauptturm.yaml triáží
  tagované fronty (7. 8. 2026). Klíč zařazení: rozhledna s doloženým
  občerstvením (rozhodnutí Michala 28. 7. 2026) — v areálu tři podniky
  dle regionálního portálu plus pivní zahrada 48 m dle OSM.

  JMÉNO: ponecháno v podobě z OSM („sektor.f Hauptturm"), protože tak
  se jmenuje projekt provozovatele; české popisné jméno je v aliasech.
  Kdyby Michal chtěl jinou primární podobu, je to jednořádková změna.

  SOUSEDÉ VE FRONTĚ: kandidáti `berghaus-hohenbogen`
  a `forstdiensthutte-hohen-bogen` v korpusu jsou a čekají na triáž;
  „Berggasthof Schönblick" z portálu mezi kandidáty NENÍ — patří
  k dohledávce.

  ROZPOR PROVOZU (proto otviraciDoba prázdná): celoročně 9–18 h
  s obsluhovaným vstupným (portál Bayerischer Wald) × březen–listopad
  od východu do západu slunce s automatem (Sehenswerter). Vypadá to na
  starší a novější stav, doložit to neumíme. ROZPOR POČTU SCHODŮ: 290
  (portál) × 239 (Sehenswerter) — do prózy ani zajímavostí se číslo
  nezapsalo.

  NEDOLOŽENO (nezapsáno): rok stavby věží a jejich přesný účel (žádný
  pramen; „NATO" je jediné, co se o původu říká), nocleh, kontakt na
  provozovatele mimo adresu. Vlastní web projektu (sektor-f.de) se
  načetl jen v části „Anfahrt" — čísla ani hodiny na ní nejsou. Fotku
  dodá příští běh DATA-02.
