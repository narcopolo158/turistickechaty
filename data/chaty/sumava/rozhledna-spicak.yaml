interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/rozhledna-spicak.yaml triáží tagované
  fronty (7. 8. 2026). Klíč zařazení: rozhledna s doloženým občerstvením
  (rozhodnutí Michala 28. 7. 2026) — kiosek doložen třemi prameny.

  VYŘEŠENA OTÁZKA Z TRIÁŽE („rozhledna-spicak souvisí s katalogovou
  Chatou na Špičáku, prověřit spolu"): NESOUVISÍ. Katalog vede „Chatu na
  Špičáku" (HUT-0106) ve výšce 865 m u Železné Rudy, tedy na úrovni
  střediska, kdežto věž stojí na vrcholu v 1202 m. Jsou to dva různé
  objekty; katalogová chata zůstává mezi čtyřmi katalogovými bez
  kandidáta.

  NÁLEZ PRO TRIÁŽ A OPRAVA VLASTNÍ PRÓZY: Regiontourist klade chaty
  Hanička (jídelna) a Blaženka (restaurace s barem) „na vrchol"
  a v prvním znění téhle stránky to po něm bylo převzato. Přeměření
  proti souřadnicím kandidáta `chata-hanicka` (49,1657 / 13,2208) to
  vyvrátilo: od věže je to 1,2 km a chaty stojí dole v areálu (adresa
  Špičák na Šumavě 182). Próza opravena týž den. `chata-hanicka` je
  odložena (viz `_odlozeno.yaml`), „Blaženka" v exportu chybí úplně.

  ROZPOR VSTUPNÉHO (proto nezapsáno ani do poznámky prózy jako číslo):
  Kudy z nudy 90/60 Kč × Regiontourist výslovně „zdarma". Možné
  vysvětlení je, že v ceně je jízda lanovkou, ale to je domněnka —
  kandidát na DATA-04 (+420 376 397 167).

  ROZPOR SEZÓNY: červen–září s víkendovým prodloužením do října (Kudy
  z nudy) × 15. 6.–15. 9. (Treking.cz). Denní hodiny se shodují,
  zapsány; rozsah sezóny přiznán slovy.

  ROZPOR JMÉNA PROVOZOVATELE: TJ Sportovní areál Špičák × areál
  Ski&Bike Špičák — nejspíš týž subjekt, netvrdíme to.

  NEDOLOŽENO (nezapsáno): starší rozhledna na Špičáku (žádný pramen
  o ní nemluví), sortiment a provozní doba kiosku, nocleh. Fotku dodá
  příští běh DATA-02.
