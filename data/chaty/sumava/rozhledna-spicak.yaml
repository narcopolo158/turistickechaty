# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Ocelová věž s dřevěným obložením z roku 2014 na vrcholu šumavského
  Špičáku (1202 m), padesát metrů od horní stanice lanovky. Pod ní stojí
  kiosek s občerstvením; spí se až dole v areálu.
text:
  - >-
    Rozhledna na Špičáku je mladá — otevřeli ji 26. července 2014, i když
    se o ní podle jednoho z pramenů mluvilo zhruba půl století předtím.
    Nakonec z ní není dřevěná stavba, jak se původně zamýšlelo, ale
    ocelová konstrukce s dřevěným obložením. Měří 26,5 metru, nahoru vede
    135 schodů a na plošinu smí najednou až šedesát lidí.
  - >-
    Vrchol je dobře dostupný: od horní stanice čtyřsedačkové lanovky je
    to k věži padesát metrů, takže sem dojdou i ti, kdo výstup nechtějí.
    Otevřeno bývá v letní sezóně, ve všední dny od devíti do pěti
    a o víkendech do šesti; kdy přesně sezóna končí, se prameny
    rozcházejí. Provoz vede sportovní areál Špičák.
  - >-
    Přímo pod rozhlednou stojí pojízdný kiosek s občerstvením; ve věži
    se nespí. Chaty Hanička a Blaženka, které jeden z pramenů klade na
    vrchol, ve skutečnosti stojí dole v areálu — od věže je to k nim víc
    než kilometr. Trasy s délkami a převýšením najdete u přístupů níže.
  - >-
    Údaje na téhle stránce jsou z turistických portálů; polohu nese
    OpenStreetMap. Vstupné neuvádíme záměrně — jeden pramen ho vede
    v korunách, druhý tvrdí, že se neplatí, a rozhodnout to bez dotazu
    na místě nejde. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
