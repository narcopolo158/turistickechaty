# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec ve Waldhäuser pod Luzným, v horské vsi, kterou portál
  regionu uvádí jako nejvýše položenou v Bavorském lese. Restaurace pro
  kolemjdoucí i pro nocující, třináct pokojů a nocleh na páté etapě
  Goldsteigu.
text:
  - >-
    Waldhäuser je horská ves na okraji Neuschönau; turistický portál
    regionu ji uvádí jako nejvýše položenou v celém Bavorském lese —
    tisíc metrů nad mořem. Stojí tu Berggasthof Lusen, pojmenovaný po
    domácí hoře: Luzný se zvedá k 1373 metrům přímo nad ním. Výšku
    samotného domu žádný pramen neuvádí, a tak ji tady nenajdete —
    odvozovat ji z výšky vsi nebo hory by znamenalo tvrdit víc, než
    čím jsme si jistí.
  - >-
    Restaurace je otevřená kolemjdoucím, ne jen hostům domu: turistický
    portál zve výslovně k zastavení „po túře nebo po skialpové cestě".
    Kuchyně jede od jedenácti do půl osmé, hostinec do desíti večer,
    a na jídelníčku stojí vedle bavorských specialit a zvěřiny také
    české moučníky — hraniční poloha se propisuje i do talíře. Mimo
    hlavní sezónu bývá zavřeno v pondělí až středu; pramen to nevede
    jako trvalé pravidlo, jen to tak má v konkrétních týdnech, takže
    kdo jede na podzim, ať radši zavolá.
  - >-
    Nocuje se ve třinácti pokojích — šest dvoulůžkových, tři
    jednolůžkové, tři třílůžkové a další na dotaz. Kolik je to lůžek
    dohromady, neuvádíme: sečíst to za pramen by byl počet, ne údaj.
    Dům se objevuje i v popisech dálkové trasy Goldsteig jako nocleh na
    konci pátého dne její severní varianty, a od Baumwipfelpfadu,
    stezky ve výšce korun stromů nad Neuschönau, je to sem blízko.
  - >-
    Rok stavby ani dějiny domu nevíme; nevede je ani vlastní web, ani
    regionální portály, a tak tu žádná historie není. Údaje na téhle
    stránce nesou turistické portály regionu a vlastní stránky hostince,
    polohu nese OpenStreetMap. Redakce nic neověřila vlastním dotazem
    ani návštěvou.
