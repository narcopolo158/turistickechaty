  VÝŠKA DOMU VĚDOMĚ PRÁZDNÁ. Rešerše našla jediné číslo — „915m"
  v titulku stránky gipfelbuch.online — ale tělo té stránky se
  opakovaně nenačetlo (HTTP 500), takže údaj nemá doklad v textu
  pramene a nezapisuje se. Doložené jsou jen výška VSI Waldhäuser
  (1000 m) a HORY Luzný (1373 m); ani jedno není výška hostince.
  Vzor: Kleť a Rozhledna Špičák, kde se výška stavby taky nedovozovala
  z okolí.

  POČET LŮŽEK VĚDOMĚ PRÁZDNÝ, ač jsou doložené pokoje. Součet lůžek
  z typů pokojů je výpočet, ne pramen, a u „Mehrbettzimmer auf Anfrage"
  by ani nevyšel. Kdyby ho někdo doložil, doplní se.

  NEDOLOŽENO (nezapsáno): rok stavby a dějiny domu, výška, počet lůžek,
  vzdálenost k Baumwipfelpfadu číslem (prameny říkají jen „poblíž").
  Provozovatelem je dle vlastního webu rodina Zarham — jméno je jen na
  vlastním webu, do prózy proto nejde. Kandidát na DATA-04: telefon
  +49 8553 2665 zavře výšku domu, počet lůžek i mimosezónní rozvrh.
  Fotku dodá příští běh DATA-02.
