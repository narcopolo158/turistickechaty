# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata na břehu Vydry uprostřed Povydří, nejnavštěvovanějšího říčního
  kaňonu Šumavy — restaurace s otevřeným krbem přímo u značené cesty,
  nocleh v pokojích i noclehárně. Na místě se hostí od roku 1888; dnešní
  chata stojí od roku 1934.
text:
  - >-
    Turnerova chata je zastávka, kterou mine málokdo: stojí přímo na
    břehu Vydry v Povydří, na značené cestě kaňonem mezi Antýglem
    a Čeňkovou Pilou, kudy proudí návštěvníci Šumavy už přes sto let.
    Hostinec tu stál od roku 1888; když v roce 1932 vyhořel, vyrostla na
    jeho místě do dvou let dnešní chata.
  - >-
    Uvnitř je restaurace s otevřeným krbem — poslední známý údaj mluví
    o provozu denně od deseti do deseti — a přespat se dá v pokojích pro
    dva až šest lidí nebo ve společné noclehárně. Čísla o kapacitě
    máme z pramene neznámého stáří, takže je před cestou za noclehem
    lepší ověřit telefonicky.
  - >-
    Údaje na téhle stránce pocházejí z Treking.cz a z externího katalogu;
    vlastní web chaty se nám zatím nepodařilo načíst, takže z něj
    necitujeme. Polohu nese OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
