# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata deggendorfské sekce alpského spolku na slunečné pasece v lese
  Greisinger Hochwald, v 910 metrech u rozcestí Hölzerne Hand. O víkendech
  ji otevírají dobrovolníci s kávou, koláčem a studenými nápoji; přespat
  tu lze jen při pronájmu celé chaty.
text:
  - >-
    Hochwaldhütte patří deggendorfské sekci Německého alpského spolku
    a stojí na pasece v lese Greisinger Hochwald nad Deggendorfem, poblíž
    rozcestí, kterému se říká Hölzerne Hand — dřevěná ruka. Není to dům
    s celotýdenním provozem: otevřeno bývá o sobotách a nedělích od
    dvanácti do pěti, kdy službu drží dobrovolníci ze spolku a příchozím
    nabídnou studené nápoje, kávu a koláč.
  - >-
    Víkendový režim platí od ledna do března a od května do října;
    v listopadu a prosinci je chata mimo provoz a o dubnu naše prameny
    mlčí, takže na jarní přechod je jistější počítat se zavřeno. Přespat
    se tu dá, ale jen když si skupina pronajme celou chatu — jsou v ní
    dvě společné ložnice, vytápěná a nevytápěná, a pronajatý dům funguje
    bez přítomnosti správce. Kdo jde kolem, nocleh tu nesežene.
  - >-
    Údaje na téhle stránce pocházejí z vlastní stránky sekce alpského
    spolku a z OpenStreetMap, odkud je i poloha; telefonní číslo se mezi
    těmito prameny liší a vedeme to z vlastní stránky sekce. Historie
    chaty doložená není. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
zdroje:
  - popis: >-
      Vlastní stránka sekce DAV Deggendorf — poloha u Hölzerne Hand,
      910 m, víkendový provoz s časy, občerstvení dobrovolníky, ložnice
      a pravidlo pronájmu celé chaty, kontakty (načteno 6. 8. 2026)
    url: https://www.alpenverein-deggendorf.de/huetten
  - popis: OpenStreetMap (GPS, provozovatel, otvírací doba v tagu; ODbL)
    url: https://www.openstreetmap.org/way/183964702
interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/hochwald-hutte.yaml triáží tagované
  fronty (6. 8. 2026). Klíč zařazení: obsluhovaná spolková chata
  s doloženým víkendovým občerstvením pro veřejnost (káva/koláč/nápoje
  od dobrovolníků), na pasece u rozcestí Hölzerne Hand. PRVNÍ šumavský
  profil mimo externí katalog.

  Dva nezávislé prameny (vlastní stránka sekce + OSM) se shodují na
  provozovateli i otvíračce — konstelace bezpečnější než katalogové
  „ano" bez druhého pramene.

  K OVĚŘENÍ: historie a rok vzniku (žádný pramen); telefon (OSM
