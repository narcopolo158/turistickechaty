# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský dům z roku 1932 v 1315 metrech pod vrcholem Großer Falkenstein —
  čtyřicet lůžek ve čtyřlůžkových pokojích (jen na telefonickou rezervaci
  den předem), bavorská kuchyně a výhledy na Javor, Ostrý i Roklan. Po
  kompletní přestavbě otevřeno od září 2019.
text:
  - >-
    Falkensteinschutzhaus stojí těsně pod vrcholem Großer Falkenstein
    v rozšířeném území Národního parku Bavorský les, na trase hřebenových
    přechodů mezi Železnorudskem a Roklanem. Dům postavil v roce 1932
    Bavorský lesní spolek; v roce 1987 k němu přibyla kaple svatého
    Františka a v roce 2019 prošel kompletní přestavbou — otevřeno bylo
    znovu v září.
  - >-
    Uvnitř je čtyřicet lůžek v deseti čtyřlůžkových pokojích — přespat se
    tu ale dá jen po telefonické rezervaci nejpozději den předem do pěti
    odpoledne, s čímž je při plánování přechodu potřeba počítat. Lokál
    pro zhruba sto hostů vede tradiční bavorská jídla, domácí koláče
    a zmrzlinu. Z okolí domu se otevírají výhledy na Velký Javor, Ostrý,
    Roklan i na Zwiesel v údolí.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; z vlastního webu domu zatím
    necitujeme. Polohu nese OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
