# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná věž z roku 1938 na vrcholu Javorníku (1066 m), pojmenovaná po
  spisovateli Karlu Klostermannovi. Když ji přerostl les, dostala
  nástavbu a od roku 2003 se z ní zase kouká; pod věží stojí stánek
  s občerstvením a lavice k posezení.
text:
  - >-
    Javorník je nejvyšší kopec širokého okolí a rozhledna na něm stojí
    už od roku 1938. Postavili ji podle projektu sušického architekta
    Karla Houry a slavnostně zpřístupnili 28. srpna toho roku — od
    položení základního kamene uplynulo osmašedesát dní. Nápad je ale
    starší: sešli se kvůli němu přátelé spisovatele Karla Klostermanna
    už v roce 1914 a jejich schůzi tehdy ukončila mobilizace.
  - >-
    Dějiny se pak k věži chovaly nevlídně. Po záboru pohraničí na
    podzim 1938 vedla hranice jen pár metrů od ní a za války z ní
    německá armáda hlídkovala proti letadlům. Později rozhlednu
    přerostl les a výhled zmizel — kdy přesně se zavřela, si prameny
    protiřečí, jeden mluví o konci sedmdesátých let, druhý o roce
    1997. Znovu se otevřela 5. července 2003, kdy nad původní střechu
    přibyla nová vyhlídková plošina; věž tím povyrostla ze zhruba
    pětadvaceti metrů na dnešních necelých čtyřicet. Nahoru vede 197
    schodů.
  - >-
    Pod věží je stánek s občerstvením a lavice, kde se dá posedět;
    nocleh přímo na místě nikdo nenabízí. Rozhlednu spravuje obec Vacov
    spolu s Nadačním fondem Karla Klostermanna a vstupné se platí.
    Trasy s délkami a převýšením najdete u přístupů níže.
  - >-
    Údaje na téhle stránce jsme převzali z obecních stránek a portálů
    o rozhlednách; polohu nese OpenStreetMap. Otvírací dobu záměrně
    neuvádíme — prameny popisují dva neslučitelné režimy provozu
    (sezónní rozvrh s obsluhou proti dennímu přístupu s bezhotovostním
    odbavením) a který z nich platí, nevíme. Před cestou se vyplatí
    zavolat. Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
