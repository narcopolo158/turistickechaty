# ── Provoz ────────────────────────────────────────────────────────────────
# otviraciDoba SE NEVYPLŇUJE: prameny popisují dva neslučitelné režimy
# (obsluha se sezónním rozvrhem × denní přístup s bezhotovostním
# odbavením) — viz overeniProvoz a interní poznámky. Vzor Kötztinger
# Hütte a Svatoboru: raději nic než jeden ze dvou rozporných rozvrhů.
overeniProvoz:
  source: >-
    Web obce Vacov, stránka provozní doby (vacov.cz, načteno
    7. 8. 2026): celoroční sezónní rozvrh s obsluhou — od dubna do
    října denně či o víkendech s polední přestávkou ve všední dny,
    od listopadu do března jen o víkendech a svátcích; u rozvrhu je
    telefonní kontakt na správkyni. InfoČesko (načteno 7. 8. 2026)
    vede užší rozvrh jen pro červen až září a dodává, že za
    nepříznivého počasí bývá zavřeno. Obecní web osady Javorník
    (javorniksumava.cz, načteno 7. 8. 2026) proti tomu popisuje denní
    přístup od 5 do 19 hodin v dubnu až září a od 7 do 17 hodin
    v říjnu až březnu, se vstupným placeným výhradně bezhotovostně —
    to je jiný provozní režim než rozvrh s obsluhou. Rozvrhy se
    neslučují a který platí dnes, z pramenů nepoznáme; do
    `otviraciDoba` se proto nezapsal žádný. Vstupné se nezapisuje
    (mění se a prameny se v něm rovněž rozcházejí). Provozovatel:
    obec Vacov dle OSM i hrady.cz, na správě se podílí Nadační fond
    Karla Klostermanna dle vacov.cz i javorniksumava.cz.
  verified: false
  checked: '2026-08-07'

