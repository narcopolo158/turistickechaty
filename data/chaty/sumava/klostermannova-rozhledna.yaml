interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/klostermannova-rozhledna.yaml triáží
  tagované fronty (7. 8. 2026). Klíč zařazení: rozhledna s doloženým
  občerstvením (rozhodnutí Michala 28. 7. 2026) — bufet pod věží doložen
  třemi nezávislými prameny (Regiontourist, InfoČesko, OSM).

  ROZSAH: Javorník u Vacova leží v Šumavském podhůří, ne na hlavním
  hřebeni — týž precedens jako Svatobor (6. 8.) a Frýdlantské výšiny
  v Jizerkách. Kdyby Michal rozhodl jinak, přesun do DATA-29.

  ROZPOR PROVOZNÍ DOBY (proto otviraciDoba prázdná): vacov.cz vede
  celoroční sezónní rozvrh s obsluhou a vstupným 30/10 Kč,
  javorniksumava.cz denní přístup 5–19 h (IV–IX) / 7–17 h (X–III)
  s bezhotovostním vstupným 50 Kč kartou nebo 60 Kč SMS, InfoČesko
  rozvrh jen pro VI–IX se vstupem přes správkyni. Vypadá to na starší
  a novější stav (obsluha × turniket), ale doložit to neumíme.
  KANDIDÁT NA DATA-04: jeden telefonát na +420 733 666 495 zavře
  otvíračku i to, zda bufet pod věží funguje sezónně, nebo jen o
  víkendech.

  ROZPOR VÝŠKY VRCHOLU: 1066 m (vacov.cz, hrady.cz, javorniksumava.cz,
  Regiontourist) × 1089 m (InfoČesko) — zapsáno 1066 dle čtyř shodných.

  ROZPOR PŮVODNÍ VÝŠKY VĚŽE: 24 m (vacov.cz) × 25 m (hrady.cz); dnešní
  39,6 m (javorniksumava.cz, InfoČesko) × „téměř 40 m" (Regiontourist)
  × 39 m dle OSM — próza proto mluví o „necelých čtyřiceti metrech"
  a číslo se do pole nezapisuje (pole pro výšku věže model nemá).

  ROK UZAVŘENÍ kvůli vzrostlému lesu: konec 70. let (hrady.cz) × 1997
  (vacov.cz) — do milníků nezapsán.

  NEDOLOŽENO (nezapsáno): nocleh na místě (žádný pramen; Regiontourist
  vypisuje jen ubytování v okolí), sortiment a otvírací doba bufetu,
  vstupné číslem. Vlastní doména javornik.cz se ze sandboxu nenačetla
  (404 na všech nalezených cestách) — proto je v kontaktech obecní web
  osady. Fotku dodá příští běh DATA-02.
