# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1938
milniky:
  - rok: 1914
    udalost: >-
      Schůze přátel spisovatele Karla Klostermanna, na níž měl padnout
      návrh na stavbu rozhledny, skončila předčasně kvůli vyhlášení
      mobilizace
  - rok: 1938
    udalost: >-
      Kamenná věž postavena podle projektu sušického architekta Karla
      Houry a 28. srpna slavnostně zpřístupněna
  - rok: 2003
    udalost: >-
      Po nástavbě nové vyhlídkové plošiny znovuotevřena 5. července
overeniHistorie:
  source: >-
    hrady.cz (načteno 7. 8. 2026): stavba zahájena 21. června 1938,
    slavnostně zpřístupněna 28. srpna 1938; projekt architekta Karla
    Houry ze Sušice; stavbu zaplatila veřejná sbírka spolu se sušickým
    odborem Klubu českých turistů a kašperskohorskou skupinou Národní
    jednoty pošumavské; zárodkem myšlenky byla schůze Klostermannových
    přátel v roce 1914, přerušená mobilizací; za okupace sloužila věž
    jako protiletadlová pozorovatelna; nadační fond vznikl 2001, práce
    začaly v září 2002 a znovuotevřeno bylo 5. července 2003. Web obce
    Vacov (načteno 7. 8. 2026) vede tytéž letopočty 1938 / 2001 / 5. 7.
    2003 a dodává, že po záboru pohraničí v říjnu 1938 vedla hranice
    pár metrů od věže. Obecní web osady Javorník (načteno 7. 8. 2026)
    uvádí, že stavba trvala 68 dní. Kdy věž kvůli vzrostlému lesu
    přestala sloužit, si prameny odporují (konec 70. let dle hrady.cz
    × rok 1997 dle vacov.cz) — do milníků se proto rok uzavření
    nezapisuje.
  verified: false
  checked: '2026-08-07'

