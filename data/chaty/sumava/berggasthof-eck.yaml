# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec v sedle Eck mezi Kaitersbergem a javorským masivem —
  bývalý horský statek, který je od roku 1871 v rukou jedné rodiny.
  Bavorská kuchyně, pivní zahrada, pokoje i pro turisty se psem; přímo
  odtud startuje etapa Goldsteigu na Velký Javor.
text:
  - >-
    Berggasthof Eck stojí v sedle Eck, kudy prochází silnička mezi
    Arrachem a Zellertalem — a hlavně kudy vede Goldsteig: přímo odtud
    startuje jeho etapa přes hřeben na Velký Javor a opačným směrem se
    po hřebeni Kaitersbergu dojde ke Kötztinger Hütte. Pro přechody
    západní části hor je to přirozené místo, kde začít nebo skončit den.
  - >-
    Dům je bývalý horský statek a od roku 1871 ho drží jedna rodina.
    Přespat se dá v jednolůžkových, dvoulůžkových a třílůžkových
    pokojích — jsou tu i pokoje pro turisty se psem; kolik lůžek dům má
    celkem, naše podklady nevedou, nocleh proto domluvte předem. Kuchyně
    vede poctivá bavorská jídla a v létě se sedí v pivní zahradě.
    Elektrokolo si u domu nabijete zdarma.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní web domu jsme zatím
    nenačetli, takže z něj necitujeme. Polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
