interniPoznamky: >-
  Povýšeno sloučením kandidátů `horska-chata-klet` a `josefova-vez`
  (7. 8. 2026). JEDEN PROFIL, vzor Žalý / Královka / Svatobor / Pancíř:
  Kudy z nudy jmenuje jako provozovatele rozhledny Horskou chatu Kleť
  a vlastní doména se sama představuje jako „horská chata, rozhledna,
  penzion a hostel Kleť". Kandidát `josefova-vez` se samostatně
  nepovyšuje.

  ROZSAH ROZHODNUT: Michal 7. 8. 2026 — „Kleť i Čerchov určitě zařaď".
  Kleť je Blanský les. Souvisí s poznámkou u lanovek v SUMAVA-TRIAZ
  (LD Krasetín–Kleť se do přehledu vypisuje právem). Koráb a Libín
  Michal odložil („prověřím") — ve frontě dál čekají.

  KANDIDÁT `chata-pod-kleti` NENÍ TATO CHATA: leží 2,3 km severně
  (48,884 / 14,295), je to samostatný objekt a zůstává ve frontě.

  ROZPORY (proto nezapsáno číslem): výška věže 18 m (Kudy z nudy) ×
  19 m (Regiontourist) × 20 m (NPÚ) × „12;18" dle OSM — model pro
  výšku věže pole nemá, próza ji neuvádí. Jméno stavitele: Jan Nepomuk
  (Regiontourist) × Josef (NPÚ i Kudy z nudy) ze Schwarzenbergu — věž
  se jmenuje Josefova, ale to není doklad; próza mluví o knížecí
  rodině. Rok observatoře: 1937 (Regiontourist) × 1957–1958 (NPÚ) —
  do prózy šla observatoř bez roku a do milníků vůbec. Délka lanovky:
  1732 m (Kudy z nudy) × 1792 m (Regiontourist), převýšení 346 × 383 m
  — v zajímavosti je proto „kolem 1,8 kilometru". Výška vrcholu 1084 m
  (klet.com + Regiontourist) × 1083 m (Kudy z nudy).

  NEDOLOŽENO (nezapsáno): kapacita lůžek (žádný pramen), mimosezónní
  otvírací doba restaurace i celého areálu, vztah dnešní chaty
  k Tereziině chatě z roku 1925, provozovatel jako právní subjekt (OSM
  vede „Horská chata Kleť s.r.o.", jiný pramen to nepotvrzuje).
  KANDIDÁT NA DATA-04: jeden telefonát na +420 724 700 300 zavře
  kapacitu, mimosezónní provoz i otázku Tereziiny chaty. Fotku dodá
  příští běh DATA-02.
