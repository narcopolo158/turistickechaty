# ── Historie ──────────────────────────────────────────────────────────────
# rokVzniku SE NEVYPLŇUJE: areál má dvě stavby a dvě data — věž z roku
# 1825 a horskou chatu, kterou prameny kladou do roku 1925 pod jménem
# Tereziina chata. Že je dnešní Horská chata Kleť touž budovou, žádný
# pramen neříká; vybrat jeden rok by z toho v žebříčcích udělalo tvrzení,
# které doložené není (vzorec kontinuity jako Poledník nebo Mooshütte).
milniky:
  - rok: 1825
    udalost: >-
      Na vrcholu dokončena Josefova věž — nejstarší kamenná rozhledna
      v Česku; zprvu sloužila jen knížecí rodině a jejím hostům
  - rok: 1925
    udalost: >-
      Na vrcholu postavena roubená horská restaurace s ubytováním,
      Tereziina chata
overeniHistorie:
  source: >-
    Národní památkový ústav (zamek-ceskykrumlov.cz, načteno
    7. 8. 2026): věž stavěna v letech 1822–1825, v neogotickém slohu,
    roku 1925 k ní přibyla roubená horská restaurace Tereziina chata
    s ubytovacím zařízením. Regiontourist (načteno 7. 8. 2026) vede rok
    1825 i Terezinu chatu z roku 1925 shodně. Vlastní web areálu
    (klet.com, načteno 7. 8. 2026): stavbu inicioval kníže ze
    Schwarzenbergu už roku 1825, veřejnosti se věž otevřela až
    v sedmdesátých letech 19. století; Kudy z nudy (načteno
    7. 8. 2026) klade zpřístupnění do druhé poloviny téhož století.
    JMÉNO STAVITELE SI PRAMENY ODPORUJÍ — kníže Jan Nepomuk ze
    Schwarzenbergu (Regiontourist) × Josef ze Schwarzenbergu (NPÚ
    i Kudy z nudy); do milníku se proto zapsalo jen „knížecí rodina"
    a jméno se nedomýšlí. Že je dnešní Horská chata Kleť touž budovou
    jako Tereziina chata z roku 1925, netvrdí žádný pramen.
  verified: false
  checked: '2026-08-07'

