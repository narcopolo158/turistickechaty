# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Na vrcholu Kleti (1084 m) stojí hned tři stavby: kamenná rozhledna
  z roku 1825, horská chata s restaurací a noclehem a astronomická
  observatoř. Nahoru se dá vyjet i sedačkovou lanovkou z Krasetína.
text:
  - >-
    Vrchol Kleti je nezvykle obydlený. Stojí tu Josefova věž, kterou
    nechala knížecí rodina Schwarzenbergů dokončit v roce 1825 —
    kamenná rozhledna, na niž zprvu směli jen knížecí hosté;
    veřejnosti se otevřela až v druhé polovině devatenáctého století.
    Nahoru vede 110 schodů. O sto let později, v roce 1925, k ní
    přibyla roubená horská restaurace s ubytováním, Tereziina chata.
  - >-
    Dnešní Horská chata Kleť nabízí restauraci s jihočeskou kuchyní
    i nocleh ve dvou úrovních — pokoje s vlastním sociálním zařízením,
    nebo hostel; kolik má lůžek, žádný pramen neuvádí. Provozuje také
    samotnou rozhlednu, takže chata i věž jsou pro nás jedno místo.
    Vedle stojí ještě astronomická observatoř, známá objevy planetek
    a komet.
  - >-
    Vyjít se sem dá po značených cestách, nebo vyjet sedačkovou
    lanovkou z Krasetína, která tu jezdí od roku 1961 a je nejdelší
    lanovkou pro pěší v celém našem přehledu oblasti. Trasy s délkami
    a převýšením najdete u přístupů níže.
  - >-
    Údaje na téhle stránce jsou z vlastního webu areálu, z turistických
    portálů a ze stránek památkářů; polohu nese OpenStreetMap. Otvírací
    dobu neuvádíme jedním údajem — prameny popisují zvlášť letní provoz
    restaurace a zvlášť provoz věže, a co platí mimo sezónu, doložené
    nemáme; před cestou se vyplatí zavolat. Rok vzniku také ne: areál
    má dvě stavby a dvě data a že je dnešní chata touž budovou jako
    Tereziina chata z roku 1925, žádný pramen netvrdí. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Vlastní web areálu Kleť — výška vrcholu, restaurace s letní
