# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata z roku 1951 na jižním svahu Malého Javoru, v 1289 metrech —
  osmapadesát lůžek na vlastní spacák, teplá jídla a dvě sezóny v roce,
  léto a zima. Na jaře a na podzim je zavřeno.
text:
  - >-
    Chamer Hütte, kterou bavorské portály vedou i pod jménem Schutzhaus
    Kleiner Arber, stojí na jižním svahu Malého Javoru uprostřed přírodního
    parku Bavorský les. Vede k ní víc cest a všechny počítají s hodinou
    a půl až dvěma a půl hodinami chůze — autem se sem nedostanete.
  - >-
    Přespat se dá v pokojích pro víc osob, dohromady jich je osmapadesát;
    spacák si host přiváží vlastní. Kuchyň vydává teplá jídla a svačiny,
    takže i kdo jde jen kolem, se nají — na oběd je ale potřeba trefit se
    do otvírací doby, která je jen od jedenácti do pěti.
  - >-
    Rok má pro chatu dvě sezóny: od poloviny června do konce října a pak
    od Vánoc do konce března, pokaždé denně a bez zavíracího dne. Mezi nimi
    je zavřeno, takže na jarní ani podzimní túru se s ní počítat nedá.
    Dům je majetkem Svobodného státu Bavorsko a stará se o něj lyžařský
    klub z Bodenmais.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; stránku provozovatele se nám
    zatím nepodařilo načíst, takže z ní necitujeme. Polohu nese
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
