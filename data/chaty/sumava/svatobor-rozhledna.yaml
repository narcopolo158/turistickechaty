# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Rozhledna s horskou chatou na vrcholu Svatoboru (845 m) přímo nad
  Sušicí — dnešní věž i chata vyrostly za tři měsíce roku 1934, když se
  první věž z konce 19. století zřítila. V chatě se dá najíst i přespat
  (22 lůžek), na věž se vstupuje samoobslužným turniketem.
text:
  - >-
    Svatobor se zvedá přímo nad Sušicí a od města je to na vrchol zhruba
    hodina pěšky. Nahoře stojí vedle sebe rozhledna a horská chata —
    obojí patří od roku 1998 městu a obojí má společnou historii: první
    věž z konce devatenáctého století se postupně nakláněla, až se roku
    1934 zřítila, a ještě týž rok na jejím místě během tří měsíců
    vyrostla dnešní věž i s novou chatou. V letopočtech té první věže se
    naše prameny rozcházejí, a tak je neuvádíme; útulnu, která u ní
    stávala, zničil roku 1905 požár.
  - >-
    Věž měří 31,6 metru a na krytou vyhlídkovou plošinu ve 28 metrech
    vede 182 dřevěných schodů. Vstupuje se samoobslužným turniketem —
    platí se kartou nebo mincemi a hosté chaty mají vstup zdarma.
    V chatě je restaurace s pětatřiceti místy, letní terasou a českou
    kuchyní a k přespání 22 lůžek v deseti pokojích, některé s balkonem;
    koupelny jsou společné na patře a se zvířaty sem hosté nesmějí.
  - >-
    Otvírací hodiny věže i restaurace si naše prameny protiřečí, proto
    je neuvádíme — kdo sem plánuje cestu mimo letní víkend, ať si
    provoz ověří telefonicky předem.
  - >-
    Údaje na téhle stránce pocházejí z turistického portálu a z webu
    města Sušice; vlastní web areálu se nám zatím nepodařilo načíst,
    takže z něj necitujeme. Polohu nese OpenStreetMap. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Kudy z nudy — věž 31,6 m / 182 schodů / plošina 28 m, historie
      obou věží, chata (22 lůžek, 10 pokojů, restaurace 35 míst),
      turniket, kontakty (načteno 6. 8. 2026)
    url: https://www.kudyznudy.cz/aktivity/rozhledna-svatobor-u-susice-posvatne-misto-slova
  - popis: >-
      Web města Sušice — výška vrcholu 845 m, historie s odlišnými
      letopočty první věže, majetek města od 1998, kontakty a provozní
      doby (načteno 6. 8. 2026)
    url: https://www.mestosusice.cz/susice/fr.asp?tab=icsusice&id=56&burl=&pt=TUREAM
  - popis: Vlastní web areálu (zatím nenačten — necitujeme z něj)
    url: https://www.chatasvatobor.cz/
  - popis: OpenStreetMap (GPS věže, restaurace Svatobor 10 m; ODbL)
    url: https://www.openstreetmap.org/way/1086253212
interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/svatobor-rozhledna.yaml triáží
  tagované fronty (6. 8. 2026). Klíč zařazení: rozhledna s chatou —
  nocleh, restaurace i občerstvení pro příchozí doloženy dvěma prameny
  + OSM (vzor Královka: typ rozhledna, nocleh v areálu). POZOR ROZSAH:
  Svatobor je Šumavské podhůří nad Sušicí, ne Šumava sama — precedens
  Frýdlantské výšiny v Jizerkách (rozhledna nad městem v okně oblasti);
  kdyby Michal rozhodl jinak, přesunout do přesahové oblasti (DATA-29).

  ROZPORY přiznané: letopočty první věže (1898–1900 × 1895–1898);
  otvírací doby věže i restaurace (nezapsány). Kapacita 22 lůžek je
  z jediného pramene (Kudy z nudy), město vede jen „několik pokojů".

  K OVĚŘENÍ: vlastní web chatasvatobor.cz (ze sandboxu nenačten;
  kandidátova doména rozhlednasvatobor.cz vrací 403 — vztah obou domén
  neznáme, netvrdíme); provozovatel HOREST (e-mailová doména horest.cz
  — jen indicie, netvrdíme); GPS z OSM way rozhledny — ID převzato
  z kandidáta. Fotku dodá příští běh DATA-02.
