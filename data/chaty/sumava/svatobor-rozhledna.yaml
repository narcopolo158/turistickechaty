# ── Provoz ────────────────────────────────────────────────────────────────
# Otvírací doba se VĚDOMĚ NEZAPISUJE (vzor Kötztinger Hütte): prameny si
# odporují — Kudy z nudy vede rozhlednu denně 10–16 a restauraci čt–so
# 11–21, ne 11–17, web města (pro červenec–srpen) rozhlednu 10–18 a chatu
# po–čt 11–18, pá–so 11–20, ne 11–17. Vlastní web areálu se nenačetl —
# rozhodl by; do té doby próza posílá na telefon.
kontakty:
  telefon: '+420 605 418 433'
  email: svatobor@horest.cz
  web: https://www.chatasvatobor.cz/
overeniProvoz:
  source: >-
    Telefon +420 605 418 433 a e-mail svatobor@horest.cz shodně Kudy
    z nudy i web města Sušice (obojí načteno 6. 8. 2026); web areálu
    chatasvatobor.cz vedou také oba (nenačten — necitujeme z něj).
    Otvírací doby si prameny odporují (rozhledna denně 10–16 dle Kudy
    z nudy × 10–18 v červenci–srpnu dle města; restaurace čt–ne dle Kudy
    z nudy × celý týden dle města) — nezapisují se, před cestou ověřit.
    Na rozhlednu se vstupuje samoobslužným turniketem (platba kartou
    nebo mincemi, hosté chaty zdarma) dle Kudy z nudy; výše vstupného
    se nezapisuje. Rozhledna i chata jsou dle webu města od roku 1998
    majetkem města Sušice.
  verified: false
  checked: '2026-08-06'

# ── Historie ──────────────────────────────────────────────────────────────
# rokVzniku 1934 = dnešní věž i chata (shoda obou pramenů). Letopočty
# PRVNÍ věže si prameny odporují (1898–1900 × „stála v letech
# 1895–1898") — do milníků se proto první věž nepíše rokem, jen próza
# přiznává konec 19. století s rozporem.
rokVzniku: 1934
milniky:
  - rok: 1905
    udalost: Útulna u první věže zničena požárem
  - rok: 1934
    udalost: >-
      Nakloněná první věž se zřítila; na jejím místě během tří měsíců
      vyrostla dnešní rozhledna spolu s novou horskou chatou
overeniHistorie:
  source: >-
    Kudy z nudy (načteno 6. 8. 2026): první věž postavena „v letech 1898
    a 1900", přilehlá útulna 1905 zničena požárem, věž se nakláněla
    (1926 odchylka 102 cm) a roku 1934 se zřítila; nová věž s horskou
    chatou postavena 1934 za tři měsíce. Web města Sušice (načteno
    6. 8. 2026): „Původní kamenná věž stála v letech 1895–1898", nová
    věž postavena 1934 po zbourání poškozené — LETOPOČTY PRVNÍ VĚŽE SI
    PRAMENY ODPORUJÍ, shodují se na roku 1934 pro dnešní stavbu; do
    milníků jde jen shoda.
  verified: false
  checked: '2026-08-06'

