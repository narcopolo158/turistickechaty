interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/berghaus-hohenbogen.yaml (8. 8. 2026,
  plošná triáž koše NADĚJNÝCH). Klíč zařazení splněn: sto padesát míst
  a denní provoz po dobu provozu lanovky.

  VAZBA NA PUBLIKOVANÝ PROFIL sektor.f Hauptturm. Ten profil vede tenhle
  dům jako jeden ze tří podniků areálu („Berggasthof Schönblick s pivní
  zahradou, Berghaus Hohenbogen u horní stanice lanovky a Forstdiensthütte
  u parkoviště") s poznámkou, že je „vedeme zvlášť". Tímhle profilem se
  ta poznámka plní. Vzdálenost 826 m je SPOČÍTANÁ z GPS obou objektů, ne
  přebraná z pramene — a je to počítání, které se u nás dělá (vzor
  přeměření Haničky proti Špičáku ze 7. 8.). Zbývající dva podniky areálu
  (`berggasthof-schonblick` a `forstdiensthutte-hohen-bogen`) patří do
  fronty; druhý je v koši K POSOUZENÍ.

  DVA NEZAPSANÉ ÚDAJE, U KTERÝCH SE VÁŽILO. (1) Kapacita noclehu: portál
  obce dává 50 osob, portál Goldsteigu podle rešerše říká, že se
  rezervuje jen pro skupiny od 15 osob. To si neodporuje jen v čísle, ale
  v tom, KDO tu smí spát — a to se sečíst nedá, proto je pole prázdné.
  (2) Otvírací doba: nejpravdivější pramen je nejméně konkrétní („po dobu
  provozu lanovky"), takže pevné hodiny by profil zestárly hned se
  sezónou.

  DVĚ TELEFONNÍ ČÍSLA: +49 9947 464 (celý volnočasový areál dle impresa)
  a +49 9947 904270 (přímo Berghaus dle bayerischer-wald.org). Zapsáno
  druhé, jako přímější.

  NEDOLOŽENO (nezapsáno): výška domu, kapacita noclehu, otvírací doba,
  rok stavby a dějiny domu, sortiment kuchyně. Rok 1952 patří VYSÍLAČI na
  hřbetu, ne domu — v próze je to výslovně rozlišené. Kandidát na
  DATA-04: telefon +49 9947 904270 zavře nocleh pro jednotlivce, výšku
  i rozvrh. Fotku dodá příští běh DATA-02.
