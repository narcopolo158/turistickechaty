# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská hospoda u horní stanice sedačkové lanovky na hřbetu Hohen Bogen,
  sto padesát míst a terasa. Nocleh ve společných pokojích, ale prameny si
  odporují, jestli i pro jednotlivce.
text:
  - >-
    Hohen Bogen je asi osm kilometrů dlouhý hřbet s pěti vrcholy nad
    Neukirchenem u Svaté Krve, na české straně dobře viditelný z Českého
    lesa. Vrchol Schwarzriegel, který portál regionu uvádí jako nejvyšší
    z nich, měří 1079 metrů a nese bývalý spojovací stožár Luftwaffe;
    o pár set metrů dál stojí bývalá armádní odposlechová věž, kterou v našem průvodci vedeme zvlášť pod
    jménem sektor.f Hauptturm. Berghaus Hohenbogen stojí od té věže osm
    set dvacet šest metrů, přímo u horní stanice sedačkové lanovky —
    a je to on, kdo na tom hřbetu drží občerstvení.
  - >-
    Hospoda má sto padesát míst uvnitř a terasu, což je na horský dům
    kapacita nezvyklá; vysvětluje ji právě lanovka. Otevřeno je „po dobu
    provozu lanovky", jak to formuluje portál dálkové trasy Goldsteig —
    a to je zároveň důvod, proč tady žádné hodiny nenajdete. Portál obce
    uvádí letní provoz od deseti do pěti a zimní od devíti do čtyř,
    OpenStreetMap zase od půl desáté do pěti denně, ale pokud se dům
    opravdu řídí lanovkou, mění se rozvrh se sezónou a žádné z těch
    čísel neplatí trvale. Provozovatelem je podle impresa sama
    Hohenbogenbahn.
  - >-
    Spí se ve společných pokojích. Kolik lidí se sem vejde, si prameny
    protiřečí: portál obce mluví o noclehu až pro padesát osob, portál
    Goldsteigu podle naší rešerše naopak o rezervaci jen pro skupiny od
    patnácti lidí, tedy že jednotlivce dům neubytuje. Rozdíl je pro
    plánování túry podstatný, a tak zapisujeme jen to, na čem se
    shodnou — že se tu spí. Kdo jde sám a chce tu zůstat, ať zavolá
    dopředu.
  - >-
    Portál obce dům označuje za nejkrásnější horský dům Bavorského lesa;
    je to jeho vlastní tvrzení o vlastním objektu a žádný nezávislý
    pramen ho nepotvrzuje. Dějiny domu neznáme — rok 1952, který se
    v pramenech okolo objevuje, patří vysílači na hřbetu, ne téhle
    hospodě, a proto ho tu neuvádíme. Údaje na téhle stránce nesou web
    areálu, portál obce a portál Goldsteigu, polohu nese OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
