# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec ve 960 metrech přímo pod vrcholem Prölleru, na
  vrcholové cestě, která je zároveň úsekem Goldsteigu. Restaurace se
  třemi zavíracími dny v týdnu a nocleh ve dvanácti pokojích.
text:
  - >-
    Pröller je podle turistického portálu nejznámější hora okolí Sankt
    Englmar a Kollnburgu: 1048 metrů, vrcholová cesta, která je zároveň
    úsekem dálkové trasy Goldsteig, a v zimě lyžařský areál se čtyřmi
    vleky, jehož severní svah vede tentýž portál jako jeden
    z nejkrásnějších a nejdelších sjezdů Bavorského lesa. Necelých sto
    metrů pod vrcholem, ve výšce 960 metrů, stojí Berggasthof
    Hochpröller — a je to jeden z mála bavorských hostinců našeho
    fondu, u kterého pramen uvádí výšku domu, ne jen hory nad ním.
  - >-
    Hospoda má rozvrh, jaký si jídelna pro nocující nezavádí: pondělí
    večer, tři zavírací dny v řadě od úterý do čtvrtka, pak pátek od
    pěti, sobota od jedenácti a neděle do šesti. Právě ty tři zavírací
    dny jsou doklad, že jde o hospodu pro kolemjdoucí — věta, která by
    hosty zvala výslovně, na webu není, a tak to říkáme takhle, ne
    silněji. V prázdninách bývá otevřeno i v úterý a ve čtvrtek
    a zavírací den se přesouvá na středu.
  - >-
    Nocuje se ve dvanácti pokojích. Kolik je to lůžek, do profilu
    nezapisujeme — číslo se v pramenech objevuje, ale nepodařilo se ho
    doložit doslovnou citací, a tak zůstává jen tady v poznámce.
  - >-
    Pozor na jmenovce v sousedství: asi 1,1 kilometru odsud stojí
    Berghütte Zum Pröller, což je JINÝ objekt jiného provozovatele.
    Rok stavby ani dějiny domu neznáme, žádný pramen je nevede. Údaje
    na téhle stránce nesou vlastní web hostince a turistické portály
    regionu, polohu nese OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
