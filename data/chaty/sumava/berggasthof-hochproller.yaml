interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/berggasthof-hochproller.yaml
  (8. 8. 2026, plošná triáž koše NADĚJNÝCH). Klíč zařazení splněn: role
  na trase doložena Goldsteigem přes vrchol, občerstvení pro veřejnost
  rozvrhem se zavíracími dny.

  JMENOVEC V SOUSEDSTVÍ — DŮLEŽITÉ PRO PŘÍŠTÍ TRIÁŽ. Kandidát
  `berghutte-zum-proller` (koš K POSOUZENÍ) je JINÝ OBJEKT: provozuje ho
  dle rešerše Bärwurz Resl Service eG se sídlem Hinterviechtach 3,
  kdežto tenhle hostinec Klaus Altmann na Hinterviechtach 11. Vzdálenost
  obou objektů je 1130 m, spočítáno z GPS kandidátů. Táž firma
  vede podle svého webu tři chaty (Berghütte Pröller, Bärwurz-Resl-Hüttn
  a Wilderer Erdhütte) v rustikálním stylu s kapacitou okolo 26 osob —
  což vypadá na pronájem, ne na veřejnou hospodu. Souvisí to i s dalším
  kandidátem v koši NADĚJNÝCH, `barwurz-resl-huttn`. Všechny tři se mají
  posoudit společně a s pramenem.

  POČET LŮŽEK VĚDOMĚ PRÁZDNÝ: rešerše u čísla 56 sama přiznala, že jde
  o výtah nástroje, ne o doslovný citát pramene. Dvanáct pokojů
  doložených je, lůžka ne.

  NEDOLOŽENO (nezapsáno): rok stavby a dějiny domu, počet lůžek,
  doslovná podoba prázdninové výjimky v rozvrhu, sortiment kuchyně.
  Kandidát na DATA-04: telefon +49 9965 471. Fotku dodá příští běh
  DATA-02.
