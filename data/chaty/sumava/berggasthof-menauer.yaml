# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec v osadě Grandsberg nad Schwarzachem, ve 850 metrech na
  Goldsteigu a evropské trase E8. Výčep s bavorskou kuchyní a domácími
  koláči, dvacet šest lůžek a výchozí bod na věž na Hirschensteinu.
text:
  - >-
    Grandsberg je osada nad lázeňským Schwarzachem v předním Bavorském
    lese, ve výšce 850 metrů. Stojí v ní Berggasthof Menauer — dům, který
    se podle osady sám často jmenuje Berggasthof Grandsberg a i jeho
    doména nese to jméno. Pro pěší je zajímavý především tím, kde leží:
    přes Grandsberg vede kvalitativně značený Goldsteig a zároveň
    evropská dálková trasa E8, takže dům je zastávkou na dvou dálkových
    trasách zároveň.
  - >-
    Uvnitř je výčep s bavorskou kuchyní a domácími koláči, nocuje se ve
    dvaceti šesti lůžkách v pokojích se sprchou, WC, televizí a balkonem.
    U domu je bezplatná nabíjecí stanice pro elektrokola. Kdy přesně je
    otevřeno, ale poctivě nevíme: turistické portály vedou čtvrtek až
    neděle od půl jedenácté do sedmi s kuchyní do šesti, OpenStreetMap
    začíná týden už ve středu a gastronomický katalog uvádí docela jiný
    rozvrh od devíti do osmi s úterním zavíracím dnem. Shoda je jen
    v tom, že se zavírá v pondělí nebo v úterý. Otvírací dobu proto
    neuvádíme vůbec.
  - >-
    Od hostince se vychází na Hirschenstein, kde v 1095 metrech stojí
    zděná vyhlídková věž s výhledem na jihozápad přes Podunají —
    parkoviště pro pěší k té trase je právě u Menauerů. Věž je
    samostatný cíl několik kilometrů odsud, ne součást hostince; kolik
    přesně kilometrů, žádný náš pramen neříká číslem, které bychom mohli
    doložit, a tak ho tu neuvádíme. Délky a převýšení najdete
    u přístupů níže.
  - >-
    Dějiny domu neznáme; rok stavby ani vyprávění o minulosti nevede
    žádný pramen. Údaje na téhle stránce nesou turistické portály
    regionu a vlastní impresum domu, polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
