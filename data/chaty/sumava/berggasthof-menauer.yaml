interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/berggasthof-menauer.yaml (8. 8. 2026,
  plošná triáž koše NADĚJNÝCH). Klíč zařazení splněn dvakrát: role na
  trase je doložená dvěma dálkovými trasami (Goldsteig, E8), občerstvení
  pro veřejnost výčepem s kuchyní a koláči.

  FALEŠNÝ ROZPOR, KTERÝ SI VYROBILA MOJE VLASTNÍ ZADÁVACÍ CHYBA — stojí
  za zápis, ať se to nepřepíše do dat příště. Rešerši jsem omylem zadal
  délku 13.0517219 místo skutečné 12.8517219 z kandidáta. Rešerše pak
  poctivě ohlásila „rozpor souřadnic" proti portálům Outdooractive
  a alpenvereinaktiv (48.948379 / 12.851729) a označila je za chybu
  jejich databáze. Skutečnost je opačná: oba portály se s OSM shodují na
  dvacet metrů a chyba byla v mém zadání. Poučení: souřadnice do rešerše
  kopírovat, ne přepisovat.

  KAPACITA 26 ZAPSÁNA, ač rešerše přiznala, že číslo nezískala doslovným
  citátem. Důvod: objevuje se shodně na dvou zrcadlících portálech a je
  to jediné číslo, které se u domu vyskytuje, takže tu není co srovnávat.
  Kdyby se objevilo druhé, platí konvence z 27. 7. (zapsat nižší, rozpor
  přiznat).

  NEDOLOŽENO (nezapsáno): otvírací doba (tři rozporné prameny), dějiny
  domu a rok stavby, vzdálenost k věži na Hirschensteinu číslem.
  Provozovatel dle impresa Johann Menauer — jméno z impresa do prózy
  nedáváme. Kandidát na DATA-04: telefon +49 9962 632. Fotku dodá
  příští běh DATA-02.
