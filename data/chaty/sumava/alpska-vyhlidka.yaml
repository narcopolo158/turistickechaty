# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel v zaniklé obci Bučina nad Kvildou, přímo u česko-bavorské
  hranice — dvaatřicet lůžek v pokojích a apartmánech, restaurace
  a wellness, otevřeno po celý rok.
text:
  - >-
    Alpská vyhlídka stojí na místě, které samo vypráví: v zaniklé obci
    Bučina nad Kvildou, pár kroků od bavorské hranice. Ves zanikla
    a hotel je dnes tím, co na jejím místě stojí — a jak napovídá
    samotné jméno domu, výhledem se tu chlubí.
  - >-
    Uvnitř je dvaatřicet lůžek ve dvoulůžkových a třílůžkových pokojích
    a apartmánech, hotelová restaurace a wellness s masážemi. Otevřeno
    má být po celý rok. Pro přechody hraničním hřebenem mezi Kvildou,
    Modravou a bavorskou stranou pod Luzným je to přirozený nocleh na
    české straně.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu hotelu
    a z externího katalogu. Polohu nese OpenStreetMap. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Vlastní web hotelu — zaniklá obec Bučina, 32 lůžek (pokoje
      a apartmány), restaurace, wellness, kontakty (načteno 5. 8. 2026)
    url: https://www.alpskavyhlidka.cz/
  - popis: >-
      Externí katalog turistických chat ČR/SK 2026 — řádek HUT-0104
      (1070 m, Kvilda, celoročně)
    url: https://nocleh.kct.cz/chaty
  - popis: OpenStreetMap (GPS a tagy; ODbL)
    url: https://www.openstreetmap.org/node/12801782102
interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/alpska-vyhlidka.yaml triáží Tier 1
  (5. 8. 2026). Klíč zařazení: nocleh s restaurací na hraničním hřebeni
  v místě zaniklé vsi, katalogový objekt (jistota A). PRVNÍ šumavský
  profil s načteným vlastním webem.

  PROVĚŘIT: vztah k chybějícímu katalogovému objektu „Bučina"
  (SUMAVA-TRIAZ vede Bučinu mezi šesti katalogovými bez kandidáta —
  je katalogová „Bučina" tenhle hotel, nebo jiný dům?). Výhled na Alpy se
  NETVRDÍ — próza odkazuje jen na jméno domu (pramen s výslovnou větou
  o výhledu chybí). Historie
  Bučiny (zánik po vysídlení) doložena jen rámcově vlastním webem
  („v zaniklé obci"). Druhý telefon +420 730 166 838 veden jen
  v ověření. Fotku dodá příští běh DATA-02.
  KATALOGOVÝ DVOJNÍK HUT-0109 (nález průchodu katalogem 10. 8. 2026):
  katalog vede vedle HUT-0104 (Alpská vyhlídka, 1070 m) ještě
  „Horská chata Bučina" (HUT-0109, 1170 m, Kvilda, jistota B, BEZ
  webu). Rešerše žádnou druhou provozovanou chatu na Bučině nenašla
  (WebSearch 10. 8.: jediné ubytování na Bučině je Alpská vyhlídka)
  — HUT-0109 je nejspíš duplikát téhož objektu pod druhovým jménem,
  případně mrtvý záznam. OTÁZKA PRO MICHALA: potvrdit a nechat
  HUT-0109 v katalogu vyřadit/sloučit; do té doby ho katalog-pokryti
  vede jako mezeru.
