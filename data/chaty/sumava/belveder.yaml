# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Třípodlažní horský hotel na kopci Belveder kousek nad Železnou Rudou —
  pokoje s dřevěným nábytkem, restaurace s vlastním pivovarem otevřená
  denně a wellness s vyhřívaným slaným bazénem. Celoroční základna pro
  železnorudskou stranu Šumavy.
text:
  - >-
    Belveder stojí na louce u lesa na stejnojmenném kopci, necelý
    kilometr od centra Železné Rudy — dost blízko na nákupy a vlak,
    dost daleko na klid. Pro výstupy na Ostrý, k Černému a Čertovu
    jezeru nebo přes hranici na Velký Javor je to celoroční základna
    na české straně.
  - >-
    Dům má tři podlaží a pokoje vybavené dřevěným nábytkem; kolik lůžek
    přesně nabízí, naše podklady nevedou, takže nocleh je před cestou
    lepší domluvit telefonicky. Zato o žízeň je postaráno doložitelně:
    k hotelu patří restaurace s vlastním pivovarem, otevřená denně od
    jedenácti do desíti večer. K tomu venkovní krytý vyhřívaný bazén se
    slanou vodou, solná jeskyně, sauny, dětské hřiště a zastřešené
    ohniště s grilem.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu hotelu
    a z externího katalogu. Polohu nese OpenStreetMap. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
