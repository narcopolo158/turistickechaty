interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/berggasthof-grobauer.yaml (8. 8. 2026,
  plošná triáž koše NADĚJNÝCH).

  HRANIČNÍ PŘÍPAD — DRUHÝ Z TÉHLE DÁVKY (první je Hinhart). Objekt je
  hotel v obci, ne bouda na hřebeni, a klíč doplněný Michalem 27. 7.
  vylučuje „penzion VE STŘEDISKU bez doložené historie a bez veřejného
  občerstvení". Grobauer obojí má: rodinnou historii od doby okolo roku
  1910 a veřejnou restauraci dle gastronomického katalogu. Zařazuje se
  proto dle rozhodnutí Michala z 20. 7. 2026 o hraničních hotelech
  („všechny zařadit s poctivým označením") s typem `horsky-hotel`, vzor
  Špindlerovka / Tetřevky / Vebrovy boudy. Kdyby to Michal viděl jinak,
  je to v deníku jako otázka.

  DOKLAD OBČERSTVENÍ JE ZDE SLABŠÍ NEŽ U OSTATNÍCH DOMŮ DÁVKY a je to
  tak napsané i v próze. Ostatní stály na doslovné větě („öffentliche
  Gaststätte", „einkehren", „bewirtschaftet", „Brotzeit") nebo na
  rozvrhu se zavíracím dnem; tady je to zápis v gastronomickém katalogu
  jako restaurace k rezervaci. Kdyby se ukázalo, že restaurace slouží jen
  hostům hotelu, klíč padá — jeden telefonát to rozhodne.

  TŘI ÚDAJE VĚDOMĚ PRÁZDNÉ. (1) Kapacita: 40 pokojů / 80 lůžek nese
  jediná nedoslovná zmínka katalogu; u hraničního hotelu je velikost
  zásadní, tak radši nic. (2) rokVzniku: „um 1910" je přibližné A je to
  rok koupě, ne stavby — dvojí důvod (vzor Kleti a Kolínské boudy).
  (3) otviraciDoba: doložený rozvrh je hotelový (recepce, snídaně), ne
  hospodský.

  DVA ROZPORY PŘIZNANÉ, NESROVNANÉ: telefon (vlastní web + OSM
  +49 8553 91109 × Gelbeseiten 08553 97 88 88-0 u téže adresy) a číslo
  domu v adrese (7/8 × 7-9 × 8).

  NEDOLOŽENO (nezapsáno): kapacita, rok stavby, hodiny restaurace,
  napojení domu na Pandurensteig (trasa vede přes OBEC Spiegelau),
  sortiment kuchyně. Kandidát na DATA-04: telefon +49 8553 91109 zavře
  kapacitu, hodiny restaurace i to, jestli je restaurace opravdu veřejná.
  Fotku dodá příští běh DATA-02.
