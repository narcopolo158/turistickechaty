# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel ve 780 metrech v Oberkreuzbergu u Spiegelau, na okraji
  turistické oblasti Roklan–Luzný. Rodinný dům s víc než stoletou tradicí
  a veřejnou restaurací — hraniční případ, který zařazujeme s poctivým
  označením.
text:
  - >-
    Oberkreuzberg je ves ve výšce 780 metrů, dnes místní část Spiegelau,
    na okraji turistické oblasti Roklan–Luzný v Národním parku Bavorský
    les. Stojí v ní dům, který OpenStreetMap vede jako Berggasthof
    Grobauer, kdežto sám se představuje jako Panoramahotel Grobauer —
    a to napětí mezi oběma jmény je pro naše zařazení podstatné: je to
    horský hotel, ne bouda. Vedeme ho proto s typem horský hotel, stejně
    jako Špindlerovku nebo Tetřevky na krkonošské straně.
  - >-
    Dějiny domu jsou rodinné. Podle vlastního webu koupil kmenové stavení
    pradědeček dnešních hospodářů okolo roku 1910 a bylo v něm tehdy
    řeznictví s hospodou; katalog turistických hotelů mluví o víc než
    stoleté rodinné tradici. Rok je ale přibližný a je to rok koupě, ne
    stavby, a tak ho nevedeme v poli s rokem vzniku, jen tady v textu.
  - >-
    Restaurace je podle gastronomického katalogu veřejná a dá se v ní
    rezervovat stůl. Přiznejme rovnou, že je to u téhle položky doklad
    slabší než u ostatních domů dávky: věta, která by výslovně zvala
    i kolemjdoucího nehosta, se v pramenech nenašla, a hodiny restaurace
    nevede vůbec nikdo. Doložený je jen hotelový rozvrh — příjem hostů
    od dvou do desíti a snídaně od sedmi do desíti — což je rozvrh
    recepce, ne hospody, a proto tu žádnou otvírací dobu nenajdete.
  - >-
    Kolik je v domě pokojů a lůžek, taky neuvádíme. Jeden katalog mluví
    o čtyřiceti pokojích a osmdesáti lůžkách, ale to číslo nese jediná
    nedoslovná zmínka a u hraničního hotelu je právě velikost tím
    údajem, na kterém záleží nejvíc — tak radši nic než dohad. Telefonní
    čísla se rozcházejí: vedeme to z vlastního webu, které se shoduje
    s OpenStreetMap, zatímco jeden firemní rejstřík uvádí u téže adresy
    jiné.
  - >-
    Obec Spiegelau je zastávkou šesté etapy dálkové trasy Pandurensteig,
    ale že by trasa vedla přímo k domu, žádný pramen neříká; jaké
    značené cesty sem doopravdy vedou, ukáže sekce s přístupy níž. Údaje
    na téhle stránce nesou vlastní web domu, gastronomický katalog,
    katalog turistických hotelů a ubytovací portály, polohu nese
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
