# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský dům těsně pod vrcholem Velkého Javoru (Großer Arber), nejvyšší
  hory Šumavy a Bavorského lesa — 1358 metrů, hospoda a dvanáct pokojů
  s vlastní koupelnou. Provozuje ho tatáž hohenzollernská firma, která
  jezdí s kabinovou lanovkou na vrchol.
text:
  - >-
    Arberschutzhaus stojí v 1358 metrech přímo pod horní stanicí kabinové
    lanovky na Velký Javor — nejvyšší horu celé Šumavy s Bavorským lesem,
    a jediný vrchol masivu, který se zvedá nad hranici lesa do skal.
    Z chaty je to na vrchol posledních pár desítek výškových metrů.
  - >-
    Dům patří k lanovce i majetkově: provozuje ho knížecí hohenzollernská
    společnost Arber-Bergbahn, která vlastní celý areál. Uvnitř je
    hospoda a dvanáct moderních pokojů, každý s vlastní sprchou a WC —
    na poměry horských domů nadstandard; katalog vede jedenačtyřicet
    lůžek. V zimě se tu ve středu večer schází štamtiš skialpinistů,
    kuriózně s thajskou kuchyní.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu domu a z externího
    katalogu; polohu nese OpenStreetMap. Historii domu prameny, které
    jsme četli, neuvádějí — proto tu žádná není. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Vlastní web — výška 1358 m, 12 pokojů s koupelnou, Wirtshaus,
      skialpinistický štamtiš, kontakty, provozovatel Fürstl.
      Hohenzollernsche Arber-Bergbahn (načteno 4. 8. 2026)
    url: https://www.arberschutzhaus.de/
  - popis: >-
      Externí katalog turistických chat ČR/SK 2026 — řádek HUT-0278
      (41 lůžek, stravování, Bayerisch Eisenstein, 1358 m)
    url: https://nocleh.kct.cz/chaty
  - popis: OpenStreetMap (GPS, výška, tagy vč. provozovatele; ODbL)
    url: https://www.openstreetmap.org/way/32639765
interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/arberschutzhaus.yaml triáží Tier 1
  (4. 8. 2026) — PRVNÍ NĚMECKÝ PROFIL KORPUSU. Klíč zařazení: horský dům
  s hospodou pod vrcholem nejvyšší hory pohoří, role na trase zjevná.
  Německé jméno primární (vzor polských schronisek).

