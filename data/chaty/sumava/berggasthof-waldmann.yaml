interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/berggasthof-waldmann.yaml (8. 8. 2026,
  plošná triáž koše NADĚJNÝCH). Klíč zařazení: občerstvení pro veřejnost
  doloženo pivní zahradou s „Brotzeit" a denním rozvrhem.

  ROK 1802 PATŘÍ OSADĚ, NE DOMU, a je tak zapsaný — v zajímavostech
  s výslovnou větou, že se z něj rok hostince nedovozuje, a rokVzniku
  zůstává prázdné. Je to týž druh pasti jako výška obce místo výšky domu:
  číslo je doložené, ale je o něčem jiném. Vzor zamítnutí roku koupě 1927
  u Kolínské boudy (26. 7. 2026).

  ROZPOR V PROVOZOVATELI, NEZAPSÁN: Gelbeseiten vede „Waldmann
  Berggasthof Inh. Doris Reisinger Schwarz", kdežto ubytovací portál
  ostbayern-tourismus.de podle rešerše zmiňuje „Seit 2016 neue Besitzer".
  Obojí může platit zároveň, ale ani jedno není doložené natolik, aby to
  šlo do prózy — jméno hospodáře do profilu nedáváme ani jinde.

  NEDOLOŽENO (nezapsáno): výška domu (doložená je jen výška obce Langdorf
  675 m z popisu Pandurensteigu — dům stojí výš na svahu), počet pokojů
  a lůžek, rok stavby domu, napojení hostince na Pandurensteig (trasa
  vede přes OBEC, ne doloženě přes dům), sortiment kuchyně. Vlastní web
  berggasthof-waldmann.com se ze sandboxu samostatně nenačetl, data jsou
  ze zrcadlících portálů. Kandidát na DATA-04: telefon +49 9924 9433321,
  mobil +49 177 8889622. Fotku dodá příští běh DATA-02.
