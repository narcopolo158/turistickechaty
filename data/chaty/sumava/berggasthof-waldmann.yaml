# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec v osadě Waldmann na svahu mezi Langdorfem a Bodenmais.
  Pivní zahrada s bavorskou svačinou a výhledem na tři vrchy, otevřeno
  denně od dvanácti do osmi — a platí se hotově.
text:
  - >-
    Waldmann je osada na svahu mezi Langdorfem a Bodenmais, v srdci
    arberské části Bavorského lesa. Podle obecní kroniky ji roku 1802
    založil sedlák ze Schöneck, který si na východním svahu svého
    lesního pozemku postavil domek; místu se přezdívalo „Woidmo", a to
    jméno osadě zůstalo. Kdy byl postaven dnešní Berggasthof Waldmann,
    se z toho ale odvodit nedá a žádný pramen to neříká — rok 1802 patří
    osadě, ne domu.
  - >-
    Pro pěší je nejzajímavější pivní zahrada: podává se v ní bavorská
    svačina „Waldmann-Brotzeit" a je z ní výhled na tři vrchy —
    Brandtner Riegel, Hennenkobel a Brandten. Otevřeno je podle
    branžového rejstříku obce denně od dvanácti do osmi a mimo ty hodiny
    po dohodě; jeden katalog uvádí místo rozvrhu jen „na dotaz", a tak
    berte hodiny jako to konkrétnější ze dvou tvrzení, ne jako záruku.
    Užitečná drobnost, kterou portál obce zdůrazňuje: platí se hotově.
  - >-
    Nocuje se v pokojích s polopenzí, ceny obec uvádí, počet pokojů ani
    lůžek ale nikdo. Neznáme ani výšku domu: doložená je jen výška obce
    Langdorf dole v údolí, a dům stojí výš na svahu, takže by to bylo
    číslo cizí stavby.
  - >-
    Přes samotný Langdorf Pandurensteig vede, ale že by dálková trasa
    vedla i k hostinci, žádný pramen neříká; jaké značené cesty sem
    doopravdy vedou, ukáže sekce s přístupy níž. Údaje na téhle stránce
    nesou turistický portál Arberland a portál obce Langdorf, polohu
    nese OpenStreetMap. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
