# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Turistická chata Klubu českých turistů v Prášilech uprostřed Národního
  parku Šumava — 84 lůžek ve dvaceti pokojích, vybavená kuchyň
  a polopenze pro hosty. Tradice sahá k roku 1928, kdy první chata
  vznikla z bývalého schwarzenberského pivovaru; dnešní dům je z roku
  1997.
text:
  - >-
    Prášily jsou jedna z nejodlehlejších šumavských obcí a chata Klubu
    českých turistů je tu základnou pro výpravy na Poledník, k Prášilskému
    jezeru i na bývalou Královskou cestu. Klubová historie sahá do roku
    1928, kdy turisté přestavěli bývalý schwarzenberský pivovar; dnešní
    budova vyrostla v letech 1995 až 1997.
  - >-
    Uvnitř je 84 lůžek ve dvaceti pokojích včetně bezbariérového
    s vlastním sociálním zařízením. Vlastní restauraci chata nemá —
    hosté mají k dispozici vybavenou kuchyň, případně polopenzi se
    snídaněmi od brzkého rána; nejbližší restaurace U Michala stojí asi
    dvě stě metrů od chaty. Od roku 2018 dům spravuje nájemce vzešlý
    z výběrového řízení klubu.
  - >-
    Údaje na téhle stránce pocházejí z oficiální stránky Klubu českých
    turistů a z externího katalogu; weby chaty se nám zatím nepodařilo
    načíst, takže z nich necitujeme. Polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
