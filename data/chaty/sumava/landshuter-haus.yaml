# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec s noclehem na náhorní planině Oberbreitenau, dvacet
  minut pěšky od horní stanice lanovky na Geißkopf — oblíbená zastávka
  pěších i běžkařů v jižní části Bavorského lesa. Otevřeno bývá od
  května do října.
text:
  - >-
    Landshuter Haus stojí na Oberbreitenau, otevřené náhorní planině
    v jižním křídle Bavorského lesa mezi Geißkopfem a Breitenauriegelem.
    Nejpohodlnější přístup vede od horní stanice lanovky Geißkopfbahn,
    odkud je to k domu dvacet minut chůze — v zimě je planina oblíbeným
    běžkařským terénem a dům slouží jako zastávka na trati.
  - >-
    Přespat se tu dá, víc ale naše podklady neprozradí: kapacitu ani
    podobu pokojů žádný z nich nevede, takže nocleh je před cestou nutné
    domluvit telefonicky. Hostinec prošel nedávno sanací; kontaktní
    e-mail vede na doménu Bavorského lesního spolku. V kolika metrech dům
    přesně stojí, se naše prameny neshodnou — proto výšku neuvádíme.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní web domu jsme zatím
    nenačetli, takže z něj necitujeme. Polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
