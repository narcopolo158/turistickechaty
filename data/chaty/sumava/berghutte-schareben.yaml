# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata v sedle Schareben (1019 m) na hřebeni nad Zellertalem —
  šestadvacet lůžek ve čtyř- a šestilůžkových pokojích, občerstvení
  a nabíjení elektrokol na terase. Na kapacitě se vzácně shodují všechny
  tři naše prameny.
text:
  - >-
    Berghütte Schareben stojí v zalesněném sedle mezi Zellertalem
    a údolím Bílého Regenu, na půl cesty hřebenem mezi Kaitersbergem
    a javorským masivem — pro přechody západní části Bavorského lesa je
    to přirozená etapová zastávka.
  - >-
    Přespat tu může šestadvacet lidí ve čtyřlůžkových a šestilůžkových
    pokojích; rezervace se přijímají telefonicky mezi desátou a čtvrtou
    odpoledne. Pro skupiny jsou k dispozici tři místnosti až pro sedmdesát
    hostů. Otevřeno bývá od desíti dopoledne — jestli se zavírá v pondělí,
    se naše prameny neshodnou, před cestou je lepší zavolat. Kdo jede na
    elektrokole, najde na kryté terase zásuvky na nabíjení.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní web chaty jsme zatím
    nenačetli, takže z něj necitujeme. Polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
