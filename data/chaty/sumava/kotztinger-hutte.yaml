# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Hřebenová chata u vrcholu Mittagstein (1034 m) na Kaitersbergu, přímo na
  trase dálkové E6 i Goldsteigu — restaurace s vyhlídkovou terasou otevřená
  po celý rok. Nocleh tu nehledejte: kvůli protipožárním předpisům se
  v chatě nespí.
text:
  - >-
    Kötztinger Hütte stojí na hřebeni Kaitersbergu u vrcholu Mittagstein,
    v nejzápadnějším výběžku oblasti, kterou pokrýváme — a kdo jde po
    evropské dálkové trase E6 nebo po Goldsteigu, projde přímo kolem ní.
    Z vyhlídkové terasy se otevírá výhled do kraje kolem Bad Kötztingu,
    po kterém chata nese jméno.
  - >-
    Je to zastávka na jídlo, ne na spaní: nocleh chata nenabízí kvůli
    protipožárním předpisům — a mapová poznámka naznačuje, že dřív tomu
    bývalo jinak. Katalog, ze kterého vycházíme, přitom ubytování stále
    uvádí; rozpor nezastíráme a spolehnout se dá na to přísnější čtení.
    Otevřeno má být po celý rok, konkrétní hodiny se ale naše prameny
    neshodnou — před cestou mimo hlavní sezónu je lepší zavolat.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní web chaty jsme zatím
    nenačetli, takže z něj necitujeme. Polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
