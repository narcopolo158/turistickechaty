interniPoznamky: >-
  Povýšeno BEZ kandidáta z DATA-01 (vzor Horské chaty Pancíř z 5. 8.):
  objekt v OSM exportu není — leží u samé severozápadní hrany okna
  oblasti a živý dotaz na Overpass ze sandboxu neprojde (HTTP 000,
  stejně jako api.mapy.com a nominatim). Klíč zařazení: obsluhovaný
  hostinec s restaurací pro příchozí na okružní trase, vedený navíc
  v seznamu turistických domů Bavorského turistického svazu. Tím je
  ze šestice katalogových objektů bez kandidáta vyřešen druhý (po
  Pancíři); zbývají čtyři: Zlatá Studna, Bučina, Antýgl, Špičák.

  CHYBÍ GPS — profil se nezobrazí na mapě a nedostane přístupové trasy
  z DATA-06. Doplnit, až půjde dotaz na Overpass z Actions (nebo ručně
  z OSM), pak profil zařadit do dalšího běhu tras.

  ROZPOR VÝŠEK VYSVĚTLEN, ne jen přiznán: katalogových 934 m je vrchol
  hory (doloženo popisem okruhu, který u téhož kopce vede vrchol 934 m
  a parkoviště u hostince 850 m), svaz i vlastní web mají u domu 845 m.
  Zapsáno 845 m. Stojí za pozornost jako VZOR: katalog může u objektu
  nést výšku kopce místo výšky domu — prověřit u dalších profilů, kde
  je katalog jediným pramenem výšky (Dreisessel, Eck, Landshuter Haus).

  OTÁZKA PRO MICHALA — TŘI DOMÉNY: vlastní web se načetl jako
  berghofgibacht.de (bez spojovníku), svaz uvádí www.berghof-gibacht.de
  (se spojovníkem, shodně s e-mailovou doménou) a vyhledávání nabízí
  ještě glasschmiede-gibacht.de s titulkem „Berghof Gibacht — Wirtshaus
  und Kunstgalerie im Oberpfälzer Wald" (obsah se nenačetl, stránka
  vrátila nečitelný text). Popis okruhu mluví o jednom domě, kde je
  hostinec i sklářská galerie, ale novější vlastní web o galerii nic
  neříká — jestli jde o týž provoz, o dvě etapy téhož domu, nebo o dva
  sousední domy, NEVÍME a netvrdíme. Jeden telefonát to zavře (vzor
  Dreisesselu).

  DALŠÍ K OVĚŘENÍ: nocleh a kapacita (viz blok Nocleh); telefon —
  pevná 09972/903355 dle svazu × mobil dle vlastního webu; rok
  postavení domu; co dnes znamená správa Bayerischer Wald-Vereinu.
  Geografická poznámka bez dopadu na zařazení: svaz umisťuje dům
  „mezi Bavorský a Hornofalcký les" v Naturparku Oberer Bayerischer
  Wald (týž naturpark jako Berggasthof Eck), katalog ho vede pod
  pohořím Bayerischer Wald a přeshraničním celkem Šumava / Bayerischer
  Wald / Böhmerwald. Fotku dodá příští běh DATA-02.
