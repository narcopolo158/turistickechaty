overeniHistorie:
  source: >-
    Rok postavení ani starší dějiny domu žádný načtený pramen neuvádí.
    Vlastní web (berghofgibacht.de, načteno 6. 8. 2026) mluví o převzetí
    provozu v srpnu 2022 a o „tradičním domě", letopočet ale neuvádí.
    Seznam turistických domů Bavorského turistického svazu
    (wanderverband-bayern.de, načteno 6. 8. 2026) vede jako spravující
    spolek Bayerischer Wald-Verein e.V.; co přesně ta správa dnes
    znamená a jak souvisí s provozovateli od roku 2022, z pramenů
    neplyne — netvrdíme.
  verified: false
  checked: '2026-08-06'

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec pod vrcholem Gibachtu nad Waldmünchenem, na
  severozápadním okraji přeshraničního celku Šumava – Bavorský les.
  Restaurace na okružní trase kolem skal Drei-Wappen a Kreuzfelsen;
  v pondělí zavřeno a začátkem června dvoutýdenní přestávka.
text:
  - >-
    Berggasthof Gibacht stojí zhruba v 845 metrech na svahu Gibachtu,
    kopce, který se zvedá západně od Waldmünchenu při české hranici.
    Bavorský turistický svaz vede dům mezi turistickými domy a jako
    přístupy jmenuje cesty od Reisecku, od Kreuzfelsenu a okruh ke
    Gläsernes Kreuz; okolní skalní útvary Drei-Wappen-Felsen, Kreuzfelsen
    a Pfennigfelsen jsou to hlavní, kvůli čemu se sem chodí.
  - >-
    Dům je hostinec s restaurací, kde se dá pořádat i rodinná nebo
    firemní oslava. Otevřeno je od úterý do neděle, v pondělí má dům
    zavírací den a od prvního do patnáctého června zavírá úplně — kdo
    sem míří mimo tyhle časy, najde zavřeno a nejbližší občerstvení má
    dole ve městě. Jestli se tu dá i přespat, naše podklady spolehlivě
    neříkají: jeden z nich ubytování vede, ostatní o něm mlčí a počet
    lůžek nemá nikdo. Kdo by tu chtěl zůstat přes noc, ať zavolá předem.
  - >-
    Kolem výšky domu bylo potřeba srovnat dva různé údaje: 934 metrů,
    které se u objektu občas uvádějí, patří vrcholu Gibachtu, kdežto
    hostinec i parkoviště u něj leží zhruba o devadesát metrů níž.
    Na téhle stránce proto vedeme výšku domu, ne kopce.
  - >-
    Souřadnice domu zatím nemáme doloženy z žádného pramene, proto ho
    na mapě neukazujeme — raději prázdné místo než odhad. Historie domu
    doložená není vůbec: rok postavení neuvádí žádný z našich pramenů.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
