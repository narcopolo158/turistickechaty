      rozvodí, kontakty (obsah dodal Michal 5. 8. 2026)
    url: https://www.chatapancir.cz/
  - popis: >-
      Oficiální web města Železná Ruda — otevření chaty s rozhlednou
      28. 9. 1923, stavba za pět měsíců (načteno 5. 8. 2026)
    url: https://www.zelezna-ruda.cz/zeleznaruda/fr.asp?tab=snet&id=370&burl=&pt=TURE
  - popis: >-
      Externí katalog turistických chat ČR/SK 2026 — řádek HUT-0099
      (1214 m, Železná Ruda, ubytování, stravování, celoročně; vede
      doménu pancir.cz — vztah k chatapancir.cz neprověřen)
    url: https://nocleh.kct.cz/chaty
  - popis: >-
      OpenStreetMap — GPS rozhledny (součást chaty) a Restaurace Pancíř
      5 m vedle (ODbL)
    url: https://www.openstreetmap.org/node/13957678714
