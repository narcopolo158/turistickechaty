# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata s rozhlednou přímo na vrcholu Pancíře (1214 m) nad
  Železnou Rudou — ubytování, restaurace a jednosedačková lanovka ze
  Špičáku až k chatě. Turisté sem jezdí od roku 1923, kdy chata
  s rozhlednou vyrostla za pouhých pět měsíců.
text:
  - >-
    Horská chata Pancíř stojí přímo na vrcholu Pancíře v Pancířském
    hřbetu, naproti Špičáku u Železné Rudy — a rozhledna je součástí
    samotné chaty, takže výhled má hned za dveřmi. Vrchol je zároveň
    evropským rozvodím: pramení tu Úhlava a Křemelná, jejichž voda teče
    do Severního moře, i Řezná, kterou Dunaj odvádí do Černého moře.
  - >-
    Nahoru to jde i bez námahy: ze Špičáku od centrálního parkoviště
    vede jednosedačková lanovka dlouhá 2740 metrů s převýšením 348
    metrů, přes mezistanici Hofmanky — vozí lyžaře, pěší turisty i kola.
    U chaty je turistické rozcestí. Přespat se tu dá, kolik lůžek chata
    má, ale naše podklady nevedou — nocleh i aktuální provozní dobu
    ověřte předem, chata je zveřejňuje na sociálních sítích.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu chaty, z webu
    města Železná Ruda a z externího katalogu. Polohu nese OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
