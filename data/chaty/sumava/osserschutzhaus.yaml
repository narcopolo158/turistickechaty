# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský dům z roku 1897 kousek pod dvojvrcholem Velkého Ostrého, v 1293
  metrech — teplá kuchyně po celou otevírací dobu, noclehárna na matracích
  a státní hranice, která vede metr od zdi.
text:
  - >-
    Osserschutzhaus stojí těsně pod Velkým Ostrým, tedy pod horou, kterou
    Češi znají z druhé strany hřebene nad Nýrskem. Dům je bavorský, ale
    hranice běží kolem něj tak těsně, že mezi zdí a čárou na mapě zbývá
    zhruba metr — pro hřebenovou túru je to nejbližší obsluhované místo,
    kam se z české strany dá dojít.
  - >-
    Uvnitř se dá přespat ve společné noclehárně na matracích; v zimě dům
    nocleh nenabízí. Kolik lůžek přesně má, se prameny neshodnou — katalog
    vede jednatřicet, bavorský turistický portál čtyřicet, a my zapisujeme
    nižší číslo. Kuchyně vaří teplá jídla po celou otevírací dobu, takže
    i kdo jde jen kolem, se nají.
  - >-
    Otvírací hodiny žádný z pramenů neuvádí a dům může kvůli počasí zavřít
    ze dne na den — před cestou je rozumné zavolat. Provoz drží spolek
    Bayerischer Waldverein, sekci Lam, s hospodářskou rodinou na místě.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní web domu se nám zatím
    nepodařilo načíst, takže z něj necitujeme. Polohu nese OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
