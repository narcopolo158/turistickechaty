# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec s pokoji pod severním úpatím Velkého Javoru, kousek pod
  sedlem Brennes — poctivá kuchyně, celý dům bezbariérový. Hostinec tu
  stojí od roku 1870; po požáru v roce 2011 byl do roka postaven znovu.
text:
  - >-
    Mooshütte stojí v lesích pod severním úpatím javorského masivu, asi
    kilometr a půl pod sedlem Brennes — z Lohbergu je to poslední dům na
    cestě k Malému Javorskému jezeru a na Velký Javor od severu. Místo má
    hlubokou minulost: dějiny bývalého statku tu sahají až do
    sedmnáctého století a horský hostinec na něm vyrostl roku 1870.
  - >-
    Dnešní budova je ale mladá — původní dům v roce 2011 zničil požár
    a rodina, která hostinec vede, ho do roka postavila znovu. Uvnitř
    jsou komfortní pokoje a celý dům je bezbariérový; počet lůžek naše
    podklady nevedou, nocleh je proto potřeba domluvit telefonicky.
    Kuchyně vede poctivá bavorská jídla.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní web domu jsme zatím
    nenačetli, takže z něj necitujeme. Polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
