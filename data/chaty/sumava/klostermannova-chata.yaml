# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata Klubu československých turistů z roku 1924 na Modravě, postavená
  podle návrhu Bohuslava Fuchse — dnes kulturní památka a jeden
  z nejznámějších domů Šumavy. V roce 2024 oslavila sto let; ubytovává
  dál, dnes v soukromých rukou.
text:
  - >-
    Klostermannova chata stojí na Modravě, v srdci šumavských plání,
    a nese jméno spisovatele, který Šumavu vepsal do české literatury.
    Postavil ji Klub československých turistů a otevřela se v neděli
    22. června 1924; návrh vypracoval už roku 1921 architekt Bohuslav
    Fuchs, žák Jana Kotěry a pozdější hvězda brněnského funkcionalismu.
  - >-
    Na svou dobu to byl velkorysý podnik: stavba přišla na víc než milion
    korun a dům nabídl osmadvacet pokojů, noclehárny, elektrické světlo
    i vodovod do všech místností. Po zrušení klubu komunistickým režimem
    chata skončila v majetku plzeňských Leninových závodů a klubu se po
    revoluci nevrátila — dnes je v soukromém vlastnictví, po rekonstrukci
    a s památkovou ochranou.
  - >-
    V září 2024 se u chaty slavilo sté výročí, s pochody a výstavou
    o Karlu Klostermannovi. Ubytování nabízí chata dál — čtyři typy
    pokojů s vlastním sociálním zařízením; kolik lůžek dům dnes má
    a jestli kuchyně obslouží i kolemjdoucího, prameny neříkají, takže
    to netvrdíme.
  - >-
    Údaje na téhle stránce pocházejí z článku Klubu českých turistů ke
    stému výročí, z webu obce Modrava a z Kudy z nudy; vlastní web chaty
    se nám zatím nepodařilo načíst, takže z něj necitujeme. Polohu nese
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
