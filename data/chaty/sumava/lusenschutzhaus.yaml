# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský dům v 1343 metrech těsně pod vrcholem Luzného, na bavorské
  straně proti Březníku — devatenáct lůžek, bavorská kuchyně a v sezóně
  otevřeno denně. Jediné místo k přespání přímo pod slavným kamenným
  vrcholem.
text:
  - >-
    Lusenschutzhaus stojí kousek pod vrcholem Luzného, hory s holým
    kamenným temenem, která je z české strany na dohled od Březníku —
    hero snímek téhle oblasti se díval právě na ni. Kdo přechází hranici
    po hřebenových trasách národních parků, potká dům jako jedinou
    obsluhovanou zastávku mezi Modravou a bavorským podhůřím.
  - >-
    Uvnitř je devatenáct lůžek ve třílůžkových a čtyřlůžkových pokojích
    a jeden skupinový pokoj až pro devět osob; povlečení je v ceně.
    Kuchyně vede bavorské svačiny, polévky, regionální sezónní jídla
    a domácí koláče. V letní sezóně od května do konce října je otevřeno
    denně od devíti do osmi večer, přes vánoční prázdniny bývá otevřeno
    přes den — přesné zimní termíny je před cestou potřeba ověřit.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní web domu se nám zatím
    nepodařilo načíst, takže z něj necitujeme. Polohu nese OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
