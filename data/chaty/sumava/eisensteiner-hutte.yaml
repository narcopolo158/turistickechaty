# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Restaurace v 1340 metrech přímo u vrcholu Velkého Javoru, pár kroků od
  horní stanice lanovky — teplá bavorská kuchyně po celý den provozu,
  nocleh ale nečekejte. V listopadu a na přelomu dubna a května bývá
  zavřeno spolu s lanovkou.
text:
  - >-
    Eisensteiner Hütte stojí v sedle těsně pod vrcholem Velkého Javoru
    (Großer Arber), nejvyšší hory celé Šumavy s Bavorským lesem — pár
    desítek metrů od Arberschutzhausu a od horní stanice kabinové lanovky.
    Kdo vyjede lanovkou nebo vystoupá po značených cestách, má tu po ruce
    průběžně teplou bavorskou kuchyni.
  - >-
    Na rozdíl od sousedního Arberschutzhausu tu ale nepřespíte: podle
    podrobnějšího z našich pramenů chata nocleh nenabízí, ačkoli katalog,
    ze kterého vycházíme, ubytování uvádí — rozpor nezastíráme. Provoz se
    odvíjí od jízd lanovky; v listopadu a od poloviny dubna do začátku
    května je zavřeno. Chatu provozuje společnost provozující i lanovku
    a kuriozita na závěr: je tu svatební síň pro civilní obřady.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního turistického portálu
    Bavorského lesa a z externího katalogu; vlastní stránka chaty se nám
    zatím nepodařilo načíst, takže z ní necitujeme. Polohu nese
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
