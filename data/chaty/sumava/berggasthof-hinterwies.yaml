  to rozdíl mezi „jeden pramen bez doslovného citátu" a „tři prameny
  proti sobě".

  VÝŠKA: rozpor 924 (Alpenvereinaktiv, z těla stránky) × 925 (titulek
  webkamery na Bergfexu, tělo stránky se nenačetlo). Zapsáno 924 —
  konvence z 27. 7. i lepší doklad mluví pro totéž číslo.

  SOUSEDNÍ OBJEKTY: Berggasthof Hochpröller je publikovaný profil od
  téhož dne. Rešerše zmínila v okolí ještě „Prellerhaus" — v našem
  fondu kandidát toho jména není, patří do dohledávky (DATA-31).

