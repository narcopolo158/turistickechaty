# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Obhospodařovaný horský hostinec ve 924 metrech nad Sankt Englmar, na
  severní straně Prölleru. Otevřeno denně od devíti do šesti, mimo
  lyžařskou sezónu s pondělním zavíracím dnem.
text:
  - >-
    Pröller nad Sankt Englmar je podle portálu regionu nejznámější hora
    okolí. Na její severní straně, ve výšce okolo 924 metrů, stojí
    Berggasthof Hinterwies. Turistický portál regionu ho vede jednoduše
    jako „bewirtschaftet" — obhospodařovaný, tedy s obsluhou pro
    kolemjdoucí. Právě tohle jediné německé slovo je u bavorských domů
    to, na čem náš klíč zařazení stojí, a stejně jsme ho použili
    u Geisskopfhütte.
  - >-
    Otevřeno je denně od devíti do šesti. Mimo lyžařskou sezónu se
    v pondělí zavírá a na přelomu listopadu a prosince, tedy v mezidobí
    mezi podzimní a zimní sezónou, zavírá dům úplně. Kolik je tu lůžek,
    neuvádíme: že se tu spí, prameny říkají, ale počet lůžek ani pokojů
    nevede ani jeden.
  - >-
    Dům patří do areálu, který se podle svých tří vrcholů jmenuje
    Pröller-Skidreieck, a v okolí je horských hostinců hned několik —
    Berggasthof Hochpröller pod samotným vrcholem vedeme zvlášť. Kdo
    jde po vrcholové cestě, jde po Goldsteigu; přístupové trasy s délkou
    a převýšením najdete níže.
  - >-
    Rok stavby ani dějiny domu neznáme, žádný pramen je nevede. Údaje na
    téhle stránce nesou turistické portály regionu, polohu nese
    OpenStreetMap; výšku uvádí dva prameny o metr různě a zapsali jsme
    nižší z nich. Redakce nic neověřila vlastním dotazem ani návštěvou.
