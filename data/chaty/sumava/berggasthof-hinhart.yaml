interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/berggasthof-hinhart.yaml (8. 8. 2026,
  plošná triáž koše NADĚJNÝCH).

  KLÍČ ZAŘAZENÍ — TENHLE PŘÍPAD SI ZASLUHUJE ROZBOR, protože se opírá
  o historii, ne o trasu. Občerstvení pro veřejnost je doložené rozvrhem
  se zavíracím dnem a nedělními dopoledními hodinami. ROLE NA TRASE ale
  doložená NENÍ: žádný pramen u domu neuvádí Goldsteig, Pandurensteig
  ani jinou značenou cestu, a dům stojí na svahu nad městem, ne na
  hřebeni. Co ho podrželo, je druhá polovina klíče doplněná Michalem
  26. 7. 2026 — turistická minulost, respektive doložená historie:
  stavení z roku 1700 s hostincem od osmnáctého století, na samotě, která
  není ani v městském seznamu místních částí. To je podle výjimky
  z 27. 7. („samoty, výš položená či zajímavá místa") dost. Kdyby to
  Michal viděl jinak, je to jeden ze dvou hraničních profilů téhle dávky
  (druhý je Grobauer) a v deníku je to jako otázka.

  ROK 1700 STOJÍ NA JEDINÉM PRAMENI, a tím pramenem je provozovatel sám.
  V próze je to proto řečeno jako jeho tvrzení. Vzor: Hubertka, kde rok
  1906 z jediného pramene (detail razítka) taky zapsán byl.

  SROVNÁVACÍ TVRZENÍ V ZAJÍMAVOSTECH („nejstarší doložený rok stavby
  z bavorské části fondu") JE NAŠE, ne pramenovo, a je tak i označené.
  Spočitatelné „nej" dle pole rokVzniku se dle CLAUDE.md do zajimavosti
  psát nemusí — tady je kvůli tomu, že jde o srovnání v rámci ČÁSTI
  fondu, které žebříček z pole sám neudělá.

  NEDOLOŽENO (nezapsáno): výška domu (osada není ani v seznamu místních
  částí Regenu — rešerše to prověřila), počet lůžek a pokojů, napojení
  na dálkové trasy, věk stromů na zahrádce („300 Jahre alte Bäume" je
  jen parafráze rešerše, ne doložený citát). Provozovatelem jsou dle
  webu Gerlinde a Horst Zitzelsbergerovi — jména z webu do prózy
  nedáváme. Kandidát na DATA-04: telefon +49 9921 94340. Fotku dodá
  příští běh DATA-02.
