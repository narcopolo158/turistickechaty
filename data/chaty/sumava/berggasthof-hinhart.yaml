# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Hostinec na slunném jižním svahu nad městem Regen, podle vlastního webu
  postavený roku 1700 a od osmnáctého století s výčepem. Otevřeno pět dní
  v týdnu, výhled na zříceninu Weißenstein.
text:
  - >-
    Hinhart je hrst domů na jižním svahu nad městem Regen, tak malá, že ji
    městský seznam místních částí ani nevede. Stojí tu Berggasthof
    Hinhart a jeho vlastní web říká něco, co v naší bavorské části fondu
    nemá obdoby: dům byl podle něj postaven roku 1700 a v osmnáctém
    století rozšířen o hostinec. Je to tvrzení provozovatele o vlastním
    domě a žádný nezávislý pramen ho nepotvrzuje — ale u dějin vlastního
    stavení je provozovatel pramen na místě, a tak ten rok vedeme. Od
    roku 1970 je dům v rodinném vlastnictví.
  - >-
    Hospoda je otevřená pět dní v týdnu: v pondělí a od čtvrtka do sobotu
    od pěti do desíti večer, v neděli a ve svátky od jedenácti dopoledne,
    a v úterý a ve středu má zavírací den. Teplá kuchyně jede od půl šesté
    do půl deváté, v neděli navíc v obědovém čase. Ty dopolední nedělní
    hodiny jsou dobré znamení pro pěší — to není čas pro hosty domu, ale
    pro výletníky. Vlastní web a OpenStreetMap se na rozvrhu shodují,
    což je v téhle skupině bavorských hostinců vzácnost.
  - >-
    Nocuje se v pokojích, kolik jich je a kolik mají lůžek, ale žádný
    pramen neříká. Neznáme ani výšku domu: osada v žádném seznamu není
    a odvozovat ji odjinud nebudeme. Zahrádka je podle webu pod starými
    stromy a z domu je vidět na zříceninu hradu Weißenstein, která se nad
    Regenem zvedá naproti.
  - >-
    Napojení na dálkové trasy Goldsteig nebo Pandurensteig u domu žádný
    pramen neuvádí, a tak ho netvrdíme; jaké značené cesty sem opravdu
    vedou, ukáže sekce s přístupy níž, která čte spočítaný katalog tras.
    Údaje na téhle stránce nesou vlastní web hostince a portál města
    Regen, polohu a rozvrh nese i OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
