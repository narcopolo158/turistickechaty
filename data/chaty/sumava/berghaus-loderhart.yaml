interniPoznamky: >-
  Povýšeno z data/kandidati/sumava/berghaus-loderhart.yaml (8. 8. 2026,
  plošná triáž koše NADĚJNÝCH). Klíč zařazení splněn nejsilnějším možným
  způsobem: pramen říká „öffentliche Gaststätte" doslova, takže se
  nemusí nic dovozovat.

  PODEZŘENÍ NA SELBSTVERSORGER VYVRÁCENO. Kandidát byl v deníku 7. 8.
  veden mezi objekty, u nichž je podezření, že jde o chatu k pronájmu
  (spolkový dům, vzor Kynastu a Zwieseler Hütte). Stránka spolku ale
  vede OBOJE zvlášť: „öffentliche Gaststätte, Gastwirtschaft, Biergarten"
  vedle „Selbstkocherküche". Kuchyň pro samostatné hospodaření je tu tedy
  služba PRO NOCUJÍCÍ, ne náhrada veřejné hospody — a to je přesně ten
  rozdíl, který u Zwieseler Hütte chyběl.

  VÝŠKA: rozpor 927 (spolek) × 924 (regionální web). Zapsáno 924 dle
  konvence z 27. 7. 2026 (při rozporu nižší číslo, rozpor přiznat).
  Rozdíl tří metrů na věci nic nemění, ale konvence se drží i tam, kde
  o nic nejde — jinak se přestane držet tam, kde jde o hodně.

  ROK 1950 JE ROK KOUPĚ, NE STAVBY, a je tak i popsaný v overeniHistorie
  i v próze. Vědomě se to zapisuje jako rokVzniku, protože u spolkového
  domu je vznikem toho, co průvodce popisuje, začátek turistické služby.
  Kdyby Michal chtěl držet rokVzniku striktně jako rok stavby (vzor
  zamítnutí roku koupě 1927 u Kolínské boudy), pole se vyprázdní a datum
  zůstane v próze — je to otázka konvence, ne faktu, a je v deníku.

  ADRESA: spolek uvádí korespondenčně „94469 Deggendorf", Wikipedie ale
  doloženě vede osadu pod obcí Grafling. Do pole `obec` jde Grafling
  (správní příslušnost dle pramene o katastru), rozpor je tu zapsaný.

  NEDOLOŽENO (nezapsáno): rok stavby domu, otvírací doba (tři rozporné
  prameny), jméno hospodáře, sortiment kuchyně, kapacita pivní zahrady,
  napojení na Goldsteig nebo Pandurensteig (žádný pramen ho neuvádí —
  přístupové trasy doplní pipeline DATA-06). Vlastní web loderhart.de je
  ze sandboxu za gatem už napotřetí; kandidát na pokus z Michalova
  prohlížeče. Fotku dodá příští běh DATA-02.
