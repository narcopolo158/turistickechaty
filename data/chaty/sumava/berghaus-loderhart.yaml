# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Spolková horská chata NaturFreunde ve 924 metrech nad Graflingem, jediný
  dům celé osady Loderhart. Veřejná hospoda s pivní zahradou, třicet lůžek
  a kaple — a autem se sem nedojede.
text:
  - >-
    Loderhart je zvláštní adresa: osada, kterou tvoří jediný dům. Ten dům
    je Berghaus Loderhart, spolková chata německých NaturFreunde,
    a stojí ve výšce okolo 924 metrů v rozsáhlých lesích přírodního parku
    Bavorský les, na katastru obce Grafling v okrese Deggendorf. Autem se
    k němu nedojede — přístup vede lesní cestou od Engelburgsried, která
    je pro běžný motorový provoz uzavřená. Kdo sem chce, jde po svých.
  - >-
    Dům patří místní organizaci NaturFreunde v Deggendorfu a jeho dějiny
    jako turistické chaty začínají rokem 1950: tehdy budovu koupil
    bavorský krajský svaz spolku, aby v ní zřídil turistickou ubytovnu.
    Kdy byla postavena, nevíme — žádný pramen rok stavby nevede, a tak
    ho tu neuvádíme. U spolkových domů je ostatně datum, kdy začala
    služba turistům, tím zajímavějším z obou.
  - >-
    Hospoda je výslovně veřejná: kdo přijde, může se najíst, i když tu
    nespí. Vedle výčepu je pivní zahrada a u domu kaple. Nocuje se ve
    třiceti lůžkách rozdělených do osmi pokojů od dvoulůžkových po
    sedmilůžkové, a kdo si chce vařit sám, má k dispozici kuchyň pro
    samostatné hospodaření. Právě to slovo „veřejná" dům odlišuje od
    Zwieseler Hütte a Waldvereinshütte pár desítek kilometrů odsud,
    které jsou k pronájmu pro samostatné hospodaření a do průvodce
    proto nepatří.
  - >-
    Kdy je otevřeno, poctivě nevíme. Tři prameny dávají tři neslučitelné
    odpovědi — jeden vede provoz jen od května do října o sobotách,
    nedělích a svátcích, druhý celoroční víkendy s hodinami od deseti do
    pěti, třetí denní provoz o vánočních prázdninách a jinak víkendy do
    poloviny března. Shodují se jedině na tom, že jádrem provozu jsou
    víkendy a svátky. Než to potvrdí telefonát, otvírací dobu neuvádíme
    vůbec: u chaty, kam se jde hodinu lesem, je špatný rozvrh horší než
    žádný.
  - >-
    Údaje na téhle stránce nesou stránka domu v seznamu spolku
    NaturFreunde Deutschlands, německá Wikipedie a regionální turistický
    web; polohu nese OpenStreetMap. Vlastní stránky domu se nám opakovaně
    nepodařilo otevřít, takže vlastní vyprávění domu o sobě tu chybí.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
