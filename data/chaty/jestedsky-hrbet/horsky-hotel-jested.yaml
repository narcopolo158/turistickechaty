# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Hubáčkův horský hotel s televizním vysílačem na vrcholu Ještědu
  (1 012 m) — rotační hyperboloid, který prodlužuje siluetu hory,
  Perretova cena 1969, Stavba století 2000 a od roku 2006 národní
  kulturní památka. Pro turistu na hřebeni: restaurace a bufet —
  na vrchol se ale dnes dojde jen po svých, kabinová lanovka nejezdí.
text:
  - >-
    Hotel Ještěd stojí na vrcholu hory, jejíž jméno nese celý hřbet,
    v nadmořské výšce 1 012 metrů. Do průvodce turistickými chatami patří
    rolí, ne podobou: je to vrcholový cíl hlavních tras hřebene
    s restaurací a bufetem pro návštěvníky — a zároveň nejslavnější
    česká horská stavba dvacátého století.
  - >-
    Tradice vrcholového hostince je starší než dnešní silueta. V lednu
    1907 vyrostla na vrcholu horská chata a sloužila přes půl století,
    než 31. ledna 1963 vyhořela. Nový dům se začal stavět 30. července
    1966 podle projektu Karla Hubáčka, který jako jediný ze soutěžících
    umístil vysílač i hotel s restaurací do jediné stavby — rotačního
    hyperboloidu, jenž horu opticky prodlužuje místo toho, aby jí
    konkuroval. Za projekt dostal už v roce 1969 prestižní Perretovu
    cenu; stavba byla dokončena v létě 1973.
  - >-
    Uznání se od té doby jen vrší: v roce 2000 byl Ještěd zvolen českou
    Stavbou století a od 1. ledna 2006 je horský hotel s vysílačem
    národní kulturní památkou. Objekt dnes vlastní Liberecký kraj.
  - >-
    Prakticky pro turistu: v budově je hotelová restaurace a bufet,
    tedy i rychlé občerstvení pro ty, kdo na vrchol jen vystoupali.
    Poslední úsek na vrchol je ale v každém případě pěšky. Kabinová
    lanovka z Horního Hanychova je dlouhodobě mimo provoz a obnovení se
    čeká nejdříve od roku 2030; sedačková lanovka na Skalku sice jezdí
    celoročně, jenže od její horní stanice zbývá na vrchol ještě zhruba
    1,8 kilometru chůze. K nástupu jede z Liberce tramvajová linka 3 na
    konečnou v Horním Hanychově, odkud od dubna do října vyjíždí sezónní
    turistická autobusová linka 79 na parkoviště Ještědka — a i odtud se
    jde posledních zhruba 750 metrů po svých. Kapacitu ubytování ani
    otvírací dobu restaurace prameny neuvádějí, takže je neuvádíme ani
    my — před cestou za noclehem doporučujeme hotel kontaktovat přímo.
  - >-
    Údaje na téhle stránce pocházejí z webů hotelu, z turistického
    portálu Libereckého kraje a z Památkového katalogu; polohu nese
    OpenStreetMap. Redakce zatím nic neověřila vlastním dotazem ani
    návštěvou.
