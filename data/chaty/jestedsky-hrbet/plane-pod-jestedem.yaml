# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata Klubu českých turistů přímo na Ještědském hřebeni (780 m),
  2,5 kilometru od vrcholu Ještědu. Restaurace s tradiční českou kuchyní
  má celoroční provoz a otevřeno pro veřejnost každý den; spí se tu
  na 86 lůžkách ve dvou budovách.
text:
  - >-
    Chata Pláně stojí v lokalitě Pláně pod Ještědem přímo na hřebeni,
    ve výšce 780 metrů a zhruba dva a půl kilometru od vrcholu Ještědu;
    adresou patří k obci Světlá pod Ještědem. Vlastní ji Klub českých
    turistů a v průvodci je přesně tím, čím má hřebenová chata být:
    zastávkou na trase, kde se nají i ten, kdo jde jen kolem.
  - >-
    Restaurace vaří tradiční českou kuchyni, která podle vlastních slov
    nezapomíná na vegetariány, z místních surovin a lesních bylinek.
    Otevřeno je každý den včetně svátků — ve všední dny od jedenácti,
    o víkendu už od půl jedenácté — a provoz je celoroční. Přesné hodiny
    uvádíme v přehledu; jako u všech časových údajů platí, že se mění
    snáz, než stačíme kontrolovat.
  - >-
    Nocleh nabízí chata na šestaosmdesáti lůžkách ve dvou budovách:
    dvacet jich je v hlavní budově s restaurací a vyšším standardem,
    šestašedesát ve vedlejší budově s turistickým ubytováním. Kdo chce
    horskou klasiku, spí vedle; kdo pohodlí, v hlavní budově.
  - >-
    Údaje na téhle stránce pocházejí z webu chaty a z oficiálních stránek
    obce Světlá pod Ještědem, které chatu vedou v přehledu ubytování;
    polohu nese OpenStreetMap. Redakce zatím nic neověřila vlastním
    dotazem ani návštěvou — před cestou s noclehem doporučujeme zavolat.
