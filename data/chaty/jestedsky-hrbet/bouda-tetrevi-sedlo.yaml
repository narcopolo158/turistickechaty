# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěný kiosek na sedle Výpřež pod Ještědem, u parkoviště na křižovatce
  cest z Kryštofova Údolí na hřeben. Jednoduchá jídla k pivu a zahrádka
  s lavicemi — zastávka na túře, ne nocležiště.
text:
  - >-
    Bouda Tetřeví sedlo je jedním z objektů, které do průvodce patří
    rolí, ne velikostí — stejně jako jizerské kiosky Hřebínek nebo
    Knajpa. Stojí u parkoviště na sedle Výpřež, kudy se z Kryštofova
    Údolí vychází na ještědský hřeben, a slouží přesně tomu, čemu má
    sloužit zastávka na trase: pivo, jednoduchá jídla, zahrádka s pár
    lavicemi.
  - >-
    Nespí se tu — je to kiosek, ne nocležiště. Otvírací dobu žádný
    z dosažitelných pramenů neuvádí a popis „letní zastávka na túře"
    napovídá sezónní provoz, doložený ale není; kdo sem míří mimo hlavní
    sezónu, měl by počítat i se zavřeno.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu kiosku (který se
    nám nepodařilo načíst celý), z katalogu firem a z recenzního popisu;
    polohu nese OpenStreetMap. Redakce zatím nic neověřila vlastním
    dotazem ani návštěvou.
