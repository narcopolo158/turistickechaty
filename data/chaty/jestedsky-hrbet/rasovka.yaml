# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Zděná rozhledna z roku 2006 na kraji osady Rašovka nad Libercem,
  vysoká 22,5 metru — první soukromá zděná rozhledna novodobé české
  historie. U věže je restaurace s minutkovou kuchyní; rozhledna má
  otevřeno, když má otevřeno restaurace.
text:
  - >-
    Rašovka stojí na jižním konci Ještědského hřbetu, na kraji stejnojmenné
    osady patřící k obci Šimonovice. Do průvodce ji řadí totéž pravidlo
    jako krkonošský Žalý: rozhoduje občerstvení pro turisty, ne to,
    jestli je stavba bouda, nebo věž.
  - >-
    Věž je mladá a svým způsobem průkopnická: postavena byla v roce 2006,
    měří 22,5 metru a je první soukromou zděnou rozhlednou v novodobé
    historii České republiky.
  - >-
    U rozhledny funguje restaurace s minutkovou kuchyní a domácími
    dezerty — a provoz obou je spojený doslova: otvírací doba věže je
    stejná jako otvírací doba restaurace. Konkrétní hodiny prameny
    neuvádějí, takže je neuvádíme ani my; před cestou se vyplatí ověřit,
    že je otevřeno.
  - >-
    Údaje na téhle stránce pocházejí z turistického portálu Libereckého
    kraje; polohu nese OpenStreetMap. Redakce zatím nic neověřila
    vlastním dotazem ani návštěvou. Nedoložený zůstává vztah rozhledny
    a sousední restaurace V Trnčí — jestli jde o týž provoz, si necháme
    potvrdit.
zdroje:
  - popis: >-
      Turistický portál Libereckého kraje — rok 2006, výška věže 22,5 m,
