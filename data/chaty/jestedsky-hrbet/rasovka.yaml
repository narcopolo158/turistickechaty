interniPoznamky: >-
  Povýšeno z data/kandidati/jestedsky-hrbet/rasovka.yaml triáží 2. 8. 2026
  na pokyn Michala. Klíč: rozhledna s občerstvením (rozhodnutí 28. 7. 2026).

  NEDOLOŽENO (nezapsáno): nadmořská výška stanoviště, nocleh (žádný pramen
  ho nezmiňuje — pole prázdné, ne „ne"), otvírací hodiny, vztah k sousední
  restauraci V Trnčí (možná týž provoz — prověřit), kontakty.

  Fotka 4. 8. 2026 NEPŘIŘAZENA, ačkoli DATA-02 nabídlo 15 kandidátů: žádný
  nezabírá rozhlednu. Bližší jsou památný javor klen u usedlosti U Kotků
  (33–107 m) a chráněný dům če. 8 (109–206 m) — obojí jiné objekty na Rašovce,
  shodou jména MÍSTA, ne stavby. Zůstává frontě adminu; kdyby se rozhledna
  na Commons neobjevila, je to kandidát na vlastní snímek.
