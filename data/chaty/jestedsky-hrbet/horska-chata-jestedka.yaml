# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Stylová horská chata v sedle pod vrcholem Ještědu s výhledy na Liberec.
  Ubytuje 23 hostů v sedmi pokojích a rodinném apartmánu a má hospůdku
  s barem — web ale míří hlavně na skupinové pronájmy, takže jestli
  obslouží i kolemjdoucího, si před cestou ověřte.
text:
  - >-
    Ještědka stojí v sedle pod vrcholem Ještědu, kousek pod hlavní
    hřebenovou trasou, a vlastními slovy nabízí výhledy na Liberec;
    adresou patří k obci Světlá pod Ještědem. V mapových datech je vedená
    jako obsluhovaná horská chata.
  - >-
    Spí se tu na třiadvaceti lůžkách v sedmi pokojích a jednom rodinném
    apartmánu pro pět osob. K vybavení patří lyžárna a velký společenský
    prostor ve stylu horské hospůdky s kamny a vlastním barem — chata
    zkrátka vypadá přesně tak, jak si horskou chatu představujete.
  - >-
    Jedno je ale potřeba říct rovnou: web chaty míří především na
    skupinové pronájmy — pobyty škol, oddílů a firem, s rezervacemi
    vypsanými na sezóny 2026/2027 — a o obsluze turisty, který jde jen
    kolem, neříká nic. Netvrdíme tedy, že se tu kolemjdoucí nají;
    dokud to nebude doložené, počítejte spíš s tím, že hospůdka slouží
    ubytovaným skupinám.
  - >-
    Údaje na téhle stránce pocházejí z webu chaty a z ubytovacích
    katalogů; polohu nese OpenStreetMap. Redakce zatím nic neověřila
    vlastním dotazem ani návštěvou — před cestou doporučujeme zavolat,
    zvlášť pokud počítáte s občerstvením bez noclehu.
