# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěné schronisko z roku 1878 s mansardovou střechou na svahu nad
  Zieleńcem — celodenní kuchyně PTTK, turistické pokoje i pokoje
  s koupelnou a v zimě sjezdovka přímo za dveřmi. Jeden z nejstarších
  turistických domů Orlických hor, jak dokládá letopočet nad vchodem.
text:
  - >-
    Orlica patří k první generaci turistických domů Orlických hor:
    letopočet 1878 nese nad hlavním vchodem a stavěl ji nejspíš Josef
    Rübartsch — bratr Heinricha Rübartsche, který Orlické hory
    a Zieleniec pro turistiku objevil. Dřevěný dům s mohutnou
    mansardovou střechou si drží autentický interiér dodnes.
  - >-
    Dnes schronisko provozuje síť PTTK: vaří celodenně, spí se
    v turistických pokojích i v pokojích s koupelnou a celoroční
    provoz doplňuje zimní role — dům stojí u nejdelší sjezdovky
    lyžařského Zieleńce. Na hřebenovku Orlických hor i k Masarykově
    chatě na Šerlichu je to odsud kousek přes hranici.
  - >-
    Údaje na téhle stránce pocházejí z webů PTTK a vlastivědného
    průvodce; polohu a kontakty nese OpenStreetMap. Kapacita číslem
    doložená není. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
zdroje:
  - popis: >-
      pttk.pl — výška ~850 m, skladba pokojů, celodenní stravování,
      adresa Zieleniec 79, Zieleniec nejvýše položená ves Sudet
      (čteno 10. 8. 2026)
    url: https://pttk.pl/accommodations/schronisko-pttk-orlica/
  - popis: >-
