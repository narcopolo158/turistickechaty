# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1895
    udalost: >-
      Na sedle vznikla hospoda — prameny kladou vznik „ok. 1895"
      (szlaki.pttk.pl), provozovatel píše o dřevěné stavbě z roku
      1896; rozpor o rok se nerozhoduje.
    zdroj: >-
      szlaki.pttk.pl — „powstało ok. 1895 r. jako gospoda";
      pttk.jgora.pl — dřevěná stavba 1896 (obojí čteno 10. 8. 2026).
  - rok: 1933
    udalost: >-
      Po přestavbě v letech 1927–33 tu Kladské horské towarzystwo
      otevřelo schronisko; dnes funguje pod hlavičkou PTTK.
    zdroj: >-
      szlaki.pttk.pl (čteno 10. 8. 2026) — „po remoncie w latach
      1927-33 Kłodzkie Towarzystwo Górskie uruchomiło tu schronisko,
      działające obecnie pod szyldem PTTK".
  - rok: 1942
    udalost: >-
      Přistavěna část verandy — „w tym kształcie schronisko
      przetrwało do dzisiaj".
    zdroj: pttk.jgora.pl (čteno 10. 8. 2026)

zajimavosti:
  - text: >-
      Sedlo Przełęcz Spalona u schroniska hlídají dva bunkry
      z třicátých let, maskované jako hospodářská stavení — chránily
      tehdy novou Sudetskou silnici; stojí tu i kříž z roku 1814.
    kategorie: jine
    zdroj: >-
      szlaki.pttk.pl (čteno 10. 8. 2026) — „dwa bunkry z lat 30.
      XX w., chroniące zbudowanej wtedy Autostrady Sudeckiej",
      „krzyż z 1814 r."

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěné schronisko na sedle Przełęcz Spalona v Bystřických horách —
  hospoda z konce devatenáctého století, kterou kladský horský spolek
  po přestavbě otevřel turistům, dnes pod hlavičkou PTTK: domácí
  kuchyně, turistické pokoje i místo na stan.
text:
  - >-
    Jagodna nese jméno nejvyšší hory Bystřických hor a stojí na
    jejich klíčovém sedle: hospoda tu vznikla kolem roku 1895,
    turistickým schroniskem se stala po přestavbě v letech 1927–33
    zásluhou kladského horského towarzystwa a veranda z roku 1942 jí
    dala podobu, kterou má dodnes.
  - >-
    Provoz je poctivě schroniskový: pokoje dvou-, tří- i vícelůžkové
    v turistickém standardu, místo na stan za domem a kuchyně, kterou
    provozovatel bez skromnosti nazývá znamenitou domácí. Přes sedlo
    vede Autostrada Sudecka a hlavní hřebenový tah Bystřických hor —
    v zimě je sedlo oblíbeným východiskem běžkařů.
  - >-
    Údaje na téhle stránce pocházejí z webů PTTK a z externího
    katalogu; polohu a kontakty nese OpenStreetMap. Výška se
    v pramenech o dva metry rozchází a zapsané je nižší číslo.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      pttk.jgora.pl (Sudeckie Hotele i Schroniska) — výška 811 m,
      dřevěná stavba 1896, veranda 1942, pokoje a stan, domácí
      kuchyně, adresa Spalona 6 (čteno 10. 8. 2026)
    url: https://www.pttk.jgora.pl/schronisko-pttk-jagodna/
  - popis: >-
      szlaki.pttk.pl — vznik ok. 1895 jako gospoda, přestavba
      1927–33 a Kłodzkie Towarzystwo Górskie, výška 809 m, bunkry
      a kříž na sedle (čteno 10. 8. 2026)
    url: https://dolnoslaskie.szlaki.pttk.pl/1108-dolnoslaskie-przelecz-spalona-schronisko-jagodna
  - popis: >-
      Externí katalog turistických chat ČR/SK 2026 — řádek Schronisko
