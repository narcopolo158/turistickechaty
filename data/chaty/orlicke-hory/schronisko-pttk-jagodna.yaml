interniPoznamky: >-
  Povýšeno z data/kandidati/orlicke-hory/schronisko-pttk-jagodna.yaml
  rešerší (10. 8. 2026). Klíč zařazení: schronisko PTTK s kuchyní
  a noclehem na hřebenovém sedle, katalogový objekt, kontinuita
  služby od ~1895. Druhý profil Orlických hor; příslušnost Gór
  Bystrzyckich do oblasti je rozhodnutá v zápisu oblasti (ORL-01).

  ROZPORY: vznik ok. 1895 × dřevěná stavba 1896; výška 809 × 811 —
