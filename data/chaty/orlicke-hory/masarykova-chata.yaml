# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1925
    udalost: >-
      Klub českých turistů chatu postavil v letech 1924–25 podle
      projektu brněnského architekta Bohuslava Fuchse (žáka Jana
      Kotěry); stavěl F. Capoušek z Hradce Králové. Slavnostně
      otevřena byla v září 1925 — vlastní web uvádí 14. 9. za účasti
      Aloise Jiráska, KČT píše o slavnostním otevření 27. 9.; obě data
      vedeme, rozpor nerozhodujeme.
    zdroj: >-
      vlastní web ubytovani-serlich.cz (načteno 10. 8. 2026) — stavba
      1924–25, Fuchs, Capoušek, otevření „14. 9. 1925 … za účasti
      Aloise Jiráska"; KČT, článek ke stému výročí (čteno 10. 8. 2026)
      — základní kámen září 1924, slavnostní otevření 27. září 1925.
  - rok: 1991
    udalost: >-
      Po pádu komunismu byla chata vrácena Klubu českých turistů;
      téhož roku se na ni natrvalo vrátila i busta prezidenta
      Masaryka, kterou z ní předtím dvakrát odstranily dějiny — za
      druhé světové války a znovu v padesátých letech.
    zdroj: >-
      KČT, článek ke stému výročí (čteno 10. 8. 2026) — „v roce 1991,
      kdy chatu opět předali KČT"; osudy busty tamtéž.
  - rok: 2025
    udalost: Chata oslavila sto let nepřetržité služby turistům.
    zdroj: >-
      KČT, články ke 100. výročí (čteno 10. 8. 2026).

zajimavosti:
  - text: >-
      Chatu navrhl Bohuslav Fuchs, jeden z nejvýznamnějších českých
      funkcionalistů — horská chata KČT od architekta brněnského
      Zemanova kavárenského pavilonu a hotelu Avion je na hřebeni
      Orlických hor nečekaná vizitka meziválečné moderny.
    kategorie: jine
    zdroj: >-
      autor projektu: vlastní web i KČT (čteno 10. 8. 2026); KČT ho
      uvádí jako „významného architekta … žáka Jana Kotěry"
  - text: >-
      Nese jméno prvního československého prezidenta a jeho busta
      sdílela osud země: zmizela za okupace, vrátila se po válce,
      znovu zmizela v padesátých letech a natrvalo je zpět od roku
      1991.
    kategorie: jine
    zdroj: KČT, článek ke stému výročí (čteno 10. 8. 2026)

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Funkcionalistická chata Klubu českých turistů z roku 1925 na hřebeni
  Orlických hor pod Šerlichem (1019 m) — projekt Bohuslava Fuchse,
  sto let nepřetržité služby, 54 lůžek a kuchyně, která vaří denně do
  půl sedmé. Srdce turistiky v Orlických horách.
text:
  - >-
    Masarykova chata je z generace velkých klubových staveb první
    republiky: KČT ji postavil v letech 1924 až 1925 podle projektu
    Bohuslava Fuchse, tehdy nastupující hvězdy brněnské moderny.
    Slavnostní otevření v září 1925 — podle jednoho pramene za účasti
    Aloise Jiráska — z ní rázem udělalo hlavní útočiště hřebene
    a tím zůstala dodnes; v roce 2025 oslavila rovnou stovku.
  - >-
    Dvacáté století se na chatě podepsalo hlavně skrze jméno a bustu
    prezidenta Masaryka: socha zmizela za války, po ní se vrátila,
    v padesátých letech zmizela znovu a definitivně je na místě od
    roku 1991, kdy se chata vrátila Klubu českých turistů. Dnes ji
    pro klub provozuje nájemce.
  - >-
    Prakticky vzato: 54 lůžek v pokojích od dvoulůžkových po
    třináctilůžkovou noclehárnu, restaurace s kuchyní do půl sedmé
    večer (v neděli do šesti). Chata stojí přímo na hřebenové
    magistrále pod vrcholem Šerlichu, pár minut od
    hraničního přechodu do polských Bystřických hor — je přirozeným
    středem hřebenových přechodů Orlických hor na obě strany.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu chaty, z článků
    KČT ke stému výročí a z externího katalogu; polohu nese
    OpenStreetMap. Datum slavnostního otevření se v pramenech liší
    (14. × 27. září 1925) a rozpor přiznáváme. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
