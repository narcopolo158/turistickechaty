# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Roubený klášterní hostinec ve švýcarském stylu z roku 1856 na hraně
  Broumovských stěn, hned vedle Dientzenhoferovy hvězdicové kaple
  z roku 1733. Turistům slouží od dob, kdy se sem chodilo na pouť —
  teď je ale zavřená: rekonstrukce má skončit v dubnu 2027.
text:
  - >-
    Hvězda je poutní místo na hraně Broumovských stěn: barokní kapli
    ve tvaru pěticípé hvězdy tu roku 1733 postavil Kilián Ignác
    Dientzenhofer a o sto let později, v roce 1856, k ní broumovský
    klášter nákladem opata Rottera přidal roubenou chatu ve
    švýcarském stylu — hostinec pro poutníky a zároveň sídlo hajného
    klášterního polesí. Málokterá česká chata má starší a čitelnější
    rodokmen.
  - >-
    Kdo sem míří teď, najde zavřeno: od září 2025 běží rekonstrukce
    a otevřít se má v dubnu 2027. Před uzavřením chata nabízela
    českou kuchyni u krbu a pětadvacet lůžek v pokojích a chatce —
    jak bude vypadat nabídka po opravě, zatím doloženo není.
  - >-
    Výhled z hrany stěn na broumovskou kotlinu funguje i se zavřenou
    hospodou — Hvězda zůstává jedním z hlavních cílů hřebenovky
    Broumovských stěn mezi Policí nad Metují a Broumovem, s kaplí,
    která patří k vrcholům venkovského baroka v Čechách.
  - >-
    Údaje na téhle stránce pocházejí z Kudy z nudy a z regionálních
    průvodců; souřadnice nese itras.cz, protože objekt zatím chybí
    v našich mapových podkladech. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
