interniPoznamky: >-
  Založeno BEZ OSM kandidáta (10. 8. 2026, desátý takový profil
  korpusu) — GPS z itras.cz; první profil nové oblasti broumovsko
  (pokyn Michala z 10. 8., Hvězda jmenována výslovně). Klíč zařazení:
  historický hostinec pro poutníky a turisty na hřebenové trase
  stěn — turistická minulost od 1856 (DATA-25), občerstvení pro
  veřejnost doloženo před rekonstrukcí.

  STAV mimo-provoz (rekonstrukce IX/2025 – IV/2027, vzor Bouřňák);
  kapacita 25 lůžek vedena jen v ověření (stav před uzavřením).
  Kontakty NEzapsány — itras údaje jsou k 2015 a nese poznámku
  o nekomunikujících majitelích; po dubnu 2027 dohledat znovu.

  K OVĚŘENÍ (DATA-04): kdo rekonstrukci vede a kdo bude provozovat
  (klášter? obec? nájemce?); katastr (Police n. M. × Křinice);
  výška chaty. Po znovuotevření překlopit stav. Fotka: kaple
  i chata jsou fotogenické — Commons jistě má, až bude okno DATA-02.
