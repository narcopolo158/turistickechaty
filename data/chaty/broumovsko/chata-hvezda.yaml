# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1733
    udalost: >-
      Na hraně stěn vyrostla barokní kaple Panny Marie Sněžné podle
      návrhu Kiliána Ignáce Dientzenhofera — půdorys má tvar
      pěticípé hvězdy a špici věže korunuje zlatá hvězda, která dala
      místu jméno.
    zdroj: >-
      Kudy z nudy (čteno 10. 8. 2026) — „postavena roku 1733 dle
      návrhu K. I. Dientzenhofera", hvězdicový půdorys, zlatá hvězda.
  - rok: 1856
    udalost: >-
      Broumovský klášter nechal z rozhodnutí a nákladem opata
      J. N. Rottera postavit vedle kaple roubenou chatu ve švýcarském
      stylu — sloužila jako hostinec a sídlo hajného hvězdeckého
      klášterního polesí.
    zdroj: >-
      Kudy z nudy (čteno 10. 8. 2026) — „postavena v roce 1856 ve
      švýcarském stylu", „z rozhodnutí a nákladem opata J.N.
      Rottera", „hostinec a sídlo hajného hvězdeckého klášterního
      polesí"; roubená stavba na kamenné podezdívce, kdysi pobitá
      břidlicí.
  - rok: 2025
    udalost: >-
      V září začala rekonstrukce; chata má být zavřená do dubna
      2027.
    zdroj: Kudy z nudy (čteno 10. 8. 2026)

zajimavosti:
