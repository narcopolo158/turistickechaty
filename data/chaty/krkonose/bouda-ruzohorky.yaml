# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda na Růžové hoře 3,5 km pod vrcholem Sněžky, na hlavní trase z Pece pod
  Sněžkou i z Velké Úpy (1 280 m). Ubytuje 20 hostů v deseti dvoulůžkových
  pokojích a vaří domácí krkonošskou kuchyni — borůvkové knedlíky, cmundu a
  kysel. Stojí od roku 1903. Nese turistickou známku č. 75.
text:
  - >-
    Bouda Růžohorky stojí na Růžové hoře v ochranném pásmu Krkonošského
    národního parku, zhruba tři a půl kilometru od vrcholu Sněžky; adresu má
    ve Velké Úpě u Pece pod Sněžkou. Leží přímo na hlavní trase, po níž se na
    Sněžku stoupá z Pece pod Sněžkou i z Velké Úpy. O nadmořské výšce se
    prameny rozcházejí: Kudy z nudy i archivní prezentace na Českých horách
    uvádějí shodně 1 280 metrů, na turistické známce je však vyryto 1 250
    metrů.
  - >-
    Bouda vznikla podle Kudy z nudy roku 1903 jako hostinský podnik a nesla
    tehdy jméno Leischnerovy boudy. O jejích dalších osudech dosažitelné
    prameny mlčí.
  - >-
    Ubytování má dvacet lůžek v deseti dvoulůžkových pokojích — v tom se Kudy
    z nudy i archivní prezentace na Českých horách shodují. K posezení slouží
    dvě nekuřácké místnosti v přízemí; podle archivní prezentace na Českých
    horách pojme restaurace celkem šedesát hostů. Kuchyně stojí na domácích
    výrobcích, vyhlášené jsou borůvkové knedlíky a koláče a z krkonošských
    specialit se tu podává cmunda a kysel. Pobyt se psem je podle stejné
    prezentace možný po předchozí domluvě.
  - >-
    Přístup autem je omezený nadmořskou výškou a polohou ve druhé zóně ochrany
    přírody, jak uvádějí České hory. Ubytovaní hosté mají podle Kudy z nudy v
    létě k dispozici pět parkovacích míst u farmy, v zimě mohou využít lanovou
    dráhu.
  - >-
    Všechny údaje na této stránce pocházejí ze sekundárních médií a redakce je
    zatím neověřila vlastním dotazem ani návštěvou; prezentace na Českých
    horách je navíc archivní. Celoroční provoz z pramenů spíš vyplývá —
    zmiňují letní i zimní režim — než že by ho některý výslovně potvrzoval,
    otvírací doba doložena není a ani jeden zdroj neříká, zda restaurace
    obslouží i kolemjdoucí, kteří tu nespí. Před cestou proto doporučujeme
    otvírací dobu i možnost stravování ověřit přímo u boudy.
