interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/bouda-ruzohorky.yaml (OSM way/291722059,
  DATA-01) v rámci master fronty Tier 1 (známka č.75 + OSM). Kandidát byl
  označen „K RUČNÍ KONTROLE" — křížové ověření se povedlo přes Kudy z nudy a
  České hory, vlastní web ruzohorky.cz zůstává ze sandboxu nedostupný.

  Zaznamenané rozpory k dořešení při DATA-04: (1) výška 1 280 m (Kudy z nudy +
  České hory) vs. 1 250 m vyrytých na turistické známce č.75 — do profilu vzato
  1 280 m jako shoda dvou nezávislých médií, ale rozdíl je nutné ověřit;
  (2) OSM nese druhé telefonní číslo +420 606 300 767, dosažitelná média je
  nepotvrzují — nepřevzato.

  Wi-Fi, platba kartou a lyžárna: zdroje neuvádějí — pole vědomě nevyplněna.
  Otvírací doba restaurace: nikde nedoložena — nevyplněna.

  K dotažení (DATA-04, verified:true): otvírací doba a veřejná přístupnost
  restaurace, potvrdit výšku (1250 vs 1280), kapacitu a kontakty, ověřit
  funkčnost webu. Hero fotka: kandidáti DATA-02. Známka č.75 — obrázek připraven
  v data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c75-ruzohorky.png.
