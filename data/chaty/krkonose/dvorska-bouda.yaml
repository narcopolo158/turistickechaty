# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská bouda ve výšce 1 313 m nad Strážným v KRNAP, s kapacitou až 115
  lůžek. Restaurace otevřená denně i pro kolemjdoucí turisty, ubytování
  poskytuje už od 20. let 20. století.
text:
  - >-
    Dvorská bouda stojí ve výšce 1 313 m n. m. na adrese Strážné 111, uvnitř
    Krkonošského národního parku. Ubytování tu funguje už od 20. let 20.
    století; dnes nabízí až 115 lůžek ve dvou- až šestilůžkových pokojích se
    společným sociálním zařízením.
  - >-
    Restaurace Dvorské boudy má otevřeno denně od 11 do 16 hodin a je
    přístupná hostům i turistům; ke snídani slouží bufet, k pobytu lze
    dokoupit polopenzi. K vybavení patří Wi-Fi zdarma v celém objektu,
    lyžárna a kolárna, klubovna s krbem i dětská herna — bouda cílí na
    rodiny a skupiny v létě i v zimě.
