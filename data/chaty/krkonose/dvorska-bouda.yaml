# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská bouda ve výšce 1 313 m nad Strážným v KRNAP, s kapacitou až 115
  lůžek. Restaurace otevřená denně i pro kolemjdoucí turisty, ubytování
  poskytuje už od 20. let 20. století.
text:
  - >-
    Dvorská bouda stojí ve výšce 1 313 m n. m. nad Strážným, uvnitř
    Krkonošského národního parku; web boudy uvádí adresu Strážné 111. Je to
    horská bouda s vlastní restaurací, která má otevřeno i pro kolemjdoucí
    turisty.
  - >-
    Kdy bouda vznikla, o tom prameny nemluví shodně. Vlastní web říká jen
    to, že ubytování tu bouda poskytuje „již od 20. let 20. století",
    a přesnější rok neuvádí. Podle Kudy z nudy je ale vznik na tomto místě
    doložen už rokem 1707 a lokalita sloužila až do druhé poloviny 19.
    století především k chovu dobytka; týž zdroj uvádí, že do roku 1945
    boudu vlastnil rod Adolfů. Kudy z nudy je sekundární médium a primárním
    pramenem tyto údaje zatím potvrzené nemáme.
  - >-
    Dnes bouda nabízí až 115 lůžek ve dvou- až šestilůžkových pokojích se
    společným sociálním zařízením; shodný počet lůžek uvádí web boudy
    i Kudy z nudy. Snídaně se podává formou bufetu, k pobytu si lze
    dokoupit polopenzi a web nabízí letní i zimní pobytové balíčky.
  - >-
    Restaurace Dvorské boudy má otevřeno denně od jedenácti do čtyř
    odpoledne a je přístupná ubytovaným hostům i turistům, kteří jdou
    kolem. K vybavení patří Wi-Fi zdarma v celém objektu, lyžárna
    a kolárna, klubovna s krbem a dětská herna. Na běžecké tratě je z boudy
    přímý přístup — vlastní web to shrnuje heslem „z chaty rovnou do
    běžek".
  - >-
    Pěší trasy k boudě ani možnosti dojezdu autem zatím doložené nemáme.
    Ostatní údaje pocházejí z webu boudy, z OpenStreetMap a z Kudy z nudy a
    redakce je zatím neověřila vlastním dotazem ani návštěvou; před cestou
    doporučujeme potvrdit si zejména otvírací dobu restaurace.
