# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda nad Špindlerovým Mlýnem (1 060 m) na úbočí Medvědína, s kořeny
  v budním hospodářství počátku 19. století a s přístřeším až pro 145
  hostů. Restaurace podle vlastního webu slouží v současné době jen
  ubytovaným — ještě v létě 2025 tu ale borůvkové knedlíky dostali
  i hosté, kteří v boudě nespali.
text:
  - >-
    Medvědí bouda stojí podle vlastních stránek nad Špindlerovým Mlýnem
    v nadmořské výšce 1 060 metrů, na úbočí Medvědína mezi Dvorským
    a Medvědím potokem. Od středu městečka ji dělí čtyři a půl kilometru.
    Jméno sdílí s vrcholem, na jehož svahu stojí; proč se tak jmenuje, web
    boudy nevysvětluje a my se to domýšlet nepokoušíme.
  - >-
    O své minulosti říká bouda dvě věci. Vznikla na počátku 19. století
    jako zařízení takzvaného budního hospodářství — podle vlastního webu
    ale už tehdy spojeného s ubytováním pro návštěvníky hor, takže
    turistům slouží prakticky od začátku. A do dnešní podoby, která se
    prý od té původní mnoho neliší, byla přestavěna v sedmdesátých letech
    minulého století. Přesnější letopočty web neuvádí, a tak je neuvádíme
    ani my.
  - >-
    Dnes bouda nabízí přístřeší až pro 145 hostů a restauraci s domácí
    kuchyní. U té je ale třeba říct věc, kterou návštěvník zvenku pozná
    až přede dveřmi: web boudy výslovně píše, že restaurace je
    „v současné době" otevřena pouze pro ubytované a ostatním turistům
    restaurační služby z kapacitních důvodů nenabízí. Nebývalo to tak
    vždycky — při naší návštěvě v létě 2025 tu borůvkové knedlíky dostali
    i hosté bez noclehu. Co z toho platí právě letos, nevíme; kdo jde
    kolem a počítá s obědem, měl by si to ověřit předem.
  - >-
    Otvírací dobu, sezónu ani kontakty kromě webových adres se nám
    z dostupných pramenů doložit nepodařilo — bouda má ostatně webové
    stránky hned na dvou adresách a která z nich je ta hlavní, poznat
    neumíme. Výška, kapacita i historie pocházejí z vlastní prezentace
    boudy a vlastním dotazem jsme je zatím neověřili; souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

