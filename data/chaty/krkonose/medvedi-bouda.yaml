interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/medvedi-bouda.yaml (DATA-01, OSM) 26. 7. 2026 na základě rozhodnutí Michala o rozšíření klíče zařazení (DATA-25): bouda s turistickou službou v minulosti se uvádí i bez dnešní veřejné služby, s poctivou poznámkou. Předchozí verdikty „nepovyšovat" (25. 7. — restaurace jen pro ubytované; přeověřeno 26. 7. ráno) tím revidovány.
  ROZPOR vedený otevřeně: oba weby boudy říkají „restaurace jen pro ubytované" (jeden s dovětkem „v současné době"), svědectví Michala z léta 2025 říká, že tehdy obsloužili i neubytované. Nerozhodnuto; telefonát (DATA-04) to může uzavřít — otázka: „obsloužíte i neubytovaného turistu?"
  DVĚ DOMÉNY: medvedi-bouda.cz (novější prezentace) i medvedibouda.cz (starší, obsahově bohatší — O nás). Obě živé 26. 7. 2026; do kontaktů vzata první, druhá ve zdrojích. Která je hlavní, nedoloženo.
  KAPACITA: 145 z vlastního webu („až pro 145 hostů"). Čísla 110/120 ze starého kandidátského záznamu byla bez pramene — nepřevzata (poučení DATA-17 o nedoložených větách v poznámkách).
  Turistická známka č. 1274 (Medvědí bouda) je v oficiálním seznamu vydavatele z července 2026 (DATA-22) — ale katalog znamky-vizitky.csv řádek pro ni nemá, takže data10 kartu sběratelských míst nevyrobí; doplnění katalogu vedeno v DATA-22. Kde se známka prodává, nevíme.
  K dotažení (DATA-04 / další rešerše): telefon a e-mail, otvírací doba, sezóna, provozovatel, rok vzniku a přesnější historie (web mlčí), hero fotka (kandidáti z Commons připraveni), stav restaurace pro veřejnost letos.
