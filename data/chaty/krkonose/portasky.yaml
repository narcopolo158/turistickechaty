# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata u horní stanice lanovky z Velké Úpy nad Pecí pod Sněžkou.
  Restaurace má otevřeno denně do jedenácti večer a spát se dá v
  rekonstruovaných pokojích, ve spacáku i v Haciendě ve větvích stromů; k
  vybavení patří sauna s bazénem a vířivka. Údaje pocházejí ze
  sekundárních médií a ověřené zatím nejsou.
text:
  - >-
    Chata Portášky stojí nad Velkou Úpou v katastru Pece pod Sněžkou; adresa
    zní Velká Úpa 110. Dva prameny ji shodně umisťují přímo k horní stanici lanovky z Velké Úpy;
    kolem chaty vede interaktivní stezka Pecka.
  - >-
    Nadmořskou výšku na téhle stránce záměrně nenajdete. Externí katalog, ze kterého vycházíme, uvádí 1 060 metrů, zatímco rytina
    na turistické známce nese 1 050 metrů; jiné prameny výšku nezmiňují,
    takže ani jedna z obou hodnot nemá druhý nezávislý doklad. Než se to podaří
    ověřit, raději tu nestojí žádné číslo.
  - >-
    Historii chaty se z dosažitelných pramenů doložit nepodařilo. Rok vzniku, stavební osudy ani dřívější majitele neuvádí žádný z
    dosažitelných pramenů a vlastní web chaty se nepodařilo načíst; tahle
    část příběhu tedy zatím zůstává prázdná.
  - >-
    Dnešní provoz je celoroční a restaurace má mít otevřeno každý den od
    deseti dopoledne do jedenácti večer. Starší archivní prezentace k tomu
    doplňuje, že restaurace s barem pojme pětapadesát hostů a jídelna dalších
    padesát a že kuchyně kombinuje česká a italská jídla. Zveřejněná denní otvírací doba je zároveň nejsilnější doklad, který
    u téhle chaty mluví o občerstvení otevřeném i lidem, kteří tu nespí;
    potvrzení přímo od provozovatele zatím nemáme.
  - >-
    Spát se dá několika způsoby. Nabízejí se nově zrekonstruované pokoje s vlastní koupelnou a toaletou i
    pokoje třídy klasik se společným sociálním zařízením a k tomu možnost
    přespat ve spacáku nebo v Haciendě postavené ve větvích stromů. Kapacitu
    novější pramen neuvádí, starší archivní prezentace mluví o osmdesáti až
    devadesáti osobách. K vybavení patří sauna s bazénem a vířivka; o Wi-Fi,
    platbě kartou, psech ani lyžárně se ani jeden z pramenů nezmiňuje.
  - >-
    Přístup se liší podle ročního období. Podle staršího archivního údaje lze v létě parkovat přímo u chaty,
    zatímco v zimě se k ní hosté dostanou lanovkou z Velké Úpy, která jezdí
    do pěti odpoledne, případně po domluvě rolbou nebo skútrem. Protože jde o
    archivní údaj, může být dnešní režim jiný.
  - >-
    Všechny popisy i čísla na téhle stránce pocházejí ze sekundárních médií
    vypsaných dole ve zdrojích a redakce je zatím neověřila; jedno z nich je
    navíc archivní. Nedoložená zůstává výška, historie i přesná kapacita. Před cestou
    doporučujeme si otvírací dobu restaurace a v zimě i provoz lanovky ověřit
    přímo u chaty.
zdroje:
  - popis: >-
      Kudy z nudy — „Chata Portášky ve Velké Úpě" (adresa, poloha u lanovky,
      typy ubytování, restaurace a otvírací doba, sauna s bazénem a vířivka,
      kontakty); sekundární médium, verified:false, ověřit primárně
    url: https://www.kudyznudy.cz/aktivity/chata-portasky-ve-velke-upe
  - popis: >-
      České hory — „Chata Portášky" (kapacita 80–90 osob, restaurace s barem a
      jídelna, česká a italská kuchyně, parkování a zimní přístup); prezentace
      je archivní, sekundární médium, verified:false
    url: https://www.ceskehory.cz/ubytovani/chata-portasky-velka-upa.html
  - popis: >-
      Katalog turistických známek (Turistické známky s.r.o.) — známka č. 675
      „Portášky, Krkonoše", vedená v oficiálním seznamu vydavatele; číslo
      ověřené z fyzické známky, rytina nese výšku 1 050 m. Odkaz na detail je
      sestaven podle vzoru webu a klikem neověřený. verified:false
    url: https://www.turisticke-znamky.cz/znamky/portasky-c675
interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/portasky.yaml (externí katalog ČR/SK,
  jistota B) v rámci master fronty Tier 1 (známka č.675 + katalog).

  BEZ GPS — katalog souřadnice nenese a objekt není ani v OSM exportu DATA-01;
  doplnit z OSM přes Actions nebo ručně (nedomýšlet).

  ⚠ VÝŠKA VĚDOMĚ NEVYPLNĚNA: katalog nesl 1 060 m, rytina známky č.675 nese
  1 050 m a ani Kudy z nudy, ani České hory výšku neuvádějí — žádná varianta
  tedy nemá druhý nezávislý doklad. Raději prázdné pole než tipovaná hodnota;
  doplnit při DATA-04 (mapa/primární ověření). Je to jediný profil dávky bez
  výšky.

  Klíč zařazení — DOLOŽENO NEJSILNĚJI Z DÁVKY: Kudy z nudy zveřejňuje otvírací
  dobu restaurace „pondělí – neděle 10:00 – 23:00" a celoroční provoz, což
  odpovídá podniku otevřenému veřejnosti, ne jen ubytovaným. Přesto ověřit.

  Kapacita: České hory (archiv) uvádějí rozmezí „80–90 osob"; pole nese jediné
  číslo, vzato 90 a rozmezí zapsáno v overeniNocleh — ověřit přesné číslo.
  Telefon: zdroj má dvě čísla (+420 608 901 390 a +420 602 313 898), pole nese
  jediné — vzato první.

  Wi-Fi, platba kartou, psi a lyžárna: zdroje neuvádějí — pole vědomě
  nevyplněna. Historie a rok vzniku: nedoloženy.

  K dotažení (DATA-04, verified:true): GPS, VÝŠKA (priorita), přesná kapacita,
  potvrdit otvírací dobu a druhý telefon, historie a rok vzniku, provozní režim
  lanovky v zimě. Hero fotka: kandidáti DATA-02. Známka č.675 — obrázek
  připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c675-portasky.png.

  DATA-02 (2026-07-28, první sklizeň kategorie+fulltext pro chatu bez GPS): 13
  kandidátů, vesměs lanovka Velká Úpa–Portášky, sjezdovka, rozcestník a
  Sagesserovy boudy — žádný popis nepotvrzuje budovu chaty Portášky, hero
  zůstává nevybráno (oční výběr, nebo foto od chataře).

  GPS DOPLNĚNA 28. 7. 2026 (DATA-31, OpenStreetMap — doklad v
  overeniLokace): starší věty výše o chybějících souřadnicích tím padají.
  Zůstávají schválně, je z nich vidět, čím profil prošel.
