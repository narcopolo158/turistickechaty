# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Roubenka na pecké sjezdovce, kterou roku 1927 postavil německý spolek
  zimních sportů a která nesla jméno Kazbek — stejné krycí jméno měla za
  okupace odbojová skupina Karla Konopiského. Dnes se chata pronajímá
  vcelku; jako spolková lyžařská bouda zanikla, a právě ten příběh je
  důvod, proč ji v průvodci vedeme.
text:
  - >-
    Konopindova chata stojí přímo na sjezdovce nad Pecí pod Sněžkou.
    Podle vlastního webu ji jako dřevěnou roubenku postavila v roce 1927
    skupina německého spolku zimních sportů — vznikla tedy jako spolková
    lyžařská chata, součást éry, kdy si kluby stavěly své základny přímo
    ve svazích.
  - >-
    Jméno je tu příběh sám o sobě: chatě se říkalo Kazbek a stejný krycí název měla v době nacistické hrůzovlády odbojová skupina,
    jejímž členem byl Karel Konopiský, narozený 1888 a zavražděný 1942.
    Po válce byla chata na podzim 1945 zestátněna dekretem o konfiskaci
    nepřátelského majetku a na jaře 1946 svěřena se sousedními chatami
    do správy Svazu lyžařů. V padesátých letech se pak u názvoslovné
    komise prosadil dnešní nezvyklý název Konopindova chata — jméno
    Kazbek neprošlo.
  - >-
    Dnes se chata pronajímá vcelku a občerstvení nenabízí — kolemjdoucí
    lyžař či turista tu tedy nezastaví. Vedeme ji proto mezi zaniklými
    boudami: dům žije, ale spolková lyžařská služba, kterou vznikl,
    patří minulosti. Nadmořskou výšku neuvádíme, žádný pramen ji nenese.
  - >-
    Historie pochází z vlastního webu chaty, který k ní neodkazuje
    doklady — přebíráme ji s připsáním; vlastním dotazem jsme zatím
    neověřili nic. Souřadnice jsou z mapových dat OpenStreetMap
    (© přispěvatelé OpenStreetMap, ODbL) a v terénu je nikdo
    nekontroloval.

