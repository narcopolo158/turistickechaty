interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/prazska-bouda.yaml (externí katalog ČR/SK) 26. 7. 2026 na základě rozhodnutí Michala o rozšíření klíče zařazení (DATA-25). Verdikty „zůstává kandidátem" z 25. 7. a z rána 26. 7. tím revidovány — materiál beze změny, změnil se klíč.
  Podle DATA-22 má bouda známku č. 2249 (oficiální seznam vydavatele, červenec 2026) — fakticky tedy byla Tier 1 (známka + katalog), ač ji master fronta vedla v Tier 3; katalog znamky-vizitky.csv pro ni vede jen vizitku CZ-5981 (Wander Book — bez svolení se nepoužívá) a řádek známky 2249 CHYBÍ; doplnění katalogu vedeno v DATA-22, bez něj data10 kartu sběratelských míst nevyrobí.
  ROZPORY A MEZERY vedené otevřeně: obec Pec pod Sněžkou (katalog, bez opory) × Černý Důl (adresa ve dvou zápisech) — pole přepsáno na adresní hodnotu, exponát DATA-20; veřejnost restaurace nedoložena (otvíračka 11–22 denně na Firmy.cz je nejsilnější signál; otázka na telefonát DATA-04); historie nedoložena vůbec; GPS chybí; kapacita lůžek nedopočítávána z 24×2.
  K dotažení (DATA-04 / Michal): web v prohlížeči (sandbox ho nenačte), telefonát — veřejnost restaurace; GPS s pramenem; historie (samostatná rešerše — knižní prameny?); hero fotka po doložení GPS.

  DATA-02 (2026-07-28): popisy fotoserie ŠJů na Commons uvádějí „Černý Důl,
  Lučiny, čp. 215, Pražská bouda" — další nezávislý zápis pro adresu Černý Důl
  215 (k adresnímu rozporu vedenému výše; popisy na Commons jsou sekundární
  pramen).

  GPS DOPLNĚNA 28. 7. 2026 (DATA-31, OpenStreetMap — doklad v
  overeniLokace): starší věty výše o chybějících souřadnicích tím padají.
  Zůstávají schválně, je z nich vidět, čím profil prošel.
