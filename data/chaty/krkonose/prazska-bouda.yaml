# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel na známé křižovatce cest mezi Pecí pod Sněžkou, Černou
  horou a Černým Dolem, ve výšce 1 115 metrů u sjezdovky Mulda. Má přes
  dvacet pokojů, restauraci s barem a letní terasou a sál pro sto lidí.
  O historii boudy jsme zatím nedoložili vůbec nic — a říkáme to raději
  rovnou, než abychom si ji domýšleli.
text:
  - >-
    Pražská bouda stojí podle katalogu České hory na známé křižovatce
    mezi Pecí pod Sněžkou, Černou horou a Černým Dolem, ve výšce 1 115
    metrů nad mořem; Kudy z nudy ji klade na hřeben, kousek od sjezdovky
    Mulda. Adresou patří k Černému Dolu — starší katalogový podklad ji
    vedl pod Pecí pod Sněžkou, ale bez viditelné opory, takže se držíme
    adresy. Na křižovatce katastrů je to rozdíl, který stojí za přiznání.
  - >-
    Provozem je to horský hotel. Kudy z nudy popisuje čtyřiadvacet
    dvoulůžkových pokojů s možností přistýlek, koupelnovým koutem na
    pokoji a společným sociálním zařízením na patře. K tomu podle katalogu
    České hory patří vlastní restaurace s barem, sál s kapacitou sto
    lidí a menší salónek, kulečník, deskové hry, knihovna i sauna; Kudy
    z nudy přidává letní terasu. Externí katalog vede provoz jako
    celoroční.
  - >-
    U restaurace je třeba říct jednu věc na rovinu. Firemní katalog ji
    vede jako samostatný podnik s otvírací dobou od jedenácti dopoledne
    do deseti večer, každý den — jenže výslovnou větu, že tu obslouží
    i turistu, který v hotelu nespí, jsme nenašli nikde. A protože známe
    v Krkonoších i boudu, jejíž restaurace slouží jen ubytovaným, nebudeme
    to domýšlet: kdo jde kolem a počítá s obědem, ať si to raději předem
    ověří.
  - >-
    O minulosti boudy neumíme doložit vůbec nic — ani rok vzniku, ani
    to, jak přišla ke svému jménu. Hledali jsme, nenašli; to není totéž
    jako tvrdit, že žádná historie není, a jakmile se pramen objeví,
    doplníme ji. Souřadnice boudy zatím doloženy nemáme, proto ji na
    mapě neukazujeme. Vlastní web boudy se nám opakovaně nepodařilo
    otevřít, takže všechno výše pochází z katalogů a portálů a vlastním
    dotazem jsme zatím neověřili nic.

