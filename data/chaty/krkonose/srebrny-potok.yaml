# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko v údolí Białego Strumienia nad vsí Jarkowice, na východním
  okraji polských Krkonoš (615 m). Nabízí nocleh — sám uvádí 45 míst, druhý pramen 35 — a velký dřevěný bar;
  otevřeno má podle vlastních slov nepřetržitě. O historii objektu jsme zatím
  nedoložili nic.
text:
  - >-
    Srebrny Potok stojí podle vlastních stránek v údolí Białego
    Strumienia nad vsí Jarkowice, na východních svazích Grzbietu
    Lasockého — tedy na východním okraji polských Krkonoš, stranou
    hlavního hřebene, ve výšce 615 metrů. Je to nejníže položený
    a nejvýchodnější objekt tohoto průvodce; kdo přechází Lasocký hřbet
    směrem k Okraji, má schronisko pod sebou na polské straně.
  - >-
    Provozem je to klasické polské schronisko turystyczne: nocleh a velký
    dřevěný bar, otevřeno podle vlastního webu nepřetržitě a po celý rok.
    Na počtu míst se prameny neshodnou — vlastní stránky uvádějí 45,
    portál Naszesudety 35 — a protože nevíme, které číslo je novější,
    uvádíme obě a v přehledu vedeme opatrnější nižší. U baru výslovná věta o obsluze kolemjdoucích na webu
    nestojí; u schroniska s nepřetržitým provozem ji ale nahrazuje sama
    povaha podniku.
  - >-
    O historii objektu neumíme doložit vůbec nic — žádný letopočet, žádné
    starší jméno. Hledali jsme a nenašli; jakmile se pramen objeví,
    doplníme ho. Do té doby je Srebrny Potok v průvodci hlavně jako
    praktická zastávka východního okraje hor.
  - >-
    Poloha, výška, kapacita i provoz pocházejí z vlastního webu schroniska
    a z polských turistických portálů; vlastním dotazem jsme zatím
    neověřili nic. Souřadnice jsou z mapových dat OpenStreetMap
    (© přispěvatelé OpenStreetMap, ODbL) a v terénu je nikdo nekontroloval.

