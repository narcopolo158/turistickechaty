# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bufet a obchůdek na vrcholu Wysokého Kamienia (1056 m) nad Szklarskou
  Porębou, na Głównym Szlaku Sudeckim. Turistická bouda tu stála od roku 1837
  a patřila k prvním v Sudetech; dnešní objekt vzniká jako soukromé schronisko
  od roku 1996 a nová budova se teprve staví.
text:
  - >-
    Wysoki Kamień je vrchol ve Wysokim Grzbietu Gór Izerskich, který se zvedá
    západně nad Szklarskou Porębou. Do našeho průvodce patří proto, že přes něj
    vede Główny Szlak Sudecki a že na něm turisté najdou otevřené občerstvení —
    ne proto, že by to byly Krkonoše. Ty odsud jsou vidět, ale hřeben je
    izerský.
  - >-
    Výška se v pramenech rozchází a rozřešenou ji nemáme. Katalog dolnoslezských
    značených tras uvádí u schroniska 1056 metrů a hned v textu u vrcholu 1058;
    hodnotu 1058 nese shodně i mapová databáze a dva regionální turistické weby,
    ty ale mluví o kótě vrcholu. Zůstáváme u nižšího čísla a rozdíl přiznáváme —
    nejspíš jde o rozdíl mezi vrcholem a budovou pod ním, doložené to ale není.
  - >-
    Historie místa sahá hluboko do devatenáctého století. Boudu Hochsteinbaude
    tu nechali Schaffgotschové postavit v roce 1837 a podle pramene byla jednou
    z prvních v Sudetech; v roce 1882 na místě stojí novější budova, o níž ale
    nevíme, jestli šlo o stavbu novou, přestavbu, nebo rozšíření — pramen to
    neříká. Ta budova byla v roce 1963 zbourána a do téhož roku tu turistické
    schronisko fungovalo. Pak přišla víc než třicetiletá pauza.
  - >-
    Od roku 1996 na vrcholu vzniká soukromé schronisko Wysoki Kamień a hospodaří
    tu rodina Gołbů ze Szklarské Poręby. Slovo „vzniká" je tu přesnější než
    „stojí": prameny se shodují, že se nová budova schroniska pořád staví
    a že dnes na místě funguje obchůdek a skromný bufet. Kolik je uvnitř lůžek
    a jestli se dá přespat, neuvádí ani jeden — proto to netvrdíme. Vedle
    schroniska od roku 2015 roste rozhledna; jestli je hotová, doložené nemáme.
  - >-
    Cesta sem vede pěšky. Ze Szklarské Poręby stoupá červená značka Głównego
    Szlaku Sudeckiego, která pokračuje na Świeradów-Zdrój, a ze Szklarské
    Poręby Dolní žlutá přes Zakręt Śmierci. Katalog značených tras vede vrchol
    ještě na trase do Borowic, dlouhé dvaadvacet kilometrů. Délky a časy, které
    prameny uvádějí, patří celým trasám, ne výstupu k boudě, takže je jako
    přístupové časy nepřebíráme. O příjezdu autem nepíše žádný pramen.
  - >-
    Otvírací dobu — v létě od deseti do šesti, v zimě do čtyř — nese jen mapová
    databáze v surovém strojovém formátu a je z ní vidět, že objekt funguje
    celoročně. Vlastní stránky boudy se nám otevřít nepodařilo, takže všechno
    výše pochází z třetích pramenů a redakce zatím nic z toho neověřila vlastním
    dotazem ani návštěvou. Před cestou proto doporučujeme ověřit si přímo
    u provozovatele, zda je otevřeno a v jakém režimu.

