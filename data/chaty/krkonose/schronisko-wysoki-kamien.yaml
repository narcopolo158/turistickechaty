interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/schronisko-wysoki-kamien.yaml (DATA-01,
  koš B triáže) na přímý pokyn Michala z 28. 8. 2026 („wysoki kamien povysit"),
  po čtení pramenů v denní session téhož dne. Vše verified: false dle konvence
  B — ověří teprve Michal vlastním dotazem nebo návštěvou.

  ZAŘAZENÍ DO OBLASTI: objekt leží ve Wysokim Grzbietu GÓR IZERSKICH, ne
  v Karkonoszích. Do oblasti krkonose spadá proto, že tam sahá naše
  vyhledávací okno — severní hranu na 50,84 posunul Michal 28. 7. 2026 kvůli
  Kochanówce a polské podhůří nad Szklarskou Porębou tím do okna patří.
  Wysoki Kamień je 50,8457, tedy těsně nad tou hranou. Próza to říká nahlas
  hned v prvním odstavci, aby profil nepředstíral, že je to krkonošská bouda.
  Pokud jednou vznikne oblast „Góry Izerskie", tenhle profil je první kandidát
  na přesun.

  CO PROFIL VĚDOMĚ NEVYPLŇUJE:
  — nocleh: žádný pramen neuvádí lůžka ani kapacitu a všechny tři shodně
    píšou, že se nová budova schroniska teprve staví. Vyplnit „ne" by bylo
    stejné domýšlení jako vyplnit „ano".
  — telefon a e-mail: nedohledány.
  — přístupové časy: prameny nesou jen celotrasové délky (GSS 78,7 km /
    32:30 h, Borowice 22,1 km / 8:45 h), což o výstupu k boudě neříká nic.

  ROZPOR VÝŠKY 1056 × 1058 je v profilu přiznaný v overeniLokace i v próze.
  Zapsáno nižší číslo dle konvence z 27. 7. 2026. Hypotéza (NEDOLOŽENÁ, proto
  není v próze jako fakt): 1058 je kóta vrcholu a 1056 patří budově pod ním.

  VLASTNÍ WEB SE NEPODAŘILO OTEVŘÍT: wysokikamien.com.pl posílá nekonečný
  redirect https → http (302 na tutéž adresu, WebFetch upgraduje zpět na
  https). Je to nový vzor nedostupnosti — dosud jsme v projektu potkali jen
  robots.txt (Archa Krkonoš, javorka.eu, chatamisecky.cz, sokoliboudy.cz,
  havlovabouda.cz). Až se web přečte, doplnit kontakty, kapacitu, sezónu
  a stav rozhledny.

  DO DATA-04 DOTÁHNOUT: telefon (e-mail z OSM ověřit), je-li nocleh a kolik lůžek, jestli
  je rozhledna z roku 2015 dokončená (termín 2023 nese pramen v budoucím čase),
  rozpor výšky 1056/1058 a co se přesně stalo v roce 1882.

  FOTKA ZATÍM ŽÁDNÁ — licenční síto DATA-02 nad tímhle objektem neběželo.
