# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata Klubu českých turistů v Obřím dole u Pece pod Sněžkou, ve výšce
  890 metrů pod Studničnou horou, nedaleko nástupní stanice lanovky na
  Sněžku. Nabízí 47 lůžek v patnácti pokojích se snídaněmi a večeřemi pro
  ubytované; jestli tu něco dostane i kolemjdoucí, se nám doložit
  nepodařilo.
text:
  - >-
    Chata Pod Studničnou stojí v Obřím dole kousek od Pece pod Sněžkou,
    v nadmořské výšce 890 metrů — a jak připomíná server Krkonošské boudy,
    jméno nelže: chata sedí přímo pod Studničnou horou. Stránka Klubu
    českých turistů k tomu přidává praktickou polohu nedaleko nástupní
    stanice lanovky na Sněžku.
  - >-
    Jde o chatu Klubu českých turistů. Ubytuje 47 hostů v patnácti
    pokojích a ubytovaní mají podle KČT snídaně a večeře formou bohatých
    bufetů; vlastní prezentace chaty mluví o švédském stole ráno a večeři
    formou rautu. Jednu věc ale musíme říct na rovinu: ani jedna z obou
    stránek neříká, jestli se tu občerství i turista, který v chatě
    nespí. Poloha u nástupu na Sněžku k té domněnce svádí — a právě proto
    ji odmítáme domýšlet. Kdo jde kolem, ať raději počítá s tím, že jistotu
    občerstvení slíbit neumíme.
  - >-
    O historii víme zatím míň, než by si dům v Obřím dole zasloužil.
    Stránka KČT prozrazuje jedinou, zato zajímavou věc: dnešní jméno nese
    chata jen posledních šedesát let — je tedy mladší než objekt sám.
    Server Krkonošské boudy píše, že historie boudy se začíná psát koncem
    19. století, ale žádný letopočet ani starší jméno jsme zatím doložit
    nedokázali; jakmile se pramen najde, doplníme obojí.
  - >-
    Chata má webové prezentace hned dvě — jednu uvádí KČT, druhou si vede
    sama — a my jsme mohli otevřít jen tu druhou; všechno výše proto
    pochází hlavně ze stránky KČT a z ní. Souřadnice zatím nemáme
    doloženy z žádného pramene, proto chatu na mapě neukazujeme. Vlastním
    dotazem jsme neověřili nic; provozní podrobnosti se navíc mohou měnit
    s nájemcem, kterého KČT vede smlouvou na dobu určitou.

