interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/vebrovy-boudy.yaml (DATA-01) po křížovém
  ověření DATA-03 a rozhodnutí Michala (chat 20. 7. 2026): hraniční hotely /
  penziony v roli historických bud zařazujeme, charakter přiznat (typ
  horsky-hotel, perex „horský penzion"). Oficiální web vebrovyboudy.com se ze
  sandboxu nenačetl (robots.txt ConnectTimeout / provenance) — obsah doložen z
  katalogu info-cechy.cz, proto vše verified: false; dotáhnout přímo z webu /
  telefonicky v DATA-04 (mj. sezóna, otvírací doba, e-mail, historie/rok
  vzniku, křížová kontrola výšky 1 100 m). Diakritika Vebrovy/Vébrovy
  sjednocena na „Vebrovy" dle domény a OSM; „Vébrovy boudy" jako alias.

  DATA-15 (jazykový audit 25. 7. 2026, čtvrtá dávka): opraveny tři vady.
  (1) Perex tvrdil „v historických Vebrových boudách" jako doložený fakt,
  ač soubor nemá rokVzniku, milníky ani blok overeniHistorie a text[1]
  o dva odstavce dál sám přiznává „Kdy boudy vznikly a jakými proměnami
  prošly, se nám doložit nepodařilo" — rozpor uvnitř jednoho profilu.
  Sjednoceno na opatrné „v roli historických bud", což je formulace
  rozhodnutí Michala z 20. 7. 2026 a zavedený tvar sesterských hraničních
  profilů (tetrevi-boudy, hotel-spindlerova-bouda); týž přívlastek
  odstraněn i z alt textu hero fotky, kde je taky veřejně čitelný.
  (2) Závěrečný odstavec tvrdil, že „všechny tyhle údaje pocházejí
  z katalogového profilu" — souřadnice ale pocházejí z OpenStreetMap,
  jak rozlišuje overeniLokace i zdroje[2], a věta tím rušila připsání,
  které žádá licence ODbL. Přepsáno na rozlišující formulaci podle
  domácího vzoru (tetrevi-boudy, schronisko-kamienczyk). (3) Próza
  zužovala „pro školy a kluby plná penze" na „školám a sportovním klubům"
  — přívlastek citace nenese, nejbližší opora (volejbal, malý fotbal)
  je souvislost, ne doklad; vypuštěn.
  ZAMÍTNUTO jako nedorozumění auditu: „v katastru Pece pod Sněžkou" je
  doložené polem obec i adresou v overeniLokace a je to zavedený domácí
  tvar (portasky u sousedního objektu doslova „stojí nad Velkou Úpou
  v katastru Pece pod Sněžkou"). Slovo „profil" ve spojení „katalogový
  profil" neoznačuje náš datový soubor, ale stránku pramene — doložený
  styl napříč korpusem. „Hřiště na volejbal a malý fotbal" proti citaci
  „volejbal a malý fotbal" nepřidává tvrzení, jen pojmenovává místo.
  Perex „stravování formou penze" nepotřebuje výhradu o veřejnosti jako
  Špindlerova bouda, protože penze je z definice pro ubytované a text[2]
  to říká výslovně.
