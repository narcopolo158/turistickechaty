# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský penzion v roli historických Vebrových bud nad Velkou Úpou (1 100 m),
  u vrchní stanice vleku Javor. Kapacita 75 lůžek ve dvou- až sedmilůžkových
  pokojích, stravování formou penze, v létě venkovní bazének.
text:
  - >-
    Vebrovy boudy stojí ve výšce zhruba 1 100 m n. m. nad Velkou Úpou,
    v katastru Pece pod Sněžkou. Jméno se objevuje ve dvou podobách: katalogy
    píší Vébrovy, doména penzionu a OpenStreetMap Vebrovy. Podle katalogu
    Info-Čechy jsou boudy u vrchní stanice vleku Javor a na rozcestí
    běžkařských tras.
  - >-
    Dnes tu funguje horský penzion. Ten charakter přiznáváme — do průvodce
    objekt řadíme jako hraniční případ ubytování v roli historických bud.
    Kdy boudy vznikly a jakými proměnami prošly, se nám doložit nepodařilo.
  - >-
    Ubytovací kapacitu uvádějí Info-Čechy na 75 lůžek ve dvou- až
    sedmilůžkových pokojích. Stravování je řešené formou polopenze
    s klasickou českou stravou a snídaní podávanou švédským stolem, školám
    a klubům penzion nabízí i plnou penzi. Restaurace otevřená veřejnosti
    mimo ubytované hosty doložená není.
  - >-
    Z vybavení týž katalog jmenuje Wi-Fi, hřiště na volejbal a malý fotbal,
    ohniště s grilem, v létě venkovní vyhřívaný bazének a v zimě zápůjčku
    slalomových tyčí. Přímo u objektu je parkoviště, takže se sem dá dojet
    autem.
  - >-
    Souřadnice objektu pocházejí z OpenStreetMap (© přispěvatelé
    OpenStreetMap, ODbL), ostatní údaje z katalogového profilu, ne
    z vlastního webu penzionu, který se nám zatím nepodařilo otevřít;
    redakce je neověřila vlastním dotazem. Nedoložená zůstává sezóna
    i otvírací doba, proto
    doporučujeme termín a podmínky pobytu potvrdit si přímo u provozovatele.
