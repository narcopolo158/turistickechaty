# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Roubená chata z let 1880 až 1890 na jižním svahu mezi Velkou Úpou
  a Pecí pod Sněžkou, v 833 metrech kousek nad silnicí. Dům stojí
  a pronajímá se — jako bouda sloužící turistům ale zanikl, a proto ho
  v průvodci vedeme mezi zaniklými: připomíná éru, kdy tudy šlo do hor
  víc poutníků než aut.
text:
  - >-
    Chata Aurora stojí podle vlastního webu na polovině cesty mezi
    Velkou Úpou a Pecí pod Sněžkou, na jižním svahu asi sto metrů nad
    hlavní silnicí, v nadmořské výšce 833 metrů. Postavena byla v letech
    1880 až 1890 v klasickém krkonošském stylu — patří tedy ke staré
    vrstvě zdejších roubenek.
  - >-
    Proč je mezi zaniklými, když dům žije? Protože zanikla bouda, ne
    stavba: chata se dnes pronajímá vcelku, hosté si vaří sami
    a kolemjdoucí turista tu nenajde nocleh ani občerstvení. Veřejné
    občerstvení se nepodařilo doložit ani v minulosti — a tak Auroru
    vedeme jako památku na starou zástavbu svahů nad Úpou, ne jako
    živou zastávku.
  - >-
    Kapacitu dnešního pronájmu vedou katalogy na čtrnácti lůžkách se
    čtyřmi přistýlkami. Víc se o historii domu z otevřených pramenů
    zatím nedozvíte — jakmile se pramen najde, doplníme ho.
  - >-
    Údaje pocházejí z vlastního webu chaty a z katalogů pronájmů;
    vlastním dotazem jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

