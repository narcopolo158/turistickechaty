# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Turistická ubytovna na vrcholku Studenova nad Rokytnicí nad Jizerou,
  v devíti stech metrech a s dvaasedmdesáti lůžky. Restaurace s barem
  ve vedlejším objektu patří podle katalogu ubytovaným — kolemjdoucí
  s ní počítat nemůže. A pozor při hledání: na Studenově stojí i druhá,
  menší chata podobného jména.
text:
  - >-
    Chata Studenov stojí podle katalogu na vrcholku Studenova nad
    Rokytnicí nad Jizerou v devíti stech metrech — „ideální poloha pro
    výlety na hřebeny, do Rokytnice či Harrachova a okolí", jak píše
    katalog doslova. Západní Krkonoše odtud má turista skutečně na
    dosah.
  - >-
    Je to turistická ubytovna — tak ji katalog vede — se dvaasedmdesáti
    lůžky, tedy dům stavěný na skupiny a levnější nocleh. Stravování
    popisuje katalog větou, kterou přebíráme doslova: „V druhém objektu
    se nachází restaurace, kde se ubytovaní stravují, jejíž součástí je
    bar." Vaří se tu tedy ubytovaným; že by se najedl i turista jdoucí
    kolem, doloženo není, a tak to netvrdíme.
  - >-
    Jedno upozornění na závěr: na Studenově stojí ještě druhý ubytovací
    objekt podobného jména, menší chata u Rybínových bud. Náš zápis
    patří ubytovně na vrcholku — při hledání či rezervaci se vyplatí
    dát pozor, který z obou domů máte před sebou. O historii ubytovny
    jsme zatím nenašli jediný doložený údaj.
  - >-
    Údaje pocházejí z katalogu České hory a z přehledu serveru Treking;
    vlastním dotazem jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

