overeniHistorie:
  source: >-
    Turistika.cz „Černá bouda na Černé pasece a její historie" — zdroj
    výslovně identifikuje objekt jako dnešní hotel Černá Bouda na Černé hoře
    u Janských Lázní (GPS 50,654 / 15,747, 1 250–1 260 m) a nese celou
