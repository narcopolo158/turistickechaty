  jistota B) po rešerši 25. 7. 2026.

  ✅ KLÍČ ZAŘAZENÍ SPLNĚN doslovnou větou z webu objektu: „Bistro je součástí
  hotelu Černá Bouda a nabízí nejen našim hotelovým hostům, ale všem
  návštěvníkům Černé hory nápoje, jídlo a občerstvení." Otvírací doba
  „po-ne: 09.00 - 18.00hod." tamtéž.

  ⚠ METODICKÁ POZNÁMKA k rešerši: první shrnutí ze stránky janskelazne.cz
  tvrdilo, že restaurace obsluhuje i neubytované — cílené opětovné načtení to
  NEDOLOŽILO. Do profilu je proto vzata jen doslovná věta o BISTRU z webu
  objektu; u hotelové restaurace veřejná přístupnost zůstává nedoložena.
  Obecné poučení: než se převezme tvrzení „obsluhuje veřejnost", vyžádat si
  doslovnou citaci.

  ⚠ ROZPOR kapacita: 123 lůžek (janskelazne.cz) vs. 136 lůžek (ceskehory.cz),
