    hotel". Milník o svazu lyžařů zapsán BEZ ROKU — zdroj uvádí jen „po druhé
    světové válce" (nedomýšlet). Sekundární zdroje, verified:false — ověřit
    primárním pramenem
  verified: false
  checked: '2026-07-25'

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel ve výšce 1 260 m kousek pod vrcholem Černé hory nad Janskými
  Lázněmi, dostupný lanovkou Černohorský express. Sezónní hostinec tu poprvé
  otevřeli roku 1888, stará bouda ale roku 1984 padla a dnešní budovu
  dostavěli až roku 1993. Bistro je podle webu objektu otevřené všem
  návštěvníkům Černé hory, nejen ubytovaným.
text:
  - >-
    Černá bouda stojí ve výšce 1 260 metrů kousek pod vrcholem Černé hory nad
    Janskými Lázněmi, na adrese Horská 171. Výšku uvádějí shodně web objektu,
    oficiální portál města Janské Lázně i Českéhory.cz; jen pozor na údaj 1
    300 metrů, který se na webu hotelu také objevuje — ten patří vrcholu hory,
    ne boudě.
  - >-
    Historii tohoto místa podrobně popisuje Turistika.cz; primárním pramenem
    ji zatím ověřenou nemáme, ale stojí za převyprávění. Černá paseka na
    temeni hory vznikla vykácením lesa kvůli dřevu pro stříbrné doly v Kutné
    Hoře a podle josefínského katastru byla do roku 1785 zcela pustá. Brzy
    poté tu postavili letní hájenku. Zhruba o sto let později v ní hospodský a
    řezník Robert Bönsch otevřel sezónní výletní hostinec — psal se rok 1888.
    Koncem 19. století vedle stávající boudy vyrostla nová, netradiční budova;
    kdo ji postavil, zdroj neuvádí. Roku 1900 k boudě přibylo vypouklé
    panoramatické zrcadlo a krátce nato tu vznikla i samostatná poštovna,
    která vydržela do roku 1937.
  - >-
    Rok 1908 znamenal zásadní obrat: Bönsch začal boudu provozovat i v zimě.
    Po dostavbě lanovky na Černou horu v roce 1928 příliv návštěvníků ještě
    vzrostl. Po druhé světové válce boudu chvíli provozoval svaz lyžařů —
    přesné roky zdroj neuvádí, takže je neuvádíme ani my. Pak přišel útlum:
    v roce 1977 byla bouda v tak nevyhovujícím stavu, že ji zavřeli, a v roce
    1984 ji zbourali. Dnešní budova tedy s tou Bönschovou nemá společného nic
    než místo — nový horský hotel tu dostavěli až v roce 1993 a rekonstrukcí
    prošel v roce 2005.
  - >-
    Ubytování je hotelové: podle portálu města Janské Lázně jde o dvoulůžkové
    a čtyřlůžkové pokoje včetně dvou apartmánů, u některých s možností
    přistýlky; web hotelu mluví jen obecně o několika typech komfortních
    pokojů. Kolik je tu přesně lůžek, doložit neumíme — portál města uvádí
    123, Českéhory.cz 136 a web hotelu žádné číslo nenese, takže tu přesný
    počet raději neuvádíme, než abychom mezi čísly vybírali. Hotel se podle
    vlastního webu orientuje mimo jiné na školy v přírodě, sportovní oddíly a
    firemní kolektivy.
  - >-
    Pro kolemjdoucího turistu je podstatné bistro, protože web hotelu u něj
    přímo píše, že nabízí nejen hotelovým hostům, ale všem návštěvníkům Černé
    hory nápoje, jídlo a občerstvení. Otevřeno má podle téhož zdroje denně od
    devíti do šesti. Z nabídky jmenuje polévky — gulášovou, čočkovou,
    dršťkovou, kyselicu, bramboračku — hotová jídla dle nabídky dne, smažený
    sýr, kuřecí řízek, hranolky a moučník. Vedle bistra existuje ještě
    hotelová restaurace; jestli je otevřená i neubytovaným, doložené nemáme.
  - >-
    Přístup je věc, kterou je dobré si rozmyslet dopředu, protože se mění s
    ročním obdobím. Podle portálu města Janské Lázně sem jezdí osmimístná
    kabinová lanovka Černohorský express z Janských Lázní s celoročním
    provozem; poslední jízda je podle webu hotelu v 17.30. Mimo zimu se dá
    podle serveru Českéhory.cz dojet až nahoru autem, ale jen ubytovaným. V
    zimě to neplatí vůbec: web objektu na to upozorňuje velkými písmeny — v
    zimě nejsou dostupní žádným vozidlem. Portál města k tomu dodává, že v
    zimním období obstará hotel dopravu od horní stanice lanovky sněžnou
    rolbou nebo skútrem.
  - >-
    Údaje na téhle stránce pocházejí z webu objektu a ze tří sekundárních
    zdrojů — jsou to server Turistika.cz, oficiální portál města Janské Lázně
    a server Českéhory.cz — a redakce je zatím neověřila vlastním dotazem ani
    návštěvou. Prameny se rozcházejí nejen v kapacitě, ale i v kontaktech:
    portál města uvádí jiný telefon a jiný e-mail než hotel sám. Spolehli jsme
    se na spojení uvedené na webu hotelu. Než sem doplníme ověřené údaje,
    doporučujeme si nocleh i provoz bistra potvrdit přímo u hotelu.

