  - >-
    Bouda Bílé Labe stojí na levém břehu Bílého Labe v nadmořské výšce
    kolem 1 000 metrů, zhruba 5 kilometrů od centra Špindlerova Mlýna —
    tak polohu popisuje web boudy.
