# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata na levém břehu Bílého Labe ve výšce kolem 1 000 m n. m., asi
  5 km od centra Špindlerova Mlýna. Postavena byla roku 1913, a to na místě skladiště, které v údolí zbylo po
  hrazení potoka.
  Restaurace s terasou a domácí kuchyní, ubytování pro osmadvacet hostů.
text:
  - >-
    Bouda Bílé Labe stojí v údolí Bílého Labe ve výšce kolem tisíce metrů, na levém břehu řeky a na křižovatce čtyř turistických tras. Od centra
    Špindlerova Mlýna je to k ní zhruba pět kilometrů a Špindlerův Mlýn u ní
    vedou prameny i jako poštovní adresu; do kterého katastru objekt patří,
    tím ale doložené není.
  - >-
    Týž server ji navíc vede pod dvěma jmény na dvou samostatných stránkách,
    jednou jako Boudu Bílé Labe a podruhé jako Boudu u Bílého Labe. Jde
    o tentýž objekt: sedí výška, kapacita i poloha na mapě. Pod druhým jménem ji
    zná i podklad, ze kterého čerpáme, takže se s ním čtenář může potkat.
  - >-
    Začátek boudy je stavební, ne turistický. Roku 1897 podemlela velká povodeň břehy v údolí Bílého Labe a stát pak
    nechal tok hradit kamennými stavbami a prahy; kamenné úpravy koryta
    zmiňují dva prameny shodně. Kolem roku 1900 se poblíž otevřel žulový lom
    a pro práce vznikl sklad materiálu s provizorní ubytovnou. Právě na místě
    toho skladiště postavil roku 1913 Václav Hollmann jednopatrovou boudu —
    jeden pramen píše jeho příjmení s jedním n, druhý se dvěma a rozřešené to
    nemáme.
  - >-
    Hollmann boudu později rozšířil, postavil u ní malou vodní elektrárnu
    a provozoval ji do konce druhé světové války. Po roce 1945 se majitelé
    střídali: nejprve státní lesy, pak Klub českých turistů a podnik
    Zemědělské stavby Praha, od roku 2023 soukromý vlastník, který nechal
    pokoje zrekonstruovat. Celou tuhle posloupnost vedeme z jediného pramene
    a sami jsme ji nikde neověřovali.
  - >-
    Chata nabízí ubytování a restauraci s terasou a domácí kuchyní. Lůžek má být osmadvacet a pokoje jsou dvou- až čtyřlůžkové; sama chata
    tenhle údaj na úvodní stránce neuvádí. Otvírací dobu denně od půl
    jedenácté do šesti večer nesou shodně mapová data i externí podklad
    odvolávající se na web boudy, redakčně ověřená ale není. V telefonním
    čísle se prameny rozcházejí hned trojmo: jedno vedou mapová data a další
    dvě dvě různé stránky téhož turistického serveru. Zveřejňujeme to
    z mapových dat, před cestou ale doporučujeme si kontakt ověřit.
  - >-
    Údaje na této stránce pocházejí z webu chaty, z mapových dat, ze serveru
    Krkonose.eu a z průvodce Poznej domy; redakce žádný z těch pramenů
    neověřila vlastním dotazem ani návštěvou. Doloženou nemáme sezónnost
    provozu ani katastrální příslušnost objektu. Před cestou proto
    doporučujeme otvírací dobu i telefon potvrdit přímo u boudy.
