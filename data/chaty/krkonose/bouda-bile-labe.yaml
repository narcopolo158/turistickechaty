interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/bouda-bile-labe.yaml (DATA-01) po křížovém ověření DATA-03 (session 22, web načten 20. 7. 2026) a rozhodnutí Michala (✅ en bloc, chat 20. 7. 2026; trojice „přednostně" potvrzena 21. 7. 2026).
  Povýšení provedla bezobslužná session 33 (21. 7.) z už doložených zápisů — WebFetch bezobslužně nefunguje, web znovu nečten.
  Dohledat při ručním běhu z podstránek webu: kontakty přímo z webu (teď jen OSM a rozcházejí se, viz níž), otvírací doba restaurace (OSM tag může být zastaralý), sezónnost, katastrální příslušnost. Kapacita, typy pokojů i historie z tohohle seznamu 26. 7. 2026 vypadly — doplněny v DATA-19.
  DATA-19 (26. 7. 2026), doplnění a příčina: profil byl jedním ze dvou skutečných falešných nesouladů pipeline DATA-09. Podklad ho vede jako „Bouda u Bílého Labe" (HUT-0011), my jako „Bouda Bílé Labe" — porovnávač shodaNazvu normalizuje diakritiku i hledá podřetězec, na české skloňování („bile" × „bileho") a vsunuté „u" ale nestačí. Řešeno zápisem aliasu, ne změnou porovnávače: shodaNazvu aliasy čte, takže shoda vznikne sama a stejná oprava zabere i v DATA-05. Ověření dvojice: GPS podkladu je od naší 10 m, a WebFetch obou stránek Krkonose.eu ukázal shodu roku vzniku, kapacity, výšky i vzdálenosti od Špindlerova Mlýna. Doplněno rokVzniku, pět milníků, kapacita 28, typy pokojů, obec a druhá zajímavost; próza přepsána ze tří odstavců na šest, protože historie přestala být mezerou.
  DATA-19, co se přitom našlo navíc: (1) Krkonose.eu vede tentýž objekt na DVOU stránkách pod dvěma jmény a na každé jiný telefon — s číslem z OSM jsou to tři různá čísla ve třech pramenech; katalogový podklad obě čísla z Krkonose.eu slučuje do jednoho pole, což vysvětlí, proč tam byl středník. Publikováno zůstává OSM, rozpor přiznán v próze bez čísel (vzor Hali Szrenickiej), rozhodne DATA-04. (2) Příjmení zakladatele: Krkonose.eu „Hollman", Poznej domy „Hollmann". V próze přiznáno, v milníku a zajímavosti použit tvar se dvěma n (Poznej domy o zakladateli píše víc). (3) Poštovní adresa „Špindlerův Mlýn 176" NENÍ doklad katastru — pole obec ale schéma jmenuje „nejbližší obec", takže se vyplnit smí; próza katastr dál vede jako nedoloženy. Tenhle rozdíl mezi labelem pole a tím, jak ho čte próza, patří do DATA-20.
  DATA-19, zdroje z druhé ruky: rekonstrukce 2023, posloupnost poválečných vlastníků, lom z roku 1900 i vodní elektrárna stojí JEN na průvodci Poznej domy. Je to sekundární pramen, ne web boudy ani úřad; próza to říká nahlas („z jediného pramene"). Při DATA-04 ověřit u provozovatele.
  Hero fotka: krysi@ (Panoramio import), CC BY 3.0 — autor dohledatelný (podmínka síta pro CC BY splněna), ale popis souboru je jen název boudy; redakce potvrdí, že snímek zachycuje budovu (další čtyři kandidáty téhož autora ukazují i můstek přes Bílé Labe).
