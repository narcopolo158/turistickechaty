# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko na Przełęczy Karkonoské. OpenStreetMap mu dává výšku 1 230 m,
  externí katalog o šest metrů víc. Vycházíme z OpenStreetMap, z titulků
  výsledků vyhledávání a z externích podkladů; samotné stránky schroniska
  jsme zatím neotevřeli, a tak podrobnosti provozu doporučujeme před cestou
  ověřit na jeho webu.
text:
  - >-
    Schronisko Odrodzenie stojí na Przełęczy Karkonoské v nadmořské výšce
    1 230 metrů. Výška i souřadnice pocházejí z OpenStreetMap, polohu na
    sedle uvádějí titulky polských turistických portálů; obec, pod kterou
    objekt spadá, doloženou nemáme. Externí katalog, ze kterého máme
    historii, klade schronisko o šest metrů výš, na 1 236 metrů, a který
    z obou údajů je správný, rozřešené nemáme. Část zdrojů včetně stránek
    na doméně PTTK objekt uvádí jako Schronisko PTTK „Odrodzenie".
  - >-
    Historii máme z externího katalogu, který se odvolává na stránky
    schroniska; ty jsme sami zatím neotevřeli. Budova podle něj vznikla
    v roce 1928 jako mládežnické ubytovací zařízení Rübezahl. Týž letopočet
    nese v katalogu ještě druhý odkaz, i ten ale míří na stránku, kterou
    jsme neotevřeli — dvě nezávislá potvrzení to nejsou, obojí pochází
    z jedné a téže kompilace. Katalog dál uvádí, že provoz v roce 2009
    převzala rodina Kaczmarkových.
  - >-
    Že má schronisko otevřeno 365 dní v roce a čtyřiadvacet hodin denně,
    přebíráme z týchž externích podkladů, které se odvolávají na prezentaci
    schroniska — tu jsme ale neotevřeli, takže údaj stojí na prameni
    z druhé ruky. Nocleh i stravování u schroniska tytéž podklady uvádějí
    a jeden z nich mluví o bufetu, počet lůžek ale neuvádí žádný.
    Nezávisle doložené nemáme ani jedno: v přehledu ubytování, který vede
    PTTK, jsme objekt v tomto běhu nenašli, a proto nocleh ani podobu
    občerstvení na stránce nevedeme. Otevřená zůstává i otázka, kdo objekt
    spravuje: OpenStreetMap u něj jako provozovatele uvádí PTTK a týž tvar
    jména nesou i titulky třetích stran, vlastním dotazem to ale doložené
    nemáme.
  - >-
    Údaje na této stránce pocházejí z OpenStreetMap, z titulků výsledků
    vyhledávání a z externích podkladů, které se odvolávají na prezentaci
    schroniska — tu jsme sami neotevřeli. Redakce je zatím neověřila
    vlastním dotazem ani návštěvou. Před cestou doporučujeme potvrdit si
    přímo u schroniska zejména možnost noclehu, občerstvení a otvírací
    dobu.

