# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko PTTK na horské louce Hala Szrenicka ve výšce 1200 m nad
  Szklarskou Porębou. Provozovatel odvozuje historii místa až od pastevecké
  boudy z roku 1786. Kapacitu a přesnou otvírací dobu doporučujeme před
  cestou ověřit na webu schroniska.
text:
  - >-
    Schronisko stojí na horské louce Hala Szrenicka v nadmořské výšce 1 200
    metrů. Pod ní leží Szklarska Poręba, ke které rezervační portály
    schronisko řadí. Necelý kilometr odtud stojí ještě Schronisko Szrenica,
    kterému OpenStreetMap dává 1 361 metrů, tedy o sto šedesát víc; kde
    přesně vůči vrcholu Szrenice stojí, si ale prameny nesedí — mapová data
    u něj nesou jen tuhle výšku, kdežto katalogový záznam odvolávající se na
    jeho stránky mluví o stavbě přímo na vrcholu, a rozřešené to nemáme.
    Jestli louka Hala Szrenicka leží právě pod tímhle vrcholem, žádný
    z pramenů, které pro tuhle stránku vedeme, neříká; jméno to napovídá,
    doložené to nemáme.
  - >-
    Objekt je veden v přehledu ubytování PTTK a spadá pod správu Sudeckich
    Hoteli i Schronisk PTTK. Nocleh nabízí i přes běžné rezervační portály
    a má vlastní web. Kolik má lůžek, doložené nemáme — kapacitu neuvádí ani
    katalogový podklad, ze kterého máme zbytek údajů.
  - >-
    Historii místa odvozuje provozovatel na svých stránkách hluboko do
    osmnáctého století: podle něj tu roku 1786 stávala pastevecká bouda. Dál
    uvádí požár v roce 1975 a rok 2014, kdy objekt převzali současní rodinní
    provozovatelé. Chatu při tom označuje za jednu z nejstarších
    v Krkonoších — a tady se prameny rozcházejí, protože totéž o sobě tvrdí
    i provozovatel Strzechy Akademické, a to spolu s chatou Pod Łabskim
    Szczytem. Rozřešené to nemáme. Všechny tyhle údaje k nám navíc dorazily
    přes externí podklad, který se na stránky schroniska odvolává; sami jsme
    je neotevřeli.
  - >-
    Provoz je podle téhož podkladu celoroční a bufet má veřejnosti sloužit do
    osmi večer; ve které dny a v jaké sezóně to platí, podklad neříká.
    V telefonním čísle se prameny rozcházejí: jedno vedou mapová data, druhé
    externí podklad odvolávající se na stránky schroniska. Zveřejňujeme to
    z mapových dat, ale před cestou doporučujeme si kontakt ověřit.
  - >-
    Souřadnice a výška pocházejí z OpenStreetMap, statut schroniska PTTK
    z přehledů provozovatele a vazba na Szklarskou Porębu z rezervačních
    portálů. Historie, celoroční provoz, čas bufetu a e-mail jsou z externího
    podkladu (21. 7. 2026), který se odvolává na stránky schroniska — ty jsme
    sami neotevřeli. Redakce zatím žádný z těch údajů neověřila vlastní
    návštěvou ani dotazem, proto doporučujeme kapacitu i otvírací dobu
    potvrdit přímo u schroniska.

