perex: >-
  Schronisko PTTK na horské louce Hala Szrenicka v západních Krkonoších,
  ve výšce 1200 m nad Szklarskou Porębou. Kapacitu a otvíračku doporučujeme
  před cestou ověřit na webu schroniska.
text:
  - >-
    Schronisko stojí na Hali Szrenickiej pod vrcholem Szrenica, v nadmořské
    výšce 1200 m. Je vedeno v přehledu ubytování PTTK pod správou Sudeckich
    Hoteli i Schronisk PTTK a nocleh nabízí i přes běžné rezervační portály.
  - >-
    Nedaleko nad ním stojí Schronisko Szrenica u vrcholové stanice lanovky
    ze Szklarské Poręby. Podrobnosti provozu, kapacitu a historii doplníme
    po redakčním otevření webu — do té doby je doporučujeme ověřit přímo
    u schroniska.

