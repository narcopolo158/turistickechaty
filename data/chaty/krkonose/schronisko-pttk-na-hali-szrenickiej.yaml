interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/schronisko-pttk-na-hali-szrenickiej.yaml (DATA-01) po DATA-03 (s23 WebSearch + rozhodnutí Michala 20. 7. 2026: ✅ en bloc). Bezobslužná session 31 (21. 7.) — obsah webů NEotevřen, jen titulky.
  HERO S VÝHRADOU: popis fotky zní jen „Hala Szrenicka" (jméno louky) — geotag 12 m od budovy, autor fotil sérii u schroniska, ale záběr budovy potvrdí redakce očima (vzor Dvorská s28); jinak vyměnit za jiný ze 17 kandidátů.
  Existuje článek pl.wikipedia „Schronisko PTTK na Hali Szrenickiej" (titulek ve výsledcích) — dobrý zdroj pro historii při ručním běhu.
  Dotáhnout ručním během: lůžka (kapacitu neuvádí ani katalogový podklad), obec (Szklarska Poręba je v titulcích portálů a v katalogu jako „nejbližší obec nebo uzel" s jistotou A — rozhodnout, jestli to stačí na pole obec), ověřit převzatý telefon a e-mail, dny a sezónu otvírací doby bufetu, historii z pl.wikipedia.
  AUDIT 4. DÁVKA (DATA-15, 25. 7. 2026) — nezávislý agent vrátil osm nálezů, všech osm přijato po ověření proti korpusu. (1) Vypuštěn nedoložený výklad zkratky PTTK („tedy pod polský turistický svaz, který síť horských schronisk provozuje") — prameny nesou zkratku jen jako jméno a obsah stránek nikdo neotevřel; týž zásah proběhl u schronisko-odrodzenie. (2+3) Věta „Kousek výš, přímo na Szrenici, stojí ještě Schronisko Szrenica" nesla tři nedoložené údaje najednou a navíc potichu rozhodovala rozpor, který sourozenecký profil schronisko-szrenica.yaml přiznává nahlas (OSM klade budovu těsně pod vrchol, web schroniska ji dává přímo na vrchol). Přepsáno s připsáním, rozpor přiznán, do zdroje doplněny OSM way/32604717 a szrenica.pl. Vzdálenost 0,88 km a převýšení 161 m dopočítány ze souřadnic a výšek obou profilů (obojí OSM).
  AUDIT 4. DÁVKA, pokračování. (4) Světová strana „v západních Krkonoších" a „v západní části polských Krkonoš" vypuštěna z perexu i z text[0] — nenese ji žádný pramen v souboru a katalog HUT-0224 má v poli „Oblast / část pohoří" jen „Hala Szrenicka". Totéž znění mají sourozenecké profily schronisko-szrenica a schronisko-pttk-na-przeleczy-okraj — korpusový úklid, viz BACKLOG. (5) „pod vrcholem Szrenica" bylo nepřipsané tvrzení o poloze; místo vypuštění zvolena mezera přiznaná nahlas („jméno to napovídá, doložené to nemáme"), protože jméno louky i chaty na vrchol odkazuje a mlčet by čtenáři nepomohlo. (7) Závěrečné shrnutí připisovalo „zbytek" přehledům provozovatele; ve skutečnosti jsou kontakty z OSM, nocleh zčásti z rezervačních portálů a vazba na Szklarskou Porębu z jejich titulků — přepsáno. (8) Alt hero fotky tvrdil budovu, kterou soubor sám označuje za nepotvrzenou; zúžen na to, co nese popis souboru na Commons, s poznámkou, co vrátit po očním potvrzení.
  AUDIT 4. DÁVKA, nález 6 (největší): text[2] tvrdil, že lůžka, otvírací dobu, občerstvení ani historii doložit neumíme — a přitom to všechno kromě lůžek leží v našem vlastním repozitáři. Řádek HUT-0224 „Hala Szrenicka" v data/externi/fakticka-data-krkonose-2026/fakticka-data.csv nese milníky 1786/1975/2014, provoz „celoročně / 24 hodin denně", „bufet pro veřejnost do 20:00", telefon, e-mail i zajímavost o jedné z nejstarších chat, jistota A; katalog.json u téhož ID uvádí Ubytování i Stravování „ano" a Provoz „celoročně". Data doplněna ručně v obvyklém tvaru „Doplňková fakta (katalog 2026-07-21, ChatGPT podklad; verified:false)" a próza přepsána. PŘÍČINA: DATA-09 objekt přeskočil kvůli neshodě jmen (u nás „Hali Szrenickiej", v podkladu „Hala Szrenicka"), PUVOD.md ho proto vede mezi osmi chatami, které v katalogu nejsou. Kontrola zbylých sedmi našla druhý falešný nesoulad: „Bílé Labe" má v podkladu řádek HUT-0011 „Bouda u Bílého Labe" — viz BACKLOG.
  ROZPOR V TELEFONU (nový, nerozřešen): OSM way/32604722 uvádí +48 757 533 270, doplňková fakta 2026-07-21 se zdrojem halaszrenicka.pl/kontakt uvádějí +48 880 910 902. Publikován zatím údaj z OSM; ve veřejné próze o neshodě říkáme, aniž bychom čísla uváděli. Rozhodne DATA-04.
  ZAMÍTNUTO z auditu (agent si to zamítl sám, ověřeno proti souboru): „nad Szklarskou Porębou" jako nedoložená vazba — plyne z doložené výšky a je připsaná portálům; „na horské louce Hala Szrenicka" jako dovymyšlený terén — je to překlad jména objektu a katalog louku jmenuje; chybějící připsání OpenStreetMap — próza je jmenuje a overeniLokace nese plnou doložku ODbL; „nabízí i přes běžné rezervační portály" v množném čísle — doloženo booking.com i titulky agoda a e-szklarska.com; doporučení ověřit si údaje na webu schroniska — netvrdí, co web uvádí, a je to domácí styl perexu. Pole obec zůstává prázdné záměrně: katalog má Szklarskou Porębu jen jako „nejbližší obec nebo uzel", což není totéž co správní obec.
