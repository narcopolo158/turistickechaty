# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda na Zlatém návrší od architekta Vladimíra Šíra, postavená podle většiny
  pramenů roku 1964 a přestavěná ateliérem IXA; nadmořskou výšku prameny
  uvádějí od 1 390 do 1 400 m. Ubytování nenabízí — je to zastávka na cestu
  s občerstvením a veřejnými toaletami. Jméno nese po Václavu Vrbatovi, který
  roku 1913 zahynul při mezinárodním lyžařském závodě spolu s Bohumilem
  Hančem.
text:
  - >-
    Vrbatova bouda stojí na Zlatém návrší na hřebeni Krkonoš, v katastru
    Vítkovic v Krkonoších, asi šest a půl kilometru západně od Špindlerova
    Mlýna. Nadmořskou výšku uvádějí prameny rozdílně: turistická známka, Kudy
    z nudy i architektonický popis přestavby na Archiwebu shodně 1 400 metrů,
    jablonecký místopis 1 396 metrů a Turistika.cz 1 390 metrů. Uvádíme
    nejčastěji zmiňovaných 1 400 metrů a rozdíl přiznáváme, místo abychom
    předstírali jistotu.
  - >-
    Jméno nese bouda po Václavu Vrbatovi z Mříčné, který 24. dubna 1913
    zahynul během mezinárodního lyžařského závodu na padesát kilometrů
    společně s Bohumilem Hančem. Mohyla obou mužů vznikla na Zlatém návrší v
    roce 1925.
  - >-
    Stavebně je bouda pozoruhodná. Rok 1964 uvádí Turistika.cz i jablonecký
    místopis, Archiweb klade stavbu obecněji na počátek šedesátých let;
    autorem původní stavby byl architekt Vladimír Šír. Přestavbu navrhl
    ateliér IXA — Tomáš Hradečný a Martin Prokš — a Archiweb i web ateliéru
    uvádějí projekt na roky 2007 až 2013 a realizaci na 2009 až 2015, zatímco
    Kudy z nudy klade rekonstrukci do roku 2016. Který údaj je správný,
    nevíme, a proto uvádíme oba. Kudy z nudy zmiňuje, že přestavba byla
    nominována do mezinárodní ceny Mies van der Rohe Award pro rok 2017.
  - >-
    Ubytování bouda nenabízí; Kudy z nudy to říká výslovně a jablonecký
    místopis shodně. Je to zastávka na cestu, ne cíl na přespání. Archiweb
    popisuje v přestavěném objektu restauraci rozšířenou o prostor bývalé
    terasy, bufet a veřejné toalety, Turistika.cz mluví o občerstvovacím
    zařízení a kiosku s občerstvením a jablonecký místopis o možnosti zakoupit
    občerstvení, nápoje a upomínkové předměty. Prameny se tedy v pojmenování
    provozu rozcházejí, ale že se tu člověk bez noclehu nají a napije,
    doložené je.
  - >-
    Se sezónním informačním centrem Správy KRNAP na Zlatém návrší je to
    nejasné a prameny si přímo odporují. Web ateliéru, který přestavbu navrhl,
    řadí infocentrum KRNAP mezi novostavby, které při přestavbě vznikly;
    Archiweb naopak u téže přestavby výslovně poznamenává, že objekt nakonec
    zůstal bez infocentra. Správa KRNAP na svém webu píše, že nově zbudované
    informační centrum bylo otevřeno pro letní sezónu 2024 a nachází se na
    Zlatém návrší v blízkosti autobusové zastávky — do které budovy patří,
    neuvádí. Jestli infocentrum sídlí ve Vrbatově boudě, nebo v jiném objektu,
    z dostupných pramenů nevíme, a netvrdíme proto ani jedno. Otevřeno má
    podle Správy KRNAP od května do září od 9.10 do 17.00.
  - >-
    Autem se až k boudě dojet nedá. V letní sezóně sem z Horních Míseček
    vyjíždějí ekologické autobusy a Turistika.cz uvádí, že jde o nejvýše
    položenou zastávku linkového autobusu — superlativ přebíráme od zdroje,
    sami ho ověřený nemáme. Otvírací dobu prameny uvádějí rozdílně,
    Turistika.cz od 9.00 do 16.00, jablonecký místopis od 9.30 do 16.00; oba
    jsou třetí strana a oficiální web se nám u boudy nepodařilo dohledat,
    takže tu otvírací dobu raději neuvádíme vůbec. Před cestou se vyplatí
    provoz ověřit.
  - >-
    Údaje na téhle stránce pocházejí z veřejně dostupných pramenů, převážně od
    třetích stran, a redakce je zatím neověřila vlastním dotazem ani
    návštěvou. Rozporů je tu na jednu boudu nezvykle hodně — výška, rok
    stavby, rok přestavby i otvírací doba — a všechny je v textu přiznáváme
    raději, než abychom vybrali jedno číslo a tvářili se, že o žádném sporu
    nevíme.
