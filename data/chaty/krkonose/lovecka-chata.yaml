# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Penzion s veřejnou restaurací ve Velké Úpě pod Sněžkou. Restaurace má
  otevřeno denně od 11 do 21 hodin i pro neubytované.
text:
  - >-
    Lovecká chata stojí na adrese Velká Úpa 204 v Peci pod Sněžkou. Jde
    o penzion s restaurací v údolí, ne o hřebenovou boudu; do průvodce jsme
    ho zařadili proto, že jeho restaurace je otevřená veřejnosti. Nadmořskou
    výšku web chaty neuvádí, souřadnice pocházejí z OpenStreetMap a v terénu
    ověřené nejsou.
  - >-
    Web zve hosty k přenocování i k jídlu, kolik má penzion lůžek, ale
    neprozrazuje. Restaurace je otevřená i neubytovaným, podle webu denně od
    jedenácti dopoledne do devíti večer, a stůl si v ní lze předem
    rezervovat; mimo otvírací dobu se dá rezervace domluvit telefonicky.
  - >-
    Zbytek zatím doložený nemáme. Kapacitu ubytování ani to, zda chata
    funguje celoročně, web neuvádí a redakce údaje neověřila vlastním
    dotazem. Před cestou proto doporučujeme telefonicky potvrdit volnou
    kapacitu i to, že bude restaurace opravdu otevřená.

