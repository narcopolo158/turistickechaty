# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Penzion s veřejnou restaurací ve Velké Úpě, části Pece pod Sněžkou.
  Restaurace má podle webu chaty otevřeno denně od 11 do 21 hodin i pro
  neubytované; jestli penzion funguje celoročně, doložené nemáme.
text:
  - >-
    Lovecká chata stojí na adrese Velká Úpa 204 v Peci pod Sněžkou. Jde
    o penzion s restaurací, ne o horskou boudu; do průvodce jsme ho zařadili
    proto, že jeho restaurace je otevřená veřejnosti. Nadmořskou výšku web
    chaty neuvádí a souřadnice přebíráme z OpenStreetMap, kde je ovšem objekt
    veden jako neobsluhovaný přístřešek — s webem chaty se to neshoduje
    a držíme se webu. Ani samotný mapový bod nemáme za potvrzený: od doložené
    adresy ho dělí několik kilometrů, takže než ho ověříme, spolehlivější
    vodítko je adresa.
  - >-
    Web zve hosty k přenocování i k jídlu, kolik má penzion lůžek, ale
    neprozrazuje. Restaurace je otevřená i neubytovaným, podle webu denně od
    jedenácti dopoledne do devíti večer, a stůl si v ní lze předem
    rezervovat; mimo otvírací dobu se dá rezervace domluvit telefonicky.
  - >-
    Zbytek zatím doložený nemáme. Kapacitu ubytování ani to, zda chata
    funguje celoročně, web neuvádí a redakce údaje neověřila vlastním
    dotazem. Před cestou proto doporučujeme telefonicky potvrdit volnou
    kapacitu i to, že bude restaurace opravdu otevřená.

