    Restaurace zve „přijeďte se k nám ubytovat, nebo skvěle najíst" a má
    otevřeno denně od 11:00 do 21:00; mimo otvírací dobu funguje rezervace
    po telefonu. Podrobnosti k ubytování doporučujeme ověřit na webu.

