interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/lovecka-chata.yaml (DATA-01) po křížovém ověření DATA-03 a rozhodnutí Michala (chat 20. 7. 2026 — klíč: veřejná restaurace denně 11–21 doložena → ZAŘADIT; původní verdikt „nezařazovat" tím revidován).
  Data dotažena z webu lovecka-chata.cz 21. 7. 2026 (session 30, ruční běh, WebFetch se schválením Michala). Metoda ověření: přímá citace z oficiálního webu → verified: false (kontakty, veřejná restaurace + otvíračka). verified: false u lokace (GPS z OSM; adresa z webu potvrzena, výška web neuvádí) a nocleh (kapacita nedoložena).
  TYP: OSM tag tourism=wilderness_hut (útulna) je zjevně chybný — objekt je penzion s obsluhou a veřejnou restaurací; zapsán typ obsluhovana (penzion v enum není), penzionový charakter přiznán v perexu i textu. Zvážit hlášení opravy tagu do OSM (dobrý soused).
  NEDOHLEDÁNO (web neuvádí): nadmořská výška, kapacita lůžek, explicitní sezóna/celoroční provoz.
  ⚠ GPS PRAVDĚPODOBNĚ CHYBNÁ — ZMĚŘENO 25. 7. 2026: haversinovské vzdálenosti z publikovaných souřadnic (pole lat/lng, OSM node 13298087649) k referenčním bodům korpusu vycházejí Dvorská bouda (Strážné) 2,32 km · Hotel Špindlerova bouda 4,73 km · Lyžařská bouda (Černý Důl) 5,12 km · Lesní bouda (Pec pod Sněžkou) 6,08 km · Martinova bouda 8,26 km. Bod tedy leží v oblasti Strážného, tj. zhruba 6 km západně od druhého objektu korpusu v Peci pod Sněžkou, kdežto doložená adresa Velká Úpa 204 je od Pece na východ. Buď je OSM uzel umístěn špatně, nebo popisuje jiný objekt (což by sedělo i s chybným tagem wilderness_hut). Do DATA-04: ověřit souřadnice u chataře nebo z katastru; do té doby je vada přiznaná i ve veřejné próze (text[0]). Souřadnice zatím NEMAZAT — jsou jediné, co máme, a jsou označené jako neověřené.
  DATA-15 (jazykový audit 25. 7. 2026, třetí dávka): opraveny čtyři vady. (1) text[0] tvrdil, že chata stojí „v údolí" a není „hřebenovou boudou" — poloha v údolí není doložená žádným pramenem (výšku web neuvádí vůbec); ponechán jen doložitelný protiklad penzion vs. horská bouda. (2) Rozpor mezi klasifikací v OSM (neobsluhovaný přístřešek) a webem chaty byl dosud jen v této poznámce, ač jde o rozpor pramenů, na kterých profil stojí — přiznán ve veřejné próze, bez uvedení názvu tagu (interní terminologie do prózy nepatří). (3) Naměřený nesoulad souřadnic s adresou přiznán v próze. (4) Perex uváděl otvírací dobu bez připsání a mlčel o tom, že celoroční provoz doložený nemáme (text[2] to přiznává) — obojí doplněno; „ve Velké Úpě pod Sněžkou" upřesněno na „ve Velké Úpě, části Pece pod Sněžkou", což odpovídá doložené adrese.
  DATA-20 (26. 7. 2026) — PROVĚŘENO, VADA SE NEPOTVRDILA, hodnota se nemění. Profil jsem si zapsal mezi sporné obce s odůvodněním, že pole obec nese Velkou Úpu, a ta není obec, nýbrž část obce. Ta domněnka byla moje, ne nález, a měřením se rozpadla ve dvou krocích. Za prvé: Velká Úpa opravdu je částí Pece pod Sněžkou — Regionální informační servis vede u Pece katastrální území Velká Úpa I a Velká Úpa II (https://www.risy.cz/cs/vyhledavace/uzemi/579581-pec-pod-snezkou, načteno 26. 7. 2026), takže na tom tvrzení není co opravovat. Za druhé, a to je podstatné: docs/DATA-17-jmenovci.md tenhle případ už výslovně řeší a povoluje. Pravidlo R2 osadu připouští, pokud je obec v profilu přítomná, a zdejší profil ji nese hned dvakrát — v doložené adrese z webu chaty i ve veřejné próze („ve Velké Úpě, části Pece pod Sněžkou"). Rovnou to tam u Lovecké chaty stojí jako příklad toho, jak to má vypadat. Píšu to sem proto, že vyvrácená vlastní domněnka mizí beze stopy a příští průchod ji udělá znovu; sporné na tomhle profilu není obec, ale nadále souřadnice (viz varování výš).
