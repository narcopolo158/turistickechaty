    Lovecká chata stojí na adrese Velká Úpa 204. Jde o penzion s restaurací
    — v průvodci ho vedeme poctivě jako údolní objekt, ne hřebenovou boudu;
    zařazen je pro restauraci otevřenou veřejnosti.
