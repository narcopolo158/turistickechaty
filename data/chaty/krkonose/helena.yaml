interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/helena.yaml (DATA-01, OSM) 27. 7. 2026 —
  fronta DATA-27 (Tier 4 silná, č. 3 „⭐ klíč splněn doslovně"). Web objektu
  načten přímo 27. 7. 2026 (WebFetch prošel), checked 2026-07-27.

  ✅ KLÍČ ZAŘAZENÍ SPLNĚN doslovnou větou z webu objektu: „Milí hosté, pro
  Váš kvalitnější prožitek v naší restauraci nabízíme pro neubytované hosty
  telefonickou rezervaci do 20:00 hodin, (mimo ubytovaných)." + 70 míst.

  ⚠ ADRESNÍ EXPONÁT DATA-20 (vedle Lysečinské a Lesní): adresa Černý Důl
  183 (web) × lokalita Lučiny, kterou prameny řadí i k Peci pod Sněžkou
  (KzN na nesrovnalost samo upozorňuje). Nezávislý signál pro Černý Důl:
  Commons/ŠJů popisuje čp. 183 „Černý Důl, Lučiny". obec: Černý Důl
  z adresy, rozhodne RÚIAN/úřad (DATA-04) — přidat do dotazu DATA-20.

  ⚠ ROZPOR kapacita VE TŘECH: 28 (web) × 23 (ceskehory) × 20 (treking
  10×2) → NEVYPLNĚNA. ⚠ ROZPOR výška: 1115 (web) × 1100 (ceskehory,
  treking) → publikováno 1115 (web objektu), přiznáno v próze.

  ⚠ typ: obsluhovana ponechán (ne horsky-hotel), ačkoli se objekt
  prezentuje jako „Hotel Bouda Helena***": charakterem jde o boudu
  v enklávě (28 lůžek dle webu), ne resort typu Špindlerovka/Tetřevky;
  obchodní název veden v aliasech. Kdyby Michal viděl jinak, přepnout.

  ⚠ Otvírací doba restaurace na webu NENÍ — pole prázdné. Druhý telefon
  +420 605 100 659 jen v overeniProvoz. Historie beze letopočtů (treking) —
  milníky nevedeny, jen aliasy.

  Hero: čp. 183 na fotce ŠJů se shoduje s adresou webu — silné ztotožnění.
  Sousedství: Pražská bouda (profil máme) a Slovanka (kandidát, fronta
  s výhradou) — až budou obě na webu, zvážit vzájemné odkazy v textech
  (enkláva Lučiny).

  K dotažení (DATA-04, verified:true): kapacita (28×23×20), otvírací doba
  restaurace, administrativní obec (RÚIAN — exponát DATA-20), letopočty
  k Helenenbaude (regionální literatura), sezóna.
