# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda s restaurací v enklávě Lučiny, podle vlastního webu ve východních
  Krkonoších ve výšce 1 115 metrů. Web výslovně počítá s neubytovanými
  hosty: restaurace jim nabízí telefonickou rezervaci místa do osmi večer.
  Podle serveru Treking.cz nesla původně jméno Helenenbaude; dnes se objekt
  prezentuje jako Hotel Bouda Helena.
text:
  - >-
    Bouda Helena stojí v enklávě Lučiny, podle vlastního webu v krásném
    prostředí východních Krkonoš a v nadmořské výšce 1 115 metrů; servery
    Českéhory.cz a Treking.cz uvádějí 1 100 metrů — držíme se údaje z webu
    objektu a rozpor rozřešený nemáme. S adresou je
    to tu zajímavější než obvykle: web uvádí Černý Důl 183, jenže Lučiny
    jako lokalitu řadí část pramenů k Peci pod Sněžkou — na nesrovnalost
    upozorňuje i portál Kudy z nudy. Fotografická dokumentace na Wikimedia
    Commons přitom vede stavení čp. 183 pod Černým Dolem. Kam bouda
    administrativně patří doopravdy, si necháme potvrdit; zatím se držíme
    adresy z webu.
  - >-
    Jméno prošlo třemi podobami: původní Helenenbaude, později Chata Helena
    a dnes Bouda Helena — tak posloupnost popisuje server Treking.cz,
    bohužel bez letopočtů, takže časovou osu nevedeme. Sám objekt se dnes
    prezentuje jako tříhvězdičkový Hotel Bouda Helena; charakterem jde
    o boudu v enklávě — fotografická dokumentace na Wikimedia Commons řadí
    do Lučin vedle Heleny (čp. 183) i Pražskou boudu (čp. 215) a Slovanku
    (čp. 182), Helena tedy nestojí o samotě.
  - >-
    Pro kolemjdoucího turistu je Helena příjemná výjimka mezi boudami,
    které jsme v Krkonoších zatím prošli: web nenechává otázku občerstvení
    bez odpovědi, ale píše výslovně, že restaurace nabízí pro neubytované
    hosty telefonickou rezervaci do osmi hodin večer. Jinými slovy —
    s příchozími zvenku se tu počítá, jen si mají zavolat o místo.
    Restaurace má podle webu sedmdesát míst na sezení. Otvírací dobu web
    neuvádí, takže ji neuvádíme ani my.
  - >-
    Nocleh nabízí bouda ve třech typech pokojů: Standard pro dva na
    pětadvaceti metrech, Deluxe pro tři a apartmán pro čtyři osoby na
    padesáti metrech čtverečních. U celkového počtu lůžek se prameny
    rozcházejí hned natřikrát — web objektu uvádí dvacet osm, servery
    Českéhory.cz a Treking.cz pak třiadvacet, respektive dvacet —
    v přehledu proto vedeme opatrnější nejnižší číslo a čekáme na
    potvrzení od boudy.
  - >-
    Údaje na téhle stránce pocházejí z webu objektu, který jsme načetli
    27. července 2026, a ze serverů Treking.cz, Českéhory.cz a portálu
    Kudy z nudy; polohu vede OpenStreetMap. Redakce je zatím neověřila
    vlastním dotazem ani návštěvou. Rozpory ve výšce, kapacitě i adresní
    příslušnosti přiznáváme výše — než je rozřešíme, doporučujeme si
    rezervaci místa v restauraci i nocleh domluvit telefonicky předem.

