# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko PTTK ve výšce 1258 m na polské straně Krkonoš, na frekventované
  cestě z Karpacze na Śnieżku. Kapacitu a otvíračku doporučujeme před cestou
  ověřit na webu schroniska.
text:
  - >-
    Strzecha Akademicka stojí nad Karpaczem v nadmořské výšce 1 258 metrů, na
    frekventované cestě z Karpacze na Śnieżku. Souřadnice, výška i obec
    pocházejí z OpenStreetMap, polohu na této cestě uvádějí titulky polských
    turistických portálů. U provozovatele objekt figuruje pod oficiálním
    tvarem Schronisko PTTK „Strzecha Akademicka"; v popiscích fotografií na
    Wikimedia Commons se k němu váže i historické české jméno Hamplova bouda,
    doložené zatím jen tímhle popiskem.
  - >-
    Počátky hospodaření na tomto místě klade web schroniska až do roku 1642,
    kdy je tu doložen hospodář Tanl. Nový velký objekt vyrostl roku 1896,
    o deset let později přišel požár a po obnově bylo schronisko znovu
    otevřeno; v roce 1912 následovalo rozšíření. Od roku 1957 je ve
    vlastnictví PTTK. Provozovatel označuje Strzechu spolu s chatou Pod
    Łabskim Szczytem za nejstarší chatu v Krkonoších — je to jeho tvrzení,
    které nemáme potvrzené z nezávislého pramene. U chaty Pod Łabskim Szczytem
    přitom vedeme budovu z roku 1938, takže se tvrzení s našimi vlastními daty
    nesrovnává; rozřešené ho nemáme.
  - >-
    Nocleh schronisko nabízí: je vedené v přehledu ubytování PTTK a spadá pod
    Sudeckie Hotele i Schroniska PTTK, tedy pod síť horských chat polského
    turistického svazu. Kapacitu 75 lůžek máme z druhé ruky s odkazem na ceník
    schroniska; samotný ceník jsme zatím neotevřeli, takže to číslo bereme
    jako nepotvrzené. Podobu občerstvení ani otvírací dobu doloženou nemáme.
  - >-
    Souřadnice, výška a obec pocházejí z OpenStreetMap, historie i kapacita z
    druhé ruky z prezentace samotného schroniska a redakce zatím žádný z
    těchto údajů neověřila vlastním dotazem ani návštěvou. Před cestou
    doporučujeme potvrdit si otvírací dobu a volná lůžka přímo u schroniska.

