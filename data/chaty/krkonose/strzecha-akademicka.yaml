# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko PTTK ve výšce 1258 m na polské straně Krkonoš, na cestě
  z Karpacze na Śnieżku. Kapacitu a otvíračku doporučujeme před cestou
  ověřit na webu schroniska.
text:
  - >-
    Strzecha Akademicka stojí nad Karpaczem v nadmořské výšce 1 258 metrů, na
    cestě z Karpacze na Śnieżku. Souřadnice, výška i obec pocházejí
    z OpenStreetMap, polohu na této cestě známe zatím jen z titulků výsledků
    vyhledávání na serverech Tulismanore a Gorskim-szlakiem — obsah stránek
    jsme neotevřeli. U provozovatele objekt figuruje pod oficiálním
    tvarem Schronisko PTTK „Strzecha Akademicka"; v popiscích fotografií na
    Wikimedia Commons se k němu váže i historické české jméno Hamplova bouda,
    doložené zatím jen tímhle popiskem.
  - >-
    Počátky hospodaření na tomto místě klade až do roku 1642, kdy je tu
    doložen hospodář Tanl, externí katalogový podklad, který se odvolává na
    stránku historie schroniska; samotný web jsme zatím neotevřeli. Rok 1642
    se přitom váže k místu, ne k dnešní budově — tu milníky kladou do roku
    1896. O deset let později přišel požár a po obnově bylo schronisko znovu
    otevřeno; v roce 1912 následovalo rozšíření. K roku 1957 je doložené
    vlastnictví PTTK. Že schronisko PTTK provozuje i dnes, nesou jeho vlastní
    přehledy — zatím jen z titulků, obsah jsme neotevřeli. Provozovatel
    označuje Strzechu spolu s chatou Pod Łabskim Szczytem za nejstarší chatu
    v Krkonoších; známe to jen zprostředkovaně z téhož podkladu a nemáme to
    potvrzené z nezávislého pramene. U chaty Pod Łabskim Szczytem přitom
    vedeme budovu z roku 1938, takže se tvrzení s našimi vlastními daty
    nesrovnává; rozřešené ho nemáme.
  - >-
    Nocleh schronisko nabízí: je vedené v přehledu ubytování PTTK a v titulcích
    přehledů se k němu váže označení Sudeckie Hotele i Schroniska PTTK.
    Kapacitu 75 lůžek máme z druhé ruky s odkazem na ceník
    schroniska; samotný ceník jsme zatím neotevřeli, takže to číslo bereme
    jako nepotvrzené. Podobu občerstvení ani otvírací dobu doloženou nemáme.
  - >-
    Souřadnice, výška a obec pocházejí z OpenStreetMap, historie i kapacita z
    druhé ruky z prezentace samotného schroniska a redakce zatím žádný z
    těchto údajů neověřila vlastním dotazem ani návštěvou. Před cestou
    doporučujeme potvrdit si otvírací dobu a volná lůžka přímo u schroniska.

