interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/strzecha-akademicka.yaml (DATA-01) po DATA-03 (s23 WebSearch + rozhodnutí Michala 20. 7. 2026: ✅ en bloc). Bezobslužná session 31 (21. 7.) — obsah webů NEotevřen, jen titulky.
  Alias „Hamplova bouda": z popisů fotek File:Strzecha Akademicka 02/08/09.jpg na Commons (user-generated) — při ručním běhu doložit z lepšího zdroje (literatura/web), jinak zvážit vyřazení aliasu.
  Dotáhnout ručním během: lůžka, otvíračka, občerstvení, telefon/e-mail, historie (titulek tulismanore.pl mluví o „najstarsze schronisko w Karkonoszach" — NEpřevzato, blogový titulek bez otevření obsahu).
  DATA-15, 4. dávka auditu (25. 7. 2026), nálezy 1–8, všech osm přijato. (1) Próza tvrdila „klade web schroniska", ale overeniHistorie i doplňková fakta vedou jako pramen katalogový podklad ChatGPT — přepsáno na tvar „externí katalogový podklad, který se odvolává na stránku historie schroniska; samotný web jsme zatím neotevřeli", totéž doplněno k tvrzení o nejstarší chatě. (2) Smazána glosa „tedy pod síť horských chat polského turistického svazu" u Sudeckie Hotele i Schroniska PTTK — vysvětlivka bez pramene, stejná vada opravena týž den u przełęczy Okraj; „spadá pod" změkčeno na to, co titulek opravdu ukazuje. (3) Smazáno „frekventované" (cesta z Karpacze na Śnieżku) z perexu i z text[0] — úsudek, ne doklad; precedens kochanowka.yaml. (4) „Od roku 1957 je ve vlastnictví PTTK." dělalo z bodového milníku 69 let nepřetržitého vlastnictví — přepsáno na „K roku 1957 je doložené vlastnictví PTTK." + dnešek zvlášť atribuovaný přehledům pttk.pl a pttk.jgora.pl (titulky); precedens Rýchorská bouda, 1. dávka. (5) „titulky polských turistických portálů" nebyly nikde v zdroje ani v overeniLokace — doplněny do zdroje jako tulismanore.pl a gorskim-szlakiem.pl s poznámkou „titulek, obsah neotevřen"; slovo „portál" v próze vypuštěno, protože vlastní poznámka výše mluví o tulismanore.pl jako o blogu (bylo by to povýšení pramene). (6) Katalogový podklad chyběl v zdroje úplně, přestože nese rok 1642, všech pět milníků, kapacitu, telefon, e-mail i zajimavosti[0] — doplněn záznam bez url (zdroje.url je volitelné) a caveat do zajimavosti[0].zdroj. (7) Zastaralý komentář „Kapacita nedoložena — nedomýšlet" nad nocleh při publikované kapacita: 75 — přepsán. (8) rokVzniku 1642 dokládá hospodáře, ne budovu (milníky kladou dům do 1896) — do prózy doplněna věta, která to rozlišuje; rokVzniku SCHVÁLNĚ nezměněn, je to údaj pramene.
  ZAMÍTNUTO (auditem samotným, ověřeno): „stojí nad Karpaczem" (obec i výška doložené); „na polské straně Krkonoš"; superlativ o nejstarší chatě (atribuovaný a rozpor přiznaný); rozpor s rokem 1938 u Pod Łabskim Szczytem (přiznaný na obou stranách); „z druhé ruky z prezentace samotného schroniska" v text[3] (schválený domovní tvar od 2. dávky, Dom Śląski); formulace kapacity v text[2]; perex bez atribuce OSM; „redakce" v text[3]; „Podobu občerstvení ani otvírací dobu doloženou nemáme"; alias Hamplova bouda; verified:false všude; zakázaný obsah (žádný).
  DATA-04 otevřená otázka: co u téhle chaty znamená „nejstarší" — nejstarší stavba, nejnepřetržitější služba, nebo kontinuita hospodaření na místě? Rok 1642 (hospodář Tanl) a rok 1896 (dnešní budova) odpovídají na různé otázky a provozovatelovo tvrzení nerozlišuje která. Rozhodnout při ručním běhu, ideálně proti Pod Łabskim Szczytem (budova 1938), aby si obě prezentace na webu neodporovaly.
