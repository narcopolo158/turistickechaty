interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/zaly.yaml (DATA-01, OSM) 29. 7. 2026 na
  výslovný pokyn Michala („zaly rovnou povysit a zaradit") — nález DATA-23,
  bodu (4): jediný krkonošský kandidát, kterému rozšířený klíč otevřel cestu.

  ⚠ PRVNÍ PROFIL S TYPEM `rozhledna`. Objekt je v datech VEDEN JAKO JEDEN,
  ačkoli fyzicky jde o dvě stavby (kamenná věž z 1892 + dřevěná restaurace
  u paty). Rozhodnutí Michala o Sněžce (26. 7. 2026) říká „profil každého
  objektu zvlášť" — tady jsme se od něj vědomě odchýlili, protože obě
  stavby drží jeden provoz (shodný telefon u restaurace v OSM a u rozhledny
  na Kudy z nudy, e-maily rozhledna@zaly.cz i restauracezaly@gmail.com,
  facebook rozhledna.zaly) a žádný pramen je nevede odděleně. Kdyby to
  Michal chtěl jinak, rozdělení je levné: věž dostane vlastní profil
  a tenhle zůstane restauraci.

  ⚠ WEB: zaly.cz se ze sandboxu nenačte (robots.txt ConnectTimeout, 20. 7.
  i 29. 7. 2026) — z vlastního webu tedy NEcitujeme nic; titulek
  „Horská bouda a rozhledna Žalý" je jen z výsledku vyhledávání a je veden
  jako alias s touto výhradou. Stránka zaly.cz/provozni-doba.html taky
  nedostupná.

  ⚠ ROZPOR V DATACI RESTAURACE (nerozřešený, přiznaný v próze): 1890
  zaniklá 1943 (ceskehory.cz) × dřevěná chata 1904, rozebraná 1939 (popis
  snímku Commons z r. 1921) × obnova 2009 (web Vrchlabí) × start_date
  2013-01-09 z RÚIAN (OSM). Do `rokVzniku` vzat jen rok věže (1892, dva
  prameny shodně).

  ⚠ ROZPOR VE VÝŠCE: 1019 (ceskehory + Vrchlabí) × 1018 a dvojvrchol
  1012/1036 (popisy snímků Commons). Publikováno 1019, přiznáno v próze.
  Výška samotné budovy restaurace doložená není.

  ⚠ OBEC Benecko je z POŠTOVNÍ adresy (Kudy z nudy) — katastr tím doložený
  není (výhrada DATA-20, tam se to řeší napříč korpusem).

  K dotažení (DATA-04, verified:true — telefon je na profilu dvakrát,
  +420 481 010 208 i +420 732 801 804): obsluhuje restaurace kolemjdoucí
  bez rezervace a co vaří; je tu nocleh (žádný pramen ho neuvádí ani
  nevylučuje); která datace restaurace platí; provozní doba lanovky
  z Herlíkovic; potvrzení otvírací doby a vstupného na sezónu.
