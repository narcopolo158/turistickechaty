# ── Historie ──────────────────────────────────────────────────────────────
# rokVzniku 1892 = rok dnešní kamenné rozhledny (dva prameny shodně).
# Rok vzniku BUDOVY restaurace je sporný, viz overeniHistorie — proto se
# do pole nedostal ani jeden z letopočtů 1890/1904/2009/2013.
rokVzniku: 1892
milniky:
  - rok: 1836
    udalost: >-
      Na Předním Žalém stála dřevěná vyhlídková stavba (dle ceskehory.cz)
  - rok: 1892
    udalost: >-
      Hrabě Jan Harrach dal postavit dnešní kamennou věž, slavnostně otevřena
      7. září 1892
  - rok: 2009
    udalost: >-
      U věže byla znovu postavena dřevěná restaurace podle projektu
      architekta Klosa (dle webu města Vrchlabí)
overeniHistorie:
  source: >-
    Rok 1892 a hrabě Jan Harrach shodně web města Vrchlabí (anglická verze,
    načteno 2026-07-29: „Today's stone tower was built by Count Jan Harrach
    in 1892", „inaugurated on 7 September 1892") a Kudy z nudy („postavena
    v roce 1892 hrabětem Harrachem"). Dřevěná vyhlídka od roku 1836, výška
    dnešní věže 18 m a předchozí kovová věž 15 m dle ceskehory.cz; výšku
    18 m nezávisle potvrzuje i OpenStreetMap u samostatné entity věže
    (way/415701652 → viz kandidát rozhledna-zaly, běh DATA-01 z 29. 7.
    2026) — vzácná dvojshoda. ROZPOR O RESTAURACI, který nemáme rozřešený: ceskehory.cz uvádí
    dřevěnou restauraci s verandou z roku 1890, která zanikla roku 1943;
    popis dobového snímku na Wikimedia Commons (File:Žalý 1921.jpg) mluví
    o dřevěné chatě postavené roku 1904, obnovené po první světové válce
    a rozebrané roku 1939; web města Vrchlabí klade obnovu restaurace do
    roku 2009, kdežto OpenStreetMap vede u dnešní budovy `start_date`
    2013-01-09 z registru RÚIAN. Do milníků je proto vzato jen to, co má
    dva prameny nebo je jednoznačné, a rozpor je přiznaný ve veřejném textu.
    Sekundární zdroje, verified:false
  verified: false
  checked: '2026-07-29'

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná rozhledna na vrcholu Přední Žalý mezi Beneckem a Vrchlabím a dřevěná
  restaurace u její paty — v průvodci je vedeme jako jeden objekt, protože je
  drží jeden provoz. Věž dal postavit hrabě Jan Harrach a otevřela se 7. září
  1892; dřevěná vyhlídka tu přitom stála už od roku 1836. Nahoru vede červená
  značka z Benecka, v sezóně i sedačková lanovka z Herlíkovic.
text:
  - >-
    Přední Žalý je zalesněný vrchol Žalského hřbetu mezi Beneckem a Vrchlabím
    a podle serveru ceskehory.cz i webu města Vrchlabí měří 1019 metrů. Stojí
    na něm kamenná rozhledna, kterou dal postavit hrabě Jan Harrach a která
    se slavnostně otevřela 7. září 1892; server ceskehory.cz uvádí, že věž měří osmnáct metrů a že jí
    předcházela kovová patnáctimetrová. Dřevěná
    vyhlídková stavba tu přitom byla už roku 1836, takže tradice výhledu je
    na Žalém starší než dnešní věž.
  - >-
    U paty rozhledny stojí dřevěná restaurace a právě ona je důvodem,
    proč Žalý mezi horskými chatami vedeme: rozhoduje občerstvení pro
    turisty, ne to, jestli je stavba bouda, nebo věž.
    Otevřená mapová databáze vede budovu jako restauraci s celoroční
    otvírací dobou, vlastním telefonem i e-mailem. Věž a restauraci
    navíc drží jeden provoz: telefonní číslo uvedené u rozhledny na
    portálu Kudy z nudy je totéž, které u restaurace nese mapová
    databáze. Co se tu vaří, jestli restaurace obslouží i kolemjdoucího
    bez rezervace a jak je to tu s noclehem, v žádném z dostupných
    pramenů nestojí — a víc, než co je doložené, tady neuvádíme.
  - >-
    Historie restaurace je popletená a rozřešenou ji nemáme. Server
    ceskehory.cz píše o dřevěné restauraci s verandou postavené roku 1890,
    která zanikla v roce 1943. Popis dobové fotografie z roku 1921 na
    Wikimedia Commons naproti tomu mluví o dřevěné chatě z roku 1904,
    obnovené po první světové válce a rozebrané roku 1939. Web města
    Vrchlabí uvádí, že restauraci u věže znovu postavili v roce 2009 podle
    projektu architekta Klosa — kdežto v registru budov RÚIAN má dnešní stavba jako datum vzniku
    9. leden 2013.
    Čtyři letopočty, tři různá vyprávění; do naší časové osy jsme proto
    vzali jen ty, které stojí na shodě dvou pramenů.
  - >-
    Nahoru se dá dojít po červené turistické značce z Benecka, v sezóně
    vyjet sedačkovou lanovkou z Herlíkovic a v létě podle ceskehory.cz
    i na kole nebo koloběžce. Rozhledna má podle portálu Kudy z nudy otevřeno od dubna do
    prosince, v hlavní sezóně denně, a vstup do věže je placený.
    Restaurace má podle mapových podkladů rozpis o něco širší, včetně
    zimních měsíců. Otvírací doby jsou ale
    údaj, který stárne nejrychleji ze všech, a od provozovatele je
    potvrzené nemáme — před cestou zavolejte.
  - >-
    Ještě k výšce: 1019 metrů uvádějí shodně dva prameny, ale ne všechny
    přehledy se s nimi shodují. Popisy fotografií na Wikimedia Commons
    mluví o Předním Žalém jako o vrcholu 1018 metrů vysokém a o Žalém jako
    o dvojvrcholové hoře s kótami 1012 a 1036 metrů. Rozdíly jsou v řádu
    metrů a plynou nejspíš z toho, co se za vrchol počítá; publikujeme
    hodnotu ze dvou nejsilnějších pramenů a mezi čísly potichu nevybíráme.
  - >-
    Údaje na téhle stránce pocházejí z portálu Kudy z nudy, z webu města Vrchlabí, ze serveru ceskehory.cz a z otevřené mapové
    databáze; vlastní web provozovatele se nám ani napodruhé nepodařilo
    načíst, takže z něj tu není citováno nic. Vlastním dotazem ani
    návštěvou zatím žádný z údajů ověřený není — všechny sem přišly z
    pramenů uvedených níž.

