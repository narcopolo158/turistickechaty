# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata na rozhraní klidových zón KRNAP vysoko nad Špindlerovým
  Mlýnem, zhruba šest kilometrů od centra střediska a kolem 1100 metrů.
  Katalogy u ní vedou osmačtyřicet lůžek v deseti pokojích a vlastní
  prostornou restauraci; v roce 2009 prošla velkou rekonstrukcí.
text:
  - >-
    Chata Sedmidolí stojí vysoko nad Špindlerovým Mlýnem, podle katalogu
    na rozhraní druhé a třetí zóny národního parku a zhruba šest
    kilometrů od centra střediska, ve výšce kolem 1100 metrů. Kdo sem
    míří, jde už opravdovými horami — a přesně to je na poloze chaty
    to nejcennější.
  - >-
    Nocleh vedou katalogy na osmačtyřiceti lůžkách v deseti pokojích
    a k tomu vlastní prostornou restauraci — tak ji popisuje krajský
    katalog. Jestli restaurace obslouží i turistu, který jen prochází,
    prameny neříkají, a my to bez dokladu netvrdíme. Vlastní web chaty
    zve rodiny i školy a lyžařské kurzy.
  - >-
    Z historie domu se zatím podařilo doložit jediné: v roce 2009 prošla
    chata podle krajského katalogu celkovou rekonstrukcí s dostavbou
    nových prostor restaurace a kuchyně. Co bylo dřív — kdy bouda
    vznikla a čemu sloužila — jsme v otevřených pramenech nenašli;
    jakmile se pramen objeví, doplníme ho.
  - >-
    Údaje pocházejí z katalogů a z vlastního webu chaty; vlastním
    dotazem u provozovatele jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

