# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Areál dvou bud nad Pecí pod Sněžkou na cestě na Výrovku, s turistickou
  minulostí sahající před rok 1911 — a podle první zmínky o boudách na
  tomhle místě až do 80. let 18. století. Po desetiletích ve službách
  školství patří od listopadu 2020 Policejnímu prezidiu jako školicí
  středisko; zda dnes něco nabízí i veřejnosti, doloženo nemáme.
text:
  - >-
    Richtrovy boudy stojí ve druhé zóně Krkonošského národního parku nad
    Pecí pod Sněžkou, na cestě k Výrovce. Areál tvoří podle Úřadu pro
    zastupování státu ve věcech majetkových dvě budovy — Richtrova bouda
    a tři sta metrů vzdálená Červená bouda — a k nim víceúčelové hřiště,
    garáž a lyžařské vleky. Na výšce se prameny neshodnou: mapová data
    uvádějí 1 136 metrů, kdežto dva turistické weby a externí katalog
    shodně 1 206 — a protože si ta trojice může opisovat, nerozhodujeme
    a uvádíme obojí.
  - >-
    Minulost má areál delší, než by se z dnešního stavu zdálo. První zmínka o boudách na tomhle místě má pocházet z 80. let
    18. století; dnešní hlavní budova byla podle státního úřadu postavena
    před rokem 1911. V roce 1938 objekt vyhořel. Po válce začala dlouhá
    školská kapitola: v roce 1946 boudu získala Obchodní akademie
    Dr. Beneše z Prahy, v roce 1950 připadla ministerstvu školství
    a školám a jejich institucím pak sloužila přes sedmdesát let —
    naposledy Národnímu pedagogickému institutu. Červená bouda, dnešní
    depandance, vyrostla v roce 1934 na místě staršího domu; obě budovy
    prošly kolem přelomu tisíciletí stavebními úpravami.
  - >-
    Zlom přišel 27. listopadu 2020, kdy stát areál předal Policejnímu
    prezidiu jako školicí středisko pro příslušníky bezpečnostních
    sborů. A tady musí být průvodce upřímný: co to znamená pro turistu,
    který jde kolem, nevíme. Firemní zápis objektu je veden jako
    neaktivní, popisy restaurace s krkonošskými specialitami a ubytování
    — prameny uvádějí čtyři různé kapacity od 50 do zhruba stovky lůžek —
    pocházejí vesměs z doby před převodem a novější doklad o službě
    veřejnosti jsme nenašli. Turistická známka areálu přitom v letošním
    seznamu vydavatele zůstává, takže úplně uzavřený svět to nejspíš
    není. Kdo sem míří s představou občerstvení nebo noclehu, měl by
    počítat s tím, že jde o objekt bezpečnostních sborů, a ověřit si stav
    předem.
  - >-
    Web boudy se nám opakovaně nepodařilo otevřít a telefonní číslo
    pochází z mapových dat, takže po změně majitele nemusí platit.
    Historie stojí na tiskové zprávě státního úřadu a na Kudy z nudy,
    dnešní provoz na firemním rejstříku — vlastním dotazem jsme zatím
    neověřili nic. Souřadnice jsou z OpenStreetMap (© přispěvatelé
    OpenStreetMap, ODbL) a v terénu je nikdo nekontroloval.

