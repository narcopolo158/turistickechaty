# ── Historie ──────────────────────────────────────────────────────────────
# rokVzniku ZÁMĚRNĚ NEVYPLNĚN: ÚZSVM datuje hlavní budovu jen „před rokem
# 1911" a „první zmínka z 80. let 18. století" (Kudy z nudy) patří boudám
# na místě, ne dnešní stavbě. Ani jedno není letopočet stavby — nedopočítávat
# (poučení Kolínská: zmínka o místě ≠ stavba budovy).
milniky:
  - rok: 1934
    udalost: >-
      Červená bouda, dnešní depandance areálu, byla postavena na místě
      původního domu
  - rok: 1938
    udalost: Objekt vyhořel
  - rok: 1946
    udalost: Boudu získala Obchodní akademie Dr. Beneše z Prahy
  - rok: 1950
    udalost: >-
      Bouda se stala majetkem tehdejšího ministerstva školství, věd
      a umění; ve školství pak zůstala přes sedmdesát let
  - rok: 2000
    udalost: >-
      Začaly stavební úpravy hlavní budovy, které trvaly do roku 2008;
      Červená bouda prošla úpravou už v letech 1999 až 2000
  - rok: 2020
    udalost: >-
      27. listopadu předal stát areál Policejnímu prezidiu jako školicí
      středisko pro příslušníky bezpečnostních sborů
overeniHistorie:
  source: >-
    ÚZSVM (uzsvm.gov.cz, 27. 11. 2020, primární pramen), doslova:
    „Richtrova bouda byla postavena před rokem 1911 a v letech 2000 až
    2008 probíhaly její stavební úpravy.", „Červená bouda byla postavena
    v roce 1934 na místě původního domu a stavebně byla upravena v letech
    1999 až 2000.", „Úřad pro zastupování státu ve věcech majetkových
    (ÚZSVM) v Trutnově předal areál Richtrových bud v Peci pod Sněžkou
    včetně přilehlých pozemků, vybavení a lyžařských vleků Policejnímu
    prezidiu České republiky.", „Policejní prezidium využije areál
    Richterových bud jako školicí středisko pro příslušníky bezpečnostních
    sborů." (překlep „Richterových" je pramene) a „ÚZSVM převzal tento
    areál od Národního pedagogického institutu České republiky". Kudy
    z nudy (načteno 26. 7. 2026), doslova: „První zmínka o Richtrových
    boudách pochází z 80. let 18. století", „V roce 1938 objekt vyhořel",
    „V roce 1946 získala boudu Obchodní akademie Dr. Beneše z Prahy
    a v roce 1950 se stala majetkem tehdejšího ministerstva školství, věd
    a umění", „Jedná se o majetek Policejního prezidia".
  verified: false
  checked: '2026-07-26'

