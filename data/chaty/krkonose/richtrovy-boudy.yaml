interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/richtrovy-boudy.yaml (DATA-01, OSM) 26. 7. 2026 na základě rozhodnutí Michala o rozšíření klíče zařazení (DATA-25): bouda s turistickou minulostí se uvádí i bez dnešní veřejné služby, s poctivou poznámkou. Ranní verdikt „NEPOVYŠOVAT" z téhož dne tím revidován — materiál rešerše je beze změny, změnil se klíč.
  Jediná položka Tier 1 master fronty (známka č. 1602 + katalog). Vizitka CZ-2524 existovala a byla dle katalogu znamky-vizitky.csv „vyřazena z projektu v roce 2022" — do profilu nejde (vizitky čekají na svolení Wander Booku, DATA-13 je filtruje).
  ROZPORY vedené otevřeně: výška 1136 (OSM) × 1206 m (tři možná si opisující prameny); kapacita 50/18 × 77+29 × „přes 100" × 106/34 (všechna čísla z éry před převodem — žádné nezapsáno). Stav restaurace a noclehu po převodu na Policejní prezidium NEDOLOŽEN; protiznak: známka v seznamu vydavatele z července 2026 trvá.
  stav: v-provozu zvoleno vědomě — areál je v provozu (školicí středisko), jen nedoloženě pro veřejnost; próza to říká výslovně. Kdyby Michal rozhodl jinak (mimo-provoz z pohledu turisty), přepsat i prózu.
  K dotažení (DATA-04 / Michal): telefonát nebo web v prohlížeči — slouží dnes areál nějak veřejnosti (občerstvení, nocleh, prodej známky)? Kde se prodává známka č. 1602? Výška proti výškopisu. Hero fotka: kandidáty DATA-02 prošla session 27. 7. 2026 — geosearch našel jediný snímek („Outside Pec pod Sněžkou", 152 m) a ten budovu nepotvrzuje → hero nevybráno; pomůže fulltext sklizeň DATA-02 (klik Michala) nebo oční výběr na Commons.
