# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Menší ze dvou bud společného areálu na Horních Mísečkách, na svazích
  Medvědína v 1035 metrech — dvanáct míst pro menší partu, pár kroků od
  větší Staromísečné boudy, která má v průvodci vlastní zápis.
text:
  - >-
    Novomísečná bouda stojí na Horních Mísečkách, luční enklávě na
    svazích Medvědína — poštovní adresou v obci Vítkovice — ve výšce
    1035 metrů. Se sousední Staromísečnou tvoří jeden areál, který
    rezervační portál nabízí vcelku; v průvodci vedeme každou boudu
    zvlášť, jménem i polohou jsou to dva domy.
  - >-
    Tahle menší z obou bud nabízí dvanáct míst — formát
    pro rodinu nebo menší partu, na týden i víkend. Občerstvení k ní
    pramen nevede; bar a společenská místnost patří k areálu u větší sestry, a tak tu nic netvrdíme.
  - >-
    Osada Horní Mísečky byla podle turistického serveru založena roku
    1642, i s první boudou — letopočet ale patří osadě jako celku.
    O tom, kdy vznikla samotná Novomísečná a odkud má své „novo-", jsme
    zatím nenašli jediný doložený údaj; jakmile se pramen objeví,
    doplníme ho.
  - >-
    Údaje pocházejí z rezervačního portálu areálu a z turistického
    serveru; vlastním dotazem jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

