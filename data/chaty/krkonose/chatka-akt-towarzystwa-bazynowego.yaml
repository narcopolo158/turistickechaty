# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěná chatka z roku 1908 na Hutniczym Grzbiecie v polských
  Krkonoších, kolem 1050 metrů — od studentské éry šedesátých let známá
  jako Chatka AKT. Není to penzion ani schronisko: spravuje ji spolek
  a trvale tu bydlí správce, který podle tradice přivítá každého
  příchozího hrnkem horkého čaje. Nocleh je ale spolková věc — počítat
  s ním nejde.
text:
  - >-
    Chatka AKT stojí v severní části hřebene Hutniczy Grzbiet, u dolního
    konce skal Bażynowe Skały a kousek pod zeleně značenou cestou nad
    horní hranicí lesa, ve výšce kolem 1050 metrů. Postavena byla podle
    nápisu, který se dochoval uvnitř, v létě 1908 — „Erbaut vom 8. VII
    bis 20. IX 1908".
  - >-
    Novodobý příběh začíná na jaře 1959, kdy lesní správa v Podgórzyně
    předala domek Akademickému turistickému klubu z Vratislavi jako
    základnu studentských putovních táborů — a od šedesátých let se na
    mapách Krkonoš objevuje jako Chatka AKT. Dnes ji spravuje
    Towarzystwo Bażynowe a je to podle přehledů jediná chatka
    v polských Krkonoších, kde trvale přebývá správce, zvaný Chatar.
  - >-
    Režim je potřeba říct přesně, protože je jiný než u všeho ostatního
    v tomhle průvodci: chatka „není penzion, hotel ani turistické
    schronisko", jak píší její stránky doslova. Přijít může každý
    a každého podle tradice přivítá hrnek horkého čaje — některé dny je
    ale chatka pro lidi mimo spolek zavřená. Spí se na zhruba třiceti
    matracích, bez elektřiny, s vodou ze studny a společnou kuchyní —
    o nocleh se ovšem hlásí spolku, ne na počkání u dveří.
  - >-
    Údaje pocházejí z polských přehledů chatek a z místopisného webu;
    vlastním dotazem jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

