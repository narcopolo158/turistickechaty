interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/erlebachova-bouda.yaml (externí katalog ČR/SK) 26. 7. 2026 na základě rozhodnutí Michala o rozšíření klíče zařazení (DATA-25). Verdikt „zůstává kandidátem" z 25. 7. tím revidován — materiál beze změny, změnil se klíč.
  METODICKÉ POUČENÍ z kandidáta (zůstává v platnosti pro celý korpus): první, volnější čtení webu 25. 7. tvrdilo, že restaurace Panorama je veřejně přístupná — byl to DOMYŠLENÝ závěr čtecího nástroje, ne slova stránky; cílený dotaz na doslovnou citaci ho vyvrátil. Tvrzení „slouží i veřejnosti" nikdy nepřebírat bez vyžádané doslovné citace.
  RESORT SVATÝ FRANTIŠEK: čtyři budovy (Kudy z nudy), z nich jmenovitě známe Josefovu boudu. Podle precedentu Dvoračky × Štumpovka (rozhodnutí Michala 21. 7.) by KAŽDÁ budova resortu s turistickou službou měla mít vlastní profil — Josefova bouda je adept na kandidáta; do otázek pro Michala (střádají se na konec Krkonoš).
  Vizitka CZ-2933 (Wander Book) existuje v katalogu — bez svolení Wander Booku se nepoužívá (DATA-13 filtruje). Známka v oficiálním seznamu vydavatele není.
  K dotažení (DATA-04 / Michal): veřejnost restaurace (telefonát), kapacita samotné boudy, GPS s pramenem, po kom se bouda jmenuje (rešerše — jméno Erlebach je nejspíš rodové, ale bez pramene se nevyslovuje), hero fotka po GPS.

  GPS DOPLNĚNA 28. 7. 2026 (DATA-31, OpenStreetMap — doklad v
  overeniLokace): starší věty výše o chybějících souřadnicích tím padají.
  Zůstávají schválně, je z nich vidět, čím profil prošel.
