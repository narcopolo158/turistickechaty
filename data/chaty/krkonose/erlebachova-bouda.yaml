# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda na hřebeni nad Špindlerovým Mlýnem (1 150 m), dnes hotelová část
  resortu Svatý František. Stát tu má už od roku 1784, kdy bývala skromným útočištěm pro poutníky —
  letopočet nese jediný pramen. Restaurace Panorama má otevřeno
  denně od jedenácti do devíti večer — jestli obslouží i neubytované, se
  nám ale doložit nepodařilo.
text:
  - >-
    Erlebachova bouda stojí na horském hřebeni v Krkonošském národním parku
    ve výšce 1 150 metrů, zhruba šest kilometrů od centra Špindlerova Mlýna.
    Dnes je hotelovou částí resortu Svatý František, který nabízí ubytování
    ve čtyřech budovách — vedle Erlebachovy k němu patří i Josefova bouda,
    popisovaná jako romantická chata hotelového typu v alpském stylu.
  - >-
    O minulosti boudy víme jednu větu, zato starou: stát tu má už od roku
    1784 a bývala skromným útočištěm pro poutníky.
    Ten letopočet nese jediný pramen a bez dokladu, uvádíme ho proto
    s připsáním, ne jako doloženou jistotu. Po kom bouda dostala jméno,
    žádný z načtených pramenů neříká — a my se to domýšlet nepokoušíme.
  - >-
    Dnešní provoz je hotelový. Vlastní web zve na á la carte restauraci
    Panorama s denním provozem od jedenácti dopoledne do devíti večer;
    polopenzi je podle něj třeba objednat aspoň den předem a rezervace
    stolu přijímají až od šesti osob. Otvírací doba zní veřejně — ale
    výslovnou větu, že restaurace obslouží i turistu, který v resortu
    nespí, jsme na webu nenašli. Nebudeme ji domýšlet: kdo jde po hřebeni
    kolem, ať s obědem raději počítá jen po vlastním ověření.
  - >-
    Výška i celoroční provoz pocházejí z katalogových pramenů, historie
    a popis resortu z Kudy z nudy, provoz restaurace z vlastního webu
    boudy — a vlastním dotazem jsme zatím neověřili nic. Souřadnice boudy
    nemáme doloženy z žádného pramene, proto ji na mapě neukazujeme;
    kapacitu neuvádíme, protože prameny popisují resort jako celek a číslo
    pro samotnou Erlebachovu boudu nikde nepadlo.

