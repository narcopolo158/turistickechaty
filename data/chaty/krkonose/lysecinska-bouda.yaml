interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/lysecinska-bouda.yaml (externí katalog
  ČR/SK, jistota A) v rámci master fronty Tier 1 (známka č.1336 + katalog).

  BEZ GPS — katalog souřadnice nenese a objekt není ani v OSM exportu DATA-01;
  doplnit z OSM přes Actions nebo ručně (nedomýšlet).

  Opravy proti kandidátovi (obojí dle Kudy z nudy): výška 950 → 1 000 m; obec
  Horní Maršov → Malá Úpa (adresa Horní Lysečiny 51, 542 26 Malá Úpa). Obě
  změny jsou zatím jednozdrojové — ověřit.

  Zaznamenaný rozpor: doména lysecinskabouda.cz (katalog) vs. lysecinskabouda.eu
  (Kudy z nudy, shodná s e-mailem) — do profilu vzata .eu, ověřit.

  Klíč zařazení: zdroj výslovně rozlišuje dvě restaurace a jen u jedné říká, že
  je „určena jen pro ubytované hosty" — druhá (s barem a krbem) tedy vyhrazena
  není. Tím je splněn Michalův klíč (veřejné občerstvení). Přesto ověřit.

  Wi-Fi, platba kartou, psi a lyžárna: zdroj neuvádí — pole vědomě nevyplněna.
  Typy pokojů: zdroj nenese — `pokoje` nevyplněno. Otvírací doba: nedoložena.

  DATA-15 (jazykový audit 25. 7. 2026, třetí dávka): opraveno pět vad prózy.
  (1) „ve východních Krkonoších" (perex) a „ve východní části Krkonoš"
  (text[0]) — tvrzení o poloze v pohoří, které nenese žádný pramen; z obou míst
  odstraněno. Na rozdíl od „v Horních Lysečinách, které jsou dnes částí Malé
  Úpy" (to plyne z doložené adresy) tady nejde o odvození, ale o přidaný údaj.
  (2) Perex psal o boudě „u staré kupecké stezky", zdroj ale mluví v minulém
  čase („kolem boudy vedla") — opraveno; stezka dnes doložená není.
  (3) Perex slučoval boudu a Císařský pramen do jednoho místa („u staré kupecké
  stezky s Císařským pramenem"), zdroj přitom říká „nedaleká studánka" —
  opraveno. (4) Perex sliboval „dvě restaurace" bez toho, že jedna je vyhrazena
  ubytovaným — což je pro čtenáře, který si chce cestou odpočinout, ta
  podstatná půlka informace; doplněno. (5) text[3] mluvil o „jediném
  sekundárním prameni", ač celoroční provoz nese katalogový podklad, tedy
  pramen druhý — opraveno na množné číslo a přidán záznam do zdroje[] (bez url,
  veřejně citovatelné umístění nemá; vzor chata-rezek a dom-slaski).
  ZAMÍTNUTO jako nedorozumění auditu: „které jsou dnes částí Malé Úpy" není
  domyšlené — plyne z doložené adresy „Horní Lysečiny 51, 542 26 Malá Úpa"
  v overeniLokace. — TOHLE ZAMÍTNUTÍ BYLO CHYBNÉ, viz další odstavec.

  DATA-17 (26. 7. 2026), sporná obec: audit měl pravdu a moje zamítnutí ne.
  „Horní Lysečiny jsou dnes částí Malé Úpy" z doložené adresy NEPLYNE — plyne
  z ní jen poštovní doručovací obec (PSČ 542 26), a ta se nemusí krýt s obcí
  administrativní. Místopisný rejstřík vede Horní Lysečiny jako část Horního
  Maršova, tedy přesně to, co uváděl starší katalogový podklad a co profil
  označil za rozpor — a pak ho tou glosou potichu rozhodl ve prospěch Malé Úpy.
  Glosa odstraněna z overeniLokace i z text[0], rozpor je nově přiznaný v próze
  (konvence B: rozpor se přiznává, neuhlazuje) a doplněn pramen na rejstřík.
  Pole `obec` zatím zůstává Malá Úpa, protože jeden rejstřík proti jednomu
  médiu je spor, ne verdikt; rozhodne až registr územní identifikace nebo
  dotaz na obecní úřad — vedeno v BACKLOGu jako DATA-20.

  DATA-20 (26. 7. 2026): pole `obec` přepsáno Malá Úpa → Horní Maršov. Ta věta
  o „sporu, ne verdiktu" o den dřív platila; dohledání ji převrátilo, a to ne
  tím, že by se našel silnější pramen pro Horní Maršov, ale tím, že se rozpadla
  jediná opora Malé Úpy. Adresa „Horní Lysečiny 51, 542 26 Malá Úpa" u Kudy
  z nudy si odporuje sama: PSČ 542 26 je pošta Horní Maršov a ta ve svém obvodu
  Horní Lysečiny vede, kdežto Malou Úpu ne — Malá Úpa je 542 27. Adresa tedy
  páruje číslo jedné obce se jménem druhé a jako doklad o obci neobstojí ani
  v poštovním smyslu. Proti tomu stojí tři nezávislé přehledy, které se shodnou
  (místopisný rejstřík, soupis částí obce Horní Maršov u Atlasa, poštovní
  obvod). Pořád jsou to sekundární prameny, takže verified zůstává false
  a dotaz na RÚIAN/obecní úřad se vede dál v DATA-04. Rozpor je v próze pořád
  přiznaný — profil netvrdí, že je věc uzavřená, jen říká, ke které straně se
  kloní a proč. Poznámka o „PSČ 542 26 jako poštovní doručovací obci Malá Úpa"
  v odstavci výš je tímhle měřením vyvrácená: to PSČ Malé Úpě nepatří.

  DATA-20, otevřená otázka nad rámec tohohle profilu: pole `obec` má ve
  schématu popisek „Nejbližší obec", ale veřejně se vykresluje v drobečkové
  navigaci jako třetí stupeň za zemí a pohořím, tedy jako příslušnost. Dokud se
  nerozhodne, co pole znamená, je i tahle oprava jen nejlepší dostupný odhad
  jednoho ze dvou různých údajů.

  Pravidlo pro jmenovce (docs/DATA-17-jmenovci.md): tenhle profil je vzorový
  případ R7 (sporná obec). Kolizi jmen zatím nemá, takže R3 se nespouští
  a perex smí vést osadou bez obce; kdyby jmenovec vznikl, obec se do perexu
  doplní i s přiznaným rozporem, ne že se rozlišovač přehodí na jiné pole.

  K dotažení (DATA-04, verified:true): GPS, potvrdit výšku a obec, otvírací doba
  a veřejná přístupnost druhé restaurace, sezónní režim, platná doména. Hero
  fotka: kandidáti DATA-02. Známka č.1336 — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c1336-lysecinska-bouda.png.
