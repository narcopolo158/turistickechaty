# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Odlehlá horská bouda ve výšce 1 227 m u Špindlerova Mlýna, dostupná jen
  pěšky. Restaurace s jídlem z vlastního chovu skotu Highland i pro
  kolemjdoucí, 50 lůžek — a záměrně žádná Wi-Fi.
text:
  - >-
    Bouda Klínovka stojí ve výšce 1 227 m n. m. v Krkonoších; nejbližší
    obcí je Špindlerův Mlýn. Je to horská bouda s restaurací a vlastním
    ubytováním, kterou provozovatel popisuje jako odlehlou a dostupnou
    pouze pěšky. V OpenStreetMap je objekt veden pod jménem Nová Klínovka,
    web provozovatele používá tvar Bouda Klínovka.
  - >-
    O starších dějinách boudy toho zatím víme málo. Počátek Klínové boudy má
    podle prezentace boudy sahat k roku 1676, kdy na místě stála hornická
    chatrč; tenhle letopočet k nám ovšem dorazil z druhé ruky a sami jsme ho
    na stránkách boudy zatím neověřili. Další milníky doložené nemáme.
  - >-
    Ubytovat se tu může až padesát hostů v sedmi podkrovních pokojích a ve
    dvou noclehárnách. Restaurace má jídelní lístek a je otevřená i těm,
    kdo tu nespí; podle boudy stojí kuchyně na poctivém jídle z vlastního
    chovu skotu Highland, jmenovitě na kulajdě a steacích, a peče se tu
    čerstvý chléb. Wi-Fi tu záměrně nenajdete, místo připojení nabízí
    bouda společenské hry, kytaru a klavír. Provoz je celoroční, se
    zimními i letními trasami.
  - >-
    Autem k boudě dojet nelze, nahoru se chodí pěšky; těžší zavazadla
    provozovatel po předchozí domluvě vyveze. Konkrétní pěší trasy, jejich
    délky ani převýšení zatím doložené nemáme.
  - >-
    Údaje na této stránce pocházejí z prezentace boudy — část z nich jen
    zprostředkovaně — a z OpenStreetMap; redakce je zatím neověřila vlastním
    dotazem ani návštěvou. Otvírací dobu restaurace web neuvádí, proto ji
    doporučujeme si před cestou potvrdit přímo u boudy.
