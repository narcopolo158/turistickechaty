# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Odlehlá horská bouda ve výšce 1 227 m u Špindlerova Mlýna, dostupná jen
  pěšky. Restaurace s jídlem z vlastního chovu skotu Highland i pro
  kolemjdoucí, 50 lůžek — a záměrně žádná Wi-Fi.
text:
  - >-
    Bouda Klínovka stojí ve výšce 1 227 m n. m. nad Špindlerovým Mlýnem a
    hlásí se k roli odlehlé horské boudy: auta sem nevjíždějí, nahoru se
    chodí pěšky a těžší zavazadla vyvezou po domluvě. Ubytuje až 50 hostů
    v sedmi podkrovních pokojích a dvou noclehárnách.
  - >-
    Vlastní restaurace vaří poctivé jídlo z chovu skotu Highland — kulajdu,
    steaky, k tomu čerstvě pečený chléb — a je otevřená i pro neubytované.
    Wi-Fi tu záměrně nenajdete; místo ní společenské hry, kytara a klavír.
    Provoz je celoroční, se zimními i letními trasami.
