interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/nova-klinovka.yaml (DATA-01) po křížovém ověření DATA-03 a schválení Michala (chat 20. 7. 2026, kategorie ✅).
  Název: web užívá „Bouda Klínovka", OSM „Nová Klínovka" (ponecháno jako alias). Slug drží OSM původ (nova-klinovka), ať se neláme historie kandidáta; zvážit rename na klinovka po dohodě.
  Web: klinovka.cz z OSM přesměrovává na klinovka.com — zapsán cílový web.
  Foto: hero chybí (0 licenčně čistých kandidátů na Commons) — dořešit.
  Otvírací doba restaurace: web ji neuvádí — doplnit (DATA-04).
  DATA-15 (jazykový audit 25. 7. 2026, čtvrtá dávka): opraveny tři vady. (1) text[1] kladl „počátek Klínové boudy" k roku 1676, ač Klínová bouda (též Klínovka, Keilbaude) je v našem vlastním atlasu zaniklých chat samostatný objekt — ZANIK-007, vyhořela 1970, jistota A, souřadnice zhruba 280 m odsud. Próza si tedy přivlastňovala dějiny domu, který podle nás neexistuje, a rozpor nikde nepřiznávala; přepsáno tak, že letopočet zůstává jako tvrzení provozovatele a kolize jmen je přiznaná nahlas („jestli dnešní bouda na jeho dějiny navazuje, doložené nemáme"). Milník ponechán v doslovném znění pramene, včetně jeho vlastní formulace „Klínové boudy" — pramen se nepřepisuje, rozpor vysvětluje próza. Patří k DATA-17, jen ostřejší variantou: kolize není mezi dvěma živými chatami, ale mezi živou a zaniklou. (2) text[2] tvrdil „jmenovitě na kulajdě a steacích, a peče se tu čerstvý chléb" — jediná citace ke stravování (overeniObcerstveni) nese pouze „poctivé jídlo z vlastního chovu Highland", konkrétní pokrmy nestojí nikde v repu kromě pole specialita a téhle věty. Vypuštěno z prózy i zúženo v poli specialita, protože pole překračovalo citaci vlastního bloku stejně jako próza. (3) zajimavosti[0] („Horská bouda s restaurací ve výšce 1227 m, kam auto nevjede") byla čistý duplikát polí vyska, typObcerstveni a autem — po odečtení doložených polí nezbylo nic. Nahrazena doloženým tvrzením z fakticka-data.csv (HUT-0026, zdroj klinovka.com, jistota A): „Provozovatel objekt prezentuje jako nejvýše položenou farmu v ČR." Oproti Martinově boudě ze třetí dávky se tu položka nemazala — doložená náhrada v korpusu ležela nepoužitá, což je lepší než prázdné místo. ZAMÍTNUTO jako nedorozumění auditu (v tomhle profilu už samotným agentem, po druhém čtení): „podle prezentace boudy" u roku 1676 není vada třídy 12 — web klinovka.com skutečně otevřen byl (DATA-03, 20. 7. 2026) a zprostředkovaný je jen blok overeniHistorie, což próza sama přiznává. Slovo „milník" ve větě „Další milníky doložené nemáme" není únik názvu pole, ale doložený domácí styl (chalupa-na-rozcesti, lucni-bouda, labska-bouda). Věta „Konkrétní pěší trasy… doložené nemáme" si neodporuje s vrstvou tras: ta je generovaná (OSM routing + výškový model, verified:false) a redakce ji za publikovaný doklad nepovažuje — je to systémová otázka napříč čtyřmi profily, ne vada tohohle souboru.