interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/lesni-bouda.yaml (DATA-01) po křížovém ověření DATA-03 a schválení Michala (chat 20. 7. 2026, kategorie ✅).
  Výška 1102 m z OSM (web ji neuvádí); popis fotky Commons „na hřebeni Liščí hory" polohu potvrzuje.
  Kapacita lůžek a ceny: na webu neuvedeny — nezapsáno.
  KOLIZE JMEN (DATA-17, uzavřeno 26. 7. 2026): tady stálo, že v Krkonoších je i další „Lesní bouda" ve Špindlerově Mlýně — TO SE NEPOTVRDILO. Čtyři vyhledávání nedala nic; treking.cz má stránku „Lesní bouda" a jmenuje na ní jen tenhle objekt nad Pecí pod Sněžkou, OSM u něj navíc nese tag wikipedia: cs:Lesní bouda, takže i encyklopedický článek je o něm. `git log -S` ukazuje, že tvrzení vstoupilo do repozitáře commitem 0d728e2 jako holá věta bez pramene a odtud ho jako hotovou věc převzal BACKLOG i poznámka v martinova-bouda.yaml. Zapisuje se proto jako „hledali jsme a nenašli", ne jako „neexistuje" — špindlerovská Lesní bouda klidně existovat může (historická, zaniklá, jen místním jménem), doložená ale není. Poučení, které z toho vypadlo: konvence B platí i pro interniPoznamky, protože nedoložená věta tady se po dvou krocích cituje jinde jako fakt. Pravidlo a rozbor v docs/DATA-17-jmenovci.md; veřejně se nepublikuje nic, R4 bez pramene mlčí.
  SPORNÁ OBEC (DATA-20, přeměřeno 26. 7. 2026 — původní znění téhle poznámky bylo ve dvou bodech mylné a nahrazuje se jím tohle). Stálo tu, že „ubytovací server ji řadí pod Pec pod Sněžkou, Černý Důl i Dolní Dvůr současně". To je špatné čtení: ceskehory.cz ta tři jména uvádí jako místa, odkud se dá po zakoupení povolení vyjet autem („vyjet autem z Pece pod Sněžkou, Černého Dolu nebo Dolního Dvora"), tedy jako příjezdy, ne jako adresy. Domnělý trojí rozpor tím padá. Padá ale zároveň i opora publikované hodnoty: lesnibouda.cz žádnou adresu neuvádí vůbec a o poloze píše jen „ubytování nad Pecí pod Sněžkou" (načteno 26. 7. 2026) — což je popis polohy vůči obci, ne přihlášení k ní. Pole overeniLokace přitom dosud tvrdilo „poloha Pec pod Sněžkou … : lesnibouda.cz", což je z webu vyčteno víc, než unese; opraveno. Proti tomu stojí adresa „Černý Důl 187, 543 44 Černý Důl" shodně na portálu Královéhradeckého kraje (hkregion.cz) i ve firemních katalozích (zivefirmy.cz, csfirmy.cz, firmy.cz, portalridice.cz) — jenže to nejsou nezávislé prameny, nýbrž nejspíš jeden rejstřík rozmnožený pětkrát, a rejstřík vede sídlo provozovatele, ne polohu stavby. region-krkonose.cz se nerozhoduje a uvádí „Obec: Černý Důl - Pec pod Sněžkou". Hodnota se proto NEMĚNÍ — na rozdíl od Lysečinské boudy, kde se opora pro původní obec sama vyvrátila, tady jen zeslábla. Rozpor se ale nově PŘIZNÁVÁ VE VEŘEJNÉ PRÓZE, protože podmínka, kterou si tahle poznámka sama stanovila („jeden rejstřík proti jednomu webu je spor, ne verdikt"), už neplatí: je to adresní pramen proti webu, který adresu nemá vůbec. Do DATA-04: zeptat se přímo na boudě. Do DATA-20: rozhodne až registr územní identifikace nebo obecní úřad.
  DATA-20 — SÉMANTIKA, tenhle profil je učebnicový exponát. Kdyby pole obec znamenalo to, co říká jeho popisek ve schématu („Nejbližší obec"), je Pec pod Sněžkou skoro jistě správně: vede odtud žlutá značka dlouhá zhruba tři kilometry, kdežto do Černého Dolu je to podstatně dál. Kdyby znamenalo správní příslušnost (jak s polem zachází DATA-17 a jak ho čte návštěvník z drobečkové navigace), může být správně Černý Důl. Jedno pole na obě otázky odpovědět nemůže a tady se ten rozdíl neláme v teorii, ale na konkrétním objektu: obě odpovědi jsou obhajitelné a přitom různé. Tohle patří do rozhodnutí o sémantice, ne do dohledávání hodnot.
  DATA-15 (jazykový audit 25. 7. 2026, třetí dávka): opraveny čtyři vady. (1) zajimavosti[0] tvrdila, že bouda „nabízí výrobky z místní produkce", a připisovala to webu — overeniSluzby ale z webu cituje jen „eko farma, vířivka"; tvrzení zúženo na doloženou farmu, stejně tak v text[2], kde je nově přiznáno, že prodej výrobků doložený nemáme. Pole zdroj u té položky navíc neslo holou URL místo jména pramene — sjednoceno s domácím stylem. (2) Próza i pole otviraciDoba tvrdily, že restaurace má otevřeno „denně", ač citace webu v overeniObcerstveni nese jen „10:30–17:00, přístupné i neubytovaným" — slovo odstraněno z obou míst a nedoloženost přiznána; rozpor mezi polem a citací tím padá (byl navržen jako položka do BACKLOGu, řeší se rovnou). (3) Perex uváděl výšku 1 102 m bez připsání, ač jde o údaj z OpenStreetMap, který provozovatel sám nenese (text[0] to přiznává) — připsáno i v perexu. (4) Perex nesl „rodinný provoz od roku 1996" jako holé konstatování — připsáno webu boudy.
  ZAMÍTNUTO jako nedorozumění auditu: Wikimedia Commons nechybí ve zdroje[] — fotky[] mají vlastní blok overeni se zdrojem, licencí i autorem a stejně to má i dvorska-bouda, která Commons ve zdroje[] rovněž nevede. Zamítnuto i „na hřebeni Liščí hory" — na rozdíl od ostatních profilů této dávky tady polohu na hřebeni cituje overeniLokace přímo z webu boudy, tvrzení tedy doložené je.