# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská bouda s eko farmou na hřebeni Liščí hory nad Pecí pod Sněžkou. Výšku
  1 102 m nese OpenStreetMap, provozovatel ji sám neuvádí. Vlastní restaurace
  s tradiční krkonošskou kuchyní je podle webu boudy přístupná i kolemjdoucím
  turistům; boudu tatáž rodina provozuje od roku 1996.
text:
  - >-
    Lesní bouda stojí na hřebeni Liščí hory v katastru Pece pod Sněžkou.
    Polohu na hřebeni popisuje web boudy, nadmořskou výšku 1 102 metrů
    přebíráme z OpenStreetMap — provozovatel ji sám neuvádí.
  - >-
    Doložená historie je krátká. Podle vlastního webu provozuje boudu současná
    rodina od roku 1996, starší osudy stavby zatím doložené nemáme.
  - >-
    Vlastní restaurace vaří podle webu boudy tradiční krkonošskou kuchyni a má
    otevřeno od půl jedenácté do pěti odpoledne; najíst se tu může i turista,
    který na boudě nespí. Jestli má otevřeno každý den, už web neříká.
    K hospodářství patří vlastní ekologická farma; zda z ní bouda nabízí
    i výrobky na prodej, doložené nemáme. Přespat lze v pokojích, které web
    popisuje jako komfortní a útulné, vhodné pro rodiny, jednotlivce,
    skupiny i kolektivy; počet lůžek ani jednotlivé kategorie pokojů
    provozovatel neuvádí, takže je neuvádíme ani my. Z dalšího vybavení web
    zmiňuje vířivku.
  - >-
    Údaje na této stránce pocházejí z webu boudy a z OpenStreetMap a redakce
    je zatím neověřila vlastním dotazem ani návštěvou. Doloženou nemáme
    kapacitu, provozní sezónu ani přístupové trasy — ani to, kam až se dá
    dojet autem. Před cestou proto doporučujeme ověřit si otvírací dobu
    restaurace a možnosti ubytování přímo u provozovatele.
