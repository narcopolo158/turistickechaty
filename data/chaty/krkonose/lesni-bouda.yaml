# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská bouda s eko farmou vysoko nad Pecí pod Sněžkou, v sedle mezi Liščí
  a Černou horou. Výšku 1 102 m nese OpenStreetMap, provozovatel ji sám
  neuvádí — a stejně tak neuvádí adresu, takže pod kterou obec bouda spadá,
  se prameny neshodnou. Vlastní restaurace s tradiční krkonošskou kuchyní je přístupná i
  kolemjdoucím turistům; boudu tatáž rodina
  provozuje od roku 1996.
text:
  - >-
    Lesní bouda stojí vysoko nad Pecí pod Sněžkou, na plochém sedle mezi
    Liščí a Černou horou — tak její polohu popisuje turistický server
    Českéhory; vlastní web boudy mluví jen obecně o hřebenech Krkonoš.
    Nadmořskou výšku 1 102 metrů přebíráme z OpenStreetMap, provozovatel ji
    sám neuvádí.
  - >-
    Pod kterou obec bouda spadá, jsme nerozhodli, protože se na tom prameny
    neshodnou. Web boudy neuvádí adresu vůbec; píše jen, že bouda leží nad
    Pecí pod Sněžkou, a to je popis polohy vůči obci, ne přihlášení k ní —
    dřív jsme z něj četli víc, než unese, a tuhle stránku jsme kvůli tomu
    opravili. Prameny, které adresu skutečně nesou, ji naopak kladou do
    Černého Dolu: shodně tak činí portál Královéhradeckého kraje i firemní
    katalogy. Ty ovšem čerpají z rejstříku, a ten vede sídlo provozovatele,
    což nemusí být totéž co obec, ve které stavba stojí. Regionální ubytovací
    server pro jistotu uvádí obě jména vedle sebe. Ponecháváme zatím Pec pod
    Sněžkou, ke které boudu poutá i popis přístupu, ověřené to ale není ani
    na jedné straně; rozhodnout to může až obecní úřad nebo registr územní
    identifikace, a na ty se teprve chystáme.
  - >-
    S tím souvisí past, do které se dá snadno spadnout. U boudy se
    v ubytovacích přehledech objevují tři jména obcí pohromadě — Pec pod
    Sněžkou, Černý Důl a Dolní Dvůr — a vypadá to jako tři různé adresy.
    Nejsou to adresy, nýbrž příjezdy: podle popisu na turistickém serveru se
    k boudě dá po zakoupení povolení ke vjezdu do národního parku vyjet autem
    ze všech tří míst, kdežto pěšky sem z Pece pod Sněžkou vede žlutá značka
    dlouhá zhruba tři kilometry.
  - >-
    Doložená historie je krátká. Podle vlastního webu provozuje boudu současná
    rodina od roku 1996, starší osudy stavby zatím doložené nemáme.
  - >-
    Vlastní restaurace vaří tradiční krkonošskou kuchyni a má
    otevřeno od půl jedenácté do pěti odpoledne; najíst se tu může i turista,
    který na boudě nespí. Jestli má otevřeno každý den, už web neříká.
    K hospodářství patří vlastní ekologická farma; zda z ní bouda nabízí
    i výrobky na prodej, doložené nemáme. Přespat lze v pokojích, které web
    popisuje jako komfortní a útulné, vhodné pro rodiny, jednotlivce,
    skupiny i kolektivy; počet lůžek ani jednotlivé kategorie pokojů
    provozovatel neuvádí, takže je neuvádíme ani my. Z dalšího vybavení web
    zmiňuje vířivku.
  - >-
    Údaje na této stránce pocházejí z webu boudy, z ubytovacích přehledů
    a z OpenStreetMap a redakce je zatím neověřila vlastním dotazem ani
    návštěvou. Doloženou nemáme kapacitu ani provozní sezónu a nevíme, za
    jakých podmínek se povolení ke vjezdu vydává. Před cestou proto
    doporučujeme ověřit si otvírací dobu restaurace a možnosti ubytování
    přímo u provozovatele.
