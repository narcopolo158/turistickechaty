# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata ve výšce 1 127 m n. m. na Bobích loukách mezi Kolínskou a
  Pražskou boudou u Pece pod Sněžkou. Údaje o provozu pocházejí z roku
  2019 a web chaty je nedostupný — aktuální stav před cestou ověřte.
text:
  - >-
    Horská chata Krakonoš stojí ve výšce 1 127 m n. m. mezi Kolínskou a
    Pražskou boudou — průvodce treking.cz lokalitu uvádí jako Bobí louky
    u Pece pod Sněžkou, popisy fotografií na Wikimedia Commons jako
    Lučiny. Podle treking.cz chata nabízela restauraci, bar a salónek
    a 54 lůžek ve tří- až pětilůžkových pokojích.
  - >-
    Poctivé upozornění: popis vychází ze stránky naposledy aktualizované
    v listopadu 2019 a web chaty uvedený v OpenStreetMap už neexistuje.
    Existenci budovy dokládají fotografie z května 2023, aktuální provoz
    a kontakty se nám ale zatím doložit nepodařilo — před cestou si je
    ověřte a s chatou nepočítejte najisto.
