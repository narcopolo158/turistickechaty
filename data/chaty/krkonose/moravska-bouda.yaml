# ── Přístup ───────────────────────────────────────────────────────────────
autem: |-
  V zimě není možné parkovat u objektu — parkuje se u Špindlerovy boudy nebo na
  P3 u Medvědína a bouda zajišťuje přepravu osob a zavazadel sněžným skútrem či
  rolbou (dle Českých hor, archivní prezentace, neověřeno).

# ── Historie ──────────────────────────────────────────────────────────────
# DATA-21 (26. 7. 2026): rokVzniku DOPLNĚN na 1876. Dosud byl vědomě prázdný,
# protože jediný tehdejší pramen (Kudy z nudy) měl jen „první polovina
# 19. století". Web boudy je nově ze sandboxu dosažitelný a rok 1876 nese;
# nezávisle ho má i Poznej domy, a to s vlastní etymologií jména. POZOR: rok
# 1876 si NEODPORUJE s „první polovinou 19. století" jen tehdy, když přístřešek
# předcházel boudě — to ale žádný pramen neříká. Rozpor přiznán v próze.
rokVzniku: 1876
milniky:
  - udalost: >-
      První polovina 19. století — na místě stojí jednoduchý přístřešek, z něhož
      se vyvinula dnešní bouda
  - rok: 1876
    udalost: >-
      Rodina Erlebachů zde postavila dřevěnou boudu Daftebaude; jméno vzniklo
      zkomolením názvu enklávy Davidbauden podle níže položené Davidovy boudy
  - udalost: >-
      Za druhé světové války sloužila bouda i k ubytování německých vojáků; po
      válce byla přejmenována na Moravskou boudu
  - rok: 1982
    udalost: >-
      Natáčely se tu interiérové scény filmové komedie Sněženky a machři
  - rok: 1994
    udalost: Boudu získal současný majitel
overeniHistorie:
  source: >-
    Kudy z nudy „Moravská bouda ve Špindlerově Mlýně": historie sahá do první
    poloviny 19. století (původně jednoduchý přístřešek), za války sloužila k
    ubytování německých vojáků, po válce přejmenována na Moravskou boudu,
    současný majitel ji vlastní od roku 1994; roku 1982 zde vznikly interiérové
    scény filmu Sněženky a machři. DOPLNĚNO 26. 7. 2026 (DATA-21): rok 1876
    a stavebníky nese web boudy https://moravskabouda.cz/cs — v sekci historie
    pod mezititulkem „1876" doslova „Rodina Erlebachových zde postavila
    dřevěnou boudu ‚Daftebaude', která poskytovala ubytování a občerstvení
    poutníkům a turistům"; nezávisle Poznej domy
    https://poznejdomy.cz/domy/detail/620-moravska-bouda: „S příchodem prvních
    turistů vycítili zdejší pachtýři Erlebachové možnost přilepšení a zbudovali
    tu roku 1876 boudu (Daftebaude), která tu od té doby hraje prim (dnešní
    Moravská bouda)" a k původu jména „Jméno boudy Daftebaude přímo souvisí
    s o něco níže položenou Davidovou boudou, podle které se celá enkláva
    jmenovala (Davidbauden). Komolením názvu enklávy vzniklo Daftebaude".
    VÝHRADA K SÍLE PRAMENE: týž provozovatel (Nord baude s.r.o.) vede pod
    stejným sloganem „Ubytování v Krkonoších s tradicí od 1876" i sesterskou
    Dvořákovu boudu https://dvorakovabouda.cz/en, kde stejný letopočet stojí
    jako „Birth of mountain lodge" u téže rodiny Erlebachů — web boudy tedy
    sám o sobě rok 1876 pro TENHLE objekt nerozhoduje, protože jde o text
    sdílený mezi objekty skupiny. Rok drží až Poznej domy, které ho vážou
    konkrétně k Moravské boudě a doprovázejí ho etymologií jména. Rozpor
    s „první polovinou 19. století" z Kudy z nudy nerozhodnut a přiznán
    v próze. Sekundární média, verified:false — ověřit primárním pramenem
  verified: false
  checked: '2026-07-26'

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda v Sedmidolí nad Špindlerovým Mlýnem, kterou Erlebachové postavili roku
  1876 pod jménem Daftebaude. Nadmořskou výšku uvádějí prameny rozdílně —
  1 225, nebo 1 220 metrů; kapacitu 52 lůžek ve čtrnácti pokojích potvrzuje
  proti odchylnému údaji web boudy. V zimě podle Českých hor hosty vozí rolba
  nebo sněžný skútr. V roce 1982 se tu natáčely interiéry Sněženek a machrů.
text:
  - >-
    Moravská bouda stojí v Sedmidolí nad Špindlerovým Mlýnem, kam patří i
    adresou. O nadmořské výšce se prameny neshodnou: Kudy z nudy uvádí 1 225
    metrů, shodně s údajem vyrytým na turistické známce, zatímco archivní
    prezentace na Českých horách má o pět metrů méně, tedy 1 220 metrů.
  - >-
    Za rok vzniku se dnes uvádí 1876, kdy tu zdejší pachtýři Erlebachové postavili dřevěnou boudu jménem Daftebaude. To jméno
    má hezký původ: celá enkláva se podle níže položené Davidovy boudy
    jmenovala Davidbauden a zkomolením toho názvu vzniklo Daftebaude. Týž rok
    nese i web boudy. Uvádíme ho ale s výhradou hned dvojí. Za prvé si ne úplně
    sedí se starším údajem Kudy z nudy, podle nějž historie místa sahá do
    první poloviny 19. století, kdy tu stál jednoduchý přístřešek — obojí platí
    jen tehdy, když přístřešek boudě předcházel, a to žádný z pramenů neříká.
    Za druhé tentýž provozovatel používá slogan o tradici od roku 1876 i pro
    sesterskou Dvořákovu boudu a připisuje ho tam téže rodině, takže web boudy
    sám o sobě letopočet pro tenhle dům nerozhoduje; váže ho k němu až Poznej
    domy.
  - >-
    Za druhé světové války sloužil dům mimo jiné k ubytování německých vojáků
    a po válce dostal jméno Moravská bouda. V roce 1982 se tu natáčely
    interiérové scény filmové komedie Sněženky a machři. Současný majitel
    boudu vlastní od roku 1994.
  - >-
    Ubytování je rozděleno do čtrnácti pokojů. Kudy z nudy v nich napočítá 52
    lůžek, archivní prezentace na Českých horách jich ve stejném počtu pokojů
    uvádí 54; rozdíl se nám podařilo rozhodnout, protože web boudy uvádí
    52 lůžek ve čtrnácti pokojích s dispozicemi od dvou do šesti lůžek. Držíme
    se tedy padesáti dvou. Pokoje jsou dvoulůžkové až
    vícelůžkové a všechny mají stejný standard: sprchový kout, umyvadlo a
    televizi, toalety jsou společné na patře. Podle Českých hor je u boudy
    restaurace se salonkem, kulečníkem a šipkami, půjčují se tu společenské
    hry a pobyt se psem je možný.
  - >-
    V zimě se u objektu neparkuje. Auto zůstává podle archivní prezentace na
    Českých horách u Špindlerovy boudy nebo na parkovišti P3 u Medvědína
    a hosty i se zavazadly doveze sněžný skútr nebo rolba, které bouda
    zajišťuje. Jaký je v zimě stav příjezdové cesty, dosažitelné zdroje
    neuvádějí.
  - >-
    Celoroční provoz uvádějí opět jen České hory, Kudy z nudy o sezóně mlčí.
    Nejméně jistá je podoba stravování: restauraci zmiňuje pouze archivní
    prezentace, Kudy z nudy ji vůbec nepopisuje, otvírací dobu nenese ani
    jeden ze zdrojů a nikde není řečeno, zda restaurace obslouží i
    kolemjdoucí, kteří tu nespí. Všechny údaje na této stránce pocházejí ze
    sekundárních médií a redakce je zatím neověřila vlastním dotazem ani
    návštěvou. Před cestou proto doporučujeme ověřit přímo u boudy, jestli je
    restaurace otevřená veřejnosti, i kapacitu a aktuální režim.

