    url: https://www.openstreetmap.org/way/31126083
  - popis: >-
      Katalog turistických známek (Turistické známky s.r.o.) — známka č. 1873
      „Moravská bouda, Krkonoše", vedená v oficiálním seznamu vydavatele;
      číslo ověřené z fyzické známky, rytina nese výšku 1 225 m. Odkaz na
      detail je sestaven podle vzoru webu a klikem neověřený. verified:false
    url: https://www.turisticke-znamky.cz/znamky/moravska-bouda-c1873
interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/moravska-bouda.yaml (OSM way/31126083,
  DATA-01) v rámci master fronty Tier 1 (známka č.1873 + OSM). Kandidát čekal na
  „otevření webu" — místo toho doloženo přes Kudy z nudy a České hory; vlastní
  web moravskabouda.cz zůstává ze sandboxu nedostupný.

  Zaznamenané rozpory k dořešení při DATA-04: (1) výška 1 225 m (Kudy z nudy +
  rytina známky č.1873) vs. 1 220 m (České hory, archiv) — vzato 1 225;
  (2) kapacita 52 lůžek ve 14 pokojích (Kudy z nudy) vs. 54 lůžek ve 14 pokojích
  (České hory, archiv) — vzato 52.

  ⚠ Klíč zařazení — SLABÉ DOLOŽENÍ: restauraci u boudy uvádějí jen České hory, a
  to v archivní prezentaci; Kudy z nudy stravování vůbec nepopisuje a otvírací
  dobu nenese ani jeden zdroj. Veřejná přístupnost občerstvení tedy zatím NENÍ
  doložena — pokud se při DATA-04 ukáže, že bouda vaří jen ubytovaným, objekt
  Michalův klíč nesplňuje a profil je třeba přehodnotit.

  rokVzniku vědomě NEvyplněn — zdroj má jen „první polovina 19. století"; do
  `milniky` proto zapsán milník bez roku (pole `rok` není povinné, precedens:
  tetrevi-boudy).

  Wi-Fi, platba kartou a lyžárna: zdroje neuvádějí — pole vědomě nevyplněna.

  K dotažení (DATA-04, verified:true): veřejná přístupnost a otvírací doba
  restaurace (priorita — klíč zařazení), potvrdit výšku a kapacitu, rok vzniku,
  sezónní režim. Hero fotka: kandidáti DATA-02. Známka č.1873 — obrázek
  připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c1873-moravska-bouda.png.
