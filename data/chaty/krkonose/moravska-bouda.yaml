# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda v Sedmidolí nad Špindlerovým Mlýnem, jejíž historie sahá podle Kudy
  z nudy do první poloviny 19. století. Nadmořskou výšku i kapacitu uvádějí
  prameny rozdílně — 1 225, nebo 1 220 metrů a 52, nebo 54 lůžek ve čtrnácti
  pokojích. V zimě podle Českých hor hosty vozí rolba nebo sněžný skútr.
  V roce 1982 se tu natáčely interiéry Sněženek a machrů.
text:
  - >-
    Moravská bouda stojí v Sedmidolí nad Špindlerovým Mlýnem, kam patří i
    adresou. O nadmořské výšce se prameny neshodnou: Kudy z nudy uvádí 1 225
    metrů, shodně s údajem vyrytým na turistické známce, zatímco archivní
    prezentace na Českých horách má o pět metrů méně, tedy 1 220 metrů.
  - >-
    Historie místa sahá podle Kudy z nudy do první poloviny 19. století, kdy
    tu stál jednoduchý přístřešek, z něhož se dnešní bouda postupně vyvinula;
    konkrétní rok vzniku zdroj neuvádí. Za druhé světové války sloužil dům
    mimo jiné k ubytování německých vojáků a po válce dostal jméno Moravská
    bouda. V roce 1982 se tu natáčely interiérové scény filmové komedie
    Sněženky a machři. Současný majitel boudu vlastní od roku 1994.
  - >-
    Ubytování je rozděleno do čtrnácti pokojů. Kudy z nudy v nich napočítá 52
    lůžek, archivní prezentace na Českých horách jich ve stejném počtu pokojů
    uvádí 54 a rozdíl zůstává neověřený. Pokoje jsou dvoulůžkové až
    vícelůžkové a všechny mají stejný standard: sprchový kout, umyvadlo a
    televizi, toalety jsou společné na patře. Podle Českých hor je u boudy
    restaurace se salonkem, kulečníkem a šipkami, půjčují se tu společenské
    hry a pobyt se psem je možný.
  - >-
    V zimě se u objektu neparkuje. Auto zůstává podle archivní prezentace na
    Českých horách u Špindlerovy boudy nebo na parkovišti P3 u Medvědína
    a hosty i se zavazadly doveze sněžný skútr nebo rolba, které bouda
    zajišťuje. Jaký je v zimě stav příjezdové cesty, dosažitelné zdroje
    neuvádějí.
  - >-
    Celoroční provoz uvádějí opět jen České hory, Kudy z nudy o sezóně mlčí.
    Nejméně jistá je podoba stravování: restauraci zmiňuje pouze archivní
    prezentace, Kudy z nudy ji vůbec nepopisuje, otvírací dobu nenese ani
    jeden ze zdrojů a nikde není řečeno, zda restaurace obslouží i
    kolemjdoucí, kteří tu nespí. Všechny údaje na této stránce pocházejí ze
    sekundárních médií a redakce je zatím neověřila vlastním dotazem ani
    návštěvou. Před cestou proto doporučujeme ověřit přímo u boudy, jestli je
    restaurace otevřená veřejnosti, i kapacitu a aktuální režim.
zdroje:
