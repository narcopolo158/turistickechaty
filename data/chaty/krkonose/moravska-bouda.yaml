# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda v Sedmidolí nad Špindlerovým Mlýnem (1 225 m), jejíž historie sahá do
  první poloviny 19. století. Ubytuje 52 hostů ve čtrnácti pokojích, v zimě k ní
  hosty vozí rolba. V roce 1982 se tu natáčely interiéry Sněženek a machrů. Nese
  turistickou známku č. 1873.
text:
  - >-
    Moravská bouda stojí ve výšce 1 225 m n. m. v Sedmidolí nad Špindlerovým
    Mlýnem (adresa Špindlerův Mlýn 90). Historie místa sahá do první poloviny
    19. století, kdy tu stál jednoduchý přístřešek; za druhé světové války
    sloužila bouda i k ubytování německých vojáků a po válce dostala dnešní
    jméno. Současný majitel ji vlastní od roku 1994.
  - >-
    Ubytování nabízí 52 lůžek ve čtrnácti pokojích — od dvoulůžkových po
    vícelůžkové, všechny ve stejném standardu se sprchovým koutem, umyvadlem a
    televizí; WC jsou společná na patře. K vybavení patří salonek s kulečníkem a
    šipkami, pobyt se psem je možný.
  - >-
    V zimě se k boudě nedá dojet autem: parkuje se u Špindlerovy boudy nebo na
    parkovišti P3 u Medvědína a hosty i se zavazadly doveze sněžný skútr nebo
    rolba. V roce 1982 se tu natáčely interiérové scény filmové komedie Sněženky
    a machři.
  - >-
    Údaje pocházejí ze sekundárních zdrojů, z toho prezentace na Českých horách
    je archivní — kapacitu, ceny i to, zda je restaurace otevřená kolemjdoucím,
    ověřte přímo u boudy.
zdroje:
  - popis: >-
      Kudy z nudy — „Moravská bouda ve Špindlerově Mlýně" (výška, adresa,
      kapacita a pokoje, kontakty, historie, natáčení Sněženek a machrů);
      sekundární médium, verified:false, ověřit primárně
    url: https://www.kudyznudy.cz/aktivity/moravska-bouda-ve-spindlerove-mlyne
  - popis: >-
      České hory — „Moravská Bouda" (lokalita Sedmidolí, restaurace, celoroční
      provoz, zimní přístup rolbou, pes); prezentace je archivní, sekundární
      médium, verified:false
    url: https://www.ceskehory.cz/ubytovani/moravska-bouda-spindleruv-mlyn.html
  - popis: >-
      OpenStreetMap way/31126083 — GPS; data © přispěvatelé OpenStreetMap,
      ODbL 1.0, stav dat 2026-06-12, verified:false
    url: https://www.openstreetmap.org/way/31126083
interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/moravska-bouda.yaml (OSM way/31126083,
  DATA-01) v rámci master fronty Tier 1 (známka č.1873 + OSM). Kandidát čekal na
  „otevření webu" — místo toho doloženo přes Kudy z nudy a České hory; vlastní
  web moravskabouda.cz zůstává ze sandboxu nedostupný.

  Zaznamenané rozpory k dořešení při DATA-04: (1) výška 1 225 m (Kudy z nudy +
  rytina známky č.1873) vs. 1 220 m (České hory, archiv) — vzato 1 225;
  (2) kapacita 52 lůžek ve 14 pokojích (Kudy z nudy) vs. 54 lůžek ve 14 pokojích
  (České hory, archiv) — vzato 52.

  ⚠ Klíč zařazení — SLABÉ DOLOŽENÍ: restauraci u boudy uvádějí jen České hory, a
  to v archivní prezentaci; Kudy z nudy stravování vůbec nepopisuje a otvírací
  dobu nenese ani jeden zdroj. Veřejná přístupnost občerstvení tedy zatím NENÍ
  doložena — pokud se při DATA-04 ukáže, že bouda vaří jen ubytovaným, objekt
  Michalův klíč nesplňuje a profil je třeba přehodnotit.

  rokVzniku vědomě NEvyplněn — zdroj má jen „první polovina 19. století"; do
  `milniky` proto zapsán milník bez roku (pole `rok` není povinné, precedens:
  tetrevi-boudy).

  Wi-Fi, platba kartou a lyžárna: zdroje neuvádějí — pole vědomě nevyplněna.

  K dotažení (DATA-04, verified:true): veřejná přístupnost a otvírací doba
  restaurace (priorita — klíč zařazení), potvrdit výšku a kapacitu, rok vzniku,
  sezónní režim. Hero fotka: kandidáti DATA-02. Známka č.1873 — obrázek
  připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c1873-moravska-bouda.png.
