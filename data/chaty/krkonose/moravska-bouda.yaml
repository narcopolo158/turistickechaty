interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/moravska-bouda.yaml (OSM way/31126083,
  DATA-01) v rámci master fronty Tier 1 (známka č.1873 + OSM). Kandidát čekal na
  „otevření webu" — místo toho doloženo přes Kudy z nudy a České hory; vlastní
  web moravskabouda.cz zůstává ze sandboxu nedostupný.

  Zaznamenané rozpory k dořešení při DATA-04: (1) výška 1 225 m (Kudy z nudy +
  rytina známky č.1873) vs. 1 220 m (České hory, archiv) — vzato 1 225;
  (2) kapacita 52 lůžek ve 14 pokojích (Kudy z nudy) vs. 54 lůžek ve 14 pokojích
  (České hory, archiv) — vzato 52.

  ⚠ Klíč zařazení — SLABÉ DOLOŽENÍ: restauraci u boudy uvádějí jen České hory, a
  to v archivní prezentaci; Kudy z nudy stravování vůbec nepopisuje a otvírací
  dobu nenese ani jeden zdroj. Veřejná přístupnost občerstvení tedy zatím NENÍ
  doložena — pokud se při DATA-04 ukáže, že bouda vaří jen ubytovaným, objekt
  Michalův klíč nesplňuje a profil je třeba přehodnotit.

  DATA-21 (26. 7. 2026) — rokVzniku DOPLNĚN 1876, jeden rozpor ROZHODNUT,
  změnil se stav dosažitelnosti webu. Katalogový údaj (rok 1876, pramen
  moravskabouda.cz) prošel kontrolou u svého vlastního pramene, a to poprvé:
  web boudy, dosud ze sandboxu nedostupný, se nově otevřel. Rok nese v sekci
  historie pod mezititulkem „1876". Nezávisle ho má Poznej domy, navíc
  s etymologií jména Daftebaude (zkomolenina enklávy Davidbauden podle níže
  položené Davidovy boudy) — to je detail, který se nedá převzít omylem,
  a proto ten pramen vážím výš než holý letopočet.
  DVĚ VÝHRADY, obě přiznané v próze. (1) Rok 1876 spadá do DRUHÉ poloviny
  19. století, kdežto Kudy z nudy vedou historii místa do PRVNÍ poloviny
  (jednoduchý přístřešek). Dá se to srovnat tak, že přístřešek boudě
  předcházel — ale to neříká ani jeden pramen, takže smíření nevydávám za
  doložené; obojí je v próze vedle sebe. (2) Web boudy NENÍ pro tenhle údaj
  tak silný, jak vypadá: provozovatel Nord baude s.r.o. vede pod stejným
  sloganem „Ubytování v Krkonoších s tradicí od 1876" i sesterskou Dvořákovu
  boudu (dvorakovabouda.cz), kde týž letopočet a táž rodina Erlebachů stojí
  jako „Birth of mountain lodge". Je to tedy text sdílený mezi objekty
  skupiny; kdybych měl jen web boudy, rok bych nezapsal. Zapisuji ho kvůli
  Poznej domy. Do DATA-04: zjistit, ke které budově enklávy se rok 1876
  doopravdy váže — Dvořákova bouda navíc ve své historii tvrdí, že to byla
  ONA, kdo dostal po válce od ROH jméno Moravská bouda, což se s naším
  profilem kříží a rozřešené to nemám.
  VEDLEJŠÍ ZISK z téhož načtení: web boudy uvádí „Celková kapacita chaty je
  52 lůžek ve 14 pokojích s dispozicemi od 2 do 6 lůžek", čímž rozhoduje
  zapsaný rozpor (2) níže ve prospěch 52 proti 54 z Českých hor. Hodnota
  v profilu se nemění, jen nově stojí na primárnějším prameni; verified
