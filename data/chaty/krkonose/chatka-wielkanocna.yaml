# ROZPOR SPRÁVCE/KLÍČŮ přiznán: Poznański Klub Wysokogórski (dva prameny)
# × „klíč má paní v Jagniątkowě a je třeba souhlas KPN" (jeden pramen).
overeniProvoz:
  source: >-
    blog Wyszedł z domu (otevřeno 27. 7. 2026), doslova: chatky „są
    zamykane na siedem spustów"; „Wielkanocną opiekuje się Poznański
    Klub Wysokogórski co czyni ją również ZAMKNIĘTĄ dla ludzi
    z zewnątrz. Nie można po prostu przyjść i z niej skorzystać";
    „Klucze do chatki można uzyskać za zgodą opiekunów z Poznania."
    Shodně nocpodgwiazdami.pl: „Chatka jest zamknięta i bez kluczy nie
    można się tu dostać." ROZPOR: průvodce jagodowadolina.pl (otevřeno
    27. 7. 2026): „klucz do Chatki ma pewna Pani w Jagniątkowie i trzeba
    mieć zgodę KPN-u" — kdo klíče drží, prameny neshodně; nerozhodujeme.
    Vlastním dotazem neověřeno.
  verified: false
  checked: '2026-07-27'

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Jednoizbový srub s plochou střechou u vyústění Velkého Sněžného kotle,
  ve výšce kolem 1250 metrů mimo značené cesty. Postaven byl v roce 1966
  jako základna výzkumníků a horolezců a jméno mu daly Velikonoce 1967,
  které tu parta z vratislavského AKT strávila ve spartánských
  podmínkách. Dnes je zamčený — bez klíčů od správců se dovnitř nedá.
text:
  - >-
    Chatka Wielkanocna — velikonoční chatka — stojí u vyústění Velkého
    Sněžného kotle (Wielki Śnieżny Kocioł), zhruba sto metrů od zeleně
    značené cesty a blízko horní hranice lesa, kolem 1250 metrů. Je to
    jednoizbový srub s plochou střechou a kamenným komínem, postavený
    v létě 1966 — podle blogu v době glaciologických výzkumů v karech,
    podle přehledu jako základna horolezců, kteří v Sněžných kotlích
    trénovali.
  - >-
    Jméno má z příběhu: o Velikonocích 1967 tu parta členů
    vratislavského Akademického turistického klubu strávila svátky ve
    spartánských podmínkách — druhá skupina tehdy ani nedorazila a po
    noci ve sněhu se vrátila do Jagniątkowa — a mezi štamgasty se ujalo
    jméno Chatka Wielkanocna. Pamětník vzniku vzpomíná, jak název vepsal
    do kroniky, obyčejného sešitu v kostce.
  - >-
    Dnešní režim říkáme nahlas: chatka je zamčená „na sedm západů"
    a bez klíčů se dovnitř nedá. O tom, kdo klíče drží, se prameny
    neshodnou — dva uvádějí poznaňský vysokohorský klub, jeden paní
    v Jagniątkowě se souhlasem národního parku — a my mezi nimi
    nerozhodujeme. Uvnitř čeká krb, pryčny a stará matracová pohoda
    zhruba pro osm lidí; plánovat sem nocleh ale bez domluvy se správci
    nelze.
  - >-
    Údaje pocházejí z polských blogů, přehledů a místopisného webu;
    vlastním dotazem jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

