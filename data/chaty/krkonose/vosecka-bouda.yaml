interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/vosecka-bouda.yaml (DATA-01) po křížovém ověření DATA-03 a schválení Michala (chat 20. 7. 2026, kategorie ✅). KČT ji řadí mezi „12 nejlepších horských chat v Krkonoších".
  Občerstvení: web gastronomii pro veřejnost výslovně nepopisuje — kuchyne proto NEvyplněno (nedomýšlet). Doložit při telefonickém ověření (DATA-04).
  Kapacita lůžek: zapsáno 43 (voseckabouda.cz/ubytovani, DATA-09); zdrojový průzkum 2026-07-22 hlásí rozpor — Seznam Zprávy 43, Krkonose.eu 42. Prověřit primárně (DATA-04). Ceny na webu neuvedeny.
  Sezónnost je i údaj pro DATA-04 (aktualizovat rok co rok).
  Vetkáno DATA-12 (zdrojový průzkum 2026-07-22): milník 1900, historické názvy Česká nová/Františkánská, fotovoltaika (projektový předpoklad). Vše verified:false.
  DATA-15 (jazykový audit 25. 7. 2026, čtvrtá dávka): opraveno šest vad, všechny nálezy auditu přijaty. (1) text[3] rozpor v počtu lůžek tiše řešil: publikoval „Seznam Zprávy 43, Krkonose.eu 42" a mlčel o tom, že sami vedeme 43 a že katalogový podklad DATA-08 uvádí 37 — tedy třetí hodnotu, o níž komentář u pole kapacita ví. Konvence B žádá rozpor přiznat celý, ne po částech; próza teď jmenuje všechna tři čísla a přiznává, že naše číslo je taky z druhé ruky. (2) text[1] připisoval srovnání „na rozdíl od řady jiných krkonošských bud" webu boudy — ten podle overeniHistorie tvrdí jen „nikdy nevyhořela", srovnání s ostatními boudami nese FACT-0062 z destinačního profilu Krkonose.eu. Přesunuto k prameni, který to skutečně říká. (3) text[1] uváděl historické názvy slovy „ve starších pramenech se objevuje" — žádné starší prameny jsme nečetli, oba názvy stojí na jediném sekundárním médiu ze zdrojového průzkumu 2026-07-22. Formulace vymýšlela původ; nahrazena prostým „dřív nesla jména". (4) zdroje neměly položku pro externí katalog, přestože z něj pochází hodnota kapacity i citace webu k noclehu (viz komentář u pole kapacita) — doplněna položka bez url podle precedentu evidenční hygieny ze třetí dávky (schema: popis povinný, url volitelné). (5) text[4] tvrdil paušálně, že se občerstvení „z dostupných pramenů doložit nepodařilo", ač FACT-0066 nese kuchyni i její otvírací dobu z Krkonose.eu — nepravdivé o vlastní evidenci. Přeformulováno tak, že web mlčí, sekundární prameny kuchyni mají, a otvírací dobu nepublikujeme kvůli proměnlivosti, ne kvůli neexistenci. (6) komentář u pole kapacita a perex: citace voseckabouda.cz/ubytovani není naše čtení (naše čtení webu 20. 7. 2026 kapacitu nenašlo, viz overeniNocleh) a perexové „jako jedna z mála krkonošských bud nikdy nevyhořela" hlásilo srovnání jako vlastní zjištění — obojí opatřeno původem. ZAMÍTNUTO po druhém čtení: připsání OpenStreetMap ve veřejné próze tu chybět může, protože z OSM pochází jen souřadnice (ty se nepublikují) — korpus žádá připsání v próze tam, kde z OSM plyne výška nebo zařazení objektu, což není tenhle případ, a ODbL je vypořádána v overeniLokace i v zdroje. „Podle serveru Krkonose.eu" není skloňovaná doména (kontrola C = 0), governující podstatné jméno drží doménu v nominativu. Slovo „redakce" mimo závěrečný odstavec je tu v pořádku, protože stojí právě ve větě přiznávající rozpor pramenů. rokVzniku: 1743 proti prozaickému „před rokem 1743" není vada dat, ale mez schématu (pole nese jedno číslo) — hedge nese komentář pole, milník i próza. zajimavosti[1] není duplikát třídy 10: opakuje sice letopočty z milníků, ale všechny jsou doložené a položka je zdrojovaná, takže po odečtení polí zbývá shrnutí, ne prázdno. Pravidlo třídy 6 (světové strany) nespouští: „v západní části pohoří" stojí doslova v overeniLokace.source („západní Krkonoše, 1. zóna KRNAP").