# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Sezónní horská bouda v 1. zóně KRNAP v západních Krkonoších (1 260 m),
  8 km od Harrachova. Historie sahá před rok 1743, turistům slouží od roku
  1896 — a jako jedna z mála krkonošských bud nikdy nevyhořela.
text:
  - >-
    Vosecká bouda stojí ve výšce 1 260 m n. m. v první zóně Krkonošského
    národního parku, v západní části pohoří nad Harrachovem. Vznikla před
    rokem 1743 jako seník a od roku 1896 slouží turistům; dnešní podobu
    získala po druhé světové válce a je unikátní tím, že nikdy nevyhořela.
  - >-
    Bouda není napojena na elektrickou síť — energii si vyrábí vlastním
    dieselagregátem, což podtrhuje její odlehlý hřebenový charakter. Provoz
    je sezónní; pro rok 2026 web uvádí otevřeno od 1. června do 28. října.
    Přístupová cesta od Harrachova měří zhruba 8 kilometrů.
