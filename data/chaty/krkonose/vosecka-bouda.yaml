# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Sezónní horská bouda v 1. zóně KRNAP v západních Krkonoších (1 260 m),
  8 km od Harrachova. Historie sahá před rok 1743, turistům slouží od roku
  1896 — a jako jedna z mála krkonošských bud nikdy nevyhořela.
text:
  - >-
    Vosecká bouda stojí ve výšce 1 260 m n. m. v první zóně Krkonošského
    národního parku, v západní části pohoří. Nejbližší obcí pod ní je
    Harrachov, od kterého k boudě vede zhruba osmikilometrová přístupová
    cesta.
  - >-
    Počátky objektu sahají před rok 1743, kdy tu stál seník; turistům bouda
    slouží od roku 1896. Podle Krkonose.eu, tedy sekundárního média, byla
    kolem roku 1900 přestavěna a rozšířena a ve starších pramenech se objevuje
    pod jmény Česká nová a Františkánská. Dnešní ráz získala až po druhé
    světové válce a web boudy uvádí, že nikdy nevyhořela — na rozdíl od řady
    jiných krkonošských bud.
  - >-
    Bouda není napojena na elektrickou rozvodnou síť — proud si vyrábí
    vlastním dieselagregátem. Časopis Turista psal o chystaném přechodu na
    fotovoltaiku o výkonu 12,74 kWp s bateriovým úložištěm o kapacitě
    70,4 kWh; roční úspora zhruba 11,5 tuny oxidu uhličitého, kterou článek
    uvádí, je projektový předpoklad před vyhodnocením zkušebního provozu, ne
    změřený výsledek.
  - >-
    Ubytování se rezervuje přes formulář na webu boudy, typy pokojů tam ale
    uvedené nejsou. V počtu lůžek se prameny rozcházejí: Seznam Zprávy uvádějí
    43 lůžek, Krkonose.eu 42 — obojí jsou sekundární média a redakce údaj
    zatím neověřila. Provoz je sezónní, pro rok 2026 web ohlašuje otevřeno od
    1. června do 28. října.
  - >-
    Jaké občerstvení bouda nabízí a jaké další zázemí mají hosté k dispozici,
    se nám z dostupných pramenů doložit nepodařilo. Před cestou proto
    doporučujeme ověřit si přímo u boudy volnou kapacitu i aktuální otvírací
    dobu.
