# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Sezónní horská bouda v 1. zóně KRNAP v západních Krkonoších (1 260 m),
  8 km od Harrachova. Historie sahá před rok 1743, turistům slouží od roku 1896 a podle vlastních
  slov nikdy nevyhořela.
text:
  - >-
    Vosecká bouda stojí ve výšce 1 260 m n. m. v první zóně Krkonošského
    národního parku, v západní části pohoří. Nejbližší obcí pod ní je
    Harrachov, od kterého k boudě vede zhruba osmikilometrová přístupová
    cesta.
  - >-
    Počátky objektu sahají před rok 1743, kdy tu stál seník; turistům bouda
    slouží od roku 1896. Podle sekundárního média byla kolem roku 1900 přestavěna a rozšířena,
    dřív nesla jména Česká nová a Františkánská a patří k nemnoha krkonošským
    boudám, které nikdy nevyhořely. Dnešní ráz získala až po druhé světové
    válce; že nikdy nevyhořela, říká o sobě i bouda sama.
  - >-
    Bouda není napojena na elektrickou rozvodnou síť — proud si vyrábí
    vlastním dieselagregátem. Časopis Turista psal o chystaném přechodu na
    fotovoltaiku o výkonu 12,74 kWp s bateriovým úložištěm o kapacitě
    70,4 kWh; roční úspora zhruba 11,5 tuny oxidu uhličitého, kterou článek
    uvádí, je projektový předpoklad před vyhodnocením zkušebního provozu, ne
    změřený výsledek.
  - >-
    Ubytování se rezervuje přes formulář na webu boudy, kapacita ani typy
    pokojů tam ale uvedené nejsou. V počtu lůžek se prameny rozcházejí:
    uvádíme 43 — stejné číslo nese jeden ze sekundárních pramenů, druhý jich
    počítá 42 a starší katalogový podklad 37. Všechno jsou prameny z druhé
    ruky a redakce žádné z těch čísel zatím neověřila. Provoz je sezónní, pro
    rok 2026 web ohlašuje otevřeno od 1. června do 28. října.
  - >-
    Web boudy nepopisuje, jaké občerstvení nabízí a jestli obslouží
    i kolemjdoucí, kteří tu nespí; sekundární prameny u ní kuchyni zmiňují
    a uvádějí i její otvírací dobu, tu ale neověřenou nepublikujeme, protože
    se mění. Jaké další zázemí mají hosté k dispozici, doložené nemáme. Před
    cestou proto doporučujeme ověřit si přímo u boudy volnou kapacitu
    i aktuální otvírací dobu.
