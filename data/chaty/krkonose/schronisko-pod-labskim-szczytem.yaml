interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/schronisko-pod-labskim-szczytem.yaml
  (DATA-01) po křížovém ověření DATA-03. Zdroj katalog schroniskaturystyczne.pl
  (pl.wikipedia se ze sandboxu nenačte — cache-only; oficiální stránka PTTK
  pttk.pl k dotažení kontaktů). Vše verified: false dle konvence B. Do DATA-04
  ověřit převzaté kontakty (telefon/e-mail/web pocházejí z kpn.gov.pl přes
  katalogový podklad, ne od schroniska), dotáhnout přesnou GPS, případně
  provázat sousedniChaty (Na Hali Szrenickiej, Szrenica). Vynechán vágní údaj
  „služby od 17. století" z katalogu — nedoložitelný, nezapisuje se.

  AUDIT 25. 7. 2026 (mechanická kontrola D — superlativ bez připsání): perex
  tvrdil „jedno z nejstarších a nejpůvabnějších hřebenových schronisk" a „je
  výborným východiskem". Ani jedno nenese žádný blok overeni — ty dokládají
  budovu z roku 1938 a PTTK od roku 1945 — a „nejstarší" navíc odporovalo
  vlastnímu text[1], který pečlivě rozlišuje kontinuitu místa od stáří stavby.
  Perex přepsán na doložená fakta; hodnotící „nejpůvabnějších" a „výborným"
  vypuštěny (estetický soud v našem hlase, ne převzaté tvrzení).

  KŘÍŽOVÝ ROZPOR (nalezen týmž auditem): profil strzecha-akademicka.yaml nese
  tvrzení provozovatele Strzechy, že Strzecha SPOLU s chatou Pod Łabskim
  Szczytem jsou nejstarší chaty v Krkonoších — kdežto tady vedeme budovu z roku
  1938. Rozpor NEROZHODNUT, nově přiznán ve veřejném text[1] a doplněn zdroj
  strzechaakademicka.pl/historia (redakcí NEOTEVŘENO, známe jen přes katalogový
  podklad). Otázka pro DATA-04 / dotaz na PTTK Jelenia Góra: co přesně se tím
  „nejstarší" myslí — stavba, nepřetržitá služba, nebo kontinuita místa?

  AUDIT 4. DÁVKA (DATA-15, 25. 7. 2026) — nezávislý agent vrátil osm nálezů,
  všech osm přijato, u jednoho upravena podoba léku. 1) „Denně" u bufetu
  vypuštěno z otviraciDoba i z text[2]: obě citace nesou jen hodiny
  8:00–20:00, frekvenci ani sezónu žádný pramen nedrží a text[4] přitom sám
  přiznává, že provozní sezónu doloženou nemáme. Hodiny samotné zůstávají —
  otviraciDoba je vyplněná ve dvaceti publikovaných profilech a v pěti stojí
  hodiny přímo v próze, plošný zákaz tedy neexistuje; vadné bylo to „denně".
  2) Strzecha Akademicka přestala být „sousední": ze souřadnic obou profilů
  vychází 12,77 km vzdušnou čarou, zatímco Szrenica je 1,7 km a Na Hali
  Szrenickiej 2,6 km — a týž text je o dva odstavce dál označuje za
  „nedaleko". Vazba mezi oběma chatami je věcná, ne zeměpisná. 3) Śnieżne
  Kotły odstraněny z perexu, z text[3] i z pole autem: v žádném bloku overeni
  ani v zdroje nejsou a spolu s nimi padl nedoložený geomorfologický soud
  „ledovcovým". 4) Závěrečný odstavec tvrdil, že stránka stojí na jediném
  katalogovém hesle a na OpenStreetMap; ve skutečnosti nese ještě větu
  Karkonoského národního parku o pastevecké boudě, tvrzení provozovatele
  Strzechy a od parku i kontaktní údaje. Odstavec teď jmenuje celou pramennou
  základnu. 5) „KPN uvádí" přeformulováno na „Karkonoski Park Narodowy podle
  katalogového podkladu uvádí … samotnou stránku parku jsme ale neotevřeli" —
  údaj přišel zprostředkovaně a podání z první ruky to zastíralo; totéž
  přiznání drží tentýž odstavec o čtyři věty dál u tvrzení o Strzeše, takže
  soubor si odporoval i v disciplíně. 6) Komentář „Kontakty katalog neuvádí →
  nevyplněno" stál proti třem vyplněným kontaktním polím; přepsán tak, aby
  řekl, odkud kontakty jsou, a položka DATA-04 změněna z „dotáhnout kontakty"
  na „ověřit převzaté kontakty". Týž zastaralý komentář nese i sourozenecký
  soubor schronisko-kamienczyk — zděděný artefakt dávky, ne originální chyba
  tohoto profilu. 7) Cizí tvrzení vráceno do plné síly: pramen podle
  strzecha-akademicka.yaml říká „za nejstarší chatu", próza z toho udělala
  „mezi nejstarší" a tím si změkčila vlastní rozpor s rokem 1938. 8) Vrchol
  měl v souboru dvě jména — Łabski Szczyt v názvu objektu, Łabski Wierch
  v próze převzaté z citace — a nikde nestálo, že jde o týž kopec. Agent tomu
  dal jistotu „nízká"; korpus ale ukázal, že tvar Wierch se nikde jinde než
  v tomhle jediném opisu nevyskytuje. Rozpor proto ve veřejné próze přiznán,
  ne potichu rozhodnut, a otázka na správný tvar jména vrcholu jde do DATA-04.

  ZAMÍTNUTO (agent si to zamítl sám, ověřeno proti souboru): „hřebenová chata"
  a „na horské louce … v hlavním hřebeni" nejsou nedoložený terén —
  overeniLokace.source je nese doslova. „Nad Szklarskou Porębou" plyne
  z doložené výšky a obce. „Katalogový profil" a „katalogový podklad"
  označují cizí katalogové heslo, ne naši stránku, a jsou doložený domácí
  styl. Prošlo i jméno pramene v prvním pádě, slovo „redakce" v závěrečném
  odstavci, nerozepsané zkratky PTTK a KPN, „38 lůžek" v perexu proti „38
  místům" v citaci a „bufet s teplou kuchyní". Absence světové strany je
  proti sourozeneckému profilu Na Hali Szrenickiej přednost, ne mezera.
