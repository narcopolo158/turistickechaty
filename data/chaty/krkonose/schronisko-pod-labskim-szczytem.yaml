# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Jedno z nejstarších a nejpůvabnějších hřebenových schronisk polských
  Krkonoš (1 168 m), dřevěná horská chata pod Łabským Wierzchem. Provozuje ho
  PTTK, nabízí 38 lůžek a bufet s teplou kuchyní — a je výborným východiskem
  k ledovcovým kotlům Śnieżne Kotły.
text:
  - >-
    Schronisko PTTK „Pod Łabskim Szczytem" stojí ve výšce 1 168 m na hali pod
    Łabským Wierzchem, v hlavním hřebeni Karkonoszů nad Szklarskou Porębou.
    Dřevěnou budovu na kamenné podezdívce postavila v roce 1938 německá
    turistická společnost; od roku 1945 schronisko provozuje PTTK.
  - >-
    Ubytování nabízí 38 lůžek v pokojích pro jednu až šest osob se společným
    sociálním zařízením, bufet vydává obědy, večeře a teplé nápoje denně od
    8 do 20 hodin. Autem se dojede do Szklarské Poręby, odkud ke schronisku
    vedou čtyři značené cesty (1–2 hodiny), další přicházejí z Jakuszyc a
    Jagniątkova. Je oblíbeným východiskem k ledovcovým kotlům Śnieżne Kotły
    a k sousedním schroniskům Na Hali Szrenickiej a Szrenica.
