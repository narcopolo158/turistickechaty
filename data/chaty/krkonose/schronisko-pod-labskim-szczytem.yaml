# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Jedno z nejstarších a nejpůvabnějších hřebenových schronisk polských
  Krkonoš (1 168 m), dřevěná horská chata pod Łabským Wierzchem. Provozuje ho
  PTTK, nabízí 38 lůžek a bufet s teplou kuchyní — a je výborným východiskem
  k ledovcovým kotlům Śnieżne Kotły.
text:
  - >-
    Schronisko PTTK „Pod Łabskim Szczytem" stojí ve výšce 1 168 metrů na
    horské louce pod Łabským Wierzchem, v hlavním hřebeni Karkonoszů nad
    Szklarskou Porębou. Je to dřevěná stavba na kamenné podezdívce; vedle
    plného jména se v mapových datech i v běžném hovoru užívá kratší tvar
    Schronisko „Pod Łabskim Szczytem".
  - >-
    Budovu postavila v roce 1938 německá turistická společnost a od roku 1945
    schronisko provozuje PTTK. Obojí uvádí katalogový profil na
    Schroniskaturystyczne.pl, ze kterého pochází většina údajů na této
    stránce. Kořeny místa jsou přitom starší než dnešní dům: KPN uvádí
    kontinuitu umístění původní pastevecké boudy, která tu stála už před rokem
    1670. Jde tedy o návaznost místa, ne o stáří stavby.
  - >-
    Ubytování nabízí 38 míst v pokojích pro jednu až šest osob se společným
    sociálním zařízením. Bufet vydává obědy, večeře a teplé nápoje, podle
    katalogu denně od osmi ráno do osmi večer.
  - >-
    Autem se dá dojet do Szklarské Poręby, dál se pokračuje pěšky. Ke
    schronisku odtud vedou čtyři značené cesty, kterým katalog přisuzuje jednu
    až dvě hodiny chůze; další přístupy vedou z Jakuszyc a z Jagniątkova.
    Schronisko bývá východiskem k ledovcovým kotlům Śnieżne Kotły a nedaleko
    stojí ještě schroniska Na Hali Szrenickiej a Szrenica.
  - >-
    Údaje na této stránce stojí na jediném katalogovém profilu a na datech z
    OpenStreetMap; redakce je zatím neověřila vlastním dotazem ani návštěvou.
    Doloženou nemáme provozní sezónu. Před cestou proto doporučujeme potvrdit
    si přímo u schroniska otvírací dobu bufetu a volnou kapacitu.
