# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěná hřebenová chata na kamenné podezdívce ve výšce 1 168 m pod Łabskim
  Szczytem v polských Krkonoších. Budovu postavili v roce 1938, od roku 1945
  ji provozuje PTTK. Nabízí 38 lůžek a bufet s teplou kuchyní.
text:
  - >-
    Schronisko PTTK „Pod Łabskim Szczytem" stojí ve výšce 1 168 metrů na
    horské louce pod vrcholem, po kterém nese jméno, v hlavním hřebeni
    Karkonoszů nad Szklarskou Porębou. Jméno toho vrcholu se nám ale
    rozchází: v názvu chaty stojí Łabski Szczyt, náš katalogový podklad ho
    zapisuje jako Łabski Wierch, a že jde o týž kopec, doložené nemáme. Je
    to dřevěná stavba na kamenné podezdívce; vedle plného jména se
    v mapových datech i v běžném hovoru užívá kratší tvar Schronisko „Pod
    Łabskim Szczytem".
  - >-
    Budovu postavila v roce 1938 německá turistická společnost a od roku 1945
    schronisko provozuje PTTK. Obojí uvádí katalogový profil na
    Schroniskaturystyczne.pl, ze kterého pochází většina údajů na této
    stránce. Kořeny místa jsou přitom starší než dnešní dům: Karkonoski Park
    Narodowy podle katalogového podkladu uvádí kontinuitu umístění původní
    pastevecké boudy, která tu stála už před rokem 1670 — samotnou stránku
    parku jsme ale neotevřeli. Jde tedy o návaznost místa, ne o stáří stavby.
    Provozovatel Strzechy Akademické k tomu na svých stránkách označuje
    Strzechu spolu s chatou Pod Łabskim Szczytem za nejstarší chatu
    v Krkonoších; s rokem 1938, který u téhle budovy vedeme, se to tvrzení
    nesrovnává a rozřešené ho nemáme. Navíc ho známe jen zprostředkovaně
    z katalogového podkladu — stránky Strzechy jsme sami neotevřeli.
  - >-
    Ubytování nabízí 38 míst v pokojích pro jednu až šest osob se společným
    sociálním zařízením. Bufet vydává obědy, večeře a teplé nápoje; katalog
    u něj uvádí časy od osmi ráno do osmi večer, neříká ale, ve které dny
    ani v jaké sezóně to platí.
  - >-
    Autem se dá dojet do Szklarské Poręby, dál se pokračuje pěšky. Ke
    schronisku odtud vedou čtyři značené cesty, kterým katalog přisuzuje jednu
    až dvě hodiny chůze; další přístupy vedou z Jakuszyc a z Jagniątkova.
    Nedaleko stojí ještě schroniska Na Hali Szrenickiej a Szrenica.
  - >-
    Většina údajů na této stránce pochází z katalogového profilu na
    Schroniskaturystyczne.pl, poloha z OpenStreetMap. Věta o pastevecké
    boudě a kontaktní údaje jsou od Karkonoského národního parku, tvrzení
    o nejstarších chatách od provozovatele Strzechy Akademické; obojí k nám
    dorazilo přes katalogový podklad a ani jednu z těch stránek jsme
    neotevřeli. Redakce zatím žádný z těch údajů neověřila vlastním dotazem
    ani návštěvou a doloženou nemáme provozní sezónu, proto před cestou
    doporučujeme potvrdit si přímo u schroniska otvírací dobu bufetu
    i volnou kapacitu.
