interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/schronisko-pod-labskim-szczytem.yaml
  (DATA-01) po křížovém ověření DATA-03. Zdroj katalog schroniskaturystyczne.pl
  (pl.wikipedia se ze sandboxu nenačte — cache-only; oficiální stránka PTTK
  pttk.pl k dotažení kontaktů). Vše verified: false dle konvence B. Do DATA-04
  dotáhnout: kontakty (telefon/e-mail), přesná GPS, případně provázat
  sousedniChaty (Na Hali Szrenickiej, Szrenica). Vynechán vágní údaj „služby od
  17. století" z katalogu — nedoložitelný, nezapisuje se.

  AUDIT 25. 7. 2026 (mechanická kontrola D — superlativ bez připsání): perex
  tvrdil „jedno z nejstarších a nejpůvabnějších hřebenových schronisk" a „je
  výborným východiskem". Ani jedno nenese žádný blok overeni — ty dokládají
  budovu z roku 1938 a PTTK od roku 1945 — a „nejstarší" navíc odporovalo
  vlastnímu text[1], který pečlivě rozlišuje kontinuitu místa od stáří stavby.
  Perex přepsán na doložená fakta; hodnotící „nejpůvabnějších" a „výborným"
  vypuštěny (estetický soud v našem hlase, ne převzaté tvrzení).

  KŘÍŽOVÝ ROZPOR (nalezen týmž auditem): profil strzecha-akademicka.yaml nese
  tvrzení provozovatele Strzechy, že Strzecha SPOLU s chatou Pod Łabskim
  Szczytem jsou nejstarší chaty v Krkonoších — kdežto tady vedeme budovu z roku
  1938. Rozpor NEROZHODNUT, nově přiznán ve veřejném text[1] a doplněn zdroj
  strzechaakademicka.pl/historia (redakcí NEOTEVŘENO, známe jen přes katalogový
  podklad). Otázka pro DATA-04 / dotaz na PTTK Jelenia Góra: co přesně se tím
  „nejstarší" myslí — stavba, nepřetržitá služba, nebo kontinuita místa?
