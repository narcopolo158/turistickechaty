# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko PTTK na sedle Przełęcz Okraj ve východních Krkonoších, hned
  u hraničního přechodu do Horní Malé Úpy, ve výšce 1046 m. Kapacitu a
  otvíračku doporučujeme před cestou ověřit na webu schroniska.
text:
  - >-
    Schronisko stojí přímo na sedle Przełęcz Okraj ve východní části
    Krkonoš, v nadmořské výšce 1 046 metrů. Sedlo je zároveň hraničním
    přechodem: na české straně na něj navazuje Horní Malá Úpa, na polské se
    v souvislosti se schroniskem nejčastěji zmiňují Kowary. Výška
    a souřadnice pocházejí z OpenStreetMap, obec, pod kterou objekt spadá,
    spolehlivě doloženou nemáme.
  - >-
    Historii na webu schroniska otevírá rok 1922, kdy na sedle vyrostl
    zděný Schlesische Grenzbaude. Dnešní objekt vznikl v roce 1975 jako
    turistická bacówka s osmadvaceti lůžky a v roce 2013 ho převzali noví
    nájemci. Táž historie připomíná, že od sedla vedla první
    sedmikilometrová trasa jízdy na rohatých saních do Kowar.
  - >-
    Schronisko je vedené v přehledu ubytování PTTK a spadá pod Sudeckie Hotele
    i Schroniska PTTK, tedy pod síť horských chat polského turistického svazu;
    nocleh nabízí i přes polský rezervační portál. Web schroniska uvádí
    kapacitu čtyřiceti lůžek, což je jiné číslo než osmadvacet lůžek, s nimiž
    bacówka podle historie v roce 1975 začínala — jde ovšem o dva různě staré
    údaje. Podobu občerstvení ani otvírací dobu doloženou nemáme.
  - >-
    Souřadnice a výška pocházejí z OpenStreetMap, historie a kapacita
    z prezentace schroniska a jeho provozovatele a redakce je zatím
    neověřila vlastním dotazem ani návštěvou. Před cestou doporučujeme
    potvrdit si otvírací dobu a volná lůžka přímo u schroniska.

