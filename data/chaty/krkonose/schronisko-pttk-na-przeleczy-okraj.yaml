interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/schronisko-pttk-na-przeleczy-okraj.yaml (DATA-01) po DATA-03 (s23 WebSearch + rozhodnutí Michala 20. 7. 2026: ✅ en bloc). Bezobslužná session 31 (21. 7.) — obsah webů NEotevřen, jen titulky.
  Slug nese opravu polského ł ze session 20 (schronisko-pttk-na-przeleczy-okraj).
  Blízko česká strana: Pomezní Boudy (kandidát jindrichuv-dum a okolí Malé Úpy) — vazby doplní DATA-06.
  Dotáhnout ručním během: hero fotka (oční výběr z 24 kandidátů — budova na žádném popisu), lůžka (číslo 40 je z druhé ruky), otvírací doba (žádný podklad ji nenese), podoba občerstvení (katalog vede jen „Stravování: ano"), historie (stránku historia-schroniska.html jsme neotevřeli), obec (Kowary jen z titulků FB/odtur).
  DATA-15 (jazykový audit 25. 7. 2026, čtvrtá dávka): nezávislý agent vrátil devět nálezů, všech devět přijato; jeden desátý jsem našel sám při ověřování. (1) text[2] tvrdil „Web schroniska uvádí kapacitu čtyřiceti lůžek", ač hlavička souboru přiznává, že obsah stránek otevřen nebyl a číslo pochází z katalogového podkladu, který se na web odvolává — přepsáno na vzor strzecha-akademicka („máme z druhé ruky … bereme jako nepotvrzené"). (2) Totéž u historie: „Historii na webu schroniska otevírá rok 1922" a „Táž historie připomíná" prezentovaly neotevřenou stránku jako přečtenou — přepsáno na „Letopočty máme z druhé ruky s odkazem na stránku historie schroniska, samu stránku jsme zatím neotevřeli". (3) Hraniční přechod a Horní Malá Úpa stály v perexu i v text[0] bez pramene — nemazáno, ale připsáno: korpus přechod dokládá v profilu pomezni-bouda přes oficiální web obce Malá Úpa, vazbu schroniska na Pomezní Boudy nese křížové ověření DATA-03 z titulků. Do zdroje[] přidána malaupa.cz s výslovnou poznámkou, že stránku jsme v tomhle běhu neotevřeli. (4) „ve východních Krkonoších" a „ve východní části Krkonoš" vypuštěno z perexu i text[0] — světovou stranu nenese žádný pramen v souboru a externí katalog má v poli „Oblast / část pohoří" jen „Przełęcz Okraj", nikdy světový sektor. Jde o korpusovou vadu, ne o vadu tohoto souboru (viz BACKLOG). (5) Glosa „tedy pod síť horských chat polského turistického svazu" smazána — výklad zkratky PTTK v žádné citaci není. POZOR: identická glosa stojí i v strzecha-akademicka.yaml, opravit v jejím vlastním kole téže dávky. (6) „nocleh nabízí i přes polský rezervační portál" nahrazeno „nabídku ubytování nese i jeho stránka na serveru Infoturystyka" — z titulku „Oferta" neplyne, že jde o rezervační portál; doména doplněna do zdroje[] v nominativu jako jméno serveru. (7) text[4] připisoval historii a kapacitu „prezentaci schroniska a jeho provozovatele", ač prameny provozovatele (pttk.pl, pttk.jgora.pl) nesou jen statut a nocleh — zúženo na „z prezentace samotného schroniska". (8) „nejčastěji zmiňují Kowary" zbaveno kvantifikátoru: doložené jsou dva titulky, o četnosti nevypovídají. (9) zajimavosti[0] „Historie provozovatele" → „Historie schroniska"; pole zdroj u téže položky nese web schroniska, kdežto „provozovatel" má v souboru ustálený význam PTTK.
  DATA-15 pokračování — DESÁTÝ NÁLEZ (vlastní, při ověřování nálezu N1): próza tvrdila „Podobu občerstvení ani otvírací dobu doloženou nemáme", ale externí katalog ČR/SK objekt vede jako HUT-0227 se „Stravování: ano" a „Provoz: celoročně", jistota A. Profil ta data nikdy nevstřebal. Postupováno stejně jako u schronisko-pttk-na-hali-szrenickiej v téže dávce: data vpuštěna dovnitř, ne jen zúžena věta. Doplněno kuchyne: ano + overeniObcerstveni (citace položky katalogu) a sezona: celoročně + rozšířený overeniProvoz; text dostal vlastní odstavec o stravování. typObcerstveni schválně NEvyplněno — podobu občerstvení katalog neuvádí, nedomýšlet. otviraciDoba schválně NEvyplněna — druhý podklad z téhož běhu (fakticka-data.csv, HUT-0227) ji vede jako „neuvedeno", takže hodinu nemá odkud vzít ani jeden pramen; věta „Konkrétní otvírací dobu doloženou nemáme" v próze zůstává a nově říká proč.
  ZAMÍTNUTO (agent si to zamítl sám, ověřeno proti souboru): „stojí přímo na sedle" nese vlastní jméno objektu; přiznané mezery („obec … doloženou nemáme") jsou poctivost, ne vada; rozpor 40 vs. 28 lůžek próza sama přiznává; superlativ „první sedmikilometrová trasa" je připsaný na obou místech, kde stojí; připsání OpenStreetMap v próze je; „redakce" v závěrečném odstavci je doložený domácí styl.
