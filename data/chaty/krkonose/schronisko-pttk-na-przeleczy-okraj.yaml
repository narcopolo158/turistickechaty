  otvíračku doporučujeme před cestou ověřit na webu schroniska.
text:
  - >-
    Schronisko stojí přímo na sedle Przełęcz Okraj nad Kowary, pár kroků od
    státní hranice — z české strany sem vede silnice přes Pomezní Boudy
    v Horní Malé Úpě. Mezi fotkami okolí z Wikimedia Commons převažují
    právě hraniční kameny a rozcestníky.
  - >-
    Objekt je veden v přehledu ubytování PTTK. Kapacitu, občerstvení,
    otvírací dobu i historii doplníme po redakčním otevření webu — do té
    doby je doporučujeme ověřit přímo u schroniska.

