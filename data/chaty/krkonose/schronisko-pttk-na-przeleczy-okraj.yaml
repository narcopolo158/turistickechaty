# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko PTTK na sedle Przełęcz Okraj na česko-polské hranici, ve výšce
  1046 m. Kapacitu a otvíračku doporučujeme před cestou ověřit na webu
  schroniska.
text:
  - >-
    Schronisko stojí přímo na sedle Przełęcz Okraj v nadmořské výšce
    1 046 metrů. Sedlo leží na česko-polské hranici: oficiální web obce
    Malá Úpa vede na české straně, na Pomezních Boudách, hraniční přechod do
    Polska a titulky výsledků vyhledávání k tomuto přechodu řadí i schronisko
    — samotné stránky jsme ale neotevřeli. Na polské straně se se schroniskem
    spojují Kowary. Výška a souřadnice pocházejí z OpenStreetMap, obec, pod
    kterou objekt spadá, spolehlivě doloženou nemáme.
  - >-
    Letopočty máme z druhé ruky s odkazem na stránku historie schroniska,
    samu stránku jsme zatím neotevřeli: rok 1922, kdy na sedle vyrostl zděný
    Schlesische Grenzbaude, vznik dnešní turistické bacówky s osmadvaceti
    lůžky v roce 1975 a nástup nových nájemců v roce 2013. Týž pramen
    spojuje sedlo s první sedmikilometrovou trasou jízdy na rohatých saních
    do Kowar.
  - >-
    Nocleh schronisko nabízí: je vedené v přehledu ubytování PTTK
    i v přehledu Sudeckie Hotele i Schroniska PTTK a nabídku ubytování nese
    i jeho stránka na serveru Infoturystyka. Kapacitu čtyřiceti lůžek máme
    z druhé ruky s odkazem na stránky schroniska; samotné stránky jsme zatím
    neotevřeli, takže to číslo bereme jako nepotvrzené. Liší se od
    osmadvaceti lůžek, s nimiž bacówka podle historie v roce 1975 začínala —
    jde ovšem o dva různě staré údaje.
  - >-
    Stravování u schroniska uvádí externí katalog a řadí tenhle záznam mezi
    ty s nejvyšší mírou jistoty; jakou podobu občerstvení má, z něj ale
    nevyčteme. Týž katalog vede provoz jako celoroční. Konkrétní otvírací
    dobu doloženou nemáme — druhý podklad z téhož běhu ji vede jako
    neuvedenou. Obě položky jsou z druhé ruky: katalog se odvolává na
    přehledy třetích stran, které jsme sami neotevřeli.
  - >-
    Souřadnice a výška pocházejí z OpenStreetMap, historie a kapacita
    z druhé ruky z prezentace samotného schroniska a redakce zatím žádný
    z těch údajů neověřila vlastním dotazem ani návštěvou. Před cestou
    doporučujeme potvrdit si otvírací dobu a volná lůžka přímo
    u schroniska.

