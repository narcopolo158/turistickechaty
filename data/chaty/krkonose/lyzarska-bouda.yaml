# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Hotelová bouda na Liščí louce pod Liščí horou nad Černým Dolem (1 206 m).
  Ubytuje 70 hostů ve tří- až pětilůžkových pokojích s vlastní koupelnou,
  restaurace má otevřeno denně do odpoledne. Zaměřuje se hlavně na školy v
  přírodě a lyžařské kurzy. Nese turistickou známku č. 2210.
text:
  - >-
    Lyžařská bouda (Liščí hora 189, Černý Důl) stojí ve výšce 1 206 m n. m. na
    Liščí louce pod Liščí horou — pod tímto místním jménem ji zná i turistická
    známka č. 2210, vydaná jako „Lyžařská bouda · Liščí louka".
  - >-
    Rozsahem služeb jde o horský hotel: ubytuje 70 hostů ve tří-, čtyř- a
    pětilůžkových pokojích, každý s koupelnou se sprchovým koutem a WC. Pro
    ubytované jsou snídaně formou švédského stolu a večeře s výběrem ze dvou
    menu, restaurace má podle Kudy z nudy otevřeno denně od 10:30 do 17:00.
    K vybavení patří masáže, stolní tenis a fotbálek, dětské hřiště a hřiště pro
    míčové hry, po domluvě lze grilovat.
  - >-
    Provozovatel se zaměřuje především na mateřské školy, školy v přírodě a
    lyžařské kurzy. Údaje pocházejí ze sekundárního zdroje — otvírací dobu
    restaurace i to, zda je otevřená kolemjdoucím, ověřte přímo u boudy;
    OpenStreetMap u téhož objektu uvádí otvírací dobu delší, do 22 hodin.
zdroje:
