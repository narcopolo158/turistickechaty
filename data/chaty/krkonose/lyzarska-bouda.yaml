interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/lyzarska-bouda.yaml (OSM way/218896623,
  DATA-01) v rámci master fronty Tier 1 (známka č.2210 + OSM). Kandidát čekal na
  „doložení provozu" — doloženo přes Kudy z nudy (telefon i doména se shodují s
  OSM, výška 1 206 m se shoduje s rytinou známky č.2210).

  Duplicita OSM (dvě „Lyžařské boudy") je vyřešena rozhodnutím Michala z
  20. 7. 2026 — node/656504528 smazán do _vyrazeno.yaml, tento profil je jediný
  nositel objektu.

  Typ: nastaveno „horsky-hotel" (Kudy z nudy jej vede jako „Hotel Lyžařská
  bouda", 70 lůžek, pokoje s vlastní koupelnou, polopenze) — OSM tag
  tourism=alpine_hut vedl kandidáta jako obsluhovanou; rozhodnutí redakce, ke
  zvážení.

  Zaznamenaný rozpor: otvírací doba restaurace 10:30–17:00 (Kudy z nudy) vs.
  „Mo-Su 10:30-22:00" (OSM) — do profilu vzat údaj Kudy z nudy jako novější a
  konkrétnější, ověřit.

  ⚠ Klíč zařazení ke zvážení: zdroj píše, že hotel je určen „především pro
  školky a školy v přírodě, lyžařské kurzy". Zveřejněná denní otvírací doba
  restaurace ale odpovídá podniku otevřenému veřejnosti. Pokud by se ukázalo, že
  restaurace slouží jen skupinám, objekt Michalův klíč nesplňuje — ověřit.

  `sezona` vědomě nevyplněna (zdroj ji neuvádí). Wi-Fi, platba kartou, psi a
  lyžárna: zdroj neuvádí — nevyplněno.

  DATA-15 (jazykový audit 25. 7. 2026, třetí dávka): opraveno šest vad prózy.
  (1) „na Liščí louce pod Liščí horou" v perexu, v text[0] i v zajimavosti[0]
  spojovalo dva různé prameny do jednoho tvrzení o terénu: adresa (Kudy z nudy)
  zní Liščí hora 189, kdežto Liščí louka je jméno z rytiny známky. Kde louka
  leží vůči hoře, nenese žádný pramen — nahrazeno prostým konstatováním obou
  jmen a jejich původu. (2) zajimavosti[0] nesla ČÍSLO ZNÁMKY ve veřejném
  textu; číslo i odkaz vykresluje sourcovaná karta „Sběratelská místa", ve
  vlastní próze nemá co dělat (stejné pravidlo jako u vět z perexů, viz
  kontrola audit-mech F) — odstraněno. POZOR: ban-scan tenhle výskyt nechytil,
  protože funkce proza() ve scripts/kontrola/lib.ts kryje jen perex a text[],
  nikoli zajimavosti[].text, který se přitom vykresluje jako veřejná karta —
  díra zapsána do BACKLOGu. (3) Perex tvrdil, že „restaurace má otevřeno denně
  do odpoledne", ač profil sám nese rozpor 10:30–17:00 (Kudy z nudy) vs.
  10:30–22:00 (OpenStreetMap), který text[2] přiznává — perex nově rozpor
  přiznává taky. (4) text[1] mlčel o tichém rozporu v typu: OSM vede objekt
  jako obsluhovanou boudu, profil má „horsky-hotel" — rozhodnutí bylo dosud jen
  v této poznámce. (5) Výčet vybavení v text[2] stál bez připsání mimo okno tří
  vět (kontrola audit-mech D) — připsáno Kudy z nudy. (6) text[3] převáděl
  tvrzení zdroje o hotelu na tvrzení o záměru provozovatele („Provozovatel se
  zaměřuje"), zdroj přitom mluví o tom, komu je hotel určen — opraveno; totéž
  v perexu. Drobně: text[4] mluvil o „sekundárním médiu" v jednotném čísle, ač
  profil stojí na Kudy z nudy, OSM i rytině známky.

  DATA-21 (26. 7. 2026, položka „Lyžařská bouda 1717 + 1930"): katalogový
  návrh z DATA-09 chtěl rokVzniku 1717 a milník 1930. Otevřen uvedený pramen —
  vlastní web boudy, dosud vedený jako nedostupný (ConnectTimeout); tentokrát
  se načíst podařil a obě věty tam doslova stojí, takže katalog SEDÍ a údaje
  jsou zapsané. Zapsáno ale s výhradou: pramen je vlastní prezentace
  provozovatele a u letopočtu 1717 neuvádí žádný doklad. To je pro dataci
  sahající do 18. století slabé — u srovnatelně starých bud (Martinova bouda)
  se ukázalo, že marketingový letopočet a doložený letopočet nejsou totéž.
  Próza proto říká, že jde o tvrzení boudy o sobě samé. Nezvyšovat na
  verified:true bez nezávislého pramene (literatura, archiv, KRNAP).
  Při téže návštěvě webu potvrzena výška 1 206 m (třetí nezávislý pramen) a
  kapacita 70 osob (druhý pramen) a doplněna poloha „jižní svah Liščí hory,
  2. zóna KRNAP". Otvírací dobu vlastní web na čtených stránkách NEUVÁDÍ —
  rozpor 10:30–17:00 vs. 10:30–22:00 tedy trvá.

  K dotažení (DATA-04, verified:true): nezávislé doložení roku 1717, sezónní
  režim, potvrdit otvírací dobu a veřejnou přístupnost restaurace. Hero fotka:
  kandidáti DATA-02. Známka č.2210 — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c2210-lyzarska-bouda-lisci-louka.png.
