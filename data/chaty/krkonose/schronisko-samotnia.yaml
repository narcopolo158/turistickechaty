# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko PTTK v kotli Małego Stawu na polské straně Krkonoš, podle
  titulku bryla.pl „jedno z najstarszych schronisk w Polsce". Kapacitu a
  otvíračku doporučujeme před cestou ověřit na webu schroniska.
text:
  - >-
    Samotnia stojí u břehu jezera Mały Staw v nadmořské výšce 1195 m nad
    Karpaczem. Je vedena v přehledu ubytování PTTK; titulek článku bryla.pl
    ji označuje za jedno z nejstarších schronisek v Polsku.
  - >-
    Tentýž titulek ohlašuje, že po více než 60 letech schronisko opustila
    rodina Siemaszków a nastupuje nový nájemce — aktuální podobu provozu
    proto doporučujeme ověřit přímo u schroniska; profil doplníme po
    redakčním ověření.

