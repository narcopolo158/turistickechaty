# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Hřebenová bouda ve výšce 1 368 m v 1. zóně KRNAP nad Pecí pod Sněžkou. Nabízí
  pokoje i noclehárnu a restaurační část; dnešní budova pochází z let 1988–1990,
  starší budovy na tomto místě opakovaně vyhořely. Od září 2025 ji vede nový
  provozovatel.
text:
  - >-
    Výrovka stojí na hřebeni Krkonoš v první zóně Krkonošského národního
    parku; adresou patří pod Pec pod Sněžkou, kde nese číslo popisné 204.
    Výšku 1 368 metrů nad mořem uvádí Kudy z nudy; starší katalogový podklad
    ale pracuje s hodnotou 1 356 metrů. Rozpor zatím rozřešený nemáme
    a zůstáváme u údaje z konkrétnějšího zdroje.
  - >-
    Místo za sebou má několik staveb. V roce 1926 na něm vyrostl vojenský
    srub, o dva roky později Havlova bouda, pojmenovaná podle svého stavitele.
    Obě budovy vzaly za své při požárech v letech 1946 a 1947 a dnešní bouda
    se stavěla mezi lety 1988 a 1990. Celou tuhle časovou osu přebíráme
    z Kudy z nudy, tedy ze sekundárního média; primárním pramenem doložená
    zatím není. Prameny se v ní navíc rozcházejí. Náš atlas zaniklých chat
    vede Havlovu boudu jako týž vojenský srub, postavený roku 1927
    a vyhořelý v únoru 1947 — tedy jako jednu stavbu a jeden požár. Jiný
    podklad mezi předchůdce řadí ještě provizorní boudu z roku 1948, o níž
    Kudy z nudy mlčí. Které čtení je správné, rozřešené nemáme.
  - >-
    Ubytování Výrovka nabízí ve dvou- až čtyřlůžkových pokojích s vlastním
    sociálním zařízením a v noclehárně, kde je zázemí společné. Celkový počet
    lůžek Kudy z nudy neuvádějí a jinde se čísla rozcházejí — od padesáti po
    osmaosmdesát lůžek. Všechna jsou z druhé ruky a ověřené nemáme žádné,
    proto kapacitu na stránce nevedeme. Součástí boudy je restaurační část;
    jestli obsluhuje i kolemjdoucí turisty, doložené nemáme, a otvírací dobu,
    kterou nese jediný náš podklad, neověřenou nepublikujeme, protože se
    mění. Od 1. září 2025 boudu podle Kudy
    z nudy vede nový provozovatel Good Hut, za kterým stojí Petr Bárta a Jan
    Stejskal.
  - >-
    Pěší přístup k boudě zatím doložit neumíme a fakta na této stránce stojí
    na sekundárním médiu a na datech z OpenStreetMap; přímo z webu boudy
    ověřená nejsou. Rozcházejí se i v kontaktních údajích, uvádíme proto vždy
    jen jednu z možností a ověřenou ji nemáme. Před cestou proto doporučujeme
    potvrdit si u boudy otvírací dobu restaurace i volná lůžka.
zdroje:
  - popis: >-
      Kudy z nudy — „Chata Výrovka" (výška, historie, ubytování, nový
      provozovatel, kontakty); sekundární médium, verified:false, ověřit primárně
    url: https://www.kudyznudy.cz/aktivity/chata-vyrovka
