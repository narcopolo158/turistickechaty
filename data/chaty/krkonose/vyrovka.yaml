    url: https://www.openstreetmap.org/way/19921111
interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/vyrovka.yaml (DATA-01/OSM) v rámci master
  fronty Tier 1 (známka č.12 + katalog ChatGPT + OSM). Data z Kudy z nudy
  (sekundární médium) — vlastní web vyrovka.cz je ze sandboxu nedostupný; OSM
  navíc nesla starou doménu vyrovka-krkonose.cz s rozbitým HTTPS.

  Rozpor výšky: Kudy z nudy 1 368 m vs. katalog ChatGPT 1 356 m — ponecháno
  1 368 (konkrétnější zdroj), ověřit (DATA-04).

  K dotažení (DATA-04, verified:true): přesná kapacita lůžek, otvírací doba a
  veřejná přístupnost restaurace, potvrdit nového provozovatele Good Hut.
  Hero fotka: vybrat z kandidátů DATA-02. Známka č.12 — obrázek připraven
  v data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c12-chata-vyrovka.png.

  DATA-15 (jazykový audit 25. 7. 2026, čtvrtá dávka): opraveny čtyři vady,
  jeden nález odložen do BACKLOGu. (1) Časová osa předchůdců si odporovala
  s vlastní evidencí korpusu a próza to nepřiznávala. Kudy z nudy staví dvě
  budovy (srub 1926, Havlova bouda 1928) a dva požáry (1946, 1947); náš
  vlastní atlas zaniklých chat má v ZANIK-006 jednu stavbu — „vojenský
  výcvikový srub s 36 místnostmi vznikl roku 1927 péčí generála ženijního
  vojska Františka Havla", vyhořela 6. 2. 1947, jistota B, souřadnice
  50.714714/15.680497, tedy zhruba 80 m od dnešní boudy; a fakticka-data.csv
  HUT-0003 (zdroj vyrovka.cz, jistota A) vede navíc třetího předchůdce,
  provizorní boudu z roku 1948 s třicetilůžkovou noclehárnou. Perexové „dvě
  starší (od roku 1926) shořely" bylo proti tomu nejen nedoložené, ale
  nesprávné; nahrazeno neutrálním „starší budovy na tomto místě opakovaně
  vyhořely", což nese FACT-0037 (Seznam Zprávy, jistota B). Do text[1]
  doplněno přiznání obou konkurenčních čtení. Osa z Kudy z nudy se
  nepřepisuje — pramen zůstává, rozpor vysvětluje próza; totéž platí pro
  zajimavosti[0], která svůj zdroj nese a Kudy z nudy to skutečně říkají.
  (2) text[2] tvrdil „Celkový počet lůžek prameny neuvádějí, a tak ho
  neuvádíme ani my" — doloženo to bylo jen pro Kudy z nudy
  (overeniNocleh.source: „přesná kapacita neuvedena"), zatímco tři podklady
  s jistotou A číslo nesou a rozcházejí se: katalog DATA-08 uvádí 88 lůžek
  s poznámkou „KČT uvádí 66 lůžek v pokojích a 22 v noclehárnách",
  fakticka-data.csv HUT-0003 uvádí 65 (zdroj kct.cz) a FACT-0039 uvádí 50
  (zdroj Krkonose.eu). Tvrzení o stavu pramenů tedy bylo nepravdivé.
  Přepsáno podle vzoru Špindlerovy boudy: rozsah se přizná, číslo se
  nevede. (3) text[2] rovněž tvrdil, že „v jakých hodinách má otevřeno,
  doložené nemáme", ač fakticka-data.csv nese „chata 7:00–22:00; kuchyně
  7:00–20:00" ze zdroje vyrovka.cz s jistotou A a datem ověření 2026-07-21.
  Návrh auditu tu hodiny do prózy doplnit ZAMÍTNUT — otvírací doby se
  neověřené nepublikují, protože se mění; převzata formulace z Vosecké boudy
  („neověřenou nepublikujeme"), která nepravdivé tvrzení odstraní, aniž by
  proměnlivý údaj vypustila ven. (4) Publikovaný telefon z Kudy z nudy
  odporuje dvěma podkladům s jistotou A, z nichž jeden je web boudy. Číslo
  ponecháno (nemáme primární ověření, kterým bychom ho nahradili), rozpor
  zapsán do overeniProvoz.source a přiznán ve veřejné próze bez uvádění
  čísel — vzorem chalupa-na-rozcesti („u profilu proto stojí vždy jen jedna
  z možností"). Zároveň označen rozpor rokVzniku 1926 vs. 1990 v komentáři
  pole. ODLOŽENO → VYŘEŠENO 26. 7. 2026 (DATA-18): audit správně upozornil,
  že slovo „profil" ve významu naší vlastní stránky je na seznamu zakázané
  interní terminologie, ale README kontrol ho od třetí dávky vedlo jako
  přijatý falešný poplach v ustálené vazbě „starší podklad, ze kterého
  profil vychází". Dva vlastní dokumenty projektu si odporovaly a věc byla
  korpusová, ne souborová, takže se opravila jedním měřeným průchodem přes
  celý korpus, stejnou metodou jako DATA-16. Skutečný census byl jiný, než
  tenhle odklad odhadoval: ne 23 výskytů ve 20 souborech, ale 30 výskytů,
  z nichž starý vzor viděl jen 19 — byl totiž sám citlivý na velikost
  písmen i na pád. Interním žargonem jich bylo 19 a všech 19 je přepsáno
  (v tomhle souboru vazba v text[0] vypuštěna úplně, protože „ze kterého
  vycházíme" by si odporovalo s následující větou). Zbylých 11 zůstává:
  9 ve významu stránky pramene („katalogový profil", „profil na
  treking.cz") a 2× sloveso „profiluje se", což je běžná čeština a vada
  to není. README kontrol svůj chybný zápis opravil, spor dokumentů tedy
  padl. Ustálený počet ban-scanu 138 → 135.
  ZAMÍTNUTO po druhém čtení (agentem i při adjudikaci): „hřebenová bouda"
  a „stojí na hřebeni Krkonoš v 1. zóně" není domýšlení typu terénu —
  zajimavosti[1] to nese s vlastním polem zdroj a Kudy z nudy to říkají
  doslova. „Starší podklad" u katalogu je doložený domácí tvar napříč
  korpusem, ne tvrzení o stáří. Přiznaný rozpor výšky 1 368 vs. 1 356 m
  je podle metodiky poctivost, ne vada. Katalogové „Přístup: pěšky / dle
  objektu autem" je boilerplate (týž řetězec u nesouvisejících objektů
  HUT-0071 a HUT-0141), takže „pěší přístup doložit neumíme" zůstává
  pravdivé. Nevyužitá stopa pro DATA-12: fakticka-data.csv nese
  u HUT-0003 doloženou zajímavost „KČT ji označuje za nejvýše položenou
  chatu Klubu českých turistů" (zdroj kct.cz, jistota A) a Seznam Zprávy
  nesou FACT-0033 až FACT-0038 (počátky místa v 18. století, přezdívka
  Hotel Výrovka, finanční stráž a pašeráci, vojenský lyžařský výcvik,
  architekt Vladimír Vokatý a dodavatel Budimex) — vetkat samostatně,
  ne v auditní dávce.
