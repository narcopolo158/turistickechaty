# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Hřebenová bouda ve výšce 1 368 m v 1. zóně KRNAP nad Pecí pod Sněžkou. Nabízí
  pokoje i noclehárnu a restaurační část; dnešní budova pochází z let 1988–1990,
  dvě starší (od roku 1926) shořely. Od září 2025 ji vede nový provozovatel.
  Nese turistickou známku č. 12.
text:
  - >-
    Výrovka stojí na hřebeni Krkonoš v první zóně Krkonošského národního
    parku; adresou patří pod Pec pod Sněžkou, kde nese číslo popisné 204.
    Výšku 1 368 metrů nad mořem uvádí Kudy z nudy; starší podklad, ze kterého
    profil vychází, ale pracuje s hodnotou 1 356 metrů. Rozpor zatím rozřešený
    nemáme a v profilu zůstáváme u údaje z konkrétnějšího zdroje.
  - >-
    Místo za sebou má několik staveb. V roce 1926 na něm vyrostl vojenský
    srub, o dva roky později Havlova bouda, pojmenovaná podle svého stavitele.
    Obě budovy vzaly za své při požárech v letech 1946 a 1947 a dnešní bouda
    se stavěla mezi lety 1988 a 1990. Celou tuhle časovou osu přebíráme
    z Kudy z nudy, tedy ze sekundárního média; primárním pramenem doložená
    zatím není.
  - >-
    Ubytování Výrovka nabízí ve dvou- až čtyřlůžkových pokojích s vlastním
    sociálním zařízením a v noclehárně, kde je zázemí společné. Celkový počet
    lůžek prameny neuvádějí, a tak ho neuvádíme ani my. Součástí boudy je
    restaurační část; jestli obsluhuje i kolemjdoucí turisty a v jakých
    hodinách má otevřeno, doložené nemáme. Od 1. září 2025 boudu podle Kudy
    z nudy vede nový provozovatel Good Hut, za kterým stojí Petr Bárta a Jan
    Stejskal.
  - >-
    Pěší přístup ani kapacitu boudy zatím doložit neumíme a fakta na této
    stránce stojí na sekundárním médiu a na datech z OpenStreetMap; přímo
    z webu boudy ověřená nejsou. Před cestou proto doporučujeme potvrdit si
    u boudy otvírací dobu restaurace i volná lůžka.
zdroje:
