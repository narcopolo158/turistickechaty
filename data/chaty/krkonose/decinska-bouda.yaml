    později pan Richter nechal stavení zbořit a postavit nový horský hostinec
    s ubytováním (v mírně rozšířené podobě se dochoval dodnes). Po vyhnání
    sudetských Němců budovu s pěti pokoji a dvaceti lůžky převzal
    československý stát a dlouhá léta fungovala jako podniková chata ČSAD
    Děčín." Období hospodaření Bergerových nese pramen jako „V roce 19966-1972",
    což je zjevný překlep a rok začátku z něj nevyčteme — do milníků proto
    NEJDE. Rok převzetí státem pramen neuvádí (jen „po vyhnání sudetských
    Němců"), proto také není milníkem. Jediný pramen, verified: false.
