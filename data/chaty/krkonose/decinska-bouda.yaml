# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská farma na Růžohorkách pod Sněžkou, která se drží tradice horského
  hospodaření: vlastní stádo, mlékárna za boudou a obsluha v dobových krojích.
  Hostinec s ubytováním tu stojí od roku 1846, dnešní jméno nese po podnikové
  chatě ČSAD Děčín. Občerstvení je i pro příchozí.
text:
  - >-
    Děčínská bouda stojí na Růžohorkách na Růžové hoře, tři a půl kilometru pod
    vrcholem Sněžky a asi šest set metrů od stanice lanovky. Vede kolem ní
    značená cesta — měření nad exportem tras ji našlo pětatřicet metrů od osy
    značky a rozcestník je ještě o tři metry blíž —, takže je to bouda, kterou
    turista na cestě k Sněžce míjí, ne dům stranou provozu. Že to místo mělo
    roli na trase odjakživa, připomíná i historie: v polovině devatenáctého
    století tu stálo osm letních bud a kolem vedla cesta horských nosičů na
    Sněžku.
  - >-
    Dnes je to hlavně farma. Hospodaří tu od roku 2006 manželé Mlejnkovi, jejich
    krávy a ovce spásají luční enklávy v Eliščině údolí, na Pomezních boudách,
    ve Velké Úpě i na Černé hoře a hned za boudou stojí mlékárna, ve které se
    z toho mléka dělají jogurty, zákys, máslo a tvaroh. Obsluha nosí dobové
    kroje. Kuchyně se popisuje jako staročeská a vaří z vlastních surovin.
  - >-
    Zastavit se tu dá i bez rezervace a bez noclehu: v přízemí jsou dvě
    místnosti k posezení a občerstvení je výslovně i pro příchozí návštěvníky,
    a kdyby bylo uvnitř plno, funguje z boku chaty výdejní okénko. Otevírací
    dobu uvádějí dva na sobě nezávislé prameny shodně — denně od deseti do
    čtyř —, hlavní sezóna je od května do října. Jestli je otevřeno i mimo ni,
    žádný z pramenů neříká, takže to netvrdíme ani my.
  - >-
    Přespat se dá v pěti pokojích po třech až pěti lůžkách, dohromady je jich
    jednadvacet; sociální zařízení je společné, oddělené pro ženy a muže,
    a ubytování se nabízí s polopenzí. Pes je vítán po domluvě, Wi-Fi bouda má.
  - >-
    Historie stavby je krátká a trochu neklidná. Původní stavení tu vzniklo
    v roce 1846, jenže o půl roku později je majitel nechal zbořit a postavil
    místo něj nový horský hostinec s ubytováním — a ten se v mírně rozšířené
    podobě dochoval dodnes. Po vyhnání sudetských Němců budovu převzal
    československý stát a dlouhá léta sloužila jako podniková chata ČSAD Děčín;
    odtud jméno, které se drží dodnes, i když s Děčínem už bouda nemá nic
    společného.
  - >-
    Dvě věci si před cestou ověřte přímo u provozovatele. Nadmořská výška se
    v pramenech rozchází o pětadvacet metrů — jeden uvádí 1255, druhý 1280 —
    a rozsoudit to neumíme, takže tu stojí nižší číslo. A všechno ostatní výše
    pochází ze sekundárních pramenů; redakce zatím nic z toho neověřila vlastním
    dotazem ani návštěvou.

