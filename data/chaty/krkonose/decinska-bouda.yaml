interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/decinska-bouda.yaml (DATA-01, koš C1
  triáže) v denní session 4. 9. 2026. Vše verified: false dle konvence B —
  ověří teprve Michal vlastním dotazem nebo návštěvou.

  PROČ AŽ TEĎ: 3. 9. 2026 byla Děčínská bouda označena za nejsilnějšího
  z pětice kandidátů C1, ale chyběla doslovná věta o veřejném přístupu — měli
  jsme jen shodu otevírací doby ve dvou pramenech (Firmy.cz + OSM check_date),
  což je úsudek z čísla, ne citace. Dnes se ta věta našla na Českých horách
  („občerstvení z prodejem i pro příchozí návštěvníky") a nezávisle na
  oficiálním webu města (restaurace + výdejní okénko z boku chaty). Otázka
  z deníku 3. 9., jestli se shoda otvíracích dob bere jako doklad, tím pro
  tenhle profil ztrácí naléhavost — ale jako obecná konvence zůstává otevřená
  a stojí za odpověď (bude se opakovat).

  SOUSEDSTVÍ S BOUDOU RŮŽOHORKY — 47 METRŮ, A PŘESTO JINÝ OBJEKT.
  bouda-ruzohorky.yaml má 50,7103765 / 15,7500803, tenhle profil
  50,7106102 / 15,74952; to je zhruba 47 m. Že nejde o duplicitu, drží tři
  nezávislé rozdíly: číslo popisné (Velká Úpa 181 × 182), telefon
  (+420 733 557 999 × +420 606 209 727) a e-mail (horskafarma@email.cz ×
  ruzohorky@seznam.cz). Pozor ale na past: oba profily citují České hory a oba
  prameny mluví o „dvou místnostech k posezení" a shodně uvádějí 1280 m —
  ta shoda formulací je nápadná a stojí za kontrolu při případném telefonátu.
  Růžohorky vedeme s 20 lůžky v 10 dvoulůžkových pokojích, Děčínskou boudu
  s 21 lůžky v 5 pokojích po 3–5 lůžkách; to se nepřekrývá.

  ROZPOR VÝŠKY 1255 (hkregion.cz) × 1280 (České hory) je přiznaný
  v overeniLokace i v próze; zapsáno nižší dle konvence z 27. 7. 2026.
  Hypotéza (NEDOLOŽENÁ, proto ne v próze): 1280 m je výška enklávy Růžohorky
  jako celku — nese ji i profil Boudy Růžohorky —, kdežto 1255 patří téhle
  budově níž po svahu. Ověřit.

  ROZPOR PROVOZOVATELE: web města jmenuje manžele Mlejnkovy (od 2006),
  gastrozoom.cz uvádí kontaktní osobu „Pechoč Jaroslav". Do profilu vzato jméno
  z oficiálního webu města jako z autoritativnějšího pramene, rozpor přiznán
  v overeniProvoz. Do DATA-04.

  CO PROFIL VĚDOMĚ NEVYPLŇUJE:
  — `sezona: celoročně`: prameny mluví jen o „hlavní sezóně květen–říjen",
    což provoz mimo ni nevylučuje, ale ani netvrdí.
  — barvy značek a časy výstupu: měření zná vzdálenost ke značce, ne její
    barvu; žádný pramen přístupové trasy nepopisuje.
  — platba kartou, lyžárna, ceny, rezervace: nikde doloženo.
  — rok převzetí státem a roky hospodaření Bergerových: pramen je uvádí jako
    „V roce 19966-1972", tedy s překlepem, ze kterého se rok nedá vyčíst.

  NEDOČTENO: facebooková stránka objektu (jediný „vlastní" web, který prameny
