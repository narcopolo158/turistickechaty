# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Velká hřebenová bouda v 1. zóně KRNAP ve výšce 1 340 m, kousek od pramene
  Labe severozápadně od Špindlerova Mlýna. Restaurace i bufet otevřené celý
  den i pro kolemjdoucí turisty, ubytování od spacáků po pokoje Premium.
text:
  - >-
    Labská bouda stojí na Labské louce ve výšce 1 340 m n. m., zhruba kilometr
    od pramene Labe a v první zóně Krkonošského národního parku. Pohostinství
    tu má kořeny už v roce 1830; dřevěná bouda ale roku 1965 vyhořela a dnešní
    výrazná budova pochází z roku 1975.
  - >-
    Restaurace pojme 70 hostů, bufet dalších sto a obojí má otevřeno denně od
    10 do 21 hodin (kuchyně do 19:30) — najíst se tu může i turista bez
    ubytování, v sezóně slouží venkovní bufet. Přespat lze od smíšených
    economy pokojů se spacáky po dvou- až čtyřlůžkové pokoje Premium.
  - >-
    K vybavení patří finská sauna, vířivka a bankomat, platit lze kartou;
    ubytovat se dá i se psem. Bouda leží na křižovatce hřebenových cest —
    dostupná je pěšky po značených trasách z okolních středisek.
