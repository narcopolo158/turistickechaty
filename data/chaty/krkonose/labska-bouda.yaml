# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda v 1. zóně KRNAP ve výšce 1 340 m, zhruba kilometr od pramene Labe
  severozápadně od Špindlerova Mlýna. Restaurace i bufet mají otevřeno denně
  od deseti do devíti večer (kuchyně do půl osmé) a najíst se tu může
  i turista bez ubytování; spí se od spacáků po pokoje Premium.
text:
  - >-
    Labská bouda stojí ve výšce 1 340 m n. m., v první zóně Krkonošského
    národního parku a zhruba kilometr od pramene Labe. Web boudy ji umisťuje
    severozápadně od Špindlerova Mlýna, který je jí nejbližším střediskem;
    katastrální adresa objektu ale patří Vítkovicím v Krkonoších, konkrétně
    Bedřichovu 31. Server Krkonose.eu k boudě váže i meteorologickou stanici
    a observatoř ČHMÚ — ten údaj ale zatím stojí jen na sekundárním médiu.
  - >-
    Pohostinství má na místě kořeny už v roce 1830, kdy tu podle boudy
    prodávala žena „kozí výrobky a kořalku". Server Krkonose.eu k okolí
    boudy váže vyhlášení první přírodní rezervace v Krkonoších roku 1904
    a připomíná, že sem byl v roce 1913 po tragickém závodě dopraven lyžař
    Bohumil Hanč, který na Labské boudě zemřel; jde o sekundární médium,
    jehož údaje zatím nemáme potvrzené primárním pramenem.
  - >-
    Původní dřevěná bouda v roce 1965 vyhořela a dnešní stavba pochází
    z roku 1975. Seznam Zprávy ji popisují jako devítipodlažní
    železobetonový objekt, v němž jsou recepce i hlavní vstup nahoře
    a výtahy sjíždějí do nižších pater; podle téhož článku se vlastníkem
    boudy stala v roce 2012 společnost Salvario Holdings. Také tady jde
    o sekundární zdroj.
  - >-
    Restaurace pojme sedmdesát hostů, bufet dalších sto a obojí má otevřeno
    denně od deseti dopoledne do devíti večer, kuchyně vaří do půl osmé.
    Najíst se tu může i turista bez ubytování a v sezóně slouží venkovní
    bufet.
  - >-
    Spí se ve třech kategoriích pokojů. Premium jsou dvou- až čtyřlůžkové
    s koupelnou a televizí, Standard dvou- až třílůžkové s koupelnou
    a Economy čtyřlůžkové smíšené pokoje se spacáky; jestli si spacák host
    přináší sám, web boudy neupřesňuje. Neuvádí ani celkový počet lůžek,
    takže ho neuvádíme ani my.
    K zázemí patří finská sauna, vířivka a bankomat, platit se dá kartou
    a ubytovat se lze i se psem.
  - >-
    Konkrétní pěší trasy k boudě, jejich délky, převýšení ani značení zatím
    doložené nemáme a totéž platí o možnostech dojezdu. Údaje na této
    stránce pocházejí z webu boudy, z OpenStreetMap a ze dvou sekundárních
    médií a redakce je zatím neověřila vlastním dotazem ani návštěvou; před
    cestou doporučujeme potvrdit si zejména otvírací dobu a volnou
    kapacitu.
