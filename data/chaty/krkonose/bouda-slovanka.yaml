# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Velká bouda v enklávě Lučiny na trase z Pece pod Sněžkou přes Černou
  horu do Černého Dolu, v 1120 metrech. Katalog ji popisuje jako boudu
  pro rodinnou rekreaci, lyžařské kurzy a školy v přírodě — a přesně tak
  je třeba ji brát: spí tu skupiny, kolemjdoucím žádná doložená služba
  nekyne.
text:
  - >-
    Bouda Slovanka stojí v luční enklávě Lučiny — poštovní adresou patří
    k Černému Dolu — ve výšce 1120 metrů. Katalog ji klade na trasu
    z Pece pod Sněžkou přes Černou horu do Černého Dolu, takže se kolem
    ní chodí; na druhé stránce téhož katalogu je výška o pět metrů
    jinak, což přiznáváme a bereme hodnotu shodnou s mapovými daty.
  - >-
    Charakter boudy přebíráme z katalogu doslova: je „využívaná hlavně
    pro účely rodinné rekreace, lyž. kursy, školy v přírodě apod."
    Devětapadesát lůžek tomu odpovídá — tohle je dům pro skupiny, které
    si ho objednají dopředu. Jestli se tu zastaví i turista jdoucí kolem
    na čaj nebo polévku, žádný pramen neříká, a my to bez dokladu
    netvrdíme.
  - >-
    O stravování ani o historii boudy jsme v otevřených pramenech
    nenašli nic doloženého a vlastní web se nám opakovaně nepodařilo
    otevřít. Až se pramen objeví — nebo až se provozovateli dovoláme —
    všechno tu doplníme.
  - >-
    Údaje pocházejí z katalogu České hory; vlastním dotazem jsme zatím
    neověřili nic. Souřadnice jsou z mapových dat OpenStreetMap
    (© přispěvatelé OpenStreetMap, ODbL) a v terénu je nikdo
    nekontroloval.

