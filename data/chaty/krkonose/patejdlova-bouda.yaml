# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda na svahu Labského dolu poblíž Brádlerových bud (kolem 1 000 m),
  kterou podle univerzitního magazínu postavila roku 1710 vídeňská rodina
  Eichlerů. Od roku 1961 patří Univerzitě Karlově a slouží studentským
  kurzům a rekreaci zaměstnanců — kolemjdoucí veřejnosti služby nenabízí,
  a proto to říkáme hned v úvodu.
text:
  - >-
    Patejdlova bouda stojí na svahu Labského dolu nad Špindlerovým
    Mlýnem, poblíž Brádlerových bud, ve výšce kolem tisíce metrů. Jméno
    nese podle článku univerzitního magazínu po generálu JUDr. Josefu
    Patejdlovi.
  - >-
    Její historie je podle téhož pramene třísetletá: boudu měla roku 1710
    postavit vídeňská rodina Eichlerů a dlouho sloužila jako dřevorubecká
    bouda. Zlom přišel v roce 1961, kdy ji od Ministerstva školství
    a osvěty získala Univerzita Karlova — a od té doby tu běží celoroční
    kurzy studentů a rekreace zaměstnanců. Letopočty přebíráme
    z univerzitního článku, který k nim neuvádí doklady; uvádíme je proto
    s připsáním.
  - >-
    A teď to podstatné pro turistu na hřebeni: Patejdlova bouda je dnes
    účelové zařízení Univerzity Karlovy — 46 lůžek ve třinácti pokojích
    a jídelna slouží posluchačům a zaměstnancům, ne kolemjdoucí
    veřejnosti. Do průvodce patří svou třísetletou minulostí a tím, že
    je pevným bodem krajiny Labského dolu; s obědem nebo noclehem tu ale
    poutník počítat nemůže.
  - >-
    Údaje pocházejí z webu rekreačních zařízení univerzity a z jejího
    magazínu; vlastním dotazem jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

