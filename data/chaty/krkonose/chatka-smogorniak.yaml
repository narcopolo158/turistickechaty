# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bývalá myslivecká bouda Grosse Jagdhütte z počátku dvacátých let
  20. století nad Stříbrným potokem, u vyústění Kotła Smogorni kolem
  1120 metrů. Po válce sloužila přes dvacet let strážcům ochrany
  přírody, dnes o ni pečuje spolek — a zbloudilému turistovi nabízí
  aspoň otevřené závětří, když hospodáři nejsou doma.
text:
  - >-
    Chatka Smogorniak stojí nad Stříbrným potokem (Srebrny Potok)
    u vyústění karu Kocioł Smogorni, poblíž horní hranice lesa ve výšce
    kolem 1120 metrů — jméno nese po hoře Smogornia, která se nad ní
    zvedá k 1489 metrům. Postavena byla na počátku dvacátých let
    minulého století pro myslivce a na starých mapách bývá vedena
    prostě jako Jagdhaus, lovecký dům.
  - >-
    Poválečný příběh je pestrý: přes dvacet let sloužila jako strážnice
    krkonošské skupiny Stráže ochrany přírody, ve čtyřicátých letech
    k ní měli přístup sportovci klubu Stal z Cieplic — a zprovoznili tu
    i lyžařský vlek — později turisté závodního kola PTTK. Dnes o ni
    pečuje spolek ochrany přírody Smogorniak; prameny se neshodnou,
    jestli od roku 2006, nebo 2007, a tak letopočet netvrdíme. Byla
    i léta, kdy správci chatku po vloupáních s těžkým srdcem zamkli.
  - >-
    Pro turistu na hřebeni je podstatné tohle: chatka je spolková,
    nocleh uvnitř je věcí hospodářů a kapacitu žádný pramen nenese —
    ale závětří zůstává podle přehledu otevřené, „aby umožnilo úkryt
    zbloudilému turistovi", když hospodáři nejsou doma. V nouzi tedy
    střecha nad hlavou, plánovat nocleh sem ovšem nelze.
  - >-
    Údaje pocházejí z polského místopisného webu, fotoarchivu, přehledů
    chatek a vzpomínkových textů; vlastním dotazem jsme zatím neověřili
    nic. Souřadnice jsou z mapových dat OpenStreetMap (© přispěvatelé
    OpenStreetMap, ODbL) a v terénu je nikdo nekontroloval.

