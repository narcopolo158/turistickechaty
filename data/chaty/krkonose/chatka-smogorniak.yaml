# ── Historie ──────────────────────────────────────────────────────────────
# rokVzniku ZÁMĚRNĚ PRÁZDNÝ: „počátek 20. let 20. století" není letopočet.
# Rok vzniku dnešního spolku se rozchází (2006 fotoarchiv × 2007 rejstřík
# a přehledy) — milník se nezapisuje, próza nese s výhradou.
overeniHistorie:
  source: >-
    fotoarchiv fotopolska.eu (otevřeno 27. 7. 2026), doslova: „Chata
    zbudowana na początku lat 20. ubiegłego wieku na potrzeby myśliwych
    (Grosse Jagdhütte). Po wojnie przez ponad 20 lat była strażnicą
    Grupy Karkonoskiej Straży Ochrony Przyrody. Od 2006 r. pozostaje pod
    opieką Stowarzyszenia Ochrony Przyrody „Smogorniak"." Přehled
    zachodnia.tv (otevřeno 27. 7. 2026): ve 40. letech měli přístup
    členové sportovního klubu Stal z Cieplic (a zprovoznili tu lyžařský
    vlek), pak turisté kola PTTK při cieplické „Fampě", skupina SOP
    Smogorniak, a „w 2007 roku dostęp do chatki miało Stowarzyszenie
    Ochrony Przyrody „Smogorniak"" — ROZPOR ROKU SPOLKU 2006 × 2007
    (rejstřík NGO: rok vzniku 2007); nerozhodujeme. Vzpomínkový text
    e-karkonosze.eu: na staré mapě vedena prostě jako „Jagdhaus".
  verified: false
  checked: '2026-07-27'

