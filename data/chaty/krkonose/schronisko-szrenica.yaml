interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/schronisko-szrenica.yaml (DATA-01) po DATA-03 (s23 WebSearch + rozhodnutí Michala 20. 7. 2026: ✅ en bloc). Bezobslužná session 31 (21. 7.) — obsah webů NEotevřen, jen titulky.
  CHARAKTER (s23): web se prezentuje i jako „hostel" — do typologie zapsán typ obsluhovana (schronisko s obsluhou), hostelový režim přiznán v perexu i textu; upřesnit po otevření webu.
  PROVOZOVATEL: PTTK nikde v titulcích u tohoto objektu — netvrdíme (na rozdíl od Hali Szrenickiej).
  Výška vrcholu Szrenica v textu vědomě neuvedena (žádný otevřený zdroj z tohoto běhu ji nedokládá); od 25. 7. 2026 text netvrdí ani „pod vrcholem" — viz DATA-15 nález 6.
  Dotáhnout ručním během: hero fotka (oční výběr z 38 kandidátů), lůžka, otvíračka, občerstvení, kontakty (telefon), historie (web má /history/), obec. NAVÍC: rozřešit polohu budovy vůči vrcholu — otevřít szrenica.pl a dohledat v OSM uzel natural=peak pro Szrenici; do té doby se poloha vůči vrcholu netvrdí ani jedním směrem.
  DATA-15 (jazykový audit 25. 7. 2026, čtvrtá dávka): nezávislý agent vrátil deset nálezů, všech deset přijato. Jádro dávky je jedno a totéž: soubor sbíral doplňková fakta z katalogového podkladu ChatGPT, ale próza je vydávala za přečtený web schroniska, ačkoli hlavička souboru přiznává „obsah stránek NEotevřen". (1) „Nabídka na webu uvádí kapacitu devadesáti lůžek" — číslo je z katalogu s odkazem na szrenica.pl/oferta/, stránka otevřená nebyla; přepsáno na přiznaného prostředníka. Rozpor s vlastním komentářem nad blokem Nocleh („Kapacita nedoložena — nedomýšlet") tím zmizel. (2) Celá historická osa byla připsaná „historii na webu schroniska", ač overeniHistorie cituje katalog; přepsáno na „Podle externího katalogu chat, který se odvolává na stránku historie schroniska". (3) Souhrnná věta text[3] připisovala „prezentaci samotného schroniska" všechno kromě OpenStreetMap — tedy i to, co nese jen katalog; opraveno. Byla to jediná věta, kde by se čtenář o prostředníkovi dozvěděl, a zastírala ho. (4) „web schroniska píše" a „Podle webu" u vrcholu, národního parku a tří set metrů od hranice — totéž, tvrzení nese zajimavosti[0] uvnitř katalogového bloku; přepsáno na „katalogový záznam odvolávající se na stránky schroniska". (5) „v západní části Krkonoš" vypuštěno — světovou stranu nenese žádný pramen v souboru. Korpusová vada, viz BACKLOG. (6) NEJZÁVAŽNĚJŠÍ: text tvrdil, že „OpenStreetMap klade budovu do výšky 1 361 metrů těsně pod vrchol". OpenStreetMap ale u budovy nese jen lat, lng a výšku; „těsně pod vrchol" byl náš vlastní odečet 1361 od 1362, přičemž 1362 je výška HORY z katalogové zajímavosti a 1361 výška BUDOVY z mapových dat — dvě různé veličiny. Rozdíl jednoho metru mezi nimi není rozpor pramenů a formulace „úplně neodpovídají" ho jako rozpor prodávala. Přepsáno tak, aby text řekl, co který pramen opravdu nese, a přiznal, že rozřešené to nemáme. (7) Perex si potichu vybíral stranu téhož rozporu („pod vrcholem Szrenice"), ač text o odstavec dál rozpor přiznává — perex nově stranu nevybírá („na Szrenici"). (8) Slovo „redakce" v text[1] vypuštěno; domácí styl ho připouští jen v závěrečném odstavci, kde zůstává. (9) zdroje[1] slibovalo, že „nabídka" a „historie" jsou z titulků — z titulků je doložen jen název, město a existence podstránek; popis opraven a přidána položka pro katalogový podklad (bez url, vzor hotel-spindlerova-bouda). (10) zajimavosti[0].zdroj jmenoval „web chaty (szrenica.pl)", ač jde o jedinou položku katalogového bloku, která prostředníka zamlčovala — doplněn.
  DATA-15 přesah dávky: nález 6 a nález 4 mají druhou oběť — schronisko-pttk-na-hali-szrenickiej.yaml, přepsané v téže dávce o pár hodin dřív, převzalo obě vady do věty o sousedním Schronisku Szrenica („mapová data ho kladou těsně pod vrchol Szrenice, kdežto jeho vlastní web píše, že je přímo na vrcholu"). Opraveno tamtéž ve stejném běhu, aby oba profily o téže budově netvrdily každý něco jiného.
  ZAMÍTNUTO (agent si to zamítl sám, ověřeno proti souboru): „nad Szklarskou Porębou" bez pole obec je doložené komentářem bloku Lokace i titulkem v overeniProvoz; „na hoře Szrenica" a „základna pro obě strany hřebene" nese doslova zajimavosti[0] s vlastním polem zdroj; „objekt vznikl o rok později" proti rokVzniku 1922 a milníku 1921 není rozpor; „Na vlastních stránkách objekt vystupuje jako Schronisko górskie Szrenica" obstálo, protože pramenem je opravdu titulek vlastního webu; přiznání, co nevíme, je poctivost; typ obsluhovana je odvozený z OSM tagu a próza obsluhu netvrdí; připsání OpenStreetMap je podle ODbL povinné; chybějící hero fotka je evidence k dotažení.
