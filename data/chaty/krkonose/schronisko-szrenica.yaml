# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko na Szrenici nad Szklarskou Porębou, s ubytováním hostelového
  typu. Podrobnosti provozu doporučujeme před cestou ověřit na webu
  schroniska.
text:
  - >-
    Schronisko Szrenica stojí na hoře Szrenica nad Szklarskou Porębou.
    U polohy si prameny úplně nesedí: OpenStreetMap uvádí u budovy
    nadmořskou výšku 1 361 metrů, kdežto katalogový záznam odvolávající se
    na stránky schroniska mluví o stavbě přímo na vrcholu. Každý z nich
    přitom nejspíš měří něco jiného — výšku budovy proti výšce hory —
    a rozřešené to nemáme. Týž záznam klade schronisko do Karkonoszského
    národního parku a asi tři sta metrů od české hranice, takže může
    sloužit jako základna pro obě strany hřebene.
  - >-
    Podle externího katalogu chat, který se odvolává na stránku historie
    schroniska, začala stavba v roce 1921 a objekt vznikl o rok později.
    V roce 1972 ho poškodil požár, který zasáhl zhruba sedmdesát procent
    střechy. Znovu otevřené, tentokrát v rukou soukromého vlastníka, je od
    roku 1992. Celou tuhle časovou osu přebíráme z jediného pramene, samu
    stránku s historií jsme zatím neotevřeli a jiným pramenem ji doloženou
    nemáme.
  - >-
    Na vlastních stránkách objekt vystupuje jako Schronisko górskie Szrenica
    a ubytování na nich sám označuje jako hostel; hostelový režim tu proto
    přiznáváme, přesnější charakter provozu upřesníme po ověření. Externí
    katalog chat uvádí kapacitu devadesáti lůžek s odkazem na nabídku
    schroniska; samotnou stránku jsme zatím neotevřeli, takže to číslo
    bereme jako nepotvrzené. Podobu občerstvení ani otvírací dobu doloženou
    nemáme a stejně tak nevíme, kdo schronisko provozuje dnes.
  - >-
    Souřadnice a výška pocházejí z OpenStreetMap, ostatní údaje z externího
    katalogu chat, který se odvolává na stránky schroniska; samotné stránky
    jsme zatím neotevřeli a redakce údaje neověřila vlastní návštěvou ani
    dotazem. Před cestou doporučujeme potvrdit si otvírací dobu a volná
    lůžka přímo u schroniska.

