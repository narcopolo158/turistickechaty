# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata s restaurací v Dolním Dvoře v Krkonoších. Podle vlastního webu tu vaří
  pro všechny bez rozdílu, tedy i pro hosty, kteří v chatě nespí. Nadmořskou
  výšku ani kapacitu lůžek web neuvádí.
text:
  - >-
    Chata U Jirky má adresu Dolní Dvůr 22, tedy přímo v obci Dolní Dvůr
    v Krkonoších. Nadmořskou výšku web chaty neuvádí, takže ji neuvádíme ani
    my — a ze stejného důvodu si netroufáme popisovat, jak vysoko a v jakém
    terénu chata stojí. Souřadnice máme z OpenStreetMap a v terénu je nikdo
    neověřil.
  - >-
    Chata nabízí ubytování a podle vlastního webu přijímá hosty v zimě
    i v létě; jako výslovně celoroční svůj provoz nepopisuje. Součástí je
    restaurace s domácí kuchyní — web uvádí, že se tu vaří pro všechny bez
    rozdílu, tedy i pro ty, kdo v chatě nespí.
  - >-
    Víc zatím poctivě říct neumíme. Kapacitu ubytování ani přesnou otvírací
    dobu restaurace se nám z dostupných pramenů doložit nepodařilo a redakce
    je neověřila vlastním dotazem, proto obojí doporučujeme před cestou
    potvrdit přímo u chaty.

