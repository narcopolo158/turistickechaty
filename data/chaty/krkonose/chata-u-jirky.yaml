interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/chata-u-jirky.yaml (DATA-01) po křížovém ověření DATA-03 (sessions 24 a 27, web načten 20. 7. 2026) a rozhodnutí Michala (chat 20. 7. 2026 — klíč: restaurace pro veřejnost doložena → ZAŘADIT; původní verdikt „nezařazovat" tím revidován).
