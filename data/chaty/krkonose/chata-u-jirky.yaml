interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/chata-u-jirky.yaml (DATA-01) po křížovém ověření DATA-03 a rozhodnutí Michala (chat 20. 7. 2026 — klíč: restaurace pro veřejnost doložena → ZAŘADIT; původní verdikt „nezařazovat" tím revidován).
  Data dotažena z webu chataujirky.cz 21. 7. 2026 (session 30, ruční běh, WebFetch se schválením Michala). Metoda ověření: přímá citace z oficiálního webu → verified: false (kontakty, občerstvení „Vaříme pro všechny – bez rozdílu"). verified: false u lokace (GPS z OSM; adresa z webu potvrzena, výška web neuvádí) a nocleh (kapacita nedoložena).
  Provozovatel dle OSM: Multi Store s.r.o.
  NEDOHLEDÁNO (web neuvádí): nadmořská výška, kapacita lůžek, přesná otvírací doba restaurace, explicitní sezóna.
  DATA-15 krok (b), 2. dávka (25. 7. 2026), čtyři jazykové vady opraveny: perex tvrdil „vaří pro všechny bez rozdílu" v uvozovkách a bez připsání, ačkoli text[1] to správně připisuje webu (a citace navíc neseděla doslovně — web má „Vaříme pro všechny – bez rozdílu"); „neubytovaní kolemjdoucí" podsouvali průchozí turistiku, ačkoli žádný pramen chatu neklade na trasu; „na východním okraji Krkonoš" (perex i text[0]) bylo odvozené z adresy, nikde nedoložené a navíc sporné (Dolní Dvůr leží východně od Špindlerova Mlýna, ale západně od Pece a Janských Lázní); „údolní chata", „v údolí obce" a „nejde o hřebenovou boudu" charakterizovaly terén v témže odstavci, který přiznává, že výšku web neuvádí. Nově próza tvrdí jen adresu a explicitně říká, proč terén nepopisuje.
