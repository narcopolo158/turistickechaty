text:
  - >-
    Chata U Jirky stojí na adrese Dolní Dvůr 22, v údolí obce na východním
    okraji Krkonoš — nejde o hřebenovou boudu, v průvodci ji vedeme poctivě
    jako údolní chatu s restaurací.
  - >-
    Restaurace s domácí kuchyní je otevřená hostům i neubytovaným
    kolemjdoucím a chata funguje celoročně. Podrobnosti k ubytování a
    otvírací době doporučujeme ověřit na webu chaty.

