perex: >-
  Údolní chata s restaurací v Dolním Dvoře na východním okraji Krkonoš.
  Domácí kuchyně tu vaří „pro všechny bez rozdílu" — tedy i pro neubytované
  kolemjdoucí.
text:
  - >-
    Chata U Jirky stojí na adrese Dolní Dvůr 22, v údolí obce na východním
    okraji Krkonoš — nejde o hřebenovou boudu, v průvodci ji vedeme poctivě
    jako údolní chatu s restaurací.
  - >-
    Restaurace s domácí kuchyní je podle webu otevřená „pro všechny bez
    rozdílu", tedy hostům i neubytovaným, a chata přijímá návštěvy v zimě
    i v létě. Přesnou otvírací dobu a kapacitu ubytování doporučujeme ověřit
    na webu nebo telefonicky.

