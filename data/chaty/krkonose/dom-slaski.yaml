perex: >-
  Schronisko na Równi pod Śnieżką ve výšce 1400 m — dle titulků „poslední
  zastávka před výstupem na Śnieżku". Podrobnosti provozu doporučujeme před
  cestou ověřit na webu schroniska.
text:
  - >-
    Dom Śląski (v části zdrojů Śląski Dom) stojí na náhorní pláni Równia pod
    Śnieżką v nadmořské výšce 1400 m, u hlavního tahu na nejvyšší horu
    Krkonoš. Titulek článku karpaczskiarena.pl mluví o „schronisku
    s bouřlivou historií" — samotnou historii doplníme po redakčním ověření.
  - >-
    Nocleh, občerstvení ani otvírací dobu zatím nemáme doloženy; před cestou
    je doporučujeme ověřit přímo na webu schroniska.

