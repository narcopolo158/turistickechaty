# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko na Równi pod Śnieżką ve výšce 1 400 m, v katastru Karpacze.
  Údaje pocházejí z OpenStreetMap a z titulků výsledků vyhledávání; samotné
  stránky jsme zatím neotevřeli, a tak podrobnosti provozu doporučujeme před
  cestou ověřit na webu schroniska.
text:
  - >-
    Dom Śląski stojí na Równi pod Śnieżką v nadmořské výšce 1 400 metrů,
    v katastru Karpacze. Souřadnice, výška i obec pocházejí z OpenStreetMap,
    polohu na Równi pod Śnieżką nesou titulky polských turistických portálů.
    Podobu terénu ani to, jakou roli schronisko hraje při výstupu na Śnieżku,
    jsme z dosažitelných pramenů nedoložili. Část zdrojů obrací pořadí slov
    v názvu na Śląski Dom a v titulku jednoho z portálů se objevuje ještě
    jméno Schronisko „Pod Śnieżką".
  - >-
    Historii máme z externího katalogu, který se odvolává na historickou
    stránku schroniska; samotný web jsme zatím neotevřeli. Současná budova
    podle něj vznikla v roce 1922, roku 1951 objekt přešel do správy PTTK
    a v roce 2007 ho koupil Karol Warecki. Všechny tři letopočty proto zatím
    vedeme jako nepotvrzené.
  - >-
    Kapacitu 58 lůžek přebíráme z téhož externího katalogu, který se odvolává
    na prezentaci schroniska — tu jsme ale sami neotevřeli, takže číslo stojí
    na prameni z druhé ruky. Nezávisle nocleh doložený nemáme: v přehledu
    ubytování, který vede PTTK, jsme objekt nenašli. Kdo schronisko provozuje
    dnes, doložené nemáme — posledním doloženým krokem ve vlastnictví je
    zmíněná koupě z roku 2007. Podobu občerstvení ani otvírací dobu se nám
    doložit nepodařilo.
  - >-
    Údaje na této stránce pocházejí z OpenStreetMap, z druhé ruky z prezentace
    schroniska a z titulků turistických portálů a redakce je zatím neověřila
    vlastním dotazem ani návštěvou. Před cestou doporučujeme ověřit si přímo u
    schroniska nocleh, otvírací dobu i nabídku občerstvení.

