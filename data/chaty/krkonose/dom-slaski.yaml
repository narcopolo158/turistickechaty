interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/dom-slaski.yaml (DATA-01) po DATA-03 (s23 WebSearch + rozhodnutí Michala 20. 7. 2026: ✅ en bloc). Bezobslužná session 31 (21. 7.) — obsah webů NEotevřen, jen titulky.
  PROVOZOVATEL: v pttk.pl přehledu ubytování chybí (s23) — kdo objekt provozuje, rozhodne otevření webu (ruční běh). Proto nevyplněn nocleh (bez PTTK accommodations dokladu) ani žádný PTTK statut v textu.
  Sousedí s českou Luční boudou přes Obří sedlo — až budou trasy (DATA-06), zvážit vzájemný odkaz.
  Dotáhnout ručním během: nocleh + kapacita, občerstvení, otvíračka, historie („burzliwa historia" dle titulku karpaczskiarena.pl), lepší hero (současný má jen 1280×960).
  DATA-15 krok (b), 2. dávka (25. 7. 2026), čtyři vady opraveny: (1) perex nesl v uvozovkách citát „poslední zastávka před výstupem na Śnieżku", ačkoli žádný titulek v souboru tuhle formulaci nemá a obsah stránek jsme neotevřeli — šlo o uvozovky bez doloženého originálu, odstraněno; (2) totéž tvrzení v text[0] navíc dělalo z objektu pořadové prvenství na trase, které overeniLokace nenese (dokládá jen polohu na Równi pod Śnieżką); (3) „na náhorní pláni" byl náš překlad významu polského toponyma, ne doložený popis terénu; (4) text[2] připisoval kapacitu 58 lůžek „prezentaci schroniska", ačkoli ji nikdo neotevřel a číslo stojí na externím katalogu — ten je nově veden i v zdroje a próza přiznává, že v přehledu ubytování PTTK objekt chybí (rozpor s komentářem u sekce Nocleh, který říká „nedomýšlet", zatímco kapacita publikovaná byla).
