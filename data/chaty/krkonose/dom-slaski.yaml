# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko na Równi pod Śnieżką ve výšce 1400 m — dle titulků „poslední
  zastávka před výstupem na Śnieżku". Podrobnosti provozu doporučujeme před
  cestou ověřit na webu schroniska.
text:
  - >-
    Dom Śląski stojí na náhorní pláni Równia pod Śnieżką v nadmořské výšce 1
    400 metrů, v katastru Karpacze. Souřadnice, výška i obec pocházejí z
    OpenStreetMap, polohu na Równi pod Śnieżką uvádějí titulky polských
    turistických portálů — podle nich jde o poslední zastávku před výstupem na
    Śnieżku. Část zdrojů obrací pořadí slov v názvu na Śląski Dom a v titulku
    jednoho z portálů se objevuje ještě jméno Schronisko „Pod Śnieżką".
  - >-
    Historii má profil převzatou z historické stránky schroniska, ale jen
    zprostředkovaně — samotný web jsme zatím neotevřeli. Současná budova podle
    něj vznikla v roce 1922, roku 1951 objekt přešel do správy PTTK a v roce
    2007 ho koupil Karol Warecki. Všechny tři letopočty proto zatím vedeme
    jako nepotvrzené.
  - >-
    Kapacitu 58 lůžek nese údaj převzatý z prezentace schroniska, i ten ale
    máme z druhé ruky. Kdo objekt provozuje dnes, doložené nemáme — posledním
    doloženým krokem ve vlastnictví je zmíněná koupě z roku 2007. Podobu
    občerstvení ani otvírací dobu se nám doložit nepodařilo.
  - >-
    Údaje na této stránce pocházejí z OpenStreetMap, z druhé ruky z prezentace
    schroniska a z titulků turistických portálů a redakce je zatím neověřila
    vlastním dotazem ani návštěvou. Před cestou doporučujeme ověřit si přímo u
    schroniska nocleh, otvírací dobu i nabídku občerstvení.

