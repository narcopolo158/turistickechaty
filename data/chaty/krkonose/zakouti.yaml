# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Klasická horská chata ve Vítkovicích v Krkonoších — devět pokojů se
  společným sociálním zařízením a pětadvacet lůžek. Stravování se podle
  firemního zápisu domlouvá k pobytu, snídaně nebo polopenze; a pozor,
  Chata V Zákoutí v Harrachově je úplně jiný dům.
text:
  - >-
    Chata Zákoutí stojí ve Vítkovicích v Krkonoších, v údolí pod
    západními hřebeny. Nadmořskou výšku neuvádíme — živé prameny ji
    nenesou a číslo bez pramene nepřebíráme. Hned na úvod také jedno
    varování při hledání: „Chata V Zákoutí" v Harrachově je jiný objekt,
    jména si jsou blízká, domy ne.
  - >-
    Katalog chatu popisuje doslova jako „klasickou horskou chatu
    s devíti pokoji se společným sociálním zařízením" a firemní zápis
    počítá pětadvacet lůžek — dům pro rodiny a menší skupiny, žádný
    hotel. Stravování se podle téhož zápisu „nastavuje, jak budete
    potřebovat" — snídaně, polopenze; vaří se tedy hostům k pobytu
    a veřejné občerstvení pro kolemjdoucí doloženo není.
  - >-
    Vlastní web chaty je mrtvý — adresy z katalogů vracejí chybu — a tak
    stavíme na katalogu a firemním zápisu. O historii domu jsme
    v otevřených pramenech nenašli jediný doložený údaj; jakmile se
    pramen objeví, nebo se provozovateli dovoláme, doplníme ho.
  - >-
    Údaje pocházejí z katalogu České hory a z firemního zápisu;
    vlastním dotazem jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

