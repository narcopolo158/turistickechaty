# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata přímo na sjezdovce Hnědý vrch nad Pecí pod Sněžkou, jejíž příběh
  začíná u chovatelů dobytka Tippeltových: krátce po roce 1900 tu zřídil obchodník s máslem Johann Hofer první hostinské
  pokoje a od roku 1945 nese dům jméno po Smetanovi. Dnes tu běží
  restaurace s barem, jídelna i letní zahrádka.
text:
  - >-
    Chata Smetánka leží podle krajského katalogu přímo na sjezdovce
    Hnědý vrch ve skiareálu Pece pod Sněžkou — Kudy z nudy měří sto
    padesát metrů od dolní stanice vleku. Nadmořskou výšku neuvádíme
    schválně: jediný katalog, který ji nese, si na dvou vlastních
    stránkách protiřečí, a tak raději necháváme pole prázdné.
  - >-
    Historii domu přebíráme z Kudy z nudy s připsáním: v prosté chalupě
    dlouho hospodařili chovatelé dobytka Tippeltové, krátce po roce 1900
    tu Johann Hofer, obchodník s horským máslem, zřídil na půdě hostinské
    pokoje — a právě tímhle okamžikem se z chalupy stala bouda sloužící
    hostům. V roce 1945 pak nový správce Karel Lefler dům přejmenoval
    na Smetanovu boudu; dnešní Smetánka je zdrobnělina téhož jména.
  - >-
    Dnes chata podle krajského katalogu nabízí jídelnu pro pětapadesát
    lidí, restauraci s barem pro třicet a letní zahrádku; Kudy z nudy
    chválí českou kuchyni s velkými porcemi. Na počtu lůžek se prameny
    neshodnou — padesát s přistýlkami proti pětapadesáti — v přehledu
    proto vedeme opatrnější nižší číslo. A jestli restaurace obslouží i turistu, který jen
    schází ze svahu, prameny neříkají; netvrdíme to.
  - >-
    Údaje pocházejí z krajského katalogu a z Kudy z nudy; vlastním
    dotazem u provozovatele jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

