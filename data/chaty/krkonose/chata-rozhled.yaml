# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Roubená chata nad Strážným ve výšce 1 207 metrů, v klidové zóně
  národního parku na Předních Rennerovkách. Sama o sobě říká, že je
  jednou z posledních zachovaných roubenek ve východních Krkonoších.
  Nabízí nocleh s domácí penzí a celodenní bufet — komu přesně bufet
  slouží, se nám ale doložit nepodařilo.
text:
  - >-
    Chata Rozhled stojí nad obcí Strážné v nadmořské výšce 1 207 metrů —
    to číslo se vzácně shoduje ve všech pramenech, které máme, včetně
    rytiny turistické známky. Katalog České hory ji klade do chráněné
    klidové zóny Krkonošského národního parku na Přední Rennerovky. Sama
    o sobě chata na svém webu píše, že je jednou z posledních roubených
    zachovaných chaloupek ve východních Krkonoších; jak je stará, ovšem
    neříká, a žádný letopočet její historie jsme jinde doložit nedokázali.
  - >-
    Uvnitř popisuje vlastní web původní dřevěnou jídelnu s kachlovými
    kamny, jednoduché domácí prostředí a typicky česká jídla; ubytování
    je s polopenzí nebo plnou penzí domácího typu. K tomu chata uvádí
    bufet s nápoji a sladkostmi v provozu po celý den. Jednu podstatnou
    věc ale žádný pramen neříká: zda bufet obslouží i turistu, který
    v chatě nespí. Nechceme ji domýšlet — kdo jde kolem, měl by počítat
    s tím, že jistotu občerstvení tu zatím slíbit neumíme.
  - >-
    Na kapacitě se prameny neshodnou způsobem, který stojí za zaznamenání:
    katalog České hory uvádí 26 lůžek, server cztip 55 — a jeho vlastní
    rozpis pokojů přitom dává jen 24. Vlastní web chaty číslo neuvádí
    vůbec, a tak kapacitu neuvádíme ani my.
  - >-
    Přístup je v létě možný autem až k chatě;
    v zimě se nechává vůz na hlídaném parkovišti ve Strážném a hosty
    vozí k chatě rolba, zhruba tři kilometry. Souřadnice chaty zatím
    nemáme doloženy z žádného pramene, proto ji na mapě neukazujeme —
    raději prázdné místo než odhad. Všechny údaje pocházejí z webu chaty
    a z katalogů a vlastním dotazem jsme je zatím neověřili.

