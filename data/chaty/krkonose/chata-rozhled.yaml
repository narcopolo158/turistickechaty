interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/chata-rozhled.yaml (RUČNÍ kandidát — zpětné dohledání přes známku č. 14) 26. 7. 2026 na základě rozhodnutí Michala o rozšíření klíče zařazení (DATA-25). Verdikty „zůstává kandidátem" z 25. 7. a z rána 26. 7. (bufet doložen, veřejnost ne) tím revidovány — materiál beze změny, změnil se klíč.
  NEZAMĚŇOVAT s „Jiráskovou turistickou chatou s rozhlednou" na Kladském pomezí (Náchodsko) — jiný objekt, vyloučen už v kandidátovi.
  ROZPORY vedené otevřeně: kapacita 26 × 55 (× rozpis 24) — nic nezapsáno; veřejnost bufetu nedoložena (otázka na telefonát DATA-04: „obsloužíte i neubytovaného?").
  GPS CHYBÍ — objekt nebyl v OSM exportu; doplnit s pramenem (OSM tagování prověřit, případně mapy). Bez GPS zatím ani fotokandidáti DATA-02.
  Provozovatel: titulek Hotely Penziony uvádí „Zdenka Štroblová - Chata Rozhled" — stránka neotevřena, nepřebráno.
  Známka č. 14: obrázek připraven v data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c14-chata-rozhled.png → nasadit přes DATA-13 (public/znamky/chata-rozhled.png + manifest); katalog znamky-vizitky.csv řádek pro č. 14 NEMÁ (kandidát byl dohledán až po jeho vzniku) — doplnění katalogu vedeno v DATA-22, bez něj kartu sběratelských míst data10 nevyrobí.
