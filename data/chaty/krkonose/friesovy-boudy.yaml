    udalost: >-
      Josef Hoffman získal licenci k provozování pohostinství; hostinec měl pět
      až šest hostinských pokojů
  - rok: 1945
    udalost: >-
      V červnu byla rodina hostinského odsunuta, koncem podzimu bylo stavení
      přiděleno českému podnikateli jako hostinec a ubytovna
  - rok: 1948
    udalost: >-
      Po tomto roce byla budova vyvlastněna a stala se majetkem pražských
