# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel ve Strážném (1 217 m) s vlastním minipivovarem. Jméno nese po
  rodu Friesů — vrchlabský urbář k roku 1676 připomíná Jiřího Friese, jemuž
  tu bylo povoleno postavit boudu, dnešní budova je ale až z roku 1987.
  Ubytuje hosty ve dvoulůžkových pokojích a apartmánech; kolik jich pojme,
  uvádí hlavní pramen na dvou místech různě. Restaurace má 90 míst včetně baru
  a klubu, k tomu je tu wellness se saunou, parní lázní a bazénem.
text:
  - >-
    Friesovy boudy stojí ve výšce 1 217 m n. m. nad Strážným, na adrese
    Strážné 95 v Královéhradeckém kraji. Nadmořskou výšku uvádí Kudy z nudy
    shodně se starším katalogovým podkladem, ze kterého vycházíme; tentýž
    podklad řadí objekt do centrálních Krkonoš, druhým pramenem to doložené
    nemáme. Rozsahem služeb jde o horský hotel a pod tímto označením ho vede
    i Kudy z nudy — starší podklad ho ovšem vedl mezi horskými boudami
    a rozhodnutí, které z obou označení použít, je naše.
  - >-
    Historie bud sahá do sedmnáctého století, ale pramen, ze kterého ji máme,
    stojí za zmínku: vypráví ji web sousední boudy, ne hotelu samotného,
    a neuvádí, z čeho čerpá. Podle něj je první zmínka o Friesových boudách ve
    vrchlabském urbáři, kde se k roku 1676 připomíná Jiří Fries, jemuž tu bylo
    povoleno postavit boudu. Do roku 1882 patřily boudy do katastru Dolního
    Dvora, potom přešly pod Strážné, a k roku 1900 tu bylo registrováno sedm
    rodin Friesů. Tyhle údaje se ale týkají celé enklávy, ne domu, ve kterém
    dnes hotel sídlí.
  - >-
    Dům samotný měl osud pohnutější. Po požáru kolem roku 1910 ho znovu
    vybudoval Vinzenz Lahr z Klínovek, v roce 1921 ho koupil Josef Hoffman,
    přestavěl a přikoupil pozemky sousedního stavení; hospodářství pak čítalo
    pět hektarů luk, pět krav, jalovici a tažného koně. Roku 1935 Hoffman
    získal licenci k provozování pohostinství a hospoda s pěti až šesti
    hostinskými pokoji se stala oblíbeným místem usedlíků i hostů — k tanci
    tu hrávala Rennerova kapela. V červnu 1945 byla hostinského rodina
    odsunuta, koncem téhož podzimu připadlo stavení českému podnikateli jako
    hostinec a ubytovna a po roce 1948 bylo vyvlastněno ve prospěch pražských
    Škodových závodů. V roce 1987 byla budova kompletně zbourána a postavena
    znovu, blíž k lesu. Dům, do kterého dnes vejdete, je tedy stavba
    z osmdesátých let minulého století, i když jméno a místo jsou o tři století
    starší.
  - >-
    Spí se ve dvoulůžkových pokojích a apartmánech. V kapacitě si ale hlavní
    pramen protiřečí sám: text stránky Kudy z nudy mluví o 24 pokojích a 75
    lůžkách, kdežto údaje z hotelové klasifikace HotelStars uvedené na téže
    stránce o 21 pokojích a 66 lůžkách. Uvádíme tu proto obě čísla — potvrzené
    zatím není ani jedno. Ubytování má fungovat celoročně.
  - >-
    Restaurace pojme 90 hostů včetně baru a klubu a otevřeno má denně od 11:30 do 22:00. Kuchyně se podle téhož zdroje profiluje
    specialitami české domácí kuchyně „v moderním pojetí" a čepuje se tu pivo
    z vlastního minipivovaru, a to ve třech druzích: dvanáctistupňové světlé,
    třináctistupňový polotmavý speciál a čtrnáctistupňové polotmavé pivo typu
    Ale. K vybavení hotelu patří wellness s finskou saunou, parní lázní,
    bazénem a lehátky.
  - >-
    Zveřejněná denní otvírací doba odpovídá podniku otevřenému veřejnosti,
    výslovně to ale zdroj neuvádí; o Wi-Fi, platbě kartou ani lyžárně se
    dosažitelný pramen nezmiňuje. Rok vzniku u téhle boudy záměrně neuvádíme
    žádný: prameny nabízejí dva letopočty a ani jeden jím není — rok 1676
    patří celé enklávě a jinému člověku, rok 1987 je datem, kdy byla předchozí
    budova zbourána a postavena nová. Pozor je namístě i u jména. V enklávě
    stojí pod velmi podobným názvem dva různé domy, každý s vlastním
    provozovatelem, vlastním číslem popisným i vlastními internetovými
    stránkami, takže při rezervaci stojí za to zkontrolovat, u kterého z nich
    vlastně objednáváte. Všechny údaje pocházejí ze sekundárních pramenů —
    z Kudy z nudy, ze staršího katalogového podkladu a z webu sousední boudy —
    a redakce je zatím neověřila vlastním dotazem; před cestou proto
    doporučujeme potvrdit si kapacitu i otvírací dobu restaurace přímo
    u hotelu.
