# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel ve Strážném v centrálních Krkonoších (1 217 m) s vlastním
  minipivovarem. Ubytuje 75 hostů ve dvoulůžkových pokojích a apartmánech, má
  restauraci pro 90 hostů a wellness se saunou, parní lázní a bazénem. Nese
  turistickou známku č. 2049.
text:
  - >-
    Friesovy boudy stojí ve výšce 1 217 m n. m. nad Strážným v centrálních
    Krkonoších (adresa Strážné 95). Rozsahem služeb jde o horský hotel:
    ubytování nabízí 75 lůžek ve 24 pokojích — dvoulůžkových pokojích a
    apartmánech.
  - >-
    Restaurace pojme 90 hostů včetně baru a klubu a má otevřeno denně od 11:30
    do 22:00. Kuchyně se profiluje specialitami české domácí kuchyně v moderním
    pojetí a k jídlu se čepuje pivo z vlastního minipivovaru ve třech druzích:
    dvanáctistupňové světlé, třináctistupňové polotmavé a čtrnáctistupňové
    polotmavé typu Ale. K vybavení patří wellness s finskou saunou, parní lázní
    a bazénem.
  - >-
    Údaje pocházejí ze sekundárního zdroje (Kudy z nudy) — kapacitu, otvírací
    dobu i platnou webovou adresu je vhodné ověřit přímo u hotelu; zdroj sám
    uvádí u počtu pokojů a lůžek dva různé údaje.
