  Zaznamenané rozpory k dořešení při DATA-04: (1) 24 pokojů / 75 lůžek v textu
  Kudy z nudy vs. 21 pokojů / 66 lůžek v tamních údajích z klasifikace
  HotelStars — do profilu vzat text (75). K tomu nově třetí číslo: portál
  region-krkonose.cz uvádí „76 lůžek + 8 přistýlek". Nezapsáno, jen
  zaznamenáno — tři prameny, tři čísla, rozhodne až primární ověření.
  (2) doména friesovyboudy.cz vs. friesovy-boudy.cz — VYŘEŠENO, viz níže.

  DATA-21 (26. 7. 2026) — dva nálezy, oba přepisují dřívější tvrzení profilu.

  (a) HISTORIE DOPLNĚNA. Profil dosud tvrdil, že se historii doložit
  nepodařilo. Podařilo: friesovy-boudy.cz/historie nese devět datovatelných
  událostí od roku 1676 po přestavbu 1987, včetně jmen majitelů. Zapsáno do
  milniky, doslovná znění v overeniHistorie.source. rokVzniku ZÁMĚRNĚ
  NEVYPLNĚN — pramen odděluje historii enklávy (1676, Jiří Fries) od historie
  domu č. 95 a dnešní budova je z roku 1987; který z těch letopočtů je „rok
  vzniku", pramen neříká a my to nedomýšlíme. Slabina pramene je v tom, že
  neuvádí autora ani zdroj, ze kterého čerpá — je přiznaná v próze i v poli.

  (b) „ROZPOR V DOMÉNĚ" BYL OMYL. friesovyboudy.cz a friesovy-boudy.cz nejsou
  dvě adresy jednoho hotelu, ale weby dvou různých domů v téže enklávě:
  friesovyboudy.cz = Horský hotel Friesovy boudy, Strážné 95, Ing. Karel
  Polívka, tel. 724 230 884 (to je náš objekt, kontakty souhlasí);
  friesovy-boudy.cz = Bouda Matouš, Strážné 94, Matouš Jindra, IČO 74618881,
  tel. 607 727 201. Profil o tom mluvil ve veřejné próze jako o rozporu adres
  — opraveno na to, co skutečně platí, a čtenáři je to podáno prakticky (při
  rezervaci si ověřit, u kterého domu objednává).

  NÁVRH PRO MICHALA: založit Boudu Matouš jako kandidáta
  (data/kandidati/krkonose/bouda-matous.yaml). Je to samostatný ubytovací
  objekt v Krkonoších, který v korpusu není vůbec. Zda splní klíč zařazení
  (veřejné občerstvení), zjištěné nemám — kandidát je ale místo, kam to
  zapsat. Nezakládal jsem sám, aby korpus nerostl bez tvého vědomí.

  Wi-Fi ani další služby zdroj neuvádí — pole vědomě nevyplněna.

