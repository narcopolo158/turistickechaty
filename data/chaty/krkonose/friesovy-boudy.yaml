      Ve vrchlabském urbáři je připomínán Jiří Fries, jemuž zde bylo povoleno
      postavit boudu — první zmínka o celé enklávě, ne o dnešním domě
  - rok: 1882
    udalost: >-
      Do tohoto roku patřily boudy do katastru Dolního Dvora, pak přešly pod
