  - rok: 1900
    udalost: V enklávě je registrováno sedm rodin Friesů
  - rok: 1910
    udalost: >-
      Vinzenz Lahr z Klínovek znovu vybudoval usedlost po požáru (pramen uvádí
      „kolem roku 1910")
  - rok: 1921
    udalost: >-
      Dům koupil Josef Hoffman, přestavěl jej a přikoupil pozemky sousedního
      stavení; hospodářství čítalo pět hektarů luk, pět krav, jalovici
      a tažného koně
