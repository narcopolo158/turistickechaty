# ── Historie ──────────────────────────────────────────────────────────────
# rokVzniku ZÁMĚRNĚ NEVYPLNĚN, a to i po doplnění celé kroniky: rok 1927 je
# rok KOUPĚ boudy kolínským odborem, ne rok stavby. Kronika sama rok stavby
# NEUVÁDÍ a bouda v roce 1927 už stála (kupovala se hotová dřevěná stavba).
# Nedosazovat 1927 do rokVzniku — pole „Založeno" by lhalo.
milniky:
  - rok: 1927
    udalost: >-
      Kolínský odbor Klubu československých turistů koupil od Emila Kneifela
      dřevěný dům s loukou na Bobích loukách; smlouva podepsána 12. dubna
  - rok: 1938
    udalost: >-
      13. září sjela poslední lanovka do Janských Lázní a s ní odešel poslední
      host; po záboru pohraničí boudu obsadilo německé vojsko
  - rok: 1940
    udalost: >-
      3. května byla bouda podle nařízení pro sudetskou oblast překnihována do
      majetku německé správní společnosti
  - rok: 1943
    udalost: >-
      15. října boudu získala Marie Heckelová; zda koupí, nebo dědictvím,
      si kronika sama není jistá
  - rok: 1945
    udalost: >-
      19. května se boudy jménem Klubu českých turistů opět ujal zástupce
      krkonošské župy, zmocněný výnosem České národní rady z 11. května
  - rok: 1991
    udalost: >-
      3. července se bouda po 43 letech znovu stala majetkem Klubu českých
      turistů Kolín
  - rok: 1995
    udalost: V listopadu byla bouda prodána Marku Lukášovi z Prahy
  - rok: 1997
    udalost: Na počátku zimy byl hotel uveden do zkušebního provozu
  - rok: 2017
    udalost: Boudu od Marka Lukáše koupil Svatopluk Čech
overeniHistorie:
  source: >-
    Vlastní web boudy, stránka Historie (načteno 26. 7. 2026 — dřívější
    poznámka o nedostupnosti webu tím padá). Stránka otiskuje dobovou zprávu
    podepsanou „Zapsal Otakar Rykr – jednatel" a na ni navazující pokračování.
    Doslovné citace, o které se milníky opírají: „t. zv. Lesní bouda na svahu
    Liščí hory je na prodej"; „že její bratr, Emil Kneifel, usedlý na Bobích
    lukách, by svůj domek prodal"; „dne 13. března 1927 vydal na lyžích na
    Bobí louky"; „vypravili jsme se dne 27. března – Ing. Holpuch, já a moje
    žena"; „Konečně pak nadešel pro Odbor náš jistě památný den, úterý dne
    12. dubna 1927. K uzavření smlouvy…"; „Třebaže bouda je malá"; „dřevěný
    dům a 2 ha 1 m² louky"; „Dne 13. září 1938 sjela poslední lanovka do
    Janských Lázní a s ní opouštěl poslední host Kolínské boudy paní Antonie
    Rykrová"; „byla bouda sama překnihována dne 3. května 1940 do majetku
    ‚Aufbaufonds…'"; „že ji od něho koupila (nebo zdědila?) dne 15. října 1943
    Marie Heckelová, Němka z Tirol"; „výnosem České národní rady čís. 1789 ze
    dne 11. května 1945 zmocněn, aby se ujal opět svého vlastnictví… což se
    stalo… dne 19. května 1945"; „3. července 1991 se Kolínská bouda po 43
    letech opět stala majetkem Klubu českých turistů Kolín"; „byla Kolínská
    bouda prodána v listopadu 1995 ing. Marku Lukášovi z Prahy"; „Na počátku
    zimy roku 1997 byl hotel uveden do zkušebního provozu"; „V roce 2017
    Kolínskou boudu od Marka Lukáše koupil Svatopluk Čech".
    ROK STAVBY KRONIKA NEUVÁDÍ — ověřeno cíleným dotazem na text stránky,
    odpověď „ROK STAVBY NEUVEDEN". Proto rokVzniku zůstává prázdné.
    TŘI PASTI, DO KTERÝCH SE PŘI ČTENÍ TÉHLE STRÁNKY DÁ SPADNOUT (všechny
    jsem si nejdřív vyložil špatně a opravil až cíleným dotazem):
    (1) „Waldhaus p. Körbra u Horní Rokytnice n. J." NENÍ tato bouda — o jeho
    koupi odbor jednal v letech 1922 a 1925 a nekoupil ji;
    (2) „t. zv. Lesní bouda na svahu Liščí hory" také NENÍ tato bouda — byla
    nabízena, ale kronika píše, že byla zchátralá a „nebylo tudíž prozatím
    o koupi vyjednáváno"; předchozí jméno koupené boudy kronika neuvádí;
    (3) 27. března a 12. dubna 1927 nejsou dvě verze téhož data, nýbrž dvě
    různé události — výprava za Kneifelem a podpis smlouvy.
    Chybí i rok, kdy klub boudu po roce 1945 ztratil: kronika ho neuvádí,
    říká jen „po 43 letech" (což by ukazovalo na rok 1948, ale to už by byl
    náš počet, ne údaj pramene — nedopočítáváno).
    POZOR NA POVAHU PRAMENE: jde o vlastní web provozovatele, byť otiskuje
    dobový zápis jednatele; nezávisle (archiv, literatura) neověřeno. DATA-04.
    verified:false
  verified: false
  checked: '2026-07-26'

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Velká horská bouda hotelového typu na Lučinách nad Pecí pod Sněžkou (1 117 m),
  na turistické stezce k Černé hoře. Jméno má po kolínských turistech, kteří ji
  koupili v roce 1927 — kdy ji ale někdo postavil, neví ani její vlastní
  kronika. Ubytuje kolem stovky hostů, prameny se v přesném čísle liší, a má
  restauraci s terasou, vyhřívaný bazén, whirlpool a saunu.
text:
  - >-
    Kolínská bouda stojí ve výšce 1 117 m n. m. na Lučinách nad Pecí pod
    Sněžkou, na turistické stezce mezi Pecí a Černou horou; adresou patří k
    Peci pod Sněžkou, čp. 319, a podle Kudy z nudy leží na území Krkonošského
    národního parku. Polohu na Lučinách, umístění na stezce i nadmořskou výšku
    uvádí archivní prezentace serveru České hory.
  - >-
    Své jméno nese bouda po kolínských turistech. Kolínský odbor Klubu
    československých turistů sháněl vlastní chatu v horách už od roku 1922 —
    jednal tehdy a znovu v roce 1925 o Waldhausu u Horní Rokytnice a zvažoval
    i zchátralou Lesní boudu na svahu Liščí hory, na obojí ale nedošlo. Až
    v březnu 1927 se předseda odboru Ing. Holpuch dozvěděl, že svůj domek na
    Bobích loukách by prodal jistý Emil Kneifel; třináctého března tam dojel
    na lyžích a hned začal vyjednávat. Smlouva byla podepsána v úterý
    12. dubna 1927 a odbor koupil, jak píše jeho vlastní zápis, malý dřevěný
    dům a dva hektary louky.
  - >-
    Dvacáté století s boudou pořádně zametlo. Třináctého září 1938 sjela
    poslední lanovka do Janských Lázní a s ní odjel poslední host; po záboru
    pohraničí boudu obsadilo německé vojsko, v květnu 1940 ji úřady
    překnihovaly do majetku německé správní společnosti a na podzim 1943
    přešla na Marii Heckelovou — jestli ji koupila, nebo zdědila, si kronika
    sama není jistá. Devatenáctého května 1945 se boudy jménem Klubu českých
    turistů opět ujal zástupce krkonošské župy. Pak ale v líčení následuje
    mezera: majetkem kolínského klubu se bouda znovu stala třetího července
    1991, „po 43 letech" — kdy a jak ji klub mezitím ztratil, kronika
    neuvádí.
  - >-
    V listopadu 1995 přešla bouda do soukromých rukou, koupil ji Marek Lukáš
    z Prahy, a na počátku zimy 1997 byl objekt uveden do zkušebního provozu
    už jako hotel; v roce 2017 ho od Marka Lukáše koupil Svatopluk Čech.
    Celý tenhle výčet ovšem stojí na jediném prameni — na kronice, kterou
    zveřejňuje sama bouda. Otiskuje sice dobový zápis jednatele odboru
    Otakara Rykra, což je pramen slušný, nezávisle ověřený ale není. A rok
    vzniku v něm nenajdete: kolínští turisté v roce 1927 kupovali dům, který
    už stál, a jak dlouho stál, nikdo nezapsal.
  - >-
    Rozsahem služeb má objekt blíž k hotelu než ke skromné boudě — Kudy z nudy
    ho ostatně vedou pod názvem Hotel Kolínská bouda, kdežto starší katalogový
    podklad, ze kterého vycházíme, ho řadil mezi horské boudy; které
    z obou označení použít, je rozhodnutí naše. Podle Kudy z nudy ubytuje až
    102 hostů v pokojích pro dva až šest lidí, z nichž každý má vlastní WC
    a sprchu; kolik je kterých velikostí, zdroj neuvádí. Archivní prezentace
    serveru České hory přitom uvádí sto lůžek, takže ani kapacita není úplně
    jistá.
  - >-
    Provoz je podle Kudy z nudy celoroční a restaurace má otevřeno každý den
    od půl jedenácté dopoledne do desáté večer; v létě i v zimě k ní patří
    terasa se slunečním posezením. Zveřejněná denní otvírací doba i terasa
    odpovídají podniku otevřenému veřejnosti, výslovně to ale zdroj neuvádí. K
    vybavení patří bezplatná Wi-Fi v celém hotelu i v restauraci, vyhřívaný
    bazén o rozměrech 8 × 4 × 1,5 metru, whirlpool pro čtyři osoby a sauna;
    děti tu najdou hřiště a výběhy pro kozy a ovce. Podle serveru České hory je
    objekt nekuřácký.
  - >-
    Z přístupu je doložené jen to, že bouda stojí na turistické stezce mezi
    Pecí pod Sněžkou a Černou horou, jak uvádí server České hory; konkrétní
    pěší trasy, jejich délky ani možnost dojet autem doložené nemáme. Za
    zmínku stojí ještě jedna drobnost: kronika mluví o Bobích loukách, dnešní
    prameny o Lučinách. O přestěhování boudy kronika nic neříká, takže nejspíš
    jde o týž svah pod starším jménem — výslovně to ale nikde nestojí. Údaje
    o dnešním provozu vycházejí ze dvou sekundárních médií, z nichž jedno je
    archivní, a ze staršího katalogového podkladu; nic z toho jsme zatím
    neověřili vlastním dotazem ani návštěvou. Před cestou doporučujeme
    potvrdit si přímo u boudy otvírací dobu restaurace a to, zda je přístupná
    i neubytovaným.
