interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/kolinska-bouda.yaml (externí katalog ČR/SK,
  jistota B) v rámci master fronty Tier 1 (známka č.1719 + katalog). Vlastní web
  kolinskabouda.cz je ze sandboxu nedostupný.

  BEZ GPS — katalog souřadnice nenese a objekt není ani v OSM exportu DATA-01;
  doplnit z OSM přes Actions nebo ručně (nedomýšlet).

  Typ: nastaveno „horsky-hotel" (Kudy z nudy jej vede jako „Hotel Kolínská
  bouda", 102 lůžek, bazén, whirlpool, sauna) — externí katalog jej řadil jako
  „horskou boudu"; rozhodnutí redakce, ke zvážení.

  Zaznamenaný rozpor: kapacita 102 (Kudy z nudy) vs. 100 lůžek (České hory,
  archivní prezentace).

  DATA-15 (jazykový audit 25. 7. 2026, třetí dávka): opraveno šest vad prózy.
  (1) Doména v próze byla skloňovaná („na Českých horách", „Podle Českých
  hor") — kontrola audit-mech C; upraveno na první pád jako jméno pramene
  („archivní prezentace serveru České hory", „Podle serveru České hory").
  (2) Próza i pole pokoje[] vypočítávaly „dvou-, tří-, čtyř-, pěti-
  a šestilůžkové pokoje", ač zdroj (overeniNocleh) uvádí jen rozsah „v dvou- až
  šestilůžkových pokojích" — výčet tvrdí, že každá z těch velikostí existuje,
  což doložené není; nahrazeno rozsahem a doplněno, že poměr velikostí zdroj
  neuvádí. (3) „výběhy s kozami a ovcemi" tvrdí, že zvířata ve výběhu jsou —
  zdroj mluví o „výbězích pro kozy a ovce"; opraveno v text[2]
  i v zajimavosti[2]. (4) Perex tiše rozhodoval rozpor v kapacitě (102 dle Kudy
  z nudy vs. 100 dle Českých hor) tím, že uváděl jen „až 102 hostů" — nově
  přiznává, že se prameny v čísle liší, obě čísla nese text[1]. (5) text[3]
  tvrdil, že „nedoložený zůstává i přístup", ač text[0] hned uvádí polohu na
  turistické stezce mezi Pecí a Černou horou z Českých hor — upřesněno na
  konkrétní trasy, délky a příjezd autem, doložená část přiznána i s pramenem.
  (6) text[3] mluvil o profilu stojícím „na dvou sekundárních médiích", ač
  výška a klasifikace typu jdou i z katalogového podkladu — doplněn a přidán
  záznam do zdroje[] (bez url, veřejně citovatelné umístění nemá; vzor
  chata-rezek a dom-slaski). K tomu text[1] nově přiznává tichý rozpor v typu:
  katalog vedl objekt jako horskou boudu, profil má „horsky-hotel" —
  rozhodnutí bylo dosud jen v této poznámce.
  ZAMÍTNUTO jako nedorozumění auditu: „čp. 319" v próze není interní zápis —
  adresy nesou v próze i jiné profily korpusu a údaj je doložený
  v overeniLokace. Zamítnuto i tvrzení, že výčet wellness v text[2] nemá
  připsání — Kudy z nudy jsou připsané o dvě věty dřív, tedy uvnitř okna tří
  vět, se kterým pracuje kontrola audit-mech D. Zamítnuto i „nad Pecí pod
  Sněžkou" — plyne z doložené výšky a obce (vzor dvorska-bouda).

  K dotažení (DATA-04, verified:true): GPS, historie a rok vzniku, potvrdit
  otvírací dobu a veřejnou přístupnost restaurace, ceny. Hero fotka: kandidáti
  DATA-02. Známka č.1719 — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c1719-kolinska-bouda.png
  (číslo opravil Michal — původně jsem z rytiny četl 1716).
