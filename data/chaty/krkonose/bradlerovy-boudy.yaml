interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/bradlerovy-boudy.yaml (DATA-01/OSM) v rámci
  master fronty Tier 1 (známka č.394 + katalog ChatGPT + OSM).

  ROZHODNUTÍ PRO MICHALA — klíč zařazení: zdroje si u veřejné přístupnosti
  stravování odporují. KČT (provozovatel) píše o druhé jídelně „i pro průchozí
  turisty", vlastní web boudy naopak, že restaurace není veřejně přístupná a
  vaří se jen ubytovaným nebo na objednávku. Profil je zatím publikovaný a
  rozpor přiznává rovnou v textu; pokud primární ověření potvrdí variantu webu
  boudy, patří objekt podle klíče spíš mimo katalog (nebo do něj s výslovnou
  poznámkou jako Petrova bouda, kde je veřejná jen útulna).

  Další rozpor: noclehárny 10 + 12 lůžek (KČT) vs. jedna noclehárna pro 20 osob
  (web boudy); kapacita 88 vzata z KČT.

  DATA-21 (26. 7. 2026) — telefon NEZAPSÁN, a je to rozhodnutí, ne opomenutí.
  Katalogový podklad chtěl do kontakty.telefon zapsat řetězec
  „+420 602 322 032 (pouze doprava)", tedy číslo i s vysvětlivkou v závorce —
  próza uvnitř pole, které se propisuje do schema.org telephone (page.tsx
  ř. 145) a do řádku Telefon ve faktech (ř. 205). Ověřením na
  bradlerovy-boudy.cz/kontakt/ se číslo potvrdilo, ale potvrdila se i jeho
  povaha: web ho vede pod hlavičkou Domovník/řidič a doslova u něj píše
  „Telefonní kontakt slouží pouze pro informace o dopravě – nemá informace
  o ubytování, cenách apod." Zapsat ho do kontakty.telefon by znamenalo tvrdit
  čtenáři i vyhledávači, že tohle je linka na boudu; není. Číslo i doslovná
  výhrada jsou proto uloženy v overeniProvoz.source a veřejná próza teď říká,
  co se ví: jediné zveřejněné číslo je dopravní, ubytování se vyřizuje
  písemně. Zároveň tím padla dřívější věta „telefonní spojení na boudy neuvedl
  žádný z dosažitelných pramenů" — byla pravdivá k 24. 7., dnes už není,
  a je opravená.

  OTÁZKA PRO MICHALA (druhé telefonní pole): tenhle případ je zatím nejlepší
  exponát pro už dřív otevřenou otázku, jestli kontakty nemají dostat druhé,
  popsané telefonní číslo (např. telefonDalsi + popis role). Brádlerovy boudy
  mají číslo, které je pro čtenáře užitečné — jen k něčemu jinému, než na co
  by ho použil. Dokud takové pole není, číslo do dat nepatří a zůstává
  v ověřovací poznámce.

  K dotažení (DATA-04, verified:true): telefon na samotnou boudu (existuje-li
  vůbec nezveřejněný) a potvrzení, že dopravní číslo je opravdu jediné,
  veřejná přístupnost a otvírací doba stravování, provozní sezóna,
  potvrdit platby kartou (OSM tag říká jen hotově, tagy stárnou). Hero fotka:
  kandidáti DATA-02. Známka č.394 — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c394-bradlerovy-boudy.png.
