# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Komplex bud Klubu českých turistů na jižním svahu hlavního krkonošského
  hřebene nad Špindlerovým Mlýnem, v 1 156 m. Osídlení místa je doloženo
  k roku 1637, ten letopočet ale patří místu, ne dnešní boudě; hostinec tu
  podle klubu vznikl v roce 1890. Kapacitu 88 lůžek v pokojích i noclehárnách
  uvádí rovněž Klub českých turistů, vlastní web bud ale počítá noclehárny
  jinak.
text:
  - >-
    Brádlerovy boudy stojí na jižním svahu hlavního pohraničního hřebene nad
    Špindlerovým Mlýnem, ve výšce 1 156 metrů; adresa zní Špindlerův Mlýn 87
    a údaj o výšce uvádějí shodně Klub českých turistů, vlastní web bud i Kudy
    z nudy. Nejde o jediný dům, ale o komplex několika budov: k hlavní boudě patří Laura, dříve Lauerova bouda, a Severka, zatímco z
    Mléčné boudy zůstaly jen základy. Pro hlavní budovu se používá
    i jednotné číslo Brádlerova bouda, německý název objektu zní Bradlerbauden.
  - >-
    Osídlení místa je poprvé doloženo k roku 1637, ten letopočet ale patří
    místu, ne dnešní boudě — hostinec tu podle Klubu českých turistů vznikl až
    v roce 1890. Roku 1912 bouda vyhořela a byla znovu postavena, o dva roky
    později se jejím majitelem stal Johann Hollmann a v letech 1938 až 1945 ji
    vlastnila Kamila Hollmannová. Po roce 1945 přešly boudy pod Československý
    svaz tělesné výchovy a od počátku šedesátých let nesly jméno Fučíkovy
    boudy; původní název se vrátil v roce 1989. Celou tuhle časovou osu
    skládáme ze stránky chaty na webu Klubu českých turistů a z vlastních
    stránek bud, tedy ze sekundárních pramenů, které zatím nejsou potvrzené
    primárně.
  - >-
    Boudy dnes provozuje Klub českých turistů; podle něj běží nájemní smlouva
    do 1. dubna 2035 a členové klubu mají na ubytování slevu; jako správce se uvádí Petr Bárta. Ubytovací kapacita se uvádí jako 88 lůžek, z toho 66
    v pokojích po dvou až šesti lidech a zbytek ve společných noclehárnách.
    I tady se ale prameny rozcházejí: Klub českých turistů píše o dvou
    noclehárnách po deseti a dvanácti lůžkách, vlastní web bud o jedné
    noclehárně pro dvacet osob. Přihlásit se dá odpoledne mezi druhou a osmou, odhlásit do půl jedenácté
    dopoledne.
  - >-
    Zásadnější rozpor se týká stravování. Klub českých turistů jako
    provozovatel uvádí dvě jídelny, z nichž druhá je určena i průchozím
    turistům, a kuchyni známou velkými porcemi. Vlastní web bud naopak píše, že
    restaurace není veřejně přístupná běžným turistům a že se vaří jen
    ubytovaným v rámci polopenze nebo na objednávku, se snídaní mezi osmou
    a desátou hodinou a večeří mezi šestou a půl osmou večer. OpenStreetMap
    vede objekt jako restauraci s regionální kuchyní a venkovním posezením
    a toalety u ní označuje za přístupné se svolením majitele. Který z popisů
    platí, se z dosažitelných pramenů rozhodnout nedá a otvírací dobu
    stravování pro kolemjdoucí neuvádí ani jeden z nich.
  - >-
    Ze zázemí prameny jmenují saunu, úschovnu kol a lyží, dětský koutek
    a trampolínu; Klub českých turistů výslovně zmiňuje i možnost ubytování se
    psem. Kudy z nudy k tomu přidává vlastní lyžařský vlek, dětské hřiště
    s houpačkami a pískovištěm, jezírko a cvičnou horolezeckou stěnu. Podle dat
    z OpenStreetMap je v boudách bezdrátové připojení k internetu a kouří se
    venku; platit se má jen hotově, mapové záznamy ale stárnou, takže tenhle
    údaj bereme s rezervou.
  - >-
    Telefonní spojení stojí za zvláštní zmínku. Boudy zveřejňují jediné číslo
    a samy u něj upozorňují, že slouží pouze pro informace o dopravě a že
    o ubytování se na něm nedozvíte nic; je vedené jako číslo na domovníka
    a řidiče, ne na recepci. Přímou linku na boudu tedy neuvádíme, protože
    žádná zveřejněná není — ubytování se podle stránek bud vyřizuje písemně.
  - >-
    Všechny údaje na téhle stránce pocházejí ze sekundárních zdrojů a redakce
    je zatím neověřila vlastním dotazem ani návštěvou. Nedoložená zůstává
    provozní sezóna a hlavně není jasné, jestli se tu najíte, když u bud
    nespíte. Pokud jdete kolem a počítáte s obědem nebo se chystáte platit
    kartou, doporučujeme si to předem ověřit přímo u bud.

