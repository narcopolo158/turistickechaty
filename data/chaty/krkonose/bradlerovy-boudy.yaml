interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/bradlerovy-boudy.yaml (DATA-01/OSM) v rámci
  master fronty Tier 1 (známka č.394 + katalog ChatGPT + OSM).

  ROZHODNUTÍ PRO MICHALA — klíč zařazení: zdroje si u veřejné přístupnosti
  stravování odporují. KČT (provozovatel) píše o druhé jídelně „i pro průchozí
  turisty", vlastní web boudy naopak, že restaurace není veřejně přístupná a
  vaří se jen ubytovaným nebo na objednávku. Profil je zatím publikovaný a
  rozpor přiznává rovnou v textu; pokud primární ověření potvrdí variantu webu
  boudy, patří objekt podle klíče spíš mimo katalog (nebo do něj s výslovnou
  poznámkou jako Petrova bouda, kde je veřejná jen útulna).

  Další rozpor: noclehárny 10 + 12 lůžek (KČT) vs. jedna noclehárna pro 20 osob
  (web boudy); kapacita 88 vzata z KČT.

  K dotažení (DATA-04, verified:true): telefon (žádný dosažitelný zdroj ho
  neuvádí), veřejná přístupnost a otvírací doba stravování, provozní sezóna,
  potvrdit platby kartou (OSM tag říká jen hotově, tagy stárnou). Hero fotka:
  kandidáti DATA-02. Známka č.394 — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c394-bradlerovy-boudy.png.
