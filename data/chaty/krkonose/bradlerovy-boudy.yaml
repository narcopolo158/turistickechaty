# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Komplex bud Klubu českých turistů na jižním svahu hlavního krkonošského
  hřebene nad Špindlerovým Mlýnem, v 1 156 m. Místo je osídleno od roku 1637,
  hostinec tu funguje od roku 1890. Nabízí 88 lůžek v pokojích i noclehárnách.
  Nese turistickou známku č. 394.
text:
  - >-
    Brádlerovy boudy stojí ve výšce 1 156 m n. m. na jižním svahu hlavního
    pohraničního hřebene nad Špindlerovým Mlýnem (adresa Špindlerův Mlýn 87).
    Nejde o jedinou budovu, ale o komplex — hlavní budovu doplňují Laura (dříve
    Lauerova bouda) a Severka, z Mléčné boudy zbyly jen základy. Ubytování
    nabízí 66 lůžek v pokojích po dvou až šesti a dvě společné noclehárny,
    dohromady kolem 88 lůžek; boudy provozuje Klub českých turistů a jeho
    členové mají slevu.
  - >-
    Historie místa sahá k roku 1637, kdy je poprvé doloženo osídlení; hostinec
    tu vznikl roku 1890. Bouda roku 1912 vyhořela a byla znovu postavena, od
    roku 1914 ji vlastnil Johann Hollmann a v letech 1938–1945 Kamila
    Hollmannová. Po roce 1945 přešla pod Československý svaz tělesné výchovy a
    od počátku 60. let nesla název Fučíkovy boudy; původní jméno se vrátilo v
    roce 1989.
  - >-
    Pozor na stravování: web boudy uvádí, že restaurace není běžně přístupná
    kolemjdoucím a jídlo se podává ubytovaným (polopenze) nebo na objednávku,
    zatímco stránka chaty na webu KČT zmiňuje druhou jídelnu i pro průchozí
    turisty. Zdroje se rozcházejí — pokud jdete kolem a chcete se najíst,
    ověřte si to předem přímo u boudy. K vybavení patří sauna, úschovna kol a
    lyží, dětské hřiště s trampolínou, jezírko, cvičná horolezecká stěna a
    vlastní lyžařský vlek. Všechny údaje jsou ze sekundárních zdrojů.
zdroje:
  - popis: >-
      Klub českých turistů — stránka chaty Brádlerovy boudy (výška, kapacita,
      dvě jídelny, vybavení, provozovatel, historie hostince); sekundární zdroj,
      verified:false, ověřit primárně
    url: https://kct.cz/chaty/bradlerovy-boudy/
  - popis: >-
      Brádlerovy boudy — vlastní web, sekce O nás (historie a majitelé, pokoje,
      stravování jen pro ubytované, časy check-in/out a jídel); sekundární zdroj,
      verified:false
    url: https://www.bradlerovy-boudy.cz/o-nas/
  - popis: >-
      Kudy z nudy — „Brádlerovy boudy v Krkonoších" (adresa, výška, budovy
      komplexu, vybavení); sekundární médium, verified:false
    url: https://www.kudyznudy.cz/aktivity/bradlerovy-boudy-v-krkonosich
  - popis: OpenStreetMap (GPS objektu, tagy vybavení a plateb, ODbL)
    url: https://www.openstreetmap.org/way/32597735
interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/bradlerovy-boudy.yaml (DATA-01/OSM) v rámci
  master fronty Tier 1 (známka č.394 + katalog ChatGPT + OSM).

  ROZHODNUTÍ PRO MICHALA — klíč zařazení: zdroje si u veřejné přístupnosti
  stravování odporují. KČT (provozovatel) píše o druhé jídelně „i pro průchozí
  turisty", vlastní web boudy naopak, že restaurace není veřejně přístupná a
  vaří se jen ubytovaným nebo na objednávku. Profil je zatím publikovaný a
  rozpor přiznává rovnou v textu; pokud primární ověření potvrdí variantu webu
  boudy, patří objekt podle klíče spíš mimo katalog (nebo do něj s výslovnou
  poznámkou jako Petrova bouda, kde je veřejná jen útulna).

  Další rozpor: noclehárny 10 + 12 lůžek (KČT) vs. jedna noclehárna pro 20 osob
  (web boudy); kapacita 88 vzata z KČT.

  K dotažení (DATA-04, verified:true): telefon (žádný dosažitelný zdroj ho
  neuvádí), veřejná přístupnost a otvírací doba stravování, provozní sezóna,
  potvrdit platby kartou (OSM tag říká jen hotově, tagy stárnou). Hero fotka:
  kandidáti DATA-02. Známka č.394 — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c394-bradlerovy-boudy.png.
