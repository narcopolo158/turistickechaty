  - >-
    Špindlerova bouda stojí ve výšce 1 208 m n. m. na adrese Špindlerův
    Mlýn 108. Dnes se prezentuje jako horský hotel — v průvodci ji vedeme
    poctivě jako horský hotel v roli historické hřebenové boudy.
  - >-
    Hostům nabízí ubytování v pěti kategoriích pokojů, restauraci a bar
    přímo v budově a wellness s bazénem. Zda restaurace obsluhuje i
    kolemjdoucí turisty, web výslovně neuvádí — před cestou doporučujeme
    ověřit telefonicky.

