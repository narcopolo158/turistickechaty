interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/hotel-spindlerova-bouda.yaml (DATA-01) po křížovém ověření DATA-03 a rozhodnutí Michala (chat 20. 7. 2026: hraniční hotely zařadit všechny, typ horsky-hotel).
  Data dotažena z webu spindlerovabouda.cz 21. 7. 2026 (session 30, ruční běh, WebFetch se schválením Michala). Metoda ověření: přímá citace z oficiálního webu → verified: false (ubytování 5 kategorií, wellness, kontakty, historie 1784). verified: false zůstává u: GPS (z OSM, neověřeno v terénu — ale adresa a výška z webu potvrzeny) a dostupnost restaurace pro veřejnost (web ji výslovně neuvádí).
  NEDOHLEDÁNO (web neuvádí): celková kapacita lůžek, otvírací doba restaurace, sezóna/celoroční provoz. Doplnit z podstránek nebo telefonicky.
  Web uvádí i druhý telefon +420 725 855 397 (recepce/rezervace) — kolekce Chaty má jen jedno pole telefon, druhé číslo je proto zaznamenáno ve zdroji overeniProvoz; případně přidat pole do schématu.
  Hero fotka: kandidáti DATA-02 bez jednoznačného záběru budovy — zvážit File:Špindlerova bouda, z parkoviště.jpg po očním potvrzení, jinak počkat na další sklizeň DATA-02.
  DATA-15 (jazykový audit 25. 7. 2026, třetí dávka): opraveny čtyři vady. (1) Poloha „na hřebeni Krkonoš" a přívlastek „hřebenová bouda" stály v perexu, v text[0] i v zajimavosti[0], ale doložená je jen výška a adresa (overeniLokace cituje web) — tvrzení o typu terénu žádný pramen nenese, proto ze všech tří míst odstraněno. Zvažováno bylo místo odstranění doplnit větu, že hřeben doložit neumíme; zamítnuto, protože čtenář se na to neptá a přiznávat se má rozpor pramenů, ne nepřítomnost tvrzení. (2) Perex mlčel o rozporu 1784 (web hotelu) vs. 1824 (Seznam Zprávy), který text[1] přiznává — perex nově rozpor nese taky, aby si ho čtenář nesl od první věty. (3) Perex sliboval „restauraci s barem" bez výhrady, ač overeniObcerstveni výslovně říká, že dostupnost pro neubytované web neuvádí a text[3] to přiznává — doplněna stejná výhrada. (4) text[4] připisoval příjezd autem webu hotelu („Web hotelu uvádí mezi jeho přednostmi"), údaj ale pochází z doplňkových fakt katalogu (hlavička sekce zajimavosti), ne z citací webu v blocích overeni* — připsání opraveno a přidán záznam do zdroje[] (bez url, veřejně citovatelné umístění nemá; vzor chata-rezek a dom-slaski). zajimavosti[0] přepsána na wellness v hlavní budově, což overeniSluzby cituje přímo z webu.
  ZAMÍTNUTO jako nedorozumění auditu: text[1] „zasáhl přístavbu, historickou hlavní budovu nikoli" NENÍ domyšlené — agent četl jen zkratku v overeniHistorie.source („2005 (požár přístavby)") a přehlédl milniky[4].udalost, které zní „Požár zasáhl přístavbu, nikoli hlavní historickou budovu"; próza odpovídá datovému poli téhož souboru. Zamítnuto i „nad Špindlerovým Mlýnem" — plyne z doložené výšky a obce (vzor dvorska-bouda).
