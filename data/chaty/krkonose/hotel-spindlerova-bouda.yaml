# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel v roli historické hřebenové boudy ve výšce 1 208 m n. m. nad
  Špindlerovým Mlýnem, s tradicí od roku 1784. Nabízí ubytování v pěti
  kategoriích pokojů, restauraci s barem a wellness s bazénem.
text:
  - >-
    Špindlerova bouda stojí na hřebeni Krkonoš ve výšce 1 208 m n. m., na
    adrese Špindlerův Mlýn 108. Dnes objekt funguje jako horský hotel, a tak
    ho vedeme i tady — jako horský hotel v roli historické hřebenové boudy.
    Výšku i adresu potvrzuje web hotelu, souřadnice pocházejí
    z OpenStreetMap a v terénu ověřené nejsou.
  - >-
    Svou tradici hotel na webu odvozuje od roku 1784. Podrobnější časovou osu
    nabízejí Seznam Zprávy: podle nich vybudoval boudu v těchto místech Franz
    Spindler až v roce 1824, o dva roky později stavba vyhořela a byla
    postavena znovu a v roce 1855 ji převzal Johann Hollmann, který z ní
    rozvinul horský hotel. Letopočet 1784 z webu hotelu a rok 1824 ze Seznam
    Zpráv se rozcházejí a rozpor zatím rozřešený nemáme. Posledním doloženým
    požárem je ten z roku 2005; zasáhl přístavbu, historickou hlavní budovu
    nikoli. Údaje o starší historii pocházejí ze sekundárního média
    a primárním pramenem doložené nejsou.
  - >-
    Ubytování hotel nabízí v pěti kategoriích pokojů — Economy, Standard,
    Comfort, De Luxe a Premium. Celkovou kapacitu na webu neuvádí; o 153
    lůžkách píše server Krkonose.eu, tedy rovněž sekundární zdroj, a ověřené
    to číslo nemáme.
  - >-
    Restaurace a bar jsou podle webu přímo v hlavní budově, stejně jako
    wellness zázemí s bazénem, saunami, vířivkou a masážemi. Jestli
    restaurace obsluhuje i kolemjdoucí turisty, web výslovně neuvádí —
    netvrdíme to tedy ani my.
  - >-
    Web hotelu uvádí mezi jeho přednostmi to, že se k boudě dá dojet autem.
    Konkrétní pěší trasy, jejich délky ani převýšení zatím doložené nemáme.
  - >-
    Nedořešená zůstává otvírací doba restaurace i to, zda hotel funguje
    celoročně; web neuvádí ani jedno. Před cestou proto doporučujeme ověřit
    si přímo u hotelu provozní režim a dostupnost restaurace pro ty, kdo tu
    nespí.

