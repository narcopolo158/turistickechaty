# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel v roli historické hřebenové boudy ve výšce 1 208 m n. m. nad
  Špindlerovým Mlýnem, s tradicí od roku 1784. Nabízí ubytování v pěti
  kategoriích pokojů, restauraci s barem a wellness s bazénem.
text:
  - >-
    Špindlerova bouda stojí ve výšce 1 208 m n. m. na adrese Špindlerův
    Mlýn 108. Její tradice sahá až do roku 1784; dnes se objekt prezentuje
    jako horský hotel — v průvodci ho vedeme poctivě jako horský hotel
    v roli historické hřebenové boudy.
  - >-
    Hostům nabízí ubytování v pěti kategoriích pokojů (Economy, Standard,
    Comfort, De Luxe a Premium), restauraci a bar přímo v hlavní budově
    a wellness s bazénem, saunami, vířivkou a masážemi. Zda restaurace
    obsluhuje i kolemjdoucí turisty, web výslovně neuvádí — před cestou
    doporučujeme ověřit telefonicky.

