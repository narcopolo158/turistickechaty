# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský penzion v osadě Hrnčířské boudy, která leží na hřebeni jižně od
  Pece pod Sněžkou a adresou patří k Černému Dolu. Katalog u ní popisuje
  restauraci s barem a padesát šest lůžek; osada sama je podle místopisu
  luční enkláva založená roku 1854.
text:
  - >-
    Náchodská bouda stojí v osadě Hrnčířské boudy — skupině bud na
    hřebeni jižně od Pece pod Sněžkou, která poštovní adresou spadá pod
    Černý Důl. Nadmořskou výšku neuvádíme schválně: jeden katalog píše
    u boudy 1100 metrů, jiný celostátní přehled 575 — druhé číslo je
    zjevný omyl, a než mezi prameny rozhodovat, necháváme pole prázdné.
    Místopis mluví o 1059 metrech, to ale platí pro osadu jako celek.
  - >-
    Osadu Hrnčířských bud klade místopis do roku 1854. Ten letopočet je
    ovšem příběhem celé skupiny bud, ne tohoto domu — o tom, kdy a jak
    vznikla samotná Náchodská bouda, jsme zatím nenašli jediný doložený
    údaj. Jakmile se pramen objeví, historie sem přibude.
  - >-
    Dnes je Náchodská bouda horský penzion: katalog u ní vyjmenovává
    restauraci s barem, společenskou místnost a lyžárnu, k tomu dvacet
    pokojů s padesáti šesti lůžky. Jestli restaurace obslouží i turistu,
    který jen prochází osadou, pramen neříká — a my to bez dokladu
    netvrdíme.
  - >-
    Všechno výše pochází z katalogů, hlavně z Kudy z nudy, a z místopisu
    osady; vlastním dotazem u provozovatele jsme zatím neověřili nic.
    Souřadnice jsou z mapových dat OpenStreetMap (© přispěvatelé
    OpenStreetMap, ODbL) a v terénu je nikdo nekontroloval.

