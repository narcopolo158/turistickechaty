# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda v luční enklávě Lučiny nad Pecí pod Sněžkou, kolem 1100 metrů,
  padesát metrů od vleku a hned u běžkařské magistrály. Katalog u ní
  popisuje dvaačtyřicet lůžek se snídaní a večeří; blog Krkonošské boudy
  k tomu přidává nejvýše položenou pizzerii v Čechách.
text:
  - >-
    Bouda Na Lučinách stojí v Lučinách, luční enklávě na hřebeni nad
    Pecí pod Sněžkou, ve výšce kolem 1100 metrů. Od lyžařského vleku, který spojuje pecké sjezdovky, je to padesát metrů a
    Krkonošská magistrála vede hned vedle boudy — v zimě sem tedy běžkař
    dojede po stopě.
  - >-
    Enkláva má hezký příběh jména: Lučinám ho podle dvou shodných vyprávění dali dřevaři z Alp, kteří tu
    vymýtili velkou luční enklávu — původně se osadě říkalo
    Bodenwiesenbauden. To je ovšem
    historie osady; o tom, kdy vznikla samotná bouda, jsme zatím nenašli
    jediný doložený údaj.
  - >-
    Nocleh nabízí bouda na dvaačtyřiceti lůžkách ve dvou- až čtyřlůžkových
    pokojích, snídaně se podávají bufetem a večeře výběrem z menu. A pak je
    tu lákadlo, které přebíráme s výslovným připsáním: jeden z pramenů píše,
    že na boudě provozují nejvýše položenou pizzerii v Čechách. Komu přesně kuchyně slouží a zda
    pizza čeká i na kolemjdoucí, prameny neříkají.
  - >-
    Všechno výše pochází ze dvou sekundárních pramenů vypsaných níž; vlastní
    web boudy se nám opakovaně nepodařilo otevřít a vlastním dotazem jsme
    zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

