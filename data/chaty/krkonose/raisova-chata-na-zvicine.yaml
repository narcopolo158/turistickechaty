# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Vrcholová chata Klubu českých turistů na Zvičině — hoře, která už
  neleží v Krkonoších, ale je nejvýraznějším kopcem východního
  Podkrkonoší; právě proto ji tu vedeme s tímhle výslovným dodatkem.
  Hostinec tu stojí od roku 1891, od 1927 nese jméno spisovatele Karla
  Václava Raise a dnes nabízí restauraci; nocleh už ne.
text:
  - >-
    Raisova chata stojí na vrcholu Zvičiny v 671 metrech — a hned
    napřímo: Zvičina není Krkonoše. Podle vlastníka, Klubu českých
    turistů, je to „nejvýraznější hora ve východní části Podkrkonoší";
    v krkonošské části průvodce ji vedeme proto, že k výhledu na celé
    pohoří patří i jeho jižní předhůří, a samostatnou podkrkonošskou
    sekci založíme, až bude mít víc obyvatel.
  - >-
    Historie sahá do roku 1891, kdy tu podle turistického serveru
    postavil majitel pozemku Josef Machek-Patcelt hostinec. Kolem
    přelomu století se prameny v datech převodů rozcházejí — jednou
    zní rok 1898 a Národní jednota severočeská, jindy 1900 a Klub
    českých turistů, web KČT mluví o koupi až začátkem roku 1901 —
    a než mezi nimi rozhodovat, přiznáváme všechna tři. Jisté je, že
    v letech 1925 až 1926 vyrostla vedle chaty rozhledna s otáčivou
    kopulí, v roce 1927 dostala chata jméno po Karlu Václavu Raisovi,
    rodákovi z nedalekého Bělohradu, a v roce 1991 ji KČT získal jako
    jeden z prvních objektů zpět.
  - >-
    Dnešek je prostý a přebíráme ho od vlastníka doslova: chata
    „neposkytuje ubytování, má však rozlehlou, příjemnou a hosty
    oblíbenou restauraci s poměrně velkou nabídkou jídel". Na Zvičinu
    se tedy chodí na výhled, na jídlo a na rozhlednu — spát je třeba
    jinde.
  - >-
    Údaje pocházejí z webu Klubu českých turistů a z turistického
    serveru; vlastním dotazem jsme zatím neověřili nic. Souřadnice
    přebíráme ze stránky KČT a v terénu je nikdo nekontroloval.

