# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda v první zóně národního parku ve výšce 1 000 m, na nejvýchodnějším
  krkonošském hřebeni. Autem se sem nedá dojet ani v létě; restaurace tu je,
  jestli do ní mohou i kolemjdoucí, prameny mlčí. Ubytuje 45 hostů v jedno-
  až sedmilůžkových pokojích. Historie místa sahá k roku 1892, primárním
  pramenem ji ověřenou nemáme.
text:
  - >-
    Rýchorská bouda stojí ve výšce 1 000 m n. m. uvnitř první zóny
    Krkonošského národního parku; adresou patří k Žacléři, čp. 55. Stojí na nejvýchodnějším hřebeni Krkonoš; výšku uvádějí dva prameny
    shodně. Autem se sem nedá dojet ani v létě, k boudě se tedy chodí pěšky.
  - >-
    Historie místa začíná rokem 1892, kdy tu stála Maxova chata. V roce 1926
    postavil stavitel Wagenknecht nové zařízení nákladem jednoho milionu
    korun, roku 1946 bouda přešla pod Klub českých turistů a v roce 1976 ji
    převzala Správa KRNAP. Kdo boudu provozuje dnes, jsme si zatím
    nepotvrdili. Časovou osu přebíráme ze sekundárního média a primárním pramenem zatím
    ověřená není.
  - >-
    Ubytuje se tu pětačtyřicet hostů v jedno- až sedmilůžkových pokojích se
    stylovým dřevěným nábytkem; kapacitu uvádějí oba prameny shodně a přidat prý jde ještě asi patnáct
    přistýlek. Sama bouda zmiňuje restauraci a snídani v trávě; jinde se
    stravování nepopisuje, uvádí se ale celoroční provoz s otvírací dobou od
    pondělí do neděle mezi desátou a pátou odpolední, což podniku otevřenému
    i kolemjdoucím odpovídá — výslovně to ovšem žádný z dostupných pramenů
    neříká.
  - >-
    Údaje o provozu se přitom rozcházejí. Sama bouda popisuje sezónní režim, ve kterém je v mezisezóně otevřeno jen
    o víkendech, její informace se ale vztahují k sezóně 2025, a tak je jako
    aktuální nepřebíráme; druhý pramen naproti tomu uvádí provoz celoroční.
    Liší se i kontaktní e-mailová adresa. Celá tahle stránka stojí na
    pramenech, které redakce zatím neověřila vlastním dotazem ani návštěvou. Před cestou doporučujeme potvrdit si přímo u boudy aktuální
    otvírací dobu, sezónní režim a to, zda je restaurace přístupná i těm, kdo
    tu nespí.
