# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda na nejvýchodnějším krkonošském hřebeni v první zóně národního parku
  (1 000 m), kam se nedá dojet autem. Ubytuje 45 hostů v jedno- až
  sedmilůžkových pokojích, má restauraci a slouží i jako školicí středisko
  ochrany přírody. Historie sahá k roku 1892. Nese turistickou známku č. 390.
text:
  - >-
    Rýchorská bouda (čp. 55, Žacléř) stojí ve výšce 1 000 m n. m. na
    nejvýchodnějším hřebeni Krkonoš, uvnitř první zóny Krkonošského národního
    parku nedaleko Rýchorského bukového pralesa. K boudě se nedá dojet autem
    ani v létě — poslední úsek se jde pěšky.
  - >-
    Ubytování nabízí 45 lůžek (s možností asi patnácti přistýlek) v jedno- až
    sedmilůžkových pokojích se stylovým dřevěným nábytkem, v domě je restaurace.
    Kromě turistů boudu využívá Správa KRNAP jako školicí středisko ochrany
    přírody.
  - >-
    Historie místa začíná roku 1892, kdy tu stála Maxova chata; v roce 1926
    postavil stavitel Wagenknecht nové zařízení nákladem jednoho milionu korun,
    roku 1946 bouda přešla pod Klub českých turistů a od roku 1976 ji spravuje
    Správa KRNAP. Údaje jsou ze sekundárních zdrojů — otvírací dobu a aktuální
    sezónní režim ověřte přímo u boudy, informace na jejím webu jsou staršího
    data.
