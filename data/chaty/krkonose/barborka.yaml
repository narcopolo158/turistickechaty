# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda na Vysokém svahu v Peci pod Sněžkou, která bývala malým penzionem
  se stravou. Teď je ale potřeba říct hlavně jedno: podle vlastního webu
  je objekt kvůli havarijnímu stavu dočasně uzavřený — a dokud se
  neotevře, nemá tu turista co hledat.
text:
  - >-
    Barborka stojí na Vysokém svahu, v klidnější boční části Pece pod
    Sněžkou nad centrem střediska. Výšku neuvádíme schválně: jediný
    katalog, který ji nese, si na dvou vlastních stránkách protiřečí,
    a web boudy mlčí — raději prázdné pole než hádání.
  - >-
    V dobách provozu byla Barborka malý penzion se stravou — katalogy
    z té éry popisují jídelnu s polopenzí a ubytování, na jehož velikosti
    se ovšem neshodnou: patnáct lůžek, dvacet s pěti přistýlkami, nebo
    pětadvacet, podle toho, kterou stránku otevřete. Ani jedno číslo
    proto nepřebíráme.
  - >-
    Dnes platí jediná věta, a to z vlastního webu boudy: „Z důvodu
    havarijního stavu objektu dočasně uzavřeno." Vedeme proto Barborku
    jako boudu mimo provoz — slovo „dočasně" je slovem webu, takže se
    sem snad jednou vrátí život; do té doby je v průvodci proto, aby
    nikdo nešel na Vysoký svah zbytečně. O historii objektu jsme zatím
    nedoložili nic; jakmile se pramen najde, doplníme ho.
  - >-
    Poloha pochází z webu boudy, kapacitní čísla z katalogů éry provozu
    a vlastním dotazem jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval. Pozor při hledání: v Horní Malé
    Úpě stojí jiná chata téhož jména.

