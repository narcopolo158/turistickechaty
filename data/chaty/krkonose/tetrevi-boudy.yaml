# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel v roli historických Tetřevích bud ve výšce 1 030 m n. m. nad
  Dolním Dvorem, na území KRNAP. Na místě stály tři dřevěné boudy už v 18.
  století; dnešní budovy nabízejí restauraci a rozsáhlé wellness.
text:
  - >-
    Tetřeví Boudy leží ve výšce 1 030 m n. m. na území Krkonošského národního
    parku, adresou patří k Dolnímu Dvoru, čp. 308. Výšku i adresu uvádí web
    hotelu. Objekt dnes funguje jako horský hotel v roli historických bud:
    rozsahem zázemí má blíž k hotelu než k boudě, jméno i místo ale nesou
    starší historii.
  - >-
    Na luční enklávě, kde hotel stojí, stály původně tři dřevěné boudy, které
    v 18. století postavili němečtí starousedlíci; přesný letopočet web
    neuvádí. Po odsunu německých usedlíků v roce 1945 se z bud stalo
    oddechové místo. V roce 1976 padla prostřední dřevěná bouda a začala
    moderní přestavba — první dvě budovy, A a B, vyrostly v roce 1980 a další
    dvě přibyly roku 1989. V květnu 2014 Tetřeví Boudy koupila společnost
    Green Garden. Tuhle časovou osu až po rok 2014 uvádí web hotelu; pozdější
    renovace a doplnění wellness citací z webu doložené nemáme.
  - >-
    Spí se v pokojích kategorie Superior, které jsou podle webu všechny
    zrekonstruované od roku 2016; celkový počet pokojů ani lůžek provozovatel
    na svých stránkách neuvádí, takže ho neuvádíme ani my. Restaurace vaří
    obědy od jedenácti do čtyř odpoledne a večeři podává mezi šestou a devátou
    formou rautu, po obědě a pozdě večer je k dispozici ještě snack menu;
    stůl se rezervuje telefonicky. Jestli je restaurace otevřená i těm, kdo tu
    nespí, web výslovně neříká. Zázemí je hotelové: bazén, vířivka, finské
    sauny, parní sauna a infrasauna, fitness, stolní tenis, stolní fotbálek,
    kulečník a šipky, k tomu dětská herna a venkovní dětské hřiště.
  - >-
    Celoroční provoz web hotelu uváděl při dřívějším čtení, později to na
    stránkách nezopakoval, a tak tenhle údaj bereme s výhradou. Nedoložená
    zůstává kapacita ubytování i přístup autem a pěšky. Údaje na této stránce
    pocházejí z webu hotelu, souřadnice z OpenStreetMap (© přispěvatelé
    OpenStreetMap, ODbL) a v terénu ověřené nejsou; redakce je zatím neověřila
    vlastním dotazem ani návštěvou. Před cestou doporučujeme potvrdit si
    otvírací dobu restaurace a to, zda vaří i pro neubytované.

