# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Rodinný horský penzion v jádru Pece pod Sněžkou v 1030 metrech — vleky
  Eso a Mulda má podle vlastního webu přímo před domem. Hostům vaří
  polopenzi a točí ve vlastním výčepu; a tady je třeba říct rovnou:
  bar je podle webu jen pro ubytované, kolemjdoucí turista se tu
  občerstvení nedočká.
text:
  - >-
    Jindřichův dům stojí v jádru Pece pod Sněžkou ve výšce 1030 metrů —
    vlastní web ho popisuje jako rodinný horský penzion „přímo v srdci
    Krkonoš" a vleky Eso a Mulda má přímo před domem. Kdo tu bydlí, má
    tedy lyžování za dveřmi a hřebenové túry nad hlavou.
  - >-
    Hostům dům vaří polopenzi — snídani bufetem, společnou večeři —
    a nabízí bar s výčepem. Právě u něj ale platí věta, kterou přebíráme
    z webu doslova: je „pro ubytované hosty" a provoz záleží na
    obsazenosti. Veřejné občerstvení pro kolemjdoucí tu tedy doloženo
    není, a proto ho neuvádíme.
  - >-
    Kapacitu vlastní web udává na pětačtyřicet osob, katalogy vedou
    dvaačtyřicet lůžek — čísla se neshodnou, a tak žádné nepřebíráme.
    O historii domu, a dokonce ani o tom, po kom nese jméno, jsme
    v otevřených pramenech nenašli jediný doložený údaj; jakmile se
    pramen najde, doplníme ho.
  - >-
    Údaje pocházejí z vlastního webu penzionu a z katalogů; vlastním
    dotazem u provozovatele jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

