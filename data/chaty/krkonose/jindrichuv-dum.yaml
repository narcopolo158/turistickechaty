  HRANIČNÍ ZAŘAZENÍ (do seznamu otázek pro Michala): penzion bez doložené historie a bez veřejného občerstvení — v silné frontě triáže byl, zařazen jako horská chata s noclehem pro turisty (OSM alpine_hut, „Horská chata Jindřichův dům" v katalozích); pokud Michal rozhodne jinak, profil se stáhne.
  ROZPOR KAPACITY: 45 osob (web) × 42 lůžek (katalogy) — nezapsáno, próza přiznává.
  Adresa „Pec pod Sněžkou 24" jen interně/v source (ban č. p. v próze).
  K dotažení: historie a původ jména, kapacita od provozovatele, telefon/e-mail (DATA-04), hero fotka.
