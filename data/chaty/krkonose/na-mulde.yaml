# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Účelová bouda Fakulty tělesné výchovy a sportu Univerzity Karlovy nad
  Pecí pod Sněžkou, s výhledem na Sněžku a třiačtyřiceti lůžky ve
  čtrnácti pokojích. Pronajímá se skupinám od dvaceti lidí — a proto
  rovnou: kolemjdoucí turista tu nocleh ani občerstvení nenajde.
text:
  - >-
    Horská bouda Na Muldě stojí nad Pecí pod Sněžkou u svahů, po nichž
    jezdí vlek Mulda — a z boudy je podle vlastního webu fakulty
    „nezapomenutelný výhled na Sněžku". Nadmořskou výšku neuvádíme:
    turistický server měří 1036 metrů, starý katalogový zápis tisíc,
    a než mezi nimi rozhodovat, necháváme pole prázdné.
  - >-
    Boudu vlastní a provozuje Fakulta tělesné výchovy a sportu
    Univerzity Karlovy jako své rekreační středisko: čtrnáct pokojů se
    základním vybavením, třiačtyřicet lůžek, domácí kuchyně podle
    objednané penze. Pronajímá se skupinám od dvaceti lidí — menším
    a rodinám jen na vyhlášené termíny, třeba silvestrovské pobyty.
    Kolemjdoucí veřejnosti bouda neslouží, a proto to říkáme hned
    v úvodu.
  - >-
    Přístup je horský i logisticky: v létě se k boudě dá vyjet autem na
    vjezdové povolení, v zimě vozí hosty skútr nebo rolba. Z historie
    web říká jen tolik, že dům prošel několika rekonstrukcemi a zachoval
    si původní charakter — bez jediného letopočtu; jakmile se pramen
    najde, doplníme ho.
  - >-
    Údaje pocházejí z vlastního webu fakulty; vlastním dotazem jsme
    zatím neověřili nic. Souřadnice jsou z mapových dat OpenStreetMap
    (© přispěvatelé OpenStreetMap, ODbL) a v terénu je nikdo
    nekontroloval.

