# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1623 # letopočet na základním kameni objeveném při rekonstrukci 1869; podle provozovatele bouda stála už v 2. pol. 16. století
milniky:
  - rok: 1623
    udalost: Letopočet vytesaný na základním kameni (objeven při rekonstrukci 1869); bouda podle provozovatele stála už v 2. polovině 16. století
  - rok: 1625
    udalost: Bouda po požáru přestavěna
  - rok: 1707  # Seznam Zprávy, zdrojový průzkum 2026-07-22 (sekundární médium, verified:false)
    udalost: První písemný doklad — kupní smlouvou z roku 1707 boudu získal Christoph Erben
  - rok: 1772  # Seznam Zprávy, zdrojový průzkum 2026-07-22 (sekundární médium, verified:false)
    udalost: Boudu získala rodina Rennerů a spravovala ji zhruba sto let; hospodařili a vyráběli mj. mléčné a bylinné sýry
  - rok: 1809
    udalost: U boudy postaven tzv. letní dům
  - rok: 1857
    udalost: Boudu převzal Václav Hollmann; 1875 ji podstatně rozšířil pro turistický ruch
  - rok: 1914
    udalost: Přestavba na největší boudu Krkonoš se 100 pokoji
  - rok: 1938
    udalost: 2. října vyhořela při ústupu československé armády po Mnichovu; rekonstrukce dokončena o Velikonocích 1940
  - rok: 1991
    udalost: Ve správě Klubu českých turistů (do 2002), poté dva roky zavřená
  - rok: 2004
    udalost: Zdevastovanou boudu koupila společnost AEZZ a postupně ji obnovila
overeniHistorie:
  source: >-
    https://www.lucnibouda.cz/cs/historie/ (základ časové osy);
    milníky 1707 (kupní smlouva, Christoph Erben) a 1772 (rodina Rennerů) a
    zajímavosti (válečný projekt s tunelem pro řeku, plachtařská škola Eugena
    Bönsche) ze zdrojového průzkumu 2026-07-22 — Seznam Zprávy „Historie Luční
    boudy" (sekundární médium, verified:false, před publikací ověřit primárním
    pramenem)
  verified: false
  checked: '2026-07-22'

