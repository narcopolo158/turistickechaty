    kategorie: jine
    zdroj: Seznam Zprávy „Historie Luční boudy" — zdrojový průzkum 2026-07-22 (sekundární médium, verified:false)
perex: >-
  Podle provozovatele největší a nejstarší bouda Krkonoš, ve výšce 1 410 m
  nad Pecí pod Sněžkou. Celoročně otevřený bufet, restaurace, nocleh od
  spacákového patra po apartmány — a pivo Paroháč z vlastního pivovaru.
text:
  - >-
    Luční bouda stojí na hřebenech Krkonoš od nepaměti — základní kámen nese
    letopočet 1623 a provozovatel dokládá, že tu bouda stála už v druhé
    polovině 16. století. Dnešní rozlehlá podoba pochází z přestavby roku
    1914, kdy se stala největší boudou Krkonoš.
  - >-
    Zázemí je dnes hotelové: pokoje od kategorie Standard po apartmány,
    pro turisty s vlastním spacákem slouží prostor v nejvyšším patře.
    Bufet má otevřeno denně 10:00–17:00 po celý rok, restaurace vaří
    i pro neubytované po předchozí rezervaci — a k jídlu se čepuje pivo
    Paroháč z vlastního pivovaru, nejvýše položeného v Čechách dle
    provozovatele.
  - >-
    Auta končí v Peci pod Sněžkou na terminálu P1; posledních zhruba
    8,5 km s převýšením 750 m obstará smluvní přeprava hotelu, pěšky
    vedou na boudu značené hřebenové cesty.
