    sekundárního média, a primárním pramenem je zatím doložené nemáme";
    „Obě epizody uvádějí Seznam Zprávy, tedy sekundární médium."). Ověření
    primárním pramenem tím nepadá — zůstává jako úkol pro DATA-04.
  verified: false
  checked: '2026-07-22'

