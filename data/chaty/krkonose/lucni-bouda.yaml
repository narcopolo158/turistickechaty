interniPoznamky: |-
  Typ: web se prezentuje jako „Hotel Luční bouda"; zapsáno jako obsluhovaná chata dle taxonomie plánu (zvážit typ „horský hotel v roli chaty" — rozhodne Michal).
  Kapacita lůžek: na webu boudy neuvedena — nezapsáno (žádné „≈ 90 lůžek" z prototypu, to byl demo údaj).
  Provoz 6–8/2025 omezen kvůli sporu majitelů se Správou KRNAP (přístup jen pro ubytované); od 9. 8. 2025 běžný režim po dohodě s MŽP. Sledovat případné změny.
  Webkamera: web ji zmiňuje, přesná URL nedohledána — doplnit.
