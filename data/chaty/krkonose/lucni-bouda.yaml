text:
  - >-
    Luční bouda stojí ve výšce 1 410 m n. m. v katastru Pece pod Sněžkou
    v Krkonoších. Podle provozovatele je největší a nejstarší boudou Krkonoš
    a její restaurace nejvýše položeným restauračním zařízením v Čechách;
    obojí jsou tvrzení provozovatele, která zatím nemáme ověřená
    z nezávislého pramene.
  - >-
    Historie objektu sahá hluboko do minulosti. Základní kámen objevený při
    rekonstrukci roku 1869 nese letopočet 1623 a podle provozovatele tu bouda
    stála už v druhé polovině 16. století; po požáru byla roku 1625
    přestavěna. Dva starší milníky přebíráme ze Seznam Zpráv, tedy ze
    sekundárního média, a primárním pramenem je zatím doložené nemáme: prvním
    písemným dokladem má být kupní smlouva z roku 1707, kterou boudu získal
    Christoph Erben, a od roku 1772 ji zhruba sto let spravovala rodina
    Rennerů — hospodařili tu a vyráběli mimo jiné mléčné a bylinné sýry. Roku
    1809 u boudy vyrostl takzvaný letní dům, v roce 1857 hospodářství převzal
    Václav Hollmann a o osmnáct let později je podstatně rozšířil pro
    turistický ruch.
  - >-
    Přestavba z roku 1914 z boudy podle provozovatele udělala největší boudu
    Krkonoš se stovkou pokojů. Druhého října 1938 objekt vyhořel při ústupu
    československé armády po Mnichovu a rekonstrukce byla dokončena
    o Velikonocích 1940. K válečnému období se váže velkorysý projekt, který
    počítal mimo jiné s tunelem pro tok řeky a realizován byl jen zčásti.
    S boudou se pojí také plachtařská škola letce Eugena Bönsche, jemuž se
    připisuje klouzavý let ze Studniční hory trvající přes dvě a půl hodiny;
    kdy škola fungovala, naše podklady neříkají, takže ji k válečným letům
    neřadíme. Obě epizody uvádějí Seznam Zprávy, tedy sekundární médium.
  - >-
    Novodobé osudy boudy byly neklidné. V letech 1991 až 2002 ji spravoval Klub
    českých turistů, pak byla dva roky zavřená a roku 2004 zdevastovaný objekt
    koupila společnost AEZZ, která ho postupně obnovila. Zatím poslední zvrat
    přišel v létě 2025: kvůli sporu majitelů se Správou KRNAP byl přístup omezen
    jen na ubytované a od 9. srpna 2025 je podle serveru ČeskéNoviny.cz bouda
    zpátky v běžném režimu, s bufetem i toaletami otevřenými veřejnosti.
  - >-
    Dnešní zázemí je hotelové. Spí se ve dvoulůžkových pokojích Gallery, v
    pokojích kategorie Standard pro dva až čtyři hosty a v apartmánech Sněžka
    a Luční; turisté s vlastním spacákem mají k dispozici spacákový prostor v
    nejvyšším patře. Celkovou kapacitu lůžek provozovatel na webu neuvádí,
    takže ji neuvádíme ani my. Bufet má otevřeno denně od deseti do pěti
    odpoledne po celý rok. U restaurace vedeme údaj, že vaří i pro
    neubytované po předchozí rezervaci — pramen se nám k němu ale nepodařilo
    dohledat: článek ČeskéNoviny.cz, o který se u provozního režimu opíráme,
    je podle vlastního titulku o bufetu a toaletách. Berte proto rezervační
    režim jako nepotvrzený a ověřte si ho přímo u boudy. Z nabídky
    provozovatel jmenuje velké rohlíky a borůvkové koláče a čepuje se tu pivo
    Paroháč z vlastního pivovaru — podle provozovatele nejvýše položeného
    v Čechách. Platit se dá kartou a toalety jsou přístupné i těm, kdo tu
    nespí.
  - >-
    Autem se dá dojet jen na placené parkoviště P1 u dopravního terminálu na
    začátku Pece pod Sněžkou, u čerpací stanice KM Prona. Zbývajících zhruba
    8,5 kilometru s převýšením 750 metrů zajišťuje smluvní přeprava hotelu,
    kterou je nutné objednat nejpozději den předem. Pěšky vede na boudu cesta
    ze Špindlerova Mlýna, dlouhá 6,8 kilometru s převýšením 699 metrů, a z
    Pece pod Sněžkou, kde je to osm kilometrů a 742 metrů stoupání. Časy kolem
    tří a čtvrt až tří a tři čtvrtě hodiny, které u obou tras uvádíme, jsou
    orientační výpočet z délky a převýšení, ne měřený údaj.
  - >-
    Údaje na této stránce pocházejí z webu boudy a ze sekundárních médií
    a redakce je zatím neověřila vlastním dotazem ani návštěvou. Před cestou
    doporučujeme potvrdit si zejména režim restaurace pro neubytované.
