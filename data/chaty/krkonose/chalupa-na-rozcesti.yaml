interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/chalupa-na-rozcesti.yaml (DATA-01/OSM) v
  rámci master fronty Tier 1 (známka č.13 + katalog ChatGPT + OSM). Data z Kudy
  z nudy (sekundární médium) — vlastní web ze sandboxu nedostupný.

  Splňuje klíč zařazení (Michal): bufet přístupný veřejnosti doložen.

  Doména: Kudy z nudy uvádí chalupanarozcesti.com, OSM chalupanarozcesti.cz —
  ověřit platnou. K dotažení (DATA-04, verified:true): kapacita a typy pokojů,
  potvrdit otvírací dobu a kontakty. Hero fotka: kandidáti DATA-02. Známka č.13
  — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c13-chalupa-na-rozcesti.png.

  NEZTOTOŽŇOVAT s „Boudou na rozcestí Cestník" z výtahu treking.cz (session 24 to
  nechala otevřené — nedomýšlet).

  DATA-15 krok (b), 2. dávka (25. 7. 2026): první auditní průchod prohlásil profil
  za čistý (0 nálezů); nepřátelský druhý průchod ten verdikt zvrátil a našel tři
  vady. (1) „obcí patří pod Pec pod Sněžkou" stálo jako holé tvrzení, ačkoli
  obecní příslušnost nenese žádný pramen — na trojmezí jde o výběr jedné ze tří
  možností; pole obec zůstává vyplněné, ale próza to teď přiznává. (2) Nocleh se
  opírá jedině o značku v OpenStreetMap, byl ale napsaný v odstavci připsaném
  Kudy z nudy — rozdělen do vlastního odstavce s jasným pramenem. (3) Závěrečná
  výzva „potvrdit přímo u chalupy" zamlčovala, že rozpor je i v samotných
  kontaktech: overeniProvoz nese dvě telefonní čísla (zveřejněné je jedno)
  a doména se liší mezi .com (Kudy z nudy) a .cz (OSM). Rozpory přiznány, ne
  vyřešeny. Poučení pro zbytek auditu: jeden průchod umí vyrobit sebejistý
  falešně čistý verdikt.
