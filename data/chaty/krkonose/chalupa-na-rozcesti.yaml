# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Celoroční horská bouda v 1 349 m na trojmezí Pece pod Sněžkou, Strážného a
  Špindlerova Mlýna u Liščího hřebenu, s bufetem přístupným kolemjdoucím
  turistům a regionální kuchyní. Historie sahá k roku 1934.
text:
  - >-
    Chalupa Na Rozcestí stojí ve výšce 1 349 m n. m. u Liščího hřebenu, na
    trojmezí Pece pod Sněžkou, Strážného a Špindlerova Mlýna. Polohu i výšku
    uvádí Kudy z nudy, souřadnice objektu pocházejí z OpenStreetMap. Pod
    kterou z těch tří obcí chalupa administrativně patří, prameny neříkají;
    v průvodci ji řadíme k Peci pod Sněžkou, doložený podklad pro to ale
    nemáme.
  - >-
    Počátky chalupy sahají k roku 1934, kdy si Hugo Mitlöhner pronajal
    pozemek od lesní správy a postavil na něm dřevěnou boudu. Pozdější osudy
    stavby dostupné prameny nesledují a ani tenhle jediný milník zatím nemáme
    doložený z primárního pramene — pochází z Kudy z nudy, tedy ze
    sekundárního média.
  - >-
    Bouda je v provozu celoročně a bufet je otevřený i kolemjdoucím: od
    pondělí do čtvrtka a v neděli od půl desáté do pěti odpoledne, v pátek
    a v sobotu do sedmi večer. Kuchyně se drží regionálních jídel — vaří
    kyselo, borůvkové knedlíky, couračku, boršč a dršťkovou. Tohle všechno
    uvádí Kudy z nudy.
  - >-
    Že chalupa nabízí i nocleh, víme naproti tomu jen z OpenStreetMap: objekt
    je tam vedený značkou pro horskou boudu s ubytováním a jako provozovatele
    mapa uvádí Zdeňka Nikla. Kudy z nudy o přespání nepíší vůbec, počet lůžek
    ani typy pokojů se nám doložit nepodařilo a celý údaj tak stojí na jediném
    záznamu v mapě, kterou píšou dobrovolníci.
  - >-
    Cyklisté tu najdou nářadí a stojan na opravu kol,
    běžkaři vosky. Uvnitř je krb se sušákem a fotografická výstava. Wi-Fi ani
    wellness zázemí prameny u chalupy nezmiňují.
  - >-
    Údaje na této stránce pocházejí ze sekundárního média a z OpenStreetMap
    a redakce je zatím neověřila vlastním dotazem ani návštěvou. Nejisté jsou
    i samotné kontakty: prameny nesou dvě různá telefonní čísla a dvě podoby
    webové adresy, uvádíme proto vždy jen jednu z možností a kterou z nich
    chalupa opravdu používá, potvrzené nemáme. Před cestou proto
    doporučujeme potvrdit si přímo u chalupy hlavně otvírací dobu bufetu
    a možnost přespání.

