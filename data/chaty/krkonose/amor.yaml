# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Roubená chata kousek nad centrem Pece pod Sněžkou, jejíž restaurace
  s letní terasou je vedená jako samostatná horská hospůdka s celodenním
  provozem — sem se tedy dá zajít na jídlo a pivo i bez noclehu. Spí se
  tu v pokojích pro dva až pět lidí.
text:
  - >-
    Chata Amor stojí zhruba osm set metrů od centra Pece
    pod Sněžkou — roubená stavba na dosah sjezdovek Javoru i cest do
    Obřího dolu. Nadmořskou výšku neuvádíme: prameny ji u samotné chaty
    nenesou a čísla udávaná pro okolní skiareál nepřebíráme.
  - >-
    To hlavní tu je kuchyně: restaurace Chaty Amor je v katalogu firem
    vedená jako samostatná provozovna — horská hospůdka s letní terasou
    otevřená denně od dopoledne do večera. Vlastní web k tomu píše, že
    v útulné restauraci připravují domácí pokrmy s láskou a k tomu
    výborné pivo. Turista procházející Pecí se tu tedy nají bez noclehu
    — a to je přesně služba, kterou v průvodci hledáme.
  - >-
    Nocleh chata nabízí v pokojích pro dva až pět lidí; celkových
    pětatřicet lůžek uvádí jen katalog, vlastní web souhrn nenese, a tak
    číslo bereme s touto výhradou. O historii domu, a dokonce ani o tom,
    proč se jmenuje zrovna Amor, jsme v otevřených pramenech nenašli
    jediný doložený údaj; jakmile se pramen najde, doplníme ho.
  - >-
    Údaje pocházejí z vlastního webu chaty, z katalogu firem a z katalogů
    ubytování; vlastním dotazem u provozovatele jsme zatím neověřili
    nic. Souřadnice jsou z mapových dat OpenStreetMap (© přispěvatelé
    OpenStreetMap, ODbL) a v terénu je nikdo nekontroloval.

