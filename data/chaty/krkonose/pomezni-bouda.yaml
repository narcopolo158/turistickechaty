# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská bouda ve výšce 1 050 m přímo u hraničního přechodu do Polska, 7 km od
  vrcholu Sněžky. Postavena byla roku 1870 pod jménem Blaschkebaude a jedno z médií ji
  označuje za nejstarší hostinec na Pomezních Boudách. Ubytuje 50 hostů ve dvou- až čtyřlůžkových pokojích.
text:
  - >-
    Pomezní bouda stojí ve výšce 1 050 metrů na hřebeni Krkonoš, přímo u
    hraničního přechodu do Polska; adresa zní Horní Malá Úpa 40. Od vrcholu Sněžky ji dělí sedm kilometrů. Výška patří k nejlépe doloženým
    údajům na téhle stránce — shodně ji uvádějí čtyři prameny včetně rytiny
    na turistické známce vydané pro tohle místo. Jedno z médií vede boudu
    jako horský hotel.
  - >-
    Ve Staré Pomezní boudě — tedy v jiném objektu, než je ta dnešní — sídlil
    od roku 1841 celní úřad. Samotná bouda vyrostla v roce 1870 pod jménem
    Blaschkebaude a bývá označována za nejstarší hostinec na Pomezních
    Boudách. Kdy do sedla začali chodit turisté, prameny
    neuvádějí. Po roce 1945 dostala jméno Devětsil a původní název jí byl vrácen
    po roce 1989; přesné roky obou přejmenování zdroj neuvádí, takže je
    neuvádíme ani my.
  - >-
    Ubytovací kapacita je padesát lůžek — na tom se oba prameny shodují. Spí se ve dvou- až čtyřlůžkových pokojích, část z nich
    má vlastní sociální zařízení, ostatní umyvadlo na pokoji a sociální
    zařízení na patře. Z dalšího zázemí se jmenuje salonek s televizí a DVD a stolní tenis. O Wi-Fi, platbě kartou, lyžárně ani o tom, jestli je
    bouda otevřená psům, se ani jeden z dosažitelných zdrojů nezmiňuje, takže
    o nich nepíšeme.
  - >-
    Nejasno je kolem stravování, a je to nejasno podstatné. Jeden pramen u boudy uvádí polopenzi a plnou penzi, tedy službu pro
    ubytované hosty; druhý má stravování jen jako položku v seznamu služeb
    objektu.
    Ani jeden z obou pramenů nedokládá restauraci otevřenou kolemjdoucím
    turistům. Netvrdíme proto, že se tu dá najíst bez noclehu; dokud to nebude
    doložené, počítejte s tím, že jídlo tady možná dostanou jen ubytovaní.
  - >-
    Podobně opatrní musíme být u provozní doby. Otvírací dobu neuvádí ani
    jeden z dosažitelných zdrojů a celoroční provoz stojí jen na starším podkladu, ze kterého vycházíme —
    ostatní prameny o sezóně nepíšou.
  - >-
    Údaje na téhle stránce pocházejí ze dvou sekundárních zdrojů a redakce je
    zatím neověřila vlastním dotazem ani návštěvou. Prameny se rozcházejí i
    v tom, na jakou e-mailovou adresu se boudě psát, a přesnou polohu objektu
    na mapě zatím doloženou nemáme — v mapových datech, ze kterých vycházíme,
    bouda nefiguruje. Než sem doplníme ověřené údaje, doporučujeme si nocleh,
    občerstvení i aktuální provoz potvrdit přímo u boudy.
