# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Nejstarší hostinec na Pomezních Boudách (1 050 m), přímo u hraničního přechodu
  do Polska a 7 km od vrcholu Sněžky. Stojí od roku 1870, kdy nesl jméno
  Blaschkebaude, a ubytuje 50 hostů ve dvou- až čtyřlůžkových pokojích. Nese
  turistickou známku č. 673.
text:
  - >-
    Pomezní bouda (Horní Malá Úpa 40) stojí ve výšce 1 050 m n. m. na hřebeni
    Krkonoš přímo u hraničního přechodu do Polska, zhruba sedm kilometrů od
    vrcholu Sněžky. Sedlo Pomezních Bud je odedávna přechodovým a celním místem
    — už od roku 1841 tu ve Staré Pomezní boudě sídlil celní úřad.
  - >-
    Dnešní bouda byla postavena roku 1870 pod názvem Blaschkebaude a je
    nejstarším hostincem na Pomezních Boudách. Po roce 1945 nesla jméno Devětsil,
    původní název jí byl vrácen po roce 1989.
  - >-
    Ubytování nabízí 50 lůžek ve dvou- až čtyřlůžkových pokojích, buď s vlastním
    sociálním zařízením, nebo s umyvadlem a společným sociálním zařízením na
    patře; pro hosty je k dispozici salonek s televizí a stolní tenis. Stravování
    je podle dostupných zdrojů řešeno polopenzí a plnou penzí — zda je
    restaurace otevřená i kolemjdoucím turistům, se z nich doložit nedá; ověřte
    to prosím přímo u boudy.
zdroje:
  - popis: >-
      Kudy z nudy — „Horský hotel Pomezní bouda v Horní Malé Úpě" (výška,
      adresa, kapacita a pokoje, stravování, vybavení, kontakty, historie);
      sekundární médium, verified:false, ověřit primárně
    url: https://www.kudyznudy.cz/aktivity/pomezni-bouda-v-horni-male-upe
  - popis: >-
      Malá Úpa — oficiální web obce, stránka „Pomezní bouda" (výška, poloha u
      hraničního přechodu, kapacita, kontakty); sekundární zdroj, verified:false
    url: https://www.malaupa.cz/pomezni-bouda/
interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/pomezni-bouda.yaml (externí katalog ČR/SK,
  jistota B) v rámci master fronty Tier 1 (známka č.673 + katalog).

  BEZ GPS — katalog souřadnice nenese a objekt není ani v OSM exportu DATA-01;
  doplnit z OSM přes Actions nebo ručně (nedomýšlet).

  Výška 1 050 m má čtyřnásobnou shodu (Kudy z nudy, malaupa.cz, katalog, rytina
  známky č.673) — nejsilněji doložený údaj v této dávce.

  ⚠ Klíč zařazení — NEDOLOŽENO: ani jeden dosažitelný zdroj nedokládá restauraci
  otevřenou kolemjdoucím. Kudy z nudy zmiňuje jen polopenzi/plnou penzi (služba
  pro ubytované), malaupa.cz jen „stravování" v seznamu služeb. `kuchyne: ano`
  je proto vyplněno, ale `typObcerstveni` VĚDOMĚ NEVYPLNĚNO a v textu profilu je
  to otevřeně řečeno. Poloha u hraničního přechodu na hřebenové trase veřejnému
  provozu odpovídá, ale to je úvaha, ne doklad — OVĚŘIT. Pozor též na možnou
  záměnu s dalšími podniky v sedle (osada Pomezní Boudy má víc objektů).

  Zaznamenaný rozpor: e-mail info@pomezni-bouda.cz (Kudy z nudy) vs.
  pomezbouda@gmail.com (malaupa.cz) — do profilu vzat doménový, ověřit.
  Z Kudy z nudy nepřevzata cena 550 Kč/noc/osoba (ceny se mění).

  U milníku přejmenování (Devětsil) zdroj přesné roky nenese — zapsán bez roku.

  Wi-Fi, platba kartou, psi a lyžárna: zdroje neuvádějí — pole vědomě
  nevyplněna. Otvírací doba: nedoložena.

  K dotažení (DATA-04, verified:true): GPS, veřejná přístupnost a otvírací doba
  restaurace (priorita — klíč zařazení), potvrdit e-mail a sezónní režim. Hero
  fotka: kandidáti DATA-02. Známka č.673 — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c673-pomezni-boudy.png
  (známka je vydána pro místo „Pomezní Boudy · Malá Úpa", tedy pro sedlo/osadu —
  vazba na tento konkrétní objekt k ověření).
