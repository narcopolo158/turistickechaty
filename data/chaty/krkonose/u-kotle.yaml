# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Rodinný penzion na samotě u Horních Míseček v 1050 metrech, na půl
  cesty mezi Vítkovicemi a hřebeny Kotle. Bar tu podle vlastního webu
  otevírají i pro veřejnost — jen v době večeří mají přednost ubytovaní.
  Na počtu pokojů se prameny neshodnou, a tak čísla neuvádíme.
text:
  - >-
    Penzion U Kotle stojí na samotě u Horních Míseček ve výšce 1050
    metrů — jméno nese po hoře Kotel, která se zvedá nad střediskem.
    Poštovní adresou patří k Vítkovicím, lyžařsky ho ale katalogy řadí
    i ke Špindlerovu Mlýnu, kam z Míseček vede silnička na Medvědín;
    obojí říkáme, protože obojí je pravda každá po svém.
  - >-
    Pro kolemjdoucího turistu je podstatná jedna věta, kterou přebíráme
    z vlastního webu doslova: bar je „otevřen i pro veřejnost, pouze
    v době podávání večeří pro ubytované hosty se věnujeme přednostně
    jim". Kdo tedy schází od Kotle nebo stoupá na Mísečky, může se tu
    zastavit — jen u večeře počítejte s tím, že dům vaří především svým
    hostům.
  - >-
    Nocleh penzion nabízí, ale na velikosti se prameny neshodnou:
    vlastní web mluví o dvaadvaceti pokojích, katalog o devatenácti
    pokojích se šedesáti lůžky — žádné číslo proto nepřebíráme.
    O historii domu jsme zatím nenašli jediný doložený údaj; jakmile se
    pramen objeví, doplníme ho.
  - >-
    Údaje pocházejí z vlastního webu penzionu a z katalogů; vlastním
    dotazem u provozovatele jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

