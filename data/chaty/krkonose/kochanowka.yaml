# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko PTTK Kochanówka stojí nezvykle nízko — asi 510 m nad mořem —
  ve skalnaté rokli přímo pod vodopádem Szklarki; podle turistického portálu
  Szklarské Poręby na území enklávy polského Krkonošského národního parku.
  Budovu dokončili roku 1868 na místě boudičky s nápoji z roku 1824. Spravuje
  ho PTTK, má bufet a dvanáct lůžek.
text:
  - >-
    Kochanówka je mezi krkonošskými boudami zvláštní případ — neleží na
    hřebeni ani pod ním, ale hluboko v údolí potoka, ve výšce zhruba pěti set
    deseti metrů. PTTK její polohu popisuje přesně: ve skalnaté rokli u břehu
    potoka, pod stupněm vodopádu Szklarki. Že do Krkonoš přesto patří, není
    naše úvaha; portál Szklarské Poręby uvádí, že objekt stojí na území
    enklávy Karkonoského národního parku, nad ústím potoka Szklarka do řeky
    Kamienné. Administrativně spadá pod Piechowice v Dolnoslezském vojvodství.
  - >-
    Občerstvení tu funguje déle než dvě stě let, i když ne pořád ve stejné
    podobě. Podle PTTK stála na tomhle místě už od roku 1824 malá boudička s
    nápoji a teprve na jejím místě dokončili v roce 1868 budovu dnešního
    schroniska. Portál Korona Gór Polski dodává, že vznikla jako hostinec pod
    jménem Kochellfalbaude a že byla mnohokrát přestavována, než se z hostince
    stalo turistické schronisko; ten původní název nese ze všech dosažitelných
    zdrojů jediný, takže ho uvádíme s výhradou. Kdy k přestavbám došlo, zdroj
    neuvádí. Jediný pozdější zásah, který prameny datují, je důkladná oprava a
    modernizace v roce 1963.
  - >-
    Dnes objekt spravuje PTTK. Nocleh je tu podle jeho vlastní karty skromný,
    v turistickém standardu, ne hotelový: dvanáct lůžek, na kterých se shodují
    jak Korona Gór Polski, tak portál Szklarské Poręby. Ve skladbě pokojů si
    prameny úplně neodpovídají — PTTK mluví o dvou- a čtyřlůžkových pokojích v
    turistickém standardu, Korona Gór Polski o dvoulůžkových pokojích s
    vlastní koupelnou. Obojí uvádíme tak, jak to zdroje říkají, a
    nesjednocujeme to.
  - >-
    Pro kolemjdoucího je podstatný bufet, který portál Szklarské Poręby jmenuje
    ve výčtu vybavení spolu s koupelnami a toaletami; PTTK k tomu uvádí, že
    objekt nabízí celodenní stravování. Poctivě ale dodáváme, že žádný
    z dosažitelných pramenů výslovně nepíše, že bufet obsluhuje i turisty bez
    noclehu — vyplývá to z povahy bufetu a z toho, že jde o schronisko PTTK
    přímo u frekventovaného vodopádu, což je úsudek, ne doklad. Otvírací dobu
    neuvádí nikdo, takže ji tu nenajdete.
  - >-
    Kochanówka má být podle Korony Gór Polski otevřená celoročně. Údaje na
    téhle stránce pocházejí ze stránek PTTK, ze dvou polských turistických
    portálů a z OpenStreetMap a redakce je zatím neověřila vlastním dotazem
    ani návštěvou. Prameny se rozcházejí v telefonním čísle a taky v tom,
    která webová stránka objektu patří: uvádíme stránku PTTK jako správce
    objektu, druhou variantu z OpenStreetMap se nám ověřit nepodařilo. Než sem
    doplníme ověřené údaje, doporučujeme si nocleh i provoz bufetu potvrdit
    předem; kapacita je malá a redakce ji zatím neověřila.
