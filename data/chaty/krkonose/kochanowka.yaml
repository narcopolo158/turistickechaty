interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/kochanowka.yaml (kandidát OSM, DATA-01,
  stav dat 2026-07-20) po rešerši 25. 7. 2026. Povýšení schválil Michal
  en bloc v chatu 20. 7. 2026 (kategorie ✅ přehledu docs/DATA-03-prehled.md).

  ✅ KLÍČ ZAŘAZENÍ SPLNĚN, ale slaběji než u Vrbatovy a Černé boudy: bufet je
  doložen výčtem vybavení na szklarska-poreba.pl („łazienki, WC i bufet")
  a PTTK uvádí „całodzienne wyżywienie", ŽÁDNÝ zdroj však doslovně neříká, že
  obsluhuje i kolemjdoucí bez noclehu. V profilu je to otevřeně přiznáno jako
  úsudek, ne doklad. PRIORITA pro DATA-04.

  ✅ GEOGRAFIE VYŘEŠENA: kandidát nesl otázku, zda objekt v 510 m patří do
  Krkonoš. Szklarska-poreba.pl uvádí, že leží „na terenie enklawy
  Karkonoskiego Parku Narodowego" — tím je příslušnost doložena zdrojem, ne
  jen naším odhadem. (Kontrast s Raisovou chatou na Zvičině, která do Krkonoš
  NEpatří — viz její kandidátský soubor.)

  ⚠ ROZPOR telefon: +48 601420347 (pttk.jgora.pl, správce) vs. +48 781 024 159
  (OSM). Do profilu vzat kontakt PTTK. Web: PTTK vlastní stránku vs. OSM
  kochanowka.wszklarskiej.net — do profilu vzata stránka PTTK, doména z OSM
  NEOVĚŘENA. Doplněk 2. 8. 2026 (DATA-04): obě oficiální stránky PTTK
  (regionální i celostátní) znovu přečteny — doménu z OSM nezná ani jedna
  a schronisku nepřipisují žádný vlastní web; telefon u správce beze změny.
  Pokus otevřít doménu z OSM napřímo skončil 2. 8. 2026 stejně jako 25. 7.:
  načtení by chtělo Michalovo svolení, neobcházeno. Rozpor telefonů tedy trvá
  a rozhodne ho až telefonát (jde spojit s dotazem k Nad Łomniczką — týž
  správce; tam už jen ostrý režim/sezóna).

  OPRAVA ZÁPISU 25. 7. 2026: dřívější znění téhle poznámky dodávalo, že „ze
  sandboxu byla kochanowka.com.pl nedostupná". To bylo zavádějící hned dvakrát.
  Za prvé doména z OSM zní kochanowka.wszklarskiej.net, kdežto kochanowka.com.pl
  se v celém fondu nevyskytuje nikde jinde — byl to překlep, ne druhý pramen.
  Za druhé věta tvrdila výsledek pokusu o načtení, o kterém nemáme doklad, že
  proběhl. Poctivý stav je prostý: doména z OSM ověřená není a proč se to
  nepovedlo, nevíme. Pokus zopakovat ho 25. 7. 2026 skončil tím, že si načtení
  té stránky vyžádalo Michalovo svolení — neobcházeno jinými nástroji.
  Poučení obecně: do poznámek psát, co víme, ne co si pamatujeme, že jsme
  zkoušeli.

  ⚠ ROZPOR skladba pokojů: PTTK „pokoje 2 i 4 – osobowe w standardzie
  turystycznym" vs. korona-gor-polski.pl „12 miejsc noclegowych – w tym
  w pokojach dwuosobowych z łazienkami". Nesjednoceno, obojí v profilu.

  ⚠ K PROVĚŘENÍ: dřívější rešeršní průchod zaznamenal signál, že nocleh nemusí
  být turistům běžně dostupný (stav k podzimu 2024). Tento signál se
  25. 7. 2026 NEPODAŘILO znovu doložit citací a korona-gor-polski.pl naopak
  uvádí „Aktualnie: otwarte" a „Dostępność: całoroczne". Do profilu proto
  nešel; v textu je jen obecné doporučení dostupnost potvrdit předem.

  Původní název Kochellfalbaude nese jediný zdroj (korona-gor-polski.pl) —
  veden jako alias s poznámkou „neověřeno", ne jako fakt.

  Otvírací doba bufetu NEDOLOŽENA žádným zdrojem — pole nevyplněno.

  K dotažení (DATA-04, verified:true): veřejná přístupnost a otvírací doba
  bufetu (priorita — klíč zařazení), dostupnost noclehu, platný telefon a web,
  skladba pokojů. Hero fotka: kandidáty DATA-02 prošla session 27. 7. 2026 —
  všech 35 nálezů geosearche zobrazuje vodospad Szklarki, řeku a okolí, ŽÁDNÝ
  popis nepotvrzuje budovu Kochanówky → hero poctivě nevybráno; fulltext
  sklizeň z TÉHOŽ dne (klik Michala) nepřidala ŽÁDNÝ nový nález (fráze
  „Kochanówka“ na Commons neprošla sítem) → zbývá oční výběr na Commons
  nebo fotka od chataře se svolením. Turistická vizitka /
  znaczek: prověřit v katalogu znaczki-turystyczne.pl (publikace obrázků
  znaczků kryta souhlasem Turistické známky s.r.o. z 22. 7. 2026, který
  pokrývá i znaczki-turystyczne.pl).
