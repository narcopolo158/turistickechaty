interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/jelenka.yaml (DATA-01/OSM) v rámci master
  fronty Tier 1 (známka č.1367 + katalog ChatGPT + OSM). Vlastní web jelenka.eu
  je ze sandboxu nedostupný (PROVENANCE/timeout, stejně jako v session 22 i
  při DATA-03).

  Zaznamenané rozpory k dořešení při DATA-04: (1) výška 1 260 m (OSM ele +
  malaupa.cz) vs. 1 263 m (Kudy z nudy) — ponechána shoda dvou zdrojů;
  (2) sociální zařízení společné na patře (Kudy z nudy) vs. na pokoji
  (malaupa.cz); (3) Wi-Fi je (OSM internet_access=wlan, zdarma) vs. není
  (malaupa.cz) — pole `wifi` proto nevyplněno.

  DATA-21 (26. 7. 2026, položka „Jelenka 1936"): katalogový návrh z DATA-09
  chtěl rokVzniku 1936. Otevřen uvedený pramen (Krkonose.eu) a údaj tam
  doslova stojí i se jménem stavebníka — katalog SEDÍ, zapsáno. Přibyla
  k tomu ale tři zjištění, která katalog nenesl: (a) na místě podle téhož
  pramene stál kiosek pro turisty už před chatou, takže 1936 není rok, odkdy
  se tu posluhuje turistům — zapsáno do milníku i do prózy; (b) původ jména
  podle vodního pramene Emmy (nová zajímavost i alias Emma-quelle Baude);
  (c) NOVÝ ROZPOR V KAPACITĚ, 25 lůžek v pěti pokojích (3+4+4+6+8) proti 26 ve
  čtyřech (4+4+6+12) od Kudy z nudy. Pole ponechána na variantě Kudy z nudy,
  rozpor přiznán v próze — nesčítat, nevybírat „pravděpodobnější", zeptat se
  provozovatele. Vedlejší zisk: 1 260 m má tím třetí nezávislý pramen a
  osamocené 1 263 m od Kudy z nudy dál slábne.

  K dotažení (DATA-04, verified:true): nezávislé doložení roku 1936 (Krkonose.eu
  neuvádí pramen), rozsoudit počet lůžek, otvírací doba a veřejná
  přístupnost restaurace. Hero fotka: kandidáti DATA-02.
  Známka č.1367 — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c1367-horska-bouda-jelenka.png.
