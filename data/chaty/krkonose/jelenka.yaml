# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Malá hřebenová bouda ve výšce 1 260 m mezi Pomezními boudami a Sněžkou, na
  východním svahu Svorové hory. Ubytuje 26 hostů ve čtyřech pokojích, má
  restauraci s teplou i studenou kuchyní a stojí na křižovatce turistických
  cest. Autem se k ní nedostanete. Nese turistickou známku č. 1367.
text:
  - >-
    Jelenka — úředně Horská bouda Jelenka, německy Emmaquellenbaude — stojí na
    hlavním krkonošském hřebeni mezi Pomezními boudami a Sněžkou, na východním
    svahu Svorové hory; adresou patří pod Horní Malou Úpu 122. Ve výšce se
    prameny mírně rozcházejí: OpenStreetMap i obecní web Malé Úpy uvádějí
    1 260 metrů, Kudy z nudy 1 263. Podle webu obce stojí bouda na křižovatce
    turistických cest; autem se k ní dojet nedá, protože je oblast chráněná,
    a nejbližší parkoviště jsou podle Kudy z nudy dva až čtyři kilometry
    daleko.
  - >-
    Ubytování je komorní. Bouda pojme 26 hostů ve čtyřech pokojích — dvou
    čtyřlůžkových, jednom šestilůžkovém a jednom dvanáctilůžkovém — a přespat
    se dá i ve vlastním spacáku. V pokojích teče teplá i studená voda. Podoba
    sociálního zázemí je sporná: Kudy z nudy popisuje společné zařízení se
    sprchou na patře, obecní web Malé Úpy naopak píše o sociálním zařízení
    přímo na pokoji.
  - >-
    Restaurace nabízí podle Kudy z nudy teplá i studená jídla, točené pivo
    a limonádu; web Malé Úpy dodává jen tolik, že stravování je k dispozici.
    Otvírací doba po–ne od 8:00 do 18:00 pochází z OpenStreetMap a ověřená
    není; Kudy z nudy mluví o celoročním provozu, konkrétní hodiny ale
    neuvádí. Výslovně doložené není ani to, že restaurace obsluhuje
    kolemjdoucí. Domácí mazlíčci jsou podle webu obce povoleni, rozporná je
    naopak Wi-Fi: OpenStreetMap ji u boudy vede jako dostupnou a bezplatnou,
    web Malé Úpy uvádí, že k dispozici není. Jako majitele obecní web jmenuje
    Pavla Hofmana.
  - >-
    Rok vzniku ani historii boudy se z dosažitelných pramenů doložit
    nepodařilo; Kudy z nudy zmiňuje jen nedávnou rekonstrukci, kterou ale
    nedatuje. Všechny údaje pocházejí ze sekundárních médií a z OpenStreetMap
    a redakce je zatím neověřila vlastním dotazem. Před cestou proto
    doporučujeme potvrdit si přímo u boudy podobu sociálního zázemí,
    dostupnost Wi-Fi i otvírací dobu restaurace.
zdroje:
  - popis: >-
      Kudy z nudy — „Horská turistická bouda Jelenka" (výška, adresa, kapacita a
      pokoje, restaurace, kontakty, parkování); sekundární médium,
