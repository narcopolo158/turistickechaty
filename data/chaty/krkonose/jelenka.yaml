autem: |-
  Autem k boudě nelze — oblast je chráněná. Nejbližší parkoviště jsou ve vzdálenosti 2–4 km.

# ── Historie ──────────────────────────────────────────────────────────────
# rokVzniku = rok postavení CHATY. Týž pramen ale píše, že kiosek pro turisty
# tu stál už předtím — tedy 1936 není rok, kdy se na tomhle místě začalo
# posluhovat turistům. Nepřepisovat prózu tak, aby 1936 znamenalo obojí.
rokVzniku: 1936
milniky:
  - rok: 1936
    udalost: >-
      Hrabě Czernin-Morzin nechal na svém panství postavit chatu Jelenka; na
      místě už tehdy podle téhož pramene stál kiosek pro turisty
overeniHistorie:
  source: >-
    Server Krkonose.eu, stránka o boudě Jelenka (načteno 26. 7. 2026), uvádí
    doslova: „Hrabě Czernin-Morzin nechal v roce 1936 na svém panství postavit
    chatu Jelenka, která sahala až na vrchol Sněžky." a „Původně se Jelence
    říkalo Emma-quelle Baude, podle pramene Emmy, který z chaty vyvěrá. Již
    tehdy zde stál kiosek pro turisty." POZOR NA STAVBU PRVNÍ VĚTY: vztažná
    část „která sahala až na vrchol Sněžky" se u chaty číst nedá (chata na
    vrchol sahat nemůže) a mluvnicky ji nelze vztáhnout ani k „panství"
    (střední rod). Věta je v prameni zjevně zkomolená; čteme ji jako výpověď
    o rozsahu panství a v próze to připisujeme prameni, ne konstatujeme.
    POZOR NA POVAHU PRAMENE: regionální turistický server, pramen ani autor
    neuveden; dřívější poznámka, že historii nenese žádný dosažitelný zdroj,
    tím padá, ale nezávislé doložení (literatura, archiv) chybí dál — DATA-04.
    verified:false
  verified: false
  checked: '2026-07-26'

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Hřebenová bouda mezi Pomezními boudami a Sněžkou (1 260 m; jediný z pramenů
  uvádí 1 263 m). Postavit ji dal podle jednoho z pramenů roku 1936
  hrabě Czernin-Morzin, jméno má po vodním prameni Emmy. Kolik nabízí lůžek,
  se prameny neshodnou — buď 26 ve čtyřech pokojích, nebo 25 v pěti. Autem se
  k ní nedostanete.
text:
  - >-
    Jelenka — úředně Horská bouda Jelenka, německy Emmaquellenbaude — stojí na
    hlavním krkonošském hřebeni mezi Pomezními boudami a Sněžkou; adresou
    patří pod Horní Malou Úpu 122. Ve výšce se prameny mírně rozcházejí: tři se shodují na 1 260 metrech,
    čtvrtý jako jediný uvádí 1 263. Bouda stojí na křižovatce turistických
    cest; autem se k ní dojet nedá, protože je oblast chráněná, a nejbližší
    parkoviště jsou dva až čtyři kilometry daleko.
  - >-
    Postavit chatu dal podle jediného pramene, který o historii mluví, v roce
    1936 hrabě Czernin-Morzin, a to na svém panství — to sahalo až na vrchol
    Sněžky. Turisté se tu ale zastavovali už předtím: tehdy tu stál kiosek. Jméno má bouda po vodním prameni Emmy, který z ní
    vyvěrá, a německy se jí proto říkalo Emma-quelle Baude. Kdo a kdy postavil kiosek ani kdy se z Emmaquellenbaude stala Jelenka, se
    z dosažitelných pramenů dozvědět nedá — a ten jediný pramen neuvádí,
    odkud svou verzi má.
  - >-
    Kolik lidí se do boudy vejde, záleží na tom, koho se zeptáte. Jeden pramen píše o 26 hostech ve čtyřech pokojích — dvou čtyřlůžkových,
    jednom šestilůžkovém a jednom dvanáctilůžkovém. Druhý popisuje rozložení
    docela jiné: 25 lůžek v pěti pokojích po třech, čtyřech,
    čtyřech, šesti a osmi lůžkách, část z nich na palandách. O překlep
    v jednom čísle nejde, obě varianty dávají vlastní součet — spíš jde o dva
    různé stavy domu z různých let a který platí dnes, nevíme; v přehledu
    proto vedeme opatrnější nižší číslo. Přespat se dá
    i ve vlastním spacáku a v pokojích teče teplá i studená voda. Sporná je i podoba sociálního zázemí: jeden pramen popisuje společné
    zařízení se sprchou na patře, druhý naopak sociální zařízení přímo na
    pokoji.
  - >-
    Restaurace nabízí teplá i studená jídla, točené pivo a limonádu; jinde se
    dočtete jen tolik, že stravování je k dispozici. Otvírací doba po–ne od
    8:00 do 18:00 pochází z mapových dat a ověřená není; mluví se i o
    celoročním provozu, konkrétní hodiny ale chybí. Výslovně doložené není ani to, že restaurace obsluhuje
    kolemjdoucí. Domácí mazlíčci jsou povoleni, rozporná je naopak Wi-Fi: mapová data ji u
    boudy vedou jako dostupnou a bezplatnou, podle jiného pramene k dispozici
    není. Jako majitel se uvádí Pavel Hofman.
  - >-
    Historii boudy nese jediný dosažitelný pramen a ten neuvádí, odkud ji má;
    jinde se zmiňuje jen nedávná rekonstrukce, bez data. Ostatní údaje pocházejí ze sekundárních médií
    a z OpenStreetMap a nic z toho jsme zatím neověřili vlastním dotazem. Před
    cestou proto doporučujeme potvrdit si přímo u boudy počet lůžek, podobu
    sociálního zázemí, dostupnost Wi-Fi i otvírací dobu restaurace.

