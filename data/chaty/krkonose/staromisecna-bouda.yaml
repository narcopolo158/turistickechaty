# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Větší ze dvou bud společného areálu na Horních Mísečkách, na svazích
  Medvědína v 1035 metrech. Portál areálu tu nabízí šestapadesát míst
  pro skupiny i jednotlivce; sesterská Novomísečná bouda stojí pár kroků
  vedle a má v průvodci vlastní zápis.
text:
  - >-
    Staromísečná bouda stojí na Horních Mísečkách — luční enklávě na
    svazích Medvědína, poštovní adresou v obci Vítkovice — ve výšce
    1035 metrů. S menší Novomísečnou boudou tvoří jeden areál
    a rezervační portál je nabízí společně; v průvodci vedeme každou
    zvlášť, protože jsou to dva domy s vlastním jménem i historií.
  - >-
    Nocleh tu portál vede pro skupiny i jednotlivce, na týdny
    i víkendy: v této boudě šestapadesát míst, k pokojům kuchyňky, ve
    společenské místnosti bar. Komu přesně bar slouží, pramen neříká —
    a katalogový záznam hospody z roku 2016 je na dnešní tvrzení příliš
    starý, takže občerstvení netvrdíme.
  - >-
    Historie osady je starší než většina hřebenových bud: Horní Mísečky
    byly podle turistického serveru založeny roku 1642, kdy tu vyrostla
    i první bouda. Ten letopočet ale patří osadě jako celku — o tom, kdy
    vznikla samotná Staromísečná, jsme zatím nenašli jediný doložený
    údaj.
  - >-
    Údaje pocházejí z rezervačního portálu areálu a z turistického
    serveru; vlastním dotazem jsme zatím neověřili nic. Souřadnice jsou
    z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap, ODbL)
    a v terénu je nikdo nekontroloval.

