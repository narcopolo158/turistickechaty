# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská bouda ve výšce 1 140 m n. m. nad Rokytnicí nad Jizerou v západních
  Krkonoších. Restaurace s domácí kuchyní a vlastní pekárnou má otevřeno
  denně, areál funguje 363 dní v roce.
text:
  - >-
    Chata Dvoračky stojí ve výšce 1 140 m n. m. nad Rokytnicí nad Jizerou
    v západních Krkonoších. Web areálu ji vede jako Horskou boudu Dvoračky
    a popisuje dohromady dva objekty — kromě boudy i sousední horský hotel
    Štumpovka.
  - >-
    Historii boudy máme zatím jen ze sekundárního zdroje. Podle Seznam
    Zpráv sahá první písemná zmínka k roku 1688, kdy tu stály letní boudy
    pro zhruba padesát krav a osmdesát koz. Po druhé světové válce byla
    bouda vrácena Elle Půhonné a později znárodněna; od počátku
    devadesátých let ji provozuje rodina Starých. Titulek téhož článku
    navíc připomíná, že bouda v minulosti ubytovávala Beneše. Primárním
    pramenem nic z toho zatím ověřené nemáme.
  - >-
    Restaurace s domácí kuchyní má otevřeno denně od devíti ráno do
    půlnoci a areál je podle webu v provozu 363 dní v roce. Web mluví
    o vyhlášené restauraci a vlastní pekárně; specialitou je právě pečivo,
    které si tu pečou sami, a Seznam Zprávy k Dvoračkám přiřazují
    borůvkové knedlíky a domácí pečené housky.
  - >-
    Nocleh bouda nabízí, kapacitu lůžek přímo v ní se nám ale z webu
    doložit nepodařilo — ubytování je tam popsané za celý areál dohromady.
    Doložené nemáme ani přístupové trasy. Než sem doplníme ověřené údaje,
    doporučujeme si volná lůžka i aktuální otvírací dobu potvrdit přímo
    u provozovatele.
