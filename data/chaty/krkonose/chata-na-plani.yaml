# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bouda se samoobslužným stravováním na vrcholu Přední Planiny — podle
  vlastního webu ve výšce 1 180 metrů, osm set metrů od horní stanice
  lanovky Špindlerův Mlýn — Svatý Petr. Nabízí pronájem pokojů, společnou
  komunitní kuchyň a bar s lehkým občerstvením. Web boudy klade její
  počátky až do roku 1530 k rodině Rennerů a k březnu 1944 sem situuje
  setkání odpůrců nacismu kolem plukovníka Stauffenberga — obojí jsou
  tvrzení provozovatele, která nezávisle doložená nemáme.
text:
  - >-
    Bouda Na Pláni stojí podle vlastního webu na vrcholu Přední Planiny
    v nadmořské výšce 1 180 metrů, zhruba osm set metrů od horní stanice
    lanovky Špindlerův Mlýn — Svatý Petr. Adresou spadá pod Přední Labskou,
    část Špindlerova Mlýna. Polohu z webu potvrzuje i mapová databáze
    OpenStreetMap, která ale objekt vede pod jménem Chata na Pláni; držíme
    se tvaru Bouda Na Pláni, jak se objekt jmenuje sám, a německého jména
    Planurbaude, které web také uvádí.
  - >-
    Historie je tu vyprávěná odvážně a je fér říct, odkud pochází: obojí
    níže nese jen vlastní web boudy. Ten píše, že boudu postavili Rennerové
    už v roce 1530 — byl by to nejstarší letopočet, jaký zatím u krkonošských
    bud vedeme, a právě proto ho nevydáváme za doložený, dokud ho nepotvrdí
    nezávislý pramen. A dál: v březnu 1944 se tu podle webu sešli odpůrci
    nacismu včetně plukovníka hraběte Clause von Stauffenberga — web mluví
    o setkání s jeho rodinou a dodává, že zde byly domluveny detaily
    atentátu na Adolfa Hitlera. Tvrzení o domlouvání detailů atentátu je
    silné a nezávislé doložení k němu nemáme — berte celé vyprávění jako
    podání provozovatele, dokud neřekneme jinak.
  - >-
    Charakter dnešního provozu je důležité pochopit předem: podle toho, jak
    se bouda sama prezentuje, tu klasická restaurace s obsluhou není —
    stravování je samoobslužné. Bouda nabízí pronájem dvou-
    a třílůžkových pokojů, k tomu čtyřlůžkový a pětilůžkový pokoj, a hosté
    si vaří sami ve společné, podle webu plně vybavené velkokapacitní
    kuchyni. Ve společenských prostorech — jídelně a denní místnosti —
    funguje bar s teplými a studenými nápoji a lehkým občerstvením. Kolik
    lůžek bouda přesně má, neuvádíme: vlastní web mluví o kapacitě až 53
    osob, oficiální web Špindlerova Mlýna o padesáti, a mezi čísly
    nevybíráme.
  - >-
    Pro kolemjdoucího turistu je podstatná jedna nejistota: jestli bar
    obslouží i hosty, kteří v boudě nespí, žádný z pramenů neříká. Poloha
    kousek od horní stanice lanovky k zastavení svádí — a právě proto to
    odmítáme domýšlet. Před cestou s plánem na občerstvení doporučujeme
    zavolat.
  - >-
    Údaje na téhle stránce pocházejí z webu boudy, který jsme načetli
    27. července 2026, z oficiálního webu Špindlerova Mlýna a z mapové
    databáze OpenStreetMap; redakce je zatím neověřila vlastním dotazem ani
    návštěvou. Historické letopočty nesou jen vlastní prezentaci boudy
    a čekají na nezávislé doložení.

