interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/chata-na-plani.yaml (DATA-01, OSM)
  27. 7. 2026 — fronta DATA-27 (Tier 4 silná, č. 2 „⭐"). Web boudy načten
  přímo 27. 7. 2026 (WebFetch prošel) — kontakty/kapacita/pokoje/historie
  z něj, checked 2026-07-27.

  ✅ IDENTITA POTVRZENA: GPS webu 50.7027842N, 15.6253642E ≈ OSM (~35 m —
  přepočteno auditem 27. 7., původní odhad ~20 m byl chybný);
  primární název dle webu „Bouda Na Pláni", OSM tvar „Chata na Pláni"
  v aliasech (návrh z DATA-03 splněn).

  ⚠ KLÍČ ZAŘAZENÍ: bar s lehkým občerstvením (web) + turistická minulost
  (DATA-25). Komu bar slouží, web neříká — přiznáno v próze i overeni.
  CHARAKTER: stravování samoobslužné (komunitní kuchyň, pronájem pokojů) —
  poctivě v próze, typObcerstveni: bufet jako nejbližší hodnota číselníku.
  typ: obsluhovana VĚDOMĚ — bouda má provozovatele a personál (bar,
  pronájem), samoobslužný je jen způsob stravování; útulna by značila
  neobsluhovaný objekt. Kdyby taxonomie někdy dostala jemnější typ,
  přehodnotit.

  ⚠ ROK 1530 a STAUFFENBERG 1944: obojí nese JEN web boudy — důsledně
  připsáno („podle webu boudy"), v próze výslovná výhrada u atentátu
  (silné tvrzení bez nezávislého dokladu). rokVzniku 1530 zapsán s
  komentářem (vzor 1717 Lyžařská, 1784 Erlebachova — připsaný letopočet).

  ⚠ ROZPOR kapacita: „až 53 osob" (web) × 50 (spindleruv-mlyn.com) →
  NEVYPLNĚNA, próza rozsah přiznává. Druhý telefon +420 737 237 115
  veden jen v overeniProvoz.

  K dotažení (DATA-04, verified:true): obsluha baru pro kolemjdoucí
  (klíčová otázka), kapacita (53×50), sezóna/otvírací doba (web neuvádí),
  nezávislé doložení 1530 a validace vyprávění o 1944 (regionální
  literatura — např. Kulturní památky Krkonoš / muzeum KRNAP).
