# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Malé soukromé horské schronisko (830 m) u vodopádu Kamieńczyk nad Szklarskou
  Porębou v polských Krkonoších. Devatenáct lůžek, bufet s teplou kuchyní
  a terasa; jako soukromé schronisko funguje od roku 1995.
text:
  - >-
    Schronisko Kamieńczyk stojí ve výšce zhruba 830 metrů u vodopádu
    Kamieńczyk, v lesích nad Szklarskou Porębou na polské straně Krkonoš. Je
    to malý soukromý objekt s ubytováním i občerstvením.
  - >-
    Budova je starší než schronisko samo. Na počátku dvacátého století tu stál
    německý horský hostinec zhruba na pětatřicet míst, po druhé světové válce
    objekt sloužil armádě a v roce 1984 při opravě vyhořel. Jako soukromé
    turistické schronisko funguje od roku 1995, kdy ho otevřeli manželé
    Sieleccy; tuhle časovou osu shrnuje katalogový profil na
    Schroniskaturystyczne.pl. Oficiální turistický portál města k tomu dodává,
    že jde o první soukromou horskou chatu postavenou v Polsku po druhé
    světové válce — to je ovšem tvrzení jediného zdroje, které odjinud
    potvrzené nemáme.
  - >-
    Ubytovací kapacitu uvádí katalogový profil jako devatenáct míst a zároveň
    mluví o šesti dvoulůžkových a jednom třílůžkovém pokoji; ta dvě čísla si
    navzájem neodpovídají, proto je přebíráme tak, jak je pramen nese, a víc k
    nim zatím říct neumíme. Bufet vydává teplá jídla, k tomu patří malý obchod
    s občerstvením a terasa; kousek od schroniska stojí Szałas Sielanka s
    grilovanými pokrmy.
  - >-
    Autem se dá dojet jen na parkoviště v Szklarské Porębě, dál se pokračuje
    pěšky. Od parkoviště je to k vodopádu, u něhož schronisko stojí, zhruba
    půl hodiny chůze; z centra města vede k vodopádu červená značka, po které
    je to asi padesát minut.
  - >-
    Otvírací dobu bufetu ani provozní sezónu doloženou nemáme. Výška,
    kapacita, historie i časy přístupu pocházejí z jediného katalogového
    profilu, poloha z OpenStreetMap, a redakce je zatím neověřila vlastním
    dotazem ani návštěvou. Před cestou proto doporučujeme ověřit si přímo u
    schroniska, zda je otevřeno a v jakém režimu.
