interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/schronisko-kamienczyk.yaml (DATA-01) po
  křížovém ověření DATA-03. Zdroj katalog schroniskaturystyczne.pl (oficiální
  web schroniska nedohledán) — vše verified: false dle konvence B (verified:
  true jen po vlastním ověření Michala). Do DATA-04 dotáhnout: e-mail a web,
  ověřit telefon, přesnou GPS u vodopádu, provozní sezónu, rozpor výšky
  830/840 m a rozpor letopočtů 1995/1997.

  DATA-15 (jazykový audit 25. 7. 2026, čtvrtá dávka): opraveno devět vad,
  žádný nález zamítnut — nejhustší soubor dávky. (1) „Budova je starší než
  schronisko samo" tvrdilo stáří stavby, ač prameny nesou jen kontinuitu
  místa: milniky i overeniHistorie mluví o hostinci, který tu „stál", a mezi
  požárem z roku 1984 a otevřením 1995 profil nedokládá nic. Věta si navíc
  odporovala s prvenstvím „chaty POSTAVENÉ po druhé světové válce" o tři věty
  níž. Přepsáno na „Místo je starší" s výslovným přiznáním, že nevíme, co je
  původní a co novostavba — totéž rozlišení už jednou v korpusu padlo
  u profilu Pod Łabskim Szczytem (DENIK ř. 133). (2) Nepřiznaný rozpor
  letopočtů: doplňková fakta (HUT-0225) nesou u téhož městského portálu, ze
  kterého pochází naše zajímavost, rok_vzniku 1997 a milník „1997 — postavena
  současná chata", zatímco profil má rokVzniku 1995 a o roce 1997 v celém
  souboru nestálo ani slovo. Pole se nepřepsalo mechanicky, protože DATA-09
  doplňuje jen prázdná pole, takže rozpor zapadl potichu. Konvence B ho žádá
  přiznat; doplněn nový odstavec, který obě čtení klade vedle sebe a říká,
  proč zůstáváme u roku 1995. (3) Nepřiznaný rozpor výšky: externí katalog
  (HUT-0225) uvádí 840 m a master přehled DATA-03 obě čísla dokonce vypisuje
  vedle sebe, próza ale mluvila o „zhruba 830 metrech" — slovo „zhruba" rozpor
  nepřiznává, jen změkčuje jedno z čísel. Doplněno do text[0] i do
  overeniLokace.source podle vzoru Výrovky a Lysečinské boudy. (4) „v lesích
  nad Szklarskou Porębou" — tvrzení o typu terénu, které nenese žádný pramen
  (overeniLokace.source má jen výšku a polohu u vodopádu). Táž vada jako
  „na hřebeni" u Martinovy a Lesní boudy; vypuštěno. Vazba „nad Szklarskou
  Porębou" zůstává, ta plyne z doložených polí vyska a obec. (5) „Oficiální
  turistický portál města k tomu dodává" podávalo tvrzení jako přečtené na
  portálu — stránku jsme nikdy neotevřeli, údaj jde přes AI kompilaci, o níž
  její vlastní PUVOD.md říká, že primární pramen to není. Přepsáno na
  „doplňkový podklad připisuje portálu… stránku jsme neotevřeli"; tentýž
  vzorec korpus opravoval už v DENIK ř. 145. (6) „Autem se dá dojet jen na
  parkoviště" dopočítávalo zákaz příjezdu z toho, že pramen popisuje pěší
  přístup; overeniPristup nese výhradně časy chůze a externí katalog má
  neurčité „pěšky / dle objektu autem". Pole autem i próza přepsány na to, co
  pramen skutečně nese, s dovětkem, že bližší příjezd doložený nemáme.
  (7) „z jediného katalogového profilu" bylo nepravdivé — próza sama o tři
  odstavce výš cituje druhý pramen (městský portál) a ten v zdroje vůbec
  nebyl. Výčet v závěru opraven a do zdroje přidány tři chybějící položky:
  městský portál, doplňková fakta a externí katalog. Táž vada padla ve třetí
  dávce u Lysečinské boudy. (8) „provozní sezónu doloženou nemáme" mlčky
  vynechávalo, že externí katalog u tohohle objektu nese „celoročně" (jistota
  B, zdroje de.wikipedia.org a pttk.pl). Agent u tohohle nálezu sám snížil
  jistotu, protože PUVOD.md katalogu říká, že jde o vodicí, ne verifikační
  zdroj — při adjudikaci ale rozhodlo, že tvrzení o stavu pramenů má být
  pravdivé i tehdy, když pramen za doklad nebereme; přesně tak zní i oprava
  otvírací doby u Výrovky v téže dávce. Próza teď říká obojí: doklad to není,
  ale existuje. (9) Vyplněný telefon si odporoval se třemi místy souboru,
  která tvrdila, že kontakty nemáme (komentář nad overeniProvoz,
  overeniProvoz.source, úkol v interniPoznamky), a jeho jediná stopa byl
  zakomentovaný řádek s doménou, která ani není v zdroje. Komentář opraven,
  připsání doplněno do overeniProvoz.source i do zdroje, úkol DATA-04 zúžen.
  ZAMÍTNUTO po druhém čtení (agentem, potvrzeno při adjudikaci): aritmetický
  rozpor 19 míst vs. 6×2 + 1×3 není vada, protože ho text říká nahlas — to je
  poctivost (DENIK ř. 145). Perex s holým „Devatenáct lůžek" nepotřebuje
  připsání, protože nejde o volbu mezi dvěma prameny jako u Dvorské boudy, ale
  o vnitřní aritmetiku jednoho pramene, kterou próza přiznává. Kotvicí rok
  1900 u události „na počátku 20. století" má domácí vzor (dvorska-bouda 1920,
  chata-dvoracky 1990) a neurčitost nese samo pole udalost. Vojenské využití
  po válce v milnících sice není, ale overeniHistorie ho nese doslova.
  „Katalogový profil na Schroniskaturystyczne.pl" je doména v prvním pádě
  s řídicím podstatným jménem, tedy vzorový domácí tvar (DENIK ř. 121), a
  slovo „profil" tu označuje stránku pramene, ne naši stránku. Superlativ
  o prvenství není nepřipsaný — vada byla v tom, komu se připisoval. Časy
  z DATA-06 (pristupove-trasy.json) nejsou pramen o časech, ale odvozený
  artefakt, takže rozpor s nimi nepočítáme. Známka č. 29 se ve veřejné próze
  neobjevuje, což je po nálezu z první dávky správně.
