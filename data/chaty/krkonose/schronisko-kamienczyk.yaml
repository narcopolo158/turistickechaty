# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Malé soukromé horské schronisko (830 m) u vodopádu Kamieńczyk nad Szklarskou
  Porębou v polských Krkonoších. Devatenáct lůžek, bufet s teplou kuchyní
  a terasa; jako soukromé schronisko funguje od roku 1995.
text:
  - >-
    Schronisko Kamieńczyk stojí ve výšce zhruba 830 metrů u vodopádu
    Kamieńczyk nad Szklarskou Porębou na polské straně Krkonoš. Tu výšku nese
    katalogový profil na Schroniskaturystyczne.pl; externí katalogový podklad
    ale pracuje s hodnotou 840 metrů. Rozpor rozřešený nemáme a zůstáváme
    u nižší hodnoty. Je to malý soukromý objekt s ubytováním i občerstvením.
  - >-
    Místo je starší než schronisko samo. Na počátku dvacátého století tu stál
    německý horský hostinec zhruba na pětatřicet míst, po druhé světové válce
    objekt sloužil armádě a v roce 1984 při opravě vyhořel; co z původní
    budovy zbylo a co je novostavba, doložené nemáme. Jako soukromé
    turistické schronisko funguje od roku 1995, kdy ho otevřeli manželé
    Sieleccy; tuhle časovou osu shrnuje katalogový profil na
    Schroniskaturystyczne.pl.
  - >-
    Doplňkový podklad, ze kterého sem přišel kontakt a zajímavost o prvenství,
    ale u téhož objektu uvádí rok 1997 a k němu poznámku, že tehdy byla
    postavena současná chata. Který letopočet platí — a jestli se jeden týká
    otevření schroniska a druhý stavby — rozřešené nemáme; zůstáváme u roku
    1995, který nese katalogový profil. Týž doplňkový podklad připisuje
    oficiálnímu městskému turistickému portálu tvrzení, že jde o první
    soukromou horskou chatu postavenou v Polsku po druhé světové válce;
    samotnou stránku portálu jsme ale neotevřeli a jinde potvrzené to nemáme.
  - >-
    Ubytovací kapacitu uvádí katalogový profil jako devatenáct míst a zároveň
    mluví o šesti dvoulůžkových a jednom třílůžkovém pokoji; ta dvě čísla si
    navzájem neodpovídají, proto je přebíráme tak, jak je pramen nese, a víc k
    nim zatím říct neumíme. Bufet vydává teplá jídla, k tomu patří malý obchod
    s občerstvením a terasa; kousek od schroniska stojí Szałas Sielanka s
    grilovanými pokrmy.
  - >-
    Nejbližší parkoviště je v Szklarské Porębě; od něj je to k vodopádu,
    u něhož schronisko stojí, zhruba půl hodiny chůze a z centra města po
    červené značce asi padesát minut. Jestli se dá dojet blíž, doložené
    nemáme.
  - >-
    Otvírací dobu bufetu doloženou nemáme; celoroční provoz nese jen externí
    katalogový podklad, který sám o sobě za doklad nebereme. Výška, kapacita,
    časová osa i časy přístupu pocházejí z katalogového profilu, tvrzení
    o prvenství z doplňkového podkladu odkazujícího na městský turistický
    portál, poloha z OpenStreetMap — a redakce nic z toho zatím neověřila
    vlastním dotazem ani návštěvou. Před cestou proto doporučujeme ověřit si
    přímo u schroniska, zda je otevřeno a v jakém režimu.
