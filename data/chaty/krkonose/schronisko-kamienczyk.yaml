# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Malé soukromé horské schronisko (830 m) u vodopádu Kamieńczyk nad Szklarskou
  Porębou v polských Krkonoších. Devatenáct lůžek, bufet s teplou kuchyní a
  terasou — a k němu jeden z nejvyšších vodopádů polských Sudet.
text:
  - >-
    Schronisko Kamieńczyk stojí ve výšce zhruba 830 m u vodopádu Kamieńczyk,
    v lese nad Szklarskou Porębou. Objekt má starší kořeny — na počátku
    20. století zde býval německý horský hostinec zhruba na 35 míst; po druhé
    světové válce budovu využívala armáda a v roce 1984 při opravě vyhořela.
    Jako soukromé turistické schronisko funguje od roku 1995, kdy ho otevřeli
    manželé Sieleccy.
  - >-
    Dnes nabízí devatenáct lůžek v šesti dvoulůžkových a jednom třílůžkovém
    pokoji, bufet s teplými jídly, malý obchod s občerstvením a terasu; poblíž
    stojí Szałas Sielanka s grilovanými pokrmy. Autem se dá dojet na parkoviště
    v Szklarské Porębě, dál se pokračuje pěšky — od parkoviště asi půl hodiny
    po červené značce k vodopádu.
