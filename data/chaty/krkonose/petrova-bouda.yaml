  veřejnou útulnou — redakce zváží případné přeřazení na horsky-hotel.

  Doména: Kudy z nudy uvádí petrovyboudy.cz, kandidát/OSM petrovabouda.cz —
  ověřit platnou. K dotažení (DATA-04): GPS, potvrdit výšku, kapacity, provozní
  sezónu. Hero fotka: kandidáti DATA-02. Známka č.671 — obrázek připraven
