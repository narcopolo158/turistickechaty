# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Novodobě obnovená bouda na hřebeni Krkonoš u polské hranice, adresou ve
  Špindlerově Mlýně (kolem 1 288 m). Původní budovu zničil požár v roce 2011,
  nová vznikla 2020. Nabízí kolem 96 lůžek, wellness a veřejnou útulnu;
  restaurace slouží jen ubytovaným.
text:
  - >-
    Petrova bouda, uváděná také v množném čísle jako Petrovy Boudy, stojí
    podle Kudy z nudy na hřebeni Krkonoš přímo u státní hranice s Polskem;
    adresou patří ke Špindlerovu Mlýnu, čp. 89. Nadmořskou výšku 1 288 metrů
    nese katalogový záznam, ze kterého vycházíme, a zatím ji nemáme
    potvrzenou z dalšího pramene.
  - >-
    Dnešní podoba boudy je nová. Původní historickou budovu zničil 31.
    července 2011 požár a moderní stavbu, která ji nahradila, dokončili podle
    Kudy z nudy v květnu 2020; jestli nová bouda stojí přesně na místě té
    staré, naše prameny neříkají. Kořeny místa ovšem sahají mnohem hlouběji:
    první zmínky se vážou k roku 1790, kdy tu stála letní chata, celoročně
    obývanou boudu tu v roce 1811 postavil Johann Pittermann a z roku 1887 je
    doložena nejstarší chráněná podoba boudy. Celou tuhle časovou osu
    přebíráme ze sekundárního média a primárním pramenem zatím ověřená není.
  - >-
    Ubytování má dohromady zhruba šestadevadesát lůžek. V hlavní budově jich
    je dvaapadesát, z toho čtyřicet v ubytovací části a dvanáct v noclehárně;
    k tomu jsou tu čtyři větší a dva menší apartmány s kapacitou až
    dvaatřiceti osob a dalších dvanáct lůžek nabízí objekt Ovčárna. Restaurace
    slouží jen ubytovaným hostům a veřejně přístupná není. Kolemjdoucí turisté
    mají k dispozici samostatnou útulnu otevřenou denně od osmi do osmnácti
    hodin, kde se dá schovat a sníst si vlastní jídlo. V suterénu je wellness,
    v Ovčárně sauna a bouda nabízí i prostor pro pracovní setkání a workshopy.
  - >-
    Nedoloženého je tu zatím dost. Vycházíme prakticky z jediného
    sekundárního média, které redakce neověřila vlastním dotazem ani
    návštěvou, a chybí nám doložený popis přístupových cest i provozní
    sezóny. Rozcházejí
    se i prameny v tom, která internetová adresa boudě patří: Kudy z nudy
    uvádí doménu petrovyboudy.cz, kdežto katalogový podklad a mapová data
    nesou doménu petrovabouda.cz — v kontaktech vedeme první variantu,
    ověřená ale není. Před cestou proto doporučujeme potvrdit si přímo u boudy
    zejména otvírací dobu útulny a to, zda restaurace opravdu vaří jen pro
    ubytované.
