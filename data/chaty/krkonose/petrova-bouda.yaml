  AUDIT 25. 7. 2026 (přísný průchod, 3 nálezy, všechny opraveny): (1) text[1]
  tvrdil, že nová budova nahradila vyhořelou „na témže místě" — to nenese žádný
  pramen a přitom právě tahle spojka svařovala linku 1790–1811–1887 s přestavbou
  po roce 2011; formulace vypuštěna a mezera přiznána. (2) text[3] vyjmenovával,
  co je nedoložené, ale rozpor v doméně (petrovyboudy.cz × petrovabouda.cz)
  mlčky vynechával, ačkoli jedna z variant je publikovaná v kontakty.web —
  doplněno. (3) perex umisťoval boudu „nad Špindlerovým Mlýnem"; doložená je
  jen obec a hřeben u hranice, GPS je záměrně prázdná — přeformulováno na
  „adresou ve Špindlerově Mlýně".
