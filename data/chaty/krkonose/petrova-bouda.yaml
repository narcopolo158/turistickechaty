# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Novodobě obnovená bouda na hřebeni Krkonoš u polské hranice nad Špindlerovým
  Mlýnem (kolem 1 288 m). Původní budovu zničil požár v roce 2011, nová vznikla
  2020. Nabízí kolem 96 lůžek, wellness a veřejnou útulnu; restaurace slouží jen
  ubytovaným. Nese turistickou známku č. 671.
text:
  - >-
    Petrova bouda (Petrovy Boudy) stojí na hřebeni Krkonoš přímo u státní
    hranice s Polskem, adresa Špindlerův Mlýn 89. Místo má kořeny kolem roku
    1790 (letní chata) a celoročně obývanou boudu tu roku 1811 postavil Johann
    Pittermann. Původní historickou budovu zničil 31. července 2011 požár a na
    jejím místě byla v květnu 2020 dokončena nová, moderní bouda.
  - >-
    Ubytování nabízí zhruba 96 lůžek — v hlavní budově (52 lůžek vč. noclehárny),
    ve větších i menších apartmánech a v objektu Ovčárna. Restaurace je určena
    jen ubytovaným hostům; kolemjdoucí turisté mohou využít samostatnou útulnu
    otevřenou denně od 8 do 18 hodin, kde je možné se ohřát a sníst vlastní
    jídlo. K dispozici je wellness a sauna. Údaje jsou ze sekundárního zdroje
    (Kudy z nudy) — před cestou ověřte přímo u boudy.
zdroje:
  - popis: >-
      Kudy z nudy — „Petrova bouda ve Špindlerově Mlýně" (historie, kapacita,
      útulna, kontakty); sekundární médium, verified:false, ověřit primárně
    url: https://www.kudyznudy.cz/aktivity/petrova-bouda-ve-spindlerove-mlyne
