# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Malý srub vysoko v Sowí dolině nad Karpaczem, na strmém Černém svahu
  kolem 1160 metrů. Kdysi otevřený samoobslužný schron — na snímku
  z léta 1966 ještě přístupný komukoli — dnes patří Krkonošskému
  národnímu parku, je zamčený a klíče má jen úzký okruh lidí. Do
  průvodce patří svou minulostí; nocleh tu nehledejte.
text:
  - >-
    Chatka Puchatka stojí v horní části Sowí doliny na polské straně
    hor, na strmém svahu zvaném Czarne Zbocze, ve výšce kolem 1160
    metrů. Pozor při hledání: penziony téhož jména ve Szklarske Porębě
    a v Michałowicích jsou úplně jiné domy — tenhle srub se stolem před
    vchodem najdete jen pěšky, stranou značených cest.
  - >-
    Bývaly doby, kdy schron sloužil každému, kdo do doliny zabloudil —
    fotografie z léta 1966 ho zachycuje „ještě otevřený a samoobslužný".
    Později o něj pečovali nadšenci, naposledy vratislavské sdružení
    Radio Młodych a od podzimu 2008 sdružení Creativo; po sporech ale
    zůstal ve výhradní správě Krkonošského národního parku, který ho
    podle plánu ochrany vyhrazuje ochranářským pracím, výzkumu
    a ekologické výchově.
  - >-
    Dnešek je tedy třeba říct bez obalu: chatka je zamčená a klíče má,
    slovy reportáže, „úzká skupina vyvolených" — kolemjdoucí turista se
    dovnitř nedostane a s noclehem tu počítat nemůže. V průvodci ji
    vedeme jako památku na éru otevřených karkonoských chatek, které
    zvolna mizí za zámky.
  - >-
    Údaje pocházejí z polského místopisného webu, regionálních zpráv
    a reportáží; vlastním dotazem jsme zatím neověřili nic. Souřadnice
    jsou z mapových dat OpenStreetMap (© přispěvatelé OpenStreetMap,
    ODbL) a v terénu je nikdo nekontroloval.

