# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská bouda ve výšce 1 288 m u Špindlerova Mlýna, kterou dva prameny kladou
  do roku 1795 a spojují s Martinem Erlebachem; starší letopočet 1642, který
  se o ní taky traduje, jeden z těch pramenů vyvrací. Nabízí 42 lůžek ve 12
  pokojích s vlastním sociálním zařízením, saunu a Wi-Fi; v objektu je
  i restaurace s krbem, jestli obslouží i kolemjdoucí, ale prameny neuvádějí.
text:
  - >-
    Martinova bouda stojí ve výšce 1 288 m n. m. nad Špindlerovým Mlýnem;
    adresou patří do jeho části Labská. Jde o obsluhovanou boudu s ubytováním
    i vlastní restaurací. Výšku a adresu uvádí Kudy z nudy, souřadnice objektu
    pocházejí z OpenStreetMap.
  - >-
    O roce vzniku kolují dva letopočty a dělí je půldruhého století. Server
    Poznej domy i oficiální krkonošské turistické stránky se shodují na roce
    1795, kdy boudu na pozemku jilemnické harrachovské vrchnosti postavil
    Martin Erlebach z Krausových bud — po něm se jmenuje — a kdy sloužila
    letní pastvě dobytka. Vedle toho se traduje rok 1642 a založení
    protestantskými uprchlíky. Poznej domy tuhle starší verzi výslovně
    odmítají s odůvodněním, že na Grauparově mapě z roku 1765 bouda ještě
    není. Držíme se roku 1795: nesou ho dva prameny nezávisle na sobě a jeden
    z nich pro svůj závěr uvádí důvod, kdežto pro rok 1642 jsme žádný doklad
    nenašli. Přiznáváme ale, že podklad, ze kterého jsme vyšli, nabízel právě
    rok 1642 s odkazem na web boudy — a ten se nám otevřít nepodařilo, takže
    jsme letopočet nemohli ověřit tam, odkud má pocházet.
  - >-
    Spí se ve dvanácti pokojích od dvoulůžkových po pětilůžkové, dohromady se
    čtyřiceti dvěma lůžky. Každý pokoj má podle Kudy z nudy vlastní sociální
    zařízení s umyvadlem, sprchovým koutem a toaletou.
  - >-
    V objektu je nekuřácká restaurace s krbem, šenk a jídelna s barem. Zda
    restaurace obsluhuje i kolemjdoucí turisty, prameny neuvádějí a otvírací
    doba doložená není; OpenStreetMap u boudy nese údaj o otevření mezi
    jedenáctou dopoledne a pátou odpoledne, ten ale zůstává neověřený.
    Kudy z nudy dál uvádějí saunu, společenskou místnost s kulečníkem
    a šipkami, projekční techniku a Wi-Fi, kterou popisují jako
    vysokorychlostní.
  - >-
    Co se s boudou dělo mezi rokem 1795 a dneškem, doložené nemáme — oba
    prameny mluví o jejím vzniku a dál mlčí. Stejně tak nemáme doloženou
    sezonu provozu ani pěší přístupové trasy. Údaje pocházejí ze
    sekundárního média Kudy z nudy a z
    OpenStreetMap, které se navíc rozcházejí v kontaktním e-mailu boudy. Před
    cestou proto doporučujeme ověřit si přímo u boudy otvírací dobu restaurace
    a její dostupnost pro neubytované.
  - >-
    Jméno Martinova bouda nese v Krkonoších ještě jeden objekt: na Benecku
    stojí stejnojmenný rodinný hotel s restaurací ve výšce 800 metrů, jak
    ho vede web obce Benecko. Je to jiná bouda v jiné obci a skoro o pět
    set metrů níž; tahle stránka je o boudě nad Špindlerovým Mlýnem.
zdroje:
