  restauraci s krbem, saunu a rychlé Wi-Fi. Nese turistickou známku č. 674.
text:
  - >-
    Martinova bouda (Martinovka) stojí na hraničním hřebeni Krkonoš ve výšce
    1 288 m n. m., adresa Špindlerův Mlýn-Labská 29. Ubytování poskytuje ve 12
    pokojích od dvoulůžkových po pětilůžkové, s celkovou kapacitou 42 lůžek;
    pokoje mají vlastní sociální zařízení.
  - >-
    K vybavení patří restaurace v objektu (nekuřácká, s krbem), šenk a jídelna
    s barem, dále sauna, vysokorychlostní Wi-Fi a společenská místnost s
    kulečníkem a šipkami. Údaje pocházejí ze sekundárního zdroje (Kudy z nudy)
    a před cestou je vhodné ověřit přímo u boudy — zejména otvírací dobu
    restaurace a její přístupnost pro kolemjdoucí.
