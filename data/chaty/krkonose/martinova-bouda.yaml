    url: https://www.obecbenecko.cz/m/turistika/ubytovani/hotely/martinova-bouda/
interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/martinova-bouda.yaml (DATA-01/OSM) v rámci
  master fronty Tier 1 (známka č.674 + katalog ChatGPT + OSM). Data z Kudy z nudy
  (sekundární médium) — vlastní web martinovka.cz je ze sandboxu nedostupný
  (robots ConnectTimeout), stejně jako v session 22.

  KOLIZE JMEN (DATA-17, uzavřeno 26. 7. 2026): jmenovec na Benecku je doložený
  — web obce Benecko ho vede jako rodinný hotel s restaurací ve výšce 800 m,
  totéž nese krajský i regionální katalog. Rozlišovací věta je proto nově
  VEŘEJNÁ (poslední odstavec `text`) a pramen stojí ve `zdroje`, jak žádá
  pravidlo R4 v docs/DATA-17-jmenovci.md. Slug se nemění: benecká bouda
  v korpusu není, takže R5 zatím nemá co spustit — příponu obce dostane až
  nový profil, kdyby vznikl. R3 splněno, perex obec jmenuje („u Špindlerova
  Mlýna"). Tenhle profil je Martinovka na hřebeni (GPS OSM way/27594723).
  Poznámka nad rámec DATA-17: benecká bouda má veřejnou restauraci, takže
  projde klíčem zařazení a je to legitimní budoucí kandidát.

  Druhá půlka staré poznámky se NEPOTVRDILA. Stálo tu, že jmenovce má i Lesní
  bouda (Špindlerův Mlýn) — čtyři vyhledávání nedala nic a `git log -S`
  ukazuje, že tvrzení vstoupilo do repozitáře commitem 0d728e2 jako holá věta
  bez pramene, odkud ho převzal BACKLOG i tahle poznámka. Vedeno jako
  „hledali jsme a nenašli", ne jako „neexistuje"; rozbor v
  docs/DATA-17-jmenovci.md.

  DATA-15 (jazykový audit 25. 7. 2026, třetí dávka): opraveny čtyři vady.
  (1) „na hraničním hřebeni Krkonoš" stálo v perexu, v text[0]
  i v zajimavosti[0], ale overeniLokace cituje z Kudy z nudy jen výšku
  a adresu — poloha na hřebeni, natož hraničním, doložená není; ze všech tří
  míst odstraněno. Položka zajimavosti[0] tím ztratila obsah (zbylo by holé
  „stojí ve výšce 1 288 m", což je duplikát pole vyska) — celá odstraněna,
  místo aby se dovymýšlelo, co je na objektu zajímavé. (2) Perex sliboval
  „restauraci s krbem" bez výhrady, ač overeniObcerstveni říká, že přístupnost
  pro kolemjdoucí uvedena není a text[2] to přiznává — doplněna stejná výhrada.
  (3) Perex tvrdil „rychlé Wi-Fi" jako vlastnost, kterou jsme ověřili;
  „vysokorychlostní" je formulace zdroje, ne měření — v perexu zůstává prosté
  Wi-Fi, v text[2] je přívlastek připsaný Kudy z nudy. (4) Výčet vybavení
  v text[2] stál bez připsání mimo okno tří vět (kontrola audit-mech D) —
  připsáno.
  ZAMÍTNUTO jako nedorozumění auditu: zajimavosti o vysokorychlostní Wi-Fi
  není domyšlená — nese pole zdroj a overeniSluzby cituje z Kudy z nudy
  doslova „vysokorychlostní Wi-Fi"; položka s vlastním zdrojem je připsaná
  ze své konstrukce. Zamítnuto i to, že text[3] „zamlčuje kapacitu" —
  42 lůžek je v text[1] uvedeno i připsáno; „přesná kapacita" v seznamu
  K dotažení je běžný úkol DATA-04 platný pro každý údaj s verified:false.

  K dotažení (DATA-04, verified:true): otvírací doba a veřejná přístupnost
  restaurace, přesná kapacita, rok vzniku/historie (Kudy z nudy neuvádí),
  potvrdit e-mail (info@martinovka.cz vs. martinovka@volny.cz z OSM). Hero fotka:
  vybrat z kandidátů DATA-02 (oční kontrola). Známka č.674 — obrázek připraven
  v data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c674-martinova-bouda.png.
