# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata na zalesněném hřebeni nad Vítkovicemi, ve III. zóně národního
  parku a na křižovatce turistických stezek. Ubytuje 29 hostů v devíti pokojích,
  restaurace nabízí minutkovou kuchyni a domácí borůvkové knedlíky. Osada Rezek
  je zároveň známkovým místem (známka č. 19).
text:
  - >-
    Chata Rezek (Rezek 43, Vítkovice v Krkonoších) stojí ve III. zóně
    Krkonošského národního parku na zalesněném hřebeni, na významné křižovatce
    turistických stezek. Ubytování nabízí 29 lůžek v devíti pokojích.
  - >-
    Restaurace vaří minutkovou kuchyni a hotová jídla, k tomu polévky a nově
    burgery; vyhlášené jsou domácí borůvkové knedlíky, koláče a palačinky.
    K posezení slouží salónek u krbu i venkovní terasa, kde lze po domluvě
    grilovat. Hosté mají k dispozici Wi-Fi a dětské hřiště.
  - >-
    Údaje pocházejí ze sekundárního zdroje (Kudy z nudy) — otvírací dobu
    restaurace, aktuální ceny i platnou webovou adresu ověřte přímo u chaty.
zdroje:
  - popis: >-
      Kudy z nudy — „Horská chata Rezek v Krkonoších" (adresa, poloha v KRNAP,
      kapacita, restaurace, Wi-Fi, kontakty); sekundární médium, verified:false,
