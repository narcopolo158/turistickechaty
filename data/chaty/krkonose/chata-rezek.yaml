interniPoznamky: >-
  Povýšeno z data/kandidati/krkonose/chata-rezek.yaml (externí katalog ČR/SK,
  jistota B) v rámci master fronty Tier 1 (známka č.19 + katalog).

  BEZ GPS — katalog souřadnice nenese a objekt není ani v OSM exportu DATA-01;
  doplnit z OSM přes Actions nebo ručně (nedomýšlet).

  ⚠ ZNÁMKA — VAZBA NEPROKÁZÁNA: turistická známka č.19 je vydána pro „Osadu
  Rezek · Jeruzalém", tedy pro OSADU, ne prokazatelně pro tuto chatu. V katalogu
  je proto vedena s jistota:"B" a s poznámkou; v perexu i textu profilu je
  formulována jako známka osady, ne chaty. K ověření (kde se známka prodává) —
  rozhodnutí Michala, zda ji u profilu vůbec držet.

  Zaznamenané rozpory k dořešení při DATA-04: (1) doména — katalog rezek.cz vs.
  hotelrezek.cz (Kudy z nudy) vs. krkonose-rezek.cz („Penzion Hájenka a Chata
  Rezek") ve vyhledávání; do profilu vzata hotelrezek.cz dle Kudy z nudy;
  (2) výška 880 m jen z katalogu (jistota B), druhým zdrojem nedoložena;
  (3) celoroční provoz jen z katalogu.

  Platba kartou, psi a lyžárna: zdroj neuvádí — pole vědomě nevyplněna.
  Otvírací doba restaurace: nikde nedoložena — nevyplněna.

  K dotažení (DATA-04, verified:true): GPS, výška, historie a rok vzniku,
  otvírací doba a veřejná přístupnost restaurace, platná doména, vazba známky
  č.19. Hero fotka: kandidáti DATA-02. Známka č.19 — obrázek připraven v
  data/externi/znamky-vizitky-2026/zdrojove-znamky-krkonose/c19-osada-rezek-jeruzalem.png.
