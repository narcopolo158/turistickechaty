# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata na zalesněném hřebeni nad Vítkovicemi, ve III. zóně národního
  parku a na křižovatce turistických stezek. Ubytuje 29 hostů v devíti pokojích,
  restaurace nabízí minutkovou kuchyni a domácí borůvkové knedlíky. Známkovým
  místem je tu podle katalogu turistických známek celá osada
  Rezek · Jeruzalém, ne prokazatelně sama chata.
text:
  - >-
    Chata Rezek stojí ve III. zóně Krkonošského národního parku na zalesněném
    hřebeni nad Vítkovicemi v Krkonoších, kam spadá i adresou (Rezek 43).
    Podle Kudy z nudy leží na významné křižovatce turistických stezek.
    Nadmořská výška 880 metrů pochází z jediného katalogového soupisu — Kudy
    z nudy ji neuvádí a druhým pramenem zatím doložená není.
  - >-
    Ubytování má chata v devíti pokojích s celkem 29 lůžky; jejich typy ani
    vybavení dosažitelný pramen nepopisuje. Restaurace vaří minutky i hotová
    jídla, k tomu polévky a nově burgery; z domácí sladké kuchyně se podávají
    borůvkové knedlíky, koláče a palačinky. Posedět se dá v salónku u krbu
    nebo na venkovní terase, u které Kudy z nudy zmiňují i možnost grilování.
    Hosté mají k dispozici Wi-Fi, u chaty je dětské hřiště. Celoroční provoz
    nese jen starší podklad, ze kterého profil vychází, Kudy z nudy o sezóně
    mlčí.
  - >-
    Otvírací dobu restaurace nenese žádný z dosažitelných pramenů a výslovně
    doložené není ani to, že by byla otevřená kolemjdoucím; nabídka minutek
    a venkovní terasa tomu sice odpovídají, zdroj to ale neříká. O platbě
    kartou, psech ani lyžárně se prameny nezmiňují a nedoložená zůstává také
    historie chaty a rok jejího vzniku.
  - >-
    Rozcházejí se i internetové adresy: vedle té, kterou uvádí Kudy z nudy, se
    ve vyhledávání objevuje ještě jedna, vedená pod hlavičkou Penzion Hájenka
    a Chata Rezek, a třetí nesl starší podklad, ze kterého profil vychází.
    Všechny údaje na této stránce pocházejí ze sekundárních pramenů a redakce
    je zatím neověřila vlastním dotazem ani návštěvou. Před cestou proto
    doporučujeme potvrdit si přímo u chaty otvírací dobu restaurace i platnou
    webovou adresu.
