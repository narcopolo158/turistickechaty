# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Malé dřevěné schronisko bez noclehu v údolí Łomniczky pod Sněžkou
  (1 002 m), zastávka na hlavní sudetské magistrále z roku 1901. Po
  zhruba pěti letech rekonstrukce se 27. března 2026 znovu otevřelo —
  občerstvení podle reportáží z otevření nabízí denně, nocleh dál ne.
text:
  - >-
    Schronisko Nad Łomniczką stojí v nadmořské výšce 1 002 metrů v údolí
    říčky Łomniczky pod Sněžkou, na polské straně hor nad Karpaczem.
    Oficiální stránka PTTK ho popisuje jako nevelkou dřevěnou budovu na
    hlavní sudetské magistrále a pohodlný bod odpočinku pro turisty
    scházející ze Sněžky. Na výšce se prameny liší o metr — jeden portál
    uvádí 1 003 metry. Polohu na mapě ukazujeme podle OpenStreetMap;
    v terénu jsme ji vlastníma nohama neověřili.
  - >-
    Od většiny bud v tomhle průvodci se schronisko liší jednou podstatnou
    věcí: nenabízí nocleh. Správce to říká výslovně a portál Góry
    i Ludzie z toho vyvozuje, že objekt právně ani nesplňuje definici
    horského schroniska. Pro turistu na hřebeni je to prostě občerstvovací
    zastávka — a přesně jako taková patří do průvodce.
  - >-
    Když tenhle profil v červenci 2026 vznikal, prameny se neshodly ani na
    tom, jestli objekt vůbec funguje: správce PTTK ho vedl jako fungující,
    dva turistické portály hlásily rekonstrukci. Ukázalo se, že pravdu
    měli všichni — jen každý ze své doby. Schronisko bylo podle reportáží
    zhruba pět let zavřené kvůli velké rekonstrukci a 27. března 2026 se
    znovu otevřelo; vedoucí při otevření mluvil o „technickém" provozu,
    personál zval denně od devíti do šesti. Otvírací doba je tedy údaj
    z okamžiku otevření, ne zaběhnutý režim — kdo sem míří a počítá
    s občerstvením, měl by si provoz před cestou pro jistotu ověřit.
  - >-
    Historie objektu je krátká na zápis, ale dramatická: podle portálu
    Trasygorskie bylo schronisko postaveno roku 1901 a téměř hned po
    dostavbě je zničila kamenitá lavina. Po druhé světové válce žilo
    z polohy na hlavní trase na Sněžku, návštěvnost mu ale vzala lanovka
    na Kopu; dlouhá léta fungovalo bez elektřiny a tekoucí vody,
    v devadesátých letech ho poznamenaly spory nájemce se správcem
    a hygienické závady a od té doby se průběžně opravuje. To všechno
    stojí na jediném sekundárním prameni — uvádíme to s připsáním.
  - >-
    Výška a charakter objektu pocházejí z oficiální stránky PTTK, historie
    z polských turistických portálů a znovuotevření z reportáží Jelonka.com
    a Magazyn Na Szczycie z konce března 2026. Vlastním dotazem u správce
    jsme zatím neověřili nic — ostrý provozní režim a sezóna proto v datech
    chybí a doplní je až odpověď PTTK.

