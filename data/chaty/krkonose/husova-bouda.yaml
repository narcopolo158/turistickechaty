# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Tradiční krkonošská bouda v 1065 metrech přímo v centru peckého
  lyžařského areálu, která podle vlastního webu slouží turistům víc než
  osmdesát let — německy se jí říkalo Koppenblickbaude, bouda s výhledem
  na Sněžku. Od roku 1994 ji vede dnešní rodina; vaří se tu česká
  kuchyně od snídaně po večeři.
text:
  - >-
    Husova bouda — domácky Husovka — stojí podle vlastního webu v 1065
    metrech přímo v centru lyžařského areálu v Peci pod Sněžkou. Německý
    název Koppenblickbaude, doložený místopisným webem, prozrazuje, čím
    si místo získávalo hosty odjakživa: výhledem na Sněžku.
  - >-
    Na dnešním webu boudy stojí, že dům slouží turistům „více jak
    80 let" — přesný letopočet vzniku ale žádný z pramenů nenese, a tak
    ho nedopočítáváme a necháváme prázdný. Jisté je, že od roku 1994
    boudu provozuje dnešní rodina, kterou server Treking jmenuje jako
    Konkolských; hostům dnes patří celá bouda od pokojů po jídelnu.
  - >-
    Kuchyně vaří tradiční česká jídla: snídaně bufetem, obědy
    i večeře, polévka se podává i k večeři. Jestli se tu nají i turista,
    který jen prochází areálem, web neříká — a my to bez dokladu
    netvrdíme. Celkový počet lůžek prameny nenesou; padesát míst, které
    web zmiňuje, platí pro pořádané akce, ne pro nocleh.
  - >-
    Údaje pocházejí z vlastního webu boudy, ze serveru Treking
    a z místopisného webu; vlastním dotazem u provozovatele jsme zatím
    neověřili nic. Souřadnice jsou z mapových dat OpenStreetMap
    (© přispěvatelé OpenStreetMap, ODbL) a v terénu je nikdo
    nekontroloval.

