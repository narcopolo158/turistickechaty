interniPoznamky: |-
  Povýšeno z data/kandidati/krkonose/husova-bouda.yaml (DATA-01, OSM) 27. 7. 2026 z citací triáže DATA-27 + spot-fetch vlastního webu (hlavní stránka nese historii; podstránka /husova-bouda jen ceník a vybavení).
  KOREKCE TRIÁŽE: „2003 rodinný penzion" (triáž) × „v roce 2003 rozhodli jsme se, že si zde postavíme také domeček" (živý web) — milník 2003 NEZAPSÁN, dokud znění nepotvrdí provozovatel. Další doklad pravidla živých citací.
  Kapacita: „až 50 míst" na webu = akce, ne lůžka — nezapsáno (pozor při přebírání z výtahů, Firmy.cz to vedlo jako kapacitu).
  Alias Koppenblickbaude dle místopisného webu (suchanoha, triáž) — překlad „výhled na Sněžku" je jazykový převod jména, ne tvrzení o dokladu.
  K dotažení: rok vzniku (80 let je tvrzení webu), kapacita lůžek, komu slouží kuchyně (DATA-04 telefonát), hero fotka.
