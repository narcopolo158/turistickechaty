# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata s hospůdkou v údolní enklávě Jelení louky u Pece pod Sněžkou.
  Hospůdka se hlásí k tradici od roku 1731, kdy tu Karl Zee získal výčepní
  oprávnění; do roku 1945 nesla enkláva jméno Zehgrundbauden. Web chaty měl v červenci 2026 prošlý
  certifikát — před cestou doporučujeme zavolat.
text:
  - >-
    Chata Jelení Louky stojí v luční enklávě stejného jména v údolí u Pece
    pod Sněžkou, ve výšce 986 metrů podle dvou shodných pramenů; třetí uvádí 959 metrů a
    rozpor rozřešený nemáme. Z centra Pece je to sem zhruba tři kilometry po
    červené turistické značce směrem na Richtrovy boudy a Výrovku. Adresou patří
    chata k Peci pod Sněžkou.
  - >-
    Enkláva je doložena už v 16. století a v letech 1719 až 1737 se v okolí
    dolovala železná ruda. Klíčový letopočet
    ale zní 1731: Karl Zee tehdy získal výčepní oprávnění a chalupa se stala
    hostincem. Právě k tomuto roku se dnešní hospůdka hlásí. Jméno rodiny
    Zee neslo místo až do roku 1945 — enklávě se říkalo Zehgrundbauden.
    Rok 1897 přinesl povodeň a zemní lavinu, roku
    1900 přistavěl Johann Kohl pokoje pro hosty a v roce 1925 přibyl velký
    sál. Zajímavá je i energetika: od roku 1931 měla bouda elektřinu
    z vlastní vodní elektrárny a ta byla po letech, v roce 1995, obnovena.
    Celou tuhle osu přebíráme z jediného sekundárního zdroje a primárním
    pramenem ji ověřenou nemáme.
  - >-
    Hospůdka je to hlavní, čím se chata prezentuje. Dva prameny shodně píšou, že se tu můžete občerstvit i nasytit po celý
    den, a chata se chlubí vyhlášenými kynutými knedlíky — to druhé je tvrzení
    provozovatele, které nezávisle doložené nemáme. Poctivě dodáváme, že
    výslovnou větu, zda hospůdka obsluhuje i hosty bez noclehu, jsme
    v žádném prameni nenašli; jazyk obou stránek nicméně oslovuje
    návštěvníka obecně, ne jen ubytovaného.
  - >-
    Nocleh chata nabízí, ale s čísly je to slabší: čtyřicet lůžek uvádí jen jediný ubytovací katalog a ostatní prameny
    kapacitu nenesou, takže číslo berte s rezervou. Skladbu pokojů doloženou
    nemáme.
  - >-
    Jedna praktická věc na závěr: web chaty se nám 27. července 2026 kvůli
    prošlému bezpečnostnímu certifikátu nepodařilo načíst; ještě o den dřív
    z něj přitom náš průzkum citoval. Vypadá to tedy spíš na zanedbanou
    údržbu webu než na konec provozu, jistotu ale nemáme.
    Přesto doporučujeme si otvírací dobu hospůdky i volná lůžka před cestou
    ověřit telefonicky; telefonní číslo uvádějí shodně dva nezávislé prameny,
    což je aspoň malá křížová opora.
  - >-
    Údaje na téhle stránce pocházejí z webu chaty (citace z redakčního
    průzkumu 26. července 2026) a ze sekundárních pramenů vypsaných dole ve
    zdrojích; polohu vede OpenStreetMap. Redakce zatím nic z toho neověřila vlastním dotazem ani
    návštěvou. Kde se prameny rozcházejí (výška) nebo kde údaj stojí na
    jediném prameni (kapacita), říkáme to výslovně a nevybíráme mezi
    čísly potichu.

