# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Vrcholová chata KČT na Lovoši (570 m) nad Lovosicemi — víkendová
  výletní bouda s terasou, langošem a výhledem na kužele Českého
  středohoří. Vlastní web ji vede jako jedinou vrcholovou turistickou
  chatu celého pohoří; nocleh už neposkytuje.
text:
  - >-
    Lovoš je vstupní kopec Českého středohoří a chata na jeho vrcholu
    patří lovosickým turistům: zchátralou vrcholovou boudu si členové
    KČT opravili svépomocí v letech 1977–78 a od roku 1979 sem vodí
    novoroční výstup. Z terasy je výhled na okolní kužele, údolí Labe
    a město pod kopcem.
  - >-
    Provoz je víkendový a poctivě bufetový — párky, klobásy, langoše
    a pití bez obsluhy; poslední doložené hodiny (pátek odpoledne až
    neděle) jsou ale přes deset let staré, takže před cestou se
    vyplatí ověřit, jestli se zrovna otvírá. Nocleh chata od roku
    2014 neposkytuje.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu chaty
    a z ubytovacího katalogu, jehož záznam je k prosinci 2013 —
    stáří pramene přiznáváme u každého pole. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Vlastní web chaty (KČT Lovosice) — výška 570 m, oprava 1977–78,
      novoroční tradice od 1979, „jediná vrcholová turistická chata
      v Českém středohoří", terasa (čteno 10. 8. 2026)
    url: https://www.chata-lovos.cz/
  - popis: >-
