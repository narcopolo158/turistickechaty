interniPoznamky: >-
  Povýšeno z data/kandidati/hostynske-vrchy/chata-tesak.yaml rešerší
  (10. 8. 2026) — PRVNÍ PROFIL HOSTÝNSKÝCH VRCHŮ (oblast založena
  publikačně současně). Klíč zařazení: legendární chata na sedle
  s magistrálou, občerstvení pro veřejnost běží (provizorium) —
  stav v-provozu, protože podnik žije; budova sama zanikla, což
  profil přiznává v každém poli.

  JMENOVCI NA SEDLE (zatím mimo naše data): Kamenná chata na Tesáku
  (KČT Bystřice p. H., od 1930, 34 lůžek — KANDIDÁT k založení!),
  Chata pod Tesákem, Rekreační středisko Tesák, chata Meopta. Až
  vzniknou, doplnit registr jmenovců (jádro tesak). POZOR: pampeliska
  vede „Chata Tesák" (5 osob, GPS 49.3627549, 17.7928185) — JINÝ
  objekt (soukromý pronájem ~1,5 km JV), nepoužívat.

  K OVĚŘENÍ (DATA-04): otvírací doba provizoria; kdo chatu 1934
  postavil (KČST?); stav obnovy (sledovat — až se postaví, přepsat).
  Výška sedla nedoložená (640 × 685 × „~721" po webech) — DATA-39.
