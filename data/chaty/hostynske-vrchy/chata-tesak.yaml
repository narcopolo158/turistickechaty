# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1934
    udalost: >-
      Na sedle Tesák vznikla turistická chata — na osm desetiletí
      symbol Hostýnských vrchů a zázemí největšího lyžařského
      areálu oblasti.
    zdroj: >-
      Kudy z nudy (čteno 10. 8. 2026) — stavba 1934; „jeden ze
      symbolů" Hostýnských vrchů: ČT24. Kdo chatu postavil (KČST?),
      načtené prameny nevedou — nedomýšlí se.
  - rok: 2022
    udalost: >-
      V noci na sobotu 29. ledna chata do základů vyhořela — příčinou
      byla technická závada na elektroinstalaci nebo spotřebiči,
      škoda kolem 12 milionů korun. Veřejná sbírka vynesla za první
      rok bezmála dva miliony.
    zdroj: >-
      Kroměřížský deník (čteno 10. 8. 2026) — požár 29. 1. 2022 kolem
      1:30, dvě verze technické závady (mluvčí hasičů Roman
      Žemlička), škoda 12 mil.; sbírka „bezmála dva miliony korun":
      ČT24 (únor 2023).
  - rok: 2025
    udalost: >-
      Obnova má projekt i stavební povolení, stavbě ale chybí peníze
      — majitel uvádí, že schází nejméně 10 milionů korun; provoz
      zatím běží v dřevěném provizoriu.
    zdroj: >-
      Kroměřížský deník, článek ke třem letům od požáru (2025, čteno
      10. 8. 2026) — „projekt i stavební povolení na novou turistickou
      chatu k dispozici", „Stále nám chybí nejméně 10 milionů korun".

zajimavosti:
  - text: >-
      Po požáru se kolem Tesáku semkl celý kraj: do dvou dnů se ve
      sbírce sešlo přes 300 tisíc, za rok bezmála dva miliony korun,
      a lidé nosili i vybavení. Majitel to shrnul slovy: „Podpora
      a účast lidí je něco neskutečného."
    kategorie: jine
    zdroj: >-
      přes 300 tisíc za dva dny: Blesk.cz; bezmála dva miliony za
      rok: ČT24; citát majitele: Kroměřížský deník (vše čteno
      10. 8. 2026)

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Legendární chata na sedle Tesák, srdci Hostýnských vrchů, stála od
  roku 1934 — v lednu 2022 do základů vyhořela. Občerstvení dnes běží
  v provizoriu, na novou chatu je projekt i povolení a sbírka trvá;
  Tesák zůstává křižovatkou Hostýnské magistrály.
text:
  - >-
    Tesák je pro Hostýnské vrchy tím, čím bývá pro hory hlavní sedlo:
    křižovatka hřebenové magistrály, lyžařský areál a chata, ke které
    se sjížděl celý kraj. Dřevěná chata z roku 1934 tu sloužila
    téměř devadesát let — v noci 29. ledna 2022 ale do základů
    vyhořela; na vině byla technická závada.
  - >-
    Konec to ale není. Provoz jede dál v dřevěném provizoriu — kančí
    speciality, guláš i řízek — a na obnovu chaty se složil celý
    kraj: sbírka vynesla za první rok bezmála dva miliony korun.
    Projekt i stavební povolení jsou hotové, stavba čeká na zbytek
    peněz. Nocleh chata zatím nenabízí; přespat se dá v sousední
    kamenné chatě KČT.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu chaty,
    z regionálního tisku a z Kudy z nudy. Otvírací doba provizoria
    doložená není — před cestou zavolat. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
zdroje:
