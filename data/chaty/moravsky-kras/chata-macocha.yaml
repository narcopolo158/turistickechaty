# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Turistická chata z roku 1895 přímo u horního můstku propasti
  Macocha — šedesát lůžek, restaurace s kachlovými kamny a terasou.
  Po rekonstrukci v roce 1996 vypadá jako švýcarská horská chata,
  tradici má ale od časů, kdy turistika v Moravském krasu začínala.
text:
  - >-
    Ať se v Moravském krasu vydáte kamkoli, značky se nakonec
    stočí k Macoše — a chata u jejího horního můstku stojí od roku
    1895 — dnes po kompletní
    rekonstrukci z roku 1996, která jí dala vzhled švýcarské horské
    chaty. Návštěvník propasti tu má restauraci s kachlovými kamny
    a venkovní terasu na dosah vyhlídek.
  - >-
    Spí se v šedesáti lůžkách v pokojích od dvoulůžkových po
    jedenáctilůžkový a ve třech apartmánech — a nocleh u propasti má
    své kouzlo: ranní můstky patří hostům chaty dřív, než dorazí
    denní proud. Provozuje ji blanenská společnost S.M.K.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu chaty, z Kudy
    z nudy a z ubytovacího katalogu. Otvírací doba restaurace
    doložená není — před cestou mimo sezónu je jistější zavolat.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
