# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata v osadě Myslivny pod vrcholem Luže — devětačtyřicet
  lůžek, restaurace s letní terasou a křižovatka značek pod nejvyšší
  horou Lužických hor. Základna pro českou stranu pohoří, v zimě
  s vlekem pod svahem.
text:
  - >-
    Luž je nejvyšší hora Lužických hor a chata pod ní je přirozený
    opěrný bod její české strany: stojí v osadě Myslivny u Horní
    Světlé, na křižovatce turistických značek, pár minut pod
    vrcholem s trojmezním výhledem a kousek od zimního vleku.
  - >-
    Spí se v pokojích od dvoulůžkových po větší společné — katalogy
    se ve skladbě liší, celkem ale vedou devětačtyřicet lůžek —
    a k chatě patří restaurace s velkou jídelnou a letní terasou;
    vařit umí od snídaní po plnou penzi. Jak přesně slouží kuchyň
    kolemjdoucím mimo ubytované, naše podklady nevedou — na jistotu
    je lepší zavolat.
  - >-
    Údaje na téhle stránce pocházejí z ubytovacích katalogů; polohu
    a kontakty nese OpenStreetMap. Výška se v pramenech rozchází
    (648 × 673 m) a zapsané je nižší číslo. Vlastní stránky chaty se
    při rešerši nenačetly. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
zdroje:
  - popis: >-
      levneubytovani.net — 49 lůžek, restaurace s jídelnou a terasou,
      výška 648 m, adresa Myslivny / Horní Světlá 75, kontakty,
      provozovatel (čteno 10. 8. 2026)
    url: https://www.levneubytovani.net/ubytovani/chata-luz/
  - popis: >-
      penziony.cz — poloha pod vrcholem Luže, skladba pokojů, GPS,
      stravování vč. penzí (čteno 10. 8. 2026)
    url: https://www.penziony.cz/marenice/horska-chata-luz/
  - popis: >-
      Externí katalog turistických chat ČR/SK 2026 — řádek HUT-0044
      (673 m, Mařenice, celoročně)
    url: https://nocleh.kct.cz/chaty
  - popis: OpenStreetMap (GPS, kontakty, otvírací doba v tagu; ODbL)
    url: https://www.openstreetmap.org/node/333131472
interniPoznamky: >-
  Povýšeno z data/kandidati/luzicke-hory/chata-luz.yaml rešerší
  (10. 8. 2026). Klíč zařazení: horská chata s restaurací pod
  nejvyšším vrcholem oblasti, na křižovatce značek — role na trase;
  katalogový objekt HUT-0044 (jistota B). První ČESKÝ profil
  Lužických hor.

  ROZPORY: výška 648 (levneubytovani) × 673 (katalog) — zapsáno
  nižší; skladba pokojů 2–5lůžkové/49 × 2–6+10lůžkový (penziony);
  telefony tři ze tří pramenů (zapsán ten potvrzený dvěma).

  K OVĚŘENÍ (DATA-04): vlastní web (nenačetl se); režim restaurace
  pro neubytované (OSM otvíračka 10:30–22 naznačuje veřejný provoz);
  historie chaty (žádný pramen). Fotku dodá příští běh DATA-02.
