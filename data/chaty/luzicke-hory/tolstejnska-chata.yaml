# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Turistická chata přímo v areálu zříceniny hradu Tolštejn nad
  Jiřetínem pod Jedlovou — sedm pokojů pro šestnáct hostů, restaurace
  s padesáti místy a výhledem do údolí. V dnešní podobě slouží od
  roku 1995.
text:
  - >-
    Tolštejn je hradní zřícenina, kolem níž se točí celé Tolštejnské
    panství — a chata v jejím areálu dělá z návštěvy hradu celodenní
    výlet: restaurace
    s padesáti místy servíruje s výhledem do údolí, v létě jede
    terasa a kdo chce, přespí v jednom ze sedmi pokojů se společným
    zázemím.
  - >-
    Dnešní podoba chaty je výsledkem rekonstrukce a provozu od roku
    1995; starší historii objektu naše podklady nevedou, u stavení na
    hradě ze třináctého století ale skoro jistě existuje. Katalog
    vede provoz jako sezónní, ubytovací katalog jako celoroční —
    před zimní návštěvou je jistější zavolat.
  - >-
    Údaje na téhle stránce pocházejí z ubytovacího katalogu
    a z externího katalogu chat; objekt zatím chybí v OpenStreetMap,
    souřadnice nese ubytovací katalog. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
zdroje:
