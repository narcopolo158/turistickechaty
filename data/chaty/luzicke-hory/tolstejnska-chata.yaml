  přepnout zdroj. Zavírá katalogovou mezeru HUT-0045 — katalog
  Lužických hor tím má záznam u 5/5 a profily u 4/5.

  ROZPORY: výška 645 × 670 (katalog) — zapsáno nižší; provoz
  celoročně (levneubytovani) × sezónně (katalog) — nerozhodnuto,
  přiznáno v próze. POZOR: kandidát luzicke-hory/chata-pod-hradem
  je JINÝ objekt (Sloup v Čechách, měřeno 13,5 km) — nepárovat.

  K OVĚŘENÍ (DATA-04): starší historie chaty (hostinec na hradě
