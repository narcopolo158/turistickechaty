# ── Historie ──────────────────────────────────────────────────────────────
# Rok vzniku samotné saské baudy žádný načtený pramen nevede přesně
# („später" po české boudě z 1853) — nedomýšlí se; boudová historie
# hory je v zajímavosti.
zajimavosti:
  - text: >-
      Hochwald — česky Hvozd — je boudová hora s příběhem na obou
      stranách hranice: na jižním vrcholu stála od roku 1853 „česká"
      bouda (po požáru obnovená 1878, s dřevěnou rozhlednou z 1879),
      na severním od 1892 kamenná pětadvacetimetrová věž s vlastní
      Turmbaude. Česká bouda musela být kolem roku 1951 zbourána —
      saská Hochwaldbaude a Turmbaude slouží dodnes.
    kategorie: stari
    zdroj: >-
      tourmedia-service.de, profil Hochwaldu (čteno 10. 8. 2026) —
      1853 „Böhmische" Baude, obnova 1878, věž 1879, kamenná věž
      a Turmbaude 1892, zbourání české boudy kolem 1951
  - text: >-
      Obec Oybin baudu uvádí jako nejvýše položenou budovu Žitavských
      hor s kruhovým výhledem na německou i českou stranu — je to
      tvrzení obce, vlastním měřením nepodložené.
    kategorie: vyska
    zdroj: >-
      web obce Oybin, stránka Bergbauden (čteno 10. 8. 2026) —
      „nejvýše položená budova v Zittauer Gebirge"

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Saská bauda na jižním vrcholu Hvozdu, přímo na česko-německé
  hranici nad Oybinem — restaurace otevřená denně, nocleh v podkroví
  a kruhový výhled, který obec vede jako nejvyšší v Žitavských
  horách. Boudová tradice tu sahá do roku 1853.
text:
  - >-
    Hvozd je hraniční hora se dvěma vrcholy a dlouhou boudovou
    historií: česká bouda tu stála od roku 1853 a zanikla po roce
    1951, saská Hochwaldbaude na jižním vrcholu žije dodnes —
    a o kousek dál na severním vrcholu stojí od roku 1892 kamenná
    věž s vlastní Turmbaude. Kdo přijde po hřebeni z české strany,
    překročí hranici pár kroků před výčepem.
  - >-
    Provoz je boudový, jak má být: restaurace denně od desíti do
    večera, pokoje pro ty, kdo chtějí ráno vidět z hory východ
    slunce. Kolik lůžek přesně bauda má, naše podklady nevedou —
    před cestou je lepší zavolat.
  - >-
    Údaje na téhle stránce pocházejí z webu obce Oybin, z profilu
    hory na tourmedia-service.de a z externího katalogu; polohu
    a kontakty nese OpenStreetMap. Katalogová výška se rozchází
    s výškou hory, proto ji neuvádíme. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
zdroje:
  - popis: >-
      Web obce Oybin, stránka Bergbauden — restaurace a ubytování,
      tvrzení o nejvýše položené budově Žitavských hor (čteno
      10. 8. 2026)
    url: https://oybin.com/erleben-entdecken/bergbauden/
  - popis: >-
      tourmedia-service.de — historie baud na Hochwaldu (1853, 1878,
      1879, 1892, zbourání české boudy ~1951), výška hory 749,5 m
    url: https://tourmedia-service.de/aussichtsberge/hochwald-oybin
  - popis: >-
      Externí katalog turistických chat ČR/SK 2026 — řádek HUT-0300
      (Kurort Oybin, celoročně, jistota A; katalogová výška 752 m
      v rozporu s výškou hory — nezapsána)
    url: https://nocleh.kct.cz/chaty
  - popis: OpenStreetMap (GPS, kontakty, otvírací doba v tagu; ODbL)
    url: https://www.openstreetmap.org/way/24857129
interniPoznamky: >-
  Povýšeno z data/kandidati/luzicke-hory/hochwaldbaude.yaml rešerší
  (10. 8. 2026). PRVNÍ PROFIL LUŽICKÝCH HOR. Klíč zařazení: hraniční
  bauda s restaurací a noclehem na vrcholové trase, katalogový objekt
  HUT-0300 (jistota A), boudová kontinuita hory od 1853.

  VÝŠKA NEZAPSÁNA (vzorec DATA-39): katalog 752 m × hora 749,5 m —
  katalogové číslo nemůže sedět, nezávislý údaj pro budovu chybí.

  SOUVISEJÍCÍ: hochwald-turmbaude (kandidát, koš POSOUDIT) je DRUHÁ
  bauda téže hory u věže z 1892 — dva objekty, nepárovat; luzicke-hory
  /hochwaldturm je věž sama (vzor Žalý: věž × bauda zvlášť). Česká
  zaniklá bouda (1853–~1951) je kandidát na Atlas zaniklých chat.

  K OVĚŘENÍ (DATA-04): vlastní web (kapacita, sezóna); jméno
