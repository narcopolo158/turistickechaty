  KATALOGOVÁ POLOŽKA HUT-0046 „Chata Jedlová" (ub ano, str ano):
  na vrcholu NENÍ obsluhovaná chata s noclehem — jsou tam tři věci:
  rozhledna (tento profil), restaurace u ní (celoroční) a celodřevěné
  apartmány „Chata Jedlová" BEZ obsluhy (pronájem, e-penziony.cz).
  Katalogový řádek nejspíš slévá restauraci a apartmány do jedné
  položky; slabá shoda v reportu pokrytí zůstává VIDITELNÁ schválně —
  rozhodnout přiřazení (nebo zápis mimo klíč pro apartmány) musí
  Michal. Apartmány se jako kandidát nezakládají (pronájem bez
  služby).

  K OVĚŘENÍ (DATA-04): zimní režim restaurace (celoročně dle
  e-penziony × „sezónně" v katalogu); kontakt na restauraci.
