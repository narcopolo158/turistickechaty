  - rok: 1943
    udalost: >-
      Z Jedlové odešli poslední obyvatelé a rozhledna i hostinec
      začaly chátrat; v padesátých letech byly oba objekty uzavřeny.
    zdroj: >-
      tipnavylety.cz (čteno 10. 8. 2026) — „Od roku 1943 … rozhledna
      stejně jako hostinec chátraly", uzavření v 50. letech.
