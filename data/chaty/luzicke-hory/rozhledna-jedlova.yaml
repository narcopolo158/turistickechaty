# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná věž z roku 1891 na třetí nejvyšší hoře Lužických hor —
  123 schodů na plošinu ve třiadvaceti metrech, dole restaurace
  otevřená denně od devíti do osmi. Po půlstoletí chátrání vrátila
  vrchol turistům obnova z první poloviny devadesátých let.
text:
  - >-
    Rozhledna na Jedlové patří ke kamenné generaci věží z konce
    devatenáctého století: stavěla se v letech 1890–91 za 5 200
    zlatých a slavnostně se předávala 14. září 1891. Válka a odsun
    vzaly vrcholu život — od roku 1943 věž i hostinec chátraly
    a v padesátých letech se zavřely úplně.
  - >-
    Vzkříšení přišlo v devadesátých letech: obnovená věž se otevřela
    3. července 1993 a restaurace o dva roky později. Dnes je vrchol
    malý areál — věž se 123 schody, restaurace otevřená denně od
    devíti do osmi večer, lanové centrum a sjezd na koloběžkách;
    vedle stojí i pronajímané apartmány.
  - >-
    Údaje na téhle stránce pocházejí z turistických webů
    a z externího katalogu; polohu nese OpenStreetMap. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      tipnavylety.cz — stavba 1890–91, předání 14. 9. 1891, 29 m /
      plošina 23 m / 123 schodů, chátrání od 1943, obnova 1993,
      restaurace 1995, otevřeno denně 9–20, třetí nejvyšší hora
