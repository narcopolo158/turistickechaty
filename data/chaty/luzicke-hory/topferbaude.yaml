# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1860
    udalost: >-
      Ernst Adolf Nentwig z Oybina postavil na Töpferu první baudu;
      slavnostně se otevírala 15. července s koncertem hainewaldské
      střelecké kapely. Rozšiřovala se 1876 a roku 1881 dostala
      sálovou budovu.
    zdroj: >-
      vlastní web, stránka historie (čteno 10. 8. 2026) — stavba
      a otevření 15. 7. 1860, Nentwig, rozšíření 1876, sál 1881;
      hostinský Emil Bär od 1875.
  - rok: 1904
    udalost: >-
      Bauda po žhářském útoku vyhořela do základů — „Durch
      Brandstiftung brennt die Baude vollständig nieder". Město
      Žitava ji následujícího roku postavilo znovu a vlastní ji
      dodnes.
    zdroj: >-
      vlastní web, stránka historie (čteno 10. 8. 2026) — požár 1904,
      obnova městem Zittau 1905, veranda 1925.
  - rok: 1997
    udalost: >-
      Po rozsáhlé renovaci se bauda 18. května znovu otevřela;
      od roku 2003 ji provozuje rodina Golebiowských.
    zdroj: >-
      vlastní web, stránka historie (čteno 10. 8. 2026) — znovuotevření
      18. 5. 1997, Golebiowští od 2003; 1973–1996 státní obchodní
      organizace.

zajimavosti:
  - text: >-
      Z Töpferu je výhled na trojzemí — Německo, Česko a Polsko
      naráz; obec Oybin ho u baudy vede jako „spektakulární výhled
      na Dreiländereck".
    kategorie: jine
    zdroj: web obce Oybin, stránka Bergbauden (čteno 10. 8. 2026)

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bauda na Töpferu nad Oybinem slouží výletníkům od roku 1860 —
  vyhořela, město Žitava ji roku 1905 postavilo znovu a vlastní ji
  dodnes. Restaurace s výhledem na trojzemí, dva pokoje pro dva
  a turistická noclehárna pro deset.
text:
  - >-
    Töpferbaude patří k rané generaci baud Žitavských hor:
    postavil ji oybinský Ernst Adolf Nentwig a otevřel 15. července
    1860 za doprovodu střelecké kapely. Po žhářském požáru v roce
    1904 ji hned následujícího roku obnovilo město Žitava — a jako
    vlastník u ní zůstalo přes sto let, přes éru státních provozů
    až k dnešní rodině nájemců.
  - >-
    Skalní vrchol Töpferu nabízí výhled na trojzemí Německa, Česka
    a Polska a bauda k němu přidává kuchyni a skromný nocleh: dva
    pokoje pro dvojice — jeden se střešní terasou — a turistickou
    noclehárnu pro deset lidí s vybavenou kuchyňkou. Kdo nechce
    stoupat s bagáží, tomu bauda nabízí odvoz z Oybina.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu baudy včetně
    stránky historie a z webu obce Oybin; polohu nese OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Vlastní web baudy — historie (1860, požár 1904, obnova 1905,
      renovace 1997, Golebiowští od 2003), ubytování 2+2+10, odvoz,
      kontakty (načteno 10. 8. 2026)
    url: https://www.toepferbaude.de/
