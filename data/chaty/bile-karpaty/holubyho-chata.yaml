# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1924
    udalost: >-
      Základní kámen útulny na Javorině byl položen 8. července 1923
      a chata — pojmenovaná po botaniku a evangelickém faráři Jozefu
      Ľudovítu Holubym († 1923) — se slavnostně otevřela 6. června
      1924. Stavěl ji Josef Jirásek z Uherského Brodu.
    zdroj: >-
      základní kámen 8. 7. 1923: vlastní web holubyhochata.sk;
      otevření 6. 6. 1924, stavitel Josef Jirásek, jméno „z úcty
      k životu a dielu" J. Ľ. Holubyho (1836–1923): myjava.sk
      (čteno 10. 8. 2026).
  - rok: 1926
    udalost: >-
      Chata 6. prosince 1926 „zhorela do tla".
    zdroj: >-
      myjava.sk (čteno 10. 8. 2026) — požár 6. 12. 1926. Příčinu
      načtené prameny nevedou — nedomýšlí se.
  - rok: 1930
    udalost: >-
      Nová chata podle projektu architekta Františka Svobody
      (stavitel Jozef Hanuš z Uherského Brodu) se otevřela
      22. června 1930 — základní kámen byl položen už v červenci
      1928. Za okupace chatu využívali čeští vlastenci i slovenští
      partyzáni; po socialistických provozovatelích se po roce 1989
      vrátila do soukromých rukou.
    zdroj: >-
      myjava.sk (čteno 10. 8. 2026) — základní kámen VII/1928,
      architekt František Svoboda, stavitel Jozef Hanuš, otevření
      22. 6. 1930; váleční uživatelé a poválečné osudy tamtéž.
  - rok: 2006
    udalost: >-
      Chatu převzal Miro Martinček a vrací jí historický ráz —
      před chatou stojí nová busta J. Ľ. Holubyho od sochaře
      Stana Mikuše.
    zdroj: >-
      myjava.sk (čteno 10. 8. 2026) — „od roku 2006", busta od
      Stana Mikuše.

zajimavosti:
  - text: >-
      Louka pod Veľkou Javorinou je místem slavností bratrství Čechů
      a Slováků — potkávají se tu obvykle poslední červencovo-srpnovou
      neděli, a hraniční hora s chatou tak zůstává symbolem
      česko-slovenské vzájemnosti i po rozdělení federace.
    kategorie: jine
    zdroj: >-
      planetslovakia.sk (čteno 10. 8. 2026) — „Slávnosti bratstva
      Čechov a Slovákov", „obvykle poslednú júlovo-augustovú nedeľu"

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata z roku 1930 pod vrcholem Veľké Javoriny, nejvyšší hory
  Bílých Karpat — stojí na slovenské straně hranice, ale chodí se
  k ní stejně samozřejmě ze Slovácka jako z Považí. Domácí kuchyně
  sedm dní v týdnu, jednoduché pokoje a louka slavností bratrství
  Čechů a Slováků.
text:
  - >-
    Holubyho chata nese jméno evangelického faráře a botanika, který
    javorinské louky celý život zkoumal — Jozef Ľudovít Holuby zemřel
    v roce 1923, právě když se na hřebeni pokládal základní kámen
    útulny. První chata z roku 1924 po dvou letech vyhořela; dnešní
    budova podle projektu Františka Svobody slouží od června 1930
    a od roku 2006 jí hostinský Miro Martinček vrací prvorepublikový
    ráz.
  - >-
    Vaří se tu domácí chatárska kuchyně, celoročně a sedm dní
    v týdnu; spí se v necelých třiceti lůžkách jednoduchých pokojů.
    Chata stojí na slovenské straně hraniční hory — kousek pod
    vrcholem s vysílačem — a na louce pod ní se každé léto potkávají
    Češi a Slováci na slavnostech bratrství.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu chaty,
    z oficiálních stránek města Myjavy a z portálu PlanetSlovakia.
    Telefon se z načtených stránek nepodařilo doložit celý — pište
    e-mailem. Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
