interniPoznamky: >-
  DRUHÝ PROFIL ZALOŽENÝ PŘÍMO Z KATALOGOVÉ MEZERY (po Residence Ropička,
  týž den). Katalog vede „Schronisko na Równicy", mapování na dnešní jméno
  drží KATALOG_PREJMENOVANI.

  BEZ GPS — a je to přiznané v datech i v próze. Žádný pramen souřadnice
  neuvádí, OSM podklad chybí (DATA-01 objekt nepřinesl, nejspíš proto, že
  v OSM nese jiné jméno nebo tag). Mechanismus profilů bez GPS existuje od
  krkonošských profilů z katalogu známek; ruční dohledávka DATA-31 GPS
  doplní.

  STATUSOVÁ ZMĚNA 2016 JE TU DŮLEŽITĚJŠÍ NEŽ JMÉNO: „gościniec" není jen
  přejmenování, ale vyškrtnutí ze seznamu schronisk PTTK — týž vzor jako
  Chatka Puchatka v Bieszczadech (od 2017 „schron turystyczny"). Pro
  průvodce to znamená: katalogová označení „schronisko PTTK" stárnou
  a stojí za systematickou revizi (viz backlog).

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: čas z Ustroně (1:40 korona ×
  2 h schroniska-pttk.com.pl); e-mail (rownicagosciniec@gmail.com na
  vlastním webu × gosciniecrownica@gmail.com na podstránce a u PTTK ×
  gosciniec.rownica@gmail.com na slaskie.travel — zapsán ten z titulní
  strany vlastního webu); telefon v jedné extrakci „534 232 540" (nejspíš
  přepis).

  NEDOLOŽENO, a nenalezení není vyvrácení: GPS; konec otevírací doby;
  jméno nájemce; výslovná věta o obsluze neubytovaných; kapacita
  restaurace z vlastního webu (90 nese slaskie.travel). Polská Wikipedie
  byla nedostupná (cache-only proxy).
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
