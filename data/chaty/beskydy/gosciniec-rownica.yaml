# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bývalé schronisko PTTK na polaně pod Równicou nad Ustroniem, s kořeny
  v roce 1923 a restaurací pro devadesát lidí. Od roku 2016 už není na
  seznamu schronisk a jmenuje se gościniec; leží na Głównym Szlaku
  Beskidzkim a roku 2024 dokončilo dvouletou modernizaci.
text:
  - >-
    Gościniec Równica stojí v 758 metrech na polaně pod vrcholem Równica
    (884,6 m — prameny zaokrouhlují i na 885) nad Ustroniem ve Slezských
    Beskydech. Katalog ho vede postaru jako Schronisko na Równicy — a je to
    dobrá ukázka toho, jak se objekty přejmenovávají rychleji, než katalogy
    stíhají.
  - >-
    První malou dřevěnou stavbu na kamenné podezdívce tu z podnětu místních
    turistických kruhů otevřeli v červenci 1923. Roku 1926 ji koupil
    hornoslezský odbor Polského Towarzystwa Tatrzańského, přestavěl ji
    a roku 1928 oficiálně otevřel jako schronisko; kapacita časem vzrostla
    až na sto dvacet míst. Prvního září 1939 ke schronisku dorazila
    jednotka polských ženistů a roku 1942 si Němci na střeše zřídili
    pozorovatelnu Luftwaffe. Po generální opravě v letech 1966 až 1968
    dostalo schronisko roku 1989 jméno turistického činovníka Edmunda
    Kaźmierczaka.
  - >-
    Zlom přišel v březnu 2016: objekt byl vyškrtnut ze seznamu schronisk
    PTTK a změnil status na gościniec — hospodu s noclehem — i když
    majetkově zůstal ve struktuře PTTK, ve společnosti Schroniska i Hotele
    PTTK „Karpaty". V letech 2022 až 2024 prošel modernizací.
  - >-
    Dnes tu je 37 lůžek ve dvou- a vícelůžkových pokojích plus čtyřlůžkový
    domek a restaurace pro devadesát lidí s vlastní kuchyní na tradičních
    recepturách. Otevřeno je denně od devíti; kdy se zavírá, prameny
    neuvádějí. Že restaurace slouží i kolemjdoucím, nikdo nenapsal doslova
    — ale devadesát míst u stolu při sedmatřiceti lůžkách na Głównym Szlaku
    Beskidzkim mluví samo.
  - >-
    Chodí se sem po červené z centra Ustroně (prameny uvádějí 1:40 i 2
    hodiny — obě čísla tu stojí), po zelené z Brenné za dvě hodiny pět
    minut, po žluté ze Skoczowa za čtyři hodiny dvacet a po modré od Trzech
    Kopců Wiślańských za tři hodiny. Červená je úsekem Głównego Szlaku
    Beskidzkiego. Na Równicu vede i silnice, takže okolí doplňují lezecká
    stěna, lanový park a Leśny Park Niespodzianek.
  - >-
    Údaje nesou vlastní web objektu, schroniska-pttk.com.pl,
    korona-gor-polski.pl, slaskie.travel a beskidinfo.pl. GPS zatím chybí —
    žádný pramen souřadnice neuvádí a objekt nemá podklad v OpenStreetMap;
    doplní je ruční dohledávka. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
