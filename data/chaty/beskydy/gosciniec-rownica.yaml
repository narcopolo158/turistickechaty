# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1923
overeniHistorie:
  source: >-
    Vlastní web, stránka historie (čteno 9. 8. 2026): „Pierwsza budowla
    powstała w 1923, była to niewielka konstrukcja drewniana";
    korona-gor-polski.pl upřesňuje otevření „w lipcu 1923 roku" a stavbu
    popisuje jako malou dřevěnou konstrukci na kamenné podezdívce;
    beskidinfo.pl — vznik „z inicjatywy lokalnych środowisk turystycznych".
    Roku 1926 objekt koupilo Polskie Towarzystwo Tatrzańskie (vlastní web:
    „W 1926 obiekt został odkupiony przez Polskie Towarzystwo
    Tatrzańskie"; korona-gor-polski.pl jmenuje Oddział Górnośląski PTT)
    a po přestavbě ho oficiálně otevřelo roku 1928. Prvním nájemcem byl
    Leon Zatloukal, 1937 Karol Kroker, 1939 Rudolf Hulanik (vlastní web).
    ROK VZNIKU 1923 je rok první stavby a prvního provozu pro turisty —
    otevření 1928 je otevření přestavěného schroniska PTT a stojí
    v milnících.
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1923
    udalost: >-
      Z podnětu místních turistických kruhů vyrostla na polaně pod Równicou
      malá dřevěná stavba na kamenné podezdívce; turistům začala sloužit
      v červenci.
    zdroj: >-
      vlastní web (čteno 9. 8. 2026) — „Pierwsza budowla powstała w 1923";
      korona-gor-polski.pl — otevření „w lipcu 1923 roku"; beskidinfo.pl
      k iniciativě místních.
  - rok: 1926
    udalost: >-
      Objekt odkoupilo Polskie Towarzystwo Tatrzańskie — hornoslezský odbor
      — a po přestavbě ho roku 1928 oficiálně otevřelo jako schronisko;
      kapacita později vzrostla až na 120 míst.
    zdroj: >-
      vlastní web (čteno 9. 8. 2026); korona-gor-polski.pl — „W 1926 roku
      schronisko nabył Oddział Górnośląski Polskiego Towarzystwa
      Tatrzańskiego" a „zwiększono liczbę miejsc noclegowych do 120".
  - rok: 1939
    udalost: >-
      V den vypuknutí druhé světové války, 1. září, dorazila ke schronisku
      jednotka polských ženistů; roku 1942 Němci na střeše zřídili
      pozorovatelnu Luftwaffe.
    zdroj: >-
      vlastní web, stránka historie (čteno 9. 8. 2026) — „W dniu wybuchu II
      wojny światowej, 1 września 1939, do schroniska dotarła jednostka
      polskich saperów"; „W 1942 na dachu schroniska zainstalowano
      posterunek obserwacyjny Luftwaffe".
  - rok: 1968
    udalost: >-
      Skončila generální oprava probíhající od roku 1966.
    zdroj: >-
      vlastní web (čteno 9. 8. 2026) — „W latach 1966–1968 obiekt poddano
      gruntownemu remontowi".
  - rok: 1989
    udalost: >-
      Schronisko dostalo jméno Edmunda Kaźmierczaka.
    zdroj: >-
      vlastní web (čteno 9. 8. 2026) — „W 1989 schronisku nadano imię
      Edmunda Kaźmierczaka".
  - rok: 2016
    udalost: >-
      Objekt byl vyškrtnut ze seznamu schronisk PTTK a změnil status na
      gościniec; majetkově zůstal ve struktuře PTTK.
    zdroj: >-
      vlastní web (čteno 9. 8. 2026) — „W 2016 obiekt został skreślony
      z listy schronisk PTTK i zmienił swój status na gościniec";
      beskidinfo.pl datuje rozhodnutí na březen 2016;
      schroniska-pttk.com.pl vede objekt v portfoliu Schroniska i Hotele
      PTTK „Karpaty" Sp. z o.o.
  - rok: 2024
    udalost: >-
      Skončila dvouletá modernizace.
    zdroj: >-
      vlastní web (čteno 9. 8. 2026) — „W 2024 roku zakończyła się 2 letnia
      modernizacja."

