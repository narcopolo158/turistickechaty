# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěná turistická chata z roku 1895 pod vrcholem Javorového nad Třincem,
  kterou podle stránky KČT Třinec postavil německý spolek Beskidenverein jako
  Útulnu arcivévody Bedřicha. Patří městu Třinec a jezdí k ní jednosedačková
  lanovka z roku 1957.
text:
  - >-
    Chata na Javorovém je z celého beskydského korpusu ta nejstarší: rok
    1895 uvádí pět nezávislých pramenů a Deník k tomu dodává, že stavba
    stojí „ve své nezměněné podobě, až na drobné rekonstrukce". Otevřela se
    pod německým jménem Erzherzog Friedrich-Schutzhaus, tedy jako Útulna
    arcivévody Bedřicha — v tom jméně je vidět, komu tehdy patřila iniciativa.
  - >-
    Kdo ji postavil, je doložené slaběji než kdy. Stránka historie KČT Třinec
    ji vede mezi chatami německého spolku Beskidenverein a anglická Wikipedie
    v seznamu téhož spolku uvádí „Jaworowy – April 1895"; české zpravodajské
    prameny stavebníka nejmenují vůbec a v měsíci otevření se rozcházejí
    (duben proti květnu). Uvádíme to tedy jako to, co tvrdí ty dva prameny,
    ne jako hotovou věc.
  - >-
    Chata nestojí na vrcholu. Javorový vrch má podle pramenů 1031 metrů,
    chata leží asi sedmdesát metrů pod ním a její výšku uvádějí prameny
    třemi čísly — 960, 964 a 968 metrů. Zapisujeme nejnižší z nich a rozpor
    přiznáváme. Pozor na jednu snadnou záměnu: Malý Javorový (947 m) je jiný
    vrchol, na kterém stojí televizní retranslační stanice.
  - >-
    Zvláštností Javorového je lanovka. Vede z Oldřichovic od roku 1957,
    měří 1310 metrů, překonává 424 metrů převýšení a je to pořád ta původní
    jednosedačka s pevným uchycením sedaček. Provozuje ji jiná firma než
    chatu, takže otvírací hodiny lanovky a chaty jsou dvě různé věci —
    a v pramenech se navíc samy rozcházejí, proto tu čas lanovky neuvádíme.
  - >-
    Na vrcholu se sešlo víc provozů a je dobré je nepomíchat: chatu vlastní
    město Třinec a provozuje ji nájemce, lanovku provozuje společnost
    Bytoslan, na Malém Javorovém stojí televizní stanice a u chaty je
    stanice Horské služby. Druhý samostatný pohostinský provoz na vrcholu
    se nám doložit nepodařilo. Po svazích je lyžařské středisko a z vrcholu
    se startuje na paraglidu.
  - >-
    Turistické trasy vedou na Javorový ze tří stran — zelená z Oldřichovic,
    žlutá z Tyry a modrá z Guty — a od chaty pokračují na jih na Šindelnou
    a Ropici. Hlavní beskydská hřebenovka Javorovým neprochází; leží na
    bočním hřebeni, který se k ní napojuje.
  - >-
    Údaje na téhle stránce nesou Český rozhlas Ostrava, Deník, Blesk,
    polar.cz, ceskehory.cz, beskydy.cz, Kudy z nudy, lanovkajavorovy.cz,
    Firmy.cz a stránka historie KČT Třinec; polohu nese OpenStreetMap.
    Vlastní web chaty se nám ze sandboxu nepodařilo otevřít. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
