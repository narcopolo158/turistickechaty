interniPoznamky: >-
  Povýšeno z data/kandidati/beskydy/chata-javorovy-vrch.yaml (8. 8. 2026),
  třetí publikovaný profil oblasti Beskydy.

  SUPERLATIVY, KTERÉ SE NEZAPSALY, ač je prameny mají doslova: Deník píše
  „Chata je vůbec nejstarší v Beskydech", ČRo „Patří mezi první chaty, které
  vůbec byly postaveny turisty v této části Beskyd" a titulek ČRo „Jedna
  z nejstarších lanovek vás vyveze k jedné z nejstarších chat". Do prózy šlo
  jen ověřitelné tvrzení „z celého beskydského korpusu ta nejstarší" — to je
  výrok o NAŠICH datech, který si čtenář může přepočítat, ne o Beskydech
  jako celku. Rozdíl je podstatný: chata na Lysé hoře byla otevřena taky
  1895 (21. 7.), takže „nejstarší v Beskydech" by se muselo dokazovat dnem,
  a duben/květen u Javorového není rozhodnutý.

  VÝŠKA KATALOGU 946 m SE V ŽÁDNÉM PRAMENI NENAŠLA. Prameny dávají 960, 964
  a 968 m. Číslo 946 je podezřele blízké výšce MALÉHO Javorového (947 m,
  Kudy z nudy) — může to být záměna dvou vrcholů v katalogu, ale tvrdit to
  nemůžeme. Je to čtvrtý objekt v řadě, u kterého se katalogová výška
  s prameny nesešla (viz deník 8. 8. 2026), a stojí to za pozornost, protože
  katalog je AI kompilace vedená jako VODICÍ, ne verifikační pramen.

  ATRIBUCE BESKIDENVEREINU JE SLABŠÍ DOKLAD NEŽ ROK a v próze se to říká.
  Rok drží pět nezávislých pramenů, stavebníka dva sekundární. Nepřímou
  oporou je německé jméno analogické Erzherzog Albrecht-Schutzhaus na Lysé
  hoře — souvislost, ne důkaz, a jako důkaz se nepoužila.

  DVA PROVOZY NA JEDNOM MÍSTĚ SE NESLOUČILY, a je to opačný případ než
  Prašivá. Lanovka má jiného provozovatele (Bytoslan) než chatu (nájemce
  města Třince), takže to nejsou dvě jména jednoho provozu — lanovka je
  v profilu jako zajímavost a přístup, ne jako součást objektu. Rozlišovací
  otázka zůstává táž: jedna budova a jeden provoz, nebo dva?

  NEDOLOŽENO (nezapsáno): jak dlouho je Jiří Valenta nájemcem (Deník píše
  jedenáctý rok, polar.cz třináct let — nedatované články), případná
  památková ochrana, druhý gastroprovoz na vrcholu, přesná výška horní
  stanice lanovky (886 m dle lanovkajavorovy.cz × 890 m dle Kudy z nudy
  i beskydy.cz), požáry (žádný pramen je nezmiňuje a Deník naopak mluví
  o nezměněné podobě). Vlastní web javorovy-vrch.eu i javorovy.cz byly ze
  sandboxu nedostupné (robots/TLS) — kandidáti na pokus z Michalova
  prohlížeče. Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
