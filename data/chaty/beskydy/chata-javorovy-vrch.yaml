# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1895
overeniHistorie:
  source: >-
    Rok 1895 uvádí pět nezávislých pramenů (vše načteno 8. 8. 2026): Český
    rozhlas Ostrava („turistická chata z roku 1895"), Deník („ve své
    nezměněné podobě, až na drobné rekonstrukce, stojí od roku 1895"), Kudy
    z nudy, beskydy.cz a Blesk („Stojí od roku 1895"). Původní jméno
    a měsíc otevření: polar.cz — „V květnu 1895 byla otevřena chata, která
    se tehdy jmenovala Erzherzog Friedrich-Schutzhaus", česky Útulna
    arcivévody Bedřicha. STAVEBNÍK — doloženo dvěma sekundárními prameny
    a je to slabší doklad než rok: stránka historie KČT Třinec vede chatu
    mezi objekty spolku Beskidenverein („Javorové r.1895") a anglická
    Wikipedie v seznamu chat téhož spolku „Jaworowy – April 1895". ROZPOR
    V MĚSÍCI: duben (Wikipedie) × květen (polar.cz). Žádný z českých
    zpravodajských pramenů (ČRo, Deník, Blesk, polar.cz) stavebníka
    nejmenuje, takže atribuce stojí na těch dvou — nepřímou oporou je
    německé jméno analogické Erzherzog Albrecht-Schutzhaus na Lysé hoře,
    kterou Beskidenverein doloženě postavil, ale to je souvislost, ne důkaz.
    Dnešní vlastník: statutární město Třinec (Deník „Ovšem majitelem je
    město Třinec", Blesk „Patří městu", ČRo Ostrava „patří městu Třinci");
    provozovatelem je nájemce Jiří Valenta.
  verified: false
  checked: '2026-08-08'

