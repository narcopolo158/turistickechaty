# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1913
overeniHistorie:
  source: >-
    ROK 1913 JE ROKEM PRVNÍ ÚTULNY — dnešní budova je z roku 1924, obojí
    v milnících. Vlastní web, stránka historie (čteno 9. 8. 2026):
    „V letech 1911–1913 vybudovalo PTT Beskid svou první útulnu na Ropičce"
    a „Byla slavnostně otevřena za účasti asi 2000 lidí 6. června 1913."
    Stavebníkem byl tedy POLSKÝ spolek — Polskie Towarzystwo Turystyczne
    „Beskid", týž svět spolků, který v Beskydech stavěl proti
    Beskidenvereinu a Pohorské jednotě Radhošť. Útulna „v noci ze 3. na
    4. dubna 1918 do základů vyhořela" (shodně fm.denik.cz). Dnešní chatu
    postavil KČT: fm.denik.cz — „Klub českých turistů (KČT), jehož odbor ze
    Slezské Ostravy zde vybudoval útulnu podle návrhu architekta Čermáka
    z Místku"; „Útulna, jenž dostala název Bezručova chata, byla slavnostně
    otevřena 5. října 1924. Kapacita ubytování činila celkem 54 míst";
    vlastní web k témuž — základní kámen 25. 5. 1924.
    KDY PŘESNĚ SE Z CHATY STALA „RESIDENCE", ŽÁDNÝ PRAMEN NEDATUJE; jisté
    je, že po sérii oprav od roku 2008. Vlastník: vlastní web — „Nyní je tak
    Bezručova chata v soukromých rukách"; jméno vlastníka nenalezeno.
  verified: false
  checked: '2026-08-09'

