# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata na východním úbočí Ropičky, kterou roku 1913 založil polský spolek
  PTT Beskid a po požáru roku 1924 znovu postavil KČT jako Bezručovu chatu.
  Dnes je to soukromá residence pronajímaná vcelku — turistům ale slouží
  bufet s venkovním posezením, v zimě vyhřívaným.
text:
  - >-
    Residence Ropička stojí v devíti stech metrech na východním úbočí
    vrcholu Ropička (918 m), na hranici tří katastrů — Morávky, Komorní
    Lhotky a Řeky. Katalog ji vede postaru jako Chatu Ropička a starší
    generace turistů ji zná i pod třetím jménem: Bezručova chata.
  - >-
    Historie je tu spolková a dvojjazyčná. První útulnu na Ropičce postavil
    v letech 1911 až 1913 polský spolek PTT Beskid a otevřel ji 6. června
    1913 za účasti asi dvou tisíc lidí. V noci ze 3. na 4. dubna 1918 do
    základů vyhořela. Novou chatu postavil roku 1924 odbor KČT ze Slezské
    Ostravy podle návrhu architekta Čermáka z Místku — základní kámen
    v květnu, otevření už 5. října — a dal jí jméno Bezručova chata,
    s padesáti čtyřmi místy. Přestavba přišla roku 1936.
  - >-
    Po válce se tu vystřídali Vzlet OKD, Restaurace a jídelny i Kancelářské
    stroje Brno a přelom století chatu podle vlastního webu přivedl do
    nejtěžší epochy. Obrat nastal roku 2008, kdy začala ze soukromých peněz
    série oprav; roku 2019, při 95. výročí, byla odhalena pamětní deska
    s veršem Petra Bezruče.
  - >-
    Dnešní režim je potřeba říct na rovinu: ubytování funguje výhradně
    pronájmem celé residence — devatenáct lůžek a tři přistýlky, sauna,
    vířivka — takže jednotlivé lůžko si tu turista nezamluví. Kolemjdoucím
    ale slouží bufet s venkovním posezením, v zimě vyhřívaným: polévky,
    smažený sýr, klobása, palačinky, guláš a pivo. Otevřeno bývá mimo zimní
    sezónu obvykle o víkendech; konec otevírací doby uvádí web jednou 15.00
    a jednou 18.00, a tak tu stojí obě čísla.
  - >-
    Chata leží na rozcestí červené a zelené značky: po červené se jde přes
    Kotař na Prašivou (asi 4 km), po zelené dolů do Morávky, přes zelenou
    a žlutou do Řeky. Je to týž hřeben, na kterém stojí publikovaný profil
    chaty Prašivá — dva spolkové příběhy vedle sebe.
  - >-
    Údaje nesou vlastní web chaty, fm.denik.cz, kudyznudy.cz a turistika.cz;
    GPS pochází z vlastního webu, protože v OpenStreetMap objekt pod dnešním
    jménem neleží. Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Vlastní web chaty — GPS, historie 1911–2019, pronájem celku 19+3,
      bufet pro turisty, otevírací doba, kontakty (načteno 9. 8. 2026)
    url: https://www.ropicka.cz/
  - popis: >-
      fm.denik.cz, seriál Osudy chat v Beskydech — požár 1918, stavba KČT
      1924 podle návrhu architekta Čermáka, jméno Bezručova chata, 54 míst,
      pováleč[ní] správci (načteno 9. 8. 2026)
    url: https://fm.denik.cz/zpravy_region/osudy-chat-v-beskydech-ropicka20080926.html
  - popis: >-
      kudyznudy.cz — adresa Morávka 374, kapacita 30 lůžek (odchylka),
      vybavení, bufet za příznivého počasí (načteno 9. 8. 2026)
    url: https://www.kudyznudy.cz/aktivity/residence-ropicka-v-beskydech
  - popis: >-
      turistika.cz — chata 900 m n. m., rozcestí červené a zelené značky,
      trasa na Malou Prašivou (načteno 9. 8. 2026)
    url: https://www.turistika.cz/mista/ropicka-chata/detail
interniPoznamky: >-
  PRVNÍ PROFIL KORPUSU ZALOŽENÝ PŘÍMO Z KATALOGOVÉ MEZERY, bez OSM
  kandidáta. Mezera byla vedena od 8. 8. 2026 v reportu katalog-pokryti
  (Chata Ropička → Residence Ropička v KATALOG_PREJMENOVANI); rešerše
  9. 8. 2026 dodala doklady a profil vznikl s GPS z vlastního webu.
  Kdyby někdy dorazil OSM objekt, doplnit odkaz a případně zpřesnit GPS.

  KLÍČ ZAŘAZENÍ SPLNĚN BUFETEM, NE UBYTOVÁNÍM — ubytování je pronájem
  celku, tedy třída, kterou korpus jinak vyřazuje (Psotkova chata téhož
  dne). Rozdíl dělá výslovně doložený bufet pro turisty; je to týž vzor
  jako Rainerova chata (kiosek bez noclehu) — veřejná funkce rozhoduje.

  JMENOVEC: alias „Bezručova chata" koliduje s publikovaným profilem
  beskydy/bezrucova-chata (Lysá hora). Registr data/_jmenovci.yaml dvojici
  vede preventivně od 8. 8. 2026 — dnes se preventivní záznam stal ostrým.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: kapacita (19+3 vlastní web × 30
  kudyznudy.cz); konec víkendové otevírací doby (15.00 × 18.00 v tabulce
  10.00–18.00); telefon (vlastní web +420 602 534 635 × kudyznudy.cz
  neúplné „+420 55 440 533").

  NEDOLOŽENO, a nenalezení není vyvrácení: datum přejmenování na
  „Residence"; jméno soukromého vlastníka; zimní režim bufetu; kdy přesně
  zaniklo jméno Bezručova chata (web říká jen „po válce" éru správců).
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
