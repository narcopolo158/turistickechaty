    Rok 1929 se zapisuje jako rokVzniku (vznik turistické služby na místě);
    rok dnešní budovy zůstává nerozhodnutý a je přiznaný v próze.
    DNEŠNÍ PROVOZOVATEL: Horský hotel Kozubová s.r.o., Milíkov 28
    (zivefirmy.cz). NENÍ TO CHATA KČT — v přehledu chat Klubu českých
