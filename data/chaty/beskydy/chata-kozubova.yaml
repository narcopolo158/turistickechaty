    sloužila až do roku 1973, kdy vyhořela."). ZABAVENÍ 1951 na základě
    zákona 68/51, majetek přešel na státní podnik Restaurace a jídelny
    (vlastní web). POŽÁR 9. února 1973 — vlastní web („9. února 1973 se
    však událo neštěstí, které navždy uzavřelo jednu z kapitol Kozubové.",
    příčinou byla „chybná konstrukce komínu, od kterého začal doutnat trám
    konstrukce střechy") i Deník („Původní chata vydržela do roku 1973, kdy
    ji 9. února zachvátil mohutný požár."). ROK NOVÉ CHATY — ROZPOR TŘÍ
    ČÍSEL, nesrovnaný: vlastní web „V roce 1989 na jejím místě vybudoval
