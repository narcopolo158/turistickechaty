# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel na Kozubové nad Milíkovem, na místě turistické chaty, kterou
  tu roku 1929 postavil polský spolek Beskid Śląski z Orlové. Původní chata
  vyhořela 9. února 1973; vedle dnešní budovy stojí kamenná kaple svaté Anny
  s vyhlídkovou věží.
text:
  - >-
    Kozubová je v beskydském korpusu zajímavá tím, kdo ji postavil. Ne
    německý Beskidenverein, ne česká Pohorská jednota Radhošť, ale POLSKÝ
    turistický spolek Beskid Śląski se sídlem v Orlové — pozemek pod
    vrcholem odkoupil od rodiny Sikorů roku 1925 a v září 1929 tu stála
    chata podle návrhu Edvarda Davida z Českého Těšína. Na slavnostní
    otevření podle provozovatele přišlo několik tisíc lidí a roku 1937 se
    tu jel lyžařský závod Zjazd Gwiaździsty s víc než šedesáti polskými
    družstvy. Na Těšínsku té doby to o poměrech vypovídá dost.
  - >-
    Roku 1951 byl majetek na základě zákona zabaven a chata přešla pod
    státní podnik Restaurace a jídelny. Skončila 9. února 1973, kdy z větší
    části vyhořela — podle provozovatele začal od chybně postaveného komínu
    doutnat trám ve střeše.
  - >-
    Kdy vznikla dnešní budova, se z pramenů říct nedá. Provozovatel uvádí
    rok 1989 a jako stavebníka státní podnik Kovona, Deník i Kudy z nudy rok
    1982 a tutéž karvinskou Kovonu, a jeden pramen dokonce rok 1973. Tři
    různá čísla, tak žádné neuvádíme jako fakt; rokem vzniku zůstává 1929,
    tedy rok, kdy na Kozubové začala turistická služba.
  - >-
    Vedle hotelu stojí kamenná kaple svaté Anny s vyhlídkovou věží
    a každoročními poutěmi. Do profilu hotelu ji ale nespojujeme, protože
    patří církvi — je to jiný objekt jiného vlastníka, na rozdíl od
    Prašivé, kde je rozhledna zabudovaná do střechy chaty. Rok kaple se
    v pramenech rozchází mezi lety 1928 a 1937 a výška věže mezi osmnácti
    a dvaceti metry, takže ani jedno tady neuvádíme. Výhled z ní je
    doložitelně jen na severní a východní stranu — do ostatních směrů ho
    kryjí stromy.
  - >-
    Dnes je to horský hotel se šedesáti lůžky, restaurací pro pětasedmdesát
    hostů a barem; provozovatel z jídel vypichuje placki na blasze. Na
    svahu pod hotelem je lyžařský vlek. Není to chata Klubu českých
    turistů — v jeho přehledu chat Kozubová není.
  - >-
    Na vrchol vede žlutá značka z Návsí přímo přes vrchol, zelená
    z Bocanovic a modrá z Košařisek; prochází tu i značená cyklostezka.
    Hlavní beskydská hřebenovka Kozubovou neprochází.
  - >-
    Údaje na téhle stránce nesou vlastní web hotelu, Deník, Kudy z nudy,
    turistika.cz, regiontourist.cz, vrcholovka.cz a firemní registr
    zivefirmy.cz; polohu nese OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
