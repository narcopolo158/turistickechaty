interniPoznamky: >-
  Povýšeno z data/kandidati/beskydy/chata-kozubova.yaml (8. 8. 2026), pátý
  publikovaný profil oblasti Beskydy.

  KAPLE S ROZHLEDNOU SE VĚDOMĚ NESLOUČILA, a je to protipól Prašivé. Na
  Prašivé je rozhledna nástavbou střechy chaty, takže jeden objekt; tady je
  kaple svaté Anny samostatná kamenná stavba v MAJETKU CÍRKVE (Kudy z nudy:
  „Kaple s 18 metrů vysokou rozhlednou je dnes v majetku církve",
  regiontourist.cz totéž), spravuje ji farnost, a hotel s ní nemá provozní
  vztah. Dvě různá vlastnictví a dvě různé stavby = dva objekty. Kaple sama
  do průvodce nepatří, protože nemá občerstvení; do profilu hotelu jde jako
  zajímavost. Tři případy vedle sebe (Prašivá slučuje, Kleť slučuje,
  Kozubová neslučuje) dávají použitelné pravidlo: rozhoduje jedna stavba
  NEBO jeden provoz, ne blízkost.

  TYP `horsky-hotel`, ne `obsluhovana`: provozovatel se představuje jako
  horský hotel, má šedesát lůžek, bar a lyžařský areál. Katalog i
  OpenStreetMap vedou „Chata Kozubová" — proto je to alias, ne název. Vzor
  Berggasthofu Grobauer na Šumavě.

  ROK DNEŠNÍ BUDOVY SE NEZAPSAL: tři neslučitelné hodnoty (1989 dle
  vlastního webu, 1982 dle Deníku a Kudy z nudy, 1973 dle turistika.cz
  u obce Milíkov). Zvláštní na tom je, že provozovatel — pramen nejblíž
  objektu — stojí proti dvěma ostatním. Zapsán rokVzniku 1929 jako vznik
  turistické služby na místě, vzor Berghausu Loderhart, kde je rokVzniku
  rok koupě.

  ROK KAPLE SE NEZAPSAL ANI DO ZAJÍMAVOSTI: čtyři hodnoty (1928 dle
  turistika.cz, „po otevření chaty 1929" dle vlastního webu, 1936–37 dle
  Kudy z nudy s farářem Ploszekem z Hnojníka, 1937 dle Deníku se stavitelem
  Kiszou a architektem Dawidem) a k tomu dvě výšky věže (18 × 20 m).
  Zajímavost proto mluví o kapli bez data.

  KATALOGOVÁ VÝŠKA 982 m JE VYŠŠÍ NEŽ NAŠE 981 m a je to jediný z dnešní
  čtveřice objektů, kde se katalog s prameny skoro sešel (u Gírové,
  Javorového i Severky se rozešel výrazně — viz deník).

  ANI KČT: kandidát nebyl v seznamu chat Klubu českých turistů, ověřeno
  proti kct.cz. V témže seznamu naopak JSOU beskydské chaty Skalka a Ostrý,
  což je pro jejich budoucí profily užitečná stopa.

  NEDOLOŽENO (nezapsáno): rok dnešní budovy, rok a výška kaple, kóta
  samotné budovy odlišená od kóty vrcholu (žádný pramen ji nerozlišuje),
  voda a zásobování, doslovný doklad rekonstrukce 2019–2021 (mám jen
  parafrázi z vlastního webu), jestli kolem prochází hřebenovka (horydoly.cz
  Kozubovou v popisu hlavního hřebene nejmenuje — to je nepřítomnost údaje,
  ne doklad opaku). Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
