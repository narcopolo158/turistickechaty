# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Rodinný bufet s chatou přímo na sjezdovce Marguška ve středisku
  Snowparadise Veľká Rača nad Oščadnicí. Bufet nese jméno zakladatele, pana
  Fera, a funguje skoro dvacet let — jen v zimní sezóně; chata se pronajímá
  vcelku.
text:
  - >-
    Chata Marguška stojí přímo na sjezdovce Marguška ve středisku
    Snowparadise Veľká Rača nad Oščadnicí, v Kysuckých Beskydech. Katalog ji
    vede jako Chatu Marguška; dnes se celý provoz jmenuje po svém
    zakladateli a majiteli — Chata Marguška U Fera.
  - >-
    Proti ostatním beskydským profilům je to příběh bez velké historie:
    žádný spolek, žádný požár, jen bufet, který pan Fero provozuje skoro dvacet
    let a jehož specialitou je vlastní nápoj Margušovka. K bufetu časem
    přibyla chata se čtyřmi ložnicemi, která se pronajímá vcelku — jednotlivé
    lůžko si tu turista nezamluví.
  - >-
    Na rovinu k provozu: bufet je podle střediska mimo zimní sezónu zavřený,
    takže tohle je zimní zastávka pro lyžaře a skialpinisty, ne celoroční
    chata na hřebeni. Otevírací hodiny prameny neuvádějí a nadmořskou výšku
    taky ne. Hřeben Veľké Rače se značenými trasami je odsud kousek — ale
    jestli k chatě vede značka, žádný pramen neříká, a tak to netvrdíme.
  - >-
    Údaje nesou vlastní web chataufera.sk, snowparadise.sk, zlavadna.sk
    a ulovubytovanie.sk; GPS pochází z inzertního listu, protože objekt
    nemá podklad v OpenStreetMap. Redakce nic neověřila vlastním dotazem
    ani návštěvou.
