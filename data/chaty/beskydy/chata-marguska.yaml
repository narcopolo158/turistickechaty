interniPoznamky: >-
  TŘETÍ PROFIL Z KATALOGOVÉ MEZERY V JEDNOM DNI — a NEJSLABŠÍ KLÍČ z celé
  trojice, což je tu poctivě rozepsané. Klíč zařazení nese bufet: veřejné
  občerstvení doložené vlastním webem („takmer 20 rokov"), ale (1) jen
  v zimní sezóně, (2) na sjezdovce, ne na doložené značené trase, (3)
  ubytování je pronájem celku. Pro povýšení mluví, že objekt vede KATALOG —
  průvodcův vodič ho považuje za chatu klíče — a že přesně tahle třída
  (bufet u sjezdovky s pronájmem) prošla u Ropičky. Proti mluví, že bez
  katalogu by tenhle objekt triáž nejspíš vyřadila jako pronájem s bufetem.
  KDYBY MICHAL ROZHODL OPAČNĚ, správný krok je přesun do KATALOG_MIMO_KLIC
  v scripts/kontrola/katalog-pokryti.ts (vzor Wellness hotel Bahenec)
  a smazání tohohle profilu — mezera katalogu tím zůstane vysvětlená.

  ŽÁDNÁ HISTORICKÁ „CHATA MARGUŠKA" NENALEZENA: rešerše cíleně hledala
  starší turistickou chatu toho jména (mj. u Velkého Polomu) a nenašla
  nic — jediný nositel jména je tenhle provoz v Oščadnici. Nenalezení není
  vyvrácení, ale katalogová položka se skoro jistě vztahuje právě sem.

  NEDOLOŽENO, a nenalezení není vyvrácení: nadmořská výška; rok vzniku
  (jen „takmer 20 rokov" bufetu); kapacita lůžek číslem; otevírací hodiny
  bufetu; letní provoz; značená trasa k objektu; IČO provozovatele.
  Fotku dodá běh DATA-02 (pokud objekt najde), výškový profil DATA-06.
