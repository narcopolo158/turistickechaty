interniPoznamky: >-
  Povýšeno z data/kandidati/beskydy/chata-girova.yaml (8. 8. 2026), čtvrtý
  publikovaný profil oblasti Beskydy.

  OTEVŘENÁ OTÁZKA ROZSAHU PROFILU, kterou tenhle objekt přináší jako první
  svého druhu: sto padesát metrů od chaty stojí VEDLEJŠÍ CHATA s 33 lůžky
  (treking.cz). Je to část tohohle objektu, nebo samostatný objekt? Prameny
  to neříkají a čísla lůžek se podle toho, jak se to vezme, liší dvojnásobně
  (30 × 61). Proto zůstalo pole `kapacita` prázdné. Není to týž případ jako
  Prašivá (jedna budova, dvě jména) ani jako Kleť (dvě věci, jeden
  provozovatel) — tady jsou dvě budovy a o provozovateli vedlejší nic nevíme.
  Rozhodne to redakce, ne odhad.

  OBEC: katalog vede „Písek u Jablunkova", prameny shodně BUKOVEC (adresa
  Bukovec 134, i zápis firmy „Horská chata Gírová (Bukovec)"). Zapsán
  Bukovec. Je to druhá katalogová odchylka u tohohle objektu — první je
  výška 800 m, kterou taky nedrží žádný pramen.

  KATALOGOVÉ VÝŠKY SE DNES NESEŠLY S PRAMENY UŽ POČTVRTÉ (Gírová 800 ×
  770/775, Javorový 946 × 960/964/968, Severka 957 × 965, Kozubová 982 ×
  981). Katalog je AI kompilace vedená jako VODICÍ pramen, ne verifikační,
  takže to není porušení konvence — ale je to vzorec a patří do deníku.

  TELEFON: čtyři různá čísla ve třech pramenech (gotic.cz 732 823 176,
  Kudy z nudy 730 539 037, OpenStreetMap 558 367 724 a 606 604 896).
  Zapsáno první z OSM, protože ten pramen nese licenci a datum stavu dat;
  ostatní zůstávají tady. Jeden telefonát to rozhodne (DATA-04).

  „PŘED DEVADESÁTI LETY" SE NEPŘEPOČÍTÁVALO. Deník to píše, ale datum
  vydání článku se ze stránky nezískalo, takže z relativního údaje se
  absolutní rok nedělá. S doloženým rokem 1932 to není v rozporu, a tím to
  končí.

  NEDOLOŽENO (nezapsáno): kapacita lůžek, otvírací doba, požáry a přestavby
  (žádný pramen je nezmiňuje), architekt, voda a zásobování, výška vrcholu
  s jistotou (839 × 840 m v jednom prameni), vztah dnešních majitelů.
  Vlastní web chatagirova.cz i .com byly ze sandboxu nedostupné — kandidát
  na pokus z Michalova prohlížeče. Fotku dodá běh DATA-02, výškový profil
  přístupů DATA-06.
