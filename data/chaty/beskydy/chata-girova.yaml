# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Modřínová chata na česko-slovensko-polském pomezí, kterou 9. července 1932
  otevřel karvinský odbor Klubu českých turistů jako Dorazilovu chatu. Dnes
  je jedním ze čtyř kontrolních bodů Přechodu Beskyd.
text:
  - >-
    Gírová stojí v Jablunkovském mezihoří na dohled od místa, kde se
    stýkají tři země. Chata není na vrcholu — ten má podle treking.cz
    840 metrů a je od ní ještě asi pět set metrů do svahu. Výšku samotné
    chaty prameny uvádějí dvojmo, 770 a 775 metrů, a my zapisujeme nižší
    číslo a rozpor přiznáváme; katalogových osm set metrů jsme nenašli
    nikde.
  - >-
    Postavil ji Klub českých turistů, konkrétně odbor v Karviné vedený
    JUDr. Leopoldem Dorazilem, a otevřela se 9. července 1932 jako
    Dorazilova chata. To je u beskydské chaty z té doby méně obvyklé, než
    se zdá: většinu zdejších chat stavěl buď německý Beskidenverein, nebo
    česká Pohorská jednota Radhošť, a ani jeden z nich tu doložený není.
    Postavili ji z modřínového dřeva z místních zdrojů a v březnu 2012
    dostala pamětní desku zakladatele, kterou darovalo město Karviná.
  - >-
    Držitelé se po ní protočili: mezi roky 1938 a 1967 byla pronajatá,
    pak patřila Beskydským hotelům a restauracím, od roku 1996 do 2012
    manželům Sikorovým a dnes ji vedou Malyjurkovi. V jakém vztahu spolu
    jsou, tu neuvádíme — jeden pramen píše manželé, druhý sourozenci.
  - >-
    Kolik se tu vyspí lidí, taky neuvádíme, a je to zajímavější než to
    vypadá. Jeden pramen počítá 28 lůžek v hlavní chatě a 33 v chatě
    vedlejší sto padesát metrů odtud, druhý mluví o celkové kapacitě
    třiceti lůžek. To nejsou dvě různá čísla téhož, ale dvě různé
    představy o tom, co je vlastně tenhle objekt. Než se rozhodne, jestli
    vedlejší chata patří k téhle nebo je samostatná, zůstává pole prázdné.
  - >-
    K chatě vede červená z Mostů u Jablunkova a z Bukovce, zelená
    z Jablunkova a od Hrčavy žlutá; jako nejkratší přístup uvádí
    jablunkovsko.cz dva kilometry od zastávky Markov. Hlavní beskydská hřebenovka Gírovou neprochází. Zato
    je chata jedním ze čtyř kontrolních bodů Přechodu Beskyd — vedle
    Prašivé, Kamenitého a Skalky — a ten se dá jít od dubna do konce října.
    V zimě jezdí čtyři sta metrů odtud vlek Tatrapoma.
  - >-
    Kdy je otevřeno, poctivě nevíme. Dva prameny dávají dva rozvrhy, které
    se neshodnou ani na tom, jestli je v úterý otevřeno; jistý je jen
    celoroční provoz a pondělní zavíračka mimo sezónu. Než to potvrdí
    telefonát, rozvrh neuvádíme.
  - >-
    Údaje na téhle stránce nesou poznejdomy.cz, Deník, treking.cz, Kudy
    z nudy, gotic.cz, jablunkovsko.cz a prechodbeskyd.cz; polohu nese
    OpenStreetMap. Vlastní web chaty se nám ze sandboxu nepodařilo otevřít.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
