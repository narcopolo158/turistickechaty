# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1932
overeniHistorie:
  source: >-
    poznejdomy.cz (načteno 8. 8. 2026): „Horská chata Gírová byla poprvé
    otevřena 9. července 1932 Klubem českých…" — věta je na stránce
    zkrácená, ale tentýž pramen dodává, že se na výstavbě podílel odbor KČT
    v Karviné vedený JUDr. Leopoldem Dorazilem a že chata původně nesla
    jméno Dorazilova chata. Deník k tomu uvádí, že chatu „postavili
    z místních surovin: modřínového dřeva", a že „vznikla před devadesáti
    lety" — datum vydání článku se ze stránky nezískalo, takže z toho
    absolutní rok nepočítáme; s rokem 1932 to není v rozporu.
    ŘETĚZ DRŽITELŮ dle poznejdomy.cz: 1938–1967 pronajato Franciszku
    Schulhauserovi, poté Beskydské hotely a restaurace, 1996–2012 manželé
    Sikorovi. DNEŠNÍ MAJITELÉ — ROZPOR, nesrovnaný: poznejdomy.cz píše
    „manželé Malyjurek", Deník „sourozence Marii a Petra Malyjurkovy".
    Jméno se shoduje, vztah ne, a proto se do dat nezapisuje ani jedno.
    ANI BESKIDENVEREIN, ANI POHORSKÁ JEDNOTA RADHOŠŤ: u Gírové není doložen
    žádný z obou spolků, které v Beskydech stavěly nejvíc — je to chata
    Klubu českých turistů, a to se stojí za zapsání, protože u beskydských
    chat se právě tohle domýšlí snadno.
  verified: false
  checked: '2026-08-08'

