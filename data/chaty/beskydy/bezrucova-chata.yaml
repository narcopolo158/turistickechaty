# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1934
overeniHistorie:
  source: >-
    lysahora.cz, historie chaty (načteno 8. 8. 2026): základní kámen
    položen 1. října 1933 („1.října velkolepá slavnost položení
    základního kamene"), stavbu provedla firma Nekvasil Ostrava za
    602 000 Kč podle projektu inženýra Františka Knoblocha, a „v prosinci
    1934, tedy za 6 měsíců, byla chata otevřena". ROZPOR O DATU OTEVŘENÍ,
    nesrovnaný: týž pramen dodává, že „otevření chaty pro veřejnost
    uskutečněno 16.června 1935", což potvrzuje i KČT („veřejnosti otevřena
    16. června 1935"), kdežto treking.cz uvádí 6. 6. 1935. Rok 1934 se
    tedy zapisuje jako rok DOKONČENÍ a otevření budovy; otevření pro
    veřejnost je o půl roku později a den se v pramenech liší.
    Architekta projektu potvrzuje i KČT („podle projektu architekta
    Františka Knoblocha"). STAVEBNÍKEM byla dle lysahora.cz „Pobeskydská
    župa Klubu českých turistů" — NE Pohorská jednota Radhošť, která se
    v žádném prameni o Lysé hoře nevyskytuje (viz interniPoznamky).
    Přejmenování: lysa-hora.cz i chronologie na galaxy.asu.cas.cz vedou
    původní jméno „Chata Klubu československých turistů na Lysé hoře"
    a přejmenování na Bezručovu chatu po znárodnění roku 1948.
  verified: false
  checked: '2026-08-08'

