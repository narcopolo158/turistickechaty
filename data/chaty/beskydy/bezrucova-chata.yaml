zajimavosti:
  - text: >-
      Nová chata je záměrnou replikou té vyhořelé z roku 1934 — venku
      funkcionalismus třicátých let, vevnitř nízkoenergetický dům
      s rekuperací, solárem a fotovoltaikou.
    kategorie: jine
    zdroj: >-
      lysahora.cz (načteno 8. 8. 2026): „Obnovená chata je vlastně
      replikou vyhořelé Bezručovy chaty"; „moderním, ekologickým zdrojem
      vytápění, s rekuperací, s použitím solár. a fotovolt. zařízení,
      s důrazem na úspory energie a tepla"; stavbaweb.cz: „co nejvíce
      původní funkcionalistickou podobu"
  - text: >-
      Na východní štítové zdi chaty je lezecká stěna; v domě je trvalá
      výstava karpatské flóry a fauny a projekční místnost.
    kategorie: jine
    zdroj: >-
      lysahora.cz (načteno 8. 8. 2026) — „lezecká stěna" na východní
      štítové zdi, trvalá výstava karpatské flory a fauny, projekční
      místnost pro filmy o ochraně přírody a historii Beskyd, dalekohled
  - text: >-
      Chata má k dispozici jen prameniště, které dává vodu při jarním
      tání nebo po dlouhých deštích. V květnu 2026 musel vodovodní podnik
      vozit pitnou vodu na vrchol cisternou třikrát za jediný týden.
    kategorie: jine
    zdroj: >-
      Vlastní web chaty (načteno 8. 8. 2026): „má Bezručova chata
      k dispozici pouze prameniště, které dává vodu jen při jarním tání
      či dlouhotrvajících deštích"; Klub českých turistů, článek
      ze 14. 5. 2026 — voda se z Krásné vyvážela na vrchol „hned
      třikrát" během jednoho týdne
  - text: >-
      Jeden vodní zdroj na Zimném se dělí mezi všechny objekty na vrcholu
      — radiokomunikace, meteorologickou stanici a dvě turistické chaty.
    kategorie: jine
    zdroj: >-
      Klub českých turistů (načteno 8. 8. 2026), správce chaty Robin
      Kukuczka: „Máme jeden zdroj pro celý kopec, je to vlastně na Zimném
      a ten se musí přerozdělit mezi všechny subjekty na Lysé hoře"
  - text: >-
      Autem se na vrchol nedostanete: povolení k individuálnímu výjezdu
      nelze získat a výjimky mají jen zásobování obou chat a obsluha
      vysílače.
    kategorie: jine
    zdroj: >-
      lysahora.cz (načteno 8. 8. 2026): „Získat povolení k individuálnímu
      výjezdu motorovým vozidlem na Lysou horu NENÍ V SOUČASNÉ DOBĚ
      MOŽNÉ!"; Dům přírody Beskydy / AOPK (13. 5. 2016): „Na účelové
      komunikace v chráněných krajinných oblastech je navíc vjezd zákonem
      zakázán.", výjimky jen pro zásobování Bezručovy chaty a chaty
