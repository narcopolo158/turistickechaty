    přiznaný: lysahora.cz na jiné své stránce o novostavbě píše „12 lůžek
    plus byt pro chataře". Rozdíl dvou lůžek se dá vysvětlit tím, že se
    druhý pramen týká projektu a první provozu, ale doloženo to tak
    nemáme. Zapsáno 10 dle konvence z 27. 7. 2026 (při rozporu nižší
    číslo, rozpor přiznat) — a shodují se na něm čtyři prameny včetně
    provozovatele.
