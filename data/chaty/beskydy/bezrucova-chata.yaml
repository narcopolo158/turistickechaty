# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata Klubu českých turistů na vrcholu Lysé hory, kterou prameny shodně
  uvádějí jako nejvyšší horu Moravskoslezských Beskyd. Původní funkcionalistická stavba z roku 1934
  vyhořela v březnu 1978; dnešní chata je její replika, otevřená po
  sedmatřiceti letech roku 2015 — venku třicátá léta, vevnitř
  nízkoenergetický dům. Autem se sem nedojede.
text:
  - >-
    Vrchol Lysé hory má dlouhou chatařskou historii a Bezručova chata je
    v ní ta česká linie. Německý Beskidenverein tu měl od roku 1895
    Erzherzog Albrecht-Schutzhaus, ještě dřív, od roku 1880, stála na
    vrcholu turistická útulna Slezský dům. Česká chata přišla až ve
    třicátých letech: základní kámen položila Pobeskydská župa Klubu
    českých turistů 1. října 1933, stavěla ji ostravská firma Nekvasil
    podle projektu inženýra Františka Knoblocha za 602 tisíc korun a v
    prosinci 1934 byla hotová. Veřejnosti se otevřela následující rok —
    16. června 1935 podle Klubu českých turistek i podle serveru
    lysahora.cz, 6. června podle serveru treking.cz. Jméno Bezručova
    chata dostala až po znárodnění roku 1948; do té doby se jmenovala
    Chata Klubu československých turistů na Lysé hoře.
  - >-
    Skončila 11. března 1978 v 16.10 hodin, kdy vyhořela. Příčinu se
    nepodařilo jednoznačně objasnit, spekulovalo se o elektroinstalaci.
    Požár měl i lidskou oběť — v chatě zahynul tříletý chlapec, syn
    pomocnice z kuchyně. Vrchol pak byl na sedmatřicet let bez chaty;
    stál tu jen provizorní bufet, kterému se říkalo Šantán.
  - >-
    Nová Bezručova chata se otevřela roku 2015 a je to úmyslná replika té
    vyhořelé: zvenčí funkcionalismus třicátých let, uvnitř
    nízkoenergetický dům s rekuperací, solárem a fotovoltaikou a s moderním
    řešením odpadních vod. Stavěl ji Klub českých turistů s pomocí
    dobrovolníků a veřejných darů, na místě v první zóně ochrany přírody,
    kde byla stavební omezení značná. Ve dni otevření se prameny neshodují:
    5. září 2015 se na vrcholu sešlo přes tisíc lidí na slavnostním
    otevření, provoz se ale podle vlastního webu chaty datuje od
    25. listopadu 2015.
  - >-
    Ubytuje se tu deset lidí v pěti dvoulůžkových pokojích s vlastním
    sociálním zařízením, restaurace má sto dvacet míst u stolu. K tomu
    věci, které jinde na chatě nenajdete: trvalá výstava karpatské flóry
    a fauny, projekční místnost na filmy o Beskydech a lezecká stěna na
    východní štítové zdi. Chata patří Klubu českých turistů a nájemní
    smlouva současného nájemce je uzavřená do 30. června 2029.
  - >-
    Nejtvrdší věc na životě téhle chaty je voda. Vlastní prameniště dává
    vodu jen při jarním tání nebo po dlouhých deštích, jeden zdroj na
    Zimném se dělí mezi všechny objekty na vrcholu — radiokomunikace,
    meteorologickou stanici a dvě chaty — a v květnu 2026 vozil vodovodní
    podnik pitnou vodu z Krásné cisternou třikrát za jediný týden. Klub
    českých turistů proto řeší nový vrt na Větrech a sbírá na něj peníze;
    kdyby se to nevyřešilo, hrozí omezení provozu chat. Slovy správce
    chaty: „To sucho je prostě šílené a musíme bojovat."
  - >-
    Na vrchol se chodí pěšky a jinak to nejde: povolení k individuálnímu
    výjezdu autem nelze získat, vjezd na účelové komunikace v chráněné
    krajinné oblasti je zakázaný zákonem a výjimky mají jen zásobování obou
    chat a obsluha vysílače. Značených výstupů je osm a nejčastěji se jde
    z Ostravice po červené (Bezručův výplaz), z Malenovic přes Ivančenu,
    z Krásné po žluté nebo z Visalají po červené. Délky se v pramenech
    rozcházejí o kilometr až dva, takže je tu neuvádíme; přesné profily
    doplní pipeline.
  - >-
    Vrchol není jen chata. Vedle Bezručovy chaty tu stojí Chata Emil
    Zátopek – Maraton, což je samostatný provoz jiného vlastníka, a k ní
    patřící ubytovna Desítka (Kameňák), která vlastní kuchyň nemá.
    Dál televizní vysílač Českých radiokomunikací, meteorologická stanice
    Českého hydrometeorologického ústavu s denním pozorováním od července
    1897, stanice horské služby a kaplička — u jejího zasvěcení se ovšem
    prameny rozcházejí natolik, že ho tu neuvádíme.
  - >-
    Údaje na téhle stránce nesou vlastní web chaty, stránky Klubu českých
    turistů, servery lysahora.cz a lysa-hora.cz, beskydyportal.cz, Kudy
    z nudy, treking.cz, hrady.cz, stavbaweb.cz, tyden.cz a Dům přírody
    Beskydy; polohu nese OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
