interniPoznamky: >-
  Povýšeno z data/kandidati/beskydy/bezrucova-chata.yaml (8. 8. 2026), druhý
  publikovaný profil oblasti Beskydy.

  KOLIK PROFILŮ MÁ MÍT VRCHOL LYSÉ HORY — rozhodnuto na dvě, a je to
  doložené. Katalog vede na vrcholu dva objekty (Bezručova chata, Chata Emil
  Zátopek – Maraton) a rešerše 8. 8. 2026 to potvrdila z nečekaného pramene:
  článek KČT o nedostatku vody cituje správce, podle kterého se jeden zdroj
  dělí mezi „radiokomunikace, meteorologickou stanici a dvě turistické
  chaty". Dvě, ne tři. Chata Emil Zátopek – Desítka (Kameňák) je
  ubytovna BEZ vlastní kuchyně — Kudy z nudy doslova: „Stravování je možné
  ve vedlejší chatě Emil Zátopek – Maraton" — takže podle klíče zařazení
  nemá vlastní profil, ale patří pod Maraton. Televizní vysílač
  (České radiokomunikace), meteorologická stanice (ČHMÚ, veřejnosti
  nepřístupná) a kaplička jsou položky „co je na vrcholu", ne profily
  provozů. Vysílač jako „věž s vyhlídkou pro turisty" doložit NEJDE: jediná
  zmínka o ochozech mluví o správcích, ne o veřejnosti.

  MOJE CHYBA V ZADÁNÍ REŠERŠE, chycená rešeršistou — a je to tentýž omyl
  jako u Prašivé o hodinu dřív. Ptal jsem se, jestli chatu postavila
  Pohorská jednota Radhošť. Nepostavila; v žádném prameni o Lysé hoře se
  nevyskytuje. Doložený stavebník je POBESKYDSKÁ ŽUPA KLUBU ČESKÝCH TURISTŮ.
  Dvakrát za jeden blok jsem tedy do zadání propašoval spolek, který se mi
  zdál pravděpodobný, protože ho průvodce zná z beskydské charakteristiky.
  Poučení je konkrétní: do zadání rešerše se nepíše domněnka jako otázka
  „bylo to X?", ale otevřená otázka „kdo?".

  VÝŠKA SE NEZAPSALA ANI JEDNA a je to dvojí rozpor, ne opomenutí. Výška
  chaty: 1304 m (treking.cz) × 1310 m (vrcholovka.cz), oba sekundární,
  provozovatel žádnou neuvádí. Výška hory: 1323 m (vlastní web, lysahora.cz,
  beskydyportal.cz, nocleh.kct.cz) × 1324 m (Kudy z nudy, hrady.cz,
  turistika.cz, vrcholovka.cz). Konvence „nižší číslo při rozporu" by dala
  1323, ale to je výška HORY, ne chaty — a plést je dohromady je přesně ta
  chyba, kterou jsme u Prašivé pojmenovali. Pole `vyska` proto zůstává
  prázdné a v próze stojí „nad třinácti sty metry". Hodnotu 1328 m, kterou
  vede PeakVisor a kterou nese poznámka v data/oblasti/beskydy.yaml, rešerše
  v žádném MÍSTNÍM prameni nenašla — stojí za to to vědět, až se výška Lysé
  hory bude srovnávat.

  ROK 1934 JE ROK DOKONČENÍ, ne otevření pro veřejnost. Chata byla hotová
  a otevřená v prosinci 1934, veřejnosti se otevřela 16. června 1935 (KČT
  i lysahora.cz) nebo 6. června 1935 (treking.cz). Zapsán 1934 jako
  rokVzniku, oba údaje jsou v overeniHistorie i v próze. Podobně u nové
  chaty: 5. září 2015 slavnostní otevření budovy (tyden.cz, stavbaweb.cz),
  25. listopadu 2015 provoz (vlastní web, beskydyportal.cz). Prameny to samy
  nespojují, takže se to nespojuje ani tady.

  VODA JE CHARAKTERISTIKA, NE DETAIL. U vrcholové chaty, která nemá vodu
  a řeší ji cisternami, to není provozní drobnost — je to hlavní věc, která
  o tom místě něco říká, a proto je i v próze. Nákladní lanovku pro
  zásobování žádný pramen nezmiňuje; doložené je jen silniční zásobování na
  výjimku plus cisterny.

  KAPLIČKA — ZASVĚCENÍ SE NEZAPSALO. Tři neslučitelné údaje: lysahora.cz
  mluví jen o „malé kapličce", hrady.cz o kapli sv. Kříže, turistika.cz
  o výklenkové kapličce sv. Floriána. Kaple sv. Cyrila a Metoděje je na
  RADHOŠTI, ne tady — to je snadná záměna a je dobré ji mít zapsanou.

  DÁLKOVÁ TRASA VRCHOLEM SE NEDOLOŽILA, spíš naopak: treking.cz vede
  evropskou dálkovou trasu E3 v Beskydech přes Velký Javorník, Radhošť,
  Pustevny, Martiňák a Třeštík — Lysou horu nejmenuje. Doložená je jen
  červená hřebenová spojnice. Do prózy se proto o dálkové trase nic
  nepíše.

  NEDOLOŽENO (nezapsáno): sezónnost Bezručovy chaty výslovně, výška chaty,
  zasvěcení kapličky, autobus na vrchol (lysahora.cz ho zmiňuje bez
  jediného detailu a při zákazu vjezdu to působí protichůdně — kandidát na
  telefonát), rok otevření Chaty Emil Zátopek – Maraton (jaro 2016 ×
  plán 2012/2013), existence Chaty Emil Zátopek – Pětka (zmiňuje ji jediný
  pramen, hrady.cz). Fotku dodá běh DATA-02, výškový profil přístupů
  DATA-06.
