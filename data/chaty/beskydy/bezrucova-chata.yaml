    Vlastní web chaty (načteno 8. 8. 2026): ubytování „pěti komfortně
    zařízených dvoulůžkových pokojů s vlastním sociálním zařízením" —
    tedy deset lůžek; totéž rozdělení uvádí Klub českých turistů,
    nocleh.kct.cz (kde stojí i číslo 10) a lysahora.cz („nabízí ubytování
