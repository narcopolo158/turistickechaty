# ── Historie ──────────────────────────────────────────────────────────────
# rokVzniku SE NEVYPLŇUJE — nikdo z pramenů rok stavby chaty neuvádí. Viz
# overeniHistorie. Je to jediný objekt z beskydské čtveřice 8. 8. 2026, u
# kterého se to nepodařilo, a nedomýšlí se.
overeniHistorie:
  source: >-
    ROK STAVBY ANI STAVEBNÍK SE NEPODAŘILI DOLOŽIT (rešerše 8. 8. 2026).
    Nejblíž je ocimaturisty.cz: „Ski areál Severka na severním svahu
    Kostelka začal psát svou historii roku 1962", areál měl
    „jednosedačkovou lanovku, která návštěvníkům sloužila do přelomu
    70.-80. let minulého století", a k chatě týž pramen uvádí: „Ve stejné
    době byla v místech horní stanice zrušené lanovky postavena chata,
    která turistům i lyžařům poskytovala neocenitelné služby." Z toho vyplývá
    zařazení na přelom sedmdesátých a osmdesátých let, ale KONKRÉTNÍ ROK ANI
    STAVEBNÍK (spolek? podnik? soukromník?) v žádném prameni nestojí, a tak
    se nezapisují. Doložen je jen pozdější přechod: „Po revoluci roku 1989
    přešla chata do soukromého vlastnictví, kde zůstala dodnes." Jméno
    dnešního vlastníka ani provozovatele neuvádí vlastní web, obec Dolní
    Lomná ani beskydy.cz. ANI JEDEN ZE DVOU BESKYDSKÝCH SPOLKŮ tu nemůže být
    doložen už časově — Beskidenverein i Pohorská jednota Radhošť stavěly
    o osmdesát let dřív — ale je to náš úsudek z dat, ne tvrzení pramene.
  verified: false
  checked: '2026-08-08'

