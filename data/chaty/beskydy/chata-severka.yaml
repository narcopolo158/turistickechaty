interniPoznamky: >-
  Povýšeno z data/kandidati/beskydy/chata-severka.yaml (8. 8. 2026), šestý
  publikovaný profil oblasti Beskydy.

  PROFIL S PŘIZNANOU DÍROU, a to je tu ta nejpodstatnější věc. `rokVzniku`
  je prázdný, protože rok stavby neuvádí žádný pramen — jediné vodítko je
  věta „Ve stejné době byla v místech horní stanice zrušené lanovky
  postavena chata" (ocimaturisty.cz), tedy přelom 70. a 80. let. Bylo by
  snadné z ní udělat „asi 1980" a nikdo by si nevšiml; to je přesně ten
  druh domyšleného čísla, který průvodce nesmí mít. V próze je to napsané
  jako mezera, ne přeskočené.

  KATALOGOVÁ VÝŠKA 957 m SE NENAŠLA NIKDE a je to výjimka z konvence
  „nižší číslo při rozporu" — vědomá. Katalog je AI kompilace vedená jako
  VODICÍ, ne verifikační pramen (PUVOD.md), takže proti třem shodným
  pramenům na 965 m nestojí jako čtvrtý názor, který by konvenci spustil.
  Zapisovat 957 jen proto, že je nižší, by znamenalo dát AI kompilaci
  přednost před obcí, ve které chata stojí. Tohle rozlišení stojí za
  zapamatování: konvence platí mezi PRAMENY, ne mezi pramenem a vodičem.

  OBEC: katalog vede „Dolní Lomná" a prameny to potvrzují (Dolní Lomná 277,
  katastr Dolní Lomná). U Gírové to bylo naopak — tam katalog vedl Písek
  u Jablunkova, prameny Bukovec.

  HŘEBENOVKA TADY DOLOŽENĚ JE, na rozdíl od Kozubové, Gírové a Javorového.
  horydoly.cz vede hlavní beskydský hřeben přes Mosty u Jablunkova, Skalku
  a Kamennou chatu a beskydy.cz uvádí přístup „po červené značce směr
  Skalka, Severka, Kamenná chata". U Severky tedy klíč zařazení stojí na
  roli na trase silněji než u zbytku čtveřice.

  ROZPOR V POČTU VLEKŮ SE NEZAPSAL: ocimaturisty.cz „čtyři lyžařské vleky
  a celková délka sjezdovek je přes dva kilometry", beskydy.cz „3 vleky"
  plus dvousedačková lanová dráha. Do zajímavostí šel proto jen vlek
  Tatrapoma a lanovka z roku 2018, u kterých se prameny neperou.

  TURISTICKÁ ZNÁMKA č. 2047 se objevila jen v titulku cizí stránky, ne
  v katalogu vydavatele — do dat se nezapsala. Kdo bude párovat známky
  (DATA-05), má tu stopu.

  NEDOLOŽENO (nezapsáno): rok stavby a stavebník, jméno dnešního vlastníka
  a provozovatele, kapacita s jistotou (50+ / 52 / 53), otvírací doba,
  kóta vrcholu Kostelka, datace „rozsáhlé rekonstrukce", kterou vlastní web
  zmiňuje bez roků, počet vleků a délka sjezdovek, požáry a přestavby.
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
