# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata na severním svahu Kostelky v Dolní Lomné, na hřebenové trase mezi
  Skalkou a Kamennou chatou. Stojí v místech horní stanice jednosedačkové
  lanovky z roku 1962 — kdo ji ale postavil a kdy, se nám doložit nepodařilo.
text:
  - >-
    Severka leží v 965 metrech na severním svahu vrchu Kostelka, v katastru
    Dolní Lomné, čtyři kilometry od Mostů u Jablunkova. Na výšce se shodují
    tři prameny; katalogových 957 metrů jsme nenašli nikde. Není to chata na
    vrcholu — kótu Kostelky ovšem žádný pramen neuvádí, takže o kolik je
    chata pod ním, nevíme.
  - >-
    U téhle chaty musíme přiznat mezeru, která u ostatních beskydských
    profilů není: nevíme, kdo ji postavil ani kdy. Ski areál na Kostelce
    začal podle jednoho pramene roku 1962 a měl jednosedačkovou lanovku,
    která dojezdila na přelomu sedmdesátých a osmdesátých let; chata podle
    téhož pramene vznikla „ve stejné době" a stojí právě v místech horní
    stanice té zrušené lanovky. Konkrétní rok ani stavebníka ale neuvádí
    žádný pramen, který jsme našli, a tak je tu neuvádíme ani my. Doložené
    je jen to, co přišlo potom: po roce 1989 přešla chata do soukromého
    vlastnictví a v něm zůstala.
  - >-
    Kdo je dnešní vlastník nebo provozovatel, se z pramenů taky nedozvíme —
    vlastní web chaty ani stránky obce jméno neuvádějí. Vlek Tatrapoma, který
    tehdejší lanovku nahradil, funguje dodnes a překonává dvě stě metrů
    převýšení; od roku 2018 v areálu jezdí druhá lanovka, kterou dovezli
    použitou z Itálie.
  - >-
    Chata má dvacet pokojů, přes padesát lůžek a restauraci pro pětapadesát
    hostů; z letní terasy je vidět na Malou Fatru. Kdy je otevřeno,
    neuvádíme: jeden pramen rozlišuje zimní a mimosezónní režim, druhý dává
    jediný čas od osmi do půl sedmé, a to se srovnat nedá.
  - >-
    Pro pěší je Severka bod na hřebenové trase. Červená značka od Mostů
    u Jablunkova jde přes Skalku a Severku ke Kamenné chatě a dál po hranici
    na Muřinkový vrch, Velký a Malý Polom, Bílý Kříž a Bumbálku — hlavní
    beskydský hřeben tedy jde přímo tady. Kdo přichází zdola, mine cestou
    rozcestí Kostelky a vyjde z lesa přímo do lyžařského areálu.
  - >-
    Údaje na téhle stránce nesou vlastní web chaty, stránky obce Dolní
    Lomná, beskydy.cz, ocimaturisty.cz a horydoly.cz; polohu nese
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
