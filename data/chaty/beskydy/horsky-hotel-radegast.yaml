# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1935
overeniHistorie:
  source: >-
    Stavba 1933–1935: treking.cz (čteno 9. 8. 2026) — „Její krásná dřevěná
    stavba zdobí horu Radhošť od roku 1935 (výstavba byla zahájena v roce
    1933)."; shodně kudyznudy.cz („celodřevěnou budovu postavenou v letech
    1933-1935") a hotelypenziony.cz.
    STAVITEL STOJÍ NA JEDINÉM PRAMENI a je to tu přiznané: Seznam Zprávy —
    „Budova hotelu, postavená Františkem Holčákem v letech 1933–1935, je
    typickým příkladem tradiční horské architektury." Architekt nenalezen;
    dobové dokumenty Pohorské jednoty Radhošť (resortpustevny.cz) hotel
    vůbec nezmiňují — jednota u vrcholu koupila roku 1903 útulnu u kaple,
    tedy dnešní Kamennou chatu, což jen potvrzuje, že jde o dva různé
    objekty. Válečné osudy, případné znárodnění a restituce nenalezeny;
    česká Wikipedie byla pro rešerši nedostupná. Provozovatelem je podle
    ceskehory.cz a levneubytovani.net Martin Trčka.
  verified: false
  checked: '2026-08-09'

