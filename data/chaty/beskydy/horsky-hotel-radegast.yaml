zajimavosti:
  - text: >-
      Kousek od hotelu stojí socha pohanského boha Radegasta, kterou roku
      1929 vytvořil v americkém ateliéru frenštátský rodák Albín Polášek;
      dnešní socha je kopie z odolnější žuly od kamenosochaře Jana Sobka.
    kategorie: jine
    zdroj: >-
      kudyznudy.cz (čteno 9. 8. 2026) — „V roce 1929 ji v USA vytvořil
      sochař Albín Polášek, rodák z Frenštátu pod Radhoštěm."; rok osazení
      kopie prameny uvádějí rozdílně (krauzovinacestach.cz: 1998).
  - text: >-
      Podle pověry splní socha přání tomu, kdo se dotkne jejího pupíku.
    kategorie: jine
    zdroj: >-
      novinky.cz (čteno 9. 8. 2026) — „Člověk se musel dotknout jeho pupíku
      a v duchu si to přát."
  - text: >-
      Jeden pramen hotel označuje za nejvýše položenou horskou chatu
      Moravskoslezských Beskyd.
    kategorie: vyska
    zdroj: >-
      astrocesty.eu (čteno 9. 8. 2026) — „je se svou nadmořskou výškou
      1 121 m n. m. nejvýše položenou horskou chatou Moravskoslezských
      Beskyd."
  - text: >-
      Z Pusteven se k hotelu autem nedostanete — zavazadla ubytovaných po
      domluvě sveze hotelový vůz.
    kategorie: jine
    zdroj: >-
      ceskehory.cz (čteno 9. 8. 2026) — „Doprava z Pusteven je možná pouze
      pěší chůzí. Po předem sjednané domluvě je možné odvézt zavazadla
      hotelovým dopravním prostředkem".

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Celodřevěný horský hotel z let 1933 až 1935 na hřebeni těsně pod vrcholem
  Radhoště, u cesty od Pusteven k soše Radegasta. Katalog ho vede postaru
  jako Chatu na Radhošti; jeden pramen ho označuje za nejvýše položenou
  horskou chatu Moravskoslezských Beskyd.
text:
  - >-
    Horský hotel Radegast stojí v 1121 metrech těsně pod vrcholem Radhoště
    (1129 m), na hřebeni, po kterém proudí návštěvníci z Pusteven k soše
    Radegasta a ke kapli svatého Cyrila a Metoděje. Katalog ho vede postaru
    jako Chatu na Radhošti — a je dobré ho neplést s Kamennou chatou, která
    stojí u kaple na samém vrcholu a patřila Pohorské jednotě Radhošť.
  - >-
    Celodřevěnou budovu v tradiční horské architektuře postavil v letech
    1933 až 1935 podle jediného pramene František Holčák. Víc toho o historii
    poctivě nevíme: architekta neuvádí nikdo, válečné osudy ani případné
    znárodnění se dohledat nepodařilo a dobové dokumenty Pohorské jednoty
    hotel nezmiňují — což sedí, protože nebyl její.
  - >-
    Dnes má hotel třináct pokojů s 55 nebo 56 lůžky podle pramene — dvou-
    a třílůžkové s televizí, čtyř- a vícelůžkové s patrovými postelemi,
    sociální zařízení na chodbě. V přízemí je restaurace s asi padesáti
    místy a vedle ní jídelna pro ubytované; že restaurace slouží
    i kolemjdoucím, píšou výletní průvodci („občerstvit se můžete v horském
    hotelu Radegast"), ale výslovnou větu provozovatele nemáme — jeho web
    se nám nepodařilo strojově načíst.
  - >-
    Chodí se sem nejčastěji z Pusteven po modré cyrilometodějské cestě —
    nenáročné čtyři kilometry po hřebeni kolem sochy Radegasta — na Pustevny
    jede z Ráztoky sedačková lanovka. Z Rožnova pod Radhoštěm vede červená
    (asi 7 km s převýšením kolem 800 m), z parkoviště Pindula modrá (5 km).
    Provoz je celoroční.
  - >-
    Socha Radegasta, dnes žulová kopie originálu Albína Poláška z roku 1929,
    stojí na hřebenové cestě kousek od hotelu a podle pověry splní přání
    tomu, kdo se dotkne jejího pupíku.
  - >-
    Údaje nesou treking.cz, ceskehory.cz, kudyznudy.cz, hotelypenziony.cz,
    beskydy.cz, kamsi.cz, seznamzpravy.cz a výletní průvodce; polohu
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
