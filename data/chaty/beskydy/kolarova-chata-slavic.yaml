# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata na hřebeni Slavíče s rodokmenem od Hadaszczokovy útulny z roku 1899.
  Kolářova chata z roku 1931 patřila podle pramenů k nejnavštěvovanějším
  v Beskydech a chodil sem Petr Bezruč; roku 2021 ji zničila dřevomorka
  a dnes tu pod týmž jménem slouží novostavby.
text:
  - >-
    Kolářova chata stojí v 915 metrech na odlesněném místě hlavního hřebene
    Těšínských Beskyd, na rozcestí několika značek nad Morávkou. Tenhle
    profil je potřeba začít po pravdě: historická budova z roku 1931 už
    nestojí — v září 2021 ji majitelé nechali strhnout, protože dřevěné
    konstrukce zničila dřevomorka. Jméno, místo i provoz ale pokračují
    v nových budovách, a tak pokračuje i tahle stránka.
  - >-
    Rodokmen místa začíná roku 1899, kdy se pod Slavíčem otevřela dřevěná
    Hadaszczokova útulna německého spolku Beskidenverein, pojmenovaná po
    jeho zakladateli. Kdy k ní přišel Jan Kolář, se prameny neshodnou —
    před první válkou, od roku 1910, nebo ve dvacátých letech — jisté je,
    že po požáru útulny roku 1930 postavil nedaleko vlastní chatu
    a roku 1931 ji otevřel. Stala se podle pramene jednou
    z nejnavštěvovanějších v celých Beskydech a ve čtyřicátých letech sem
    často chodil Petr Bezruč; jeho podpis nesla kniha návštěv.
  - >-
    V restituci roku 1989 chatu získali zpět Kolářovi potomci a od roku
    1991 ji vedli manželé Martynkovi. Roku 2019 ji koupili noví majitelé,
    postavili vedle novou budovu — a stará chata šla po devadesáti letech
    k zemi. Na jejím místě vyrostla replika, jejíž stavbu provázel spor
    o dodatečné povolení.
  - >-
    Dnes se spí ve dvou budovách: nová chata má sedm pokojů s vlastní
    koupelnou, terasou a televizí, druhá budova pět pokojů od dvoulůžkového
    po desetilůžkový se společným zázemím. Ceny jsou 640, respektive 410
    korun za dospělého; celkový počet lůžek web neuvádí, a tak ho neuvádíme
    ani my. Otevřeno je od středy do neděle; přesné hodiny ani režim
    restaurace se nám z webu nepodařilo načíst — starší údaj „celoroční
    provoz" patřil zdemolované chatě.
  - >-
    Chodí se sem po žluté a červené z Horní Lomné, po zelené z Hrachova
    a po modré z Morávky. Údaje nesou vlastní web chaty, poznejdomy.cz,
    patriotmagazin.cz, polar.cz, blesk.cz, treking.cz a turistika.cz;
    polohu OpenStreetMap. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
