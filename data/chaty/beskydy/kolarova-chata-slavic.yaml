interniPoznamky: >-
  Povýšeno z data/kandidati/beskydy/kolarova-chata-slavic.yaml (9. 8. 2026).

  KAPACITA ZŮSTALA NEVYPLNĚNÁ ZÁMĚRNĚ. První verze profilu se pokusila
  lůžka sečíst ze skladby pokojů a součet nevycházel jednoznačně (web
  nerozlišuje pevná lůžka od přistýlek a desetilůžkový pokoj je „ve dvou
  místnostech") — aritmetika redakce není údaj pramene, a tak číslo
  v datech není a čeká na telefonát DATA-04.

  VNITŘNÍ ROZPOR VLASTNÍHO WEBU („taken to pieces in 1949") proti
  devadesátileté kontinuitě (patriot, polar) je zapsaný v overeniHistorie
  a nerozhodnutý — nejspíš chyba anglického překladu příběhu, ale doklad
  chybí.

  ROZPORY: výška (915 × 908 z titulku); kdy Kolář objekt získal (před 1914
  × od 1910 × 20. léta); křestní jméno majitele (Michal × Martin Cháňa
  v témže zdroji); kontakty starší éry (volny.cz, Martynková) × dnešní
  telefon.

  NEDOLOŽENO: hodiny provozu; režim restaurace pro kolemjdoucí dnes;
  e-mail. Česká Wikipedie i archiv byly nedostupné.
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
