  - rok: 1930
    udalost: >-
      Útulna vyhořela; nájemce Jan Kolář nedaleko ní postavil novou chatu.
    zdroj: >-
      poznejdomy.cz (čteno 9. 8. 2026) — „po jejím vyhoření v roce 1930
      nedaleko ní zřídil novou chatu"; patriotmagazin.cz.
  - rok: 1931
    udalost: >-
      Kolářova chata se otevřela veřejnosti a stala se podle pramene jednou
      z nejnavštěvovanějších v celých Beskydech; ve čtyřicátých letech sem
      často chodil Petr Bezruč.
    zdroj: >-
      poznejdomy.cz (čteno 9. 8. 2026) — „se stala jednou
      z nejnavštěvovanějších v celých Beskydách"; patriotmagazin.cz
      k Bezručovi, turistika.cz k jeho podpisu v knize návštěv.
  - rok: 1989
    udalost: >-
      Chatu v restituci získali zpět potomci Jana Koláře, opravili ji
      a roku 1991 znovu otevřeli veřejnosti; provozu se ujali manželé
      Martynkovi.
    zdroj: >-
      patriotmagazin.cz (čteno 9. 8. 2026); vlastní web — „Thanks to
      restitution in 1989, the descendants of Jan Kolář regained the
      building."
  - rok: 2021
    udalost: >-
      Historická chata z roku 1931 byla od 1. září zdemolována — dřevěné
      konstrukce zničila dřevomorka. Vedle už od roku 2019 stála nová
      budova nových majitelů a na místě staré chaty vyrostla replika.
    zdroj: >-
      patriotmagazin.cz a polar.cz (čteno 9. 8. 2026) — „Po 90 letech byla
      stržena, když se její technický stav vyhrotil natolik, že už ji
      nebylo možné zachránit."; blesk.cz — „Původní stavbu totiž doslova
      sežrala dřevomorka."

