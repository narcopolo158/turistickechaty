# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1931
overeniHistorie:
  source: >-
    ROK 1931 JE ROKEM VZNIKU KOLÁŘOVY CHATY — předchůdkyně i dnešní
    novostavby jsou v milnících. poznejdomy.cz (čteno 9. 8. 2026): „V roce
    1899 došlo pod Slavíčem k otevření dřevěné Hadaszczokovy útulny",
    „která dostala jméno po zakladateli německého turistického spolku
    Beskidenverein Johannu Hadaszczokovi". Útulna vyhořela roku 1930
    a Jan Kolář „nedaleko ní zřídil novou chatu. K otevření nové chaty
    došlo už v roce 1931" (poznejdomy.cz; patriotmagazin.cz shodně:
    „Dřevěná chata vznikla v roce 1930 na místě vyhořelé útulny z roku
    1899.", „Veřejnosti se otevřela v roce 1931.").
    KDY KOLÁŘ K ÚTULNĚ PŘIŠEL, SE PRAMENY ROZCHÁZEJÍ: poznejdomy.cz „Ve
    20. letech 20. století si útulnu pronajal", patriotmagazin.cz „od 1910
    ji provozoval", turistika.cz „Před začátkem 1. světové války koupil".
    VNITŘNÍ ROZPOR VLASTNÍHO WEBU, nezavřený: anglická stránka příběhu
    uvádí, že chata za války zpustla a „had to be taken to pieces in 1949"
    — to se neslučuje s devadesátiletou kontinuitou budovy, kterou popisují
    patriotmagazin.cz i polar.cz při demolici 2021 („Po 90 letech byla
    stržena"). Nerozhodnuto; nejspíš se věta týká části stavby nebo je to
    chyba překladu, ale doloženo to není.
    Restituce: „Thanks to restitution in 1989, the descendants of Jan
    Kolář regained the building." (vlastní web), znovuotevření 1991; od
    1991 chatu vedli manželé Martynkovi (patriotmagazin.cz). Prodej novým
    majitelům 2019; DEMOLICE PŮVODNÍ CHATY ZAČALA 1. ZÁŘÍ 2021 kvůli stavu
    dřevěných konstrukcí — blesk.cz: „Původní stavbu totiž doslova sežrala
    dřevomorka." Vedle už stála nová budova (2019) a majitel Michal Cháňa
    stavěl repliku (blesk.cz 2023; patriotmagazin.cz kolísá mezi „Michal"
    a „Martin" — rozpor pramene).
  verified: false
  checked: '2026-08-09'

