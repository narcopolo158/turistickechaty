interniPoznamky: >-
  Povýšeno z data/kandidati/beskydy/chata-prasiva.yaml (8. 8. 2026). PRVNÍ
  publikovaný profil oblasti Beskydy.

  ROZHODNUTÍ, KTERÉ TENHLE PROFIL NESE: chata a rozhledna jsou JEDEN objekt,
  jeden profil. Otázka byla v deníku vedená jako otevřená („chata pět metrů
  od rozhledny — precedens pro celé Beskydy") a rozhodla se doklady, ne
  odhadem. Rozhledna je věžová NÁSTAVBA STŘECHY téže budovy (obec Vyšní
  Lhoty: „přímo součástí chaty"; propamatky.cz: „věžovitá nástavba chaty";
  atlasceska.cz: „vysokou střešní nástavbou s krytým vyhlídkovým ochozem"),
  vstup vede přes chatu (turistika.cz) a vznikly společně roku 1921. Těch
  pět metrů v OpenStreetMap je odstup dvou POI uzlů na jedné budově, ne dvou
  staveb — a je to dobré si zapamatovat, protože metrická vzdálenost sama
  o sloučení nerozhoduje. Kandidát `prasiva` (typ rozhledna, OSM node
  3064424393) je proto zapsaný v `_vyrazeno.yaml` s důvodem „sloučeno do
  tohoto profilu" — vzor Kleti a Pancíře na Šumavě.

  ROZDÍL PROTI PŘÍPADU, KTERÝ SE SLOUČIT NEMÁ: tady je věž ČÁSTÍ budovy.
  Kdyby stála samostatně a jen ji provozoval týž člověk, byla by to jiná
  úvaha — u Kleti rozhodl společný provozovatel, tady rozhoduje sama
  stavba. Až přijde na řadu Žalý nebo tři zápisy na Čertovici, tohle je
  ta rozlišovací otázka: jedna budova, nebo dvě?

  MALÁ PRAŠIVÁ (706 m) × PRAŠIVÁ (843 m) — DVA KOPCE, NE ROZPOR PRAMENŮ.
  Chata je na výběžku, ne na vrcholu. Pět pramenů se na 706 m shoduje;
  turistika.cz uvádí u rozhledny 843 m, což je výška VRCHOLU připsaná
  chatě. Konvence „nižší číslo při rozporu" se sem nevztahuje, protože to
  není rozpor — je to jiné místo (vzor Vsackého Cábu v Javorníkách).
  Označení „Velká Prašivá" se nepodařilo doložit; prameny píší jen
  „Prašivá", a tak se tu tak píše taky.

  MOJE CHYBA V ZADÁNÍ REŠERŠE, chycená rešeršistou: ptal jsem se, jestli
  chatu postavila Pohorská jednota Radhošť. Nepostavila — v žádném prameni
  o Prašivé nevystupuje. Je to týž druh omylu jako přepsaná délka
  u Menauerů: domněnka v zadání se propíše do dat, když ji nikdo nechytí.
  Doložení stavebníka je navíc samo rozporné (Pobeskydská jednota slezská ×
  Klub československých turistů, oba u propamatky.cz), takže se do dat
  nezapisuje vůbec.

  SUPERLATIV ZAPSÁN NEBYL, ač se nabízel. turistika.cz i startovac.cz píší
  „nejstarší česká horská chata v Beskydech" — pozor na to slovo „česká":
  není to tvrzení o nejstarší chatě v Beskydech vůbec (Beskidenverein
  postavil chaty na Javorovém a Lysé hoře už 1895). Do prózy se to proto
  nedostalo ani v podobě s přívlastkem; kdyby se doplňovalo, musí být
  citované celé včetně „česká", jinak je to nepravda.

  VSTUPNÉ NA ROZHLEDNU (30/20 Kč) SE NEZAPISUJE — jediný pramen je
  uživatelský příspěvek z doby okolo 2016 a ceny se do profilů nepíšou.
  Stejně tak není jasný dnešní režim přístupu na věž: čtyři prameny dávají
  čtyři odpovědi (uzavřená / s průvodcem / pátek a víkend / na rezervaci).
  Do prózy to šlo jako přiznaná nejistota, do dat ne.

