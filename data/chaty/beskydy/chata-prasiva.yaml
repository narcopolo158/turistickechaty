# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1921
overeniHistorie:
  source: >-
    atlasceska.cz (načteno 8. 8. 2026): „Slavnostní otevření dřevěné chaty
    s rozhlednou proběhlo za velkého zájmu veřejnosti 2. října 1921."
    Rok potvrzuje i vlastní web chaty, který se představuje „Chata Prašivá
    od r. 1921", a turistika.cz („Turistická chata Klubu českých turistů
    s rozhlednou z roku 1921"). Pozemek pod chatou byl získán už roku 1899
    (atlasceska.cz). ROZPOR O STAVEBNÍKA, nesrovnaný: propamatky.cz vedou
    v jednom článku „partu nadšenců a dobrovolníků z Pobeskydské jednoty
    slezské", v druhém článku TÝŽ portál píše o objektu „postaveném díky
    úsilí Klubu československých turistů"; atlasceska.cz drží Pobeskydskou
    jednotu slezskou. Do dat se proto stavebník nezapisuje jako fakt
    a v próze se přiznává, že se prameny neshodly. Architektem byl dle
    atlasceska.cz „místecký architekt Čermák", iniciátorem stavby dle Kudy
    z nudy Jan Valečka, po němž je pojmenován Valečkův sál.
  verified: false
  checked: '2026-08-08'

