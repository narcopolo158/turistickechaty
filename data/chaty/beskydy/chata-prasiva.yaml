# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěná chata z roku 1921 na Malé Prašivé, s rozhlednou zabudovanou do
  vlastní střechy a dřevěným kostelem z roku 1640 na louce před ní. Patří
  Klubu českých turistů a po pěti letech dobrovolnické obnovy je znovu
  celoročně otevřená.
text:
  - >-
    Chata Prašivá stojí ve 706 metrech na severozápadním výběžku Prašivé,
    kterému se říká Malá Prašivá. Vlastní vrchol Prašivá (843 m) je asi
    kilometr dál a vede k němu od chaty červená značka — na tuhle záměnu
    je dobré si dát pozor, protože některé turistické portály připisují
    chatě výšku vrcholu.
  - >-
    Rozhledna je tu udělaná neobvykle. Není to samostatná věž u domu, ale
    věžová nástavba jeho střechy s krytým
    vyhlídkovým ochozem, a nahoru se chodí zevnitř chaty. Obec Vyšní Lhoty
    to říká krátce: rozhledna je přímo součástí chaty. V databázích
    turistických cílů proto bývá vedená dvakrát — jako chata a jako
    rozhledna — ačkoli je to jedna budova z jednoho roku.
  - >-
    Otevřela se 2. října 1921. Kdo přesně ji postavil, se z pramenů nedá
    říct s klidným svědomím: jeden článek mluví o dobrovolnících
    z Pobeskydské jednoty slezské, druhý článek téhož serveru o Klubu
    československých turistů. Shodné jsou naopak dvě jiné věci — pozemek
    byl získán už roku 1899 a iniciátorem stavby byl Jan Valečka, po němž
    se dnes jmenuje sál v chatě. A jedna doložená drobnost, která o té
    době vypovídá dost: na stavbu přispěl ze svých soukromých peněz
    prezident Masaryk.
  - >-
    Dnes chata patří Klubu českých turistů, odboru Beskydy, a provozují ji
    nájemci Martin a Renáta Stillerovi. Mezi roky 2015 a 2020 prošla
    obnovou, do které se podle nájemce vešlo víc než tři miliony korun
    a patnáct tisíc hodin dobrovolnické práce — vyměnila se okna
    a střecha, opravila kuchyň a obnovila právě ta věžička s rozhlednou.
  - >-
    Na louce před chatou stojí dřevěný kostel z roku 1640, chráněná
    památka. Postavil ho Jiří, hrabě z Oppersdorfu, původně jako kostel
    svatého Ignáce z Loyoly; na svatého Antonína Paduánského byl
    přesvěcen roku 1673. K svátku svatého Antonína se sem váže lidová
    tradice o dívkách, které k němu na třináctého června dojdou bosé.
  - >-
    Chodí se sem od Vyšních Lhot po žluté nebo od Pražma po modré, jsou tu
    i další nástupy — Raškovice, Dobratice, Komorní Lhotka, Morávka —
    a naučná stezka. Délky přístupů se v pramenech rozcházejí (z Pražma
    šest kilometrů podle jednoho, deset podle druhého), takže je tu
    neuvádíme; přesné trasy doplní pipeline z výškových profilů. Chata je
    jedním ze čtyř kontrolních bodů projektu Přechod Beskyd vedle
    Kamenitého, Skalky a Gírové.
  - >-
    Kdy je otevřeno a jestli je rozhledna právě přístupná, poctivě nevíme.
    Provoz je celoroční, ale rozvrhy tří pramenů se neshodují a u přístupu
    na rozhlednu jde rozpor ještě dál: jeden portál ji vede jako
    veřejnosti uzavřenou, druhý jako přístupnou s průvodcem, třetí jako
    otevřenou v pátek a o víkendech, čtvrtý jen na rezervaci. Vlastní web
    chaty se nám nepodařilo otevřít dál než na úvodní stránku. Než to
    potvrdí telefonát, radši žádný rozvrh než špatný.
  - >-
    Údaje na téhle stránce nesou stránky Klubu českých turistů, obce Vyšní
    Lhoty, portály propamatky.cz, atlasceska.cz, Kudy z nudy, treking.cz
    a ceskehory.cz; polohu nese OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
