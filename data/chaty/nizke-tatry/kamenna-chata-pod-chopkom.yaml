    denní hosté jsou její denní chléb. Telefonát to rozhodne (DATA-04).
    hiking.sk (2002) jmenoval specialitu „Buchta Chopok — takmer na celý
    tanier veľká parená buchta poliata vanilkovým pudingom" a čaj
    z horských bylin.
