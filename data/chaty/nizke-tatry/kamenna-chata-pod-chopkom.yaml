    Vlastní web chaty (čteno 9. 8. 2026): jídelní část a „rýchla zóna
    s barom"; „LEPŠIE TU CHUTÍ AJ TRADIČNÁ KAMIENKOVSKÁ KAPUSTOVÁ".
    Výslovná věta „obsluhujeme aj neubytovaných" se nenašla; nepřímo web
    píše, že bar a rychlá zóna slouží turistům, hřebenovkářům a sportovcům
