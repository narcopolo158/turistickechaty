# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná útulna z roku 1950, postavená pro dělníky stavějící lanovky na
  Chopok, ze které „partia nadšencov" udělala v roce 1996 celoročně
  obsluhovanou chatu — podle provozovatele třetí nejvýše položenou na
  Slovensku. Dvacet lůžek, zákaz vlastních spacáků, kapustnica —
  a programově žádná wi-fi.
text:
  - >-
    Kamienka, jak jí říkají sami chatári, stojí v 1985 metrech na jižním
    svahu těsně pod vrcholem Chopku, třetí nejvyšší hory Nízkých Tater.
    Starší prameny z doby kolem roku 2002 uvádějí 2000 metrů, ale tři
    novější včetně provozovatele se shodují na 1985 — a tak tu stojí
    nižší, střízlivější číslo. Výš už jsou na Slovensku jen dvě
    obsluhované chaty, píše provozovatel i visitliptov.sk.
  - >-
    Vznik má chata prozaický: v letech 1949–1950 ji postavili jako útulnu
    pro dělníky, kteří stavěli lanovky Luková–Chopok a Srdiečko–Kosodrevina.
    Turistickou chatou v pravém smyslu se stala až 7. května 1996, kdy se
    jí ujala — vlastními slovy — „partia nadšencov" kolem chatára Marcela
    Melicherčíka a chatárky Anky Pažitné; dnes má tým kolem pětadvaceti
    lidí včetně brigádníků. První velké rekonstrukce proběhly v letech
    2003–2007, od roku 2016 se chata přestavovala podle projektu architekta
    Emila Križa.
  - >-
    Spí se tu v pěti místnostech se jmény kavak, švišť, špic, sever a juh,
    dohromady dvacet lůžek za 46 eur se snídaní. Pravidla jsou nezvykle
    přesná: rezervací se objednává lůžko s polštářem, přikrývkou a dekou,
    vlastní spacák je zakázaný a postel si host vybírá online přímo na
    půdorysu noclehárny. Příchod od čtvrté odpoledne, v zimě nejpozději do
    pěti — kdo jde na Chopok za tmy, ať to ví předem.
  - >-
    Kuchyně stojí na tradiční kamienkovské kapustnici; vedle jídelní části
    je „rýchla zóna s barom" pro turisty, hřebenovkáře a sportovce, kteří
    jen procházejí. Voda je tu vzácná — u chaty není pramen, sprcha je na
    žeton. A wi-fi tu nehledejte, je to programové: „WiFi tu nemáme.
    Na znak ľudskosti a priateľstva si tu tykáme."
  - >-
    Cesta nahoru je na vysokohorskou chatu nezvykle pohodlná: na vrchol
    Chopku jezdí lanovky z Jasné od severu i ze Srdiečka od jihu
    a od horní stanice se k chatě schází pár minut po jižním svahu. Pěšky vede od
    Mikulášské chaty v Jasné modrá značka — 5,8 kilometru a 875 výškových
    metrů, necelé tři hodiny (visitliptov.sk). Po červené hřebenovce E8 je
    to přes Chopok dál na Ďumbier a k Štefáničce.
  - >-
    Kamienka je i závodiště: 20. října 2007 tu kamienkári poprvé
    uspořádali Šerpa rallye, závod vysokohorských nosičů, jehož historie
    se podle krasy-slovenska.sk začala psát už 12. října 1985. Zásobuje se
    sněžným skútrem a — jak jinak pod Chopkom — nosiči.
  - >-
    Údaje nesou vlastní web chaty, hiking.sk, krasy-slovenska.sk,
    visitliptov.sk a kjg.sk; polohu OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
