# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1950
overeniHistorie:
  source: >-
    Vlastní web chaty (čteno 9. 8. 2026): postavena v letech 1949–1950 jako
    „útulňa pre robotníkov, čo stavali lanovky"; shodně krasy-slovenska.sk
    („Tesne pod vrcholom Chopka postavili v rokoch 1949 – 1950",
    v souvislosti se stavbou lanovek Luková–Chopok a Srdiečko–Kosodrevina).
    Zapsán pozdější rok dvouletí (konvence opatrné volby). Kdo přesně
    stavěl (firma/organizace), se najít nepodařilo. Vysokohorskou chatou
    pro turisty se stala až v roce 1996: „sa objavujeme my, partia
    nadšencov a vytvárame z Kamienky novú vysokohorskú chatu" (vlastní
    web). Rekonstrukce: první velké 2003–2006 (vlastní web), hiking.sk
    uvádí generální přestavbu 2006–2007; od roku 2016 „výrazná stavebná
    rekonštrukcia podľa projektu Ing. arch. Emila Križa" (vlastní web),
    visitliptov.sk shrnuje „renovated in 2017"; střechu dělala firma
    PAMASTAV s.r.o., krytina Tata Steel Colorcoat Prisma (kjg.sk).
  verified: false
  checked: '2026-08-09'

