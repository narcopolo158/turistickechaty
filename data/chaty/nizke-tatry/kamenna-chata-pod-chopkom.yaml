interniPoznamky: >-
  Povýšeno z data/kandidati/nizke-tatry/kamenna-chata-pod-chopkom.yaml
  (9. 8. 2026).

  TELEFON: OSM kandidát nesl starou pevnou linku +421 48 6170039 (tutéž
  uváděl hiking.sk 2002); vlastní web má mobil 0903 995 039 — zapsán
  v mezinárodním tvaru. VÝŠKA: kandidát nesl 2000 m z OSM `ele`; zapsáno
  1985 m dle shody provozovatele, visitliptov a krasy-slovenska (OSM `ele`
  není konkurenční textové tvrzení — KONTROLA-11).

  KAPACITA: čtyři různé údaje (20 × 22 × 12 × 15) — zapsán aktuální ceník
  provozovatele; stejné pravidlo jako u Zamkovského chaty (zastaralost
  pramene po doložené rekonstrukci není rozpor pramenů o téže věci).

  VLASTNÍK BUDOVY NENALEZEN — web neuvádí IČO ani firmu; „partia" je
  provozovatel, ne nutně vlastník. Případný telefonát (DATA-04) může
  doplnit. NENALEZENO dále: stavitel z roku 1949; jakýkoli požár; přesný
  čas chůze od horní stanice lanovky; časy tras z jihu (Trangoška/
  Kosodrevina); rekordy Šerpa rallye. Vztah k lanovkám: web zmiňuje, že
  spojení s lanovkami bylo 15 let přerušené a obnovené 2012 — do textu
  nedáno, protože přesný smysl věty (které úseky, proč) se z pramene
  nepodařilo vyčíst spolehlivě.

  FOTKA: přiřazena z kandidátů FOTO-04 (identifikace budovy prohlídkou
  snímku redakcí, záběr 2012 — před rekonstrukcí 2016+; kdyby Michal chtěl
  novější podobu, dodá ji druhý běh DATA-02). Výškový profil přístupu
  DATA-06, lanovky oblasti DATA-32 (kliky v docs/KLIKY-PRO-MICHALA.md).
