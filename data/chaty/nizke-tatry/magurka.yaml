# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata v bývalé zlatokopecké osadě na severní straně hřebene, která
  vyrostla z domu báňské správy a v seznamu KČST z roku 1938 nesla jméno
  Úfnosť — naděje. Po letech úpadku ožila rekonstrukcí v roce 2009; dnes
  má 46 lůžek, celoroční provoz a kuchyni bez polotovarů.
text:
  - >-
    Magurka je zvláštní místo: bývalá zlatokopecká osada v závěru
    Ľupčianské doliny, kde se kutalo od roku 1250 a kde produkce
    vrcholila těsně před první světovou válkou pětadvaceti kilogramy
    zlata ročně. Pak přišel rok 1923, náklady převýšily výnosy, šachty
    Kilián, Russeger a Ritterstein zmlkly — a v roce 1928 tu zbývalo
    dvacet domů a pětasedmdesát obyvatel. Chata stojí v tisíci padesáti
    metrech pod Latiborskou hoľou, na severní straně hlavního hřebene.
  - >-
    Z domu báňské správy se někdy poté stalo turistické útočiště:
    v seznamu KČST z roku 1938 figuruje jako Chata Úfnosť na Magurke
    a patřila ružomberskému odboru klubu. Úfnosť znamená naděje — jméno,
    které vyhasínající hornické osadě sedlo. Po roce 1989 chata upadala
    a zavřela; naději jí vrátil až nový majitel v roce 2008
    a rekonstrukce, po které začátkem roku 2009 přivítala první hosty.
    Od roku 2017 ji vlastní a provozuje společnost Ritterstein —
    pojmenovaná po jedné z místních šachet.
  - >-
    Dnes je to celoročně obsluhovaná chata s šestačtyřiceti lůžky
    (včetně jedenácti přistýlek), všechny pokoje mají vlastní sociální
    zařízení. Spí se za 33 až 35 eur se snídaní podle sezóny, rezervace
    chce zálohu v plné výši. Restaurace o šedesáti místech a dvou
    terasách obsluhuje ubytované i procházející — otevřeno je denně,
    o víkendu od osmi rána do deseti večer — a kuchyně si zakládá na
    tom, že nic nedělá z polotovarů. K tomu finská sudová sauna,
    vířivka a půjčovna e-biků.
  - >-
    Pěšky se sem jde Ľupčianskou dolinou z Partizánské Ľupče (po modré
    přes Tajch), ze Železného, nebo z Liptovské Lúžné přes sedlo
    Prievalec po zelené. Kdo přechází hřeben po červené Cestě hrdinov
    SNP, může do Magurky sejít ze sedel Latiborské a Zámostské hole —
    ze sedla Ďurková je to po zelené dolů hodina a čtvrt; Latiborská
    hoľa i Chabenec jsou od chaty tři kilometry. Autem se jezdí
    z Partizánské Ľupče nebo přes Liptovskou Lúžnu; v zimě provozovatel
    doporučuje řetězy.
  - >-
    Údaje nesou vlastní web chaty, hiking.sk, treking.cz,
    cestounecestou.sk a nizketatry.sk; polohu OpenStreetMap. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
