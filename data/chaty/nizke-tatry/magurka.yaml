interniPoznamky: >-
  Povýšeno z data/kandidati/nizke-tatry/magurka.yaml (9. 8. 2026);
  katalogový objekt HUT-0149.

  ZÁMĚNY: v osadě je víc ubytovacích objektů (Chata Mont Magurka —
  megaubytovanie; Chata pod javormi — hauzi; agregátor nabízí „8
  možností"); web magurka.sk byl při rešerši nedostupný (timeout)
  a NENÍ jisté, co prezentuje — profil stojí na magurka-liptov.sk,
  jehož adresa, GPS i telefon sedí s OSM way/234323491. Jmenovkyně
  mimo oblast: Chata Magurka Vitanová–Oravice a Malá Lučivná–Párnica
  — jiné objekty; kdyby přišly exportem, patří do registru jmenovců.

  ROK VZNIKU vědomě nevyplněn: doložen je rok 1938 (seznam KČST), ne
  rok přeměny domu báňské správy na chatu. KAPACITA 46 = aktuální údaj
  provozovatele; 50 (12/2024), 52 (2009), 36 (treking) jsou starší.

  Chatářem byl v roce 2009 Pavol Farkaš (hiking.sk) — nezapsáno do
  milníků, dnešní personál neznáme. Fotku dodá druhý běh DATA-02,
  výškový profil DATA-06.
