# ── Historie ──────────────────────────────────────────────────────────────
overeniHistorie:
  source: >-
    Vlastní web chaty, stránka historie (čteno 9. 8. 2026): zlato se
    v Magurce těžilo od roku 1250, vrchol produkce před první světovou
    válkou (25 kg zlata ročně); antimon objeven 1888; šachty Kilián
    (3 000 m), Russeger (1 600 m) a Ritterstein (1 400 m); těžba
    skončila 1923, protože náklady převýšily výnosy; roku 1928 měla
    osada jen dvacet domů a asi 75 obyvatel. CHATA: z domu báňské
    správy se stalo turistické útočiště „Chata Úfnosť na Magurke" —
    v seznamu KČST figuruje roku 1938 a patřila OKČST Ružomberok
    (hiking.sk, shodně vlastní web; úfnosť znamená naděje). Přesný rok
    přeměny domu na chatu prameny neuvádějí, a tak pole rokVzniku
    zůstává prázdné. Po roce 1989 úpadek a uzavření; roku 2008 přišel
    nový majitel a začátkem roku 2009 chata po rozsáhlé rekonstrukci
    přivítala první návštěvníky (hiking.sk 21. 8. 2009, shodně vlastní
    web). Roku 2017 se změnil majitel (treking.cz, vlastní web).
  verified: false
  checked: '2026-08-09'

