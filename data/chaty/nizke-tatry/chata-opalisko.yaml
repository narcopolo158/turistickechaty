interniPoznamky: >-
  Povýšeno z data/kandidati/nizke-tatry/chata-opalisko.yaml rešerší
  (10. 8. 2026) — druhá položka fronty „NT Liptov + Opalisko" z 9. 8.
  Klíč zařazení: obsluhovaná chata s restaurací na nástupu na
  Poludnicu a u vleků Ski Opalisko — role na trase; typ obsluhovana
  dle služby, ne dle OSM tagu guest_house.

  K OVĚŘENÍ (DATA-04): vlastní web (nenačetl se) — režim restaurace
  pro neubytované (OSM vede otvírací dobu 9–19, což naznačuje veřejný
  provoz, ale doklad to není), nadmořská výška, sezónnost, historie
  chaty. Fotku dodá příští běh DATA-02.

  HOTEL LIPTOV (první položka téže fronty) zůstává kandidátem —
  rešerše 10. 8.: 53 pokojů / 191 lůžek u Vrbického plesa v jádru
  Jasné (domalenka.sk), strava popsána jen jako snídaně/polopenze
  pro hosty, občerstvení pro veřejnost NEDOLOŽENO → třída jizerské
  Barbory, čeká na doklad nebo Michalův vzor; zapsáno i u kandidáta.
