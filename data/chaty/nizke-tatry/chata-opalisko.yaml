# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata s bungalovy na kraji lesa nad Závažnou Porubou, sto osmdesát
  metrů od vleků střediska Ski Opalisko a přímo pod Poludnicou —
  46 lůžek, restaurace a nástup na vyhlídkovou Poludnicu nad
  liptovskou stranou Nízkých Tater.
text:
  - >-
    Opalisko je základna dvou tváří: v zimě lyžařská — sjezdovka
    střediska Ski Opalisko začíná pár desítek metrů od dveří —
    a po zbytek roku turistická, protože ze Závažné Poruby se právě
    tudy nastupuje na Poludnicu, vyhlídkový vrchol nad Liptovským
    Mikulášem.
  - >-
    Spí se v chatě ve troj- a čtyřlůžkových pokojích a ve dvou
    bungalovech, dohromady pro šestačtyřicet hostů; v objektu je
    restaurace, bungalov má vlastní vybavenou kuchyň. Do Liptovského
    Mikuláše je to šest kilometrů, obchod je půl kilometru pod
    chatou — civilizace tedy na dosah, les hned za domem.
  - >-
    Údaje na téhle stránce pocházejí z obecního webu Závažné Poruby
    a z ubytovacích katalogů; polohu a kontakty nese OpenStreetMap.
    Vlastní stránky chaty se při rešerši nenačetly. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
