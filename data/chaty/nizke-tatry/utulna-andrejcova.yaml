# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1968
overeniHistorie:
  source: >-
    treking.cz (čteno 9. 8. 2026): „Srubová stavba pochází z roku 1968";
    shodně vernar.net (11/2024): „Postavená v roku 1968", původně sloužila
    jako „ochrana turistov aj salaš pre miestnych pastierov". MÍRNÝ
    ROZPOR, přiznaný: hiking.sk v článku z prosince 2005 psal, že útulňa
    do té doby „existovala približne 40 rokov" (což by ukazovalo spíš
    k roku ~1965) — zapsán letopočet, který nesou dva prameny výslovně.
    REKONSTRUKCE 2004/2005: provedli SZOPK Nízke Tatry ve spolupráci se
    správou národního parku, financováno z SMS sbírky společnosti Orange
    po vichřici v listopadu 2004 přes Nadáciu Ekopolis (program Obnovme
    Tatry) — nová šindelová střecha, vstupní místnost s dřevárnou,
    rozšíření z jednoho na tři obytné prostory, dvojlatrína, nová okna
    a dveře (hiking.sk 12/2005). Od roku 2014 má útulňa stálého hospodáře
    (hiking.sk 7/2014). Stavba nové útulně byla v prosinci 2020 tématem
    podcastu hiking.sk („ako sa plánuje stavba novej útulne") — doklad
    o realizaci novostavby se ale nenašel; prameny z let 2024–2025
    popisují stále původní přestavěný srub.
  verified: false
  checked: '2026-08-09'

