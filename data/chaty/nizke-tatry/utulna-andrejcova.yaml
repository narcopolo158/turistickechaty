# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Srub z roku 1968 na červené hřebenovce Kráľovohoľských Tater, ze kterého
  parta kolem OZ Horské spoločenstvo udělala obsluhovanou útulňu s 25
  lůžky, veganskou večeří a vlastním pivem Tetrov. V létě chatár denně,
  v zimě otevřená útulňa s pokladničkou — rezervace noclehu je povinná.
text:
  - >-
    Andrejcová stojí kousek od rozcestí v sedle pod stejnojmenným vrchem,
    asi osmdesát až sto metrů od červené hřebenovky Cesty hrdinov SNP,
    v úseku mezi Čertovicou a Kráľovou hoľou. Slovenské prameny včetně
    rozhovoru s provozovatelem se shodují na 1410 metrech; dva české weby
    uvádějí 1420 — i tenhle drobný rozdíl tu stojí přiznaný. Výhled odsud
    sahá na Vysoké Tatry.
  - >-
    Srub tu vyrostl roku 1968 a sloužil dvojímu pánu: turistům jako
    ochrana před nepohodou a místním pastýřům jako salaš. Zásadní obnovu
    přinesl rok 2005 — provedli ji ochránci přírody ze SZOPK Nízke Tatry
    spolu se správou národního parku a zaplatila se z SMS sbírky, kterou
    po ničivé vichřici z listopadu 2004 uspořádala společnost Orange:
    nová šindelová střecha, vstupní místnost s dřevárnou a rozšíření
    z jednoho na tři obytné prostory. Roku 2014 útulňa dostala stálého
    hospodáře a od roku 2020 ji vede občanské sdružení Horské spoločenstvo
    z Brezna v čele s Markem Šurinou — parta, která přidala fotovoltaiku,
    veganské večeře i vlastní řemeslné pivo Tetrov a provozuje také Domček
    HS na Čertovici.
  - >-
    Nocleh je na útulňu nezvykle organizovaný: rezervace je povinná
    (potvrzení do 48 hodin, platí se hotově na místě), spí se ve vlastním
    spacáku na matracích — deset míst na půdě, patnáct ve společenské
    místnosti, dohromady pětadvacet lůžek za 10 eur na osobu a noc. Kdo
    přijde se stanem, zaplatí 7 eur při dvou a více osobách; louka u útulně
    je oficiálním stanovým místem národního parku. A podle horydoly.cz tu
    platí nepsané hřebenové pravidlo: přespat nejvýše dvě noci a jít dál.
  - >-
    Léto a zima jsou tu dva různé režimy. Od května do října je chatár na
    místě denně, vaří snídaně a večeře a čepuje; od listopadu bývá provoz
    s obsluhou jen o víkendech a svátcích. Ubytovací část ale zůstává
    otevřená pořád — v zimě si příchozí může zatopit, přespat ve spacáku
    a zaplatit do pokladničky nebo převodem. Voda je z pramene Zimná voda
    pár desítek metrů od útulně; prameny se přou, jestli deset, dvacet
    nebo osmdesát metrů, shodují se ale, že teče spolehlivě.
  - >-
    Přístupy: po červené hřebenovce od sedla Priehybka za hodinu a deset
    minut (turisticky.sk uvádí od Priehyby dvě a půl hodiny — časy se tu
    liší podle toho, odkud přesně se měří), od Ždiarskeho sedla za tři
    čtvrtě hodiny, z Kráľovy hole za tři hodiny. Z obcí: z Pohorelé po
    modré za dvě a půl až tři hodiny, z Liptovské Tepličky po modré za tři
    a půl. Kdo pokračuje po hřebeni na západ, má to k útulně Ramža 20,5
    kilometru — necelých sedm hodin.
  - >-
    Údaje nesou vlastní web útulně, hiking.sk a jeho magazín Stíhačka,
    turisticky.sk, nizketatry.sk, treking.cz, cestasnp.sk, vernar.net
    a horydoly.cz; polohu OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
