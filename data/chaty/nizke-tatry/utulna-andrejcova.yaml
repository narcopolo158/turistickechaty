overeniNocleh:
  source: >-
    Vlastní web útulně (andrejcova.sk, čteno 9. 8. 2026): 25 lůžek ve dvou
    společných místnostech, „Ubytovanie 10 € / osoba / noc"; cestasnp.sk
    (aktualizace 29. 8. 2024): „25 osôb na matraci vo vlastnom spacáku
    (10 osôb povala, 15 osôb spoločenská miestnosť)" + 5 na zemi v nouzi.
    REZERVACE POVINNÁ — potvrzení do 48 h, platba hotově na místě, skupiny
    nad 10 osob se 100% zálohou, noční klid od 22:00 (vlastní web);
    provozovatel v květnu 2025: „Nocľah si vo vlastnom záujme zarezervujte
    dostatočne dopredu." Stan u útulně: 7 € za osobu při dvou a více
    osobách, oficiální stanové místo národního parku (hiking.sk 5/2025,
    vlastní web). V zimě bez chatáře: „turisti si môžu v chate zakúriť
    a prenocovať vo vlastnom spacáku", platí se do pokladničky nebo
    převodem (hiking.sk 11/2024). ROZPOR STARŠÍCH PRAMENŮ, přiznaný:
    hiking.sk 2004 a nizketatry.sk uvádějí přibližně 30 míst — zapsán
    aktuální údaj provozovatele (vzor Zamkovského chaty: zastaralost
    pramene není rozpor). Horydoly.cz (2021): přespat lze nejvýše dvě noci.
  verified: false
  checked: '2026-08-09'

