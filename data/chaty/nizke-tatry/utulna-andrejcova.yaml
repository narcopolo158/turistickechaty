interniPoznamky: >-
  Povýšeno z data/kandidati/nizke-tatry/utulna-andrejcova.yaml
  (9. 8. 2026); katalogový objekt HUT-0153 (katalog vede obec Pohorelá,
  profil zapisuje Liptovskou Tepličku dle adresy provozu na vlastním webu).

  TYP: obsluhovana navzdory jménu Útulňa — v sezóně denní chatár, kuchyně,
  ceník a povinná rezervace (táž volba jako u Ďurkové; v zimě funguje
  režimem otevřené útulně a próza to říká).

  KAPACITA 25 = aktuální údaj provozovatele; starší prameny ~30 (2004,
  nizketatry, horydoly 2021) — zastaralost pramene, ne rozpor (vzor
  Zamkovského chaty). VÝŠKA 1410 × 1420 — zapsána převažující hodnota
  slovenských pramenů.

  ROK VZNIKU 1968 (treking, vernar výslovně) × „približne 40 rokov" před
  2005 (hiking) — přiznáno. Rok převzetí provozu OZ Horské spoločenstvo
  není doložen přesně; 2020 je rok doložených zmínek (Stíhačka, podcast)
  a milník to říká.

  NOVOSTAVBA: plán stavby nové útulně doložen jen anotací podcastu
  (12/2020); realizace NENALEZENA — prameny 2024–25 popisují pořád
  původní srub. Hlídat; kdyby novostavba stála, změní se kapacita
  i podoba. E-mail ahoj@andrejcova.sk (informace) vědomě nezapsán —
  do kontaktů šel rezervační. Rozhovor v Denníku N je za paywallem,
  čerpáno jen z perexu.

