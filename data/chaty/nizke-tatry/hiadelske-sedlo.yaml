nocleh: ano
overeniNocleh:
  source: >-
    hiking.sk, profil tábořiště (čteno 9. 8. 2026): „Po obvode objektu je
    široké sedenie, ktoré slúži ako pričňa pre štyroch ľudí."; „Podkrovie
    prístrešku tvorí uzavretá nocľaháreň … s kapacitou cca 5 nocľažníkov."
    Hřebenový přehled hiking.sk (léto 2021) shrnuje: „Poschodový prístrešok
    chránený zo štyroch strán, nocľah 10 osôb na zemi a v podkroví."
    KAPACITA SE NEZAPISUJE: 4 + „cca 5" proti souhrnným 10 — součet by byl
    aritmetika redakce a údaje si mírně odporují; próza říká „asi
    desítka míst". Cena: „bezplatné verejné horské táborisko" (hiking.sk).
    Režim: „Sedlo je určené na jednorázové prenocovanie vo vlastnom stane,
    nie ako kemp na dlhší pobyt." Louka sedla je Správou NAPANT vyhlášeným
    tábořištěm pro stanování, bivakování a otevřený oheň; NAPANT: na území
    národního parku „je zakázané táboriť, stanovať a bivakovať mimo
    vyhradených miest".
  verified: false
  checked: '2026-08-09'

