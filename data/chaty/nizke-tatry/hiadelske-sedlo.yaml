interniPoznamky: >-
  Povýšeno z data/kandidati/nizke-tatry/hiadelske-sedlo.yaml (9. 8. 2026);
  katalogový objekt HUT-0155.

  TYP bivak — PRVNÍ POUŽITÍ V KORPUSU a zakládá pravidlo: otevřený
  přístřešek bez kamen na jednorázové přenocování není útulňa (Ramža
  s kamny a pryčnami útulňa je). Katalog objekt vede jako „Útulňa
  Hiadeľské sedlo" — alias to nese, próza vysvětluje rozdíl. Název
  profilu „Prístrešok v Hiadeľskom sedle" dle terminologie hiking.sk
  a cestasnp.sk; OSM name „Hiadeľské sedlo" je v aliasech.

  KAPACITA vědomě nevyplněna: 4 (pryčna po obvodu) + „cca 5" (podkroví)
  × souhrnných 10 z přehledu 2021 — součet 4+cca5 by byl aritmetika
  redakce (vzor Kolářova chata Slavíč), próza říká „asi desítka míst".

  SEZONA vědomě nevyplněna: výslovné „celoročne" žádný pramen nenese;
  fakticky jde o trvale otevřený přístřešek a próza to říká.

  ROZPOR výšky 1099 × 1105 (vrcholovka.cz, jen titulek) — přiznán
  v overeniLokace. OBEC nevyplněna — katalog vede Hiadeľ, prameny obec
  neuvádějí (DATA-17 R6). Stavové údaje jsou z léta 2021 — při další
  rešerši ověřit stav přístřešku.

  Fotku dodá druhý běh DATA-02, výškový profil DATA-06.
