# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Otevřený patrový přístřešek z roku 2008 v travnatém sedle na západní
  hřebenovce — bez kamen, zdarma a na jednu noc. Louka kolem je jedno
  z mála míst národního parku, kde se smí oficiálně stanovat a rozdělat
  oheň; voda je tu ale málo vydatná.
text:
  - >-
    Hiadeľské sedlo je travnatá křižovatka červené hřebenovky a modré
    značky v 1099 metrech, mezi Kozím chrbátem a Veľkou Chochuľou. Od
    srpna 2008 tu stojí dřevěný patrový přístřešek, který postavila
    Základná organizácia Slovenského zväzu ochrancov prírody a krajiny
    Nízke Tatry z grantového programu Živé chodníky Nadácie Ekopolis;
    louku sedla zároveň Správa národního parku vyhlásila oficiálním
    tábořištěm pro stanování, bivakování a otevřený oheň — což je
    v národním parku, kde jinde platí zákaz, vzácnost.
  - >-
    Katalogy objekt někdy vedou jako útulňu, ale to slovo slibuje víc,
    než místo dává: je to otevřený přístřešek bez kamen, určený podle
    hiking.sk „na jednorázové prenocovanie", ne jako kemp na delší pobyt.
    Po obvodu je široké sezení, které poslouží jako pryčna pro čtyři
    lidi, v podkroví je uzavřená noclehárna zhruba pro pět — hřebenový
    přehled z léta 2021 mluví souhrnně o deseti místech na zemi
    a v podkroví. Nocleh je zdarma.
  - >-
    Největší slabina sedla je voda. Studničky jsou tři — pod sedlem
    minutu cesty, v dolince Dolné vodné deset minut a nad Grantami
    dvacet —, ale hiking.sk výslovně varuje, že pramen v sedle „je málo
    výdatný a technický stav studničky umožňuje len pomalé naberanie
    vody". Kdo tu plánuje nocovat, ať nese vodu s sebou nebo počítá
    s čekáním u pramene.
  - >-
    Přístupy podle hiking.sk: z Donovalů po červené hřebenovce přes Kečku
    a Kozí chrbát za tři hodiny, od Veľkej Chochule po červené za hodinu
    a čtyřicet minut, z Korytnice po modré za hodinu a čtyřicet minut,
    z Hiadľa po modré za dvě hodiny a z Moštenice po žluté za tři a půl.
  - >-
    Údaje nesou hiking.sk, cestasnp.sk, napant.sk, domalenka.sk
    a turistika.cz; polohu OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
