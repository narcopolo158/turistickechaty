# ── Provoz ────────────────────────────────────────────────────────────────
overeniProvoz:
  source: >-
    Trvale přístupný otevřený přístřešek — „je totiž otvorený a bez
    piecky" (jesikazakova.com, čteno 9. 8. 2026); hiking.sk ho vede jako
    „drevený prístrešok na jednorázové prenocovanie". Výslovnou větu
    o celoročním provozu žádný pramen nenese, a tak se pole sezona
    nevyplňuje. Správa: „Správa NAPANT-u Banská Bystrica" (hiking.sk);
    NAPANT sedlo uvádí mezi vyhrazenými místy pro jednorázové přenocování
    (červená TZT 0801). Nejčerstvější stavové údaje jsou z léta 2021;
    novější zprávy o změnách se nenašly.
  verified: false
  checked: '2026-08-09'

