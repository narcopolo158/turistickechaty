  - rok: 1968
    udalost: >-
      U mezistanice vyrostl horský hotel podle projektu architekta
      Miroslava Begána; registr moderní architektury datuje výstavbu
      1958–1968, jiný pramen 1958–1960.
    zdroj: >-
      register-architektury.sk (čteno 9. 8. 2026) — architekt Miroslav
      Begán, vznik 1958–1968; archinfo.sk (blog) uvádí 1958–1960.
  - rok: 2016
    udalost: >-
      Před vchodem vyrostla nová stanice kabinové lanovky; při úpravách
      zmizela původní markýza vstupu, což registr moderní architektury
