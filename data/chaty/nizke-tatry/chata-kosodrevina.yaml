# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Begánův modernistický horský hotel z konce padesátých let na mezistanici
  lanovek na jižním svahu Chopku. Přes dvě stě lůžek s polopenzí, bary
  a zimní koncerty — dnes jede jen v zimní sezóně a rezervace bere
  výhradně e-mailem.
text:
  - >-
    Kosodrevina stojí v patnácti stech metrech na jižním svahu Chopku,
    přímo u přestupní stanice lanovek z Krupové a Srdiečka nahoru na
    hřeben. Není to chata v romantickém smyslu — je to horský hotel
    z konce padesátých let od architekta Miroslava Begána, zapsaný
    v Registru moderní architektury Slovenska: třípodlažní lůžkový blok
    posazený na rozšířeném společenském přízemí „s elegantne šikmo sa
    rozbiehajúcimi líniami", jak píše archinfo.sk. Tentýž web ale
    dodává, že novodobé zásahy budově nesvědčí: roku 2016 vyrostla přímo
    před vchodem nová stanice kabinové lanovky a původní markýza zmizela.
  - >-
    Historie místa je historií lanovky: úsek Srdiečko–Kosodrevina jezdil od
    září 1954, navazující úsek na Chopok od srpna 1957 — a hotel vyrostl
    u mezistanice; registr datuje stavbu 1958–1968, jiný pramen 1958–1960
    a profil ten rozpor přiznává. V bývalé dolní stanici horního úseku
    dnes funguje muzeum lanovky von Roll s původní strojovnou a vozy.
  - >-
    Kapacita je na horské poměry velkorysá: 236 lidí (starší pramen uvádí
    240 a vlastní web číslo neuvádí, platí tedy nižší) v pokojích od
    dvoulůžkových po osmilůžkové. Ceny jsou s polopenzí, od 37 do 50 eur
    za osobu a noc podle období a pokoje; kuchyně zvládá bezlepkovou,
    bezlaktózovou, vegetariánskou i veganskou dietu. Rezervace jde jedině
    e-mailem — „Svoje rezervácie môžete posielať len emailom" — a v zimě
    se na chatě hrají koncerty.
  - >-
    Podstatná věc pro plánování: chata dnes jede jen v zimě. Titulní
    strana webu hlásí zavřeno od 22. března do 3. prosince 2026
    a návrat v zimní sezóně od 4. prosince. Kdo jde po hřebeni v létě,
    najde občerstvení v sousední samoobslužné restauraci TMR padesát
    metrů vedle, která otevírá s lanovkami — z Krupové jezdí kabiny
    denně i v létě.
  - >-
    Autem se sem nedá; nahoru vede lanovka z Krupové (celoročně) a v zimě
    ze Srdiečka, pěšky je to od Srdiečka Bystrou dolinou padesát minut.
    Značené trasy od chaty podle nizketatry.sk: na Chopok a ke Kamenné
    chatě po žluté necelé dvě hodiny, k Štefáničce po modré hodina
    a půl (hiking.sk od ní měří opačným směrem 1:25), na Ďumbier přes
    hřeben dvě hodiny dvacet, dolů k Trangošce tři čtvrtě hodiny.
  - >-
    Údaje nesou vlastní web chaty, register-architektury.sk, archinfo.sk,
    kotp.sk, nizketatry.sk, travelguide.sk a jasna.sk; polohu
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
