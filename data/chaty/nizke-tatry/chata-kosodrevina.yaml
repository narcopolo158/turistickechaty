# ── Historie ──────────────────────────────────────────────────────────────
overeniHistorie:
  source: >-
    Register modernej architektúry Slovenska (čteno 9. 8. 2026): Horský
    hotel Kosodrevina, architekt Miroslav Begán, doba vzniku 1958–1968,
    postaven „na medzistanici lanovky z južnej strany Chopku";
    společenská část v rozšířeném přízemí a „štandardným trojtraktovým
    lôžkovým blokom s tromi poschodiami". ROZPOR V DATACI, přiznaný:
    blog na archinfo.sk uvádí výstavbu 1958–1960 — pole rokVzniku proto
    zůstává prázdné a milník nese rozpětí. Kontext lanovky: jižní úseky
    první slovenské sedačkové lanovky jezdily Srdiečko–Kosodrevina od
    19. 9. 1954 (do 1994) a Kosodrevina–Chopok od 29. 8. 1957 (do 1998)
    — kotp.sk; hotel stál asi 100 m od stanice von Roll (archinfo.sk).
    Roku 2016 byla před vchodem necitlivě umístěna nová stanice kabinové
    lanovky a odstraněna původní markýza (archinfo.sk).
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1954
    udalost: >-
      Na jižní svah Chopku dorazila lanovka: úsek Srdiečko–Kosodrevina
      zahájil provoz 19. září 1954, navazující úsek na Chopok 29. srpna
      1957.
    zdroj: >-
      kotp.sk, muzeum lanovky von Roll (čteno 9. 8. 2026) — „IV section
      (Srdiečko–Kosodrevina): Operational from September 19, 1954";
      „III section (Kosodrevina–Chopok): Operational from August 29,
