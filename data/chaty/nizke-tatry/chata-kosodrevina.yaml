interniPoznamky: >-
  Povýšeno z data/kandidati/nizke-tatry/chata-kosodrevina.yaml
  (9. 8. 2026); katalogový objekt HUT-0147.

  ROZHODNUTÍ PÁRU 151 m (jádro kosodrevina v registru jmenovců):
  rešerše doložila v areálu JEDNU ubytovací budovu (trojtraktový lůžkový
  blok, register-architektury; OSM way 435913007 s č. p. 875) a vedle ní
  provozně samostatné objekty BEZ noclehu — samoobslužnou restauraci TMR
  (50 m, jasna.sk), bývalou stanici von Roll s muzeem a novou stanici
  kabinové lanovky. Bod OSM „Kosodrevina" (node/6033672713,
  tourism=undefined) odpovídá komplexu stanice, ne druhému noclehu →
  kandidát vyřazen, registrový záznam zaniká (vzor Morskie Oko:
  rozhoduje provoz/budova, ne vzdálenost).

  TYP horsky-hotel: katalog i registr architektury vedou objekt jako
  hotel; 236 lůžek s polopenzí není chata v úzkém smyslu.

  ROK VZNIKU vědomě nevyplněn: 1958–1968 (registr) × 1958–1960
  (archinfo) — milník nese rozpětí i rozpor.

  ROZPORY OTEVŘENÉ: výška 1500 × 1510; kapacita 236 × 240 (nižší
  zapsáno); restaurace 230 × 80 (druhé číslo nejspíš TMR); uzavírka od
  22. 3. (web) × od 1. 4. (nizketatry). GPS kontaktní stránky ~200 m
  západně od budovy — zapsána budova z OSM.

  NENALEZENO: IČO/firma provozovatele (nizketatry jmenuje Pavla Černého
  — týž kontakt vede i u Trangošky); výslovná obsluha neubytovaných
  přímo v chatě (vedle je samoobsluha TMR); rekonstrukce 2024–26.
  Vlastnictví J&T je doslech z blogu 2009 — do dat nejde.

  Fotku dodá druhý běh DATA-02, výškový profil DATA-06, lanovky oblasti
  DATA-32 (kliky v KLIKY-PRO-MICHALA — tahle chata je přímo u nich).
