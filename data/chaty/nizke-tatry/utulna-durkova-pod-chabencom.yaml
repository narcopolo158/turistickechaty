# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 2002
overeniHistorie:
  source: >-
    Dnešní útulňa byla slavnostně otevřena 28. 9. 2002 (treking.cz:
    „současná útulna se dočkala svého slavnostního otevření až 28.9.2002";
    historia.cestasnp.sk: „V sedle Pod červenou hrebeňovkou sa od roku 2002
    nachádza útulňa Ďurková"). Postavila ji Regionálna rada Klubu
    slovenských turistov Banská Bystrica (hiking.sk). MENŠÍ ROZPOR,
    přiznaný: cestasnp.sk v profilu útulně píše „stojí tu síce len asi od
    roku 2000" — platí doložené datum otevření. PŘEDCHŮDKYNĚ: chata KČST
    pod Chabencom, otevřená 14. 8. 1932 (prvním chatárem Kornel Samko —
    treking.cz), rozšířená 1933, roku 1937 přibyla samostatná zrubová
    budova (historia.cestasnp.sk). ZÁNIK — ROZPOR, přiznaný: treking.cz
    i historia.cestasnp.sk uvádějí požár 9. 9. 1940 („9.9.1940
    v pozdnodopoledních hodinách chatu zachvátil požár"), kdežto profil na
    cestasnp.sk tvrdí, že „jej existenciu definitívne ukončili fašisti
    počas 2. svetovej vojny". Požár z roku 1940 je doložen dvěma prameny
    a předchází SNP; verze s fašisty zůstává jako osamocené tvrzení.
  verified: false
  checked: '2026-08-09'

