# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Obsluhovaná útulňa z roku 2002 na místě salaše a vyhořelé prvorepublikové
  chaty KČST, v 1623 metrech pod sedlom Ďurkovej na hlavním hřebeni.
  Třiatřicet míst v podkrovní noclehárně, guláš s kolínky — a nejbližší
  chata podle hiking.sk šest hodin chůze.
text:
  - >-
    Ďurková stojí na jižní stráni hlavního hřebene, kousek pod sedlom
    Ďurkovej mezi Chabencom a Skalkou — v místech, kterým staré mapy říkaly
    salaš pod Chabencom. Na výšce 1623 metrů se prameny shodují bez
    odchylky. Právě poloha je její hlavní deviza i břemeno: podle hiking.sk
    je to sem deset hodin chůze z Donovalů, osm od Štefáničky a šest od
    Kamenné chaty na Chopku.
  - >-
    Historie místa začala mnohem dřív. Chata KČST pod Chabencom se
    slavnostně otevírala 14. srpna 1932 — prvním chatárem byl Kornel
    Samko —, hned další rok se rozšiřovala a roku 1937 k ní přibyla
    samostatná zrubová budova. Konec přišel rychle: 9. září 1940 chatu
    zachvátil požár a vyhořela; jeden pramen klade její definitivní zánik
    až do války a připisuje ho fašistům, dva prameny se ale shodují na
    požáru. O čtyři roky později se právě přes Chabenec probíjeli v mrazu
    a sněhu ustupující povstalci — na svahu jich čtyřiaosmdesát zahynulo.
  - >-
    Na střechu nad hlavou pak místo čekalo přes šedesát let. Dnešní útulňu
    postavila Regionálna rada KST Banská Bystrica a otevřela se 28. září
    2002; majetkem je KST Banská Bystrica, spravuje ji KST Jasenie
    a správcem je Tomáš Lupták.
  - >-
    Ač se jmenuje útulňa, funguje jako malá obsluhovaná chata: provoz je
    celoroční se správcem, byť — jak poctivě píše jeden z pramenů — „ne
    vždy je chatař na chatě, otevřeno však bývá". Spí se ve vlastním
    spacáku na matracích ve společné podkrovní noclehárně pro 33 lidí, za
    10 eur na noc (členové KST 7 eur, stan u chaty 2 eura); v nouzi pojme
    jedálna dalších dvacet nocležníků a rezervace se nedělají — chatár
    podle hiking.sk „ubytúva vždy všetkých návštevníkov". K jídlu bývá
    pivo, čaj, luštěninová polévka nebo guláš s kolínky. Voda je z upravené
    studničky 150 až 200 metrů západně od chaty, záchod je suchá latrína
    a mobilní signál tu prý funguje dobře.
  - >-
    Nahoru se jde z Jasenia po modré Jasenianskou dolinou za necelých pět
    hodin, nebo po zelené Lomnistou dolinou za čtyři; z horské osady
    Magurka po zelené za dvě a čtvrt hodiny. Z červené hřebenovky E8 se
    k útulně sestupuje z rozcestí Malý Chabenec, hrebeň Chabenca nebo sedlo
    Ďurkovej po modré a zelené za čtvrt hodiny. V zimě sem míří
    skialpinisté — a zimní přechod hřebene nad útulňou ať zvažují jen ti,
    kdo vědí, co dělají.
  - >-
    Údaje nesou hiking.sk, treking.cz, cestasnp.sk a jeho historický
    projekt, natreku.cz, lacneubytovanie.net, zlavadna.sk, visitliptov.sk,
    kst.sk a napant.sk; polohu OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
