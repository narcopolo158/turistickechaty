interniPoznamky: >-
  Povýšeno z data/kandidati/nizke-tatry/utulna-durkova-pod-chabencom.yaml
  (9. 8. 2026); katalogový objekt HUT-0152.

  TYP: obsluhovana navzdory jménu Útulňa — celoroční provoz se správcem,
  teplé jídlo a ceník je funkčně malá obsluhovaná chata (OSM ji vede jako
  alpine_hut). Stejná volba čeká u Andrejcové.

  WEB durkova.sk: jmenuje ho natreku.cz, ale ze sandboxu se načíst
  nepodařilo (fetch blokován, ne mrtvá doména) — na rozdíl od sherpacaffe.sk
  není doklad, že by doména nesla cizí obsah, proto v kontaktech zůstává.
  Telefon správce +421 949 792 997 (Tomáš Lupták) vědomě nezapisuji do
  kontaktů — primární číslo je útulňa sama; e-mail NENALEZEN.

  ROZPORY OTEVŘENÉ: kapacita 33 × 36 (zapsáno nižší); studnička 150 × 200 m
  (obojí v próze); zánik staré chaty požár 1940 × „fašisti za války"
  (požár má dva prameny, druhá verze přiznána); rok vzniku dnešní útulně
  2002 (otevření) × „asi 2000" (cestasnp). Změna správce na Luptáka —
  hiking.sk ji vede u zprávy datované 21. 6. 2011, ale datace ve fetchi
  byla nejistá; do milníků proto nejde, v provozu je doložená k 11/2024.

  NENALEZENO: e-mail; přesná kapacita jedálně jako řádného noclehu;
  „postupně přestavovaná na klasickou horskou chatu" (natreku.cz) je
  osamocené tvrzení a do dat nejde. Fotku dodá druhý běh DATA-02, výškový
  profil DATA-06, lanovky oblasti DATA-32 (kliky v KLIKY-PRO-MICHALA).
