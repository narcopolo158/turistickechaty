  Čertovica (1935/36, abandonedhotels.eu), Športhotel Čertovica
  (zilinak.sk 1/2025) a archivní hotel TOTEM — vzájemné vazby
  NENALEZENY.

  VLASTNÍ WEB: chatapodcertovicou.sk (aktuální dle sedlocertovica.sk)
  i starší .eu byly při rešerši v přesměrovací smyčce http↔https — do
