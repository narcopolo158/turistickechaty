  načte, srovnat ceník a kapacitu (zapsané údaje jsou z agregátorů).

  ROK VZNIKU NENALEZEN („historická zrubová chata" bez data). KAPACITA
  33 × 34 × 38 × 40 (+ archivních 36–43) — nejnižší a nejčerstvější.
