interniPoznamky: >-
  Povýšeno z data/kandidati/nizke-tatry/chata-pod-certovicou.yaml
  (9. 8. 2026); katalogový objekt HUT-0150. ROZPLETENÍ SEDLA (rešerše
  9. 8. 2026): čtyři samostatné ubytovací provozy — tahle chata (č. 259,
  u jezírka), Penzión STIV (č. 266, certovica.sk), Chata pod Sedlom
  Čertovica (č. 262, chatacertovica.sk — kandidáta nemá; katalogová
  HUT-0158 „Chata na Čertovici" je téměř jistě ona) a Domček HS (č. 263,
