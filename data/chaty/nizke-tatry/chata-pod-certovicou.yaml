# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Roubená chata u minerálního jezírka Kyselka kousek pod sedlem
  Čertovica, jediným silničním přechodem hlavního hřebene. Třiatřicet
  lůžek, restaurace s krbem a pstruhy z vlastního jezírka, wellness —
  a lyžařský vlek sto metrů od dveří.
text:
  - >-
    Chata stojí pár set metrů východně od sedla Čertovica na liptovské
    straně, u minerálního jezírka Kyselka, ve výšce 1232 metrů. Sedlo je
    jediný frekventovaný silniční přechod hlavního hřebene Nízkých Tater
    — autobus z Liptovského Mikuláše do Brezna tu staví — a červená
    hřebenovka Cesty hrdinov SNP jím prochází na půli cesty mezi
    Ďumbierom a Kráľovou hoľou.
  - >-
    V sedle se dnes dá spát hned ve čtyřech provozech a jména se
    matou snadno: tahle Chata pod Čertovicou (číslo popisné 259) je ta
    u jezírka; o kousek výš u sjezdovky stojí Chata pod Sedlom
    Čertovica, přímo v sedle Penzión STIV a Domček Horskej služby.
    Starší doména téhle chaty se navíc hlásila jako „Hotel pod
    Čertovicou" — pořád týž objekt.
  - >-
    Spí se ve dvanácti pokojích s třiatřiceti lůžky a devíti
    přistýlkami (prameny uvádějí i 34, 38 a 40 — zapsané je nejnižší
    a nejčerstvější číslo); dvoulůžkový pokoj vyjde na 40 až 55 eur.
    Restaurace s barem a krbem vaří snídaně za 5,50 eura a polopenzi za
    třináct; specialitou jsou grilovaní pstruzi z vlastního jezírka,
    které v zimě zamrzá v přírodní kluziště. K tomu wellness s vířivkou
    a dvěma saunami, hřiště a tenisový kurt — na horskou chatu výbava
    spíš hotelová.
  - >-
    Provoz je celoroční; lyžařský vlek je sto metrů od chaty
    a středisko Ski Čertovica dvě stě. Z sedla vede červená na západ
    k Ďumbieru (11,6 kilometru, kolem čtyř hodin a čtvrt) a na východ
    přes Beňušku k útulně Líška a dál k Ramži.
  - >-
    Údaje nesou sedlocertovica.sk, travelguide.sk, horehronie.sk,
    vypadni.sk, slovenske.sk, planetofhotels a 1-2-3-ubytovanie.sk;
    polohu OpenStreetMap. Vlastní web chaty byl při rešerši technicky
    nedostupný. Redakce nic neověřila vlastním dotazem ani návštěvou.
