interniPoznamky: >-
  Povýšeno z data/kandidati/nizke-tatry/trangoska.yaml (9. 8. 2026);
  katalogový objekt HUT-0148. Druhý profil korpusu se stavem mimo-provoz
  (po krkonošské Barborce) a první, kde jeden pramen píše „trvale".

  STAV mimo-provoz, ne zanikla: budova stojí (OSM, domalenka) a titulek
  „Nová Trangoška" na nedostupném webu může znamenat návrat — HLÍDAT,
  při další rešerši zkusit web znovu; kdyby se otevřela, přepnout stav
  a doplnit kontakty (nizketatry vedl tel. 0917 998 431 / domalenka
  0917 988 431 / treking 0905 899 098 — tři varianty, i proto se teď
  žádný nezapisuje). nocleh: ne popisuje dnešek; historická kapacita
  75 × 78 × 97 × 98 je v próze a overeniNocleh.

  VÝŠKA: 1130 (treking) × 1120 (tatrami) × 1121 (katalog) — zapsáno
  1130 bez silného rozhodovacího pramene; 1020 (domalenka) je izolovaný
  outlier (KONTROLA-11), do dat nejde. DATA-31/mapový podklad může
  rozhodnout přesněji.

  NENALEZENO: důvod a datum ukončení provozu; prvorepubliková historie
  chaty (jméno lokality je starší); IČO; obsah webu „Nová Trangoška".
  Kontaktní osobou byl dle nizketatry Pavol Černý — týž kontakt jako
  u Kosodreviny, což může znamenat společného provozovatele obou chat;
  je to ale jen shoda jména v jednom prameni, nic víc se nedomýšlí.

  Fotku dodá druhý běh DATA-02, výškový profil DATA-06.
