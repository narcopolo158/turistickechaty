    Trangoška" — jestli to znamená přestavbu, nového provozovatele nebo
    něco jiného, se nepodařilo zjistit a profil nic nedomýšlí. Důvod
    a přesné datum ukončení provozu prameny neuvádějí; poslední nalezený
    doklad běžného provozu je pobytová nabídka s platností do
    30. 11. 2020 (zlavomat.sk). Starší popisy „otevřeno celoročně"
    (treking.cz, natreku.cz, travelguide.sk) jsou zastaralé. Kontaktní
    osobou byla dle nizketatry.sk Pavol Černý (týž kontakt vede
    i u Chaty Kosodrevina); kontakty se pro mimo-provoz nezapisují.
  verified: false
