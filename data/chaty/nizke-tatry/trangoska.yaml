zajimavosti:
  - text: >-
      Trangoška je klasické východiště na Ďumbier a k Štefáničce: od
      chaty vede zelená značka Trangošskou dolinou, kterou se na
      Štefáničku dodnes nosí zásoby, a u parkoviště bývalo informační
      středisko národního parku.
    kategorie: jine
    zdroj: >-
      hiking.sk (čteno 9. 8. 2026) — trasa „okolo bývalého informačného
      strediska NAPANT-u"; nosičská role doliny hiking.sk, profil
      Štefáničky; travelguide.sk — „Directly from the cottage hiking
      trails lead you to the highest peaks".
  - text: >-
      Sto metrů od chaty je autobusová zastávka a velké neplacené
      parkoviště — na horskou chatu nezvykle civilizovaný nástup.
    kategorie: jine
    zdroj: >-
      hiking.sk (čteno 9. 8. 2026) — „veľké neplatené a nestrážené
      parkovisko (autobusová zastávka) na Trangoške"; zastávka 100 m
      chatahs.sk.

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata z roku 1983 na jižním úpatí Chopku, u parkoviště a zastávky, odkud
  se stoupá Trangošskou dolinou k Štefáničce a na Ďumbier. V roce 2026 je
  zavřená — jeden pramen píše trvale — a její web nese záhadný titulek
  „Nová Trangoška".
text:
  - >-
    Trangoška leží v Bystré dolině na jižním úpatí Chopku, u silnice
    z Tále, sto metrů od autobusové zastávky a velkého neplaceného
    parkoviště. Prameny se přou o pár metrů výšky (1120, 1121, 1130)
    a rozdíl tu stojí přiznaný. Jméno nese celá lokalita — a je
    starší než chata sama: právě odsud stavěl KČST ve dvacátých letech
    Štefánikovu chatu pod Ďumbierom a Trangošskou dolinou se k ní dodnes
    nosí zásoby.
  - >-
    Samotná chata je z roku 1983: dvě budovy, v hlavní recepce, bar
    a restaurace s 54 lůžky, ve vedlejší dalších 24. Na celkovém počtu
    se prameny neshodly — 75, 78, 97 i 98 lůžek podle toho, kdo počítal
    a kdy. V zimě ji plnili lyžaři z jižních svahů Chopku, v létě
    turisté mířící nahoru; spávalo se tu za 17 až 44 eur podle období.
  - >-
    Teď je to všechno minulý čas: v roce 2026 je chata zavřená.
    Domalenka.sk ji vede jako „TRVALO ZATVORENÁ", nizketatry.sk píše
    „Chata je v roku 2026 zatvorená" a poslední doklad běžného provozu,
    který se podařilo najít, je pobytová nabídka platná do konce
    listopadu 2020. Web chaty byl při rešerši nedostupný a ve
    vyhledávači nese titulek „Nová Trangoška" — jestli to znamená
    přestavbu, nového provozovatele, nebo jen starý záměr, nevíme
    a hádat to nebudeme.
  - >-
    Východiště ale funguje dál a je to jedno z nejpohodlnějších v celých
    Nízkých Tatrách z jihu: zelenou značkou Trangošskou dolinou je to
    k Štefáničce hodina čtyřicet až dvě hodiny (prameny se liší), dál na
    Ďumbier přes hřeben kolem tří a půl hodin; žlutá vede za tři čtvrtě
    hodiny až hodinu deset ke Kosodrevině a dál na Chopok; zelená
    opačným směrem dojde za hodinu deset k Jaskyni mŕtvych netopierov.
    Kousek vedle stojí Chata Horskej služby z roku 1961, bývalá
    záchranná stanice — dnes apartmán, jiný provoz.
  - >-
    Údaje nesou treking.cz, nizketatry.sk, natreku.cz, domalenka.sk,
    travelguide.sk, tatrami.sk, zlavomat.sk, hiking.sk a chatahs.sk;
    polohu OpenStreetMap. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
