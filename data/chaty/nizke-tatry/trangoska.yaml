# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1983
overeniHistorie:
  source: >-
    nizketatry.sk (čteno 9. 8. 2026): „Chata bola uvedená do prevádzky
    v roku 1983"; shodně natreku.cz („postavena byla v roce 1983").
    Jméno Trangoška je ale mnohem starší a nese ho celá lokalita: právě
    od Trangošky stavěl KČST ve dvacátých letech Štefánikovu chatu pod
    Ďumbierom (základní kámen 20. 7. 1924) a Trangošskou dolinou se na
    ni dodnes nosí zásoby. Vedle chaty stojí samostatná Chata Horskej
    služby, postavená roku 1961 jako záchranná stanice HS (chatahs.sk)
    — jiný objekt, nezaměňovat. Prvorepubliková historie samotné chaty
    Trangoška se v dostupných pramenech nenašla.
  verified: false
  checked: '2026-08-09'

