# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bývalá záchranná stanice Horskej služby z roku 1968 v sedle
  Čertovica (1230 m), od června 2018 obnovená jako turistická
  ubytovna s dvaceti lůžky, bufetem a čepovaným pivem — čtvrtý
  provoz sedla, střižený po vzoru hřebenových útulen a stojící přímo
  na Ceste hrdinov SNP.
text:
  - >-
    Když Horská služba stanici z roku 1968 přestala potřebovat,
    budova léta chátrala — až ji parta nadšenců z Horského
    spoločenstva vzala do rukou a 17. června 2018 otevřela turistům.
    Jméno jí nechali: Domček Horskej služby se z záchranné stanice
    proměnil v malou ubytovnu přesně v duchu hřebenových útulen,
    kterých na Slovensku poslední roky přibývá.
  - >-
    Uvnitř je dvacet lůžek ve čtyřech pokojích, většinou na palandách,
    dvě koupelny, turistická kuchynka a sušiareň; venku se dá i
    stanovat. Bufet čepuje kofolu a řemeslné pivo, snídaně a večeře
    se objednávají předem — a rezervace noclehu je nutná, otevřeno je
    denně od čtyř odpoledne do deseti. Sezóny drží dvě: květen až
    říjen a prosinec až březen.
  - >-
    Sedlo Čertovica je pro přechodáře Nízkých Tater klíčové místo —
    Cesta hrdinov SNP tu jedinkrát mezi Ďumbierom a Kráľovou hoľou
    protíná silnici. Kdo chce víc pohodlí, najde v sedle a těsně pod
    ním další tři provozy: Penzión STIV, Chatu pod Sedlom Čertovica
    u sjezdovky a Chatu pod Čertovicou u jezírka.
  - >-
    Údaje nesou vlastní web domčeku, hiking.sk a POI databáze Cesty
    SNP; souřadnice pocházejí z Cesty SNP, protože objekt zatím chybí
    v našem exportu OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
