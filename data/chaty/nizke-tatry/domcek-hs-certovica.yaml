      rezervace, bufet, ceny
    url: https://cestasnp.sk/pred/pois/5ffd92985c76f40004b66cfb
interniPoznamky: >-
  Založeno PŘÍMO Z REŠERŠE bez OSM kandidáta (10. 8. 2026) — pátý
  takový profil korpusu; GPS z POI Cesty SNP (kontrolně ~40 m od
  našeho profilu STIV). Klíč zařazení: nocleh + bufet pro veřejnost
  přímo na Ceste hrdinov SNP; typ obsluhovana (stálá obsluha, bufet),
  ne utulna. ROZPLET SEDLA ČERTOVICA HOTOV: všechny čtyři provozy
  mají profil (Chata pod Čertovicou HUT-0150, STIV HUT-0151, Chata
  pod Sedlom Čertovica HUT-0158, Domček HS — bez katalogového řádku).

  PRÁVNÍ FORMA provozovatele: OZ Horské spoločenstvo (2018, hiking)
  → Horské spoločenstvo, s.r.o., IČO 50693000 (vlastní web dnes) —
  vedeme obě, změnu nedomýšlíme. Andrejcová má v profilu OZ Horské
  spoločenstvo jako správce — jestli jde o touž partu, rešerše
  neřekla; NEspojovat bez dokladu.

  K OVĚŘENÍ (DATA-04): zápis do OSM chybí (až přibude, přepnout GPS
  na OSM zdroj); obsluha bufetu pro neubytované kolemjdoucí výslovně
  nedoložena (bufet ano, ale režim nejasný); vztah k Andrejcové.
  Fotku dodá příští běh DATA-02.
