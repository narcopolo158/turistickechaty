# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Rodinný penzion s vlastním lyžařským areálem přímo v sedle Čertovica,
  na jediném silničním přechodu hlavního hřebene. Šedesát lůžek
  s polopenzí od 40 eur, domácí kuchyně — a restaurace, která přes den
  obsluhuje i hřebenovkáře procházející po Cestě hrdinov SNP.
text:
  - >-
    STIV stojí přímo v sedle Čertovica na liptovské straně silnice
    z Liptova na Horehroní — autobus z Liptovského Mikuláše do Brezna
    staví před dveřmi a červená hřebenovka Cesty hrdinov SNP prochází
    sedlem. Je to rodinný podnik: penzion, restaurace a k tomu vlastní
    lyžařský areál s vlekem Tatrapoma, dětským vlekem, dvěma sjezdovkami
    a free-ride zónou.
  - >-
    Spí se v šedesáti lůžkách — dvoulůžkové a trojlůžkové pokoje
    s vlastní koupelnou a rodinné buňky pro pět až šest hostů — od
    čtyřiceti eur za osobu a noc s polopenzí. Kuchyně vaří domácí jídla
    a slovenské speciality; restaurace u silnice má otevřeno denně od
    deseti do půl šesté, takže poslouží i tomu, kdo sedlem jen prochází.
    Wellness s infrasaunou, finskou saunou a perličkovou vanou prošlo
    v roce 2025 renovací.
  - >-
    V sedle se jména snadno pletou: STIV (číslo popisné 266) je ten
    přímo u silnice s vleky; kousek výš u sjezdovky stojí Chata pod
    Sedlom Čertovica, u jezírka východně Chata pod Čertovicou a přes
    cestu Domček Horskej služby. Katalogy STIV vedou i jako „horskou
    chatu" — vlastní web říká penzion.
  - >-
    Z sedla vede červená na západ přes Kumštové sedlo k Ďumbieru
    (11,6 kilometru, kolem čtyř a čtvrt hodiny) a na východ přes
    Beňušku směrem k útulně Ramža; na jih i sever sjíždí silnice do
    dolin. Vleky jedou o víkendech, svátcích a prázdninách denně od
    devíti do půl čtvrté.
  - >-
    Údaje nesou vlastní web penzionu, holidayinfo.sk, sedlocertovica.sk,
    hiking.sk a poi.oma.sk; polohu OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
