# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 2018
overeniHistorie:
  source: >-
    Budova původně nebyla chata: sloužila jako noclehárna personálu
    televizního vysílače na Kráľové holi a poslední roky jen jako garáž
    ratraku, který vysílač obsluhoval (obec Šumiac: „Budova bola pôvodne
    garážou pre ratrak"; podrobněji Dobré noviny 28. 10. 2018).
    V letech 2015–2018 ji tři Horehronci — právník Peter Kalman,
    Mariana Jambrichová a Vlado Jambrich — ve volném čase a za vlastní
    peníze přestavěli na chatu („všetko dokončili z vlastných zdrojov").
    ROZPOR V DATU OTEVŘENÍ, přiznaný: hiking.sk „v júni 2018 slávnostne
    otvorená", Dobré noviny uvádějí oficiální otevření v máji 2018.
    Zapsán rok 2018.
  verified: false
  checked: '2026-08-09'

