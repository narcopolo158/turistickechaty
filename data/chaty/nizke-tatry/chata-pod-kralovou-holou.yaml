# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Bývalá garáž ratraku od vysílače, kterou tři Horehronci za vlastní
  peníze přestavěli na chatu — od roku 2018 jediná střecha na výstupu
  na Kráľovu hoľu. Šest až osm postelí na rezervaci, polévka, štrúdľa
  a pivo Predná hora, z 90 procent na sluneční energii.
text:
  - >-
    Chata stojí na Prednom sedle v 1451 metrech, zhruba v polovině
    výstupu na Kráľovu hoľu, který je podle průvodce restartnisa.sk ze
    Šumiaca nejkratší, ale nejstrmější — modrá značka sem stoupá hodinu
    a půl a na vrchol zbývá další hodina. Kráľova hoľa
    (1946 m) je východní tečka hlavního hřebene a cíl červené Cesty
    hrdinov SNP; kdo ji přechází, míjí chatu kousek stranou červené,
    na obslužné silnici k vysílači.
  - >-
    Je to mladá chata s netypickým rodokmenem: budova sloužila jako
    noclehárna personálu televizního vysílače a nakonec jen jako garáž
    ratraku. V květnu 2015 se do ní pustili tři místní — právník Peter
    Kalman, Mariana Jambrichová a Vlado Jambrich — a po třech letech
    práce ve volném čase a za vlastní peníze ji v roce 2018 otevřeli
    veřejnosti (prameny se přou, jestli v květnu, nebo v červnu).
  - >-
    Nocleh je komorní: šest až osm postelí, výhradně na telefonickou
    rezervaci předem, za 30 eur se snídaní (25 bez ní, stav k začátku
    roku 2023). Bufet ale jede pro každého, kdo jde kolem: čaj, jedna
    dvě polévky, párky a klobásy, domácí tažená štrúdľa a řemeslné pivo
    Predná hora. Provoz je celoroční — a pozoruhodně zelený: 90 procent
    energie ze slunce, odpad se sváží dolů, a přesto tu v patnácti
    stech metrech teče pitná voda a splachuje WC.
  - >-
    Přístupy: ze Šumiaca po modré hodina a půl až hodina čtyřicet,
    z vrcholu Kráľovej hole hodina dolů, ze sedla Snehová jama po
    silnici tři čtvrtě hodiny. Nouzové útočiště v budově vysílače na
    vrcholu je podle průvodce aktuálně uzavřené. Pozor na záměnu:
    Kráľovohoľská chata s apartmány a restaurací (kralovka.sk) stojí
    dole na konci obce Šumiac — jiný objekt, jiný provoz.
  - >-
    Údaje nesou obec Šumiac, hiking.sk, Dobré noviny, horehronie.sk
    a restartnisa.sk; polohu OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
