# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata sto metrů pod sedlem Čertovica, přímo u sjezdovky — ski-in,
  ski-out, sauna, kulečník a čtyřiatřicet lůžek v apartmánech
  a turistických izbách. Katalogy ji vedou i jako „Chatu na Čertovici";
  hřebenovkáři z Cesty hrdinov SNP to sem mají dvě stě metrů.
text:
  - >-
    Chata stojí na liptovské straně zhruba sto metrů pod sedlem
    Čertovica, uprostřed lyžařského střediska Ski Čertovica — sjezdovka
    začíná deset metrů od dveří. Na výšce se prameny neshodnou do metru
    (1210 až 1238) a profil zapisuje číslo provozovatele, 1234 metrů.
    Ze čtyř ubytovacích provozů sedla má tahle chata nejvyšší hodnocení
    hostů; a jedno upozornění hned úvodem — není to Chata pod
    Čertovicou (ta stojí u jezírka východně od sedla) ani Penzión STIV
    (ten je přímo u silnice).
  - >-
    Spí se ve třech rodinných apartmánech, dvou mezonetových a třech
    turistických izbách — dohromady čtyřiatřicet lůžek a dvě přistýlky,
    s bufetovou snídaní v ceně; rezervuje se online a dá se pronajmout
    i celá chata. Jídelna pro dvacet lidí vaří po celý den, polopenze
    i plná penze jsou možné. K vybavení patří sauna, krb, kulečník
    a terasa nad sjezdovkou.
  - >-
    Pro pěší je podstatná poloha: červená hřebenovka Cesty hrdinov SNP
    prochází dvě stě metrů od chaty a hiking.sk už před lety popsal
    místní vstřícnost k hřebenovkářům — nocleh na jednu noc ve vlastním
    spacáku za zvýhodněnou cenu. Z sedla je to na západ k Ďumbieru
    kolem čtyř a čtvrt hodiny, na východ se přes Beňušku pokračuje
    k útulně Ramža; autobus z Liptovského Mikuláše do Brezna staví
    v sedle.
  - >-
    Údaje nesou vlastní web chaty, sedlocertovica.sk, travelguide.sk
    a hiking.sk. Objekt nemá podklad v OpenStreetMap — souřadnice jsou
    z webu provozovatele. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
