interniPoznamky: >-
  ZALOŽENO PŘÍMO Z REŠERŠE 9. 8. 2026 — bez OSM kandidáta (DATA-01
  objekt nepřinesl; čtvrtý profil korpusu vzniklý touhle cestou po
  třech beskydských). Až objekt přibude v OSM, doplnit way/node do
  overeniLokace (DATA-31/DATA-36 ho nesmí založit jako duplicitního
  kandidáta — jméno i GPS už web vede).

  KATALOG: HUT-0158 „Chata na Čertovici" (1230 m, Vyšná Boca) přiřazena
  SEM — žádný živý provoz toho jména rešerše nenašla a jediná další
  možnost je historická Chata Čertovica (1935/36), dnes ruina;
  kdyby Michal rozhodl, že katalogová položka míří na ruinu, patřilo by
  jí heslo se stavem zanikla a tenhle profil by zůstal mimo katalog.
  Otázka položena v deníku (čtrnáctý blok).

  POZOR NA DOMÉNY: starý web téhle chaty byl certovica.eu — zatímco
  certovica.sk patří Penziónu STIV. Pravděpodobný zdroj záměn
  v katalozích a agregátorech.

  VÝŠKA 1234 × 1210 × 1238 × 1230 — zapsán údaj provozovatele.
  KAPACITA 34+2 (provozovatel) × 36 × 36+2 — údaj provozovatele.
