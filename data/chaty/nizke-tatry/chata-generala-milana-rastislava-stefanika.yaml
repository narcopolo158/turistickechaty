# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná chata z roku 1928 v Ďumbierskom sedle na hlavní hřebenovce
  Nízkých Tater, bez cesty a bez lanovky — zásobují ji nosiči. Po válce se
  čtyřicet let jmenovala Chata hrdinov SNP; od roku 1991 ji vedl chatár
  Igor Fabricius a o její nájem se v roce 2026 vede soudní spor.
text:
  - >-
    Štefánička stojí v Ďumbierskom sedle přímo na hlavním hřebeni Nízkých
    Tater, na rozcestí čtyř značek včetně červené hřebenovky E8. Vlastní web
    nese výšku 1740 metrů přímo v názvu, hiking.sk uvádí 1727 — třináct
    metrů, které od stolu nerozhodneme, a tak tu stojí číslo provozovatele
    i s tímhle přiznáním. Nahoru nevede žádná sjízdná cesta.
  - >-
    Základní kámen se pokládal 20. července 1924 a stavba nezačala šťastně:
    společnost Josefa Jiráska od ní ještě téhož roku ustoupila a dílo
    dokončila až popradská firma Jozefa Šašinku za 562 911 korun. Kdo stavbu
    inicioval, se prameny neshodnou — dva články téhož webu peakcellent.sk
    uvádějí jednou Uhorský karpatský spolok, podruhé Klub československých
    turistov. Slavnostní otevření přišlo 9. září 1928 za odhadované účasti
    přes pět set turistů; prvním chatářem byl palír Róbert Petrla, tedy
    stavbyvedoucí, který na chatě zůstal i po dostavbě. Chata měla nahradit
    Karlovu ochrannou chatu z roku 1902 na vrcholu Ďumbiera.
  - >-
    Za Slovenského národního povstání se na chatě ukrývali partyzáni
    a v listopadu 1944 ji fašistická vojska značně poškodila. Poválečná éra
    jí vtiskla i nové jméno: Chata hrdinov SNP. K původnímu názvu se
    oficiálně vrátila až 21. července 1990, kdy byla na průčelí odhalena
    podobizna generála Štefánika.
  - >-
    Od roku 1991 měl chatu v pronájmu od Klubu slovenských turistů chatár
    Igor Fabricius. Po pětatřiceti letech mu vedení klubu vypovědělo
    smlouvu — jenže nový nájemce si chatu 1. července 2026 nepřevzal, spor
    řeší soud a o hosty se i v létě 2026 dál staral dosavadní chatár. Kdo
    bude Štefáničku vést dál, nebylo v létě 2026 rozhodnuto; kontakty níže
    jsou ty dosavadní.
  - >-
    Spí se v pokojích po osmi — hiking.sk počítá 48 lůžek v šesti pokojích,
    turisticky.sk přidává ještě jeden dvoulůžkový, a protože aktuální ceník
    se načíst nepodařilo, platí podle konvence nižší číslo. Kuchyně vaří
    kotlíkový guláš, česnečku i fazolovou a čepuje podle turisticky.sk
    „najvyššie čapované nosičské pivo na strednom Slovensku"; v létě
    funguje přízemní okno kuchyně jako bufet, takže se tu zastaví i ten,
    kdo nahoře nespí. K tomu nosičský čaj a svištie mlieko — což je,
    pro klid svišťů, punčovaný čaj.
  - >-
    Zásobování je tu řehole bez techniky: ročně vynesou nosiči Trangošskou
    dolinou 40 000 kilogramů materiálu, v zimě pomáhá čtyřkolka se sněžnými
    pásy. Statistika za rok 2025 napočítala dokonce 108 000 vynesených
    kilogramů — nosí totiž i turisté, aspoň polínko na oheň. Na chatě
    sídlí stanice Horské záchranné služby.
  - >-
    Přístupy podle hiking.sk: z Trangošky po zelené 1:40 h, z Kosodreviny
    po modré 1:25 h, z Čertovice po červené hřebenovce 3:30 h, z Chopku po
    červené 2:25 h (nahoru na Chopok jezdí lanovky z obou stran), z Vyšné
    Boce po žluté 2:55 h, z Mýta pod Ďumbierom po žluté 3:55 h,
    z Demänovské doliny po zelené 3:25 h a z Liptovského Jána po modré
    4:40 h.
  - >-
    Údaje nesou vlastní web chaty, hiking.sk, turisticky.sk, peakcellent.sk,
    bystricak.sk a reportáž spravy.stvr.sk; polohu OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
