    Vlastní web chaty (čteno 9. 8. 2026): „Roku 1924 bol položený základný
    kameň chaty M. R. Štefánika pod Ďumbierom" a „9.9.1928 sa chata
    slávnostne otvorila. Prvým chatárom sa stal paľer Róbert Petrla."
    Přesné datum základního kamene 20. 7. 1924 uvádí hiking.sk
    i peakcellent.sk. Zapsán je rok otevření. Náklady 562 911 korun
    (hiking.sk). ROZPOR O INICIÁTOROVI, přiznaný: dva články téhož webu
    peakcellent.sk uvádějí jednou Uhorský karpatský spolok Zvolenskej župy,
    podruhé Klub československých turistov; stavbu začala společnost Josefa
    Jiráska, která od ní týž rok ustoupila, a dokončila ji popradská firma
    Jozefa Šašinku (peakcellent.sk, shodně hiking.sk: „Stavba pokračovala
    firmou Šašinka z Popradu"). Architekt/projektant se v pramenech najít
    nepodařilo. Chata měla nahradit Karlovu ochrannou chatu z roku 1902 na
    vrcholu Ďumbiera (vlastní web); osud Karlovy chaty prameny neuvádějí.
