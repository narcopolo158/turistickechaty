# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Otevřená útulňa zdarma v lese u červené hřebenovky, sedm kilometrů
  východně od Čertovice. Vznikla v 70. letech přestavbou seníku — kdo ji
  postavil, bylo dlouho záhadou opředenou mýtem o plynovodu, než se
  ukázalo, že za ní od začátku stojí žilinští skauti z Olosovy bandy.
text:
  - >-
    Ramža se krčí v lesním porostu pár metrů severně od červené
    hřebenovky, necelých sedm kilometrů východně od sedla Čertovica,
    ve 1260 metrech. Výhled odsud není žádný — je to střecha na přespání,
    ne vyhlídka. Uvnitř jedna místnost se dvěma patrovými pryčnami,
    policemi na batohy a funkčními kamny; prameny se přou, jestli se sem
    vejde patnáct, nebo při troše nepohodlí dvacet lidí, a zápis z fóra
    z konce září 2024 dokládá, že bývá i plno: „Útulňa bola plná, tak som
    musel prespať pod stromom."
  - >-
    Její původ byl desítky let záhadou. Všeobecně se tradovalo, že Ramžu
    postavili dělníci při pokládce plynovodu spojujícího Horehroní
    s Liptovem — až reportáž hiking.sk z ledna 2024 našla pamětníka
    a jinou pravdu: byl to starý seník, který v 70. letech přestavěli
    žilinští skauti. Základové trámy byly shnilé, stavbu proto rozebrali,
    postavili znovu a stěny se tím snížily. Skupina si říká Olosova banda
    a v názvu své stránky uvádí rok 1979; a právě ona se o útulňu potichu
    stará dodnes — naposledy doloženě na podzim 2023, kdy položila novou
    dubovou podlahu pod průčelím, opravila studánku a postavila latrínu.
    Výš na stráni stával ještě druhý zrub, Malá Ramža, který sloužil
    bačovi; okolo roku 2000 vyhořel.
  - >-
    Režim je celoroční a prostý: otevřeno pořád, bez hospodáře, bez
    poplatku, bez rezervací. Voda je z upravovaného pramene západně od
    útulně — prameny uvádějí sto, dvě stě i tři sta metrů —, venku je
    ohniště, suchá latrína a malý kontejner. Dřevo v předsíni podle
    zápisů z fóra občas dochází; kdo může, ať nechá po sobě víc, než
    našel.
  - >-
    Přístup: z Čertovice po červené přes sedlo Za Lenivou za necelé dvě
    hodiny (nizketatry.sk uvádí 1:45, treking.cz asi dvě hodiny
    s krátkou odbočkou), z Vyšné Boce po červené a modré za necelé dvě
    hodiny, z Bacúchu po červené a modré za dvě a čtvrt. Kdo jde hřeben
    dál na východ, má to k Andrejcové 20,5 kilometru, necelých sedm
    hodin.
  - >-
    Údaje nesou hiking.sk (stránka útulně, reportáž z roku 2024 i fórum),
    nizketatry.sk, treking.cz a visitliptov.sk; polohu OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
