# ── Historie ──────────────────────────────────────────────────────────────
overeniHistorie:
  source: >-
    hiking.sk, reportáž „Útulňa Ramža a tajomstvo jej existencie"
    (31. 1. 2024, čteno 9. 8. 2026): útulňa vznikla přestavbou starého
    seníku žilinskými skauty v 70. letech 20. století — pamětník Peter
    „Beudín" Hrabovský „bol pri tom, keď starý senník prerobili v 70.
    rokoch 20. storočia na dnešnú útulňu". Technický detail: „Keďže
    základové brvná boli zhnité, tie po rozobraní konštrukcie odstránili,
    stavbu postavili nanovo a steny sa tak znížili." Facebooková stránka
    útulně nese název „Útulňa Ramža - est. Olosova Banda 1979" — rok 1979
    tedy uvádí sama skupina správců, hiking.sk říká obecně 70. léta;
    pole rokVzniku proto zůstává prázdné a přesnější dataci může doplnit
    až pramen. Táž reportáž vyvrací rozšířený mýtus, že útulňu postavili
    dělníci při pokládce plynovodu mezi Horehroním a Liptovem. Výše na
    stráni stával druhý zrub, tzv. Malá Ramža, který sloužil bačovi —
    okolo roku 2000 vyhořel.
  verified: false
  checked: '2026-08-09'

