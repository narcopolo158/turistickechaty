# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Nástupce turistické útulny KČT z roku 1924 na sedle Bunč pod
  Brdem — restaurace se zvěřinou a terasou, pokoje, apartmány
  a celoroční sruby uprostřed bukových lesů Chřibů. Kolem vede
  značená cesta na rozhlednu na Brdu i poutní stezka na Velehrad.
text:
  - >-
    Sedlo Bunč je odjakživa křižovatka Chřibů: sbíhá se tu pět
    katastrů a přes hřeben se chodilo na pouť na Velehrad. Klub
    českých turistů tu proto roku 1924 postavil útulnu — za války
    ji vypálili nacisté, po roce 1946 se dočkala obnovy a v květnu
    2024 se na Bunči slavilo sto let turistické chaty.
  - >-
    Dnešní lesní penzion drží vizovická likérka RUDOLF JELÍNEK:
    devatenáct pokojů, tři apartmány a sedm celoročních srubů pro
    zhruba sedmdesát hostů, restaurace s krbem, zvěřinovými
    specialitami a sluneční terasou. Od penzionu je to značkou
    kousek na Brdo s kamennou rozhlednou, nejvyšší bod Chřibů.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu penzionu,
    z Kudy z nudy a z ubytovacího katalogu. Skladba lůžek v chatkách
    se mezi prameny liší — přiznáváme. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
zdroje:
