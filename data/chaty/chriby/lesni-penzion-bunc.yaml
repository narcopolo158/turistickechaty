milniky:
  - rok: 1924
    udalost: >-
      Na sedle pod Brdem vznikla „Turistická útulna hostinská na
      Bunči" — patřila Klubu českých turistů a sloužila poutníkům
      na Velehrad i cyklistům.
    zdroj: >-
      Kudy z nudy (čteno 10. 8. 2026) — „Turistická útulna
      hostinská na Bunči" z roku 1924, KČT, poutníci a cyklisté.
  - rok: 1942
    udalost: >-
      Útulnu vypálili nacisté; obnovy se dočkala po roce 1946.
    zdroj: >-
      Kudy z nudy (čteno 10. 8. 2026) — „vypálena nacisty" 1942,
      obnova po 1946. Okolnosti vypálení (partyzánský kraj?)
      načtené prameny nevedou — nedomýšlí se.
  - rok: 2024
    udalost: >-
      Sto let turistické chaty na Bunči se slavilo 25. května 2024
      — s přednáškou „Od Buntsche k Bunči" o proměnách jména
      i o „chřibské dálnici", stavbě, která existenci Bunče kdysi
      ohrozila.
    zdroj: >-
      vlastní web bunc.cz, článek „100 let turistické chaty na
      Bunči" (čteno 10. 8. 2026).

zajimavosti:
  - text: >-
      Bunč je místo, kde se potkává pět katastrů — u sedla se
      sbíhají hranice Roštína, Kostelan, Salaše, Velehradu
