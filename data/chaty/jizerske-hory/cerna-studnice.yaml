# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Žulová rozhledna z roku 1905 na vrcholu Černé studnice (869 m) nad
  Smržovkou, podle projektu jabloneckého architekta Roberta Hemmricha.
  Na plošinu v jednadvaceti metrech vede 91 schodů a věž má otevřeno,
  když má otevřeno restaurace nebo kiosek u její paty.
text:
  - >-
    Černostudniční hřeben je nejjižnější výspa Jizerských hor — a jeho
    vrchol nese jednu z nejhezčích kamenných věží v okolí. Dřevěná
    vyhlídka tu stála už roku 1885; dnešní žulovou rozhlednu podle
    projektu jabloneckého architekta Roberta Hemmricha dokončil
    stavitel Corazza v roce 1905.
  - >-
    Věž měří 26 metrů, vyhlídková plošina je v jednadvaceti a vede na
    ni 91 schodů. Výhled obsáhne Jizerky, Krkonoše i Černostudniční
    hřeben pod vámi; na nadmořské výšce se prameny úplně neshodnou —
    dva uvádějí 869 metrů, mapy 865 až 872 — a my ten rozptyl
    nerozhodujeme.
  - >-
    Spolu s věží vyrostla i dřevěná chata s ubytovnou a hostinskou
    místností. Dnes u paty věže funguje restaurace a kiosek — a platí
    tu stejné pravidlo jako na Rašovce: rozhledna je přístupná
    v provozní době restaurace nebo kiosku, kuchyně vaří do půl páté.
    Jestli se v chatě dá znovu i spát, doložené nemáme — jeden pramen
    ubytovnu vede jako uzavřenou.
  - >-
    Údaje na téhle stránce pocházejí z krajského katalogu
    a z horského magazínu; polohu nese OpenStreetMap. Vlastní
    web areálu se nám zatím nepodařilo načíst. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
