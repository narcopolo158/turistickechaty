perex: Horská chata na Smědavě nad Bílým Potokem v 847 m n. m., celoročně,
  s ubytováním i stravováním. Je také známkovým místem č. 42.
text:
- OpenStreetMap vede Smědavu jako hotel, ne jako horskou chatu. Do průvodce ji řadí katalog
  turistických chat, který ji zná jako „Horskou chatu Smědava“ se stravováním i ubytováním,
  a vydavatelův výpis známkových míst, kde figuruje jako č. 42 „Horská chata Smědava — Jizerské
  hory“.
- Katalog uvádí nadmořskou výšku 847 m, nejbližší obec Bílý Potok, celoroční provoz a ubytování
  i stravování. Kapacitu lůžek ani otvírací dobu neuvádí, proto je tu nenajdete.
- 'Web se v pramenech liší: OpenStreetMap i výpis známkových míst vedou chatasmedava.cz, katalog
  smedava.com. Zapsali jsme adresu, kterou nesou dva prameny ze tří, a rozpor přiznáváme.'
