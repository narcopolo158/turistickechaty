text:
- Orle vede katalog jako schronisko górskie s jistotou A a s prameny z přehledu polských horských
  chat a seznamu ubytování PTTK. Nejbližší obcí je Szklarska Poręba.
- OpenStreetMap objekt vede zároveň jako horskou chatu a restauraci a uvádí u něj otevírací
  dobu; tu na webu nepíšeme, protože se sezonně mění a nemáme ji potvrzenou od provozovatele.
- Web se v pramenech liší — katalog uvádí jednu doménu, OpenStreetMap druhou. Zapsali jsme
  tu z OSM a rozpor přiznáváme.
