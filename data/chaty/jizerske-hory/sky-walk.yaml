# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Vyhlídková věž se spirálovou dřevěnou stezkou nad lázeňským
  Świeradówem-Zdrojem na polské straně Jizerských hor. Podle
  provozovatele nejvyšší vyhlídková věž v Polsku: 65 metrů, 850 metrů
  chůze vzhůru, skleněná terasa ve dvaašedesáti metrech — a dolů to
  jde i tobogánem.
text:
  - >-
    Sky Walk je nejmladší a nejodvážnější stavba v našem jizerském
    výběru: otevřela se roku 2021 přímo nad lázeňským Świeradówem-Zdrojem
    a na vrchol se nechodí po schodech, ale po 850 metrů dlouhé dřevěné
    stezce, která se kolem věže vine spirálou. Nahoře čeká skleněná
    terasa 62 metrů nad zemí; kdo nechce zpátky pěšky, sjede
    105metrovým tobogánem.
  - >-
    Superlativy tu patří provozovateli a tak je i uvádíme: nejvyšší
    vyhlídková věž v Polsku (65 metrů) a nejdelší kovová skluzavka
    v zemi. Na celkové výšce věže se prameny mírně rozcházejí —
    62 a 65 metrů — nejspíš podle toho, jestli měří terasu, nebo špici.
  - >-
    Otevřeno je denně od devíti do pěti s posledním vstupem hodinu před
    zavřením; jeden pramen uvádí, že v létě bývá až do sedmi. U vstupu
    do areálu stojí podle mapových dat stánky s občerstvením, víc o nich
    ale prameny neříkají — a nadmořskou výšku stanoviště uvádějí
    rozdílně, takže ji neuvádíme raději vůbec.
  - >-
    Údaje na téhle stránce pocházejí z webu provozovatele,
    z turistického klubu a z praktického průvodce; polohu nese
    OpenStreetMap. Redakce zatím nic neověřila vlastním dotazem ani
    návštěvou.
