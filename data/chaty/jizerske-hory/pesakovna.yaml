text:
- Pešákovna stojí na Jizerce, tedy v místě, kde se Jizerské hory potkávají s Krkonošemi. Do
  jizerských profilů ji řadí katalog, který ji vede v části pohoří Jizerka s nejbližší obcí
  Kořenov.
- Nadmořskou výšku 850 m, celoroční provoz i ubytování a stravování uvádí katalog. Kapacitu
  lůžek nenese, takže ji neuvádíme.
- OpenStreetMap objekt vede s tagem horské chaty; souřadnice jsou odtud a v terénu je nikdo
  neověřil.
