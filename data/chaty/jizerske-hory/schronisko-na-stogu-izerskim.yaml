text:
- Na Stogu Izerskim je v katalogu vedené jako schronisko górskie s jistotou A, s prameny z
  přehledu polských horských chat a seznamu ubytování PTTK; nejbližší obcí je Świeradów-Zdrój.
- OpenStreetMap objekt vede s tagem horské chaty a jako provozovatele uvádí PTTK, tedy polský
  turistický svaz. To s katalogem souhlasí.
- Nadmořskou výšku 1060 m uvádí katalog. Kapacitu lůžek ani otvírací dobu nemáme doloženou.
