text:
- Chatku Górzystów vede katalog jako schronisko górskie s jistotou A; nejbližší obcí je Świeradów-Zdrój,
  část pohoří Hala Izerska.
- OpenStreetMap objekt vede s tagem horské chaty. Kapacitu lůžek ani otvírací dobu žádný z
  pramenů nenese, takže je tu nenajdete.
- Souřadnice jsou z OpenStreetMap a v terénu je nikdo neověřil.
