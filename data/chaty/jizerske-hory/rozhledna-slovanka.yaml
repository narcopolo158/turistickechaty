# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Nejstarší železná rozhledna v Čechách stojí od roku 1887 v 820 metrech
  na hřebeni nad Lučany nad Nisou. Čtrnáctimetrová věž je přístupná
  celoročně a zdarma — a hned vedle stojí horská chata s restaurací,
  která právě mění provozovatele.
text:
  - >-
    Slovanka je z rodu jizerských věží, kolem kterých se chodí už přes
    sto let: tři sekce Německého horského spolku ji otevřely 14. srpna
    1887 a drží jí prvenství nejstarší železné rozhledny v Čechách.
    Železná konstrukce měří 14 metrů a stojí v nadmořské výšce 820
    metrů.
  - >-
    Věž dnes patří městu Lučany nad Nisou — získalo ji roku 1999
    a po obnově ji 5. července 2000 vrátilo turistům. Od té doby je
    přístupná celoročně a zdarma, což z ní dělá jednu z nejsnáze
    dostupných vyhlídek v horách. Pod kterou obec věž patří katastrem,
    prameny neříkají — chatu vedle vedou katalogy pod Hraběticemi —
    a tak obec poctivě nevyplňujeme.
  - >-
    Do průvodce ji řadí chata, která stojí pár desítek metrů od věže:
    Chata Slovanka s restaurací. Tady je ale namístě poctivost — chata
    má od června 2026 nového provozovatele a otevření pro veřejnost
    ohlásil na začátek července 2026. Jestli už běží naplno, jsme
    neověřovali; kdo na Slovance počítá s obědem, měl by si zavolat
    předem.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního webu města, které
    rozhlednu vlastní, a z webu chaty; polohu nese OpenStreetMap.
    Redakce zatím nic neověřila vlastním dotazem ani návštěvou.
