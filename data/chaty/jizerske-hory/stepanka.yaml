    nezávisle: výstavbu zahájil roku 1847 kníže Camille Rohan,
    „dokončil Horský spolek", otevření 1892.
  verified: false
  checked: '2026-08-02'

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Nejstarší rozhledna Jizerských hor stojí na vrcholu Hvězda (959 m)
  nad Kořenovem: stavět se začala už roku 1847, hotová byla po čtyřiceti
  letech čekání v roce 1892. Kamenná věž měří 24 metrů, nahoru vede
  120 schodů, vystoupat se dá celoročně — a u paty stojí kiosek
  s občerstvením.
text:
  - >-
    Štěpánka stojí na vrcholu Hvězda v 959 metrech nad Kořenovem;
    z centra obce k ní vedou zhruba dva kilometry po modré značce.
    Do průvodce ji řadí stejné pravidlo jako Žalý nebo Rašovku:
    rozhoduje občerstvení pro turisty na trase, ne typ stavby — a tady
    stojí hned u věže dřevěný kiosek.
  - >-
    Rodokmen má na rozhlednu výjimečně dlouhý. Stavbu zahájil roku
    1847 kníže Camille Rohan, pak ale věž zůstala
    rozestavěná celé čtyři dekády a dokončení se dočkala až roku 1892,
    kdy ji dotáhl Horský spolek. Právě tím je Štěpánka nejstarší
    rozhlednou Jizerských hor.
  - >-
    Kamenná věž měří 24 metrů a na ochoz vede 120 schodů. Vystoupat se
    dá po celý rok; otvírací dobu kiosku ovšem prameny neuvádějí, takže
    mimo hlavní sezónu počítejte i s tím, že bude zavřeno.
  - >-
    Údaje na téhle stránce pocházejí z webu obce a z krajského
    turistického portálu — na letopočtech i nadmořské výšce se oba
    shodují; polohu nese OpenStreetMap. Redakce zatím nic neověřila
    vlastním dotazem ani návštěvou.
