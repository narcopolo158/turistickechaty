  source: >-
    Jizerky.cz (načteno 2. 8. 2026): „Na tuto jedinečnou stavbu můžete
    vystoupat po celý rok." Vstupné, hodiny kiosku ani kontakt na
    provozovatele prameny neuvádějí — nezapisují se.
  verified: false
  checked: '2026-08-02'

# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1892
milniky:
  - rok: 1847
