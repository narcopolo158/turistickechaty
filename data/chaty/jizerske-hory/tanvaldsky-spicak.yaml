interniPoznamky: >-
  Povýšeno z data/kandidati/jizerske-hory/tanvaldsky-spicak.yaml triáží
  2. 8. 2026 (mandát „pracuj dál samostatně", slíbeno Michalovi po
  křížovém ověření). Klíč: rozhledna s restaurací (rozhodnutí
  28. 7. 2026).

  NEDOLOŽENO (nezapsáno): otvírací hodiny (OSM nese „Jul-Aug:
  10:00-17:00" v rozporu s webovým „denně" — nerozhodnuto), telefon,
  provozovatel, kapacita restaurace. „Vstup zdarma" je claim
  provozovatele z vlastního webu. Vazba na lyžařské středisko Tanvaldský
  Špičák (táž lanovka) — propojit, až bude doložené, že jde o týž vrchol
  a provoz. Pozor na homonymii se Ski Chatou na Špičáku (kandidát
  ski-chata.yaml, 72 m od věže — jiný objekt). Po přidání profilu
  přegenerovat DATA-06 pro jizerske-hory.
