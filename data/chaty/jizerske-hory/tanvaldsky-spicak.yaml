# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Rozhledna z roku 1909 na vrcholu Tanvaldského Špičáku (831 m) nad
  Jiřetínem pod Bukovou. Osmnáctimetrová věž se 69 schody má otevřeno
  denně a vstup zdarma, restaurace s tradiční českou kuchyní funguje
  přímo v rozhledně — a na vrchol se dá vyjet i lanovkou.
text:
  - >-
    Rozhledna stojí na vrcholu Tanvaldského Špičáku v 831 metrech;
    adresou patří k Jiřetínu pod Bukovou, odkud na vrchol vede
    i lanovka. Do průvodce ji řadí totéž pravidlo jako Štěpánku nebo
    Rašovku:
    rozhoduje občerstvení pro turisty na trase — a tady je ho
    požehnaně, restaurace funguje přímo ve věži.
  - >-
    Věž je z těch staletých: stavět se začala v roce 1908 a slavnostně
    se otevřela 4. července 1909. Tradice občerstvení u ní je přitom
    skoro stejně stará jako věž sama — pár let po otevření se poblíž
    objevila bouda, kde místní podnikatelé prodávali lahvové pivo.
    Dnešní podoba je velkorysejší: horská restaurace s tradiční českou
    kuchyní přímo v rozhledně.
  - >-
    Na ochoz osmnáctimetrové věže vede 69 schodů, otevřeno je denně
    a vstup je zdarma. Konkrétní hodiny provozovatel na webu neuvádí —
    kdo to má nahoru daleko, měl by si otevírací dobu ověřit předem.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu rozhledny, z webu
    města a z horského listingu; rok otevření i výška věže se shodují
    ve dvou pramenech, polohu nese OpenStreetMap. Redakce zatím nic
    neověřila vlastním dotazem ani návštěvou.
zdroje:
