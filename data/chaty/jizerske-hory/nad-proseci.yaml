# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná rozhledna z roku 1932 na Prosečském hřebeni mezi Jabloncem
  nad Nisou a Libercem (593 m), se 105 schody na ochoz. Hned vedle
  stojí Chata Proseč s restaurací — nástupkyně chaty z roku 1928, která
  roku 2003 vyhořela a v roce 2018 vyrostla znovu z kamene.
text:
  - >-
    Prosečský hřeben odděluje Jablonec od Liberce a jeho rozhledna
    s chatou jsou učebnicový příklad dvojice, na které tenhle průvodce
    stojí: věž a občerstvení v jednom místě. Turistickou chatu tu roku
    1928 postavil Konrád Hübner a jablonecký Horský spolek k ní v roce
    1932 — od května do srpna — přistavěl rozhlednu z masivních
    žulových kvádrů.
  - >-
    Na ochoz vede 105 schodů; na celkové výšce věže se prameny
    neshodují — jeden uvádí 28 metrů, druhý 24 s ochozem ve dvaceti —
    a my ten spor nerozhodujeme. Výhled z ní obsáhne Jizerské hory,
    Krkonoše i Ještědský hřbet.
  - >-
    Chata vedle věže má pohnutější osud: 3. července 2003 ji kdosi
    zapálil, zničená byla z velké části a nakonec šla k zemi. Nová
    kamenná chata se otevřela v roce 2018 a její restaurace dnes
    nabízí padesát míst uvnitř a dvacet na venkovní terase. Otvírací
    dobu věže ani chaty prameny neuvádějí — před cestou si ji ověřte.
  - >-
    Údaje na téhle stránce pocházejí z krajského turistického katalogu
    a z místopisného průvodce; polohu nese OpenStreetMap. Vlastní web
    chaty se nám zatím nepodařilo načíst. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
