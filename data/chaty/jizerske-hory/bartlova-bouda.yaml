text:
- Bártlova bouda je v katalogu vedená jako turistická / horská chata s celoročním provozem,
  ubytováním i stravováním; nejbližší obcí je Bílý Potok, část pohoří Štolpich.
- OpenStreetMap objekt vede zároveň jako restauraci a penzion a nese u něj regionální kuchyni.
  Otvírací dobu OSM sice uvádí, ale sezonní rozpisy se mění a provozovatel nám je nepotvrdil,
  proto ji na webu neuvádíme.
- Nadmořská výška 520 m je z katalogu; je to připomínka, že do průvodce objekty nezařazuje
  výška, ale role na trase a občerstvení pro veřejnost.
