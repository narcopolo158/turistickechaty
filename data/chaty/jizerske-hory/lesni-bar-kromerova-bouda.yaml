# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Útulna se samoobslužným Lesním barem na křižovatce cest u Protržené
  přehrady na Bílé Desné (818 m). Pití si vezmete z lednice a peníze
  necháte v kase — celé to stojí na důvěře. Přístřešek je volně
  k použití a oficiálně se v něm smí přenocovat.
text:
  - >-
    Krömerova bouda stojí na křižovatce turistických cest u Protržené
    přehrady na Bílé Desné, v nadmořské výšce 818 metrů. Dnešní podoba je
    mladá — útulna se otevřela 22. června 2015 — a jméno nese po starší
    Krömerově boudě, jejíž příběh dosažitelné prameny nevyprávějí, takže
    ho nevyprávíme ani my.
  - >-
    To hlavní je Lesní bar: samoobsluha na kasu důvěry. Vezmete si pití
    z lednice a peníze necháte v malé kase uvnitř — nikdo nekontroluje,
    nikdo neobsluhuje. Otevřeno bývá denně během hlavní letní i zimní
    sezóny, mimo sezónu jen o víkendech.
  - >-
    Přístřešek je zdarma volně k použití, voda teče hned vedle a — což
    je u nás vzácnost — oficiálně se tu smí přenocovat; stanovat kolem
    ovšem ne, objekt leží v chráněném území. Žádné pokoje, žádné
    rezervace: je to útulna v nejpoctivějším smyslu slova.
  - >-
    Údaje na téhle stránce pocházejí ze dvou nezávislých sekundárních
    pramenů; polohu nese OpenStreetMap a oba prameny ji potvrzují na
    metry. Provozovatele prameny nejmenují. Redakce zatím nic neověřila
    vlastním dotazem ani návštěvou — a u kasy důvěry snad ani není co
    dodávat: berte si, plaťte, nezklamte ji.
