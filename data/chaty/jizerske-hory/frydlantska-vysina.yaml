# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Cihlovo-kamenná rozhledna nad Frýdlantem, na čedičovém kopci, kterému
  se říkávalo Resselberg (399 m). Věž měří 21 metrů, na ochoz vede
  100 žulových schodů a hned u ní stojí malé pohostinství. Tohle už
  nejsou hory, ale vyhlídka na Jizerky odsud stojí za zacházku.
text:
  - >-
    Frýdlantská výšina připomíná, že průvodce nedrží nadmořská výška,
    ale role místa na trase: 399 metrů nad mořem je podhůří, jenže věž
    s pohostinstvím nad Frýdlantem je přesně ten cíl výletu, kvůli
    kterému se vyráží. Z města sem vede žlutá značka, od nádraží je to
    zhruba dva a půl kilometru.
  - >-
    Historie má tu klasickou jizerskou zápletku: roku 1890 postavil
    čerstvě založený okrašlovací spolek dřevěnou, patnáct metrů vysokou
    věž, ta ale do roku 1906 zchátrala natolik, že musela k zemi. Na
    jejím místě pak vyrostla dnešní cihlovo-kamenná rozhledna — 21
    metrů, vyhlídková plošina v 18,6 metru, 100 žulových schodů; na
    stavbě se výrazně podílel truhlář Josef Haupt se stavitelem
    Antonínem Dresslerem. Přesný rok dokončení prameny neuvádějí, tak
    ho neuvádíme ani my.
  - >-
    Otevřeno je sezónně — v létě denně kromě pondělí, na jaře a v září
    o víkendech a svátcích; na přesných hodinách se prameny neshodují,
    takže před cestou doporučujeme ověřit. U věže stojí malé
    pohostinství, o jeho provozním režimu ale prameny mlčí.
  - >-
    Údaje na téhle stránce pocházejí z oficiálního webu města
    a z celostátního turistického portálu; polohu nese OpenStreetMap.
    Redakce zatím nic neověřila vlastním dotazem ani návštěvou.
