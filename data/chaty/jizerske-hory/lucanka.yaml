# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská chata v lesích pod rozhlednou Bramberk nad Lučany nad Nisou
  (710 m), s kapacitou 73 lůžek v hlavní budově a srubu. Restauraci má,
  jestli ale obslouží i kolemjdoucího bez noclehu, prameny neříkají —
  před cestou se zeptejte.
text:
  - >-
    Lučanka stojí v chráněné krajinné oblasti uprostřed lesů pod
    rozhlednou Bramberk, v nadmořské výšce 710 metrů; adresou patří
    k Lučanům nad Nisou. Dva prameny se na výšce shodují na metr přesně —
    což je u jizerských objektů vzácnější, než by se slušelo.
  - >-
    Spí se tu na třiasedmdesáti lůžkách: pětašedesát jich je v hlavní
    budově, osm v samostatném srubu. Stravování má rozpětí od „bez
    stravování" po plnou penzi, takže chata míří na pobytové hosty —
    školy, oddíly, rodiny.
  - >-
    Restauraci chata má, ale jednu věc je fér říct rovnou: žádný
    z dosažitelných pramenů neříká, jestli obslouží i turistu, který jde
    jen kolem. Netvrdíme to tedy — kdo míří přes Bramberk a počítá tu
    s obědem, měl by si zavolat předem.
  - >-
    Údaje na téhle stránce pocházejí ze sekundárního ubytovacího listingu
    a z mapových dat; vlastní web chaty existuje, obsah jsme z něj ale
    zatím nečetli. Redakce nic neověřila vlastním dotazem ani návštěvou.
