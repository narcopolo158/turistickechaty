# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1906
overeniHistorie:
  source: >-
    Detail razítka Hubertky na razitkuj.cz (citaci přečetl a dodal Michal
    6. 8. 2026 při potvrzování razítkového páru DATA-05): „Hubertka je
    turistická chata nacházející se ve výšce 621 m n. m. v lesích
    východně od Lázní Libverdy. Postavena byla v roce 1906…" — výška
    i poloha se shodují s katalogem, rok stavby vede jen tento pramen.
  verified: false
  checked: '2026-08-06'
perex: Chata na Tišině u Lázní Libverda v 621 m n. m., postavená roku 1906,
  se sezonním provozem, ubytováním i stravováním. Je také známkovým místem
  č. 1935.
text:
- Hubertku vede katalog jako turistickou / horskou chatu se sezonním provozem; nejbližší obcí
  jsou Lázně Libverda, část pohoří Tišina. Vydavatelův výpis známkových míst ji zná jako č.
  1935 „Chata Hubertka, Jizerské hory“ a uvádí u ní adresu Bílý Potok 370.
- OpenStreetMap objekt vede zároveň jako horskou chatu a restauraci — obojí souhlasí s katalogem,
  který u ní má stravování „ano“. Postavena byla roku 1906; rok stavby vedeme z jediného
  pramene a ověřený není.
- 'Prameny se rozcházejí v obci: katalog uvádí Lázně Libverda, výpis známkových míst Bílý
  Potok. Zapsali jsme údaj z katalogu a rozpor přiznáváme; rozhodne ověření u provozovatele.'
