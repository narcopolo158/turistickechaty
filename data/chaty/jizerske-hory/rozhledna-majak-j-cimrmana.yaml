# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěná rozhledna ve tvaru majáku stojí od roku 2013 v Příchovicích
  u Kořenova (785 m) — na památku „mistrova neomezeného rozhledu".
  Ve spodní části věže sídlí jediné oficiální muzeum Járy Cimrmana,
  u paty láká restaurace s minipivovarem U Čápa a kousek dál kiosek
  Severní pól.
text:
  - >-
    Maják vprostřed hor je přesně ten druh vtipu, jaký by mistr ocenil:
    vztyčily ho roku 2013 Svazek obcí mikroregionu Tanvaldsko
    s Divadlem Járy Cimrmana a nápis na věži oznamuje, že se tak stalo
    „na památku mistrovu neomezenému rozhledu a nehynoucí slávě".
    Borová věž stojí v Příchovicích, části obce Kořenov, pět set metrů
    od centra osady.
  - >-
    Nahoru se stoupá po 105 schodech na plošinu v sedmnácti metrech —
    celá stavba měří i se stožárem necelých čtyřiadvacet metrů —
    a z ochozu se díváte z osmi set metrů nad mořem na Jizerky
    i Krkonoše. Ve spodní části věže sídlí jediné oficiální muzeum
    našeho génia, otevřené spolu s majákem v létě 2013.
  - >-
    Zastávka na trase tu má i praktickou stránku: u rozhledny funguje
    restaurace s vlastním minipivovarem U Čápa a o kousek dál kiosek
    Severní pól. Otevřeno bývá denně od deseti do pěti.
  - >-
    Údaje na téhle stránce pocházejí z krajského katalogu
    a z turistického portálu; polohu nese OpenStreetMap. Vlastní web
    areálu U Čápa se nám zatím nepodařilo načíst. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
