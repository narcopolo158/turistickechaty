perex: Turistická chata na Nové Louce nad Bedřichovem v Jizerských horách. Katalog ji vede
  v 780 m n. m. jako celoročně otevřenou, s ubytováním i stravováním; OpenStreetMap ji má
  zapsanou jako horskou chatu.
text:
- Šámalova chata stojí na Nové Louce, nejbližší obcí je Bedřichov. Nadmořskou
  výšku 780 m i celoroční provoz uvádí týž pramen — v terénu jsme nic z toho neověřili.
- Ubytování i stravování katalog potvrzuje, podrobnosti (kapacita lůžek, otvírací doba kuchyně)
  v něm ale nejsou, takže je neuvádíme ani my. OpenStreetMap objekt vede s tagem horské chaty,
  což potvrzuje charakter, ne rozsah služeb.
- Před cestou doporučujeme provoz ověřit přímo u chaty; redakce ho vlastním dotazem zatím
  nepotvrdila.
