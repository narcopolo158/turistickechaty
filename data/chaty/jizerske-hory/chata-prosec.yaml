# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná chata s restaurací na Prosečském hřebeni mezi Jabloncem
  a Libercem (586 m), přímo vedle rozhledny z roku 1932 — ta má
  otevřeno, když má otevřeno chata. Nástupkyně Hübnerovy chaty z roku
  1928, která v roce 2003 vyhořela; dnešní budova stojí od roku 2018.
  Padesát míst uvnitř, terasa venku a osm lůžek ve dvou apartmá.
text:
  - >-
    Chata Proseč je mladší polovina učebnicové dvojice věž + chata na
    Prosečském hřebeni: turistickou chatu tu roku 1928 postavil Konrád
    Hübner a o čtyři roky později k ní jablonecký Horský spolek
    přistavěl kamennou rozhlednu, která stojí dodnes.
  - >-
    Hübnerova chata ale současnosti nedožila — 3. července 2003 ji
    kdosi zapálil a zbytky šly k zemi. Dnešní kamenná chata se otevřela
    v roce 2018 a roli křižovatky hřebene převzala i s bonusem:
    rozhledna vedle je přístupná právě v jejích provozních hodinách.
  - >-
    Restaurace nabízí padesát míst uvnitř a dvacet na venkovní terase —
    a místní se rádi pochlubí tatarským biftekem. Otevřeno je denně:
    v týdnu do devíti, v pátek a sobotu do deseti, v neděli do osmi
    večer. Přespat se tu dá v osmi lůžkách ve dvou apartmá.
  - >-
    Údaje na téhle stránce pocházejí z jabloneckého infocentra
    a z krajského katalogu; vlastní web chaty se nám zatím nepodařilo
    načíst, takže z něj necitujeme. Polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
