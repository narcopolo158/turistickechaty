# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Výletní restaurace s pětibokou pětadvacetimetrovou věží v podobě
  středověkého hradu, kterou si nad Libercem nechal v letech 1900–1901
  vystavět textilní magnát Heinrich von Liebieg. Dnes tu funguje
  restaurace s hotelem, otevřeno je denně a věž patří k nejsnáze
  dostupným vyhlídkám nad městem.
text:
  - >-
    Liberecká výšina je z těch staveb, které si výletní kulturu přelomu
    století nesou přímo v architektuře: Heinrich von Liebieg si ji
    v letech 1900 až 1901 nechal postavit na vrchu Kovadlina nad
    Libercem jako stylovou výletní restauraci v podobě středověkého
    hradu, s pětibokou věží vysokou 25 metrů.
  - >-
    Dvacáté století s ní nezacházelo v rukavičkách — v šedesátých
    letech prodělala necitlivou přestavbu a v roce 1999 se kvůli
    zchátralosti zavřela úplně. Zachránila ji náročná rekonstrukce
    v letech 2011 až 2013; začátkem roku 2022 prošly modernizací
    i interiéry.
  - >-
    Dnes je to věž a restaurace v jednom objektu: výletní restaurace
    s hotelem a wellness má otevřeno denně od půl jedenácté do deseti
    večer a stejné hodiny platí i pro věž. Kapacitu ubytování prameny
    neuvádějí, takže ji neuvádíme ani my.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu areálu; polohu
    nese OpenStreetMap. Redakce zatím nic neověřila vlastním dotazem
    ani návštěvou — a protože jde převážně o jediný pramen, berte
    letopočty s touto výhradou.
