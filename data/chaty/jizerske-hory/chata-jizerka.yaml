text:
- Osada Jizerka je malá a objektů s jejím jménem vede OpenStreetMap hned několik — zastávku,
  katastrální území i restauraci. Tenhle profil popisuje objekt, který OSM vede jako „Chata
  Jizerka“ a katalog turistických chat pod týmž názvem.
- Katalog uvádí nadmořskou výšku 860 m, nejbližší obec Kořenov a celoroční provoz s ubytováním
  i stravováním. OpenStreetMap k objektu doplňuje regionální kuchyni.
- Vlastní web chaty katalog neuvádí a odkaz z OSM vede na rezervační portál, ne na stránky
  chaty — proto tu kontakt na web nenajdete.
