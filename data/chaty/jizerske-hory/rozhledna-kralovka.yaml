# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná rozhledna z roku 1907 na kopci Nekras (859 m) nad Janovem nad
  Nisou, se 102 schody na ochoz. Věž je součástí areálu s hotelem
  a dvěma restauracemi — samoobslužnou Sluneční terasou a Královskou
  restaurací — takže tu zastávka na hřebenové túře dává smysl v každém
  počasí.
text:
  - >-
    Královka patří k nejnavštěvovanějším místům jizerského hřebene
    a je snadné pochopit proč: kamenná věž z roku 1907 stojí na kopci
    Nekras v 859 metrech, na ochoz vede 102 schodů a otevřeno bývá
    denně od deseti do půl šesté, za příznivých podmínek i déle.
    Kamenné věži předcházela starší dřevěná rozhledna.
  - >-
    Do průvodce ji ale řadí hlavně to, co stojí kolem: k rozhledně byla
    později přistavěna horská chata a dnes je věž součástí areálu
    s hotelem o 84 lůžkách v jednatřiceti pokojích. Hladového turistu
    obslouží samoobslužná restaurace Sluneční terasa v přízemí,
    Královská restaurace v prvním patře, a venku ještě stánek
    s občerstvením.
  - >-
    Údaje na téhle stránce pocházejí ze dvou turistických portálů
    a z krajského katalogu; na výšce kopce se prameny shodují, výšku
    samotné věže žádný z nich neuvádí, takže ji neuvádíme ani my.
    Redakce zatím nic neověřila vlastním dotazem ani návštěvou.
