# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1922
    udalost: >-
      KČT koupil roku 1921 pozemek u vstupu do skal a podle plánů
      architektů Machoně a Vlčka postavil roubenou chatu; do dnešní
      podoby ji roku 1930 rozšířil Ing. Jaroslav Stejskal. Sté
      výročí se slavilo roku 2024 — prameny se v počátku o dva roky
      rozcházejí a rozpor nerozhodujeme.
    zdroj: >-
      vlastní web chata-prachov.cz (čteno 10. 8. 2026) — pozemek
      1921, stavba 1922 (Machoň a Vlček), rozšíření 1930 (Ing.
      Jaroslav Stejskal), „100 let" slaveno 2024; sté výročí v roce
      2024 vedou i články (horydoly.cz „Turistická chata Prachov
      slaví 100 let", Český rozhlas Hradec Králové „Už 100 let
      stojí…").
  - rok: 1991
    udalost: Chata se vrátila Klubu českých turistů.
    zdroj: >-
      vlastní web chata-prachov.cz (čteno 10. 8. 2026) — KČT chatu
      „vlastnit odkupem vrátil v roce 1991".

zajimavosti:
  - text: >-
      Roubená chata stojí přímo u vstupu do skalního města — je to
      jedna z mála prvorepublikových chat KČT, které klubu slouží
      na původním místě a pod původním jménem dodnes.
    kategorie: stari
    zdroj: >-
      poloha u vstupu a vlastnictví KČT: vlastní web + kct.cz (čteno
      10. 8. 2026); formulace „jedna z mála" je redakční opatrnost,
      ne statistika — počet prvorepublikových chat KČT v provozu
      neměříme

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Roubená chata Klubu českých turistů přímo u vstupu do Prachovských
  skal — čtyřicet lůžek, restaurace se samoobslužným pultem, krbový
  salónek a terasa s výhledem do skal. Postavena v první republice,
  od roku 1991 zase klubová, sté výročí oslavila v roce 2024.
text:
  - >-
    Prachovské skály měly to štěstí, že jejich vstupní brána patří
    turistům: KČT tu koupil pozemek už v roce 1921 a podle plánů
    architektů Machoně a Vlčka postavil roubenou chatu, kterou do
    dnešní podoby rozšířil roku 1930 Jaroslav Stejskal. Komunistické
    dekády přečkala v cizích rukou a od roku 1991 patří zase klubu;
    sté výročí se slavilo v roce 2024.
  - >-
    Provoz je stavěný na proud návštěvníků skal: velká restaurace
    se salónkem u krbu, samoobslužný výdejní a výčepní pult pro
    rychlé občerstvení, prosklená veranda a terasa s víc než dvaceti
    stoly. Spí se ve čtyřiceti lůžkách ve třech kategoriích pokojů —
    od klasických po turistickou variantu s vlastním spacákem
    na povlečené posteli, se slevou pro členy KČT.
  - >-
    Český ráj není pohoří a průvodce to netvrdí — ale role chaty je
    tu stejná jako na horách: východisko okruhů skalním městem,
    jistota jídla a noclehu tam, kde končí značky. Právě tímhle
    profilem se sekce Českého ráje otevírá.
  - >-
    Údaje na téhle stránce pocházejí z webů Klubu českých turistů
    a z vlastního webu chaty. Rok stavby se v pramenech o dva roky
    rozchází a rozpor přiznáváme. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
