# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel z roku 1961 na břehu Popradského plesa, sedmá stavba v řadě,
  která začíná Majláthovou chatou Uhorského karpatského spolku. Pět jejích
  předchůdkyň zaniklo požáry a lavinami. Podle dvou pramenů je to
  nejnavštěvovanější celoročně otevřená chata Vysokých Tater.
text:
  - >-
    Horský hotel Popradské pleso stojí ve 1494 metrech na břehu Popradského
    plesa v Mengusovské dolině. Na výšce se prameny neshodnou — pět jich
    uvádí 1494 metrů, dva včetně vlastního webu hotelu 1500; na téhle stránce
    je zapsané to nižší.
  - >-
    Historie místa je jedna z nejdramatičtějších v Tatrách. První dřevěnou
    chatu tu postavil Uhorský karpatský spolok a jmenovala se Majláthova po
    liptovském podžupanovi Vojtechu Majláthovi; prameny ji kladou k roku 1876
    nebo 1879. Vydržela sotva rok — 18. července 1880 shořela, podle jednoho
    pramene rukou sběračů horských bylin. Druhá budova z roku 1881 vyhořela
    roku 1890, třetí přišla roku 1892. Celkem tu mezi lety 1879 a 1897 stálo
    postupně pět chat a všechny zanikly požáry nebo lavinami.
  - >-
    Roku 1897 koupil východní část Mengusovské doliny pruský kníže Kristián
    Kraft Hohenlohe a útulnu u plesa hned nechal zbořit. Šestou chatu tu dal
    postavit až roku 1899, a to na nátlak veřejnosti. Měla čtrnáct pokojů,
    pětatřicet lůžek a prosklenou verandu s letní jídelnou; její nájemce
    Aladár Polnisch z Levoče ji jako první na jižní straně Tater provozoval
    i v zimě. Roku 1921 ji Hohenlohe pronajal Klubu československých turistů,
    který kapacitu vyhnal až na sto padesát lůžek.
  - >-
    Roku 1951 převzal správu Slovakotour a chata dostala jméno Chata kpt.
    Morávku — po veliteli četnické stanice na Štrbském plese a partyzánovi,
    který padl počátkem roku 1945. Dnešní hotel se začal stavět roku 1957
    a o Vánocích 1961 byl předán do provozu se sto deseti lůžky a restaurací
    pro dvě stě lidí. Staré dřevěné budovy asanovali v létě 1962, novější
    přístavba vyhořela 25. října 1964. Původní název se vrátil roku 1990,
    hotel byl privatizován roku 1998.
  - >-
    Dnes je to velký provoz: pokoje od turistického lůžka po pětilůžkové,
    samoobslužná restaurace se sto místy, letní terasa pro dalších sto
    šedesát, Slovenská izba, Forest Bar a venkovní bufet Koliba. Kolik má
    hotel přesně lůžek, prameny neříkají ani přibližně stejně — od 120 po 191;
    vlastní web žádné číslo neuvádí. Že sem může přijít i ten, kdo tu nespí,
    není doslova napsané nikde, ale při čtyřech stech místech u stolu a sto
    dvaceti lůžkách je to nesnadné číst jinak.
  - >-
    Vedle hotelu stojí od roku 2011 replika původní Majláthovy chaty, hrázděná
    stavba, kterou od roku 2006 budoval horolezec Pavol Lazar. Je to
    samostatný objekt s vlastním majitelem, a proto má i vlastní stránku.
  - >-
    Chodí se sem od zastávky tatranské elektrické železnice po modré,
    hodinu po asfaltové cestě lesem, nebo ze Štrbského Plesa po červené
    Tatranské magistrále za hodinu a čtvrt. Zimní varianta vede po zelené,
    protože magistrála obchází lavinové svahy. Autem se nahoru nedostanete —
    vlastní web to říká rovnou: „Prístup vlastným autom k hotelu nie je
    možný", a kdo potřebuje transfer, musí se domluvit předem.
  - >-
    Nad hotelem, v limbovém háji na návrší Limbovec, leží Symbolický cintorín
    — hřbitov obětí Tater s pamětními deskami a ručně vyřezávanými kříži.
    Myšlenku vyslovil roku 1922 malíř Otakar Štáfl, stavět se začalo roku
    1936, kapli podle projektu Róberta Vosyky doplnil zvon s nápisem „Mŕtvym
    na pamiatku - živým na výstrahu!" a vysvěcen byl 11. srpna 1940. Kolik má
    tabulek, prameny neříkají shodně: jedni mluví o více než stu šedesáti
    a padesáti křížích, jiní o třech stech sedmdesáti tabulkách s pěti sty
    jmény a sedmdesáti sedmi křížích.
  - >-
    Údaje nese vlastní web hotelu, tatranskybedeker.sk, nostalgicketatry.sk,
    smnd.sk, hiking.sk, cezhory.sk, vysoketatry.com, tatryportal.sk,
    domalenka.sk, tatry.sk a turisticky.sk; polohu OpenStreetMap. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
