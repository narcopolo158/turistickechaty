# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1961
overeniHistorie:
  source: >-
    ROK 1961 JE ROKEM DNEŠNÍ BUDOVY, a je to sedmá stavba v řadě, která
    začíná v 70. letech 19. století — celá posloupnost je v milnících.
    tatranskybedeker.sk (čteno 9. 8. 2026): „Hotel do prevádzky odovzdali na
    Vianoce roku 1961."; smnd.sk: „Prvý výkop bol slávnostne urobený v roku
    1957, objekt bol dostavaný v roku 1961."
    ROZPOR, přiznaný: hiking.sk uvádí „V roku 1958 vedľa postavili veľký
    horský hotel, ktorý existuje dodnes."
    ARCHITEKTI JEN Z JEDNOHO PRAMENE, a proto to tu stojí opatrně:
    domalenka.sk uvádí „podľa projektov architektov L. Bauera a F. Čapkuna";
    nikdo jiný jména nepotvrzuje a stavební firma není doložena vůbec.
    ROZPOR O PRVNÍ CHATĚ, nesrovnaný: tatranskybedeker.sk klade schválení
    stavby Uhorským karpatským spolkem do roku 1876 a otevření k 4. srpnu
    1876; vysoketatry.com, hiking.sk a cezhory.sk uvádějí rok 1879; smnd.sk
    obojí spojuje — „Chata sa začal stavať v roku 1876… bola dostavaná
    a uvedená do prevádzky v roku 1879."
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1879
    udalost: >-
      U Popradského plesa vyrostla první dřevěná chata Uhorského karpatského
      spolku, zvaná Majláthova po liptovském podžupanovi Vojtechu Majláthovi.
      Prameny se v roce rozcházejí — jeden ji klade už k roku 1876.
    zdroj: >-
      vysoketatry.com (čteno 9. 8. 2026) — „Roku 1879 vyrástla pri Popradskom
      plese prvá neveľká drevená chata Uhorského karpatského spolku, tzv.
      Majláthova chata, ale o rok neskôr vyhorela."; oproti tomu
      tatranskybedeker.sk — „Vďaka popularite Mengusovskej doliny roku 1876
      schválilo predsedníctvo Uhorského karpatského spolku výstavbu
      turistickej chaty pri Popradskom plese."
  - rok: 1880
    udalost: >-
      Chata 18. července celá vyhořela; podle jednoho pramene ji zapálili
      sběrači horských bylin.
    zdroj: >-
      hiking.sk (čteno 9. 8. 2026) — „18. júla 1880 úplne zhorela zrejme
      rukou zberačov horských bylín."
  - rok: 1890
    udalost: >-
      Vyhořela i druhá budova, otevřená roku 1881.
    zdroj: >-
      tatranskybedeker.sk (čteno 9. 8. 2026) — „Roku 1890 vyhorela aj táto
      budova."
  - rok: 1898
    udalost: >-
      Pruský kníže Kristián Kraft Hohenlohe, který o rok dřív koupil východní
      část Mengusovské doliny, dal útulnu u plesa zbořit.
    zdroj: >-
      tatranskybedeker.sk (čteno 9. 8. 2026) — „Na dôkaz toho roku 1898
      zbúral aj útulňu pri Popradskom plese."
  - rok: 1899
    udalost: >-
      Na nátlak veřejnosti dal Hohenlohe postavit na severním břehu plesa
      šestou chatu v pořadí. Měla čtrnáct pokojů a pětatřicet lůžek a její
      nájemce ji jako první na jižní straně Tater provozoval i v zimě.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — „V rokoch 1879-1897 stálo na
      brehu plesa postupne 5 turistických chát… no na nátlak verejnosti už
      v roku 1899 dal postaviť na severnom brehu plesa v poradí šiestu
      chatu."; „V rokoch 1899-1921 mal chatu v prenájme Aladár Polnisch
      z Levoče, ktorý ju ako prvú na južnej strane Tatier prevádzkoval aj
      v zimnej sezóne."
  - rok: 1921
    udalost: >-
      Hohenlohe chatu pronajal Klubu československých turistů, který ji
      rozšířil až na sto padesát lůžek.
    zdroj: >-
      tatranskybedeker.sk (čteno 9. 8. 2026) — „Hohenlohe prenajal roku 1921
      chatu pri Popradskom plese Klubu československých turistov."
  - rok: 1951
    udalost: >-
      Správu převzal Slovakotour a chatu přejmenoval na Chatu kpt. Morávku po
      veliteli četnické stanice na Štrbském plese a partyzánovi, který padl
      počátkem roku 1945.
    zdroj: >-
      tatranskybedeker.sk (čteno 9. 8. 2026) — „Roku 1951, chatu premenovali
      na Chatu kpt. Morávku pri Popradskom plese."; cezhory.sk o Morávkovi —
      „veliteľom žandárskej stanice na Štrbskom plese a partizánom oddielu
      Vysoké Tatry. Padol na Grúniku."
  - rok: 1961
    udalost: >-
      Nový horský hotel, stavěný od roku 1957, byl o Vánocích předán do
      provozu se sto deseti lůžky a restaurací pro dvě stě osob.
    zdroj: >-
      tatranskybedeker.sk (čteno 9. 8. 2026) — „Hotel do prevádzky odovzdali
      na Vianoce roku 1961."; smnd.sk — „Prvý výkop bol slávnostne urobený
      v roku 1957".
  - rok: 1964
    udalost: >-
      Novější zděná přístavba 25. října vyhořela.
    zdroj: >-
      tatranskybedeker.sk (čteno 9. 8. 2026) — „Novšia dostavba vyhorela
      25. októbra 1964."; hiking.sk — „novšia murovaná pristavaná časť
      zhorela pri požiari 25. októbra 1964".
  - rok: 1990
    udalost: >-
      Objektu oficiálně vrátili název Chata pri Popradskom plese; nový
      majitel ho po privatizaci roku 1998 prezentuje jako horský hotel.
    zdroj: >-
      tatranskybedeker.sk (čteno 9. 8. 2026) — „Roku 1990 oficiálne
      prinavrátili objektu názov Chata pri Popradskom plese." a „Chata bola
      sprivatizovaná roku 1998."

