# ── Občerstvení ───────────────────────────────────────────────────────────
kuchyne: ano
typObcerstveni: restaurace
overeniObcerstveni:
  source: >-
    Samoobslužná restaurace je doložená bohatě. tatry.sk rozepisuje provozy:
    hlavní restaurace 100 míst, letní terasa téměř 160, Slovenská izba 40,
    Forest Bar asi 35 a venkovní bufet KOLIBA téměř 60. naturu.sk:
    „Samoobslužná reštaurácia ponúka typické slovenské jedlá ako halušky,
    guláš, kapustnicu, pirohy, ovocné knedle alebo obľúbené buchty na pare."
    miribord.com uvádí „reštaurácia, horolezecký bar, terasa, bufet
    a slovenská izba" (vše čteno 9. 8. 2026).
    VÝSLOVNÁ VĚTA O NEUBYTOVANÝCH CHYBÍ i tady, ale nepoměr je do očí bijící:
    stravovacích míst je při 120 lůžkách kolem čtyř set. U samoobslužné
    restaurace s venkovním bufetem je to prakticky jistota — jenže jistota
    není doklad, a tak se to netvrdí. Telefonát to rozhodne (DATA-04).
    POZORUHODNÉ: u sousední Majláthovy chaty, která stojí padesát metrů
    odsud, výslovná věta doložená JE — miribord.com „Od 6:00 sú k dispozícii
    raňajky aj pre neubytovaných hostí."
  verified: false
  checked: '2026-08-09'

