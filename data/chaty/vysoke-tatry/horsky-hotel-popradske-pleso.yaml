  Povýšeno z data/kandidati/vysoke-tatry/horsky-hotel-popradske-pleso.yaml
  (9. 8. 2026). Druhý objekt oblasti s typem horsky-hotel (po Sliezskem domu).

  VÝŠKA — TADY KONVENCE O NIŽŠÍM ČÍSLE PLATILA V PLNÉ SÍLE, na rozdíl od
  Chaty pri Zelenom plese. Rozdíl je v tom, kdo je na které straně: tady
  vyšší číslo (1500 m) tvrdí provozovatel a nižší (1494 m) pět nezávislých
  pramenů i tag ele v OSM. U Zelenom plese byla drtivá shoda naopak na vyšším
  čísle a nižší nesly jen dvě odlehlé hodnoty. Konvence má chránit před
  nadsazením — a nadsazuje tu provozovatel, takže se použila.

  KAPACITA JE NEJHORŠÍ V CELÉ OBLASTI: 120+20, 128, 132, 165 (čtyři prameny),
  191. Zapsáno 120, protože je to nejnižší pevné číslo a podkroví je podle
  téhož pramene podmíněné. Rozdíl mezi 120 a 191 je ale takový, že tomu
  číslu sám moc nevěřím — patří to na seznam pro DATA-04.

  ARCHITEKTI STOJÍ NA JEDINÉM PRAMENI. domalenka.sk uvádí „L. Bauer
  a F. Čapkun"; nikdo jiný jména nepotvrzuje. Do dat proto nešla jako milník,
  jen do zdůvodnění, a v próze nejsou vůbec.

  SOUSEDNÍ MAJLÁTHOVA CHATA JE SAMOSTATNÝ PROFIL, ne součást tohohle.
  Rozhodlo pravidlo z Kozubové (jedna stavba NEBO jeden provoz, ne blízkost):
  jsou to dvě budovy padesát metrů od sebe, hotel provozuje TatryPEM s. r. o.
  a repliku Majláthovy chaty vlastní horolezec Pavol Lazar. Dvě stavby, dva
  vlastníci → dva profily.

  IRONIE, KTEROU STOJÍ ZA TO SI PAMATOVAT: u velkého hotelu se čtyřmi sty
  místy u stolu chybí věta o obsluze neubytovaných, kdežto u malé repliky
  vedle je doložená doslova („Od 6:00 sú k dispozícii raňajky aj pre
  neubytovaných hostí."). Velikost provozu není důkaz; doklad je doklad.

  NEDOLOŽENO, a nenalezení není vyvrácení: znárodnění (žádný akt ani rok,
  doložen jen přechod na Slovakotour roku 1951); restituce; jméno
  privatizéra z roku 1998 a řetězec vlastníků do dneška; IČO a sídlo
  provozovatele TatryPEM s. r. o. (jediný doklad je patička vlastního webu);
  stavební firma hotelu. Slovenskou ani českou Wikipedii se rešerši
  nepodařilo načíst.
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
