interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/majlathova-chata.yaml (9. 8. 2026).

  PROČ SAMOSTATNÝ PROFIL A NE SLOUČENÍ S HOTELEM. Vzdálenost 106 metrů
  (naměřeno z GPS obou objektů) by sama o sobě sloučení nahrávala, ale
  pravidlo z Kozubové říká: rozhoduje jedna stavba NEBO jeden provoz, ne
  blízkost. Tady jsou dvě samostatné budovy, dva různí majitelé (hotel
  provozuje TatryPEM s. r. o., repliku vlastní horolezec Pavol Lazar) a dvě
  různé webové adresy. Dva profily.

  TENHLE PROFIL JE NEJHŮŘ DOLOŽENÝ Z DVANÁCTI V OBLASTI a nechci to
  zakrývat. Stojí na třech pramenech, z nichž pravda.sk popisuje stav z roku
  2011, tedy patnáct let starý. Vlastní web majlatka.sk se rešerši načíst
  nepodařilo — a to je zároveň nejrychlejší cesta, jak profil doplnit.
  Nevyplněné je proto pole `sezona`: u sousedního hotelu je celoroční provoz
  doložen třemi prameny, ale přenášet ho na jinou budovu s jiným majitelem
  by bylo domýšlení, a to se tu nedělá.

  DRUHÝ DOLOŽENÝ PŘÍPAD OBSLUHY NEUBYTOVANÝCH V OBLASTI (po Sliezskem domu),
  a je to pěkná ukázka toho, že velikost provozu nic nedokazuje: velký hotel
  se čtyřmi sty místy u stolu takovou větu nemá, tahle malá chata ano.

  ROZPOR V KAPACITĚ, nesrovnaný: 14 (pravda.sk) × 15 (miribord.com) ×
  16 (hiking.sk). Zapsáno nejnižší.

  NEDOLOŽENO, a nenalezení není vyvrácení: sezónnost a otevírací doba;
  aktuální chatař (Blaškovci jsou doloženi k roku 2011); přesná výška
  z druhého pramene; kdo repliku projektoval.
  Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
