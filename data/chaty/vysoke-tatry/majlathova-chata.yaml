overeniProvoz:
  source: >-
    SEZÓNNOST A OTEVÍRACÍ DOBA NEJSOU DOLOŽENÉ ANI JEDNÍM PRAMENEM a proto
    tu nejsou zapsané. Doloženo je jen to, že snídaně začínají v šest ráno
    (miribord.com, čteno 9. 8. 2026) a že mezi chatou a údolím jezdí dvakrát
    denně kyvadlová doprava (tamtéž). Vlastní web majlatka.sk se rešerši
