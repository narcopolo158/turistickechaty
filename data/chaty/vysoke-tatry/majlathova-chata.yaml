# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Hrázděná replika chaty, která u Popradského plesa stála v 19. století
  a roku 1880 shořela. Postavil ji od roku 2006 horolezec Pavol Lazar,
  zkolaudovaná byla na konci roku 2010. Nese jméno první chaty, která
  u Popradského plesa stála.
text:
  - >-
    Majláthova chata stojí na břehu Popradského plesa, sto metrů od Horského
    hotelu Popradské pleso. Stojí tu od roku 2010 a nese přitom jméno
    chaty, která u plesa stála jako první — je to totiž replika.
  - >-
    Historická Majláthova chata tu byla první stavbou vůbec. Postavil ji
    Uhorský karpatský spolok, prameny ji kladou k roku 1876 nebo 1879, a už
    18. července 1880 celá shořela. Jmenovala se po Vojtechu Majláthovi,
    liptovském podžupanovi a místopředsedovi Liptovské sekce spolku. Po ní
    následovalo u plesa dalších pět staveb; jejich příběh nese stránka
    sousedního hotelu.
  - >-
    Dnešní hrázděnou repliku začal roku 2006 stavět horolezec Pavol Lazar.
    Zkolaudovaná byla 30. prosince 2010 a provoz začal na začátku roku 2011,
    kdy se po výběrovém řízení stali chataři Katarína a Milan Blaškovci.
  - >-
    Spí se tu ve čtyřech nebo pěti pokojích, prameny uvádějí čtrnáct až
    šestnáct lůžek. Zajímavější je poměr: restaurace má padesát míst uvnitř
    a terasa dvě stě padesát, tedy zhruba dvacetinásobek ubytovací kapacity.
    A tady, na rozdíl od většiny tatranských chat tohohle průvodce, není
    obsluha kolemjdoucích jen pravděpodobná — pramen ji říká doslova: od
    šesti ráno jsou snídaně k dispozici i pro neubytované.
  - >-
    Chodí se sem stejně jako k sousednímu hotelu: hodinu po asfaltové cestě
    od zastávky tatranské elektrické železnice po modré, nebo ze Štrbského
    Plesa po červené magistrále, která je v zimě nahrazená zelenou kvůli
    lavinovým svahům. Mezi chatou a údolím jezdí dvakrát denně kyvadlová
    doprava.
  - >-
    O téhle chatě víme míň než o ostatních v oblasti a je poctivé to říct.
    Vlastní web se nám nepodařilo načíst, takže tu nemáme provozovatelův údaj
    ani o kapacitě, ani o otevírací době, a jestli je chata otevřená
    celoročně, nebo jen v sezóně, neuvádí žádný pramen — a proto to tu
    netvrdíme.
  - >-
    Údaje nesou hiking.sk, pravda.sk, miribord.com, smnd.sk
    a nostalgicketatry.sk; polohu OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
