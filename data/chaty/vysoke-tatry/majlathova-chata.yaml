# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 2010
overeniHistorie:
  source: >-
    NEJMLADŠÍ OBJEKT CELÉ OBLASTI A ZÁROVEŇ NEJSTARŠÍ JMÉNO — je to replika,
    ne pokračování. hiking.sk (čteno 9. 8. 2026): „V 2006 začala výstavba
    pôvodnej Majláthovej chaty ako repliky hrazdeného objektu na podnet
    horolezca Pavla Lazara."; kolaudace 30. prosince 2010, provoz od začátku
    roku 2011.
    Zapsán je rok kolaudace, ne rok zahájení stavby ani rok otevření provozu;
    u letopočtu vzniku volím z rozpětí tu pozdější doloženou událost, která
    znamená hotovou stavbu (stejně jako u Skalnaté chaty — viz KONTROLA-11).
    JMÉNO NESE PO HISTORICKÉ CHATĚ, KTERÁ TU STÁLA OD ROKU 1879 (podle
    jednoho pramene 1876) a shořela 18. července 1880; pojmenovaná byla po
    liptovském podžupanovi a místopředsedovi Liptovské sekce Uhorského
    karpatského spolku Vojtechu Majláthovi (1831–1900). Celá řada šesti chat
    u Popradského plesa je popsaná v profilu horsky-hotel-popradske-pleso.
  verified: false
  checked: '2026-08-09'

