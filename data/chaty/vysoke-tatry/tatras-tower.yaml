# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Ocelová vyhlídková věž z roku 2021 na Štrbském Plese, vysoká 53 metrů,
  s nástupem v 1367 metrech. Provozovatel ji uvádí jako nejvýše položenou
  věž svého druhu v Evropě; část veřejnosti ji od začátku odmítá a osm tisíc
  lidí proti ní podepsalo petici.
text:
  - >-
    Tatras Tower, slovensky Veža snov, stojí v zastavěném území Areálu snov
    v Mlynické dolině na Štrbském Plese, na místě bývalého škvárového hřiště
    pod skokanskými můstky. Nástup na věž je v 1367 metrech, stavba měří
    53 metrů a provozovatel ji uvádí jako nejvýše položenou vyhlídkovou věž
    svého druhu v Evropě.
  - >-
    Konstrukce je z 24 ocelových sloupů s patnáctistupňovým náklonem, po
    kterých se vine 580 metrů dřevěné pochozí lávky — celá trasa je podle
    vlastního webu kompletně bezbariérová. Ve výšce takřka padesáti metrů je
    skleněná lávka a dolů jede 61 metrů dlouhý suchý tobogán za tři eura.
    Navrhla a postavila ji česká firma Taros Nova, dokončeno v říjnu 2020,
    otevřeno 20. dubna 2021.
  - >-
    Kolem žádné jiné stavby tohohle průvodce se nevede tak hlasitý spor
    a nemá smysl to zakrývat.
    Proti stavbě podepsalo roku 2019 petici přes osm tisíc lidí, místní
    o věži mluvili jako o „železné obludě" a šéf TMR Igor Rattaj — jehož
    skupina věž dnes provozuje — řekl, že by ji chtěl dostat z Tater pryč,
    protože se na to místo nehodí. Původní provozovatel skončil v konkurzu
    se závazky přes tři a půl milionu eur a provoz převzala společnost
    Štrbské Pleso resort ze skupiny Tatry mountain resorts.
  - >-
    V přízemí věže je kavárna Tower Cafe. Vstupné je 13 eur na místě
    a 11 eur online, junior a senior 11, děti 10; otevřeno je denně od devíti
    do půl páté, i když jeden pramen uvádí hodiny posunuté o hodinu později.
    Jestli věž jede celoročně, žádný pramen neříká výslovně — nepřímo na to
    ukazuje kluziště, které u ní v zimě funguje.
  - >-
    Přijde se sem pěšky z osady Štrbské Pleso; věž sousedí s dolní stanicí
    sedačkové lanovky na Solisko a prodává se i kombinovaná vstupenka s ní.
    Údaje nesou vlastní web, taros-nova.cz, pravda.sk, teraz.sk, sita.sk,
    startitup.sk, cezhory.sk, strbskepleso.sk a slovago.sk; polohu
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
