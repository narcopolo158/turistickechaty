interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/tatras-tower.yaml (9. 8. 2026).
  Čtvrtá rozhledna korpusu mimo české oblasti a první na Slovensku.

  SPOR O VĚŽ JE V PRÓZE ZÁMĚRNĚ, ne jako bulvár: petice s osmi tisíci
  podpisy, konkurz provozovatele a výrok šéfa TMR („chtěl bych ji dostat
  z Tater pryč") jsou doložené výroky o objektu, který průvodce popisuje,
  a čtenář má právo je znát. Vyváženost drží citace ochranářů („problém
  s ňou nemajú") a fakt, že stojí v zastavěném území.

  SUPERLATIV „nejvýše položená věž svého druhu v Evropě" je zapsán
  s atribucí provozovateli a s klíčovou výhradou „svého druhu" — bez ní by
  tvrzení neplatilo (výš stojí ledacos, včetně lanovkových staveb).

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: otevírací hodiny (9.00–16.30 vlastní
  web × 10.00–17.30 strbskepleso.sk); kapacita (492 × 500); rok
  znovuotevření po konkurzu (cezhory.sk uvádí jen „v sobotu 20. júla" bez
  roku — podle kontextu 2024, ale nedoloženo).

  NEDOLOŽENO, a nenalezení není vyvrácení: jméno architekta (Taros Nova si
  nárokuje i design); výslovný celoroční provoz; vazba MALBOCO LTD z tagu
  OSM; jestli je Tower Cafe přístupná bez vstupenky.
  Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
