# ── Provoz ────────────────────────────────────────────────────────────────
otviraciDoba: denně 9.00–16.30 (vlastní web); strbskepleso.sk uvádí 10.00–17.30
# sezona SE NEVYPLŇUJE: výslovné „celoročně" neuvádí žádný pramen. Nepřímo
# na zimní provoz ukazuje kluziště u věže (tatry.sk) a poznámka, že tobogán
# jede jen při teplotách nad 5 °C — ale nepřímý doklad se nezapisuje.
overeniProvoz:
  source: >-
    Otevírací dobu uvádí vlastní web (čteno 9. 8. 2026): „Pondelok - Piatok
    09:00 - 16:30, Sobota - Nedeľa 09:00 - 16:30". ROZPOR, přiznaný:
    strbskepleso.sk uvádí „denne 10:00 – 17:30, posledný vstup o 16:30".
    Zapsané jsou hodiny provozovatele a odchylka je v poli otviraciDoba
    přiznaná. Vstupné: dospělý 13 € na místě, 11 € online (gopass.travel),
    junior/senior 11 €, děti 10 €; jízda tobogánem 3 € (pravda.sk).
    Vstup i trasa na věž jsou podle vlastního webu „v celej dĺžke kompletne
    bezbariérové".
    PROVOZNÍ HISTORIE JE TU NEOBVYKLE DIVOKÁ: na původního provozovatele
    (High Tatras Tower) vyhlásil prešovský soud konkurz se závazky přes
    3,4 milionu eur dlouhodobě a ještě vyšším číslem krátkodobě
    (startitup.sk); novým nájemcem se stala společnost Štrbské Pleso resort,
    dcera Tatry mountain resorts, a vlastní web dnes uvádí „PREVÁDZKOVATEĽ:
    Tatry mountain resorts, a.s." Znovuotevření po konkurzu proběhlo
    „v sobotu 20. júla" (cezhory.sk; rok v citátu chybí, nejspíš 2024).
  verified: false
  checked: '2026-08-09'

