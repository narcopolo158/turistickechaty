# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 2021
overeniHistorie:
  source: >-
    Stavba dokončena v říjnu 2020 (taros-nova.cz: „Dokončení stavby:
    10/2020"), pro veřejnost otevřena na jaře 2021 — sdetmi.com: „Veža
    Tatras Tower otvára od 20.4.2021!"; sita.sk: „Vyhliadkovú vežu pre
    verejnosť otvorili v roku 2021". Do rokVzniku jde rok otevření
    veřejnosti, stejně jako u Skalnaté chaty a Majláthovy chaty
    (KONTROLA-11: u letopočtu vzniku se volí pozdější doložená událost,
    která znamená hotovou a přístupnou stavbu).
    STAVĚLA ČESKÁ FIRMA: taros-nova.cz — „Stavba je od designu, přes
    konstrukci až po realizaci naším dílem." Samostatný architekt
    nenalezen; investorem byla společnost High Tatras Tower (pravda.sk:
    „Vežu snov, Tower of Dreams, postavila spoločnosť High Tatras Tower.").
    Vazba na MALBOCO LTD z tagu OSM se webově doložit nepodařila.
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 2019
    udalost: >-
      Proti stavbě věže podepsalo petici víc než osm tisíc lidí; stavba
      přesto proběhla, protože stála v zastavěném území areálu a ochranáři
      s ní podle agentury problém neměli.
    zdroj: >-
      pravda.sk (čteno 9. 8. 2026) — „Petíciu proti jej výstavbe v roku 2019
      podpísalo viac ako osemtisíc ľudí"; teraz.sk — „ochranári s ňou však
      problém nemajú".
  - rok: 2021
    udalost: >-
      Věž dokončená v říjnu 2020 se 20. dubna otevřela veřejnosti.
    zdroj: >-
      taros-nova.cz a sdetmi.com (čteno 9. 8. 2026).
  - rok: 2024
    udalost: >-
      Po konkurzu původního provozovatele převzala provoz společnost Štrbské
      Pleso resort ze skupiny Tatry mountain resorts a věž znovu otevřela.
    zdroj: >-
      startitup.sk (čteno 9. 8. 2026) — „Súd v Prešove vyhlásil na
      prevádzkovateľa Veže snov konkurz"; sita.sk — „Novým nájomcom sa stala
      spoločnosť Štrbské Pleso resort, dcérska spoločnosť Tatry mountain
      resorts (TMR)."

# ── Zajímavosti ───────────────────────────────────────────────────────────
zajimavosti:
  - text: >-
      Provozovatel věž uvádí jako nejvýše položenou vyhlídkovou věž svého
      druhu v Evropě — nástup je v 1367 metrech a stavba měří 53 metrů.
    kategorie: vyska
    zdroj: >-
      vlastní web (čteno 9. 8. 2026) — „Najvyššia a najvyššie položená
      veža…"; strbskepleso.sk — „najvyššie položenej vyhliadkovej veže
      svojho druhu v Európe (1 367 m n. m.)".
  - text: >-
      Kolem věže vede 580 metrů dřevěné pochozí lávky na 24 ocelových
      sloupech s patnáctistupňovým náklonem; dolů jede 61 metrů dlouhý suchý
      tobogán a ve výšce takřka 50 metrů je skleněná lávka.
    kategorie: jine
    zdroj: >-
      vlastní web a taros-nova.cz (čteno 9. 8. 2026) — „61 m dlhý suchý
      tobogán so sklonom tubusu 30° a priemerom 0,95m"; strbskepleso.sk ke
      skleněné lávce.
  - text: >-
      Věž od začátku provází spor o to, jestli do Tater patří: místní o ní
      mluvili jako o „železné obludě", český exprezident Zeman ji nazval
      „ohyzdnou rozhľadňou" a šéf TMR Igor Rattaj řekl, že by ji chtěl
      dostat z Tater pryč, protože se na to místo nehodí.
    kategorie: jine
    zdroj: >-
      pravda.sk — „Takáto železná obluda nemá čo na tomto území robiť";
      startitup.sk k Zemanovu výroku; sita.sk — „Chcel by som ju dostať…
      preč z Tatier. Je to atraktívny architektonický počin, ale na toto
      miesto sa nehodí." (vše čteno 9. 8. 2026).
  - text: >-
      Kapacita věže je 492 osob najednou.
    kategorie: velikost
    zdroj: >-
