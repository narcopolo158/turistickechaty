# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1948
overeniHistorie:
  source: >-
    ROK 1948 JE ROKEM DOKONČENÍ DNEŠNÍ BUDOVY. Prameny se shodují na
    projektantovi a rozcházejí v rocích i ve stavebníkovi.
    PROJEKTANT — SHODA: Bogdan Laszczka, uvádějí ho portaltatrzanski.pl,
    portalgorski.pl, polska-org.pl, město Zakopane, odtur.pl i planetagor.pl
    (vše čteno 9. 8. 2026).
    ROKY A STAVEBNÍK — ROZPOR, nesrovnaný: portaltatrzanski.pl „Obecny obiekt
    projektu Bogdana Laszczki został wzniesiony przez Polskie Towarzystwo
    Tatrzańskie (poprzednik PTTK) w latach 1946-1948."; portalgorski.pl klade
    stavbu do týchž let, ale připisuje ji PTTK; polska-org.pl, město Zakopane
    a odtur.pl uvádějí 1947–1948 a PTT; schroniskaturystyczne.pl píše, že ji
    „zbudowali w latach 1947-1948 górale"; planetagor.pl uvádí prostě rok
    1948; klubpodroznikow.com „w roku 1946 powstał szałas a dwa lata później
    powstało schronisko jakie widzimy w obecnej formie". Zapsán je rok
    dokončení, na kterém se shodují všechny varianty.
    PATROCINIUM: „23 sierpnia 2009 r. odbyła się uroczystość nadania budynkowi
    imienia wybitnego działacza turystycznego, Władysława Krygowskiego."
    (portaltatrzanski.pl); Krygowski žil 1906–1998 a byl právník a znalec
    Karpat.
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1910
    udalost: >-
      Na místě stál nejspíš už před tímto rokem lyžařský přístřešek Jerzyho
      Uznańského; roku 1913 ho zničila lavina.
    zdroj: >-
      polska-org.pl (čteno 9. 8. 2026) — „Pierwszy budynek powstał w tym
      miejscu najprawdopodobniej jeszcze przed rokiem 1910. Był to schron
      narciarski Jerzego Uznańskiego, w 1913 roku zniszczony przez lawinę.";
      planetagor.pl uvádí odchylně pastevecký šalaš pronajatý roku 1911
      Lyžařskou sekcí Towarzystwa Tatrzańského.
  - rok: 1933
    udalost: >-
      Na Hali vznikla bacówka, tedy salašnická chatka.
    zdroj: >-
      polska-org.pl (čteno 9. 8. 2026) — „W roku 1933 wzniesiono tu bacówkę."
  - rok: 1948
    udalost: >-
      Dokončena dnešní dřevěná chata podle projektu Bogdana Laszczky.
      Prameny se rozcházejí, zda ji stavěl Polský tatranský spolek, PTTK,
      nebo horalé, a zda od roku 1946, nebo 1947.
    zdroj: >-
      polska-org.pl, portaltatrzanski.pl, portalgorski.pl a město Zakopane
      (čteno 9. 8. 2026).
  - rok: 1950
    udalost: >-
      Budova se rozšířila o další křídlo.
    zdroj: >-
      polska-org.pl (čteno 9. 8. 2026) — „W roku 1950 powiększono go
      o dodatkowe skrzydło."
  - rok: 1953
    udalost: >-
      26. dubna zasáhla chatu kamenná lavina z Długiego Giewontu. Balvan
      o hmotnosti třiceti tun se zaryl do rohu jídelny a je tam k vidění
      dodnes; dva další se zastavily pár metrů od budovy.
    zdroj: >-
      polska-org.pl (čteno 9. 8. 2026) — „26 kwietnia 1953 schronisko zostało
      zniszczone przez kamienną lawinę, która zeszła ze stoków Długiego
      Giewontu. Głaz o masie 30 ton wbił się w narożnik jadalni, dwa inne
      zatrzymały się kilka metrów od budynku."; klubpodroznikow.com —
      balvan „można go oglądać do dziś". planetagor.pl datuje lavinu do roku
      1954.
  - rok: 2009
    udalost: >-
      23. srpna dostala chata jméno po Władysławu Krygowském, znalci Karpat
      a turistickém činovníkovi.
    zdroj: >-
      portaltatrzanski.pl (čteno 9. 8. 2026).
  - rok: 2022
    udalost: >-
      31. května zasahovali hasiči u požáru dřevěného pobití střechy;
      podle pramene byl příčinou nejspíš netěsný komín. Budova se zachránila.
    zdroj: >-
      gov.pl, hlášení Komendy Powiatowej PSP Zakopane (čteno 9. 8. 2026) —
      požár 31. 5. 2022 v 16:31, hořelo „drewnianego poszycia dachowego,
      w budynku schroniska PTTK znajdującego się na Hali Kondratowej";
      tatromaniak.pl — „Przyczyną pożaru był prawdopodobnie nieszczelny
      przewód kominowy" a „budynek schroniska ocalał".
  - rok: 2025
    udalost: >-
      Po generální rekonstrukci zahájené v září 2023 se chata znovu otevřela;
      dostala elektřinu ze sítě místo agregátů, tlakovou kanalizaci a tepelná
      čerpadla, a nová konstrukce byla obložena trámy z rozebrané staré
      budovy.
    zdroj: >-
      naszeszlaki.com.pl (čteno 9. 8. 2026) — znovuotevření 14. června 2025;
      24tp.pl — modernizace od září 2023, kanalizace za „2 102 607,02 zł";
      zakopane.naszemiasto.pl — betonová konstrukce obložená „płazami
      z rozbiórki starego schroniska", tepelná čerpadla, „2,4 miliona
      złotych".

