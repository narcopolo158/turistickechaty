    Vlastní web po rekonstrukci (čteno 9. 8. 2026): snídaně 7.00–10.30, teplá
    kuchyně s jídly z lístku 11.00–20.30, jednohrncová jídla do 21.00, bar
    od pondělí do čtvrtka 7.00–21.00 a od pátku do neděle 7.00–21.30; kuchyně
    nabízí „proste, smaczne i sycące dania" a „tradycyjne potrawy, inspirowane
    kuchnią podhalańską, domową".
    NEJLEPŠÍ NEPŘÍMÝ DOKLAD O NEUBYTOVANÝCH V CELÉM BLOKU:
    schroniskaturystyczne.pl a regiontatry.pl shodně píší „Do dyspozycji
    turystów jest bufet, jadalnia i świetlica, przez całą dobę wydawany jest
    bezpłatny wrzątek." — „turystom", ne hostům, a nepřetržitě. Přímá věta to
    pořád není, ale u chaty s dvaceti lůžky a kuchyní otevřenou do půl deváté
    večer je čtení jednoznačné.
    Poznávacím znamením kuchyně je podle pramene perník: „Znakiem
    rozpoznawczym tutejszej kuchni jest piernik."
