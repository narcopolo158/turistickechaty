overeniNocleh:
  source: >-
    ROZPOR PO REKONSTRUKCI, ZAPSÁNO NIŽŠÍ ČÍSLO (konvence 27. 7. 2026):
    vlastní web (čteno 9. 8. 2026) uvádí po znovuotevření „24 miejsca
    noclegowe w przytulnych, wieloosobowych pokojach urządzonych
    w tradycyjnym, górskim stylu" a naszeszlaki.com.pl to potvrzuje („24
    miejsca noclegowe (przed remontem 20 miejsc)"). Oproti tomu
    portalgorski.pl v článku z 15. dubna 2025, tedy těsně před otevřením,
    píše „Ilość miejsc noclegowych jednak nie uległa zmianie. Nadal na
    turystów będzie czekało 20 łóżek."
    TADY SE PRAVIDLO „PROVOZOVATEL MÁ PŘEDNOST" NEPOUŽILO, i když by u čerstvé
    rekonstrukce dávalo smysl. Důvod: portalgorski.pl výslovně a nezávisle
    tvrdí, že se počet NEZMĚNIL, a to je tvrzení o téže věci v témž čase, ne
    zastaralý údaj. Rozpor pramenů → nižší číslo. Bude potřeba ověřit.
    Před rekonstrukcí uváděly prameny shodně 20 lůžek ve dvou nebo třech
    vícelůžkových pokojích (dva šestilůžkové a jeden osmilůžkový podle města
    Zakopane).
  verified: false
  checked: '2026-08-09'

