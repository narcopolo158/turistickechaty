  Povýšeno z data/kandidati/vysoke-tatry/schronisko-pttk-hala-kondratowa.yaml
  (9. 8. 2026).

  KAPACITA — MÍSTO, KDE JSEM NEDAL PŘEDNOST PROVOZOVATELI, a je to opak
  Zamkovského chaty. Tam prameny popisovaly různé časy (před rekonstrukcí
  a po ní) a provozovatelův údaj vyhrál jako aktuální. Tady portalgorski.pl
  v dubnu 2025, tedy dva měsíce před znovuotevřením, výslovně píše, že se
  počet lůžek NEZMĚNIL a zůstane jich dvacet. To není zastaralý údaj, ale
  protichůdné tvrzení o témž čase — a na to konvence z 27. 7. 2026 platí.
  Zapsáno 20. Je to čtvrtý případ z devíti profilů dneška, kde bylo potřeba
  rozlišit rozpor pramenů od zastaralosti pramene; patří to k KONTROLA-11.

  DRUHÝ PROFIL BLOKU BEZ VYPLNĚNÉ SEZÓNNOSTI (po Roztoce a Majláthově chatě
  třetí celkem). Chata se po dvouleté rekonstrukci otevřela teprve v červnu
  2025 a předrekonstrukční údaj o údržbové přestávce od 15. listopadu do
  26. prosince nemusí platit. Výslovnou větu nemá ani vlastní web.

  SUPERLATIV „NEJMENŠÍ" JE DOLOŽENÝ ŠIROCE, ALE NE OD PTTK. Osm pramenů ho
  uvádí, formulace se ale liší: „najmniejsze schronisko tatrzańskie" ×
  „w polskich Tatrach" × „jedno z najmniejszych" (karta.zakopane.eu). Verze
  „najmniejsze schronisko PTTK" se nikde nenašla — a to je právě ta, na
  kterou jsem se ptal v zadání rešerše. Podruhé v jednom bloku se ukázalo,
  že moje formulace otázky byla přesnější, než co prameny unesou (poprvé
  u patrocinia Murowańce). Do dat proto šla verze s atribucí.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: roky stavby (1946–1948 × 1947–1948 ×
  1948) a stavebník (PTT × PTTK × horalé); datum kamenné laviny (26. 4. 1953
  u tří pramenů × 1954 u planetagor.pl); kapacita (20 × 24); první stavba na
  místě (přístřešek Uznańského před 1910 × pastevecký šalaš pronajatý 1911).

  NEDOLOŽENO, a nenalezení není vyvrácení: jméno současného nájemce — PTTK
  ho podle gazetakrakowska.pl (9. 10. 2024) nezveřejnilo, ví se jen, že
  pochází z tatranského okresu; aktuální ceník po roce 2025; potvrzení
  superlativu přímo od PTTK. Polskou Wikipedii se rešerši nepodařilo načíst
  ani v mobilní verzi (u Roztoky ano, tady ne).
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
