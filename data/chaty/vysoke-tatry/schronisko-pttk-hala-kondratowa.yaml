# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěná chata pod Giewontem z roku 1948, kterou polské prameny shodně
  označují za nejmenší v Tatrách. Roku 1953 se do rohu její jídelny zaryl
  třicetitunový balvan a je tam dodnes. V letech 2023 až 2025 prošla
  generální rekonstrukcí.
text:
  - >-
    Schronisko PTTK na Hali Kondratowej stojí ve 1333 metrech pod Giewontem.
    Na výšce se prameny shodují bez jediné odchylky — a shodují se i na tom,
    že je to nejmenší chata Tater; odtur.pl k tomu dodává i objem, šest set
    krychlových metrů.
  - >-
    Před chatou tu bylo několik pokusů. Nejspíš už před rokem 1910 tu stál
    lyžařský přístřešek Jerzyho Uznańského, který roku 1913 zničila lavina;
    jiný pramen mluví o pasteveckém šalaši pronajatém roku 1911 Lyžařskou
    sekcí Towarzystwa Tatrzańského. Roku 1933 tu vznikla bacówka.
  - >-
    Dnešní dřevěná chata podle projektu Bogdana Laszczky byla dokončena roku
    1948; kdo přesně ji stavěl, se prameny neshodnou — jedni uvádějí Polský
    tatranský spolek, druzí PTTK, třetí prostě horaly. Roku 1950 přibylo
    křídlo.
  - >-
    26. dubna 1953 sešla ze svahů Długiego Giewontu kamenná lavina; balvan o hmotnosti třiceti tun se zaryl do rohu
    jídelny a dva další se zastavily pár metrů od budovy. Balvan tam podle
    pramene zůstal a je k vidění dodnes. Roku 2009 dostala chata jméno po
    Władysławu Krygowském, znalci Karpat, jehož citáty jsou na stěnách.
  - >-
    31. května 2022 hořelo dřevěné pobití střechy — podle hasičů nejspíš od
    netěsného komína. Budova se zachránila, ale 4. září 2023 se chata zavřela
    kvůli generální rekonstrukci. Znovu otevřela 14. června 2025. Dostala
    elektřinu ze sítě místo agregátů, tlakovou kanalizaci a tepelná čerpadla;
    novou konstrukci obložili trámy z rozebrané staré chaty.
  - >-
    Kolik má dnes lůžek, není jisté: vlastní web uvádí čtyřiadvacet, ale
    portalgorski.pl v dubnu 2025 psal, že se počet nezměnil a zůstane jich
    dvacet. Na téhle stránce je zapsané nižší číslo. Kuchyně vaří od jedenácti
    do půl deváté večer, snídaně od sedmi, bar do devíti nebo půl desáté podle
    dne. A o tom, že se tu obslouží i kolemjdoucí, mluví prameny líp než
    kdekoli jinde v Tatrách: „Do dyspozycji turystów jest bufet, jadalnia
    i świetlica, przez całą dobę wydawany jest bezpłatny wrzątek." Poznávacím
    znamením kuchyně je perník.
  - >-
    Chodí se sem z Kuźnic po modré přes Kalatówki, prameny udávají hodinu až
    hodinu a dvacet minut. Odtud vede zelená na Przełęcz pod Kopą Kondracką
    za hodinu dvacet a dál na Giewont zhruba za hodinu tři čtvrtě. Chata leží
    v národním parku: vstup se platí, nocovat se smí jen ve schroniscích
    a psi dovnitř nesmějí.
  - >-
    Jestli je chata otevřená celoročně, poctivě nevíme — výslovnou větu nemá
    ani vlastní web. Před rekonstrukcí byly podle jednoho pramene noclehy
    nedostupné od 15. listopadu do 26. prosince kvůli údržbě, kdy fungoval
    jen bufet a jídelna; jestli to platí i teď, neuvádí nikdo.
  - >-
    Údaje nese vlastní web chaty, portaltatrzanski.pl, portalgorski.pl,
    polska-org.pl, město Zakopane, odtur.pl, schroniskaturystyczne.pl,
    planetagor.pl, klubpodroznikow.com, naszeszlaki.com.pl, 24tp.pl,
    zakopane.naszemiasto.pl, tatromaniak.pl a hlášení hasičů na gov.pl;
    polohu OpenStreetMap. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
