# sezona SE NEVYPLŇUJE: výslovný doklad celoročního provozu chybí a jediný
# pramen k sezónnosti popisuje stav před rekonstrukcí. Viz interniPoznamky.
overeniProvoz:
  source: >-
    VÝSLOVNÁ VĚTA O CELOROČNÍM PROVOZU NENÍ ANI NA VLASTNÍM WEBU, a proto se
    pole `sezona` nevyplňuje. Doloženo je jen tohle: schroniskaturystyczne.pl
    popisuje stav PŘED rekonstrukcí — noclehy nedostupné „od 15 listopada do
    26 grudnia" kvůli údržbě, „Wtedy czynne są bufet i jadalnia." Zda tenhle
    režim platí i po znovuotevření, neuvádí nikdo.
    Chata byla 4. září 2023 uzavřena kvůli generální rekonstrukci
    a znovuotevřena podle naszeszlaki.com.pl 14. června 2025. Telefonní
    kontakt je podle vlastního webu dostupný „od poniedziałku do soboty
    w godzinach 11:00–17:00. W niedziele kontakt telefoniczny w sprawach
    rezerwacji jest niedostępny."
    Chata leží uvnitř Tatrzańského parku narodowého, kde je vstup zpoplatněn,
    nocování mimo schroniska zakázáno a podle mapa-turystyczna.pl platí
    v parku „Zakaz wstępu z psami".
  verified: false
  checked: '2026-08-09'

