# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Vysokohorská chata nad Štrbským Plesom, která roku 1944 vznikla jako zimní
  útulna u prvního elektrického lyžařského vleku na Slovensku. Dnešní budovu
  postavili roku 2003 na místě rozebrané původní. Tři prameny ji označují za
  nejmladší vysokohorskou chatu Vysokých Tater.
text:
  - >-
    Chata pod Soliskom stojí ve 1840 metrech na jihovýchodním svahu Předného
    Soliska nad Štrbským Plesom. Je výš než horní stanice sedačkové lanovky,
    která má 1814 metrů — což je detail, kvůli kterému se údaje o obou
    objektech často pletou.
  - >-
    Vznikla jinak než ostatní tatranské chaty tohohle průvodce: ne jako
    turistická chata, ale jako příslušenství lyžařského vleku. V létě 1943
    daly Štátne kúpele na svahu Soliska postavit první elektricky poháněný
    lyžařský vlek na Slovensku — podle jednoho pramene nejdelší
    v Československu — a hned nato i zimní lyžařskou útulnu. Myšlenka byla
    tehdejšího ředitele Státních lázní Jána Zalčíka, stavbu vedl zaměstnanec
    lázní, aktivní lyžař a závodník František Bujak, který se pak stal prvním
    chatařem. Chatu předali do užívání 6. února 1944, hotová byla až roku
    1946. O rok po otevření ji začali používat partyzáni.
  - >-
    Vlek sloužil do roku 1969, kdy ho kvůli mistrovství světa v klasických
    disciplínách nahradila sedačková lanovka. Od té doby má chata smysl i
    v létě a funguje jako bufet celoročně. Roku 1973 ji převzala Tatranská
    správa účelových zariadení a v roce 2003 přišel zásah, po kterém
    z původní stavby nezbylo nic: chatu rozebrali do základů a na jejím
    místě postavili novou, větší, s terasou a jídelnou. Otevřeli ji 21. prosince 2003.
  - >-
    Spí se tu v izbě Solisko a v devítilůžkové noclehárně; pár kroků od chaty
    stojí ubytovací objekt BIVAC s pěti typy pokojů, který provozovatel
    označuje za nejvýše položené ubytování na sjezdovce v Tatrách. Dohromady
    prameny uvádějí devatenáct pevných a sedmnáct turistických lůžek.
    Restaurace vaří à la carte celý den a má sedmdesát míst — dvojnásobek
    lůžek. Výslovnou větu o obsluze neubytovaných jsme nenašli; pramen
    říká jen „kde si všetci vychutnáte á la carte stravovanie".
  - >-
    Voda je tu zvláštní kapitola: hřebenová poloha ji neudrží, takže se musí
    dovážet — v hlavní sezóně kolem dvou tisíc litrů denně. Zásobování jezdí
    sedačkovou lanovkou. Když se chata roku 1943 stavěla, vozil se materiál
    nahoru na saních tažených vlekem.
  - >-
    A tady je „otevřeno ≠ dostupné" doložené úředně a jmenovitě. Chata má
    otevřeno celoročně od šesti ráno do desíti večer, ale modře značený
    chodník číslo 2836a, který k ní vede od Štrbského Plesa, je podle
    oficiálního seznamu TANAP sezónně uzavřený od 1. listopadu do 31. května.
    Sedm měsíců v roce se sem tedy pěšky po značce nesmí a zbývá lanovka
    Solisko Express — necelých sedm minut a 431 metrů převýšení — nebo v zimě
    sjezdovka. V létě se jde po modré ze Štrbského Plesa, prameny udávají asi
    hodinu a půl a 480 metrů stoupání.
  - >-
    Údaje nese vlastní web chaty, Zväz slovenského lyžovania,
    pamiatkyslovenska.wordpress.com, hiking.sk, portaltatra.sk,
    vysoketatry.com, sdetmi.com, turisticky.sk, tatry.sk, tatryportal.sk,
    skkongres.sk, zapomenute-vleky.cz, hotelpanorama.sk a seznam uzavřených
    chodníků TANAP; polohu OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
