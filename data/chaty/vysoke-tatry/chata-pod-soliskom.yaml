overeniNocleh:
  source: >-
    ZAPSÁNO JE SOUČASNÉ ČÍSLO, NE NEJNIŽŠÍ — a je to rozdíl mezi rozporem
    pramenů a zastaralostí pramene (viz KONTROLA-11). skkongres.sk
    a ubytujtesanaslovensku.sk shodně uvádějí „19 pevných lôžok, 17
    turistických lôžok", tedy 36. Starší prameny nesou 45 (vysoketatry.com),
    11 (hiking.sk), 9 (turisticky.sk, tatry.sk) a 8 (tatryportal.sk) — to
    ale popisují stav před přestavbou z roku 2003 a před vznikem ubytovacího
    objektu BIVAC.
    Skladba podle vlastního webu (čteno 9. 8. 2026): v chatě „izba Solisko"
    a noclehárna s devíti lůžky, pár kroků od chaty pak objekt BIVAC s pěti
    typy pokojů. PŘESNÉ ROZDĚLENÍ MEZI CHATU A BIVAC ŽÁDNÝ PRAMEN NEUVÁDÍ,
    zapsané číslo je součet obou — je to jeden provoz s jednou recepcí
    a jedním ceníkem.
    Ceny: postel v noclehárně 25 €, turistické lůžko v BIVACu s koupelnou
    35 €, izba Solisko 120 €, pokoje BIVAC 155 až 251 € za pokoj a noc.
    Check-in od 16.00, check-out do 10.00.
    ROZPOR O ZVÍŘATECH, nezapsaný: vlastní web má stránku „labkove-pravidla"
    a označuje se za pet friendly, zlavomat.sk naopak uvádí, že mazlíčci
    povoleni nejsou.
  verified: false
  checked: '2026-08-09'

