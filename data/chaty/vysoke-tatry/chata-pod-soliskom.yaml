interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/chata-pod-soliskom.yaml (9. 8. 2026).

  PÁTÝ PŘÍPAD KE KONTROLE-11, A NOVÝ DRUH. Výška má tři hodnoty: 1840 m
  (šest pramenů včetně provozovatele), 1835 m (hiking.sk) a 1830 m
  (tatryportal.sk). Konvence o nižším čísle by mechanicky vedla na 1830.
  Nepoužil jsem ji, a důvod je jiný než u předchozích čtyř případů: obě
  odchylky jsou osamocené a NESHODUJÍ SE ANI SPOLU. Kdyby dva prameny shodně
  tvrdily 1830, byl by to spor dvou verzí a nižší by vyhrálo. Když se
  odchylky rozcházejí i mezi sebou, je to šum, ne konkurenční tvrzení.
  Navrhuji to jako doplněk konvence: rozpor předpokládá DVĚ VERZE, ne tři
  různá čísla.

  BIVAC JE V PROFILU ZAPOČÍTANÝ, A JE TO POUŽITÍ PRAVIDLA Z KOZUBOVÉ.
  Ubytovací objekt BIVAC stojí podle vlastního webu „len pár krokov od
  chaty", je to tedy druhá stavba — ale jeden provoz: jedna recepce, jeden
  ceník, jeden web, a firma BIVAC s. r. o. je zároveň provozovatelem chaty.
  Jeden profil, stejně jako u Morského Oka a Wozowni. Přesné rozdělení lůžek
  mezi chatu a BIVAC ale žádný pramen neuvádí, takže kapacita 36 je součet
  a nedá se z ní vyčíst, kolik lidí spí v samotné chatě.

  ZMĚNA PROVOZOVATELE NENÍ DOLOŽENÁ. Starší prameny shodně uvádějí chataře
  Milana Štefánika (vysoketatry.com, tatry.sk, tatryportal.sk, hiking.sk),
  patička vlastního webu nese „2025 © BIVAC s.r.o." a chata patří do sítě
  PEKYHO. Kdy a jak přechod proběhl, neuvádí nikdo, a proto v profilu není.
  POZORUHODNÁ SHODA JMEN: „Milan Štefánik" figuruje i u chaty Encián na
  Skalnatém plese jako záznam SHS JAMES. Buď je to týž člověk, nebo jeden
  z těch záznamů je chybný — do dat nešlo ani jedno.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: výška (1840 × 1835 × 1830); kapacita
  napříč obdobími (8 × 9 × 11 × 36 × 45); doba obnovy chaty horolezci
  (60. léta × 70. léta); délka a převýšení vleku (2702 m / 506 m ×
  2570 m / 490 m); domácí zvířata (povolena × ne); jízdní doba lanovky
  (necelých 7 min × 15 min).

  NEDOLOŽENO, a nenalezení není vyvrácení: projektant původní chaty ani
  budovy z roku 2003; jakýkoli požár nebo lavina (cíleně hledáno, nic);
  vlastník nemovitosti odlišený od provozovatele. Slovenskou Wikipedii ani
  podstránky vlastního webu (/restauracia/, /ubytovanie/, /menu/) se rešerši
  nepodařilo načíst.
  Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
