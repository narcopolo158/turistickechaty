# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1944
overeniHistorie:
  source: >-
    CHATA VZNIKLA JAKO PŘÍSLUŠENSTVÍ LYŽAŘSKÉHO VLEKU, ne jako turistická
    chata — a to je v tomhle korpusu ojedinělé. Zväz slovenského lyžovania
    (čteno 9. 8. 2026): „Pred osemdesiatimi rokmi, v lete 1943, dali Štátne
    kúpele na svahu predného Soliska nad Štrbským Plesom vybudovať prvý
    elektricky poháňaný lyžiarsky vlek" a „Začiatkom roku 1944 otvorili
    potom na Prednom Solisku vo výške 1 860 metrov nad morom aj zimnú
    lyžiarsku útulňu, ktorej prvým chatárom bol už spomínaný František
    Bujak."
    KDO: podnět dal „vtedajší riaditeľ Štátnych kúpeľov Ján Zalčík", stavbu
    zajistily „hlavne Štátne kúpele na Štrbskom Plese" a vedl ji „zamestnanec
    kúpeľov, popri tom sám aktívny lyžiar, cvičiteľ a pretekár František
    Bujak" (tentýž pramen).
    DATA: hiking.sk uvádí „Chatu odovzdali do užívania 6. februára 1944, no
    úplne bola dokončená až v roku 1946."; vysoketatry.com totéž rozpětí.
    PROJEKTANT NENALEZEN — ani u původní chaty, ani u nové z roku 2003.
    DNEŠNÍ BUDOVA JE Z ROKU 2003 a není to přestavba: pamiatkyslovenska.
    wordpress.com „V roku 2003 bola chata rozmontovaná do základov a na jej
    mieste vybudovaná nová, rozšírená chata s terasou."; hiking.sk datuje
    generální opravu 2002–2003 a slavnostní otevření 21. prosince 2003.
    Do `rokVzniku` šel rok 1944, protože kontinuita jména, místa i provozu
    je doložená a rok 2003 stojí v milnících.
  verified: false
  checked: '2026-08-09'

