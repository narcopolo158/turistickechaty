interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/chata-pri-zelenom-plese.yaml
  (9. 8. 2026).

  VÝŠKA — MÍSTO, KDE JSEM KONVENCI O NIŽŠÍM ČÍSLE NEPOUŽIL, A OTÁZKA PRO
  MICHALA. Konvence z 27. 7. 2026 říká: při rozporu pramenů zapiš nižší číslo
  a přiznej to. Tady jsou v poli tři hodnoty — 1551 m (deset pramenů včetně
  spoluvlastníka KST a provozovatelova webu), 1550 m (domalenka.sk) a 1548 m
  (tag ele v OSM). Mechanicky by vyhrálo 1548. Zapsáno je 1551, protože
  desetinásobná shoda pramenů proti jednomu zaokrouhlení a jednomu
  automaticky odvozenému tagu není podle mě „rozpor pramenů", pro který
  konvence vznikla. Je to ale MŮJ výklad konvence, ne Michalovo rozhodnutí —
  patří to na jeho stůl. Otázka je obecná: má konvence ustoupit drtivé shodě,
  a je tag ele v OSM vůbec pramen ve stejném smyslu jako text?

  OTEVŘENÁ MEZERA, TŘETÍ VE STEJNÉ OBLASTI: obslouží chata i NEUBYTOVANÉ?
  Žádný pramen to neříká výslovně; vlastní web otázku vůbec neřeší. Stejná
  mezera je u Téryho a Zbojníckej chaty — jeden telefonát by uzavřel tři
  profily najednou (DATA-04).

  DOLOŽENÝ PŘÍPAD OPAKU, nezapsaný do dat: ynta.sk popisuje stav z roku 2021,
  kdy se kvůli protipandemickým opatřením v chatě nedalo najíst a jídlo se
  vydávalo jen ven. Je to epizoda, ne trvalý stav, a do profilu proto nešla —
  ale ukazuje, že „teplá kuchyně" a „obslouží kolemjdoucího" nejsou totéž.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: rok stavby (1894 × 1895–1897); jméno
  stavitele (Emil × Juraj Cornél Schwarz); rok návratu názvu (1989 × 1991 ×
  1992); kdo byl Albert Brnčal (učitel tělocviku × horolezecký instruktor ×
  předseda SHZ × letec a partyzánský velitel); požáry (většina pramenů zná
  jen 1890, retromania.sk navíc 1889, 1925 a 1926 — osamocené tvrzení).

  NENALEZENO, a nenalezení není vyvrácení: meteostanice u chaty (observatoř
  je na Skalnatém plese, což je jiné místo); zásobování nosiči (všechny
  prameny popisují motorizované); jakýkoli rekord; otevírací hodiny jídelny.
  Slovenskou ani českou Wikipedii se rešerši nepodařilo načíst.
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
