# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1897
overeniHistorie:
  source: >-
    ROK 1897 JE ROKEM DNEŠNÍ KAMENNÉ BUDOVY, ne první stavby v dolině —
    ta je v milnících. nostalgicketatry.sk (čteno 9. 8. 2026): „Uhorský
    karpatský spolok v rokoch 1895-1897 postavil turistickú chatu"
    a „Slávnostné otvorenie za účasti 59 turistov sa uskutočnilo 27. augusta
    1897."; shodně vlastní web chaty („officially opened in August 27th,
    1897"), smnd.sk („V roku 1895 sa začalo zo stavbou už tretej chaty…
    Otvorená bola v roku 1897.") i retromania.sk.
    ROZPOR V DATACI, přiznaný: portaltatra.sk, hiking.sk a tatryportal.sk
    kladou stavbu k roku 1894. Zapsán je rok otevření doložený čtyřmi prameny
    včetně provozovatele.
    ROZPOR VE JMÉNU STAVITELE, nesrovnaný: nostalgicketatry.sk uvádí projekt
    Henricha Hermanna a realizaci „kežmarský staviteľ Emil Schwarz",
    retromania.sk „Staviteľ Juraj Cornél Schwarz z Kežmarku". Rozměry
    10 × 11 m, zdi 63 cm, náklad 9700 forintů; pojmenována po arciknížeti
    Fridrichu Habsburském, který přispěl 200 korunami; prvním nájemcem byl
    Eduard Forberger.
    Dnešní podobu dala chatě rekonstrukce, kterou smnd.sk datuje 1993–2001.
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1876
    udalost: >-
      Uhorský karpatský spolok postavil na Rakúskej poľane Egidovu chatu,
      první objekt doliny určený turistům; jméno nesla po zakladateli spolku
      Egidovi Berzeviczym.
    zdroj: >-
      vlastní web chaty (čteno 9. 8. 2026) — „The first building in the
      valley intended to be used by tourists was Egid's cottage, standing on
      a »Rakúska poľana«, since 1876."; retromania.sk uvádí dokončení
      26. června 1876 a Egida Berzeviczyho (1835–1906).
  - rok: 1887
    udalost: >-
      Egidovu chatu přenesli na jižní břeh plesa.
    zdroj: >-
      tatry.sk (čteno 9. 8. 2026) — „It relocated to the tarn's southern
      shore in 1887"; shodně vysoketatry.com.
  - rok: 1890
    udalost: >-
      Chata vyhořela; podle jednoho pramene byla zapálena úmyslně, poté co ji
      opakovaně poškozovali pastevci z belianskeho salaša.
    zdroj: >-
      vysoketatry.com (čteno 9. 8. 2026) — „r. 1890 vyhorela."; smnd.sk —
      „Poškodzovali ju pastieri z belianskeho salaša." a „O tri roky zhorela,
      údajne bola zapálená úmyselne."
  - rok: 1897
    udalost: >-
      Uhorský karpatský spolok otevřel 27. srpna za účasti 59 turistů novou
      kamennou chatu, pojmenovanou Fridrichova po arciknížeti Fridrichu
      Habsburském, který na ni přispěl 200 korunami.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — „Slávnostné otvorenie za
      účasti 59 turistov sa uskutočnilo 27. augusta 1897."
  - rok: 1926
    udalost: >-
      Chata dostala srubovou přístavbu na východní straně a přešla na
      celoroční provoz.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — přístavba podle stavitele
      Ing. Oskára Zubera z Kežmarku, chatařem byl Vincent Tardík; smnd.sk —
      „Od roku 1926 je chata otvorená celoročne."
  - rok: 1934
    udalost: >-
      Dřevěná přístavba ze západní strany zvýšila kapacitu na jedenáct pokojů
      a sedmdesát lůžek.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — stavitel Gustáv Maurer
      z Huncoviec podle Zuberových plánů; „Prístavbami vzniklo 11 izieb
      s kapacitou 70 lôžok."
  - rok: 1950
    udalost: >-
      Chatu přejmenovali na Brnčalovu po Albertu Brnčalovi, který 1. srpna
      téhož roku zahynul pod Jastrabím sedlem.
    zdroj: >-
      horydoly.cz (čteno 9. 8. 2026) — „Na jeho počesť premenovali v roku
      1950 Fridrichovu chatu na Brnčalovu chatu"; vysoketatry.com —
      „1.8.1950 ako horolezecký inštruktor zahynul pod Jastrabím sedlom."
  - rok: 1992
    udalost: >-
      Objektu vrátili polohopisný název Chata pri Zelenom plese. Prameny se
      v roce rozcházejí — dva uvádějí 1989 a 1991.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — „V roku 1992 objektu vrátili
      polohopisný názov Chata pri Zelenom plese."; shodně vlastní web chaty,
      horydoly.cz, tatry.sk, sdetmi.com a domalenka.sk. Oproti tomu
      retromania.sk uvádí 1991 a portaltatra.sk rok 1989.
  - rok: 2025
    udalost: >-
      Klub slovenských turistov rozdělil nájemní smlouvy tatranských chat do
      roku 2030; Chatu pri Zelenom plese bude dál provozovat Tomáš Petrík.
    zdroj: >-
      ta3.com, 20. 10. 2025 (čteno 9. 8. 2026) — „Chatu pri Zelenom plese
      bude prevádzkovať Tomáš Petrík"; „Nájomné zmluvy platia do 31. októbra
      2030".

