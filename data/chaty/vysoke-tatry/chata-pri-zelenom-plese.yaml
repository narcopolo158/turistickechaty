# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná chata z roku 1897 na břehu Zeleného plesa pod severní stěnou Malého
  Kežmarského štítu. Postavil ji Uhorský karpatský spolok, čtyřicet dva let
  se jmenovala Brnčalova a od roku 1926 je otevřená celoročně. Vlastní ji
  Klub slovenských turistov se spolkem JAMES.
text:
  - >-
    Chata pri Zelenom plese stojí v 1551 metrech v Dolině Zeleného plesa,
    přímo na břehu jezera, které jí dalo jméno. Nad ní se zvedá severní stěna
    Malého Kežmarského štítu — a je to i praktický údaj: podle chataře na
    chatu od října do března nedopadne ani jeden sluneční paprsek.
  - >-
    Historie místa začíná roku 1876, kdy Uhorský karpatský spolok postavil na
    Rakúskej poľane Egidovu chatu, pojmenovanou po zakladateli spolku Egidovi
    Berzeviczym. Roku 1887 ji přenesli na jižní břeh plesa a roku 1890
    vyhořela; jeden pramen píše, že byla zapálena úmyslně, poté co ji
    opakovaně poškozovali pastevci z belianskeho salaša.
  - >-
    Dnešní kamennou chatu postavil týž spolek v letech 1895 až 1897
    a otevřel ji 27. srpna 1897 za účasti devětapadesáti turistů. Dostala
    jméno Fridrichova po arciknížeti Fridrichu Habsburském, který na ni
    přispěl dvěma sty korunami. Kdo ji stavěl, se prameny neshodnou: oba
    mluví o staviteli Schwarzovi z Kežmarku, ale jeden mu říká Emil a druhý
    Juraj Cornél. Přístavby z let 1926 a 1934 kapacitu zvedly na jedenáct
    pokojů a sedmdesát lůžek a od roku 1926 je chata otevřená celoročně.
  - >-
    Od roku 1950 se čtyřicet dva let jmenovala Brnčalova — po Albertu
    Brnčalovi, který 1. srpna toho roku zahynul pod Jastrabím sedlem. Kým
    přesně byl, prameny popisují různě: učitel tělocviku, horolezecký
    instruktor, předseda Slovenského horolezeckého svazu, v jednom případě
    i letec a partyzánský velitel. Polohopisný název se vrátil roku 1992,
    i když dva prameny uvádějí 1989 a 1991. Přezdívka Brnčalka drží dodnes.
  - >-
    Chata patří Klubu slovenských turistov a Slovenskému horolezeckému spolku
    JAMES; provozuje ji nájemce Tomáš Petrík, kterému KST v říjnu 2025
    prodloužil smlouvu do konce října 2030. Spí se tu po turisticku —
    rezervuje se konkrétní lůžko, ne pokoj, platí se hotově a wi-fi tu není.
  - >-
    Chodí se sem nejčastěji od Bielej vody po žluté, prameny udávají dvě
    a půl až tři hodiny. Dál vedou trasy z Tatranských Matliarů, Tatranské
    Lomnice, Tatranské Kotliny a od Chaty Plesnivec přes Veľké Biele pleso.
    Hřebenová varianta vede po červené magistrále od Skalnatého plesa přes
    Veľkú Svišťovku — ta je ale od 1. listopadu do 31. května uzavřená,
    takže i u celoročně otevřené chaty platí, že „otevřeno" a „dostupné"
    nejsou totéž.
  - >-
    Jestli se tu obslouží i ten, kdo tu nespí, prameny neříkají. Teplá
    kuchyně tu je, bar s čepovaným pivem taky a specialitou jsou parené
    buchty, ale výslovnou větu o neubytovaných jsme nenašli — a tak ji tu
    netvrdíme. Je to stejná mezera jako u Téryho a Zbojníckej chaty.
  - >-
    Údaje nese vlastní web chaty, KST, nostalgicketatry.sk, retromania.sk,
    smnd.sk, vysoketatry.com, hiking.sk, horydoly.cz, modralanovka.sk
    a ta3.com; polohu OpenStreetMap. Redakce nic neověřila vlastním dotazem
    ani návštěvou.
