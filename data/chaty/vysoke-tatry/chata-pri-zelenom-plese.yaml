kapacita: 56
overeniNocleh:
  source: >-
    56 lůžek uvádí shodně vlastní web chaty (čteno 9. 8. 2026) — „The cottage
    accommodates 56 guests in multi-bed rooms." —, dále vysoketatry.com
    („Kapacita: 56 ubytovaných osôb"), hiking.sk, smnd.sk, turisticky.sk,
    horydoly.cz, turistika.cz i krasaslovenska.sk. Bez rozporu.
    Nad rámec toho několik pramenů zmiňuje nouzové spaní ve vlastním spacáku
    (hiking.sk „možné spanie aj na matracoch v prípade vyššej návštevnosti";
    turisticky.sk „je možné spať s vlastným spacákom v neďalekej vykurovanej
    nocľahárni"). tatryportal.sk to sčítá jako „56+27"; do kapacity je
    zapsané jen doložené základní číslo.
    Ubytování je turistická kategorie a rezervuje se konkrétní lůžko, ne
    pokoj (vlastní web). Rezervace jen e-mailem, platba hotově, chata nemá
    wi-fi. Historicky měla po přístavbách roku 1934 „11 izieb s kapacitou
    70 lôžok" (nostalgicketatry.sk).
  verified: false
  checked: '2026-08-09'

# ── Občerstvení ───────────────────────────────────────────────────────────
kuchyne: ano
typObcerstveni: restaurace
overeniObcerstveni:
  source: >-
    Teplá kuchyně je doložená bohatě: turistika.cz vede chatu v kategorii
    „Restaurace s buffetem" se „širokým sortimentem teplých i studených jídel
    a nápojů"; planetslovakia.sk „jedálňou s ponukou teplých jedál, nápojov";
    hiking.sk vypisuje bar s čepovaným pivem, polévku a „varené jedlo podľa
    dennej ponuky"; turisticky.sk zmiňuje jako specialitu parené buchty.
    Chatař Tomáš Petrík pro modralanovka.sk: „Zo zásady robíme všetko
    z čerstvých surovín a sami."
    POZOR NA MEZERU V DOKLADU, stejnou jako u Téryho a Zbojníckej: výslovnou
    větu o tom, že se obslouží i NEUBYTOVANÍ, nemá ani jeden pramen. Nejblíž
    je tatrami.sk — „chata ponúka ubytovanie ale aj bohaté občerstvenie pre
    turistov" — a domalenka.sk, které jídlo staví na první místo a ubytování
    až za ně. Vlastní web otázku vůbec neřeší; popisuje jen snídaně a večeře
    pro ubytované (léto 6.30–8.00 a 19.00, zima 7.00–8.30 a 18.00). Klíč
    zařazení je splněn rolí na trase, ale tvrdit se to nedá — telefonát to
    rozhodne (DATA-04).
  verified: false
  checked: '2026-08-09'

