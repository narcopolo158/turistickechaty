interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/horska-ubytovna-hrebienok.yaml
  (9. 8. 2026).

  NEJTENČÍ PRAMENNÁ ZÁKLADNA MEZI PROFILY OBLASTI — dva textové prameny
  (provozovatel + vysoketatry.com). Povýšení přesto obstojí: poloha na
  klíčovém uzlu je nesporná, provozovatel je doložený a klíč zařazení
  splňuje restaurace mířící na turisty. Profil je ale krátký záměrně —
  tvrdí jen to, co dva prameny unesou, a historie (Legiobanka, Športhotel)
  stojí na jediném prameni, což je v source přiznané.

  KAPACITA 34 JE POČET POKOJŮ, NE LŮŽEK, a je to zapsané jako nejnižší
  doložitelná mez. Provozovatel počet lůžek neuvádí; při dvou- až
  čtyřlůžkové skladbě je skutečnost mezi 68 a 136. Starší údaj 118 lůžek
  (vysoketatry.com) se nedá ověřit pro dnešek. Patří na seznam DATA-04.

  ROK VZNIKU 1928 je rok požáru, po němž Legiobanka stavěla; přesný rok
  dokončení Športhotelu nenalezen. Kdyby se našel, rokVzniku se posune.

  NEDOLOŽENO, a nenalezení není vyvrácení: počet lůžek dnes; hodiny
  restaurace; architekt Športhotelu; co přesně stálo na místě před požárem
  1928 (pramen mluví jen o kontinuitě od konce 18. století); vztah budovy
  k lokalitě Studenopotocké kúpele, kterou popisuje profil Bilíkovy chaty —
  jsou to sousední areály jednoho svahu a prameny je nespojují.
  Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
