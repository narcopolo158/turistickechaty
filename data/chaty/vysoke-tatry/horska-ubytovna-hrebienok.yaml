overeniHistorie:
  source: >-
    ROK 1928 JE ROKEM POŽÁRU, PO KTERÉM VZNIKLA DNEŠNÍ BUDOVA — přesný rok
    dostavby Športhotelu žádný nalezený pramen neuvádí, a proto je
    v milnících jen posloupnost. vysoketatry.com (čteno 9. 8. 2026):
    „História ubytovňy siaha do konca 18. storočia a súvisí s osídľovaním
    najstaršej tatranskej osady Starý Smokovec."; po požáru roku 1928 „dala
    pražská Legiobanka… hotel s reštauráciou Športhotel (predchodca hotela
    Hrebienok)". Rozsáhlá rekonstrukce proběhla roku 1988: „Značný vek
    budovy a nepretržitá prevádzka si v roku 1988 vyžiadala rozsiahlu
    rekonštrukciu."
    Zapsán je rok 1928 jako doložený počátek dnešní stavební etapy; je to
    volba OPATRNĚJŠÍ VARIANTY z rozpětí (stavba následovala po požáru), viz
    KONTROLA-11. Dnes objekt provozuje Tatry mountain resorts pod značkou
    TMR Hotels.
