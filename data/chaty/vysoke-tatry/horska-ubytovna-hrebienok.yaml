# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horská ubytovna přímo nad horní stanicí pozemní lanovky na Hrebienku,
  v budově bývalého Športhotelu, který po požáru roku 1928 postavila pražská
  Legiobanka. Dnes ji provozuje Tatry mountain resorts; restaurace vaří
  kapustnici a buchty pro turisty scházející z hor.
text:
  - >-
    Horská ubytovňa Hrebienok stojí ve 1285 metrech přímo nad horní stanicí
    pozemní lanovky ze Starého Smokovce. Je to jediný nocleh přímo na
    Hrebienku — nástupním uzlu, ze kterého se rozbíhají trasy na Zamkovského,
    Bilíkovu, Téryho a Zbojnícku chatu a ke Studenovodským vodopádům.
  - >-
    Historie místa sahá podle pramene do konce 18. století, k osídlování
    Starého Smokovce, nejstarší tatranské osady. Dnešní budova vznikla po
    požáru roku 1928, kdy tu pražská Legiobanka postavila hotel s restaurací
    Športhotel — předchůdce pozdějšího hotelu Hrebienok. Roku 1988 si stáří
    budovy a nepřetržitý provoz vyžádaly rozsáhlou rekonstrukci.
  - >-
    Dnes objekt provozuje Tatry mountain resorts jako ubytovnu jednoduššího
    standardu: 34 pokojů pro dva až čtyři lidi. Kolik je to přesně lůžek,
    provozovatel neuvádí; starší pramen mluvil o 118 lůžkách a 250 místech
    v restauraci, ale popisoval jinou éru provozu. V budově funguje bar
    a Reštaurácia Hrebienok — provozovatel ji nabízí slovy „po náročnej túre
    si u nás môžete dopriať obľúbenú domácu kapustnicu či sladkú buchtu",
    což míří na turisty z hor, i když výslovnou větu o neubytovaných ani
    tady nikdo nenapsal.
  - >-
    Nahoru jede pozemní lanovka ze Starého Smokovce, pěšky je to asi tři
    čtvrtě hodiny. Sto dvacet dva metrů od ubytovny stojí Bilíkova chata —
    dva noclehy na jednom uzlu, každý s vlastním profilem, protože mají
    různé provozovatele.
  - >-
    Údaje nesou vlastní stránka objektu na tmrhotels.com a vysoketatry.com;
    polohu OpenStreetMap. Web hotelhrebienok.sk, který vede OpenStreetMap,
    už jen přesměrovává na resortní vt.sk. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
