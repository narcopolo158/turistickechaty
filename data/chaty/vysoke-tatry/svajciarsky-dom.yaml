# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Vila ve švýcarském stylu v centru Starého Smokovce, podle evidence památek
  z roku 1865 a od roku 2021 národní kulturní památka. Uvnitř je muzeum
  nosičství, veřejná kavárna Sherpa Caffe a dva apartmány s deseti lůžky.
text:
  - >-
    Švajčiarsky dom stojí v zástavbě Starého Smokovce — osady, kterou
    vysoketatry.com uvádí jako nejstarší v Tatrách — pod Slavkovským štítem. Je to dvoupodlažní vila ve švýcarském
    stylu — odtud jméno — a prezentace objektu ji řadí mezi nejstarší budovy
    Vysokých Tater. Kdy přesně vznikla, se prameny neshodnou: evidence
    památek uvádí rok 1865, vlastní prezentace klade počátky historie už
    k roku 1856. Roku 2021 ji Památkový úřad vyhlásil národní kulturní
    památkou.
  - >-
    Dnes budova slouží třem věcem najednou. Je tu muzeum nosičství —
    expozice o historii tatranských nosičů, tedy tématu, které v téhle
    oblasti nese i Rainerova chata; obě expozice se doplňují. Je tu veřejná
    kavárna Sherpa Caffe, jejíž jméno se na nosiče odvolává taky. A jsou tu
    dva apartmány s vlastními kuchyněmi: deset lůžek a dvě přistýlky ve
    dvou-, tří- a pětilůžkových pokojích s přístupem na verandu, rezervovat
    se dá celý apartmán i jednotlivé pokoje.
  - >-
    Poloha je městská, a právě proto praktická: Starý Smokovec je uzel, ze
    kterého jede pozemní lanovka
    na Hrebienok, elektrická železnice na obě strany Tater i autobusy.
    Před domem jsou dvě parkovací místa a v celé budově bezplatná wi-fi.
  - >-
    Otevírací dobu kavárny ani muzea poctivě neznáme — žádný pramen je
    neuvádí a web kavárny v době psaní nenesl obsah. Telefon ale funguje
    a před návštěvou se vyplatí zavolat.
  - >-
    Údaje nesou prezentace objektu na tatry.sk, evidence památek
    zprostředkovaná webem krizom-krazom.online, zpráva korzár SME
    o vyhlášení památkou a recenze na salkakavy.sk; polohu OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
