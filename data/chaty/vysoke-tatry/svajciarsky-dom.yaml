interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/svajciarsky-dom.yaml (9. 8. 2026)
  na výslovný pokyn Michala („svajciarsky dom povys") — tím je zodpovězená
  otázka č. 8 z deníku 9. 8.: vila v osadě s veřejnou kavárnou do průvodce
  patří.

  WEB KAVÁRNY JE V KONTAKTECH ZÁMĚRNĚ VYNECHANÝ. Prezentace na tatry.sk
  uvádí www.sherpacaffe.sk, ale doména v době rešerše (9. 8. 2026) nesla
  cizí obsah bez vztahu ke kavárně — vypadá to na propadlou a znovu
  obsazenou doménu. Do kontaktů proto šel jen telefon z tatry.sk; kdyby se
  web vrátil, doplnit.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: rok vzniku (1856 „historie" × 1865
  evidence památek — zapsáno 1865, viz KONTROLA-11); číslo popisné
  (č. 7 na tatry.sk × č. 1 v evidenci).

  NEDOLOŽENO, a nenalezení není vyvrácení: stavitel; otevírací doba kavárny
  a muzea; vstupné do muzea; sezónnost; nadmořská výška budovy; kdo objekt
  vlastní a provozuje (fyzická osoba? firma?). Vše na jeden telefonát —
  přidáno na seznam DATA-04.
  Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
