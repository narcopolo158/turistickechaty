interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/schronisko-pttk-w-dolinie-roztoki.yaml
  (9. 8. 2026).

  POLE `sezona` ZŮSTALO PRÁZDNÉ, a je to záměr. U sousedních polských chat
  (Murowaniec, Pięć Stawów) je celoroční provoz doložený výslovně, buď
  ústředím PTTK, nebo vlastním webem. Tady ne: vlastní web má jen otevírací
  hodiny bufetu a poznámku o nedělní přestávce v prázdninách,
  skitourowezakopane.pl naopak píše o sezóně červenec až září plus svátky.
  Přenést celoroční provoz od sousedů by bylo domýšlení. Je to druhý profil
  bloku s nevyplněnou sezónností — první je Majláthova chata.

  ROK VZNIKU JE ROKEM CHATY, NE BUDOVY, a je to výjimka, kterou je potřeba
  vidět. U Morského Oka i u Pięciu Stawów jsem zapsal rok dnešní budovy,
  protože prameny ji datují jednoznačně. Tady se datace dnešní budovy
  rozpadá na čtyři varianty (1911, 1911–1912, 1912, 1913) a jediné pevné
  datum je rok 1876, kdy chata jako instituce vznikla — navíc s doloženou
  kontinuitou jména i místa. Zapsán je proto rok 1876 a rozdíl je popsaný
  v milníku.

  VÝŠKA BEZ ROZPORU JE TU TŘETÍ PŘÍPAD V OBLASTI (po Zamkovského chatě
  a Bilíkově chatě) a stojí za povšimnutí, že vzniká u nižších objektů. Čím
  výš, tím se prameny rozcházejí víc — u Morského Oka jsou čtyři hodnoty.
  Vysvětlení se nabízí (různé měřené body na svahu), ale doložené není.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: rok dnešní budovy (1911 × 1911–1912 ×
  1912 × 1913); kapacita („ponad 70" × 75); datace meziválečných přístaveb
  (polská Wikipedie „w latach 30.", portaltatrzanski.pl „1923-1926 oraz
  1932-1935"); telefon a e-mail (vlastní web uvádí +48 609 001 760
  a +48 600 443 733 a gmail, jiné portály +48 733 275 199
  a biuro@schroniskoroztoka.pl).

  NEDOLOŽENO, a nenalezení není vyvrácení: jméno projektanta dnešní budovy
  (doložen jen dozor Władysława Kulczyńského); jakýkoli požár; návštěva Jana
  Pavla II., kterou zmiňuje jediný slabší pramen (gorydlaciebie.pl)
  a nepotvrzuje ji nikdo jiný — proto v profilu není; výslovná věta o obsluze
  neubytovaných. Vlastnictví je stejně jako u Morského Oka předmětem sporu
  mezi PTTK a národním parkem (rp.pl) a do dat proto nešlo.
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
