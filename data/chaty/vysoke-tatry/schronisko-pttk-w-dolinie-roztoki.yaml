# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1876
overeniHistorie:
  source: >-
    Polská Wikipedie (mobilní verze, čteno 9. 8. 2026): „W 1876 r.
    w Roztoce wybudowano pod kierownictwem ks. Wojciecha Roszka i Leopolda
    Świerza drugie w Tatrach polskich schronisko (po starym schronisku nad
    Morskim Okiem)."; vlastní web — „Budowa pod nadzorem ks. Wojciecha Roszka
    i Leopolda Świerza ukończona została w roku 1876"; portaltatrzanski.pl —
    „Schronisko zostało wybudowane w 1876 r. przez Towarzystwo Tatrzańskie."
    Jméno Wincentyho Pola nese chata od začátku: „Nazwano je imieniem
    Wincentego Pola i postawiono przy drodze do Morskiego Oka z Łysej
    Polany." (polská Wikipedie); portaltatrzanski.pl doplňuje, že Pol byl
    „wybitnego poety, etnografa i geografa".
    ROZPOR V ROCE DNEŠNÍ BUDOVY, nesrovnaný a čtyřnásobný: první chatu roku
    1911 rozebrali („Wskutek dużego zagrożenia dla turystów został rozebrany
    w 1911 r., a obok niego wybudowano wkrótce pod nadzorem Władysława
    Kulczyńskiego dzisiejszy budynek."), ale dnešní budovu prameny datují
    1911–1912 (gorydlaciebie.pl), 1912 (regiontatry.pl) i 1913 (vlastní web,
    natatry.pl, město Zakopane). Zapsán je rok vzniku chaty jako instituce,
    ne rok budovy; rozdíl je tu popsaný.
    PROJEKTANT NENALEZEN: prameny uvádějí jen dozor Władysława Kulczyńského,
    nikoli autora projektu.
  verified: false
  checked: '2026-08-09'

