# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěná chata na polaně Stara Roztoka, druhá postavená v polských Tatrách.
  Towarzystwo Tatrzańskie ji zřídilo roku 1876 a pojmenovalo po Wincentym
  Polovi; dnešní budova je z počátku druhého desetiletí 20. století. Za války
  sloužila jako přechodová stanice pro Poláky prchající do Uher.
text:
  - >-
    Schronisko PTTK w Dolinie Roztoki stojí ve 1031 metrech na polaně Stara
    Roztoka, kousek od Wodogrzmotů Mickiewicza. Na výšce se prameny shodují
    do metru bez jediné odchylky.
  - >-
    Postavilo ji roku 1876 Towarzystwo Tatrzańskie pod vedením kněze Wojciecha
    Roszka a Leopolda Świerze — byla to druhá chata polských Tater, hned po
    staré chatě nad Morskim Okiem. Jméno dostala po Wincentym Polovi,
    básníkovi, etnografovi a geografovi. Mezi prvními hosty byli Walery
    Eljasz-Radzikowski, Tytus Chałubiński a Stanisław Witkiewicz.
  - >-
    Původní budova postupně chátrala, a když začala být pro turisty
    nebezpečná, roku 1911 ji rozebrali. Vedle ní vyrostla pod dozorem
    Władysława Kulczyńského dnešní dřevěná chata; kdy přesně byla hotová,
    prameny neříkají stejně — uvádějí 1911, 1912 i 1913. Jméno projektanta
    nezná žádný z nich.
  - >-
    Za pozornost stojí válečná kapitola. Od října 1939 do února 1940 se
    o opuštěnou
    chatu staral horolezec Tadeusz Pawłowski s manželkou Janinou, sestrou
    Adou Kopczyńskou a Włodzimierzem Gosławským — a chata tehdy sloužila jako
    přechodová stanice pro Poláky prchající přes hory do Uher. Později v ní
    sídlila německá pohraniční stráž, ale budovu válka nezničila.
    V meziválečných letech, za hospodaření rodiny Grabowských, to byla hlavní
    základna polských horolezců, kteří lezli na slovenské straně.
  - >-
    Dnes tu je podle provozovatele „ponad 70" lůžek v pokojích od dvou do
    devíti osob, jiné prameny uvádějí pětasedmdesát. Bufet má otevřeno od
    sedmi ráno do devíti večer, jídelna pojme šedesát lidí, vroucí voda je
    zdarma a kuchyně vaří žur, hřibovou, česnekovou a kwaśnici; závin a perník
    zmiňují prameny jako to, kvůli čemu sem lidé chodí. Chatu vedou od
    listopadu 2008 Anna a Stefan Krupowie z Chochołowa.
  - >-
    Jestli je chata otevřená celoročně, poctivě nevíme. Vlastní web větu
    o celoročním provozu nemá a jeden pramen naopak uvádí sezónu od července
    do září plus svátky. U sousedních chat PTTK je celoroční provoz doložený
    výslovně, tady ne — a domýšlet si to nebudeme.
  - >-
    Chodí se sem z parkoviště na Palenici Białczańské, prameny udávají mezi
    čtyřiceti minutami a hodinou a deseti minutami: nejdřív asi tři kilometry
    po červené k Wodogrzmotům Mickiewicza, tam se přechází na zelenou
    a sestupuje osm set metrů po kamenech. Odtud vede červená k Morskému Oku
    za hodinu a půl a zelená do Doliny Pięciu Stawów za dvě hodiny. Chata
    leží uvnitř národního parku, kde se platí vstup a nocovat se smí jen ve
    schroniscích.
  - >-
    Údaje nese vlastní web chaty, polská Wikipedie, portaltatrzanski.pl,
    natatry.pl, město Zakopane, regiontatry.pl, mynaszlaku.pl
    a apartamenty-gorskie.pl; polohu OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
