  s vlastní otevírací dobou a dva nezávislé prameny to říkají výslovně.
  Je to zatím jediný tatranský objekt korpusu s touto úrovní dokladu.

  SUPERLATIV JE ZÚŽENÝ NA KATEGORII HOTEL, a to i v próze. Provozovatel
  formuluje nejopatrnější variantu: „najvyššie položený hotel s komplexnou
  vybavenosťou na Slovensku". Ostatní prameny (Visit Tatry, dnes24.sk,
  zlavadna.sk, toptrendy.sk) zkracují na „najvyššie položený hotel na
  Slovensku". Do prózy šla verze s atribucí a s výslovným upřesněním, že
  výš stojí Chata pod Rysmi a Téryho chata, protože ynta.sk vede Sliezsky
  dom v žebříčku chat až na osmém místě a klasifikuje ho jako hotel.

  KAPACITA — ROZPOR, KTERÝ SE NEDÁ ZAVŘÍT. 92 / 104 / 110 / 120 / 125 / 130
  podle pramene. Zapsáno 92 (nejnižší, konvence 27. 7. 2026). Nešlo použít
  obvyklé „provozovatel má přednost", protože vlastní web počet lůžek vůbec
  neuvádí — mluví o 44 pokojích a 125 hostech, což je jiná veličina.

  NEDOLOŽENO (nezapsáno): projektant dnešní budovy z roku 1968; jakékoli
  události 1. a 2. světové války; přesná právní forma dnešního vlastnictví
  (vlastní web „člen skupiny Premium Star Hotels", tatryportal.sk
  „Elevation, spol. s r.o.", zlavadna.sk „Premium Star Hotels, a.s.").
