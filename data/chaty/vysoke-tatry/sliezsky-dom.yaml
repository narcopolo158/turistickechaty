    ubytovanie a stravovanie". Protože ani provozovatel sám žádné číslo lůžek
    neuvádí, není tu jeden pramen, kterému by patřila přednost, a rozpor se
    řeší nejnižším doloženým počtem pevných lůžek.
    Vedle hotelových pokojů je tu i turistická ubytovna: vlastní web —
    „priestrannú dvanásťlôžkovú turistickú ubytovňu s vlastnou kúpeľňou",
