    KAPACITA JE V PRAMENECH ROZHÁZENÁ OD 92 DO 130 A ZAPSÁNO JE NEJNIŽŠÍ
    ČÍSLO (konvence 27. 7. 2026). Vlastní web hotelu (čteno 9. 8. 2026) počet
    lůžek vůbec neuvádí, mluví o pokojích a hostech: „Hotel má k dispozícii
