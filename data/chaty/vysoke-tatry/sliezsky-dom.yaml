# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel ve Velické dolině u Velického plesa, který navazuje na řadu
  chat sahající k roku 1871. První Sliezsky dom tu roku 1895 postavila
  Sliezska sekce Uhorského karpatského spolku z Vratislavi; dnešní budova je
  z roku 1968. Turistický bufet obslouží i toho, kdo tu nespí.
text:
  - >-
    Sliezsky dom stojí v 1670 metrech ve Velické dolině, na břehu Velického
    plesa. Je to ze všech objektů tohohle průvodce ve Vysokých Tatrách ten
    nejméně „chatový" — je to hotel se čtyřiceti čtyřmi pokoji, wellness
    a asfaltovou cestou až ke dveřím. Provozovatel o něm píše jako
    o „najvyššie položenom hoteli s komplexnou vybavenosťou na Slovensku"
    a Visit Tatry jako o „the highest-altitude mountain hotel in Slovakia".
    Neznamená to nejvýše položené ubytování v Tatrách: výš stojí Chata pod
    Rysmi i Téryho chata, jen to nejsou hotely.
  - >-
    Místo má neobvykle dlouhou stavební řadu. Roku 1871 tu hospodář Eduard
    Blásy z Popradu-Veľkej postavil kamennou útulnu bez hospodáře, placenou
    z darů návštěvníků Starého Smokovca — první chatu celé Velické doliny.
    Vydržela dva roky, pak ji strhla lavina z Velických Granátů; prameny se
    přou, jestli v březnu 1873, nebo 1874, a jestli stála na západním, nebo
    východním břehu plesa. Zbytky zdí jsou prý vidět dodnes. Roku 1878 přišla
    Hunfalvyho chata Uhorského karpatského spolku a roku 1895 první Sliezsky
    dom.
  - >-
    Ten postavila Sliezska sekce téhož spolku, sídlící ve Vratislavi — odtud
    jméno, které objekt nese dodnes a které se v dobových jazycích psalo jako
    Schlesierhaus, Sziléziai-ház nebo Ślaski Dom. Otevřeli ho 2. června 1895
    za účasti více než sta hostů. Stavěl ho Gustáv Husz, pozemek a materiál
    daroval Pavol Weszter z Veľkého Slavkova. Jestli byla první budova zděná,
    nebo dřevěná, se prameny neshodnou; shodnou se na tom, že byla přízemní,
    protože stavitel podle jednoho z nich tvrdošíjně hájil názor, že jinak by
    trpěla větry z doliny.
  - >-
    V noci z 29. na 30. listopadu 1962 chata celá vyhořela. Dnešní hotel na
    jejím místě funguje od roku 1968 a poslední velkou rekonstrukcí prošel
    v letech 2009 až 2011.
  - >-
    Na jídlo sem může přijít i ten, kdo tu nespí — a to se v tomhle průvodci
    u tatranských objektů nedá napsat často. Vedle hotelové restaurace
    provozuje hotel samostatný bufet Sliezsky domček s vlastní otevírací
    dobou 8.30 až 20.30, který vznikl přestavbou bývalého Klubu horských
    vůdců. Od června do konce září k tomu přibude letní terasa.
  - >-
    Chodí se sem z Tatranské Polianky po zelené, přes Velický most
    a Velickou poľanu; prameny udávají od dvou do necelých tří hodin
    a převýšení kolem 680 metrů. Vede sem i asfaltová cesta, ale je vyhrazená
    pro zásobování a hosty s registrací. Že ani ona není samozřejmost, ukázal
    červenec 2024, kdy ji kvůli podmytému svahu ve výšce asi 1300 metrů
    museli zavřít a zajišťovat osmačtyřiceti mikropiloty.
  - >-
    Zvlášť často se v pramenech připomíná 3. červenec 1995, kdy tu pět hodin
    strávil
    papež Jan Pavel II. Požehnal kříž na svahu nad hotelem, letěl vrtulníkem
    nad Velickou dolinu a členům Horské služby TANAP požehnal cepín a lano.
    Pamětní tabulka je na okružním chodníku kolem plesa.
  - >-
    Kolik má hotel lůžek, poctivě nevíme. Vlastní web žádné číslo neuvádí,
    mluví o 44 pokojích a až 125 hostech; ostatní prameny se pohybují mezi 92
    a 130. Na téhle stránce je zapsané to nejnižší doložené — 92 pevných
    lůžek.
  - >-
    Údaje nese vlastní web hotelu, nostalgicketatry.sk, nazvoslovie.
    tatryblog.sk, vysoketatry.com, tatryportal.sk, turisticky.sk,
    regiontatry.sk, sme.sk a slovensko.sp21.sk; polohu OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
