# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1895
overeniHistorie:
  source: >-
    ROK 1895 JE ROKEM PRVNÍHO SLIEZSKEHO DOMU, NE PRVNÍ STAVBY NA MÍSTĚ ANI
    DNEŠNÍ BUDOVY — obojí je popsáno v milnících. nostalgicketatry.sk (čteno
    9. 8. 2026): „Výstavba započala v roku 1894 a slávnostné otvorenie za
    prítomnosti viac ako 100 hostí sa uskutočnilo 2. júna 1895."; stavitelem
    byl „Gustáv Husz (1847–1918) z Tvarožnej", pozemek a materiál daroval
    „Pavol Weszter Z Veĺkého Slavkova", prvním nájemcem byl Ján Greisiger.
    Stavebníkem byla Sliezska sekce Uhorského karpatského spolku se sídlem ve
    Vratislavi.
    ROZPOR O MATERIÁLU PRVNÍ BUDOVY, nesrovnaný: nostalgicketatry.sk
    „Murovaná prízemná budova s plochou strechou mala kuchyňu, jedáleň a 8
    izieb", kdežto nazvoslovie.tatryblog.sk i vysoketatry.com mluví o
    „prízemnú drevenú budovu". Prameny se liší i v tom, odkud Husz pocházel
    (Tvarožná × Poprad).
    Dnešní budova je z roku 1968 — „Na jeho mieste v roku 1968 dali do
    prevádzky terajší horský hotel" (nostalgicketatry.sk); smnd.sk datuje
    stavbu 1965–1968 a otevření se 130 lůžky. Jméno projektanta dnešní budovy
    neuvádí žádný nalezený pramen.
    Vlastnictví dnes: vlastní web „člen skupiny Premium Star Hotels";
    tatryportal.sk uvádí jako operátora „Elevation, spol. s r.o.".
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1871
    udalost: >-
      U Velického plesa postavil hospodář Eduard Blásy z Popradu-Veľkej
      první chatu Velické doliny, kamennou trojprostorovou útulnu bez
      hospodáře, placenou z darů návštěvníků Starého Smokovca.
    zdroj: >-
      nazvoslovie.tatryblog.sk (čteno 9. 8. 2026) — „skromnú trojpriestorovú
      kamennú útulňu bez hospodára"; sk.unionpedia.org: „Blásyho chata bola
      prvou chatou, ktorá stála vo Velickej doline vo Vysokých Tatrách."
  - rok: 1873
    udalost: >-
      Blásyho chatu strhla sněhová lavina z Velických Granátů; zbytky zdí
      jsou podle pramene vidět dodnes. Prameny se v roce rozcházejí — jeden
      uvádí březen 1874 a chatu klade na druhý břeh plesa.
    zdroj: >-
      nazvoslovie.tatryblog.sk (čteno 9. 8. 2026) — „Už v marci 1873 ju
      zničila snehová lavína z Velických Granátov. Pozostatky múrov vidno
      ešte dodnes."; oproti tomu vysoketatry.com — „Prvá kamenná chatka
      z roku 1871 stála na východnom brehu Velického plesa. V marci 1874 ju
      zmietla snehová lavína."
  - rok: 1878
    udalost: >-
      Uhorský karpatský spolok postavil na Vyšné velické poľane Hunfalvyho
      chatu, pojmenovanou po Jánu Hunfalvym. Sloužila do roku 1895, kdy ji
      nahradil Sliezsky dom; roku 1913 vyhořela.
    zdroj: >-
      nazvoslovie.tatryblog.sk (čteno 9. 8. 2026); požár 1913 uvádí
      portaltatra.sk.
  - rok: 1895
    udalost: >-
      Sliezska sekce Uhorského karpatského spolku se sídlem ve Vratislavi
      otevřela 2. června za účasti více než sta hostů první Sliezsky dom;
      postavil ho stavitel Gustáv Husz, pozemek a materiál daroval Pavol
      Weszter z Veľkého Slavkova.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — „slávnostné otvorenie za
      prítomnosti viac ako 100 hostí sa uskutočnilo 2. júna 1895."
  - rok: 1929
    udalost: >-
      Sliezsky dom má vlastní elektrárnu.
    zdroj: >-
      nazvoslovie.tatryblog.sk (čteno 9. 8. 2026) — „Po otvorení Sliezskeho
      domu mal od roku 1929 vlastnú elektráreň."
  - rok: 1962
    udalost: >-
      Chata s více než stolůžkovou kapacitou v noci z 29. na 30. listopadu
      celá vyhořela.
    zdroj: >-
      nazvoslovie.tatryblog.sk (čteno 9. 8. 2026) — „Vynovená chata s vyše
      stolôžkovou kapacitou celkom vyhorela v noci z 29. na 30. 11. 1962.";
      shodně nostalgicketatry.sk.
  - rok: 1968
    udalost: >-
      Na místě vyhořelé chaty byl uveden do provozu dnešní horský hotel.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — „Na jeho mieste v roku 1968
      dali do prevádzky terajší horský hotel"; smnd.sk datuje stavbu
      1965–1968 a otevření se 130 lůžky.
  - rok: 1995
    udalost: >-
      Na Sliezskem domě strávil při své druhé návštěvě Slovenska pět hodin
      papež Jan Pavel II.; požehnal kříž na svahu u hotelu a členům Horské
      služby TANAP cepín a lano.
    zdroj: >-
      regiontatry.sk (čteno 9. 8. 2026) — pobyt 3. 7. 1995, pět hodin,
      požehnání kříže, vyhlídkový let vrtulníkem, podpis do kroniky;
      tatryportal.sk — „počas pobytu posvätil horolezecký čakan a lano."
  - rok: 2011
    udalost: >-
      Hotel dokončil kompletní rekonstrukci zahájenou roku 2009.
    zdroj: >-
      vlastní web hotelu (čteno 9. 8. 2026) — „Sliezsky dom prešiel v rokoch
      2009 až 2011 kompletnou rekonštrukciou."

