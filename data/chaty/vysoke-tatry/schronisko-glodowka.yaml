    a tvarohový koláč. portaltatrzanski.pl uvádí „bufet, kuchnię z jadalnią".
    Restaurace má vlastní veřejnou prezentaci s otevírací dobou 8.00–21.00
    a bufetovým servisem „a large selection of dishes without long waiting
    times" (schronisko-glodowka.eatbu.com).
