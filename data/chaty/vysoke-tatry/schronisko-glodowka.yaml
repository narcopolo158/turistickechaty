# ── Nocleh ────────────────────────────────────────────────────────────────
nocleh: ano
kapacita: 90
overeniNocleh:
  source: >-
    Vlastní web chaty (čteno 9. 8. 2026): „Do dyspozycji naszych gości jest
    90 miejsc noclegowych w dwóch budynkach (Murowaniec i Drewniak)";
    shodně portaltatrzanski.pl.
    ROZPOR, přiznaný: web provozující nadace uvádí „Do dyspozycji naszych
    gości jest 100 miejsc noclegowych w dwóch budynkach (Murowaniec
    i Drewniak)."; campingmapa.pl rozepisuje 48 lůžek v Murowańci a 50
    v Drewniaku, tedy 98. Zapsáno je číslo z vlastního webu chaty, které je
    zároveň nejnižší — konvence i pravidlo „provozovatel má přednost" tu
    vedou na totéž.
    Dvě budovy podle vlastního webu: Murowaniec „nocleg v pokoju o standardzie
    schroniska" se společnými koupelnami a Drewniak „w pokoju o podwyższonym
    standardzie" s koupelnou v pokoji nebo na chodbě; nabízí se i „Nocleg
    w Camperze". Místní poplatek 2 zł: „Opłata pobierana jest od osób
    fizycznych od drugiej doby pobytu". V létě se dá vedle objektu stanovat
    (portaltatrzanski.pl); campingmapa.pl uvádí tábořiště pro asi sto osob.
    Historicky měla první budova z roku 1934 jedenáct ložnic až pro sto hostů
    (polska-org.pl).
  verified: false
  checked: '2026-08-09'

