    TŘETÍ POLSKÝ OBJEKT KORPUSU S TÉMĚŘ PŘÍMÝM DOKLADEM: web provozující
    nadace (čteno 9. 8. 2026) — „Na co dzień funkcjonuje u nas także
    restauracja. Polecamy m.in. kawę z pysznym ciachem na tarasie widokowym,
