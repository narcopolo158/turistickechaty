# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Schronisko Związku Harcerstwa Polskiego na Polaně Głodówka nad Bukowinou
  Tatrzańskou. Vzniklo roku 1934 jako dům pro studenty varšavské akademie
  výtvarných umění podle záměru Karola Stryjeńského, roku 1938 vyhořelo
  a kamennou náhradu otevřela až válka. Slavné je panoramatem Tater.
text:
  - >-
    Schronisko Głodówka stojí zhruba ve 1130 metrech na Polaně Głodówka, na
    jižním svahu Cyrhle nad Białkou. Přesnou výšku vlastní web neuvádí
    a prameny se liší — 1138, 1130, nebo 1120 metrů podle toho, koho se
    zeptáte.
  - >-
    Objekt nevznikl jako horská chata. Karol Stryjeński, ředitel zakopanské
    Školy dřevozpracujícího průmyslu a autor projektu třetí chaty v Dolině
    Pięciu Stawów, navrhl ve dvacátých letech postavit tu dům pro studenty
    varšavské Akademie výtvarných umění. Sám se toho nedožil — zemřel roku
    1932 — a záměr uskutečnili jeho přátelé z Towarzystwa Przyjaciół Akademii
    Sztuk Pięknych. Třípodlažní budovu ze smrkových trámů s kamenným přízemím
    a jedenácti ložnicemi otevřeli 25. února 1934 a dodnes nese druhé jméno
    Dom Artystów im. Karola Stryjeńskiego.
  - >-
    Umělecký provoz dlouho nevydržel: po roce návštěvnost klesla a v polovině
    roku 1935 přešla správa na Urząd Wychowania Fizycznego a odtud na Związek
    Harcerstwa Polskiego, který tu od zimní sezóny pořádal skautské výcvikové
    tábory a lyžařské kurzy. Roku 1936 byla podle německé Wikipedie budova
    přestavěna a 15. října znovu otevřena za účasti prezidenta Ignacyho
    Moścického.
  - >-
    28. února 1938 kolem první hodiny v noci vypukl od přehřátých kamen požár
    a celou budovu zničil. Novou, kamennou, podle projektu inženýra Jerzyho
    Żukowského postavili z pojistky a veřejných sbírek asi za rok a půl —
    a slavnostní otevření plánované na 1. září 1939 překazil začátek války.
    Za okupace tu Němci měli stanoviště pohraniční stráže. Skautům se objekt
    vrátil roku 1957. V osmdesátých letech k němu přibyla druhá, dřevěná
    budova zvaná Drewniak.
  - >-
    Dnes je Głodówka majetkem Związku Harcerstwa Polskiego a od 1. prosince
    2021 ji provozuje Fundacja Kształcenia, Wypoczynku i Rekreacji z Krakova.
    Rozhodnutím maršálka Malopolského vojvodství z 9. listopadu 2022 byla
    úředně zařazena mezi schroniska — což je u tohohle průvodce vzácný případ,
    kdy status objektu potvrzuje správní akt, ne jen zvyk.
  - >-
    Spí se tu podle vlastního webu v devadesáti místech ve dvou budovách:
    Murowaniec má standard schroniska se společnými koupelnami, Drewniak
    vyšší standard. V létě se dá vedle objektu stanovat. Karczma góralska
    vaří kwaśnici, oscypek, bramboráky a „placek po zbójnicku" a má otevřeno
    od osmi ráno do devíti večer. Provozující nadace píše, že „na co dzień
    funkcjonuje u nas także restauracja" a doporučuje kávu se zákuskem na
    vyhlídkové terase — což je popis běžného veřejného provozu, i když
    výslovnou větu o neubytovaných ani tady nikdo nenapsal.
  - >-
    Hlavní důvod, proč sem lidé jezdí, je výhled. Kolik kilometrů tatranského
    hřebene odsud je vidět, se prameny neshodnou: vlastní web i provozující
    nadace mluví o pětačtyřiceti, tři jiné prameny o šestasedmdesáti.
    Jmenují se Kieżmarski, Lodowy, Gerlach, Ganek, Wysoka, Rysy
    a Mięguszowiecki. Že to místo mělo pověst dávno, dokládá Walery
    Eljasz-Radzikowski, který už roku 1874 napsal, že „znikąd się one
    wspanialej nie przedstawiają".
  - >-
    Přijede se sem autem po silnici DW 960 z Bukowiny Tatrzańské směrem na
    Łysou Polanu, asi dvacet kilometrů od Zakopaného, a u objektu je
    parkoviště. Značené turistické trasy, které by sem vedly, žádný z pramenů
    neuvádí. Objekt zároveň leží mimo Tatrzański park narodowy — na Pogórzu
    Spisko-Gubałowském, které s parkem jen sousedí —, takže se tu neplatí
    vstupné a neplatí ani zákaz nocování mimo schroniska.
  - >-
    Údaje nese vlastní web chaty, web provozující nadace, portaltatrzanski.pl,
    polska-org.pl, krajoznawcy.info.pl, německá Wikipedie, campingmapa.pl,
    mynaszlaku.pl, motopodhale.info, z-ne.pl, willamajerczyk.com,
    znaczki-turystyczne.pl a veřejná stránka restaurace; polohu
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
