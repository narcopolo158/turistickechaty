interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/schronisko-glodowka.yaml
  (9. 8. 2026).

  DVĚ VĚCI, KTERÉ TENHLE PROFIL DĚLAJÍ SPORNÝM, A OBĚ PATŘÍ MICHALOVI.

  (1) ROZSAH OBLASTI. Objekt neleží v Tatrách. portaltatrzanski.pl ho klade
  „pod szczytem o nazwie Cyrla nad Białką na Pogórzu Spisko-Gubałowskim",
  tedy do jiné geomorfologické jednotky, a leží i mimo Tatrzański park
  narodowy — mynaszlaku.pl píše, že polana s parkem jen sousedí. Do okna
  oblasti `vysoke-tatry` padl proto, že okno je obdélník. Pro zařazení mluví,
  že objekt je úředně schronisko górskie, že se celý jeho smysl točí kolem
  výhledu NA Tatry a že precedens pro rozhodování „podle toho, jak se chodí"
  místo podle geomorfologie je Michalův vlastní (Javorníky, Góry
  Bystrzyckie). Proti mluví, že Pogórze je samostatná jednotka a že takhle
  by okno mohlo nabrat i další podhorské objekty.

  (2) ROLE NA TRASE. Žádný pramen neuvádí značenou turistickou trasu, která
  by sem vedla — popisují výhradně příjezd po silnici DW 960 a parkoviště.
  Klíč zařazení má dvě části, role na trase a občerstvení pro veřejnost;
  druhá je splněná dobře, první slabě. Nejbližší srovnatelný případ
  v korpusu je odložená wieża widokowa v Mirsku, u které se stejná otázka
  nechala Michalovi. Tady jsem se rozhodl objekt povýšit, protože je to
  úředně zařazené horské schronisko s devadesáti lůžky a veřejnou karczmou,
  ne městská věž — ale rozhodnutí je moje a dá se zvrátit bez ztráty
  (stačí soubor přesunout zpět mezi kandidáty).

  VÝŠKA — ŠESTÝ PŘÍPAD KE KONTROLE-11. Vlastní web výšku neuvádí vůbec,
  takže „provozovatel má přednost" nemá na co sáhnout. Zůstávají 1138 m
  (krajoznawcy.info.pl, výslovně o budově) a 1130 m (německá Wikipedie);
  tag `ele` v OSM nese 1120 m. Zapsáno 1130 jako nižší ze dvou textových
  pramenů. Tag v OSM jsem znovu nebral jako konkurenční tvrzení, stejně
  jako u Chaty pri Zelenom plese — ale je to podruhé, co tohle pravidlo
  používám, aniž bych ho měl potvrzené.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: výška (1120 × 1130 × 1138, u polany
  1000 × 1100–1150); kapacita (90 × 98 × 100); datace kamenné budovy
  (1936 × 1938–1939); šířka panoramatu (45 × 76 km — rozdíl je natolik
  velký, že jedno z čísel bude nejspíš měřené jinak, ale doloženo to není);
  provozovatel před rokem 2021 (Fundacja Harcerstwa Polskiego od 2005 podle
  campingmapa.pl, od ledna 2006 podle polska-org.pl).

  NEDOLOŽENO, a nenalezení není vyvrácení: projektant první, dřevěné budovy;
  značené trasy k objektu; sezónní rozpis otevírací doby schroniska (zapsaná
  doba je restaurační). Polskou Wikipedii se rešerši nepodařilo načíst; údaj
  o výšce 1120 m z tagu OSM nepotvrdil žádný webový pramen.
  Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
