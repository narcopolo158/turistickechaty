# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1934
overeniHistorie:
  source: >-
    OBJEKT NEVZNIKL JAKO HORSKÁ CHATA, ALE JAKO DŮM PRO UMĚLCE — a nese
    dodnes i druhé jméno Dom Artystów im. Karola Stryjeńskiego.
    polska-org.pl (čteno 9. 8. 2026): Karol Stryjeński navrhl ve dvacátých
    letech vznik domu pro studenty varšavské Akademie výtvarných umění; po
    jeho smrti roku 1932 záměr uskutečnili přátelé z varšavského Towarzystwa
    Przyjaciół Akademii Sztuk Pięknych, vznikl stavební výbor s finanční
    podporou Państwowego Urzędu Wychowania Fizycznego. „Uroczyste oddanie
    budynku do użytku nastąpiło 25 lutego 1934r." Šlo o „3-piętrowy budynek
    z belek świerkowych i kamiennym parterem" s jedenácti ložnicemi až pro
    sto hostů. Shodně portaltatrzanski.pl.
    PROJEKTANT PRVNÍ, DŘEVĚNÉ BUDOVY NENALEZEN. Projektant druhé, kamenné,
    doložen je: „inż. Jerzy Żukowski" (polska-org.pl).
    ROZPOR V DATACI KAMENNÉ BUDOVY, nesrovnaný: polska-org.pl i německá
    Wikipedie ji kladou do let 1938–1939 jako obnovu po požáru, campingmapa.pl
    uvádí u budovy Murowaniec rok 1936. Německá Wikipedie navíc zná ještě
    starší vrstvu — první chatu roku 1930 a přestavbu roku 1936 otevřenou
    15. října za účasti prezidenta Ignacyho Moścického.
  verified: false
  checked: '2026-08-09'

