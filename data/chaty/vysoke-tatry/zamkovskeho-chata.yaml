overeniProvoz:
  source: >-
    Celoroční provoz uvádí shodně vlastní web chaty („otvorená celoročne"
    a „ponúka občerstvenie celoročne"), turisticky.sk („má celoročnú
    prevádzku a je otvorená každý deň"), vysoketatry.com, tatryportal.sk,
    summitpost.org i hiking.sk (vše čteno 9. 8. 2026).
    Pěší přístup je tu kratší než u ostatních tatranských chat korpusu: web
    píše, že se sem jde „iba pešo približne 1 hodinu turistickým chodníkom"
    od Hrebienku, kam vede pozemní lanovka ze Starého Smokovca. Sezónní
    uzávěry vyšších tras se jí proto netýkají tak jako Téryho nebo Zbojníckej
    chaty. Konkrétní hodiny kuchyně neuvádí žádný pramen, a tak se
    nezapisují.
