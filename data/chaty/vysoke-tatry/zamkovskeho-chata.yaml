  - rok: 1945
    udalost: >-
      Za druhé světové války poskytla chata a její okolí úkryt pronásledovaným
      politickým uprchlíkům, partyzánům a židovským rodinám.
    zdroj: >-
      vysoketatry.com (čteno 9. 8. 2026) — „V období 2.svetovej vojny poskytla
      Zamkovského chata a jej okolie úkryt prenasledovaným politickým
      utečencom, partizánom a židovským rodinám."; shodně cezhory.sk.
  - rok: 1951
    udalost: >-
      Chatu znárodnili a přejmenovali na Chatu kpt. Nálepku; rodina
      zakladatele ji musela opustit. Prameny se v roce rozcházejí — vlastní
      web uvádí znárodnění už roku 1948.
    zdroj: >-
      tatryportal.sk (čteno 9. 8. 2026) — „1951 – chata bola zoštátnená
      a premenovaná na Chatu kpt. Nálepku"; shodně nostalgicketatry.sk
      a nazvoslovie.tatryblog.sk. Oproti tomu vlastní web chaty: „V roku 1948
      bola chata znárodnená a manželia spolu s dcérou ju museli opustiť."
      Podle summitpost.org bylo znárodnění 1948 a přejmenování 1951. Správu
      převzal Slovakotour (cezhory.sk).
  - rok: 1961
    udalost: >-
      Štefan Zamkovský zemřel; podle pramenů mu bylo 53 nebo 54 let.
    zdroj: >-
      vlastní web chaty (čteno 9. 8. 2026) — „zomrel v roku 1961 vo veku 54
      rokov"; hiking.sk — „v máji roku 1961 ako 54-ročný zomrel na náhlu
      cievnu mozgovú príhodu"; cezhory.sk uvádí 53 let a místo úmrtí
      Počúvadlo u Banské Štiavnice.
  - rok: 1993
    udalost: >-
      V restituci se chata vrátila rodině Štefana Zamkovského a znovu nese
      jeho jméno. Prameny se v roce rozcházejí — několik jich uvádí 1992
      a návrat názvu klade až k roku 1990 nebo 1991.
    zdroj: >-
      vlastní web chaty (čteno 9. 8. 2026) — „Po páde komunizmu bola chata
      v rámci reštitúcie vrátená rodine Štefana Zamkovského v roku 1993.";
      nazvoslovie.tatryblog.sk jmenuje vnuka Stanislava Tichého. Oproti tomu
      vysoketatry.com, nostalgicketatry.sk a summitpost.org uvádějí 1992;
      návrat názvu klade nostalgicketatry.sk k roku 1990 a hiking.sk k roku
      1991.
  - rok: 2003
    udalost: >-
      Majitelem chaty se stala rodina Kalinčíkova; chatařkou je Jana
      Kalinčíková, která chatu podle jiných pramenů spravuje už od roku 1996.
    zdroj: >-
      vlastní web chaty (čteno 9. 8. 2026) — „V roku 2003 sa stala jej
      majiteľom rodina Kalinčíková."; tatryportal.sk uvádí odkoupení roku
      2004, vysoketatry.com a asb.sk správu od roku 1996.
  - rok: 2024
    udalost: >-
      Chata dokončila rozsáhlou rekonstrukci s přístavbou; polovina novostavby
      je z pórobetonu a polovina z panelů CLT, které na místo dopravil
      vrtulník.
    zdroj: >-
      archinfo.sk (čteno 9. 8. 2026) — rekonstrukce 2019–2024, architekt
      Peter Sticzay-Gromski (Grido atelier); „polovica bola postavená
      tradičným spôsobom z pórobetónu a druhá polovica z nových CLT panelov
      osadzovaných helikoptérou". Vlastní web datuje rekonstrukci šířeji
      jako 2015–2025.

