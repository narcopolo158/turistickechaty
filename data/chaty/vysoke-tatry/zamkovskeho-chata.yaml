overeniNocleh:
  source: >-
    Vlastní web chaty (čteno 9. 8. 2026) uvádí 24 lůžek ve třech kategoriích:
    dvoulůžkový pokoj (patrová postel, sprcha a WC na chodbě), šestilůžkový
    pokoj (patrové postele, balkon, vlastní WC) a turistický pokoj („väčšia
    miestnosť s viacerými lôžkami pre núdzový nocľah"). Ceny pro období
    1. 6. – 31. 12. 2026: 50 €, 40 €, respektive 30 € za osobu a noc,
    polopenze 28 €, místní poplatek 3,50 €. Chata nemá wi-fi.
    ROZPOR, přiznaný: starší prameny uvádějí 23 (tatry.sk, miribord.com),
    25 (vysoketatry.com, tatryportal.sk) i 28 lůžek (hiking.sk).
    Zapsané je číslo provozovatele, protože chata prošla v letech 2019–2024
    rekonstrukcí, jejímž doloženým cílem bylo „navýšenie kapacity" (asb.sk).
    Není to tedy rozpor pramenů o téže věci, ale rozdíl ve stáří pramene.
    Historicky měla původní chata „6 pokojov s 26 lôžkami"
    (nostalgicketatry.sk).
  verified: false
  checked: '2026-08-09'

# ── Občerstvení ───────────────────────────────────────────────────────────
kuchyne: ano
typObcerstveni: restaurace
overeniObcerstveni:
  source: >-
    Vlastní web chaty (čteno 9. 8. 2026): „Zamkovského chata ponúka
    občerstvenie celoročne, posilniť a oddýchnuť si môžete v jedálni aj na
    terase." Nabídka: bylinkový chatařský čaj, čepované pivo, tři druhy
    polévek, maďarský i segedínský guláš, bryndzové halušky, pirohy, pro děti
    palačinky a parené buchty. Pro skupiny lze rezervovat stoly.
    OBSLUHA NEUBYTOVANÝCH JE TU DOLOŽENÁ SILNĚJI NEŽ VĚTŠINOU, i když ne
    přímou větou provozovatele. Nejpřímější je summitpost.org, podle něhož
    denní návštěvníci jedí „in the dining room located on the basement, or on
    the outside terrace which is very popular in the summer months".
    Nezávisle tatrami.sk: chata „ponúka ubytovanie pre turistov, ale aj
    občerstvenie". Nejsilnější nepřímý doklad je číselný: vysoketatry.com
    uvádí vedle sebe „Kapacita ubytovania: 25" a „Kapacita stravovania: 40
    (v lete 100)" — stravovací kapacita čtyřnásobně převyšuje lůžkovou, což
    u chaty bez denních hostů nedává smysl. Odvozovat se to ale nemá,
    telefonát to rozhodne (DATA-04).
  verified: false
  checked: '2026-08-09'

