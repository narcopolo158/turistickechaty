  KAPACITA — PROČ TU NEPLATÍ KONVENCE O NIŽŠÍM ČÍSLE. Prameny uvádějí 23, 24,
  25 i 28 lůžek. Zapsáno je 24, tedy číslo provozovatele, ne nejnižší.
  Důvod je věcný: chata prošla v letech 2019–2024 rekonstrukcí, jejímž
  doloženým cílem bylo „navýšenie kapacity" (asb.sk), takže starší čísla
  popisují jiný stav budovy. Rozlišuji tu ROZPOR PRAMENŮ (dva prameny tvrdí
  různě o téže věci ve stejný čas → platí nižší číslo) od ZASTARALOSTI
  PRAMENE (prameny popisují různé časy → platí ten současný, když je jím
  provozovatel). Stejné pravidlo jsem použil u Skalnaté chaty; u Sliezskeho
  domu naopak platila konvence o nižším čísle, protože provozovatel tam počet
  lůžek vůbec neuvádí a není čemu dát přednost. Michalovi to předkládám jako
  návrh na doplnění konvence.

  FOLTÝN A BAUHAUS — OSAMOCENÉ TVRZENÍ, KTERÉ JSEM DO DAT NEDAL. archinfo.sk
  (autorská zpráva architekta rekonstrukce, tedy pramen jinak dobře
  informovaný) tvrdí, že chata byla „postavená na konci tridsiatych rokov
  podľa projektu Ladislava Foltýna, posledného architekta v poslednom ročníku
  Bauhausu v Dessau" a technologií „two by four". To je v rozporu se všemi
  ostatními prameny, které mluví o roce 1942/1943 a o Zamkovském jako
  staviteli. Kdyby to byla pravda, byla by to nejzajímavější věc na celém
  profilu — proto to sem zapisuji, aby se na to nezapomnělo, ale do dat to
  nejde, dokud to nepotvrdí druhý pramen.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: rok znárodnění (1948 × 1951); rok
  restituce (1992 × 1993); rok návratu názvu (1990 × 1991 × 1993); věk
  Zamkovského při úmrtí (53 × 54); rok, kdy chatu převzali Kalinčíkovi
  (správa 1996 × vlastnictví 2003 × odkoupení 2004); rok narození
  Zamkovského (1907 × 1908).

  NEDOLOŽENO, a nenalezení není vyvrácení: jakýkoli požár; konkrétní
  otevírací hodiny kuchyně; IČO provozující firmy. asb.sk naopak výslovně
  tvrdí, že chata do rekonstrukce 2019+ neprošla žádnou zásadní rekonstrukcí.
  Slovenskou Wikipedii se rešerši nepodařilo načíst.
  Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
