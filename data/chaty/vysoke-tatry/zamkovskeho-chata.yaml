# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěná chata z roku 1943 v ústí Malé Studené doliny, kterou postavil
  horolezec a horský vůdce Štefan Zamkovský s manželkou Ľudmilou. Po
  znárodnění se čtyřicet let jmenovala Chata kpt. Nálepku, v restituci se
  vrátila rodině a zásobují ji výhradně nosiči.
text:
  - >-
    Zamkovského chata stojí v 1475 metrech v ústí Malé Studené doliny, pod
    Lomnickým hřebenem, na mýtině zvané Lomnická záhradka. Na výšce se
    prameny shodují do metru bez jediné odchylky — a to je v tomhle průvodci
    vzácnost. Leží přímo na Tatranské magistrále, asi hodinu chůze od
    Hrebienku; vlastní web to shrnuje jednou větou — dostat se sem dá „iba
    pešo približne 1 hodinu turistickým chodníkom".
  - >-
    Postavil ji roku 1943 Štefan Zamkovský s manželkou Ľudmilou. Byl to
    vyučený fotograf z Levoče, který podle vlastního webu chaty „v rokoch
    1929 až 1938 nadobudol povesť najlepšieho slovenského horolezca"
    a v roce 1934 získal oprávnění horského vůdce první třídy. hiking.sk
    o něm dodává jednu větu, kterou nejde přejít: „vodil po horách ZADARMO!"
    Podle téhož pramene je Zamkovského chata jediná tatranská chata, která
    nese jméno svého stavitele.
  - >-
    Za války posloužila chata a její okolí jako úkryt pronásledovaným
    politickým uprchlíkům, partyzánům a židovským rodinám. Pak přišlo
    znárodnění — vlastní web ho datuje rokem 1948, tři jiné prameny rokem
    1951 — a s ním nové jméno: Chata kpt. Nálepku, po Jánu Nálepkovi,
    slovenském důstojníkovi a partyzánském veliteli, který padl roku 1943
    u Ovruče. Zamkovští museli odejít; Štefan zemřel roku 1961. Návštěvníci
    Tater ale chatě dál po svém říkali Zamok a dnešní zkratka Zamka z toho
    zůstala.
  - >-
    V restituci se chata vrátila rodině — vlastní web uvádí rok 1993, jiné
    prameny 1992 — a spolu s ní i původní jméno. Od roku 1996 ji spravuje
    a od roku 2003, respektive 2004 vlastní rodina Kalinčíkova; chatařkou je
    Jana Kalinčíková. V letech 2019 až 2024 prošla chata rozsáhlou
    rekonstrukcí s přístavbou, jejíž polovinu tvoří panely CLT, které na
    místo dopravil vrtulník.
  - >-
    Technicky je to pozoruhodná stavba: podle vlastního webu je to
    stoprocentně ostrovní systém bez připojení k silnici i k elektrické síti.
    Elektřinu dává malá vodní elektrárna na Malom Studenom potoku o výkonu
    24 kW a baterie na 60 kWh, odpadní vodu čistí vlastní čistírna. Zásobují
    ji výhradně nosiči — denně přes pět set kilogramů, jeden náklad váží
    nahoru čtyřicet až devadesát kilo.
  - >-
    Spí se tu ve dvoulůžkových a šestilůžkových pokojích a v turistickém
    pokoji pro nouzový nocleh, dohromady čtyřiadvacet lůžek. Wi-fi tu není.
    Kuchyně vaří tři druhy polévek, maďarský i segedínský guláš, bryndzové
    halušky a parené buchty a jí se v jídelně nebo na terase. Že sem může
    přijít i ten, kdo tu nespí, prameny sice neříkají doslova, ale
    summitpost.org to o denních návštěvnících píše výslovně a čísla to
    podpírají: vysoketatry.com uvádí kapacitu stravování čtyřicet míst a
    v létě sto, tedy čtyřnásobek lůžek.
  - >-
    Chodí se sem od Hrebienku po červené směrem na Skalnaté pleso, asi
    hodinu; na Hrebienok jede pozemní lanovka ze Starého Smokovca nebo se dá
    dojít pěšky za dalších čtyřicet minut. Cestou je Obrovský vodopád. Zelená
    značka od chaty pokračuje Malou Studenou dolinou na Téryho chatu.
  - >-
    Údaje nese vlastní web chaty, hiking.sk, vysoketatry.com, tatryportal.sk,
    nostalgicketatry.sk, cezhory.sk, archinfo.sk, asb.sk, summitpost.org
    a tatrami.sk; polohu OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
