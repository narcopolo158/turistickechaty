# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1943
overeniHistorie:
  source: >-
    Vlastní web chaty (čteno 9. 8. 2026): „V ústí Malej Studenej doliny, pod
    Lomnickým hrebeňom, vo výške 1475 m n. m., vyrástla v roku 1943 drevená
    chata. Postavil ju Štefan Zamkovský s manželkou Ľudmilou."; shodně
    tatryportal.sk a nostalgicketatry.sk.
    ROZPOR V DATACI, přiznaný: hiking.sk, vysoketatry.com, cezhory.sk
    a summitpost.org datují stavbu 1942–1943 — „Práce na výstavbe chaty
    v ústí Malej Studenej doliny, na čistine zvanej Lomnická záhradka začali
    v roku 1942" a „nová chata privítala prvých návštevníkov v roku 1943"
    (hiking.sk). Zapsán je pozdější rok, tedy rok otevření; u letopočtu
    založení je opatrná volba ta pozdější (viz interniPoznamky).
    OSAMOCENÉ TVRZENÍ, nezapsané do dat: archinfo.sk (autorská zpráva
    architekta rekonstrukce) uvádí zcela jinou verzi — „Postavená na konci
    tridsiatych rokov podľa projektu Ladislava Foltýna, posledného architekta
    v poslednom ročníku Bauhausu v Dessau." a technologii „two by four".
    Žádný jiný pramen Foltýna nezmiňuje, a proto to tu není jako fakt.
    Štefan Zamkovský: podle vlastního webu vyučený fotograf z Levoče, „v
    rokoch 1929 až 1938 nadobudol povesť najlepšieho slovenského horolezca";
    hiking.sk uvádí narození o Vánocích 1907 a oprávnění horského vůdce
    I. třídy od roku 1934; nazvoslovie.tatryblog.sk datuje jeho život
    1908–1961. Zemřel roku 1961; prameny se liší, jestli ve 53, nebo 54
    letech.
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1943
    udalost: >-
      Horolezec a horský vůdce Štefan Zamkovský postavil s manželkou Ľudmilou
      na mýtině zvané Lomnická záhradka dřevěnou chatu.
    zdroj: >-
      vlastní web chaty (čteno 9. 8. 2026) — „vyrástla v roku 1943 drevená
      chata. Postavil ju Štefan Zamkovský s manželkou Ľudmilou."; hiking.sk
