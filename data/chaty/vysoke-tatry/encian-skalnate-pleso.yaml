# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1937
    udalost: >-
      Podle projektu Dušana Sama Jurkoviče, později upraveného
      stavitelem, dokončila firma ing. Karla Marvana z Hradce Králové
      horní stanici visuté lanovky z Tatranské Lomnice (stavba
      1936–37) — dnešní Encián. Celý soubor lanovky je národní
      kulturní památkou (ÚZPF 3850/1-20).
    zdroj: >-
      rešerše VT-02 (9. 8. 2026, zápis v backlogu) — Jurkovič
      1936–1937, firma ing. Karla Marvana, NKP soubor „Lanovka
      Tatranská Lomnica – Skalnaté Pleso – Lomnický štít";
      architekturu potvrzuje lacneubytovanie.net („Budovu navrhl
      architekt Dušan Jurkovič a je národní kulturní památkou").
  - rok: 1955
    udalost: >-
      U Skalnatého plesa se začala jezdit Velká cena Slovenska ve
      sjezdových disciplínách — Encián po válce sloužil hlavně
      lyžařským podnikům.
    zdroj: >-
      tatryportal.sk (čteno 10. 8. 2026) — „od roku 1955" Velká cena
      Slovenska, poválečná lyžařská role.
  - rok: 2015
    udalost: >-
      V budově byla 1. července posvěcena řeckokatolická kaple;
      vedle ní tu funguje galerie, čítárna Alfreda Grosze a Dom
      hostí.
    zdroj: >-
      rešerše VT-02 (9. 8. 2026, zápis v backlogu) — kaple posvěcena
      1. 7. 2015, galerie (prameny se přou, zda „najvyššie položená
      na Slovensku", nebo „druhá najvyššie položená v Európe" —
      superlativ se proto nepíše), čítárna, Dom hostí.

zajimavosti:
  - text: >-
      Encián je dílo Dušana Sama Jurkoviče — „básníka dřeva" a autora
      luhačovických lázeňských domů — a s celou lanovkou na Lomnický
      štít tvoří národní kulturní památku. V napínací věži bývalé
      stanice je dnes vyhlídka s dalekohledem.
    kategorie: jine
    zdroj: >-
      Jurkovič a NKP: rešerše VT-02 + lacneubytovanie.net; vyhlídka
      s dalekohledem ve věži: lacneubytovanie.net (čteno 10. 8. 2026)

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Jurkovičova horní stanice visuté lanovky z let 1936–37 na břehu
  Skalnatého plesa (1751 m) — dnes národní kulturní památka
  s galerií, kavárnou, kaplí a čtrnácti lůžky Domu hostí přímo na
  Tatranské magistrále pod Lomnickým štítem.
text:
  - >-
    Když se ve třicátých letech stavěla visutá lanovka z Tatranské
    Lomnice na Lomnický štít, navrhl její stanici u Skalnatého plesa
    Dušan Samo Jurkovič; stavbu podle jeho později upravených plánů
    dokončila roku 1937 hradecká firma inženýra Marvana. Po válce
    budova sloužila hlavně lyžařům — od roku 1955 se tu jezdila
    Velká cena Slovenska — a dnes je i s lanovkou národní kulturní
    památkou.
  - >-
    Současný Encián je dům mnoha rolí: galerie, čítárna Alfreda
    Grosze, kavárna, od roku 2015 řeckokatolická kaple — a Dom hostí
    se čtrnácti lůžky na palandách a společnou koupelnou, nocleh
    turistického střihu přímo u plesa. V napínací věži bývalé lanovky
    je vyhlídka s dalekohledem.
  - >-
    Skalnaté pleso je křižovatka: končí tu kabinková lanovka
    z Tatranské Lomnice, začíná lanovka na Lomnický štít, vede tudy
    Tatranská magistrála a hned vedle stojí Skalnatá chata
    i observatoř. Pěšky to sem z Lomnice trvá kolem dvou a půl
    hodiny.
  - >-
    Údaje na téhle stránce pocházejí z ubytovacích katalogů,
    z tatranských turistických webů a z rešerše památkového fondu;
    objekt zatím chybí v OpenStreetMap, souřadnice nese ubytovací
    katalog. Redakce nic neověřila vlastním dotazem ani návštěvou.
