interniPoznamky: >-
  Založeno BEZ OSM kandidáta (10. 8. 2026, osmý takový profil
  korpusu) — uzavírá VT-02: uzel „Encián" v OSM je vesnická
  restaurace v Lomnici (vyřazena 9. 8. měřením 3 972 m od plesa),
  skutečná budova v OSM chybí. GPS z lacneubytovanie.net; až objekt
  v OSM přibude, přepnout zdroj.

  ROZPORY vedené v ověřeních: kapacita 14 (katalog) × „10 až 20"
  (starší rešerše); provozovatel Tatranská dobrovoľnícka služba
  (katalog) × Tatranský okrášľovací spolok v pronájmu od TMR
  (rešerše 9. 8.) — NESLUČOVAT, možná jde o dvě role (ubytování ×
  správa budovy). Superlativ galerie se nepíše (prameny se přou).

  K OVĚŘENÍ (DATA-04): vztah TDS × TOS; otvírací doba kavárny;
  aktuální stav rekonstrukce fasády (Korzár 2021 psal o nové fasádě
  a střeše). Fotku dodá příští běh DATA-02 — a razítko: budova
  s galerií skoro jistě razítkuje, dohledat.
