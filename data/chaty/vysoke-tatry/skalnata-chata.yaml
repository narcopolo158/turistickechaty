# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1935
overeniHistorie:
  source: >-
    ROK 1935 JE ROKEM VZNIKU SKALNATÉ CHATY JAKO CHATY, ne prvního úkrytu na
    místě — ten je z roku 1841 a stojí v milnících. nostalgicketatry.sk
    (čteno 9. 8. 2026): „Týmito úpravami v roku 1935 vznikla Skalnatá chata
    KČST".
    ROZPOR V DATACI, přiznaný: vlastní web chaty klade zlom k roku 1932 —
    „v roku 1932, keď Kavernu prevzal Klub československých turistov".
    Zapsán je pozdější rok, ne dřívější. U roku vzniku totiž konvence
    z 27. 7. 2026 („zapiš nižší číslo") míří proti svému vlastnímu smyslu:
    starší datum je lichotivější, takže opatrná volba je ta pozdější.
    Rozdíl je věcný, ne jen číselný — 1932 je převzetí betonové kaverny,
    1935 vznik chaty. Viz interniPoznamky, otázka pro Michala.
    PROJEKTANT NENALEZEN: žádný pramen neuvádí jméno architekta ani
    projektanta Skalnaté chaty. Pozor na záměnu — Dušan Samo Jurkovič je
    architektem sousední budovy Encián, ne téhle chaty.
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1841
    udalost: >-
      Čtyři slezští turisté s horskými vůdci Jakubem Luxem a Michalem
      Stüberem upravili a obezdili prostor pod převislou skalou nad Skalnatým
      plesem; v čele výpravy byl lékárník Karol Lohmeyer, autor prvního
      tištěného průvodce po Vysokých Tatrách.
    zdroj: >-
      vlastní web chaty (čteno 9. 8. 2026) — „štyria sliezski turisti
      s horskými vodcami Jakubom Luxom a Michalom Stüberom upravili
      a obmurovali priestor pod previslou skalou"; nostalgicketatry.sk uvádí
      Lohmeyera jako vedoucího výpravy.
  - rok: 1877
    udalost: >-
      Majitel Skalnaté doliny Andrej Spóner z Veľkej Lomnice obezdil takzvanou
      Kyklopovu stěnu ve výšce 1752 metrů.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — „Túto »Kyklopovu stenu« vo
      výške 1752 m obmuroval v roku 1877 majiteľ Skalnatej doliny Andrej
      Spóner z Veľkej Lomnice".
  - rok: 1914
    udalost: >-
      Úkryt zpevnila ze strategických důvodů betonovou výmurovkou
      rakousko-uherská armáda; turisté mu od té doby říkali kaverna.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — „V roku 1914 ju zo
      strategických dôvodov spevnila betónovou výmurovkou rakúsko-uhorska
      armáda"; „Takto upravenú útulňu turisti nazývali »kaverna«."
  - rok: 1915
    udalost: >-
      Z podnětu Uhorského karpatského spolku byl provizorní prostor upraven
      na útulnu, kde mohlo přenocovat dvacet až pětadvacet lidí.
    zdroj: >-
      vlastní web chaty (čteno 9. 8. 2026) — „v roku 1915, boli provizórne
      priestory na podnet Uhorského karpatského spolku upravené na útulňu";
      horydoly.cz — „V ktorej mohlo prenocovať 20 - 25 osôb".
  - rok: 1935
    udalost: >-
      Úpravami vznikla Skalnatá chata Klubu československých turistů. Prvním
      chatařem byl od roku 1934 Michal Tomčík.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — „Týmito úpravami v roku 1935
      vznikla Skalnatá chata KČST"; „V roku 1934 tu nastúpil za chatára
      Michal Tomčík (1906-1987)."
  - rok: 1937
    udalost: >-
      V prosinci zahájila provoz visutá lanovka z Tatranské Lomnice na
      Lomnický štít, v prvním úseku po Skalnaté pleso.
    zdroj: >-
      nostalgicketatry.sk (čteno 9. 8. 2026) — „V decembri l937 dali do
      prevádzky visutú lanovku z Tatranskej Lomnice na Lomnický štít v jej
      l. úseku po Skalnaté pleso."; blog.sme.sk uvádí přesné datum
      22. prosince 1937.
  - rok: 1955
    udalost: >-
      Chata prošla velkou přestavbou vedenou tehdejším chatařem Rudolfem
      Preslerem, zahájenou roku 1953.
    zdroj: >-
      vlastní web chaty (čteno 9. 8. 2026) — „Veľkou prestavbou prešla
      v rokoch 1953 – 1955 pod vedením Rudolfa Preslera".
  - rok: 1972
    udalost: >-
      Chatu prohlásili za nezpůsobilou provozu; dál sloužila jako sklad,
      nejprve Československým drahám, pak přešla pod správu TANAP.
    zdroj: >-
      vlastní web chaty (čteno 9. 8. 2026) — „v roku 1972 vyhlásená za
      nespôsobilú prevádzky a ďalej slúžila ako sklad"; hiking.sk —
      „Neskôr ju Československé dráhy využívali ako sklad, potom prešla pod
      správu TANAP-u".
  - rok: 1996
    udalost: >-
      Po rekonstrukci, kterou zahájil nosič a záchranář Laco Kulanga po
      pronájmu roku 1993, byla chata znovu uvedena do provozu.
    zdroj: >-
      hiking.sk (čteno 9. 8. 2026) — „ktorá ju v roku 1993 prenajala nosičovi
      a záchranárovi Lacovi Kulangovi. Ten ju zrekonštruoval a v roku 1996
      opäť sprevádzkoval."
  - rok: 2020
    udalost: >-
      Laco Kulanga 14. září zemřel ve věku 71 let; chatařem je od té doby
      jeho syn Pavol.
    zdroj: >-
      horydoly.cz (čteno 9. 8. 2026) — „Tatranský nosič a chatař Ladislav
      Kulanga zemřel 14. září 2020."; vlastní web chaty — „Dnes som
      pokračovateľom tejto tradície ja, syn Pavol".

