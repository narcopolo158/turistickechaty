overeniNocleh:
  source: >-
    Vlastní web chaty (čteno 9. 8. 2026) nabízí dva pokoje — „Izba Paráda"
    jako čtyřlůžkovou a „Izba Horal" jako osmilůžkovou, dohromady dvanáct
    lůžek; shodně vysoketatry.com „KAPACITA UBYTOVANIA: 12" a turisticky.sk.
    Ceny 40 €, respektive 35 € za osobu a noc, snídaně 7 €, pobytový poplatek
    3,50 €; check-in od 14.00, check-out do 9.00; ubytování „len bez domácich
    miláčikov".
    ROZPOR, přiznaný: hiking.sk vede chatu jako „bez ubytovania"
    a tatryportal.sk uvádí „8 (núdzové)" lůžek. Zapsané je číslo
    provozovatele, protože jeho vlastní web ubytování aktivně prodává
    a uvádí ceny; oba odchylné prameny popisují spíš starší stav. Není to
    rozpor pramenů o téže věci, ale rozdíl ve stáří pramene.
  verified: false
  checked: '2026-08-09'

