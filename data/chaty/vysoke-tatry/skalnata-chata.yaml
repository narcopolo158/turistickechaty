interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/skalnata-chata.yaml (9. 8. 2026).

  ROK VZNIKU — DRUHÉ MÍSTO, KDE KONVENCE O NIŽŠÍM ČÍSLE NEFUNGUJE MECHANICKY,
  A OTÁZKA PRO MICHALA. Prameny nabízejí 1932 (vlastní web: převzetí kaverny
  KČST) a 1935 (nostalgicketatry.sk: vznik Skalnaté chaty KČST). Konvence
  z 27. 7. 2026 říká „zapiš nižší číslo", ale u letopočtu založení míří nižší
  číslo opačným směrem než smysl konvence: starší chata je prestižnější, takže
  opatrná volba je ta pozdější. Zapsáno 1935. Spolu s výškou u Chaty pri
  Zelenom plese je to podruhé, co konvenci vykládám sám — stálo by za to ji
  doplnit o větu, kterým směrem se „nižší" myslí (proti nám, ne aritmeticky).

  ROZLIŠENÍ OD SOUSEDNÍCH BUDOV JE TU PODSTATNÉ, protože kolem Skalnatého
  plesa stojí pět různých objektů a jen jeden je tahle chata: Encián (národní
  kulturní památka, bývalá stanice visuté lanovky podle Dušana Sama
  Jurkoviče, 1936–1937, dnes galerie Tatranského okrášľovacieho spolku
  v pronájmu od TMR), astronomická observatoř SAV (1786 m, od 19. 9. 1943,
  architekti Houdek a Bednárik, iniciátor Antonín Bečvář), meteorologická
  observatoř (1778 m, od 1941), stanice lanovek s gastroprovozy TMR a Skalnatá
  chata. Rozdíl výšek v pramenech (1725 × 1750 × 1751) pochází právě odtud.

  VLASTNICTVÍ: forbes.sk (2019) řadí chatu mezi tři tatranské chaty ve
  vlastnictví státu, konkrétní státní organizaci ale neuvádí; hiking.sk mluví
  o správě TANAP. Do dat nešlo nic, protože přesný vlastník není doložen.

  NEDOLOŽENO, a nenalezení není vyvrácení: projektant chaty (žádné jméno);
  jakýkoli požár; filmová produkce. Vlastní web má vnitřní rozpor v seznamu
  chatařů — u Kulangy uvádí 1995, jeho vlastní text i hiking.sk mluví
  o 1993 a 1996. Slovenskou Wikipedii se rešerši nepodařilo načíst.
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
