# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Malá kamenná chata kousek pod Skalnatým plesem, na místě, kde si turisté
  upravili úkryt pod převislou skálou už roku 1841. Jako chata Klubu
  československých turistů vznikla ve třicátých letech, roku 1972 skončila
  jako sklad a od roku 1996 zase funguje.
text:
  - >-
    Skalnatá chata stojí v 1725 metrech na prahu Skalnaté doliny, na červené
    Tatranské magistrále kousek pod Skalnatým plesem. Je nenápadná — hiking.
    sk to říká rovnou: „Niektorí z návštevníkov si možno ani nevšimnú malú
    kamennú chatu." Kolem ní je totiž hodně jiných budov: horní stanice
    lanovky, astronomická i meteorologická observatoř a Encián, bývalá
    stanice visuté lanovky od Dušana Sama Jurkoviče. Chata není žádná z nich.
  - >-
    Zajímavá je hlavně kontinuitou místa. Už první návštěvníci Skalnaté
    doliny nocovali pod převislým balvanem, kterému se říkalo Ohnisko. Roku
    1841 ho čtyři slezští turisté s horskými vůdci Jakubem Luxem a Michalem
    Stüberem obezdili — v čele byl lékárník Karol Lohmeyer, autor prvního
    tištěného průvodce po Vysokých Tatrách. Roku 1877 stěnu domuroval majitel
    doliny Andrej Spóner a roku 1914 ji betonem zpevnila rakousko-uherská
    armáda ze strategických důvodů. Od té doby se místu říkalo kaverna.
  - >-
    Chatu z toho udělal Uhorský karpatský spolok roku 1915 a Klub
    československých turistů ve třicátých letech. Kdy přesně vznikla
    „Skalnatá chata", prameny neříkají stejně: vlastní web klade zlom
    k roku 1932, kdy KČST kavernu převzal, nostalgicketatry.sk až k roku
    1935. V prosinci 1937 pak přijela lanovka z Tatranské Lomnice a místo
    přestalo být odlehlé.
  - >-
    Roku 1972 chatu prohlásili za nezpůsobilou provozu a dál sloužila jako
    sklad Československých drah, později pod správou TANAP. Zachránil ji
    nosič a záchranář Laco Kulanga, kterému ji TANAP roku 1993 pronajal;
    zrekonstruoval ji a roku 1996 znovu otevřel. Kulanga zemřel v září 2020
    ve věku jednasedmdesáti let a chatu po něm vede syn Pavol. Nekrolog
    připomíná jeho nosičské výkony: 176 kilogramů na Skalnaté pleso a 211
    kilogramů odtud na mezistanici.
  - >-
    Spí se tu v jediných dvou pokojích — čtyřlůžkovém Paráda a osmilůžkovém
    Horal —, takže dvanáct lidí. Restaurace má otevřeno od osmi ráno do devíti
    večer, případně po dohodě. Jestli se tu obslouží i ten, kdo tu nespí,
    prameny výslovně nepíšou, ale hiking.sk uvádí, že „na chate sa dá kúpiť
    jedlo, čaj a iné nápoje", a legendarium.info popisuje chatu i terasu jako
    celoročně otevřené pěším turistům, horolezcům a v zimě lyžařům.
  - >-
    Dostat se sem dá i bez chůze do kopce:
    z Tatranské Lomnice sem jede lanovka a od horní stanice je to podle
    vlastního webu pět minut. Pěšky se sem jde z Tatranské Lomnice po zelené
    nebo od Hrebienku po červené, prameny udávají necelé dvě hodiny.
    I tady ale platí, že „otevřeno" a „dostupné" nejsou totéž — červená
    spojka na Chatu pri Zelenom plese přes Veľkú Svišťovku je od 1. listopadu
    do 31. května uzavřená.
  - >-
    Údaje nese vlastní web chaty, vysoketatry.com, hiking.sk,
    nostalgicketatry.sk, horydoly.cz, korzár SME, forbes.sk, turisticky.sk
    a legendarium.info; polohu OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
