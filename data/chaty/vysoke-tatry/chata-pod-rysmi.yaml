interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/chata-pod-rysmi.yaml (8. 8. 2026),
  třetí publikovaný profil oblasti Vysoké Tatry a nejvýše položený objekt
  celého korpusu.

  SUPERLATIV JE TU DOLOŽENÝ DOSLOVA, na rozdíl od Téryho chaty: vlastní web
  „2250 m n. m – najvyššie položená horská chata na Slovensku". Právě proto
  se u Téryho chaty muselo psát jen „ve Vysokých Tatrách" — výš stojí tahle,
  jen je sezónní.

  SEZÓNNOST JE HLAVNÍ ÚDAJ, ne provozní poznámka. U celoročních tatranských
  chat platí, že „otevřeno" neznamená „dostupné" (uzávěry cest); tady je to
  opačně jednoznačné — mimo červen až říjen je zavřeno. Rozpor v začátku
  (1. 6. dle vlastníka × 15. 6. dle tatryportal.sk) je důvod, proč je
  v poli `sezona` slovní vymezení bez přesného dne.

  KAPACITU JSEM NEZAPSAL PODLE VLASTNÍHO WEBU, a je to vědomé. Vlastní web
  píše „Desiatky lôžok", což je marketingová formulace bez čísla; dva jiné
  prameny shodně uvádějí 14. Pravidlo „pramen nejblíž objektu má přednost"
  se tu neuplatnilo, protože ten pramen žádné číslo nedává.

  OTEVŘENÁ OTÁZKA U REKONSTRUKCE: hiking.sk uvádí, že slavnostní otevření
  bylo PLÁNOVÁNO na 25. 9. 2013. Že se konalo, nepotvrzuje žádný pramen —
  do milníků proto šel jen začátek rekonstrukce, ne její konec.

  NEDOLOŽENO (nezapsáno): rok vzniku s jistotou (1932 × 1933), přesný
  začátek sezóny, obsluha neubytovaných, dnešní chatař (kst.sk uvádí Jána
  Ševčíka, starší článek Viktora Beránka — nejspíš různá období, ale
  doloženo to není), náklady stavby (kst.sk uvádí „s nákladom Kč" bez
  částky). Fotku dodá běh DATA-02, výškový profil DATA-06.
