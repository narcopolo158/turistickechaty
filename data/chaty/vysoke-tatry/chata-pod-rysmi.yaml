# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata, kterou vlastní web i Klub slovenských turistov uvádějí jako
  nejvýše položenou na Slovensku — 2250 metrů pod vrcholem Rysů.
  Postavil ji Klub československých turistů na začátku třicátých let,
  dvakrát ji vzala lavina a dnešní budova má proto šikmou stěnu. Otevřeno
  je jen v létě a zásobuje se výhradně nosiči.
text:
  - >-
    Chata pod Rysmi stojí ve 2250 metrech, tedy výš než kterákoli jiná
    horská chata na Slovensku — a je to superlativ, který má doslovný
    pramen, ne odhad. Leží pod vrcholem Rysů (2503 m), kudy vede hraniční
    přechod do Polska, a je posledním zázemím před výstupem.
  - >-
    Postavil ji Klub československých turistů a je to jediná jeho doložená
    vlastní stavba ve Vysokých Tatrách; ostatní chaty, které klub vlastnil,
    postavil Uhorský karpatský spolok a KČST je po roce 1918 jen převzal.
    Rok se v pramenech liší: jeden mluví o předání veřejnosti 15. července
    1932 po dvou letech stavby, ostatní o dokončení roku 1933. Zapisujeme
    nižší číslo a rozpor přiznáváme.
  - >-
    Dvakrát ji vzala lavina — poprvé roku 1955, podruhé roku 2000, kdy
    z ní podle pramenů zbyla buď polovina, nebo jen jídelna. Generální
    rekonstrukce začala v březnu 2010 a z původní stavby zůstaly jen
    základy. Nová budova je postavená proti lavině: stěna je záměrně
    šikmá, aby na ni sníh nenarazil kolmo. Je to jediný objekt korpusu,
    u kterého je tvar stavby odpovědí na hrozbu.
  - >-
    Zásobuje se výhradně nosiči, vodu má ze záchytných nádrží nad chatou
    a elektřinu z agregátů, i když má namontované fotovoltické články.
    Spí se ve čtrnácti lůžkách s dekami ve společné noclehárně.
  - >-
    Otevřeno je jen v letní sezóně, zhruba od začátku června do konce
    října — a tady to není provozní drobnost, ale hlavní údaj: mimo sezónu
    je chata zavřená, ne jen hůř dostupná. V začátku sezóny se prameny
    rozcházejí mezi prvním a patnáctým červnem, tak uvádíme jen měsíc.
  - >-
    Chodí se sem od Popradského plesa: z chaty u plesa je to podle pramene
    dvě hodiny dvacet minut nahoru, ze Štrbského Plesa tři hodiny
    pětatřicet.
  - >-
    Údaje na téhle stránce nesou Klub slovenských turistov, vlastní web
    chaty, hiking.sk, tatryportal.sk a odborný časopis ASB; polohu nese
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
