# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1932
overeniHistorie:
  source: >-
    ROZPOR V ROCE VZNIKU, nesrovnaný (čteno 8. 8. 2026): hiking.sk uvádí
    „Verejnosti bola do užívania odovzdaná po dvoch rokoch výstavby,
    15. júla 1932."; Klub slovenských turistov, vlastní web chaty i stránka
    KST o historii shodně „postavená v roku 1933" a „Chatu dokončilo
    ústredie KČST v roku 1933". Třetí pramen (asb.sk) obojí spojuje:
    chata „sa začala stavať v roku 1932 a v roku 1933 bola skolaudovaná" —
    to ale samo odporuje datu předání veřejnosti 15. 7. 1932. Zapsáno 1932
    dle konvence z 27. 7. 2026 (při rozporu nižší číslo, rozpor přiznat).
    STAVEBNÍK JE DOLOŽENÝ: Klub československých turistů — kst.sk
    „Chatu dokončilo ústredie KČST"; hiking.sk uvádí KČST z Popradu. Je to
    jediná doložená vlastní stavba KČST ve Vysokých Tatrách; ostatní chaty,
    které klub vlastnil (Téryho, pri Zelenom plese), postavil Uhorský
    karpatský spolok a KČST je jen převzal.
    LAVINY: 1955 chatu poškodila lavina (asb.sk); v roce 2000 spadla další
    a prameny se liší v rozsahu škody — asb.sk „zbúrala polovicu chaty",
    hiking.sk „zničila sklad, prístavok pre chatárov a strhla strechu –
    z chaty sa zachovala len jedáleň". Generální rekonstrukce začala
    v březnu 2010, „z pôvodnej chaty ostali len základy" (hiking.sk),
    a slavnostní otevření bylo plánováno na 25. 9. 2013 — že se konalo,
    pramen nepotvrzuje, uvádí jen plán.
    Vlastníci: „Klub slovenských turistov a SHS James" (kst.sk).
  verified: false
  checked: '2026-08-08'

