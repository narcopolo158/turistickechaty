interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/teryho-chata.yaml (8. 8. 2026),
  první publikovaný profil oblasti Vysoké Tatry.

  SUPERLATIV JE ZÚŽENÝ OPROTI TOMU, CO SE OBVYKLE ŘÍKÁ, a je to podstatné.
  Doložené je „nejvýše položená chata s celoročním provozem VE VYSOKÝCH
  TATRÁCH" (treking.cz i vlastní web: „the highest year-round operated
  mountain hut in the High Tatras"). Verzi „na Slovensku" nenašel žádný
  pramen — a nedá se ani dovodit, protože výš stojí Chata pod Rysmi
  (2250 m), jen je sezónní. Do prózy proto šla tatranská verze.

  OTEVŘENÁ MEZERA: obslouží chata i NEUBYTOVANÉ? Žádný pramen to neříká.
  U vysokohorské chaty na frekventované trase je to pravděpodobné a klíč
  zařazení je splněn i rolí na trase, ale do dat se domněnka nepíše. Je to
  otázka na telefonát a týká se stejně tak Zbojníckej chaty i Chaty pod
  Rysmi — u všech tří to prameny mlčky přeskakují.

  ROZPOR O VODĚ, nezapsaný do dat: treking.cz píše, že v umývárně „teče
  pouze studená voda", hiking.sk uvádí „teplú vodu v kohútikoch,
  splachovacie toalety a sprcha". Prameny nejspíš pocházejí z různých let
  a rozdíl by šel vysvětlit rekonstrukcí, ale doloženo to tak není.

  NEDOLOŽENO (nezapsáno): otvírací hodiny, datace velké přestavby (tři
  období mezi 1979 a 1984), žádný požár (o žádném pramen nemluví),
  právní forma vlastnictví (prameny říkají jednou „majitelia", jindy „pod
  správou KST"), etapové časy z Hrebienku (jen souhrnné „asi 3 hod.").
  Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
