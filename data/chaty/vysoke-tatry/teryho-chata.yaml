# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Vysokohorská chata z roku 1899 v kotlině Pěti Spišských ples, kterou
  postavil Uhorský karpatský spolok podle projektu Gedeona Majunkeho.
  Od roku 1936 je otevřená celoročně a zásobuje se nosiči na zádech.
text:
  - >-
    Téryho chata stojí ve 2015 metrech v horní části Malé Studené doliny,
    v kotlině, kde leží Pět Spišských ples. Na její výšce se prameny
    shodují do metru, což je u tohohle průvodce vzácnost — a je to zároveň
    číslo, které z ní dělá nejvýše položenou celoročně otevřenou chatu
    Vysokých Tater.
  - >-
    Postavil ji roku 1899 Uhorský karpatský spolok z podnětu lékaře
    a průkopníka horolezectví Edmunda Téryho; projekt je dílem Gedeona
    Majunkeho ze Spišské Soboty, tedy stavitele, jehož jméno se ve Vysokých
    Tatrách té doby objevuje často. Chata byla dostavěná 18. července
    a otevřená 21. srpna téhož roku. Od roku 1936 funguje celoročně a byla
    v tom mezi tatranskými chatami první.
  - >-
    Zásobování je tu vlastní kapitola: náklad se sem vynáší po zádech
    a vrtulník létá jen před sezónou a po ní. Rekord drží nosič Laco
    Kulanga se 151 kilogramy, který podle pramene dodnes nikdo nepřekonal.
  - >-
    Chodí se sem od Hrebienku, kam vede pozemní lanovka ze Starého
    Smokovce; dál po červené magistrále k rozcestí pod Zamkovského chatou
    a po zelené na chatu, dohromady asi tři hodiny. Druhá cesta vede od
    Javoriny přes Sedielko a třetí od Zbojníckej chaty přes Priečne sedlo.
    To poslední ale není procházka — a je to důvod, proč u tatranské chaty
    „otevřeno celoročně" neznamená „dostupné celoročně": přístupové cesty
    tu mají sezónní uzávěru a Priečne sedlo je exponovaný terén.
  - >-
    O tom, jestli se tu obslouží i ten, kdo tu nespí, prameny mlčí. Jídelna
    má od roku 2009 padesát míst a jídlo se podává po celý den, ale
    výslovnou větu o neubytovaných jsme nenašli, takže ji tu netvrdíme.
  - >-
    Za války se v chatě ukrývali polští odbojáři a ruští uprchlíci ze
    zajateckých táborů. Kdy přesně proběhla velká přestavba, poctivě
    nevíme — prameny uvádějí tři různá období mezi lety 1979 a 1984.
  - >-
    Údaje na téhle stránce nesou vlastní web chaty, turistika.cz,
    treking.cz, hiking.sk a dobrenoviny.sk; polohu nese OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
