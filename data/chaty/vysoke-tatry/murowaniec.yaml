# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1925
overeniHistorie:
  source: >-
    Základní kámen položen 24. července 1921, slavnostní otevření
    12. července 1925: korona-gor-polski.pl (čteno 9. 8. 2026) — „24 lipca
    1921 r. położono kamień węgielny, a uroczyste otwarcie schroniska miało
    miejsce 12 lipca 1925 r."; szlaki.net.pl doplňuje, kdo otevíral —
    „Ceremonii otwarcia dokonał w dniu 12 lipca 1925 r. prezydent
    Rzeczpospolitej Polskiej, Stanisław Wojciechowski".
    ROZPOR O TOM, KTERÝ ODBOR PTT STAVĚL, nesrovnaný: PTTK Małopolska,
    portaltatrzanski.pl a razemnaszlaku.pl uvádějí Oddział Warszawski PTT
    („Wybudowane zostało w latach 1921–1925 dzięki staraniom Oddziału
    Warszawskiego PTT"), město Zakopane a korona-gor-polski.pl Oddział
    Tatrzański PTT.
    ROZPOR O PROJEKTANTECH: krakow.eska.pl, 24tp.pl a tulismanore.pl uvádějí
    samotného Zdzisława Kalinowského, město Zakopane, histmag.org a
    historykon.pl dvojici Zdzisław Kalinowski a Karol Siciński,
    regiontatry.pl a razemnaszlaku.pl přidávají do rané fáze Jana Witkiewicze
    Koszyce. PTTK Małopolska píše „Zbigniew Kalinowski" — osamocená varianta
    křestního jména, patrně chyba, ale zapisuje se, protože ji nemám čím
    vyvrátit.
    STAVĚLA ARMÁDA, doloženo dvěma prameny: krakow.eska.pl — „w budowę
    schroniska było zaangażowane Wojsko Polskie, a dokładniej pluton kompanii
    wysokogórskiej 3 pułku strzelców podhalańskich, kompania 5 pułk saperów
    z Krakowa"; histmag.org — „Dzięki kontaktom w środowiskach wojskowych
    i szczególnej przychylności gen. Sikorskiego".
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1884
    udalost: >-
      Na břehu Czarného Stawu Gąsienicowého postavil Józef Sieczka primitivní
      útulnu — první stavbu pro turisty na Hali Gąsienicowej.
    zdroj: >-
      24tp.pl (čteno 9. 8. 2026) — „Wszystko zaczęło się w 1884 roku, kiedy
      to Józef Sieczka postawił prymitywne schronisko na brzegu Czarnego
      Stawu Gąsienicowego."
  - rok: 1890
    udalost: >-
      Towarzystwo Tatrzańskie odkoupilo od horalů dva šalaše na Hali.
    zdroj: >-
      szlaki.net.pl (čteno 9. 8. 2026) — „dwa szałasy, które Towarzystwo
      Tatrzańskie wykupiło w 1890 r. od górali".
  - rok: 1913
    udalost: >-
      Na Hali Gąsienicowej začala 1. prosince měřit první horská
      meteorologická stanice na polském území.
    zdroj: >-
      obserwator.imgw.pl (čteno 9. 8. 2026) — „Obserwacje na stacji
      meteorologicznej na Hali Gąsienicowej rozpoczęto 1 grudnia 1913 roku.
      Była to pierwsza górska stacja meteorologiczna na ziemiach polskich."
  - rok: 1925
    udalost: >-
      Chatu postavenou od roku 1921 otevřel 12. července prezident Stanisław
      Wojciechowski. Stavěla ji Polská armáda — četa vysokohorské roty
      3. pluku podhalských střelců a rota 5. ženijního pluku z Krakova.
    zdroj: >-
      korona-gor-polski.pl a szlaki.net.pl (čteno 9. 8. 2026);
      krakow.eska.pl k účasti armády.
  - rok: 1951
    udalost: >-
      Přístavbou západního křídla se budova zvětšila; práce probíhaly od
      roku 1950 a upravily i interiér.
    zdroj: >-
      PTTK Małopolska (čteno 9. 8. 2026) — „W latach 1950–1951 budynek
      powiększono."; regiontatry.pl — „Zachodnie skrzydło zostało dobudowane
      w latach 1950-1951."
  - rok: 1963
    udalost: >-
      5. prosince chata částečně vyhořela; oheň zničil celé třetí patro
      a obnova už nebyla úplná.
    zdroj: >-
      PTTK Małopolska (čteno 9. 8. 2026) — „5 grudnia 1963 r. uległ
      częściowemu spaleniu, a następnie odbudowano go w nowym kształcie.";
      krakow.eska.pl — „w schronisku wybuchł pożar i zniszczył całe trzecie
      piętro"; portaltatrzanski.pl — obnova „niestety niekompletnej".

# ── Zajímavosti ───────────────────────────────────────────────────────────
zajimavosti:
  - text: >-
      Jméno Murowaniec vzniklo podle pramene z toho, že žulové zdi budovy
      byly zevnitř obloženy dřevem — turisté si toho všimli a název se ujal.
    kategorie: jine
    zdroj: >-
      naszeszlaki.com.pl (čteno 9. 8. 2026) — „Granitowe mury tego budynku,
      obudowane wewnątrz drewnianymi ścianami natchnęły turystów do nadania
      schronisku popularnej do dziś nazwy »Murowaniec«."
  - text: >-
      Žula na stavbu se sbírala pod Kościelcem a vozila úzkokolejkou;
      transport kamene byl podle pramene největší potíž celé stavby.
    kategorie: jine
    zdroj: >-
      krakow.eska.pl (čteno 9. 8. 2026) — „Najwięcej kłopotów sprawiał
      transport materiałów, w tym głównie granitowych głazów spod ścian
      Kościelca"; histmag.org — „Kolejka górska, którą dowozić miano kamień
      zbierany u zbocza Małego Kościelca."
  - text: >-
      Na zdech chaty jsou pamětní desky Stanisława Osieckého, iniciátora
      stavby, a básníka Adama Asnyka.
    kategorie: jine
    zdroj: >-
      regiontatry.pl (čteno 9. 8. 2026) — „Mury Murowańca zdobią tablice
      pamiątkowe – poświęcone Stanisławowi Osieckiemu oraz Adamowi
      Asnykowi."
  - text: >-
      V budově sídlí služba horské záchranné služby TOPR.
    kategorie: jine
    zdroj: >-
      portaltatrzanski.pl (čteno 9. 8. 2026) — „dyżurka TOPR"; natatry.pl —
      „stacja TOPR".

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Žulová chata na Hali Gąsienicowej, stavěná v letech 1921 až 1925 Polským
  tatranským spolkem s pomocí armády a otevřená prezidentem republiky.
  Jméno dostala podle zděných stěn. Roku 1963 vyhořela a obnova už nebyla
  úplná.
text:
  - >-
    Schronisko PTTK Murowaniec stojí ve 1500 metrech na Hali Gąsienicowej
    v Dolině Suchej Wody. Je to jedna z největších polských tatranských chat
    a přezdívku, která jí zůstala jako jméno, dostala podle stavebního
    materiálu: žulové zdi jsou zevnitř obložené dřevem a turisté jí začali
    říkat Murowaniec.
  - >-
    Hala měla turistickou tradici dřív než chatu. Roku 1884 tu Józef Sieczka
    postavil primitivní útulnu na břehu Czarného Stawu, roku 1890 odkoupilo
    Towarzystwo Tatrzańskie od horalů dva šalaše a 1. prosince 1913 tu začala
    měřit první horská meteorologická stanice na polském území.
  - >-
    Vlastní chata se začala stavět roku 1921, kdy 24. července položili
    základní kámen, a otevřena byla 12. července 1925 prezidentem Stanisławem
    Wojciechowským. Kdo přesně stavěl, se prameny neshodnou — jedni uvádějí
    varšavský, druzí tatranský odbor Polského tatranského spolku, a projekt
    připisují buď Zdzisławu Kalinowskému samotnému, nebo jemu a Karolu
    Sicińskému. Jisté je, kdo dělal těžkou práci: Polská armáda, konkrétně
    četa vysokohorské roty 3. pluku podhalských střelců a rota 5. ženijního
    pluku z Krakova. Nejtěžší byl podle pramene transport žulových balvanů
    sbíraných pod Kościelcem.
  - >-
    Roku 1949 tu vznikla pobočka Polské geografické společnosti
    a meteorologická stanice, v letech 1950 až 1951 přibylo západní křídlo.
    A 5. prosince 1963 chata částečně vyhořela — oheň zničil celé třetí
    patro a obnova, jak píše jeden z pramenů, už nebyla úplná.
  - >-
    Dnes tu je 110 lůžek podle provozovatele, jiné prameny uvádějí 116 nebo
    120, v pokojích od dvou do deseti lidí. Je tu restaurace, bufet, jídelna,
    úschovna zavazadel a lyží, směnárna, klubovna a služba horské záchranné
    služby TOPR. Jestli se obslouží i ten, kdo tu nespí, prameny neříkají;
    řád na vlastním webu mluví jen o ubytovaných.
  - >-
    Chodí se sem z Kuźnic po modré přes Boczań nebo po žluté Dolinou
    Jaworzynky, obojí kolem dvou hodin; od Brzezin po černé přes Psią Trawkę
    zhruba stejně; a z Kasprowého Wierchu po žluté dolů za necelou hodinu až
    hodinu a čtvrt. Chata leží uvnitř Tatrzańského parku narodowého, kde se
    platí vstup a nocovat se smí jen ve schroniscích.
  - >-
    Údaje nese vlastní web chaty, ústředí PTTK, PTTK Małopolska,
    portaltatrzanski.pl, krakow.eska.pl, 24tp.pl, histmag.org,
    naszeszlaki.com.pl, regiontatry.pl, szlaki.net.pl a obserwator.imgw.pl;
    polohu OpenStreetMap. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
