interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/murowaniec.yaml (9. 8. 2026).

  PATROCINIUM „IM. WANDY JERZMANOWSKIEJ" SE NEPOTVRDILO a je to poctivé
  napsat: do zadání rešerše jsem ho dal jako otázku („jaké má oficiální
  jméno, im. Wandy Jerzmanowskiej?") a rešerše ho cíleně hledala třemi
  dotazy. Žádný pramen ho neuvádí — naopak vlastník (Schroniska i Hotele
  PTTK „Karpaty"), ústředí PTTK, město Zakopane i všechny turistické portály
  vedou chatu bez patronky. Do dat proto nešlo. Nenalezení není vyvrácení
  (polská Wikipedie byla nedostupná), ale ani domněnka není fakt — a byla to
  MOJE domněnka v zadání, ne pramen. Je to potřetí, co se mi vrátila lekce
  z 8. 8. 2026: do zadání se píše „kdo?", ne „byl to X?".

  KAPACITA — konvence o nižším čísle tu vyšla nastejno s pravidlem
  „provozovatel má přednost": obojí ukazuje na 110.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: který odbor PTT stavěl (Warszawski ×
  Tatrzański); projektanti (Kalinowski sám × Kalinowski a Siciński ×
  s Witkiewiczem Koszycem v rané fázi); křestní jméno projektanta u PTTK
  Małopolska („Zbigniew" místo Zdzisław); rok požáru (1963 u šesti pramenů ×
  1964 u klubpodroznikow.com); kapacita (110 × 116 × 120).

  PROVOZOVATEL A VLASTNÍK SE LIŠÍ a do dat nešlo ani jedno: vlastníkem je
  PTTK přes dceřinou firmu Schroniska i Hotele PTTK „Karpaty" Sp. z o.o.
  z Nowého Sącze, provozovatelem podle zásad ochrany osobních údajů na
  vlastním webu „WYSOKA Szatkowski, Postupalski Spółka Komandytowa".

  POZOR NA ZÁMĚNU WEBŮ: murowaniec.pl NENÍ oficiální web — sám o sobě píše,
  že je „stroną miłośników schroniska górskiego Murowaniec. Nie jest
  oficjalną stroną www". Oficiální je murowaniec.com. Ve zdrojích je proto
  jen ten druhý.

  NEDOLOŽENO, a nenalezení není vyvrácení: výslovná věta o obsluze
  neubytovaných; otevírací doba restaurace a bufetu (jediný pramen
  s hodinami je razemnaszlaku.pl a jeho stáří neznáme); válečný osud
  1939–1945 (jen vágní zmínka na eska.pl); číslo a datum zápisu do rejstříku
  památek. Polskou Wikipedii se rešerši nepodařilo načíst.
