# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenná jednoprostorová stavba z roku 1863 kousek od Hrebienku, kterou
  prameny uvádějí jako nejstarší chatu Vysokých Tater. Nespí se tu ani nevaří — je to malé občerstvení
  s expozicí o horských nosičích v domku o půdorysu pět krát pět a půl metru.
text:
  - >-
    Rainerova chata stojí ve 1301 metrech nedaleko Hrebienku nad Starým
    Smokovcem a prameny ji shodně uvádějí jako nejstarší chatu Vysokých
    Tater. Postavil ji roku 1863
    Ján Juraj Rainer, nájemce Starého Smokovce, jako bezplatnou noclehárnu
    pro turisty — tedy jednotlivec, ne spolek. To je na tom to podstatné:
    Uhorský karpatský spolok, který ve Vysokých Tatrách postavil většinu
    ostatních chat, vznikl až roku 1873, deset let po Rainerovi.
  - >-
    Rok se v pramenech rozchází a rozdíl není v číslici, ale ve významu:
    tři prameny mluví o roce 1863 jako o roce stavby, dva o roce, kdy Rainer
    vypracoval projekt, s tím, že chata stála až o dva roky později.
    Zapisujeme nižší číslo a rozpor přiznáváme.
  - >-
    Dvakrát skončila. Poprvé roku 1884, kdy ji předstihla nová chata Kamzík;
    pak z ní byl sklad paliva, garáž a nakonec chlívek. Roku 1983 ji Správa
    TANAPu nechala jako památkový objekt zrestaurovat a provoz obnovil Peter
    Petras — podle většiny pramenů roku 1997, podle jednoho 1998. Dnes ji
    vede Peter Petras mladší.
  - >-
    Dnešní Rainerka je v korpusu výjimka: nespí se tu a nevaří se tu. Prameny
    to říkají shodně a doslova — „malé občerstvení bez podávání jídel".
    K tomu je uvnitř expozice o historii a současnosti horských nosičů
    a sbírka starého horolezeckého náčiní, takže je to zároveň bufet
    i miniaturní muzeum. Půdorys má pět krát pět a půl metru a podle pramene
    je to nejmenší horská chata Vysokých Tater.
  - >-
    Chodí se sem z Hrebienku po červené za dvacet pět až pětatřicet minut
    podle toho, který pramen počítá; dál vede cesta k Vodopádům Studeného
    potoka a na Bilíkovu chatu. Pro toho, kdo míří do Veľké Studené doliny
    na Zbojníckou chatu, je Rainerka první zastávkou.
  - >-
    Kdy je otevřeno, neuvádíme. Jeden pramen píše, že celoročně každý den
    od devíti do čtyř, druhý že mimo sezónu jen o víkendech a svátcích —
    a to je rozdíl, který se u chaty na půl hodiny cesty pozná.
  - >-
    Údaje na téhle stránce nesou vysoketatry.com, tatranskybedeker.sk,
    tatry.sk, Pravda.sk, interez.sk a publikace Slovenského olympijského
    výboru o historii turistických chat; polohu nese OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
