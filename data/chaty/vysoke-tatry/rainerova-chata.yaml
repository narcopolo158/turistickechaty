overeniHistorie:
  source: >-
    ROZPOR, KTERÝ NENÍ O ROCE, ALE O TOM, CO SE V TOM ROCE STALO (čteno
    8. 8. 2026). vysoketatry.com „Bola postavená v roku 1863" Jánom Jurajom
    Rainerom; tatranskybedeker.sk „V roku 1863 dal nájomca Starého Smokovca
    Ján Juraj Rainer postaviť kamennú jednopriestorovú chatku"; tatry.sk
    „It was built in 1863 by Ján Juraj Rainer". Proti tomu Pravda.sk:
    Rainer „v roku 1863 vypracoval projekt samotnej chaty. O dva roky
    neskôr už stála na svojom mieste" — tedy 1865; interez.sk totéž.
    Zapsáno 1863 dle konvence z 27. 7. 2026 (nižší číslo, rozpor přiznat);
    tři prameny je navíc uvádějí jako rok stavby.
    STAVEBNÍKEM BYL JEDNOTLIVEC, ne spolek, a to je pro Vysoké Tatry
    důležité: Ján Juraj Rainer byl nájemce Starého Smokovce a chatu postavil
    jako bezplatnou noclehárnu pro turisty. Uhorský karpatský spolok, který
    tu později postavil většinu chat, vznikl až 10. srpna 1873 — o deset let
    později —, takže mu tenhle objekt PŘIPSAT NELZE. Odborná publikace
    olympic.sk to potvrzuje: „Prvou chatou na slovenskej strane Tatier bola
    Rainerova chata (útulňa), ktorú roku 1863 postavil Johann Rainer."
    ZÁNIK A OBNOVA: po postavení chaty Kamzík roku 1884 chata zanikla
    (vysoketatry.com) a sloužila jako „sklad paliva, garáž, ba dokonca
    chlievik" (Pravda.sk). Roku 1983 ji dala Správa TANAPu jako památkový
    objekt zrestaurovat. Provoz obnovil Peter Petras — 1997 dle tří pramenů,
    1998 dle vysoketatry.com (ROZPOR); dnes ji vede Peter Petras mladší.
  verified: false
  checked: '2026-08-08'

