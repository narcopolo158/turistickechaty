interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/rainerova-chata.yaml (8. 8. 2026),
  čtvrtý publikovaný profil oblasti Vysoké Tatry.

  PRVNÍ OBJEKT KORPUSU S `nocleh: ne` A `kuchyne: ne`. Není to mezera
  v datech, ale doložená vlastnost: „refreshment without serving meals or
  accommodation" (tatry.sk) a „malé občerstvenie bez podávania jedál"
  (vysoketatry.com i tatranskybedeker.sk). Typ občerstvení je proto
  `kiosek`. Klíč zařazení je splněn — občerstvení pro veřejnost i role na
  trase —, ale profil ukazuje, že „chata" v našem číselníku neznamená
  automaticky nocleh.

  SUPERLATIV MÁ TŘI RŮZNĚ ŠIROKÉ PODOBY a do prózy šla ta nejopatrnější,
  která je zároveň doložená: tatry.sk „the oldest chalet in the High
  Tatras", interez.sk „najstaršou horskou chatou na slovenskej strane
  Vysokých Tatier", Pravda.sk „najstaršia a najmenšia ZACHOVANÁ chata".
  Rozdíl mezi „nejstarší" a „nejstarší zachovaná" je podstatný a při
  případném rozšíření textu se musí udržet.

  MOJE ŠESTÁ CHYBA V ZADÁNÍ REŠERŠE ZA DEN, a tentokrát systémová: ptal
  jsem se, co ve Vysokých Tatrách postavil KARPATHENVEREIN. Rešerše
  nenašla ANI JEDNU tatranskou chatu tohohle spolku — Karpathenverein
  vznikl roku 1920 přejmenováním Uhorského karpatského spolku a doložené
  vlastní stavby (Ďumbier 1902, Panské dielko 1906) leží v Nízkých Tatrách
  a předcházejí roku 1920. TÝKÁ SE TO NAŠICH DAT: poznámka v
  data/oblasti/vysoke-tatry.yaml připisuje Karpathenvereinu Bilíkovu chatu
  (1934). Ten údaj je od teď PODEZŘELÝ a před povýšením Bilíkovy chaty se
  musí ověřit znovu.

  CO REŠERŠE NAOPAK UPEVNILA — pořadí stavitelů ve Vysokých Tatrách:
  jednotlivec Rainer (1863), pak Uhorský karpatský spolok od roku 1873
  (Majláthova chata u Popradského plesa 1879, kamenná náhrada 1881, třetí
  chata 1892, Sliezsky dom 1895, Chata pri Zelenom plese 1897, Téryho chata
  1899), a nakonec KČST od roku 1918, který ale vlastní stavbu má
  doloženou JEDINOU — Chatu pod Rysmi; ostatní chaty jen převzal. Tohle je
  kostra, o kterou se opřou další profily oblasti.

  ROZPOR VE VÝŠCE: OSM má ele=1304, dva prameny a katalog 1301. Zapsáno
  1301 — je to případ, kdy OSM není nejbližší pramen objektu, jen
  nejsnáze dostupný.

  NEDOLOŽENO (nezapsáno): rok vzniku s jistotou (1863 × 1865), otvírací
  doba (dva neslučitelné režimy), rok obnovy provozu (1997 × 1998),
  vlastník objektu (restaurování zajistila Správa TANAPu, ale vlastnický
  titul pramen neuvádí), vlastní web chaty (nemá), zda chata leží přímo na
  Tatranské magistrále. Fotku dodá běh DATA-02, výškový profil DATA-06.
