# ── Zajímavosti ───────────────────────────────────────────────────────────
zajimavosti:
  - text: >-
      Michal Guhr, po kterém se chata původně jmenovala, byl lékař z Tatranské
      Polianky, předseda Karpathenvereinu v letech 1920 až 1933 a podle
      Slovenského olympijského výboru jediný účastník ze Slovenska na prvních
      zimních olympijských hrách v Chamonix roku 1924.
    kategorie: jine
    zdroj: >-
      olympic.sk (čteno 9. 8. 2026) — „Michael Guhr sa narodil 17. marca
      1873"; „Od roku 1917 bol podpredsedom Karpatského turistického spolku –
      Karpathenverein a od roku 1920 až do svojej smrti jeho predsedom."
  - text: >-
      Chatařem tu byl od roku 1948 Rudo Kacián, který podle pramene odpracoval
      na chatách čtyřicet let a je nejdéle působícím vysokohorským nosičem.
    kategorie: jine
    zdroj: >-
      pamiatkynaslovensku.sk (čteno 9. 8. 2026) — „Na chatách pracoval celkom
      40 rokov, čím vošiel do histórie ako najdlhšie pôsobiaci vysokohorský
      nosič".
  - text: >-
      V lokalitě sídlí stanice Horské záchranné služby.
    kategorie: jine
    zdroj: >-
      domalenka.sk (čteno 9. 8. 2026) — „Na lokalite sídli stanica Horskej
      záhrannej služby."
  - text: >-
      Na místě dnešní chaty shořely postupně dvě generace budov — roku 1893
      a znovu roku 1927.
    kategorie: stari
    zdroj: >-
      vysoketatry.com a německá Wikipedie (čteno 9. 8. 2026).

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Srubová chata z roku 1934 pod Hrebienkom, kterou postavil německý spolek
  Karpathenverein na pozemku darovaném lékařem Michalem Guhrem. Nesla jeho
  jméno, od roku 1946 se jmenuje po Pavlu Bilíkovi. Od stanice lanovky je to
  sem tři sta metrů.
text:
  - >-
    Bilíkova chata stojí ve 1255 metrech na jihovýchodním úpatí Slavkovského
    štítu, těsně pod Hrebienkom, na místě zvaném Kancle. Na její výšce se
    shodne devět pramenů do metru — bez jediné odchylky, což je v tomhle
    průvodci vzácnost.
  - >-
    Místo má za sebou dvě generace vyhořelých budov. Od roku 1875 tu stála
    Ruženina chata, roku 1884 k ní přibyl dvoupatrový hotel Studený potok
    a obojí roku 1893 shořelo. Nové budovy Studenopotockých kúpelí vyhořely
    znovu v noci na 18. února 1927. Téhož roku koupil pozemek lékař Michal
    Guhr z Tatranské Polianky a daroval ho Karpathenvereinu.
  - >-
    Ten na něm postavil dnešní srubovou chatu a otevřel ji 22. prosince 1934.
    Stavěl ji kežmarský stavitel Oskár Zuber podle vlastních projektů, takže
    architekt a stavitel jsou tu jedna osoba. Základní kámen položil
    15. září 1934 předseda spolku Mikuláš Szontagh mladší — Guhr už rok
    nežil, a chata proto dostala jeho jméno posmrtně: Guhrov mládežnícky
    domov, zkráceně Guhrova chata. Přístavba z roku 1936 přinesla novou
    jídelnu a zvedla kapacitu ze čtyřiceti na osmapadesát lůžek.
  - >-
    Guhr sám stojí za pozornost i mimo tatranský kontext: byl předsedou
    Karpathenvereinu od roku 1920 do své smrti a podle Slovenského
    olympijského výboru jediným účastníkem ze Slovenska na prvních zimních
    olympijských hrách v Chamonix roku 1924.
  - >-
    Roku 1946 chatu převzal Klub slovenských turistov a lyžiarov a přejmenoval
    ji na Bilíkovu — po Pavlu Bilíkovi, kterého Němci zajali při bojové akci
    nad Horným Smokovcem a popravili na Kežmarském hradě. Prameny se liší
    v tom, jestli byl inspektorem finanční stráže, nebo kapitánem in memoriam.
    Pamětní deska je na chatě dodnes. Roku 1992 byla chata vyčleněna
    z Interhotelu Tatry do privatizace a po rekonstrukci se 1. února 1993
    znovu otevřela.
  - >-
    Dnes je to spíš horský hotel než chata: pokoje se sdílenou i vlastní
    koupelnou, dva apartmány v podkroví, finská sauna a restaurace
    s regionální kuchyní. Kolik má přesně lůžek, prameny neříkají shodně —
    28 plus 5, 28 plus 11, 29 plus 1, nebo 33; vlastní web žádné číslo
    neuvádí. Na téhle stránce je zapsané nejnižší doložené.
  - >-
    Že sem může přijít i ten, kdo tu nespí, žádný pramen doslova neříká, ale
    čísla mluví: vysoketatry.com uvádí kapacitu stravování 68 míst a v létě
    120, tedy dvoj- až čtyřnásobek lůžek, a podnik je samostatně veden jako
    restaurace s denním menu.
  - >-
    Chodí se sem od Hrebienku pět minut po zelené, ze Starého Smokovca za
    půl hodiny, od Tatranské Lesné po žluté a pak zelené asi hodinu a půl.
    Chata leží zároveň na červené Tatranské magistrále. Na Hrebienok jede ze
    Starého Smokovca pozemní lanovka a od její stanice je to tři sta metrů;
    tatryportal.sk chatu označuje za dostupnou i pro vozíčkáře. Parkovat se
    dá až dole v Starém Smokovci.
  - >-
    Údaje nese vlastní web chaty, tatranskybedeker.sk, pamiatkynaslovensku.sk,
    nostalgicketatry.sk, vysoketatry.com, olympic.sk, tatryportal.sk,
    domalenka.sk, presovregion.travel a německá Wikipedie; polohu
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
