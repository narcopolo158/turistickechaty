interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/bilikova-chata.yaml (9. 8. 2026).

  KARPATHENVEREIN JE TU KONEČNĚ DOLOŽENÝ — a je to dovětek k záznamu
  z 8. 8. 2026 v data/oblasti/vysoke-tatry.yaml. Tehdy druhá rešerše žádnou
  chatu Karpathenvereinu ve Vysokých Tatrách nenašla a bylo tam napsané, že
  z nenalezení se nesmí stát vyvrácení. Dobře, že tak. Tady spolek doložilo
  PĚT nezávislých pramenů včetně německé Wikipedie a Slovenského olympijského
  výboru, a to i s upřesněním na kežmarskou sekci a se jménem předsedy.
  Ranní opatrnost se vyplatila; kdybych tehdy napsal „vyvráceno", musel bych
  to dnes brát zpátky.

  PROVOZOVATEL SE V PRAMENECH ROZCHÁZÍ a do dat nešel žádný: vlastní web
  v obchodních podmínkách uvádí VERUMCORP s.r.o. (IČO 54335655, vznik
  8. 2. 2022), tag operator v OSM „ROJAX GASTRO, s.r.o." — nejspíš
  neaktualizovaný záznam staršího provozovatele. Vlastník budovy není doložen
  vůbec; poslední doložený je SOKOPO Žilina z roku 1992/93.

  OTEVÍRACÍ DOBA MÁ NEJSLABŠÍ DOKLAD Z CELÉHO PROFILU. Zapsaná je, protože ji
  shodně nesou dva nezávislé prameny (TripAdvisor a tag opening_hours v OSM),
  ale ani jeden z nich není provozovatel a vlastní web hodiny neuvádí. Kdyby
  se ukázalo, že je stará, nebude to překvapení.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: zahájení stavby (rozhodnutí 2. 9. 1933 ×
  stavba 1933–34 × základní kámen 15. 9. 1934); kapacita (28+5 × 28+11 ×
  29+1 × 33 × 12 pokojů); hodnost Pavla Bilíka (inspektor finanční stráže ×
  kapitán in memoriam).

  NEDOLOŽENO, a nenalezení není vyvrácení: samostatný architekt (projekt je
  dílem stavitele Zubera); formální akt znárodnění; dnešní vlastník budovy;
  původ přezdívky „Bilíčka", kterou dva prameny mají v titulku, ale nikde ji
  nevysvětlují. Slovenskou Wikipedii se rešerši nepodařilo načíst.
  Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
