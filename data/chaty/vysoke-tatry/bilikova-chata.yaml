# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1934
overeniHistorie:
  source: >-
    Otevření 22. prosince 1934 uvádějí shodně nostalgicketatry.sk, německá
    Wikipedie i tatranskybedeker.sk (vše čteno 9. 8. 2026).
    STAVEBNÍKEM BYL KARPATHENVEREIN, a tentokrát to není domněnka — doloženo
    je to pěti nezávislými prameny. pamiatkynaslovensku.sk: „V roku 1934
    postavil turistický spolok Karpathenverein chatu, ktorú na počesť svojho
    predsedu Dr. Michala Guhra pomenoval Guhrova chata."; tatranskybedeker.sk
    upřesňuje sekci — „daroval ich kežmarskej sekcii Karpathenvereinu";
    nostalgicketatry.sk „Chatu prevzala do správy kežmarská odbočka
    Karpatského spolku"; německá Wikipedie „der Karpathenverein, der hier
    1933–34 die zweigeschossige Dr.-Guhr-Hütte errichtete"; olympic.sk
    nezávisle dokládá dar pozemku — „V roku 1927 odkúpil Guhr pozemky na
    Hrebienku, ktoré venoval Karpathenvereinu."
    Stavitel: „Peknú zrubovú chatu podľa vlastných projektov postavil
    kežmarský staviteľ Oskár Zuber" (nostalgicketatry.sk); samostatný
    architekt tedy neexistuje, projekt je dílem stavitele. Základní kámen
    položil 15. září 1934 předseda spolku Dr. Mikuláš Szontagh mladší.
    ROZPOR V ZAHÁJENÍ STAVBY, nesrovnaný: tatranskybedeker.sk klade
    rozhodnutí o stavbě k 2. září 1933, německá Wikipedie stavbu do let
    1933–34, nostalgicketatry.sk položení základního kamene až na
    15. září 1934, tedy tři měsíce před otevřením.
  verified: false
  checked: '2026-08-09'

