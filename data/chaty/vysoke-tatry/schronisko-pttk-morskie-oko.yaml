    Celoroční provoz uvádějí schroniskaturystyczne.pl („Funkcjonuje
    całorocznie") a skitourowezakopane.pl („Schronisko funkcjonuje przez cały
    rok"); nepřímo ho dokládá ceník vlastního webu, který pokrývá celý rok
