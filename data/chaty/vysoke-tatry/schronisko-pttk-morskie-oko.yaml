# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1908
overeniHistorie:
  source: >-
    ROK 1908 JE ROKEM DNEŠNÍ HLAVNÍ BUDOVY, ne první stavby u jezera — ta je
    v milnících a sahá až do 17. století. Vlastní web (čteno 9. 8. 2026):
    „Prace przy kolejnym schronisku rozpoczęto w 1907 roku. […] Nowe
    schronisko zostało oddane do użytku w 1908 roku i służy ono do dnia
    dzisiejszego."; PTTK Małopolska: „Uroczyste otwarcie schroniska nastąpiło
    15 sierpnia 1908 r. z udziałem wielu znamienitych gości m.in. Mieczysława
    Karłowicza, Jana Kasprowicza, Władysława Reymonta, Leopolda Staffa."
    PROJEKTANT: „skromny projekt Wandalina Beringera" (PTTK Małopolska).
    OSAMOCENÉ TVRZENÍ, nezapsané: whitemad.pl uvádí, že budově „Nadano mu
    styl zakopiański, którego twórcą jest Stanisław Witkiewicz" — to je
    v napětí s formulací PTTK o Beringerově projektu a nikdo jiný to
    nepotvrzuje.
    ROZPOR VE JMÉNU ZAKLADATELE PRVNÍ CHATY (1827), nesrovnaný: PTTK
    Małopolska i whitemad.pl uvádějí Emanuela Homolacse, historykon.pl
    Edmunda Homolacse.
    ROZPOR V ROCE POJMENOVÁNÍ po Stanisławu Staszicovi: historykon.pl klade
    jméno už k otevření roku 1874 a uvádí, že ho navrhl Leopold Świerz;
    whitemad.pl uvádí „16 września 1875 r."
  verified: false
  checked: '2026-08-09'

milniky:
  - rok: 1827
    udalost: >-
      Majitel pozemků Homolacs postavil nad Morskim Okiem první chatu; podle
      pramene měla „izby noclegową, kuchnię, niewielką sień i strych".
      Prameny se rozcházejí v jeho křestním jménu.
    zdroj: >-
      PTTK Małopolska (čteno 9. 8. 2026) — „Pierwsze schronisko wybudował
      Emanuel Homolacs w 1827 r."; historykon.pl uvádí Edmunda Homolacse
      a popis vybavení. Ještě starší stavbu zmiňuje PTTK Małopolska:
      „Pierwszy budynek przeznaczony do nocowania powstał nad […] Okiem już
      w XVII w. Był to mały kamienny szałas".
  - rok: 1865
    udalost: >-
      První chata za nevyjasněných okolností vyhořela.
    zdroj: >-
      PTTK Małopolska (čteno 9. 8. 2026) — „Przetrwało do 1865 r., kiedy
      w niewyjaśnionych okolicznościach spłonęło."
  - rok: 1874
    udalost: >-
      Towarzystwo Tatrzańskie otevřelo 3. srpna novou chatu, obrácenou
      průčelím k jezeru. Dostala jméno po Stanisławu Staszicovi.
    zdroj: >-
      historykon.pl (čteno 9. 8. 2026) — „dopiero w 3 sierpnia 1874 roku
      otwarto nowe schronisko nad Morskim Okiem. Inicjatorem budowy było
      istniejące już wówczas Towarzystwo Tatrzańskie"; vlastní web —
      „staraniem Towarzystwa Tatrzańskiego wybudowano niewielki obiekt
      zwrócony frontem do jeziora."
  - rok: 1891
    udalost: >-
      Vedle chaty postavilo Towarzystwo Tatrzańskie druhou budovu, původně
      vozovnu. Ta stojí dodnes jako Stare Schronisko.
    zdroj: >-
      historykon.pl (čteno 9. 8. 2026) — „w 1891 roku dostawiono obok niego
      drugi budynek, który wówczas miał służyć za wozownię."; PTTK Małopolska
      datuje stavbu do let 1890–1891.
  - rok: 1898
    udalost: >-
      Hlavní budova v noci z 1. na 2. října vyhořela; dalších deset let
      sloužila jako chata vozovna.
    zdroj: >-
      historykon.pl (čteno 9. 8. 2026) — „w nocy z 1 na 2 października 1898
      roku, kiedy to budynek spłonął."; vlastní web — „W międzyczasie jako
      schronisko służyła wozownia (dzisiejsze Stare Schronisko)."
  - rok: 1902
    udalost: >-
      Rozhodčí soud v Grazu 13. září ukončil spor Haliče a Uher o Morskie
      Oko; Haliči přiřkl 351 hektarů. Polskou stranu hájil profesor Oswald
      Balzer, po němž se jmenuje silnice k jezeru.
    zdroj: >-
      dzieje.pl (čteno 9. 8. 2026) — rozsudek 13. 9. 1902, předseda soudu
      Johann Winckler; „Obrońcą ze strony polskiej był profesor Oswald
      Balzer"; tpn.gov.pl — „»Drogę Oswalda Balzera« - trasę z Zakopanego
      przez Jaszczurówkę do Morskiego Oka, ukończoną w 1902 roku."
  - rok: 1908
    udalost: >-
      Nová hlavní budova podle projektu Wandalina Beringera byla 15. srpna
      otevřena za účasti Mieczysława Karłowicze, Jana Kasprowicze, Władysława
      Reymonta a Leopolda Staffa.
    zdroj: >-
      PTTK Małopolska (čteno 9. 8. 2026).
  - rok: 1976
    udalost: >-
      Budova byla zapsána mezi památky.
    zdroj: >-
      whitemad.pl (čteno 9. 8. 2026) — „Budynek został w 1976 roku uznany za
      zabytkowy".
  - rok: 1992
    udalost: >-
      Skončila generální rekonstrukce zahájená roku 1988.
    zdroj: >-
      historykon.pl (čteno 9. 8. 2026) — „dopiero w latach 1988-1992
      przeprowadzono w nim generalny remont".

