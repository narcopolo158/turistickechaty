    provozovatel jako červenec a srpen. Noční klid „od 22:00 do 6:00".
    „OTEVŘENO ≠ DOSTUPNÉ" MÁ TADY PODOBU DAVU A REŽIMU PARKU, ne uzávěry:
    vstup do Tatrzańského parku narodowého je zpoplatněn (tpn.gov.pl, čteno
