# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dřevěná chata z roku 1908 na břehu největšího tatranského jezera, kterou
  po dvou požárech postavilo Towarzystwo Tatrzańskie podle projektu Wandalina
  Beringera. Vedle ní stojí Wozownia z roku 1891, podle provozovatele
  nejstarší dochovaná chata polských Tater. Od roku 1945 ji vede jedna rodina.
text:
  - >-
    Schronisko PTTK nad Morskim Okiem stojí ve 1410 metrech na severním břehu
    jezera, jehož rozlohu uvádí Tatrzański park narodowy jako 34,5 hektaru.
    Je to první polský objekt tohohle průvodce.
  - >-
    Historie začíná v 17. století, kdy pod morénou stál malý kamenný šalaš.
    První skutečnou chatu tu postavil roku 1827 majitel pozemků Homolacs —
    prameny se neshodnou, jestli Emanuel, nebo Edmund. Roku 1865 shořela.
    Towarzystwo Tatrzańskie otevřelo novou 3. srpna 1874 a dalo jí jméno po
    Stanisławu Staszicovi; roku 1891 k ní přistavělo druhou budovu, původně
    vozovnu. V noci z 1. na 2. října 1898 hlavní budova shořela taky a chatou
    se na deset let stala právě vozovna.
  - >-
    Dnešní dřevěná budova na kamenné podezdívce je z roku 1908, projektoval
    ji Wandalin Beringer a otevřeli ji 15. srpna za účasti Mieczysława
    Karłowicze, Jana Kasprowicze, Władysława Reymonta a Leopolda Staffa —
    tedy skladatele a tří literátů, z nichž dva měli Nobelovu cenu, respektive
    na ni byli navrženi. Roku 1976 se budova stala památkou, v letech 1988 až
    1992 prošla generální rekonstrukcí.
  - >-
    Vozovna stojí dodnes sedmdesát čtyři metrů od hlavní budovy a slouží jako
    noclehárna téhož provozu; provozovatel ji označuje za nejstarší
    dochovanou chatu polských Tater. Spí se v ní ve třech velkých sálech,
    v hlavní budově v pokojích od tří do šesti lůžek. Dohromady prameny
    uvádějí 78 nebo 79 míst.
  - >-
    Jedna věc je tu doložená líp než u tatranských chat na slovenské straně:
    ceník výslovně říká, že „wrzątek dla turystów" je zdarma a vydává se
    „poza kolejnością", tedy mimo pořadí. Rozlišuje turisty od ubytovaných
    hostů a dává jim přednost — a bufet vedle sladkostí prodává mapy,
    turistickou literaturu a suvenýry. Výslovná věta o obsluze kolemjdoucích
    to sice není, ale blíž jsme se v Tatrách zatím nedostali. Platí se jen
    hotově.
  - >-
    Chodí se sem od Palenice Białczańské po červené, prameny udávají mezi
    7,8 a 8,6 kilometru a zhruba dvě hodiny dvacet minut. Trasa vede po
    silnici, které se říká Droga Oswalda Balzera po právním historikovi, jenž
    roku 1902 hájil polskou stranu ve sporu o Morskie Oko před rozhodčím
    soudem v Grazu — a vyhrál 351 hektarů. Silnice je od roku 1998 uzavřená
    cyklistům, koňské povozy vozí jen na polanu Włosienica a vstup do parku
    je zpoplatněn.
  - >-
    Že tu bývá plno, není dojem: 3. srpna 2021 sem podle novin vyšlo přes
    patnáct tisíc lidí za jediný den a ředitel parku to označil za rekord.
    Chatu přitom vede od roku 1945 jedna rodina — Wanda a Czesław Łapińští,
    pak jejich syn Wojciech a dnes jeho žena Maria s dcerou a synem.
  - >-
    Údaje nese vlastní web chaty, PTTK Małopolska, historykon.pl,
    whitemad.pl, portaltatrzanski.pl, tpn.gov.pl, dzieje.pl
    a gazetakrakowska.pl; polohu OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
