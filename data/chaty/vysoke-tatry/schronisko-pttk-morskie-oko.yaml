interniPoznamky: >-
  Povýšeno ze DVOU kandidátů DATA-01 (9. 8. 2026):
  vysoke-tatry/schronisko-pttk-morskie-oko a
  vysoke-tatry/stare-schronisko-pttk-morskie-oko.

  SLOUČENÍ PODLE PRAVIDLA Z KOZUBOVÉ, ale opačným směrem než u Majláthovy
  chaty — a proto to stojí za rozvedení. Pravidlo zní: rozhoduje jedna stavba
  NEBO jeden provoz, ne blízkost. U Popradského plesa jsou dvě budovy
  106 metrů od sebe a DVA majitelé → dva profily. Tady jsou dvě budovy
  74 metrů od sebe (naměřeno z GPS obou kandidátů), ale JEDEN provoz: jeden
  provozovatel, jeden web, jeden ceník, jedna recepce, a provozovatel sám
  popisuje Wozownii jako noclehárnu téhož schroniska. Jeden profil.
  Vzdálenost tedy skutečně nerozhoduje: 74 m se slučuje, 106 m ne.

  PRVNÍ POLSKÝ OBJEKT KORPUSU VE VYSOKÝCH TATRÁCH a hned přinesl něco, co
  slovenská strana nemá: doklad, který rozlišuje turisty od ubytovaných.
  Věta „Wrzątek dla turystów bezpłatny do naczyń własnych podawany poza
  kolejnością" není přímé „obsloužíme neubytované", ale je to nejblíž, kam
  se korpus u tatranských chat zatím dostal. Stojí za úvahu, jestli u
  polských chat PTTK nebude doklad obecně lepší — mají ceníky a řády na webu.

  VÝŠKA — MÍSTO, KDE JSEM KONVENCI VĚDOMĚ NEPOUŽIL, a je to jiný důvod než
  u Chaty pri Zelenom plese. Tam šlo o drtivou shodu proti odlehlé hodnotě.
  Tady jde o to, že 1402, 1405, 1406 a 1410 m nejsou čtyři názory na tutéž
  věc: PTTK sám u budovy z roku 1908 uvádí 1406 m a v hlavičce 1402 m, což
  vypadá jako hladina jezera proti prahu chaty. Konvence řeší spor pramenů,
  ne rozdíl měřených bodů. Patří to k otázce KONTROLA-11.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: křestní jméno Homolacse (Emanuel ×
  Edmund); rok pojmenování po Staszicovi (1874 × 16. 9. 1875); kapacita
  Nového schroniska (35 × 36) a součet (78 × 79); zakopanský sloh
  a Witkiewicz (osamocené tvrzení whitemad.pl proti „skromnému projektu"
  Beringera u PTTK).

  VLASTNICTVÍ JE PŘEDMĚTEM SPORU a do dat nešlo. rp.pl cituje obě strany:
  „Schroniska nad Morskim Okiem i w Dolinie Roztoki znajdują się na gruncie
  należącym do Skarbu Państwa" a „Z mocy prawa park narodowy stał się
  użytkownikiem terenu i właścicielem znajdujących się na nim budynków"
  proti stanovisku PTTK „Uważamy, że oba schroniska są własnością PTTK i to
  od XIX wieku." Rozhodnutí soudu k Morskému Oku nenalezeno.

  NEDOLOŽENO, a nenalezení není vyvrácení: e-mail (portaltatrzanski.pl uvádí
  schronisko@morskieoko.pl, vlastní web žádný); aktuální ceník koňských
  povozů; případná krátká lednová přestávka, kterou naznačuje mezera
  v ceníku mezi 10. 1. a 8. 1. Polskou Wikipedii se rešerši nepodařilo
  načíst. Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
