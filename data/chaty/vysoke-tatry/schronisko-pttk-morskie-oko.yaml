nocleh: ano
kapacita: 78
overeniNocleh:
  source: >-
    ZAPSANÝ JE SOUČET OBOU BUDOV, PROTOŽE JE TO JEDEN PROVOZ. Vlastní web
    (čteno 9. 8. 2026): „Schronisko dysponuje 36 miejscami noclegowymi dla
    turystów." pro Nowe Schronisko a „Wozownia dysponuje 43 miejscami
    noclegowymi w standardzie turystycznym w trzech wieloosobowych salach."
    ROZPOR, přiznaný: PTTK Małopolska i historykon.pl uvádějí u Nového
    schroniska 35 lůžek, takže součet je 78 (natatry.pl) místo 79
    (portaltatrzanski.pl, whitemad.pl, schroniskaturystyczne.pl). Zapsáno
    nižší číslo (konvence 27. 7. 2026).
    Skladba Nového schroniska podle vlastního webu: tři třílůžkové, jeden
    čtyřlůžkový, jeden pětilůžkový a tři šestilůžkové pokoje; „Wszystkie
    łóżka w Nowy Schronisku z pościelą." Ve Wozowni jsou tři velké sály
    s patrovými postelemi a pryčnami. Ceny 2026: 120 až 140 zł podle sezóny,
    Wozownia 90 zł, k tomu „opłata klimatyczna 2,50 zł za każdą dobę".
    Rezervace: „Rezerwacji należy dokonywać nawet na rok przed planowanym
    przyjazdem".
  verified: false
  checked: '2026-08-09'

# ── Občerstvení ───────────────────────────────────────────────────────────
kuchyne: ano
typObcerstveni: restaurace
overeniObcerstveni:
  source: >-
    Vlastní web (čteno 9. 8. 2026): „W budynku Nowego Schroniska kuchnia
    czynna w sezonie (lipiec, sierpień) od godziny 7:00 do 21:00, poza
    sezonem od 9:00 do 18:00." a „Sklepik »Bufet« w sezonie od godziny 8:00
    do 19:00, poza sezonem od 9:00 do 18:00." V bufetu jsou „słodycze,
    podstawowe elementy wyposażenia turystycznego, literatura, pamiątki".
    Platí se jen hotově: „Brak możliwości płacenia kartą."
    VÝSLOVNÁ VĚTA O NEUBYTOVANÝCH CHYBÍ, ale polské prameny nabízejí formulaci,
    která je jinde v korpusu k nemání: „Wrzątek dla turystów bezpłatny do
    naczyń własnych podawany poza kolejnością." Rozlišuje turisty od hostů
    a dává jim přednost ve frontě — to u zařízení jen pro ubytované nedává
    smysl. Sortiment bufetu (mapy, turistická literatura, suvenýry) míří na
    kolemjdoucí taky. Za doklad to ale nevydáváme.
  verified: false
  checked: '2026-08-09'

