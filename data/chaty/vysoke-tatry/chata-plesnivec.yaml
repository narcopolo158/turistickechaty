# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Jediná fungující chata v Belianských Tatrách, v závěru Doliny siedmich
  prameňov. Turistickou chatu z ní roku 1932 udělal Tibor Gresch z Karpatského
  spolku; po znárodnění čtyřicet let sloužila jako stanice a veřejnosti se
  vrátila až roku 1997. Vlastní ji město Spišská Belá.
text:
  - >-
    Chata Plesnivec stojí ve 1290 metrech v závěru Doliny siedmich prameňov
    v Belianských Tatrách. Podle tří pramenů včetně slovenského Forbesu je
    jediná fungující chata celého pohoří — a to není poetická formulace, ale
    důsledek toho, že Správa TANAP tu od roku 1978 uzavřela většinu území
    a všechny hřebenové značky.
  - >-
    Historie místa má čtyři vrstvy. Na konci 18. století si tu postavil srub
    zlatokop Dreschler z nedalekých Rakús. Roku 1892 na témž místě postavili
    nový srub kolaři, kteří v dolině těžili javorové dřevo na kola a nářadí;
    používali ho i pastevci, kteří chodili pást na Predné a Zadné Meďodoly.
    A až roku 1932 si pozemek pronajal od města Spišská Belá Tibor Gresch,
    člen Karpatského spolku, a udělal ze staré chatky turistickou chatu
    Plesnivec. Roku 1936 přistavěl patro se dvěma společnými ložnicemi
    a čtyřmi pokoji, čímž kapacita stoupla na padesát míst, a 26. června 1938
    novou chatu slavnostně otevřel.
  - >-
    Pak přišel zlom. Gresch musel po válce opustit Slovensko, roku 1948 byla
    chata znárodněna a od roku 1953 ji Správa TANAP zavřela veřejnosti
    a zřídila z ní meteorologickou stanici. Starala se o ni Eva Ružičková-
    Kasická z Prahy s manželem až do důchodu roku 1978; v létě sem jezdili
    botanici a biologové z Masarykovy univerzity a z Plzně, protože dolina má
    podle chaty nejbohatší zastoupení rostlinných druhů v Tatrách. Jak dlouho
    přesně stanice fungovala, prameny neříkají shodně — uvádějí 1953–1978,
    1955–1997 i 1953–1993.
  - >-
    Roku 1993 chatu dostalo zpět město Spišská Belá a pronajalo ji chataři
    Jánu Matavovi. Ten s přáteli a rodinou nejdřív opravil cestu a mosty přes
    potok Čierna voda, pak střechu, trámy, okna, kanalizaci, topení a čistírnu
    — a 4. října 1997 byla chata vysvěcena a znovu otevřena. Dostala i svůj
    symbol zpátky: květ plesnivce, tedy protěže alpské, který měla ve znaku
    na modro-bílé vlajce.
  - >-
    Spí se tu ve dvaceti místech, buď na povlečení, nebo ve vlastním spacáku
    za nižší cenu; psi dovnitř nesmějí. Jídelna s velkým kamenným krbem má
    čtyři stoly a pojme asi dvacet lidí. Vaří se tu teple, na výběr je hodně
    polévek a čepovaných nápojů. Že sem může přijít i ten, kdo tu nespí,
    žádný pramen doslova neříká — obě samosprávy ale vedou stravování jako
    „bufet" a polopenze pro ubytované se hlásí zvlášť dva dny předem.
  - >-
    Chodí se sem nejčastěji z Tatranské Kotliny, po zelené za hodinu dvacet
    až hodinu a půl s převýšením kolem šesti set metrů. Dál vedou trasy od
    Kopského sedla, od Chaty pri Zelenom plese a od Tatranské Javoriny.
    A tady je to s uzávěrami obráceně než jinde v Tatrách: chodníky na Kopské
    sedlo a Monkovou dolinou jsou od 1. listopadu do 31. května uzavřené,
    ale Dolina siedmich prameňov v seznamu uzavřených chodníků není, takže
    přístup zdola funguje celý rok. Hřebenovka Belianek je turistům zavřená
    natrvalo — beliansketatry.com vede Havran i Ždiarskou vidlu jako
    „turisticky nesprístupnené".
  - >-
    Údaje nese vlastní web chaty, město Spišská Belá, obec Ždiar,
    tatranskybedeker.sk, hiking.sk, vysoketatry.com, turisticky.sk, forbes.sk
    a seznam uzavřených chodníků TANAP; polohu OpenStreetMap. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
