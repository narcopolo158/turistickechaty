interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/plesnivec.yaml (9. 8. 2026).
  SLUG SE PŘI POVÝŠENÍ ZMĚNIL z `plesnivec` na `chata-plesnivec` a název
  z „Plesnivec" na „Chata Plesnivec" — OSM nese jen jednoslovnou podobu,
  ale vlastní web, město Spišská Belá i obec Ždiar používají shodně celý
  název. Kandidátský soubor je smazaný, aby nezůstal dvojník.

  PAST, DO KTERÉ JSEM SKORO ŠLÁPL: anglická verze vlastního webu označuje
  Jána Matavu za „current owner". Slovenský originál i obě samosprávy shodně
  říkají, že vlastníkem je MĚSTO Spišská Belá a Matava je nájemce a chatař.
  Do dat šla verze samospráv. Je to připomínka, že vlastní web není
  automaticky nejlepší pramen — u vlastnických vztahů má přednost ten, kdo
  vlastní.

  BELIANSKÉ TATRY JSOU PÁTÝ TYP REŽIMU „OTEVŘENO ≠ DOSTUPNÉ" a liší se od
  všech čtyř dosavadních (tatranská sezónní uzávěra, jednosměrné rokliny
  Slovenského raje, vstupné a soumrakový režim Bieszczad, tvrdá sezónnost
  Chaty pod Rysmi). Tady je zavřené celé pohoří, natrvalo, od roku 1978 —
  a chata je uvnitř té uzávěry jedinou přístupnou stavbou. Zajímavé je, že
  se to na její dostupnosti neprojevuje: v oficiálním seznamu uzavřených
  chodníků TANAP figurují chodníky na Kopské sedlo a Monkovou dolinou, ale
  ne Dolina siedmich prameňov. Chata je tedy celoročně dostupná zdola
  a sezónně nedostupná shora. Stojí za úvahu, jestli to nemá být samostatná
  oblast — Belianské Tatry mají jiný režim, jiné podloží (vápenec) a jediný
  objekt; zatím to nechávám ve Vysokých Tatrách a předkládám Michalovi.

  ROZPOR O OBDOBÍ STANICE, nesrovnaný: 1953–1978 (vlastní web SK,
  tatranskybedeker.sk) × 1955–1997 (hiking.sk, vysoketatry.com) × 1953–1993
  (anglická verze vlastního webu). Do milníků šel jen začátek roku 1953,
  který nese slovenský originál.

  NEDOLOŽENO, a nenalezení není vyvrácení: jakýkoli požár; starší (německý
  nebo maďarský) název chaty — formulace „dostala svoje pôvodné meno" z roku
  1997 naznačuje, že v období stanice se chata jmenovala jinak, ale jak,
  neuvádí nikdo; výslovná věta o obsluze neubytovaných.
  Slovenskou Wikipedii se rešerši nepodařilo načíst.
  Fotku dodá běh DATA-02, výškový profil přístupu DATA-06.
