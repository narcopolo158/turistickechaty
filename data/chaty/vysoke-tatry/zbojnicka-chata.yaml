# ── Historie ──────────────────────────────────────────────────────────────
rokVzniku: 1907
overeniHistorie:
  source: >-
    Rok 1907 uvádějí oba prameny shodně, ale ROZCHÁZEJÍ SE V TOM, KDO
    STAVĚL (čteno 8. 8. 2026): vysoketatry.com — „Uhorský lesný erár
    postavil tu r. 1907 poľovnícku chatku a po menších úpravách ju r. 1910
    odovzdal turistickej verejnosti."; nostalgicketatry.sk — „Útulňa vo
    Veľkej Studenej doline vznikla v roku 1907 z iniciatívy UKS" (Uhorský
    karpatský spolok), s tím, že největší podíl na realizaci měl lesní rada
    Imrich Csik. Je možné, že jde o dvě různé role (vlastník pozemku ×
    iniciátor), ale žádný pramen to tak neříká, a proto se stavebník do dat
    nezapisuje. Zpřístupnění veřejnosti 1910 (oba prameny), přístavba 1924,
    kterou vznikla dnešní obhospodařovaná chata (vysoketatry.com).
    JMÉNO: název „Zbojnícka" navrhl 9. dubna 1933 Štefan Zamkovský a od
    dubnového dvojčísla téhož roku je objekt veden jako „Zbojnícka útulňa
    KČST" (nostalgicketatry.sk). Celoroční provoz od 1932–33 (hiking.sk)
    nebo od léta 1933 (nostalgicketatry.sk) — ROZPOR. Rekonstrukce
    1984–1986 (vysoketatry.com) × 1986 (hiking.sk).
    Vlastnictví: horydoly.cz vede chatu mezi pěti „pod správou KST";
    doslovný doklad vlastnického titulu chybí.
  verified: false
  checked: '2026-08-08'

