interniPoznamky: >-
  Povýšeno z data/kandidati/vysoke-tatry/zbojnicka-chata.yaml (8. 8. 2026),
  druhý publikovaný profil oblasti Vysoké Tatry.

  ROK POŽÁRU: 1998 drží čtyři prameny (dennikn.sk, nostalgicketatry.sk,
  tatryportal.sk, hiking.sk), rok 1999 jediný (vysoketatry.com). Zapsáno
  1998; rozpor je přiznaný v milníku i tady. Není to případ pro konvenci
  „nižší číslo", ale pro poměr pramenů — čtyři proti jednomu.

  A JEDEN ROZPOR, KTERÝ SE NEDAL OVĚŘIT: titulek článku SME zní „Zbojnícka
  chata zhorela pred 15 rokmi, IHNEĎ ju obnovili", což je v napětí
  s doloženým otevřením 20. 10. 2001, tedy víc než tři roky po požáru.
  Obsah článku je za paywallem (HTTP 402), takže se rozpor nedal rozhodnout.
  Do dat šlo datum z nostalgicketatry.sk; slovo „ihneď" se nepoužilo.

  STAVEBNÍK SE NEZAPSAL. Uhorský lesný erár × iniciativa Uhorského
  karpatského spolku — dvě různá tvrzení o téže stavbě z roku 1907.
  Je to týž typ opatrnosti jako u Prašivé v Beskydech, kde se prameny
  neshodly na spolku, a stavebník proto v datech není.

  TŘI ZBOJNÍCKÉ V KORPUSU. Tenhle objekt je ten katalogový vysokohorský;
  další dva (u Zakopaného a v Ustroni) jsou od něj 19,9 a 112,4 km
  a rozlišuje je registr jmenovců zapsaný 8. 8. 2026. U profilu je to
  důležité, protože jméno „Zbójnicka chata" nese v polských horách řada
  hospod ve zbojnickém stylu.

  NEDOLOŽENO (nezapsáno): otvírací hodiny, obsluha neubytovaných,
  zásobování (o nosičích ani vrtulníku u téhle chaty pramen nemluví,
  ač u Téryho ano), zdroj vody a elektřiny, právní forma vlastnictví,
  čas z Hrebienku (tři různé hodnoty), rok přechodu na celoroční provoz
  (1932–33 × 1933). Fotku dodá běh DATA-02, výškový profil DATA-06.
