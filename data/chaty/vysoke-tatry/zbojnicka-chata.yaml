# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Vysokohorská chata v horní části Veľké Studené doliny, na místě lovecké
  chatky z roku 1907. V noci ze 14. na 15. června 1998 celá vyhořela
  a znovu se otevřela až 20. října 2001.
text:
  - >-
    Zbojnícka chata stojí v 1960 metrech v horní části Veľké Studené
    doliny. Na výšce se prameny shodují, na začátku už ne: rok 1907 uvádějí
    oba, ale jeden píše, že chatku postavil uherský lesní erár jako
    loveckou, druhý že vznikla z iniciativy Uhorského karpatského spolku.
    Mohou to být dvě role téže stavby, ale žádný pramen to tak neříká, a tak
    tu stavebníka neuvádíme. Turistům se chata otevřela roku 1910
    a dnešní obhospodařovaná podoba vznikla přístavbou v roce 1924.
  - >-
    Jméno je mladší než chata. Navrhl ho 9. dubna 1933 Štefan Zamkovský
    a od konce téhož měsíce se objekt vede jako Zbojnícka útulňa Klubu
    československých turistů.
  - >-
    Nejtěžší datum chaty je 14. červen 1998: v noci na patnáctého celá
    vyhořela, podle pramene se od přehřátého komína chytila střecha. Znovu
    otevřená byla 20. října 2001, tedy víc než tři roky nato, a obnovu vedl
    chatař Ľudovít „Edo" Záhor, který na Zbojníčce hospodařil dvaačtyřicet
    let. V roce 2015 ho vystřídala Dominika Dejczöová.
  - >-
    Chodí se sem z Hrebienku Veľkou Studenou dolinou; prameny udávají dvě
    až tři hodiny podle toho, jak počítají, a proto tu žádný čas
    neuvádíme. Cestou se míjí Rainerova chata. Odsud vede přes Priečne
    sedlo spojka k Téryho chatě — dnes obousměrná, ale exponovaná, takže
    „celoročně otevřeno" tu opět neznamená „celoročně dostupné".
  - >-
    Spí se v šestnácti lůžkách a chata je otevřená celý rok; po obnově má
    vzduchové kolektory na vytápění. Jestli se tu obslouží i ten, kdo tu
    nespí, prameny neříkají.
  - >-
    Údaje na téhle stránce nesou vlastní web chaty, vysoketatry.com,
    hiking.sk, tatryportal.sk, nostalgicketatry.sk a Deník N; polohu nese
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani návštěvou.
