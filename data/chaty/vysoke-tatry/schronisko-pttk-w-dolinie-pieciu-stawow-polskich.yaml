interniPoznamky: >-
  Povýšeno z
  data/kandidati/vysoke-tatry/schronisko-pttk-w-dolinie-pieciu-stawow-polskich.yaml
  (9. 8. 2026).

  SUPERLATIV JE ZAPSANÝ S ATRIBUCÍ A S ROZDÍLEM, KTERÝ DĚLÁ SÁM PROVOZOVATEL.
  Na podstránce „Warto wiedzieć" stojí „najwyżej położone schronisko
  w Polsce", na titulní straně „Najwyżej położone schronisko turystyczne
  w Polskich Tatrach". Užší verze je bezpečnější a širší se nedá ověřit bez
  srovnání s Karkonoszemi a Bieszczady, takže do zajímavostí šly obě a próza
  je připisuje provozovateli.

  POLSKÉ CHATY MAJÍ LEPŠÍ DOKLAD O NEUBYTOVANÝCH NEŽ SLOVENSKÉ, a tenhle
  profil to potvrzuje potřetí. Přímá věta chybí i tady, ale turistická
  kuchyňka „dla Turystów, którzy są zaopatrzeni we własny prowiant",
  nepřetržitá vroucí voda zdarma, povolení jíst v jídelně vlastní proviant
  a venkovní bufet jsou dohromady doklad jiného řádu než mlčení slovenských
  webů. Stálo by za to při telefonátu DATA-04 zeptat se i tady — nebo naopak
  uznat, že u polských chat PTTK je to standard, který se nepíše.

  PROJEKTANT DO DAT NEŠEL, protože jeho jméno se ve třech pramenech objevuje
  ve třech podobách: Jan Chmielowski (vlastní web), Jan „Olaf" Chmielski
  (klubpodroznikow.com), Jan Chmielewski (i-tatry.pl). Nejpravděpodobnější je
  varšavský urbanista Jan Olaf Chmielewski, ale opravovat vlastní web chaty
  bez pramene by bylo domýšlení.

  ROZPORY, KTERÉ ZŮSTÁVAJÍ OTEVŘENÉ: výška (1670 × 1671 × 1672); počet
  pokojů (12 × 13); rok druhé chaty (1896 × 1898); dokončení proti otevření
  dnešní budovy (1954 × 1956, Zakopane navíc 1947–1953); patrocinium
  „im. Leopolda Świerza", které uvádějí město Zakopane a i-tatry.pl, ale
  vlastní web ne — možná se váže ke třetí budově z roku 1932.

  LAVINA: doložená je evakuace, ne zničení. rmf24.pl popisuje, jak museli
  záchranáři TOPR kvůli lavinovému nebezpečí evakuovat všechny turisty
  vrtulníkem; rok se z pramene nepodařilo zafixovat a do milníků to proto
  nešlo. Že by některá z pěti budov padla lavině, neuvádí nikdo.

  NEDOLOŽENO, a nenalezení není vyvrácení: formální rozlišení vlastníka
  a nájemce (doložen jen správce, PTTK „Karpaty" Sp. z o.o.); konkrétní
  jména odbojářů, o nichž portaltatrzanski.pl mluví obecně; případná
  technická přestávka v provozu. Polskou Wikipedii se rešerši nepodařilo
  načíst. Fotku dodá běh DATA-02, výškový profil přístupů DATA-06.
