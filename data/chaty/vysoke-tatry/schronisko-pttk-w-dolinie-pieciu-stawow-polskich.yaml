    klid „od godziny 22:00 do godziny 6:00"; „Dla tych, którzy chcą wyjść
    w góry z lekkim plecakiem mamy bezpłatną przechowalnię bagażu."
    Rezervace se otevírají po sezónách až rok a půl dopředu.
