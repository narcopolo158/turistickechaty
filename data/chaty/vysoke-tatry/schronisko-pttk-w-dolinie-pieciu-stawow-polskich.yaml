    ROK 1954 JE ROKEM DOKONČENÍ DNEŠNÍ, PÁTÉ BUDOVY V DOLINĚ — celá řada je
    v milnících. PDF W. Łoboze pro PTTK Nowy Sącz (čteno 9. 8. 2026):
    „W 1954 roku ukończono budowę obecnego, piątego już z kolej schroniska
    w Dolinie Pięciu Stawów."; historykon.pl doplňuje, že je to první chata
    doliny, která nestojí u Malého Stawu.
    ROZPOR MEZI DOKONČENÍM A OTEVŘENÍM, přiznaný: korona-gor-polski.pl
    („Obecne schronisko zostało otwarte w 1956 roku."), portaltatrzanski.pl
    a klubpodroznikow.com (březen 1956) kladou otevření o dva roky později;
    město Zakopane datuje stavbu odchylně „w latach 1947–1953". Zapsán je
    rok dokončení stavby, doložený PTTK.
    PROJEKTANT — JMÉNO SE V PRAMENECH KOMOLÍ a do dat proto nešlo: vlastní
    web uvádí vedoucího týmu jako „Jan Chmielowski", klubpodroznikow.com jako
    „Jan »Olaf« Chmielski", i-tatry.pl jako „Jan Chmielewski". Spoluautoři se
    shodují: Anna Górska, Gerard Ciołek, Jędrzej Czarniak, Jerzy Mokrzyński.
