  checked: '2026-08-09'

milniky:
  - rok: 1876
    udalost: >-
      Towarzystwo Tatrzańskie postavilo nad Malým Stawem první chatu doliny,
      jednoprostorový domek z žulových bloků, pojmenovaný po geologovi
      Ludwiku Zejsznerovi.
    zdroj: >-
      historykon.pl (čteno 9. 8. 2026) — „Pierwsze schronisko w Dolinie
      Pięciu Stawów powstało w 1876 roku i nosiło imię Ludwika Zejsznera,
      polskiego geologa"; vlastní web — „niewielki, jednoizbowy budynek
      z bloków granitowych".
  - rok: 1898
    udalost: >-
      Druhou, dřevěnou chatu sem přenesli z Czerwonych Brzeżków. Jeden pramen
      klade tuhle etapu do roku 1896.
    zdroj: >-
      PDF W. Łoboze pro PTTK Nowy Sącz (čteno 9. 8. 2026) — „W 1898
      przeniesiono drugie, drewniane schronisko z Czerwonych Brzeżków.";
      odchylku 1896 uvádí i-tatry.pl.
  - rok: 1932
    udalost: >-
      Třetí chata podle projektu Karola Stryjeńského, ředitele zakopanské
      Školy dřevozpracujícího průmyslu, byla 18. září otevřena; první turisty
      přijímala už od roku 1928.
    zdroj: >-
      magazyngory.pl (čteno 9. 8. 2026) — otevření „18 września 1932 roku";
      „W końcu konstrukcję zadaszono i od 1928 roku przyjmowano pierwszych
      turystów i narciarzy."; historykon.pl ke Stryjeńskému.
  - rok: 1945
    udalost: >-
      Třetí chata v květnu za nevyjasněných okolností vyhořela.
    zdroj: >-
      historykon.pl (čteno 9. 8. 2026) — „W maju 1945 roku budynek spłonął
      w niewyjaśnionych okolicznościach"; shodně magazyngory.pl.
  - rok: 1947
    udalost: >-
      Nad Malým Stawem postavili malou dřevěnou chatu — podle pramene první
      chatu v Tatrách obnovenou po válce. Stojí dodnes a slouží jako
      strážnice Tatrzańského parku narodowého.
    zdroj: >-
      PDF W. Łoboze pro PTTK Nowy Sącz (čteno 9. 8. 2026) — „Było to pierwsze
      w Tatrach odbudowane po wojnie schronisko."; portaltatrzanski.pl —
      „dziś służący jako strażniczówka TPN."
  - rok: 1954
    udalost: >-
      Dokončena dnešní, pátá chata doliny — první, která nestojí u Malého
      Stawu, ale na severním břehu Przedního Stawu. Prameny kladou otevření
      až do roku 1956.
    zdroj: >-
      PDF W. Łoboze pro PTTK Nowy Sącz a historykon.pl (čteno 9. 8. 2026);
      otevření 1956 uvádí korona-gor-polski.pl a klubpodroznikow.com.
  - rok: 1968
    udalost: >-
      Zásobování na posledním úseku z Doliny Roztoki převzala nákladní
      lanovka; předtím ho nosili koně na hřbetě.
    zdroj: >-
      rmf24.pl (čteno 9. 8. 2026) — „od 1968, na ostatnim odcinku z Doliny
      Roztoki, towar dowożony jest specjalną kolejka linową"; „Wcześniej tę
      trasę musiały pokonywać konie z towarem na grzbiecie".
  - rok: 2012
    udalost: >-
      Skončila termomodernizace budovy zahájená roku 2009; ve stejné době
      přibyla malá vodní elektrárna a čistírna odpadních vod.
    zdroj: >-
      portaltatrzanski.pl (čteno 9. 8. 2026) — „W latach 2009-2012 budynek
      przeszedł termomodernizację."; vlastní web datuje elektrárnu
      a čistírnu BIOVAC do let 2009–2010.

