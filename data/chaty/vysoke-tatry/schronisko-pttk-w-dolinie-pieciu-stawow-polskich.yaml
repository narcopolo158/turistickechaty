# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Kamenno-dřevěná chata z roku 1954 na břehu Przedního Stawu, pátá v řadě
  staveb, které v dolině stojí od roku 1876. Provozovatel ji uvádí jako
  nejvýše položené schronisko v Polsku a jediné v polských Tatrách, ke
  kterému nevede sjízdná silnice. Běží na vlastní vodní elektrárně.
text:
  - >-
    Schronisko PTTK w Dolinie Pięciu Stawów Polskich stojí ve 1670 metrech na
    severním břehu Przedního Stawu. Provozovatel ho na jedné stránce označuje
    za „najwyżej położone schronisko w Polsce" a na titulní straně opatrněji
    za nejvýše položené turistické schronisko v polských Tatrách — obě
    formulace stojí vedle sebe na témž webu. Na výšce se prameny neshodnou:
    1670, 1671, nebo 1672 metrů; zapsané je nejnižší číslo.
  - >-
    Dnešní budova je pátá v řadě. První postavilo Towarzystwo Tatrzańskie
    roku 1876 nad Malým Stawem — jednoprostorový domek z žulových bloků
    pojmenovaný po geologovi Ludwiku Zejsznerovi. Druhou, dřevěnou, sem roku
    1898 přenesli z Czerwonych Brzeżków. Třetí navrhl Karol Stryjeński,
    ředitel zakopanské Školy dřevozpracujícího průmyslu; první turisty
    přijímala od roku 1928, slavnostně se otevřela 18. září 1932 a v květnu
    1945 za nevyjasněných okolností vyhořela. Čtvrtá, malá dřevěná z roku
    1947, byla podle pramene první chatou v Tatrách obnovenou po válce
    a stojí dodnes — jako strážnice národního parku.
  - >-
    Pátou, dnešní, dokončili roku 1954; prameny kladou otevření až do března
    1956. Je to první chata doliny, která nestojí u Malého Stawu. Jméno
    hlavního projektanta se v pramenech komolí do tří podob — Chmielowski,
    Chmielski, Chmielewski —, a proto ho tu neuvádíme; tým tvořili Anna
    Górska, Gerard Ciołek, Jędrzej Czarniak a Jerzy Mokrzyński.
  - >-
    Technicky je to pozoruhodný provoz. Elektřinu dodává vlastní vodní
    elektrárna, poháněná vodou svedenou potrubím z Wielkého Stawu do Doliny
    Roztoki; chatařka Marychna Krzeptowska pro rozhlas říká, že veškerá
    energie v chatě je zelená. Odpadní vodu čistí čistírna BIOVAC z let
    2009 až 2010, od roku 2019 se nápoje vydávají do vratných kelímků nebo
    přímo do vlastních nádob a odpad se lisuje kvůli odvozu. Zásobování
    obstarává od roku 1968 nákladní lanovka z Doliny Roztoki — předtím ho
    nosili koně na hřbetě.
  - >-
    Spí se tu v šedesáti sedmi lůžkách v pokojích od dvou do deseti lidí,
    deky jsou v ceně a povlečení se připlácí. Kuchyně vaří od osmi ráno do
    devíti večer se dvěma přestávkami, k tomu je tu bufet vnitřní i venkovní
    s grilovanými pokrmy. A tady je doklad o obsluze kolemjdoucích silnější
    než u slovenských chat, i když pořád ne přímý: chata má turistickou
    kuchyňku „dla Turystów, którzy są zaopatrzeni we własny prowiant",
    vroucí voda je zdarma čtyřiadvacet hodin denně a v jídelně se smí jíst
    i vlastní jídlo z batohu.
  - >-
    Autem se sem nedostanete a chata to sama uvádí jako svou zvláštnost.
    Chodí se sem z Palenice Białczańské asi tři hodiny, od chaty v Dolině
    Roztoki dvě a půl a od Morského Oka přes Świstówku Roztockou zhruba dvě.
    Celý Tatrzański park narodowy je přitom režimový: vstup se platí,
    nocování mimo schroniska je zakázané pod pokutou padesáti až pěti set
    zlotých a od dubna do konce listopadu platí zákaz pobytu v parku od
    soumraku do svítání. „Otevřeno" tu tedy neznamená jen provozní dobu —
    znamená, že kdo nemá rezervaci a přijde pozdě, nemá kde zůstat.
  - >-
    Údaje nese vlastní web chaty, ústředí PTTK, PDF W. Łoboze pro PTTK Nowy
    Sącz, historykon.pl, magazyngory.pl, portaltatrzanski.pl,
    portalgorski.pl, korona-gor-polski.pl, rmf24.pl, tpn.gov.pl
    a najednejlinie.pl; polohu OpenStreetMap. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
