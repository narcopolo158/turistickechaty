kuchyne: ano
typObcerstveni: restaurace
overeniObcerstveni:
  source: >-
    Vlastní web (čteno 9. 8. 2026): „W schronisku znajduje się kuchnia
    oferująca całodzienne wyżywienie oraz bufet z zimnymi napojami, piwem
    i słodyczami." a „Jest też duża, ale bardzo przytulna sala jadalna. Tu
    można zjeść dania oferowane przez naszą kuchnię, jak i własny,
    przyniesiony w plecaku, prowiant."
    TŘI FORMULACE, KTERÉ JSOU K OBSLUZE NEUBYTOVANÝCH BLÍŽ NEŽ COKOLI
    V SLOVENSKÉ ČÁSTI KORPUSU, i když ani jedna není přímá věta: (1) „Dla
    Turystów, którzy są zaopatrzeni we własny prowiant oraz sprzęt do
    gotowania, mamy kuchnię turystyczną, z której mogą korzystać."; (2)
    „Wrzątek pobierać można całą dobę, jest bezpłatny."; (3) ceník rozlišuje
    „Bufet wewnętrzny" a „Bufet zewnętrzny" s grilovanými pokrmy — venkovní
    bufet u chaty se šedesáti sedmi lůžky dává smysl jen s průchozími.
    Ústředí PTTK to shrnuje jako „Gastronomia: kuchnia dla turystów,
    jadalnia, bufet" a „kuchnia turystyczna z dostępem wrzątku 24/24".
    Provoz kuchyně podle vlastního webu „8.00 – 21.00 przerwy: 10.00 – 10.30,
    19.00 – 19.30"; natatry.pl uvádí přestávku 10–11.
