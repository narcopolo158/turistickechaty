  checked: '2026-08-09'

# ── Provoz ────────────────────────────────────────────────────────────────
sezona: celoročně
otviraciDoba: kuchyně 8.00–21.00 s přestávkami 10.00–10.30 a 19.00–19.30
overeniProvoz:
  source: >-
    Vlastní web (čteno 9. 8. 2026): „schronisko jest czynne przez cały rok";
    shodně ústředí PTTK.
    „OTEVŘENO ≠ DOSTUPNÉ" JE TU DOLOŽENÉ TVRDĚJI NEŽ JINDE, a to hned dvakrát.
    Za prvé sem nevede silnice: vlastní web to označuje za jedinečnost —
    chata je „jedynym w polskich Tatrach, do którego nie można dojechać
    samochodem". Za druhé je celý Tatrzański park narodowy režimový:
    nocování mimo schroniska je zakázané („Noclegi poza schroniskami w TPN są
    nadal zakazane", najednejlinie.pl, s pokutami 50 až 500 zł), od dubna do
    30. listopadu platí zákaz pobytu v parku od soumraku do svítání a vstup
    je zpoplatněn (tpn.gov.pl: normální 11 zł, zlevněné 5,50 zł). Kdo sem
    dojde pozdě a nemá rezervaci, nemá zákonnou možnost zůstat.
    Rezervace se podle vlastního webu otevírají po sezónách; „Na sezon letni
    warto rezerwować miejsca ze sporym wyprzedzeniem."
  verified: false
  checked: '2026-08-09'

