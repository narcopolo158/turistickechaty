interniPoznamky: >-
  Povýšeno z data/kandidati/krusne-hory/komari-vizka.yaml rešerší
  (10. 8. 2026). Klíč zařazení: obsluhovaný objekt s restaurací
  a noclehem na hřebenové trase, katalogový objekt HUT-0113 (jistota B),
  cíl lanovky — role na trase nesporná. První profil Krušných hor.

