# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1857
    udalost: >-
      Majitel zdejšího panství Clary-Aldringen nechal na místě staré
      hornické zvonice postavit zděnou budovu s patnáctimetrovou
      vyhlídkovou věží — dnešní Komáří vížku.
    zdroj: >-
      Kudy z nudy (čteno 10. 8. 2026) — „postavena majitelem zdejšího
      panství Clary Aldringenem roku 1857"; výška věže 15 m dle
      Rozhlednovým rájem.
  - rok: 1952
    udalost: >-
      Z Bohosudova (Krupky) sem byla zprovozněna visutá lanová dráha —
      dnes druhá nejstarší provozovaná v Česku a s 2 348 m nejdelší
      sedačková lanovka bez mezistanice v republice; jízda trvá
      15,5 minuty.
    zdroj: >-
      Kudy z nudy, stránka lanové dráhy (čteno 10. 8. 2026) —
      „zprovozněna v roce 1952", „druhá nejstarší provozovaná visutá
      lanová dráha v Česku", délka 2 348 m, „nejdelší sedačková lanovka
      bez mezistanice v České republice", doba jízdy 15,5 min.

zajimavosti:
  - text: >-
      Od poloviny 16. století stála na vrcholu dřevěná věž se zvonem,
      který cínovým havířům pod horou ohlašoval začátek a konec směny —
      jméno Komáří vížka nese dnešní budova po ní.
    kategorie: stari
    zdroj: Kudy z nudy (čteno 10. 8. 2026)
  - text: >-
      Rozhled odsud chválil už cestovní průvodce z roku 1890 — vlastní
      web cituje, že „patří nejen k nejkrásnějším v Krušných horách,
      ale může se směle tvrdit, že i k nejkrásnějším v celé Evropě".
      Věž sama je dnes nepřístupná (vyhlídková okna byla při
      modernizaci zaslepena), výhled ale poskytuje sám hřeben.
    kategorie: jine
    zdroj: >-
      vlastní web komarivizka.eu (citace průvodce 1890); nepřístupnost
      věže a zaslepená okna Rozhlednovým rájem, terénní výhled tamtéž
      (čteno 10. 8. 2026)

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Zděná budova s věží z roku 1857 na hraně krušnohorského hřebene nad
  Krupkou — horský hotel s restaurací, sedmi pokoji a výhledem, který
  chválily průvodce už v devatenáctém století. Z Bohosudova sem od roku
  1952 šplhá nejdelší sedačková lanovka bez mezistanice v Česku.
text:
  - >-
    Komáří vížka stojí na místě, kde od poloviny šestnáctého století
    zvonila dřevěná věž havířům z cínových dolů pod horou začátek
    a konec směny. Dnešní zděnou budovu s patnáctimetrovou věží nechal
    roku 1857 postavit majitel panství Clary-Aldringen — a jméno staré
    zvonice jí zůstalo.
  - >-
    Nahoru se dá vyjet i bez vlastních nohou: lanovka z Bohosudova jede
    od roku 1952, měří 2 348 metrů a je nejdelší sedačkovou lanovkou
    bez mezistanice v republice; jízda trvá zhruba čtvrt hodiny. Kdo
    přijde po hřebeni, má to z Krupky po značce prudším kopcem.
  - >-
    Hotel nabízí sedm pokojů s vlastní koupelnou pro nejvýš devatenáct
    hostů a restauraci s českou kuchyní — pověst tu mají domácí
    knedlíky a moučníky. Věž sama je nepřístupná, vyhlídková okna byla
    při modernizaci zaslepena; o výhled ale návštěvník nepřijde, hřeben
    ho nabízí sám od sebe, od Českého středohoří po Lužické hory.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu hotelu, z Kudy
    z nudy a z externího katalogu; polohu nese OpenStreetMap. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
