# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Berggasthof s penzionem na vrcholu Hirtsteinu (890 m) u Satzungu —
  horská restaurace hned vedle čedičového vějíře, jedné z nejstarších
  chráněných geologických památek Krušných hor, a malý vlek pod
  svahem.
text:
  - >-
    Hirtstein je kopec, na který se jezdí kvůli kameni: starý lom tu
    odkryl čedičové sloupy rozevřené do tvaru vějíře, které chránili
    už lidé na konci devatenáctého století. Bauda na vrcholu k té
    podívané přidává horskou restauraci a penzion — a v zimě malý
    vlek, takže Satzung žije i lyžařsky.
  - >-
    Provozní detaily drží vlastní web, který se nám při rešerši
    nenačetl: doložený je telefon, e-mail a otvírací rytmus z mapových
    dat (přes týden od půl dvanácté do devíti, jeden zavírací den).
    Kapacita penzionu číslem doložená není — před cestou zavolat.
  - >-
    Údaje na téhle stránce pocházejí z regionálních webů Krušnohoří;
    polohu a kontakty nese OpenStreetMap. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
