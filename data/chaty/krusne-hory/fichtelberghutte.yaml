zajimavosti:
  - text: >-
      Dům stojí u sjezdovek pár set metrů pod vrcholem Fichtelbergu
      — na kopci, kde jezdí nejstarší visutá lanovka Německa (od
      roku 1924) a kde vrcholový Fichtelberghaus drží štít nejvyšší
      hory Saska. Fichtelberghütte je jeho menší soused: hotel
      s restaurací Ski přímo v lyžařském areálu.
    kategorie: jine
    zdroj: >-
      poloha ~350 m od horní stanice lanovky: rezervační prezentace
      (čteno 10. 8. 2026); nejstarší visutá lanovka Německa od 1924
      a Fichtelberg jako nejvyšší hora Saska: tourmedia-service.de
      (rešerše Hotelu Fichtelberghaus, 10. 8. 2026)

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hotel s restaurací Ski u sjezdovek pod vrcholem
  Fichtelbergu — jedenáct pokojů s výhledem na hřeben, snídaňový
  bufet a horní stanice nejstarší německé visuté lanovky pár set
  metrů od dveří.
text:
  - >-
    Fichtelberg je lyžařské srdce saského Krušnohoří a
    Fichtelberghütte v něm bydlí přímo u sjezdovek: k horní stanici
    visuté lanovky z Oberwiesenthalu je to zhruba 350 metrů, na
    vrchol s Fichtelberghausem kousek pěšky. Jedenáct pokojů má
    výhled na hory, dole se vaří v restauraci Ski.
  - >-
    Provozně jde o hotel — check-in odpoledne, snídaňový bufet —
    a v zimě je to ubytování s lyžemi za dveřmi, v létě základna
    pro hřebenové výlety ke Klínovci a na českou stranu. Režim
    restaurace pro neubytované doložený není; před cestou ověřit.
  - >-
    Údaje na téhle stránce pocházejí z rezervační prezentace domu;
    polohu a kontakty nese OpenStreetMap. Vlastní web se při rešerši
    nenačetl — chyba certifikátu. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
