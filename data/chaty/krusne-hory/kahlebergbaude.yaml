# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Občerstvovací bauda na Kahlebergu (905 m) nad Altenbergem — od
  soboty do středy tu mezi desátou a pátou dostane kolemjdoucí jídlo
  a pití, nocleh tu nehledejte. Zastávka na hřebenových trasách
  východního Krušnohoří.
text:
  - >-
    Kahlebergbaude je provoz toho nejjednoduššího horského střihu:
    bufet na vrcholu, otevřený od soboty do středy mezi desátou
    a pátou — čtvrtky a pátky má zavírací den. Kdo plánuje hřebenovku
    přes Kahleberg, ať s tím počítá; katalogy vedou provoz jako
    sezónní.
  - >-
    Kahleberg je domácí hora Altenbergu — na 905 metrů sem vedou
    značené cesty i zimní stopy z města a bauda je občerstvení přímo
    na kopci. Přespat se dá dole ve městě.
  - >-
    Údaje na téhle stránce pocházejí z katalogu otvíracích dob
    a z externího katalogu; polohu a kontakty nese OpenStreetMap.
    Vlastní stránky baudy se při rešerši nenačetly. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
