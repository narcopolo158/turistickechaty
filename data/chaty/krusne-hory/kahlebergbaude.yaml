interniPoznamky: >-
  Povýšeno z data/kandidati/krusne-hory/kahlebergbaude.yaml rešerší
  (10. 8. 2026). Klíč zařazení: veřejné občerstvení na vrcholu
  s hřebenovou rolí, katalogový objekt HUT-0295 (jistota B). Osmý
  profil Krušných hor — katalog oblasti má teď profily 8/10.

  POZOR NA VÝŠKU: 905 m je jen katalogová hodnota (DATA-39 varuje, že
  katalog občas vede výšku VRCHOLU) — tady vrchol i bauda splývají,
  ale nezávislý pramen chybí; kdyby DATA-39 audit výšku shodil,
  přepsat i větu s číslem v próze. Původní formulace „jediné
  občerstvení na kopci" z prózy vypuštěna — jiný provoz na vrcholu
  sice žádný načtený pramen nevede, ale to je výrok o rešerši, ne
  o terénu.

  K OVĚŘENÍ (DATA-04): vlastní web (vadný certifikát); sezónní
  odstávky; rok vzniku baudy (jméno zní historicky — „mining lodge"
  v překladu altenberského webu naznačuje hornickou minulost,
  NEDOLOŽENO, stránka se nenačetla). Fotku dodá příští běh DATA-02.
