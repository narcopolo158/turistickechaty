# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 2011
    udalost: >-
      Dům — podle vlastního webu přes 400 let starý — sloužil jako
      Jugendherberge Zinnwald „Klügelhütte", nejvýše položená
      mládežnická ubytovna Saska; dnes ho Ralf Heuer vede jako
      soukromou ski- a wanderherbergu.
    zdroj: >-
      stáří „über 400 Jahre alt": vlastní web, stránka herberge;
      Jugendherberge Zinnwald „Klügelhütte" a titul nejvýše položené:
      jugendherberge.de (ceník 2011, PDF v indexu vyhledávače);
      současný provozovatel: impressum vlastního webu (vše čteno
      10. 8. 2026). Rok stavby ani rok konce DJH prameny nevedou —
      nedomýšlí se.

zajimavosti:
  - text: >-
      Klügelhütte stojí v domě, kterému vlastní web přisuzuje přes
      čtyři sta let — v Zinnwald-Georgenfeldu, nejvýše položené
      osadě východního Krušnohoří, pár kroků od biatlonové arény.
      Z mládežnické ubytovny se stala herberge pro skupiny pěších,
      cyklistů a běžkařů; večer se sedí v selské Bauernstube nebo
      u ohniště.
    kategorie: stari
    zdroj: >-
      vlastní web kluegelhuette.de (čteno 10. 8. 2026) — „über 400
      Jahre alt", Bauernstube, ohniště, poloha u Biathlonareny

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Herberge pro pěší, cyklisty a běžkaře v přes čtyři sta let starém
  domě v Zinnwald-Georgenfeldu (860 m) — dvacet lůžek ve dvoulůžkových
  pokojích, Bauernstube a ohniště u hraničního hřebene. Sama se vede
  jako nejvýše položená ski- a wanderherberge východního Krušnohoří.
text:
  - >-
    Zinnwald-Georgenfeld je hraniční osada nad Cínovcem a Klügelhütte
    v ní drží tradici skupinového noclehu: bývalá saská mládežnická
    ubytovna — podle vlastního webu nejvýše položená v zemi — dnes
    slouží jako soukromá herberge pro turistické party, cyklisty
    a běžkaře. Dům sám má mít přes čtyři sta let.
  - >-
    Spí se v cirka dvaceti lůžkách po dvou, jí se ve společné
    jídelně pro třicet lidí a večer patří selské Bauernstube nebo
    ohništi na terase. Biatlonová aréna je za rohem, běžecké stopy
    hřebene začínají u domu; režim stravování web neuvádí — před
    rezervací se domluvit.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu herberge;
    polohu nese OpenStreetMap. Občerstvení pro kolemjdoucí doloženo
    není. Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Vlastní web herberge — 860 m, ~20 lůžek, jídelna ~30, dům přes
      400 let, kontakty a provozovatel (impressum), poloha (načteno
      10. 8. 2026)
    url: https://www.kluegelhuette.de/
  - popis: >-
      jugendherberge.de — historické jméno Jugendherberge Zinnwald
      „Klügelhütte" (ceník 2011, PDF)
    url: https://www.jugendherberge.de/upload/hvz/97/156/zinnwald_kh_2011.pdf
  - popis: OpenStreetMap (GPS, kontakty, tag hostel; ODbL)
    url: https://www.openstreetmap.org/way/178850332
