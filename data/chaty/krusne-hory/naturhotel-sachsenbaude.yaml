# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Wellness hotel v tiché samotě na úpatí Fichtelbergu — třicet
  pokojů a suit, restaurace FOREST se sezónní kuchyní, bazén
  a venkovní vířivka. Po dobu rekonstrukce vrcholového
  Fichtelberghausu slouží jako jeho partnerská základna.
text:
  - >-
    Sachsenbaude stojí stranou ruchu Oberwiesenthalu, na příjezdu
    k Fichtelbergu — hotel v samotě, kde se horská poloha potkává
    s wellness výbavou: bazén, sauna a venkovní vířivka s výhledem
    do lesů. Spí se ve třiceti pokojích a suitách.
  - >-
    Restaurace FOREST vaří moderní sezónní kuchyni z regionálních
    surovin, od středy do neděle; o víkendu už od poledne. A že jde
    o dům s horskou rolí, potvrdil rok 2026: po dobu rekonstrukce
    vrcholového Fichtelberghausu přebírá jeho hosty právě
    Sachsenbaude.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu hotelu;
    polohu nese OpenStreetMap. Historii domu web nevede. Redakce
    nic neověřila vlastním dotazem ani návštěvou.
