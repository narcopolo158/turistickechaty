# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dvojice rodinných baud na krušnohorském hřebeni u hračkářského
  Seiffenu — 61 lůžek, pět lokálů s regionální kuchyní a Kammweg
  s trasou E3 přímo přede dveřmi, v 761 metrech nad osadou
  Heidelbach.
text:
  - >-
    Dachsbaude a Kammbaude stojí přes cestu v hřebenové osadě
    Heidelbach — kilometr od Seiffenu, vesnice dřevěných hraček,
    a tři od Neuhausenu. Rodinný podnik z nich složil jeden hotel:
    třicet pokojů s jednašedesáti lůžky a poctivý Landgasthof, kde
    se vaří regionálně a sezónně a čepují saská piva.
  - >-
    Poloha je hřebenová doslova: kolem domů vede Kammweg i evropská
    dálková trasa E3, v zimě se od prahu rozbíhá čtyřicet kilometrů
    upravovaných stop. Kuchyně jede denně od půl dvanácté, o pátcích
    a sobotách až do deseti; k tomu tematické večery od Hutzenabendu
    po Feuerzangenbowle.
  - >-
    Údaje na téhle stránce pocházejí z webů obcí Seiffen
    a Neuhausen; polohu nese OpenStreetMap. Vlastní web hotelu se
    při rešerši nenačetl. Redakce nic neověřila vlastním dotazem
    ani návštěvou.
