# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Celoroční horský hotel na Lesenské pláni v 911 metrech, uprostřed
  areálu s Krušnohorským muzeem, arboretem a geologickým parkem —
  čtyřicet lůžek, restaurace se zvěřinovými specialitami a zázemí,
  jaké na hřebeni východního Krušnohoří jinde nenajdete pohromadě.
text:
  - >-
    Lesná není klasická osamělá bouda, ale středisko: kolem hotelu
    vyrostl celý naučný areál s muzeem krušnohorského života,
    infocentrem, kapličkou, arboretem a geologickým parkem s modelem
    rašeliniště. Kdo sem dorazí po hřebeni, může tu strávit klidně
    půl dne, aniž si sedne k pivu.
  - >-
    K pivu si ale sednout může: bar s restaurací v přízemí jede po
    celý týden, kuchyně staví na hotových jídlech, minutkách
    a zvěřině a sálů je tu dohromady pro víc než sto hostů. Spí se
    ve dvou- až čtyřlůžkových pokojích — prameny se neshodnou, jestli
    je lůžek čtyřicet, nebo devětačtyřicet, takže s větší skupinou
    je lepší kapacitu domluvit předem.
  - >-
    Poloha na pláni mezi Malým Hájem a Novou Vsí v Horách z hotelu
    dělá přirozenou základnu pro východní Krušnohoří — v zimě pro
    běžkaře, v létě pro cyklisty i pěší.
  - >-
    Údaje na téhle stránce pocházejí z regionálních turistických
    webů, z profilu regionální značky a z externího katalogu; polohu
    nese OpenStreetMap. Vlastní stránky hotelu se při rešerši
    nenačetly. Redakce nic neověřila vlastním dotazem ani návštěvou.
