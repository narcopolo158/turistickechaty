# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1839
    udalost: >-
      V Oswaldtalu u Waschleithe začala fungovat zájezdní hospoda —
      katalogy dům vedou jako „familiengeführte geschichtsträchtige
      Einkehrstätte seit 1839".
    zdroj: >-
      erzgebirge.de (čteno 10. 8. 2026) — „seit 1839". Původ jmen
      Köhlerhütte (uhlířská bouda) a Fürstenbrunn (knížecí pramen)
      načtené prameny nevysvětlují — legenda se nedomýšlí; německá
      Wikipedie má článek Köhlerhütte Fürstenbrunn, ze sandboxu
      cache-only.
  - rok: 1994
    udalost: >-
      K historickému hostinci přibyla hotelová část s dvaceti pokoji.
    zdroj: >-
      erzgebirge.de (čteno 10. 8. 2026) — hotel od 1994, 20 pokojů.

zajimavosti:
  - text: >-
      Köhlerhütte stojí sto metrů od nejstarší saské ukázkové štoly
      — a jméno nese po uhlířích, kteří v okolních lesích pálili
      dřevěné uhlí pro hutě. Jí se v historické Köhlerstube nebo
      v Prinzensaalu, sále až pro sto lidí, jehož jméno odkazuje ke
      knížecímu prameni Fürstenbrunn hned u domu.
    kategorie: jine
    zdroj: >-
      100 m od nejstarší saské zpřístupněné štoly, Köhlerstube,
      Prinzensaal pro 100 lidí: erzgebirge.de (čteno 10. 8. 2026);
      jména místností: tamtéž + vlastní web. Samotná pověst
      o prameni v načtených pramenech chybí — neuvádí se.

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Zájezdní hostinec v Oswaldtalu u Waschleithe krmí pocestné od roku
  1839 — dnes rodinný hotel s dvaceti pokoji, historickou
  Köhlerstube a kuchyní bez zavíracího dne, sto metrů od nejstarší
  saské ukázkové štoly.
text:
  - >-
    Köhlerhütte-Fürstenbrunn je klasika západního Krušnohoří:
    zájezdní hospoda v zeleném údolí, kde se zastavovalo cestou mezi
    Grünhainem a Schwarzenbergem už za časů uhlířů. Jako
    „Einkehrstätte" slouží od roku 1839; hotelových dvacet pokojů
    — včetně suity s nebesy — přibylo v roce 1994.
  - >-
    Kuchyně vaří regionální speciality denně od jedenácti do večera
    a zavírací den dům nezná; sedí se v historické Köhlerstube,
    Jagdstube, na pivní zahradě, a na oslavy je Prinzensaal až pro
    sto lidí. Na dosah je ukázková štola ve Waschleithe i vyhlídky
    Fürstenbergu.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu hotelu
    a z portálu erzgebirge.de; polohu nese OpenStreetMap. Pověst
    o knížecím prameni načtené prameny nevedou — neuvádíme ji.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
