milniky:
  - rok: 1897
    udalost: >-
      Dne 12. července byla na vrcholu Pöhlbergu otevřena výletní
      restaurace s hotelem a pětatřicetimetrovou rozhlednou.
    zdroj: >-
      erlebnisland-erzgebirge.de (čteno 10. 8. 2026) — „Die auf dem
      Gipfel befindliche Ausflugsgaststätte mit Hotel und 35 m hohen
