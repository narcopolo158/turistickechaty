zajimavosti:
  - text: >-
      Na západním a severním svahu Pöhlbergu tvoří čedič mohutné
      sloupy, kterým se v místním nářečí říká „Butterfässer" —
      máslenky; dobře viditelné je odkryl bývalý kamenolom. Hora nad
      hornickým Annabergem nese stopy dolování cínu, stříbra a mědi
      od roku 1400.
    kategorie: jine
    zdroj: >-
      erlebnisland-erzgebirge.de (čteno 10. 8. 2026) — čedičové
      sloupy „welcher am westlichen und nördlichen Berghang imposante
      Säulen bildet", nářeční jméno Butterfässer, těžba od 1400

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Výletní hotel na vrcholu Pöhlbergu (832 m) nad hornickým
  Annabergem — restaurace s panoramatem otevřená denně od půl
  dvanácté, pokoje pro rodiny i svatebčany a hned vedle rozhledna;
  všechno v tradici výletního domu otevřeného tu 12. července 1897.
text:
  - >-
    Pöhlberg patří k trojici stolových čedičových hor nad Annabergem
    a výletní dům s rozhlednou tu stojí od 12. července 1897. Dnešní
    Berghotel vede rodinná firma: panoramatická restaurace vaří
    krušnohorskou i mezinárodní kuchyni se zvěřinovými specialitami
    a otvírá denně od půl dvanácté, spí se v pokojích od
    jednolůžkových po rodinné.
  - >-
    Kolem hotelu je toho na půldenní výlet dost: pětatřicetimetrová
    rozhledna, čedičové sloupy zvané Butterfässer na svazích
    a dole město s hornickou historií sahající k roku 1400. Hotel
    nabízí i stání pro obytné vozy — na saské poměry typická
    kombinace výletního cíle a základny.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu hotelu,
    z regionálního průvodce a z externího katalogu; polohu nese
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
