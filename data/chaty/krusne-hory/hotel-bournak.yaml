# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1930
    udalost: >-
      Klub československých turistů otevřel 8. června na vrcholu
      Stürmer (Bouřňák) první českou turistickou chatu v Krušných
      horách — slavnosti se účastnilo 1500 hostů. Projekt architekta
      Josefa Honicha, stavba za zhruba milion korun začala koncem
      dvacátých let; nocleh stál členy KČST 5,50 Kč. Chata nesla
      jméno předsedy klubu Emanuela Hrubého. O stavbu se zasadil
      učitel Karel Lím, průkopník českého lyžování v Krušných horách.
    zdroj: >-
      poznejdomy.cz (čteno 10. 8. 2026) — stavba 1928–1930, Honich,
      otevření 8. 6. 1930 s 1500 hosty, ceny, jméno Hrubého, „první
      českou turistickou chatou v Krušných horách"; Kudy z nudy —
      začátek stavby červen 1927, cena „asi 1 milion korun",
      otevření 8. června 1930, role Karla Líma (1875–1958). Začátek
      stavby se v pramenech liší (1927 × 1928) — nerozhodujeme.
  - rok: 1948
    udalost: >-
      KČST byl zrušen, objekty vyvlastněny a chata přejmenována na
      Chatu na Bouřňáku.
    zdroj: poznejdomy.cz (čteno 10. 8. 2026)
  - rok: 1975
    udalost: >-
      Na chatě byla odhalena pamětní deska Karla Líma; při
      rekonstrukci v 70. letech dostala místo ploché střechy sedlovou
      a Límovo jméno.
    zdroj: >-
      deska od 1975: krusnehory.cz (čteno 10. 8. 2026); přestavba
      střechy a přejmenování v 70. letech: poznejdomy.cz.

