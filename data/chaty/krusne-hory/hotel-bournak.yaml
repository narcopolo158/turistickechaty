# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  První česká turistická chata Krušných hor stojí na vrcholu Bouřňáku
  (869 m) od roku 1930 — a právě teď je zavřená: dům, který KČST
  otevřel za účasti patnácti set hostí, léta chátral a čeká na
  přestavbu, jež má vrátit prvorepublikovou tvář a přidat restauraci
  i pro kolemjdoucí.
text:
  - >-
    O chatu na Stürmeru, česky Bouřňáku, se zasadil učitel Karel Lím,
    průkopník českého lyžování v Krušných horách — v kraji, kde do té
    doby stavěly turistické domy jen německé spolky. Klub
    československých turistů ji podle projektu Josefa Honicha
    postavil za zhruba milion korun a 8. června 1930 slavnostně
    otevřel; přišlo patnáct set lidí a nocleh stál člena klubu pět
    korun padesát.
  - >-
    Jméno chata měnila s dějinami: nejdřív nesla jméno předsedy KČST
    Emanuela Hrubého, po zrušení klubu v roce 1948 se říkalo prostě
    Chata na Bouřňáku a od přestavby v sedmdesátých letech — kdy
    plochou střechu nahradila sedlová — nese jméno Karla Líma, jehož
    pamětní deska tu visí od roku 1975.
  - >-
    Dnes je dům zavřený a prázdný. Vlastník plánuje rozsáhlou
    přestavbu na apartmánový hotel s návratem původního vzhledu;
    počítá se s dvaačtyřiceti apartmány, saunou a restaurací
    otevřenou i příchozím výletníkům. Dokud se tak nestane, najde
    turista občerstvení pod vrcholem — a na Bouřňák se chodí hlavně
    za výhledem a v zimě za šesti sjezdovkami areálu, na který
    navazuje krušnohorská běžecká síť.
  - >-
    Údaje na téhle stránce pocházejí z databáze domů s příběhem,
    z Kudy z nudy a z regionálních webů; katalogový údaj o aktivním
    provozu prameny nepotvrzují. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
