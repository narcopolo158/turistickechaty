interniPoznamky: >-
  Založeno BEZ OSM kandidáta (10. 8. 2026, šestý takový profil
  korpusu) — objekt v exportech DATA-01 pro Krušné hory vůbec není,
  nejspíš proto, že OSM zavřený dům nevede jako turistické ubytování.
  GPS z poznejdomy.cz. Katalogová mezera HUT-0112 tím zavřena —
  a katalogový stav „aktivní" KORIGOVÁN (poznejdomy k 2023: prázdný,
  chátrající; Kudy z nudy: v rekonstrukci). Stav mimo-provoz, vzor
  Trangoška: nic se nedomýšlí, kontakty se nezapisují.

  KLÍČ ZAŘAZENÍ: turistická minulost nesporná (první česká chata
  Krušných hor, KČST 1930) — přesně případ, pro který Michal 4. 8.
  klíč rozšířil (DATA-25). Až přestavba skončí, profil se překlopí
  na v-provozu; plán restaurace „i pro příchozí" je v pramenech.

  ROZPORY: začátek stavby 1927 (Kudy z nudy) × 1928 (poznejdomy);
  obec Moldava (adresa) × Mikulov (katalog). K OVĚŘENÍ (DATA-04):
  aktuální stav přestavby a termín otevření; zda J&T Real Estate CZ
  je stále vlastník. Fotku dodá příští běh DATA-02 (historické snímky
  možná FOTO-01). Do OSM objekt zapsat nemůžeme my — až tam přibude,
  přepnout GPS na OSM.
