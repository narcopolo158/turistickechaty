# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Výletní bauda spolku Erzgebirgsverein z let 1926–27 na vrcholu
  Schwartenbergu (789 m) mezi Neuhausenem a hračkářským Seiffenem —
  restaurace s výhledem otevřená denně, nocleh tu ale nehledejte.
text:
  - >-
    Schwartenbergbaude patří ke klasické generaci spolkových baud:
    postavil ji v letech 1926 až 1927 Erzgebirgsverein, krušnohorský
    turistický spolek, a výletním domem na vrcholu zůstala dodnes.
    Kopec nad Seiffenem nabízí kruhový rozhled na hřeben na jihu
    i do saského podhůří.
  - >-
    Dnešní podoba služby je jednoduchá: restaurace otevřená přes týden
    od jedenácti do pěti a o víkendech a svátcích až do osmi večer.
    Nocleh bauda nenabízí — kdo chce zůstat, tomu vlastní web
    doporučuje partnerský hotel v okolí. Pro pěší je to zastávka na
    hřebenové cestě mezi Saydou a Olbernhau, pro motoristy krátká
    odbočka ze silnice.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu baudy
    a z externího katalogu; polohu nese OpenStreetMap. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Vlastní web baudy — výška 789 m, poloha, stavba 1926/27
      spolkem Erzgebirgsverein, otvírací doba, kontakty, provozovatel
      (načteno 10. 8. 2026)
    url: https://www.schwartenbergbaude.de/
  - popis: >-
      Externí katalog turistických chat ČR/SK 2026 — řádek HUT-0294
      (789 m, Neuhausen, celoročně, bez ubytování, jistota A)
