  - popis: OpenStreetMap (GPS, telefon, otvírací doba v tagu; ODbL)
    url: https://www.openstreetmap.org/way/133632631
interniPoznamky: >-
  Povýšeno z data/kandidati/krusne-hory/schwartenbergbaude.yaml rešerší
  (10. 8. 2026). Klíč zařazení: veřejná restaurace na vrcholu
  s hřebenovou rolí + stavba turistickým spolkem 1926/27 = turistická
  minulost doložená vlastním webem; katalogový objekt HUT-0294
  s jistotou A. Typ obsluhovana i bez noclehu — vzor krkonošských bud
  bez ubytování.

  K OVĚŘENÍ (DATA-04): sezónní odstávky (katalog říká celoročně, web
