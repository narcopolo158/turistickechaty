# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1884
    udalost: >-
      Krušnohorský spolek z Jáchymova (založen v květnu 1880) otevřel
      3. srpna na vrcholu sedmnáctimetrovou kamennou rozhlednu podle
      projektu stavitele Josefa Petera.
    zdroj: >-
      Kudy z nudy (čteno 10. 8. 2026) — spolek 1880, výška věže 17 m,
      otevření 3. 8. 1884; projektant Josef Peter poznejdomy.cz.
  - rok: 1893
    udalost: >-
      Na popud starosty spolku doktora Langhanse postavil stavitel
      Karl Schöter u rozhledny malé pohostinství; roku 1900 vyrostl
      vedle hotel a 1908 výstavní hala, jejíž expozici zahájil osobně
      císař František Josef I.
    zdroj: >-
      poznejdomy.cz (čteno 10. 8. 2026) — pohostinství 1893, hotel
      1900, hala 1908, „Výstavu zahájil osobně císař František
      Josef I."
  - rok: 1929
    udalost: >-
      V hotelu vypukl rozsáhlý požár; přestavbu vedl stavitel Rehne.
      Sál dostal kazetový strop se znaky obcí a měst pod Klínovcem.
    zdroj: >-
      poznejdomy.cz (čteno 10. 8. 2026) — požár 1929 a přestavba;
      kazetový strop se znaky Kudy z nudy.
  - rok: 2013
    udalost: >-
      Po letech chátrání celého komplexu byla rozhledna v letech
      2012–13 zrekonstruována a znovu zpřístupněna; hotel zůstal
      zavřený.
    zdroj: >-
      poznejdomy.cz — rekonstrukce rozhledny 2012–2013, otevřeno
      9–17; Kudy z nudy — „od roku 2013 je znovu nádherná kamenná
      stavba přístupná" (obojí čteno 10. 8. 2026).
  - rok: 2023
    udalost: >-
      Město Boží Dar pronajalo objekt Sokolovské uhelné na 25 let;
      oprava za odhadovaných 420 milionů má hotel do roku 2028 vrátit
      veřejnosti.
    zdroj: poznejdomy.cz (čteno 10. 8. 2026)

