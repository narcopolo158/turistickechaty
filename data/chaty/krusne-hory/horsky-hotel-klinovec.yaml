interniPoznamky: >-
  Založeno BEZ OSM kandidáta (10. 8. 2026, sedmý takový profil
  korpusu) — GPS z poznejdomy.cz. Katalogová položka HUT-0114 „Chata
  na Klínovci" (jistota C, „ověřit") PŘIŘAZENA tomuto komplexu:
  žádný jiný objekt toho jména na vrcholu rešerše nenašla a katalogový
  popis (bez ubytování, stravování „ano" s nejistým provozem) odpovídá
  vrcholu s otevřenou rozhlednou a zavřeným hotelem. Kdyby Michal
  našel doklad, že položka míří na jiný objekt (např. provoz
  lyžařského areálu), přiřazení se přepíše — vzor HUT-0158.

  Stav mimo-provoz drží HOTEL (rozhledna je otevřená — do FAQ oblasti;
  vzor Žalý ale tady neplatí, rozhledna nemá vlastní kandidáta).
  Registr jmenovců: jádro „milesovka" vede chatu i rozhlednu na
  Milešovce; „klinovec" zatím kolizi nemá (chata-barborka-klinovec je
  katalogové jméno, ne náš objekt).

  K OVĚŘENÍ (DATA-04): stav přestavby a termín; občerstvení
  lyžařského areálu na vrcholu (samostatný objekt? kandidát?); zda
  rozhledna drží 9–17 celoročně. Fotku dodá příští běh DATA-02,
  historické snímky FOTO-01.
