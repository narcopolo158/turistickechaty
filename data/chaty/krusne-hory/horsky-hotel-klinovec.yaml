# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Vrcholový komplex nejvyšší hory Krušných hor: kamenná rozhledna
  z roku 1884, hostinec z 1893 a hotel z 1900, kde výstavu zahajoval
  císař. Rozhledna je po rekonstrukci zase přístupná, hotel zůstává
  zavřený — otevřít by se mohl po velké opravě kolem roku 2028.
text:
  - >-
    Klínovecký komplex psal dějiny krušnohorské turistiky: rozhlednu
    otevřel jáchymovský Krušnohorský spolek už v roce 1884, o devět
    let později k ní přibylo pohostinství, v roce 1900 hotel a roku
    1908 výstavní hala, jejíž expozici zahájil osobně František
    Josef I. Po požáru v roce 1929 dostal hotel dnešní podobu — včetně
    sálu s kazetovým stropem, na němž jsou znaky obcí a měst pod
    horou.
  - >-
    Druhá půlka dvacátého století a divoká privatizace komplexu
    nesvědčily; město Boží Dar ho převzalo v roce 2003 a nejdřív
    zachránilo rozhlednu, která je od roku 2013 znovu přístupná,
    denně od devíti do pěti. Hotel sám je pořád zavřený — od roku
    2023 ho má na pětadvacet let pronajatý průmyslový nájemce
    a oprava odhadovaná na stovky milionů by ho mohla kolem roku 2028
    vrátit veřejnosti.
  - >-
    Na vrchol dnes vede lanovka i silnice a funguje tu velký lyžařský
    areál; občerstvení v samotném hotelu ale nečekejte — dokud
    přestavba neskončí, je vrcholová budova jen kulisou výhledu
    z ochozu rozhledny na vrcholu v 1244 metrech.
  - >-
    Údaje na téhle stránce pocházejí z databáze domů s příběhem
    a z Kudy z nudy; katalogovou položku s nejistým provozem
    přiřazujeme tomuto komplexu. Redakce nic neověřila vlastním
    dotazem ani návštěvou.
