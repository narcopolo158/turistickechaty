# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1891
    udalost: >-
      Na vrcholu Geisingbergu se 27. září 1891 otevřel osmnáctimetrový
      Louisenturm — na vyhlídkovou plošinu vede 88 schodů.
    zdroj: >-
      erz.krusnohorci.cz (čteno 10. 8. 2026) — „am 27. September 1891
      der 18 Meter hohe Louisenturm eröffnet", 88 schodů. Kdo věž
      postavil (spolek?), načtený pramen nevede — nedomýšlí se.
  - rok: 1898
    udalost: >-
      Vedle věže vyrostla ubytovna (Unterkunftshaus).
    zdroj: >-
      erz.krusnohorci.cz (čteno 10. 8. 2026) — „1898 errichtete man
      daneben ein Unterkunftshaus".
  - rok: 1906
    udalost: >-
      Ubytovna byla stržena a nahradila ji zděná Bergbaude na
      masivních základech — dnešní bauda; původně šlo o sezónní
      provoz.
    zdroj: >-
      erz.krusnohorci.cz (čteno 10. 8. 2026) — „1906 bereits wieder
      abgerissen und durch eine auf massiven Grund errichtete
      Bergbaude ersetzt"; sezónní začátky tamtéž.

zajimavosti:
  - text: >-
      Geisingberg je kopec sevřený železnicí: po severním a západním
      úbočí se vine Müglitztalbahn z údolí do Altenbergu, takže na
      baudu s Louisenturmem se dá vyrazit vlakem z obou horních
      měst — z Geisingu i z Altenbergu.
    kategorie: jine
    zdroj: >-
      erz.krusnohorci.cz (čteno 10. 8. 2026) — poloha mezi Altenbergem
      a Geisingem, Müglitztalbahn po severním a západním úbočí

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Zděná bauda z roku 1906 na Geisingbergu (824 m) u osmnáctimetrového
  Louisenturmu z roku 1891 — domácí kuchyně a sluneční terasa nad
  horními městy Altenberg a Geising. Otevřeno celoročně kromě středy
  a čtvrtka; nocleh dnes doložený není.
text:
  - >-
    Na Geisingbergu se turistická historie vrství jak schody
    Louisenturmu: rozhledna se otevřela v září 1891, o sedm let
    později k ní přibyla ubytovna a roku 1906 ji nahradila zděná
    Bergbaude, která na vrcholu hospodaří dodnes. Z plošiny věže
    je po 88 schodech výhled přes hřeben východního Krušnohoří.
  - >-
    Bauda vaří levnou domácí kuchyni a v létě k ní patří sluneční
    terasa s osmatřiceti místy; otevřeno je od deseti, v zimě do
    čtyř, v létě do šesti, zavírací dny jsou středa a čtvrtek.
    Nahoru se chodí pěšky z Altenbergu i Geisingu — a k úpatí to
    jde i vlakem po Müglitztalbahn.
  - >-
    Údaje na téhle stránce pocházejí z turistického webu Altenbergu
    a z krušnohorského portálu; polohu a kontakty nese OpenStreetMap.
    Vlastní web baudy se při rešerši nenačetl — neschválené načtení.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
