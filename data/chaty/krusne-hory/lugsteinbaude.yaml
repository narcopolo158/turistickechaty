# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Gasthaus s apartmány u Georgenfeldského rašeliniště pod Lugsteinem
  — poslední stavení Zinnwaldu před hraničním hřebenem. Kuchyně jede
  přes oběd šest dní v týdnu, v zimě vede běžkařská stopa přímo
  přede dveřmi; sama se vede jako nejvýše položený hostinec
  s apartmány východního Krušnohoří.
text:
  - >-
    Zinnwald-Georgenfeld je nejvyšší kout saské strany východního
    Krušnohoří a Lugsteinbaude v něm drží krajní pozici: stojí na
    Hochmoorwegu u naučné stezky Georgenfeldským vrchovištěm, pod
    skalnatým Lugsteinem, pár minut od hraničního přechodu do
    Cínovce. Sama se hlásí k titulu nejvýše položeného hostince
    s apartmány v této části hor.
  - >-
    Hospoda vaří přes oběd — v týdnu do čtyř, o víkendu do pěti,
    pondělí je zavírací den — a spí se v apartmánech s vlastním
    vařením. V zimě je bauda nástupem na běžkařské stopy kolem
    rašeliniště a hřebene, v létě výchozím bodem na Lugstein
    i do vrchoviště.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu baudy; polohu
    a kontakty nese OpenStreetMap. Otvírací doba se mezi webem
    a mapovými daty liší — bereme web, před cestou v týdnu ale
    raději zavolat. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
zdroje:
  - popis: >-
      Vlastní web baudy — Gasthaus s Ferienwohnungen, otvírací doba,
      adresa Hochmoorweg 28, kontakty, poloha u Georgenfelder
      Hochmoor (načteno 10. 8. 2026)
    url: https://www.lugsteinbaude.de/
  - popis: OpenStreetMap (GPS, provozovatel, otvírací doba v tagu; ODbL)
    url: https://www.openstreetmap.org/node/224565781
interniPoznamky: >-
  Povýšeno z data/kandidati/krusne-hory/lugsteinbaude.yaml rešerší
  (10. 8. 2026) — pátá položka fronty povyšování. Klíč zařazení:
  hostinec pro veřejnost na kraji hřebene u naučné stezky
  rašeliništěm; nocleh v apartmánech je vedlejší, klíč nese kuchyně.

  K OVĚŘENÍ (DATA-04): nadmořská výška (Lugstein se běžně uvádí
  ~890 m — NEDOLOŽENO pro baudu, nezapsáno); kapacita apartmánů;
  historie domu (web ji nevede). Superlativ „höchstgelegene
  Gasthaus mit Ferienwohnungen im Osterzgebirge" je tvrzení
  provozovatele — POZOR na sousedy: Zinnwaldbaude a Hotel
  Lugsteinhof jsou výš/níž? Nesrovnávat bez dokladu. Fotku dodá
  příští běh DATA-02.
