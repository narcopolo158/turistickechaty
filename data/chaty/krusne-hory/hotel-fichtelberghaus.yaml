# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1889
    udalost: >-
      Na vrcholu bylo otevřeno první Fichtelberghaus s hospodou
      a kamennou vyhlídkovou věží (stavba začala 1888); rozšiřovalo se
      1899 a znovu 1910. Předchůdci byli ještě starší — dřevěná
      vyhlídková stavba z 1845 a kamenný šestiboký Belvedere z 1847.
    zdroj: >-
      historie města Oberwiesenthal, stránka o Fichtelberghausu (čteno
      10. 8. 2026) — stavba 1888, otevření 1889, rozšíření 1899 a 1910;
      předchůdci 1845 a 1847.
  - rok: 1963
    udalost: >-
      Večer 25. února vypukl v domě požár a budova vyhořela až na
      základy.
    zdroj: >-
      historie města Oberwiesenthal (čteno 10. 8. 2026) — „vyhořela až
      na základy"; datum „Am Abend des 25. Februars 1963 brach im
      Fichtelberghaus ein Brand aus" tourmedia-service.de (čteno
      10. 8. 2026).
  - rok: 1967
    udalost: >-
      Otevřena poválečná novostavba se 42 m vysokou vyhlídkovou věží,
      hospodou, kavárnou a hotelem.
    zdroj: historie města Oberwiesenthal (čteno 10. 8. 2026)
  - rok: 1999
    udalost: >-
      Dne 18. 7. 1999 byla otevřena dnešní budova, stavěná ve stylu
      předchůdce z roku 1910 — 2 jednolůžkové a 26 dvoulůžkových
      pokojů, restaurace a sál.
    zdroj: >-
      historie města Oberwiesenthal (čteno 10. 8. 2026) — otevření
      „18.07.1999", pokoje, restaurace, sál; tourmedia-service.de
      k téže přestavbě: nová rozhledna měří 31 m.

zajimavosti:
  - text: >-
      Dům stojí na Fichtelbergu, nejvyšší hoře Saska — a jen o pár
      desítek metrů níž než protější Klínovec, nejvyšší vrchol celých
      Krušných hor na české straně.
    kategorie: vyska
    zdroj: >-
      „Der Fichtelberg ist mit 1214 m der höchste Berg Sachsens"
      (tourmedia-service.de, čteno 10. 8. 2026); hora 1214 m × dům
      „auf 1215 Metern" na vlastním webu — rozdíl metru mezi vrcholem
      a budovou se nesrovnává. Srovnání s Klínovcem (1244 m dle
      katalogového řádku HUT-0114) je aritmetika katalogových hodnot

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Dům na střeše Saska — na vrcholu Fichtelbergu v 1215 metrech stojí
  hostinec s vyhlídkovou věží nepřetržitě od roku 1889, dnešní budova
  z roku 1999 kopíruje styl té z roku 1910. Hotel je momentálně
  v rekonstrukci, restaurace Erzgebirgsstuben ale jede dál.
text:
  - >-
    Fichtelberghaus vystřídal na vrcholu nejvyšší saské hory několik
    podob: dřevěnou vyhlídku z roku 1845, kamenný Belvedere z 1847,
    první skutečný horský dům s hospodou a věží otevřený 1889 —
    a když ten roku 1963 vyhořel až na základy, novostavbu z 1967
    se dvaačtyřicetimetrovou věží. Dnešní budova je z roku 1999
    a záměrně se vrací ke stylu rozšířeného domu z roku 1910.
  - >-
    Kdo sem míří teď, musí počítat s omezením: hotel se v březnu 2026
    uzavřel kvůli rekonstrukci a nocležníky do prosince 2026 odkazuje
    na partnerský dům níž ve svahu. Restaurace Erzgebirgsstuben však
    podle vlastního webu zůstává otevřená — občerstvení na vrcholu
    tedy kolemjdoucí nenajde zavřené.
  - >-
    Před rekonstrukcí dům nabízel dva jednolůžkové a šestadvacet
    dvoulůžkových pokojů, restauraci a sál; jak bude vypadat nabídka
    po znovuotevření, zatím doloženo není. Věž novostavby z roku 1967
    měřila dvaačtyřicet metrů, ta dnešní je s jednatřiceti metry
    o poznání nižší — zato se dům vrátil k předválečné tváři.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu domu, z historie
    města Oberwiesenthal a z externího katalogu; polohu nese
    OpenStreetMap. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
