# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1894
    udalost: >-
      Na Kuhbergu byla postavena rozhledna Prinz-Georg-Turm —
      na ochoz vede 99 schodů a věž stojí hned vedle dnešního domu.
    zdroj: >-
      vlastní web hauskuhberg.de (čteno 10. 8. 2026) — věž „errichtet
      1894", 99 schodů. Historii samotného hostince (Unterkunftshaus
      u věže?) načtené prameny nevedou — nedomýšlí se; německá
      Wikipedie má článek Kuhberg (Stützengrün), ze sandboxu
      cache-only.
  - rok: 2023
    udalost: >-
      Dům prošel renovací a z Berggasthofu se stal Haus Kuhberg —
      jedenáct apartmánů se snídaní; klasický restaurační provoz
      v načtených pramenech od té doby doložen není.
    zdroj: >-
      vlastní web hauskuhberg.de (čteno 10. 8. 2026) — renovace 2023,
      koncept apartmánů se snídaní.

zajimavosti:
  - text: >-
      Kuhberg je nejzápadnější vyhlídkový kopec saského Krušnohoří
      na pomezí s Vogtlandem — a věž z roku 1894 nese jméno prince
      Georga. Devadesát devět schodů na ochoz je samo o sobě
      výletní cíl; dům pod věží dnes nabízí spíš klidné přespání
      než hospodský ruch.
    kategorie: jine
    zdroj: >-
      věž 1894 a 99 schodů: vlastní web hauskuhberg.de (čteno
      10. 8. 2026); pomezí s Vogtlandem: záznamy vogtland-tourismus.de
      (poi Kuhberg — stránka se nenačetla celá)

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Ubytovací dům u rozhledny Prinz-Georg-Turm na Kuhbergu (795 m) nad
  Stützengrünem — jedenáct apartmánů se snídaní tam, kde dřív běžel
  klasický Berggasthof. Věž s devadesáti devíti schody stojí hned
  za rohem.
text:
  - >-
    Kuhberg u Stützengrünu patří k vyhlídkovým kopcům západního
    Krušnohoří: rozhledna Prinz-Georg-Turm tu stojí od roku 1894
    a dům pod ní k ní patří odjakživa. Po renovaci v roce 2023 se
    z Berggasthofu stal Haus Kuhberg — jedenáct apartmánů, snídaně,
    nápoje a na přání studené platy.
  - >-
    Kdo čeká hospodu s obědem, měl by vědět, že klasický restaurační
    provoz tu od přestavby doložený není — dům míří na hosty, kteří
    chtějí klid, věž a výhledy; gastro katalogy starší záznam
    s vogtlandskou kuchyní stále vedou, před cestou proto raději
    zavolat.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu domu; polohu
    nese OpenStreetMap. Rozpor mezi dnešním konceptem a staršími
    katalogy přiznáváme. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
zdroje:
  - popis: >-
      Vlastní web domu — 795 m, 11 apartmánů se snídaní, renovace
      2023, věž 1894 (99 schodů), kontakty, provozovatel Simmel
      Carlsfeld GmbH (načteno 10. 8. 2026)
    url: https://www.hauskuhberg.de/
  - popis: >-
      schmausecke.de — starší záznam „Gasthaus, Restaurant und
      Gaststätte", vogtlandská kuchyně (čteno 10. 8. 2026; rozpor
      s dnešním konceptem přiznán)
    url: https://www.schmausecke.de/gastro/berghotel-kuhberg/
  - popis: OpenStreetMap (GPS, operátor; ODbL)
    url: https://www.openstreetmap.org/way/260482464
interniPoznamky: >-
  Povýšeno z data/kandidati/krusne-hory/berggasthof-kuhberg.yaml
  rešerší (10. 8. 2026) — desátá položka fronty povyšování. Klíč
  zařazení: obsluhovaný nocleh u výletního cíle (věž 1894)
  s turistickou minulostí Berggasthofu; kuchyne: ne po renovaci
  2023 — HRANIČNÍ případ jiného druhu než Kammbaude Neuhermsdorf
  (tam pronájem bez obsluhy → vyřazeno; tady apartmány SE SNÍDANÍ
  a doložená minulost hostince u věže → povýšeno, ať čtenář ví,
  co ho čeká). Kdyby Michal rozhodl jinak, snadno se stáhne.

  OSM URL way/260482464 ověřena gropem proti kandidátovi. NAZEV
