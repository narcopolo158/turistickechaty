# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Penzion s hospodou na okraji lesa v tisíci metrech na svahu
  Fichtelbergu — přes čtyřicet levných lůžek, čtyři lokály od
  Gaststube po zimní zahradu a letní pivní zahrada nad
  Oberwiesenthalem.
text:
  - >-
    Naturbaude Eschenhof drží klasickou krušnohorskou kombinaci:
    penzion s hospodou tam, kde končí město a začíná les. Stojí na
    svahu Fichtelbergu v tisíci metrech nad mořem, na kraji Kurortu
    Oberwiesenthal — lyžařské a běžkařské zázemí v zimě, nástup na
    hřebenové cesty v létě.
  - >-
    Spí se v pokojích pro dva a víc lidí a v jedné Ferienwohnung —
    dohromady přes čtyřicet lůžek; hospoda se čtyřmi lokály a pivní
    zahradou vaří od čtvrtka do neděle od poledne. Otvíračka se
    mění podle sezóny, před cestou se vyplatí mrknout na web.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu baudy; polohu
    nese OpenStreetMap. Historii domu web nevede. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
