      40+ lůžek, čtyři lokály + pivní zahrada, otvírací doba,
      telefon, provozovatelka (načteno 10. 8. 2026)
    url: https://www.naturbaude-eschenhof.de/
  - popis: OpenStreetMap (GPS, e-mail; ODbL)
