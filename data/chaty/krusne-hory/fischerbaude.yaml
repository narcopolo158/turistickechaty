# ── Historie ──────────────────────────────────────────────────────────────
milniky:
  - rok: 1901
    udalost: >-
      Usedlost v Holzhau koupili Paul a Clara Fischerovi — praprarodiče
      dnešních majitelů; vedle hospody provozovali i obuvnickou dílnu
      a krám s potravinami. V následujícím čtvrtstoletí dům přestavěli
      na rodinný penzion; roku 1929 převzal podnik syn Edwin.
    zdroj: >-
      vlastní web, stránka historie (čteno 10. 8. 2026) — koupě 1901
      („die Urgroßeltern der heutigen Besitzer"), dílna a krám,
      přestavba na penzion, Edwin Fischer 1929.
  - rok: 1974
    udalost: >-
      Za války dům sloužil dětem z bombardovaných měst, v NDR spadal
      pod rekreace FDGB a roku 1974 ho převzal VEB Narva
      Brand-Erbisdorf jako podnikovou zotavovnu; po roce 1989 se
      zavřel.
    zdroj: >-
      vlastní web, stránka historie (čteno 10. 8. 2026) — válečná
      ubytovna, FDGB, VEB Narva 1974, uzavření po 1989.
  - rok: 1995
    udalost: >-
      Po obnově a znovuotevření Helgou Plathovou (1993) převzali dům
      1. srpna 1995 dnešní majitelé Udo Weise a Ulf-U. Plath —
      potomci zakladatelů ve čtvrté generaci.
    zdroj: >-
      vlastní web, stránka historie (čteno 10. 8. 2026) —
      znovuotevření 1993, převzetí 1. 8. 1995, čtvrtá generace.

zajimavosti:
  - text: >-
      Fischerbaude je vzácný případ saské baudy, která se po celém
      dvacátém století — přes válku, FDGB i podnikovou rekreaci —
      vrátila potomkům zakladatelů: dnešní provozovatelé jsou čtvrtá
      generace rodiny, která dům koupila v roce 1901.
    kategorie: stari
    zdroj: >-
      vlastní web, stránka historie „Tradition & Geschichte im
      Erzgebirge seit 1901" (čteno 10. 8. 2026)

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Rodinná bauda v Holzhau pod hřebenem východního Krušnohoří —
  hospoda s pivní zahradou a penzion, které od roku 1901 drží jedna
  rodina, dnes ve čtvrté generaci. Kuchyně poctivě saská: domácí,
  regionální a vydatná.
text:
  - >-
    Fischerbaude začala roku 1901 jako hospoda s obuvnickou dílnou
    a krámem — Paul a Clara Fischerovi ji během čtvrtstoletí
    přestavěli na rodinný penzion a jejich potomci ho vedou dodnes.
    Dvacáté století s domem zamávalo jako s celým pohraničím: válečná
    ubytovna, odborářská rekreace FDGB, podniková zotavovna — a po
    převratu návrat rodině, která od roku 1995 hospodaří ve čtvrté
    generaci.
  - >-
    Hospoda s pivní zahradou jede pro veřejnost šest dní v týdnu
    (pondělí je zavírací den) a kuchyně se hlásí k domácímu,
    regionálnímu a vydatnému vaření; spí se v pokojích penzionu.
    Holzhau je nástupní bod hřebenových běžkařských i pěších tras
    kolem Čihadla a hraničního přechodu do Českého Jiřetína.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu baudy včetně
    stránky historie; polohu nese OpenStreetMap. Kapacita penzionu
    číslem doložená není. Redakce nic neověřila vlastním dotazem ani
    návštěvou.
zdroje:
  - popis: >-
      Vlastní web baudy — historie od 1901 (čtyři generace, FDGB,
      VEB Narva, návrat 1993/1995), otvírací doba hospody, kuchyně,
      kontakty (načteno 10. 8. 2026)
    url: https://www.fischerbaude.de/
  - popis: OpenStreetMap (GPS, provozovatel, otvírací doba v tagu; ODbL)
    url: https://www.openstreetmap.org/node/13786630667
interniPoznamky: >-
  Povýšeno z data/kandidati/krusne-hory/fischerbaude.yaml rešerší
  (10. 8. 2026) — první položka fronty povyšování ze čtecího průchodu.
  Klíč zařazení: veřejná hospoda s penzionem na nástupu hřebenových
  tras, rodinná kontinuita od 1901 — turistická minulost doložená
