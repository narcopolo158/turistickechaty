zajimavosti:
  - text: >-
      Hned vedle hostince stojí kamenná rozhledna z roku 1860 —
      a věžová tradice Auersbergu je ještě starší: první dřevěná věž
      tu stála už v 17. století jako součást loveckého revíru saských
      kurfiřtů. Ochoz nabízí kruhový rozhled až do Vogtlandu
      a do českého Krušnohoří.
    kategorie: jine
    zdroj: >-
      web města Eibenstock (čteno 10. 8. 2026) — kamenná rozhledna
      1860, dřevěná věž „již v 17. století", výhled „herrliche
      Rundsicht bis ins Vogtland und das böhmische Erzgebirge"

# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Horský hostinec s penzionem na vrcholu Auersbergu (1018 m) u
  Eibenstocku, hned vedle kamenné rozhledny z roku 1860 — celoroční
  zastávka na západním konci krušnohorského hřebene, kde se z ochozu
  vidí až do Vogtlandu a do Čech.
text:
  - >-
    Auersberg je se svými 1018 metry jedním z mála krušnohorských
    vrcholů nad tisícovkou na saské straně — a jako správný saský
    kopec má na vrcholu dvojici, která k sobě patří: kamennou
    rozhlednu z roku 1860 a horský hostinec. Věžová tradice je tu
    ještě delší, první dřevěná věž stála na Auersbergu už
    v sedmnáctém století za saských kurfiřtů.
  - >-
    Hostinec funguje celoročně jako restaurace s penzionem; kolik má
    lůžek, naše podklady nevedou, a vlastní stránky se při rešerši
    nenačetly — před cestou je proto lepší zavolat. Kdo nahoru míří
    pěšky, má Auersberg jako přirozený cíl okruhů z Eibenstocku
    i zastávku na hřebenových trasách západního Krušnohoří.
  - >-
    Údaje na téhle stránce pocházejí z externího katalogu, z webu
    města Eibenstock a z OpenStreetMap; přesnost je tomu úměrná
    a rozhodně nenahrazuje ověření u hostince. Redakce nic neověřila
    vlastním dotazem ani návštěvou.
