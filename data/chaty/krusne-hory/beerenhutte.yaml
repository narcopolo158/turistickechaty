# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Srubová občerstvovací bauda na trasách u Zinnwald-Georgenfeldu —
  víkendový bufet rodiny Beerových u okruhů kolem Georgenfeldského
  rašeliniště. Otevřeno o sobotách, nedělích a svátcích od
  jedenácti do pěti, o prázdninách podle počasí.
text:
  - >-
    Na hraničním hřebeni u Cínovce se chodí kolem rašeliniště —
    a Beerenhütte je srub, kde se ten okruh láme na svačinu.
    Blockhausbaude rodiny Beerových otvírá o víkendech a svátcích
    a v sezóně podle počasí; kdo jde v týdnu, koukne předem na web
    nebo Google Maps.
  - >-
    Nocleh tu není a bauda ani nic jiného nepředstírá: je to poctivý
    bufet pro běžkaře, pěší a cyklisty od jedenácti do pěti. Kolem
    navazují stopy k Lugsteinbaude, biatlonové aréně a přes hranici
    na Cínovec.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu baudy
    a z katalogu Altenbergu; polohu a kontakty nese OpenStreetMap.
    Redakce nic neověřila vlastním dotazem ani návštěvou.
zdroje:
