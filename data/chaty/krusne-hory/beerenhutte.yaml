zajimavosti:
  - text: >-
      Beerenhütte je bauda víkendová a povětrnostní: srub u stop
      kolem Georgenfeldského rašeliniště otvírá o sobotách, nedělích
      a svátcích — a o prázdninách prostě podle počasí. Jméno nese
      po provozovatelích, rodině Beerových; s borůvkami (Beeren) je
      to slovní hříčka, kterou pramen nerozsuzuje.
    kategorie: jine
    zdroj: >-
      víkendový a povětrnostní režim: vlastní web (čteno
      10. 8. 2026); rodina Beer: OSM operator + Activcamp Beer GbR
