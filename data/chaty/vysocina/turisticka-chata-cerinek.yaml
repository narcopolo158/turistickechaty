# ── Obsah ─────────────────────────────────────────────────────────────────
perex: >-
  Chata KČT pod vrcholem Čeřínku (761 m) západně od Jihlavy — od
  roku 1923 základna pěších i lyžařů na Křemešnické vrchovině.
  Pětašedesát lůžek, restaurace s českou klasikou, kemp na louce
  a sto metrů na sjezdovku; v nájmu ji má Jurda z Divokýho Billa.
text:
  - >-
    Čeřínek je chatová stálice Vysočiny: turistická chata tu stojí
    od roku 1923 a dodnes patří klubovým turistům — dnešní budova
    je z roku 1988. Leží deset kilometrů západně od Jihlavy, sto
    metrů od sjezdovky, a kolem se rozbíhají značky po zalesněných
    hřbetech Křemešnické vrchoviny.
  - >-
    Spí se v pětašedesáti lůžkách v pokojích pro dva až šest lidí,
    v létě se dá stanovat na louce u chaty. Restaurace vaří českou
    klasiku od středy do neděle a pro ubytované bez omezení
    otvíračky; provoz vede společnost kolem Jurdy z kapely Divokej
    Bill.
  - >-
    Údaje na téhle stránce pocházejí z vlastního webu chaty
    a z jihlavského portálu DoJihlavy.cz. Počet lůžek se mezi
    prameny mírně liší — zapsali jsme nižší číslo. Redakce nic
    neověřila vlastním dotazem ani návštěvou.
zdroje:
  - popis: >-
      Vlastní web chaty — GPS, adresa, kapacita „cca 70 lůžek",
