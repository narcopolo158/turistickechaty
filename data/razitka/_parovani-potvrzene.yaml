# DATA-05 — redakčně POTVRZENÉ páry chata ↔ razítko na razitkuj.cz.
#
# Proč tenhle soubor existuje: párování je jen JMENNÁ shoda nad celostátním
# checklistem — a jméno není přiřazení (jmenovci existují i uvnitř Krkonoš,
# viz docs/DATA-17-jmenovci.md; „Portáš" není „Portášky"). Otisky se proto
# stahují VÝHRADNĚ u párů potvrzených tady (skript data05-razitkuj-otisky.ts
# nepotvrzené páry přeskočí a jen je vypíše). Pár potvrzuje redakce po
# kontrole detailu razítka (obrázek/kontext na razitkuj.cz) — s poznámkou,
# čím je přiřazení doloženo.
#
# `nesouvisi:` je opak — páry, u kterých kontrola prokázala, že jde o CIZÍ
# objekt téhož/podobného jména; párování je pak přestane nabízet (vzor
# data/kandidati/_vyrazeno.yaml z DATA-01).

