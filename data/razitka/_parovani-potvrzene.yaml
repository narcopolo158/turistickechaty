  - slug: chatka-akt-towarzystwa-bazynowego
    url: http://www.razitkuj.cz/misto-chatka-akt-na-pietraszonce/1
    poznamka: >-
      Chatka AKT na Pietraszonce = Istebna, Beskid Śląski (spolek AKT Watra
      Gliwice) — shodně titulky akt.gliwice.pl, pl.wikipedia a slaskie.travel,
      checked 2026-07-28; naše chatka AKT Towarzystwa Bażynowego je krkonošská
      (GPS z OSM) — cizí objekt, shoda vznikla přes alias „Chatka AKT"
  - slug: bouda-tetrevi-sedlo
    url: http://www.razitkuj.cz/misto-tetrev/1
    poznamka: >-
      NESOUVISÍ — rozhodl Michal 6. 8. 2026 po přečtení detailu na
      razitkuj.cz: „Horskou chatu Tetřev už bohužel nenajdeme v prostoru
      mezi vrcholem Velký Polom (1067 m n. m.) a vrcholem Kostelky
      (953 m n. m.)…“ — razítko patří zaniklé horské chatě Tetřev
      v BESKYDECH, ne naší Boudě Tetřeví sedlo na Ještědském hřbetu.
      Checklist vede zvlášť i „Tetřeví boudy“ (krkonošské) — tři různé
      objekty, žádný pár. Až se založí oblast Beskydy, razítko se může
      hodit tam (chata je dle textu zaniklá — kandidát pro Atlas
      zaniklých).
